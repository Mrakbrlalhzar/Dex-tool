name: Fix Anonymous Class in DEX

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Regenerate DEX with ALL classes
        run: |
          set -e
          rm -rf /tmp/dex
          mkdir -p /tmp/dex

          D8=$(find $ANDROID_HOME/build-tools -name d8 | sort -V | tail -1)
          echo "Using d8: $D8"

          echo "=== Compiling Helper.java ==="
          javac -source 8 -target 8 \
                -cp $ANDROID_HOME/platforms/android-34/android.jar \
                -d /tmp/dex app/src/main/java/com/menu/imgui/Helper.java

          echo "=== .class files produced by javac ==="
          find /tmp/dex -name "*.class" | sort

          # VERIFY: Helper$1.class exists (the anonymous Renderer)
          test -f "/tmp/dex/com/menu/imgui/Helper\$1.class" \
            || (echo "FATAL: Helper\$1.class missing" && exit 1)
          echo "✓ Helper\$1.class exists"

          echo "=== Running d8 on ALL .class files ==="
          # THE FIX: pass all classes, plus android.jar as library
          $D8 --min-api 26 \
              --lib $ANDROID_HOME/platforms/android-34/android.jar \
              --output /tmp/dex \
              $(find /tmp/dex -name "*.class")

          echo "=== DEX output ==="
          ls -la /tmp/dex/*.dex

          # VERIFY: Helper$1 is in the DEX
          if grep -aF 'Helper$1' /tmp/dex/classes.dex > /dev/null; then
            echo "✓ Helper\$1 is present in classes.dex"
          else
            echo "FATAL: Helper\$1 not found in DEX"
            exit 1
          fi

          if grep -aF 'GLSurfaceView$Renderer' /tmp/dex/classes.dex > /dev/null; then
            echo "✓ Renderer interface reference present"
          else
            echo "FATAL: Renderer interface not referenced"
            exit 1
          fi

          echo "=== Generating dex_data.h ==="
          xxd -i -n imgui_dex /tmp/dex/classes.dex \
            | sed 's/unsigned char/const unsigned char/' \
            > app/src/main/cpp/tool/dex_data.h

          grep -q "imgui_dex\[\]" app/src/main/cpp/tool/dex_data.h \
            && echo "✓ imgui_dex[] declared"
          wc -c app/src/main/cpp/tool/dex_data.h

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Ensure Gradle Wrapper
        run: |
          if [ ! -s gradlew ]; then gradle wrapper --gradle-version 8.5; fi
          chmod +x gradlew

      - name: Build
        run: |
          rm -rf app/.cxx app/build .gradle
          ./gradlew :app:assembleDebug --no-build-cache --stacktrace

      - name: Extract libtool.so
        run: |
          mkdir -p /tmp/so-out
          find app/build -name "libtool.so" -exec cp {} /tmp/so-out/ \;
          ls -la /tmp/so-out/

      - name: Upload .so
        uses: actions/upload-artifact@v4
        with:
          name: libtool-fixed
          path: /tmp/so-out/libtool.so

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: imgui-tool-test-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Commit
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "fix: include Helper\$1 in DEX (d8 all .class files) [skip ci]"
          git push
