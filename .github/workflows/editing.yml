name: "Frida GumJS Slim (Source)"

on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pip ninja-build pkg-config libglib2.0-dev unzip curl zipalign xxd
          pip3 install --quiet --upgrade pip
          pip3 install --quiet meson
          wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux.zip -O /tmp/ndk-r25c.zip
          unzip -q /tmp/ndk-r25c.zip -d /tmp/
          echo "NDK_PATH=/tmp/android-ndk-r25c" >> $GITHUB_ENV
          curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
          sudo apt-get install -y nodejs

      - name: Download Prebuilt Dobby (from 3equals3/DobbyHook)
        run: |
          set -e
          BASE="https://raw.githubusercontent.com/3equals3/DobbyHook/main"
          mkdir -p /tmp/dobby-prebuilt/arm64-v8a
          mkdir -p /tmp/dobby-prebuilt/armeabi-v7a
          echo "=== Downloading arm64-v8a/libdobby.a ==="
          wget -q "$BASE/arm64-v8a/libdobby.a" -O /tmp/dobby-prebuilt/arm64-v8a/libdobby.a
          ls -lah /tmp/dobby-prebuilt/arm64-v8a/libdobby.a
          echo "=== Downloading armeabi-v7a/libdobby.a ==="
          wget -q "$BASE/armeabi-v7a/libdobby.a" -O /tmp/dobby-prebuilt/armeabi-v7a/libdobby.a
          ls -lah /tmp/dobby-prebuilt/armeabi-v7a/libdobby.a
          echo "=== Downloading Dobby.h ==="
          wget -q "$BASE/Dobby.h" -O /tmp/dobby-prebuilt/Dobby.h
          ls -lah /tmp/dobby-prebuilt/Dobby.h
          echo "=== Verify ELF magic ==="
          file /tmp/dobby-prebuilt/arm64-v8a/libdobby.a || true
          file /tmp/dobby-prebuilt/armeabi-v7a/libdobby.a || true

      - name: Stage Dobby into project
        run: |
          set -e
          mkdir -p app/src/main/cpp/Include/Dobby/lib/arm64-v8a
          mkdir -p app/src/main/cpp/Include/Dobby/lib/armeabi-v7a
          mkdir -p app/src/main/cpp/Include/Dobby/include
          cp /tmp/dobby-prebuilt/arm64-v8a/libdobby.a  app/src/main/cpp/Include/Dobby/lib/arm64-v8a/libdobby.a
          cp /tmp/dobby-prebuilt/armeabi-v7a/libdobby.a app/src/main/cpp/Include/Dobby/lib/armeabi-v7a/libdobby.a
          cp /tmp/dobby-prebuilt/Dobby.h app/src/main/cpp/Include/Dobby/include/dobby.h
          echo "=== Staged Dobby ==="
          find app/src/main/cpp/Include/Dobby -maxdepth 3 -type f | sort

      - name: Download Frida devkit
        run: |
          set -e
          V=17.1.0
          B="https://github.com/frida/frida/releases/download/$V"
          wget -q "$B/frida-gumjs-devkit-$V-android-arm64.tar.xz" -O /tmp/dk64.tar.xz
          mkdir -p /tmp/dk64 && tar -xf /tmp/dk64.tar.xz -C /tmp/dk64
          wget -q "$B/frida-gumjs-devkit-$V-android-arm.tar.xz" -O /tmp/dk32.tar.xz
          mkdir -p /tmp/dk32 && tar -xf /tmp/dk32.tar.xz -C /tmp/dk32

      - name: Clone frida-gum
        run: |
          git clone --recursive --depth 1 --branch 17.1.0 https://github.com/frida/frida-gum.git /tmp/frida-gum
          cd /tmp/frida-gum
          sed -i '1i void glib_init(void);' bindings/gumjs/gumquickcompile.c

      - name: Build arm64
        run: |
          set -o pipefail
          cd /tmp/frida-gum
          export ANDROID_NDK_ROOT="$NDK_PATH"
          rm -rf build
          ./configure --host=android-arm64 -- -Ddevkits=gum,gumjs -Dgumjs=enabled -Dquickjs=enabled -Dv8=disabled -Ddatabase=disabled -Dtests=disabled -Ddiet=true -Db_ndebug=true -Ddefault_library=static -Dlibunwind:minidebuginfo=disabled -Dlibdwarf:decompression=false 2>&1 | tee /tmp/a64.log
          [ ${PIPESTATUS[0]} -ne 0 ] && { tail -60 /tmp/a64.log; exit 1; }
          make -j$(nproc) 2>&1 | tee -a /tmp/a64.log
          LIB=$(find build -name "libfrida-gumjs.a" | head -1 || true)
          [ -z "$LIB" ] && LIB=$(find build -path "*devkit*" -name "libfrida-gumjs*.a" ! -name "*inspector*" | head -1 || true)
          [ -z "$LIB" ] && { echo "NO_LIB"; exit 1; }
          D=/tmp/frida-built/arm64-v8a
          rm -rf "$D"; mkdir -p "$D/lib" "$D/include"
          cp -v "$LIB" "$D/lib/libfrida-gumjs.a"
          cp -v "$(find /tmp/dk64 -name 'frida-gumjs.h' | head -1)" "$D/include/frida-gumjs.h"
          G=$(find /tmp/dk64 -name "frida-gum.h" | head -1 || true)
          if [ -z "$G" ]; then G=$(find /tmp/frida-gum/build/gum/devkit -name "frida-gum.h" | head -1 || true); fi
          if [ -n "$G" ]; then cp -v "$G" "$D/include/frida-gum.h"; fi
          GLIB_DIR=$(find /tmp/dk64 -type d -name 'glib-2.0' 2>/dev/null | head -1 || true)
          if [ -z "$GLIB_DIR" ]; then GLIB_DIR=$(find /tmp/frida-gum/build/gum/devkit -type d -name 'glib-2.0' 2>/dev/null | head -1 || true); fi
          if [ -n "$GLIB_DIR" ]; then cp -rv "$GLIB_DIR" "$D/include/glib-2.0"; fi
          ls -lah "$D/lib/"

      - name: Build armv7
        run: |
          set -o pipefail
          cd /tmp/frida-gum
          export ANDROID_NDK_ROOT="$NDK_PATH"
          rm -rf build
          ./configure --host=android-arm -- -Ddevkits=gum,gumjs -Dgumjs=enabled -Dquickjs=enabled -Dv8=disabled -Ddatabase=disabled -Dtests=disabled -Ddiet=true -Db_ndebug=true -Ddefault_library=static -Dlibunwind:minidebuginfo=disabled -Dlibdwarf:decompression=false 2>&1 | tee /tmp/a32.log
          [ ${PIPESTATUS[0]} -ne 0 ] && { tail -60 /tmp/a32.log; exit 1; }
          make -j$(nproc) 2>&1 | tee -a /tmp/a32.log
          LIB=$(find build -name "libfrida-gumjs.a" | head -1 || true)
          [ -z "$LIB" ] && LIB=$(find build -path "*devkit*" -name "libfrida-gumjs*.a" ! -name "*inspector*" | head -1 || true)
          [ -z "$LIB" ] && { echo "NO_LIB"; exit 1; }
          D=/tmp/frida-built/armeabi-v7a
          rm -rf "$D"; mkdir -p "$D/lib" "$D/include"
          cp -v "$LIB" "$D/lib/libfrida-gumjs.a"
          cp -v "$(find /tmp/dk32 -name 'frida-gumjs.h' | head -1)" "$D/include/frida-gumjs.h"
          G=$(find /tmp/dk32 -name "frida-gum.h" | head -1 || true)
          if [ -z "$G" ]; then G=$(find /tmp/frida-gum/build/gum/devkit -name "frida-gum.h" | head -1 || true); fi
          if [ -n "$G" ]; then cp -v "$G" "$D/include/frida-gum.h"; fi
          GLIB_DIR=$(find /tmp/dk32 -type d -name 'glib-2.0' 2>/dev/null | head -1 || true)
          if [ -z "$GLIB_DIR" ]; then GLIB_DIR=$(find /tmp/frida-gum/build/gum/devkit -type d -name 'glib-2.0' 2>/dev/null | head -1 || true); fi
          if [ -n "$GLIB_DIR" ]; then cp -rv "$GLIB_DIR" "$D/include/glib-2.0"; fi
          ls -lah "$D/lib/"

      - name: Write Include/Log.h (crash handler + file logger)
        run: |
          mkdir -p app/src/main/cpp/Include
          cat > app/src/main/cpp/Include/Log.h <<'LOGEOF'
          #pragma once
          #include <cstdio>
          #include <cstring>
          #include <cstdarg>
          #include <cstdint>
          #include <cstdlib>
          #include <fcntl.h>
          #include <unistd.h>
          #include <signal.h>
          #include <dlfcn.h>
          #include <unwind.h>
          #include <sys/stat.h>
          #include <android/log.h>

          static char g_log_path[512] = {0};

          static inline void flog(const char* fmt, ...) {
              char buf[1024];
              va_list ap;
              va_start(ap, fmt);
              vsnprintf(buf, sizeof(buf), fmt, ap);
              va_end(ap);
              __android_log_print(ANDROID_LOG_INFO, "DexTool", "%s", buf);
              if (g_log_path[0]) {
                  int fd = open(g_log_path, O_WRONLY | O_APPEND | O_CREAT, 0666);
                  if (fd >= 0) {
                      write(fd, buf, strlen(buf));
                      write(fd, "\n", 1);
                      close(fd);
                  }
              }
          }

          static inline const char* sig_name(int sig) {
              switch (sig) {
                  case SIGSEGV: return "SIGSEGV";
                  case SIGABRT: return "SIGABRT";
                  case SIGBUS:  return "SIGBUS";
                  case SIGILL:  return "SIGILL";
                  case SIGFPE:  return "SIGFPE";
                  case SIGTRAP: return "SIGTRAP";
                  default:      return "SIG?";
              }
          }

          struct BtState { void** cur; void** end; };
          static _Unwind_Reason_Code bt_cb(struct _Unwind_Context* ctx, void* arg) {
              BtState* s = (BtState*)arg;
              uintptr_t pc = _Unwind_GetIP(ctx);
              if (pc) {
                  if (s->cur == s->end) return _URC_END_OF_STACK;
                  *s->cur++ = (void*)pc;
              }
              return _URC_NO_REASON;
          }

          static void crash_sig(int sig, siginfo_t* si, void*) {
              char buf[1024];
              int len = snprintf(buf, sizeof(buf),
                  "\n=== CRASH sig=%d (%s) addr=%p ===\n",
                  sig, sig_name(sig), si ? si->si_addr : nullptr);
              int fd = -1;
              if (g_log_path[0]) {
                  fd = open(g_log_path, O_WRONLY | O_APPEND | O_CREAT, 0666);
              }
              if (fd < 0) {
                  fd = open("/sdcard/Android/data/com.example.tool/files/DexTool.log",
                            O_WRONLY | O_APPEND | O_CREAT, 0666);
              }
              if (fd < 0) {
                  fd = open("/data/local/tmp/DexTool.log",
                            O_WRONLY | O_APPEND | O_CREAT, 0666);
              }
              if (fd >= 0) {
                  write(fd, buf, len);
                  void* frames[64];
                  BtState st = { frames, frames + 64 };
                  _Unwind_Backtrace(bt_cb, &st);
                  size_t n = (size_t)(st.cur - frames);
                  for (size_t i = 0; i < n; i++) {
                      Dl_info info;
                      if (dladdr(frames[i], &info) && info.dli_sname) {
                          len = snprintf(buf, sizeof(buf), "  #%zu %p %s+%td (%s)\n",
                              i, frames[i], info.dli_sname,
                              (char*)frames[i] - (char*)info.dli_saddr,
                              info.dli_fname ? info.dli_fname : "?");
                      } else {
                          len = snprintf(buf, sizeof(buf), "  #%zu %p\n", i, frames[i]);
                      }
                      write(fd, buf, len);
                  }
                  write(fd, "=== END CRASH ===\n", 18);
                  close(fd);
              }
              __android_log_print(ANDROID_LOG_FATAL, "DexTool",
                  "CRASH sig=%d addr=%p", sig, si ? si->si_addr : nullptr);
              signal(sig, SIG_DFL);
              raise(sig);
          }

          static inline void install_crash_handler() {
              struct sigaction sa;
              memset(&sa, 0, sizeof(sa));
              sa.sa_sigaction = crash_sig;
              sa.sa_flags = SA_SIGINFO;
              sigaction(SIGSEGV, &sa, nullptr);
              sigaction(SIGABRT, &sa, nullptr);
              sigaction(SIGBUS,  &sa, nullptr);
              sigaction(SIGILL,  &sa, nullptr);
              sigaction(SIGFPE,  &sa, nullptr);
              sigaction(SIGTRAP, &sa, nullptr);
          }
          LOGEOF

      - name: Write Include/ImGui.h (with step logging)
        run: |
          cat > app/src/main/cpp/Include/ImGui.h <<'IMGUIEOF'
          #pragma once
          #include <EGL/egl.h>
          #include <android/log.h>
          #include <pthread.h>
          #include <unistd.h>
          #include <cstring>
          #include "imgui.h"
          #include "imgui_impl_opengl3.h"
          #include "imgui_impl_android.h"
          #include "Dobby/include/dobby.h"
          #include "Log.h"

          using swapbuffers_orig = EGLBoolean (*)(EGLDisplay, EGLSurface);
          static swapbuffers_orig o_swapbuffers = nullptr;
          static bool imgui_sw_initialized = false;
          static void (*menuAddress)() = nullptr;
          static int g_frame_count = 0;

          static bool isLibraryLoaded(const char *name) {
              FILE *fp = fopen("/proc/self/maps", "rt");
              if (!fp) return false;
              char line[512];
              while (fgets(line, sizeof(line), fp)) {
                  if (strstr(line, name)) { fclose(fp); return true; }
              }
              fclose(fp);
              return false;
          }

          static EGLBoolean swapbuffers_hook(EGLDisplay dpy, EGLSurface surf) {
              g_frame_count++;
              bool log_frame = (g_frame_count <= 10) || (g_frame_count % 60 == 0);
              if (log_frame) flog("[swap] frame %d enter", g_frame_count);
              EGLint w = 0, h = 0;
              eglQuerySurface(dpy, surf, EGL_WIDTH, &w);
              eglQuerySurface(dpy, surf, EGL_HEIGHT, &h);
              if (!imgui_sw_initialized) {
                  flog("[swap] FIRST FRAME - init ImGui (w=%d h=%d)", w, h);
                  ImGui::CreateContext();
                  flog("[swap] CreateContext OK");
                  ImGuiIO& io0 = ImGui::GetIO();
                  io0.DisplaySize = ImVec2((float)w, (float)h);
                  io0.IniFilename = nullptr;
                  ImGui_ImplAndroid_Init(nullptr);
                  flog("[swap] ImGui_ImplAndroid_Init OK");
                  ImGui_ImplOpenGL3_Init("#version 300 es");
                  flog("[swap] ImGui_ImplOpenGL3_Init OK");
                  imgui_sw_initialized = true;
                  flog("[swap] ImGui init done");
              }
              ImGuiIO& io = ImGui::GetIO();
              io.DisplaySize = ImVec2((float)w, (float)h);
              io.DeltaTime = 1.0f / 60.0f;
              ImGui_ImplOpenGL3_NewFrame();
              if (log_frame) flog("[swap] OpenGL3_NewFrame OK");
              ImGui::NewFrame();
              if (log_frame) flog("[swap] NewFrame OK");
              if (menuAddress) {
                  menuAddress();
                  if (log_frame) flog("[swap] DrawMenu OK");
              }
              ImGui::Render();
              if (log_frame) flog("[swap] Render OK");
              ImGui_ImplOpenGL3_RenderDrawData(ImGui::GetDrawData());
              if (log_frame) flog("[swap] RenderDrawData OK");
              if (!o_swapbuffers) {
                  flog("[swap] ERROR: o_swapbuffers is NULL!");
                  return EGL_FALSE;
              }
              return o_swapbuffers(dpy, surf);
          }

          void *initModMenu(void *menu_addr) {
              menuAddress = (void (*)())menu_addr;
              flog("[init] waiting for libEGL.so");
              while (!isLibraryLoaded("libEGL.so")) sleep(1);
              flog("[init] libEGL.so loaded, resolving eglSwapBuffers");
              auto swapBuffers = (uintptr_t)DobbySymbolResolver("libEGL.so", "eglSwapBuffers");
              flog("[init] eglSwapBuffers addr=%p", (void*)swapBuffers);
              if (!swapBuffers) {
                  flog("[init] ERROR: could not resolve eglSwapBuffers");
                  return nullptr;
              }
              int rc = DobbyHook((void*)swapBuffers, (void*)swapbuffers_hook, (void**)&o_swapbuffers);
              flog("[init] DobbyHook rc=%d orig=%p", rc, (void*)o_swapbuffers);
              if (rc != 0 || !o_swapbuffers) {
                  flog("[init] ERROR: DobbyHook FAILED rc=%d orig=%p", rc, (void*)o_swapbuffers);
                  return nullptr;
              }
              flog("[init] eglSwapBuffers hooked OK");
              return nullptr;
          }
          IMGUIEOF

      - name: Write Include/Input.h (with logging)
        run: |
          cat > app/src/main/cpp/Include/Input.h <<'INPUTEOF'
          #pragma once
          #include <android/input.h>
          #include <cstdint>
          #include "Dobby/include/dobby.h"
          #include "Log.h"

          using Input_orig = void (*)(void*, void*, void*);
          static Input_orig o_input = nullptr;
          static void input_hook(void* thiz, void* ex_ab, void* ex_ac) {
              if (o_input) o_input(thiz, ex_ab, ex_ac);
              ImGui_ImplAndroid_HandleInputEvent((AInputEvent*)thiz);
          }

          using Consume_orig = int32_t (*)(void*, void*, bool, long, uint32_t*, AInputEvent**);
          static Consume_orig o_consume = nullptr;
          static int32_t consume_hook(void* thiz, void* factory, bool raw, long seq, uint32_t* flags, AInputEvent** event) {
              int32_t ret = o_consume ? o_consume(thiz, factory, raw, seq, flags, event) : -1;
              if (ret == 0 && event && *event) ImGui_ImplAndroid_HandleInputEvent(*event);
              return ret;
          }

          static void hookInput() {
              flog("[input] hooking input (legacy path)");
              void* sym = DobbySymbolResolver("libinput.so",
                  "_ZN7android13InputConsumer21initializeMotionEventEPNS_11MotionEventEPKNS_12InputMessageE");
              flog("[input] legacy symbol=%p", sym);
              if (sym) {
                  int rc = DobbyHook(sym, (void*)input_hook, (void**)&o_input);
                  flog("[input] legacy DobbyHook rc=%d", rc);
                  if (rc == 0) { flog("[input] legacy hook OK"); return; }
              }
              flog("[input] trying consume (Android 15+)");
              sym = DobbySymbolResolver("libinput.so",
                  "_ZN7android13InputConsumer7consumeEPNS_26InputEventFactoryInterfaceEblPjPPNS_10InputEventE");
              flog("[input] consume symbol=%p", sym);
              if (sym) {
                  int rc = DobbyHook(sym, (void*)consume_hook, (void**)&o_consume);
                  flog("[input] consume DobbyHook rc=%d", rc);
                  if (rc == 0) { flog("[input] consume hook OK"); return; }
              }
              flog("[input] WARN: no input hook installed");
          }
          INPUTEOF

      - name: Patch native-lib.cpp (with crash handler + step logging)
        run: |
          python3 - <<'PYEOF'
          import re, pathlib, textwrap
          p = pathlib.Path("app/src/main/cpp/tool/native-lib.cpp")
          s = p.read_text()

          def rm_method(src, pat):
              n = 0
              while True:
                  m = re.search(pat, src)
                  if not m: break
                  i = src.index('{', m.end()-1); d=0; e=-1
                  for k in range(i, len(src)):
                      if src[k]=='{': d+=1
                      elif src[k]=='}':
                          d-=1
                          if d==0: e=k+1; break
                  if e<0: break
                  start = m.start()
                  ext = src.rfind('extern "C"', max(0, m.start()-300), m.start())
                  if ext >= 0 and ext < start: start = ext
                  while e < len(src) and src[e] in '\n \t': e += 1
                  src = src[:start] + src[e:]
                  n += 1
              return src, n

          s, _ = rm_method(s, r'(?:static\s+)?void\s+notifyMenuOpen\s*\([^)]*\)\s*\{')
          s, _ = rm_method(s, r'void\s+DrawMenu\s*\([^)]*\)\s*\{')
          s, _ = rm_method(s, r'JNI_OnLoad\s*\([^)]*\)\s*\{')

          for pat in [
              r'(?m)^[ \t]*(?:static\s+)?JavaVM\s*\*\s+gVM\s*=\s*nullptr\s*;\s*\n?',
              r'(?m)^[ \t]*(?:static\s+)?JavaVM\s*\*\s+g_jvm\s*=\s*nullptr\s*;\s*\n?',
              r'(?m)^[ \t]*(?:static\s+)?bool\s+g_menuVisible\s*=\s*true\s*;\s*\n?',
              r'(?m)^[ \t]*(?:static\s+)?bool\s+gMenuOpen\s*=\s*false\s*;\s*\n?',
          ]:
              s = re.sub(pat, '', s)

          s = s.replace('#include "Include/ImGui.h"', '')
          s = s.replace('#include "Include/Input.h"', '')
          s = s.replace('#include "ImGui.h"', '')
          s = s.replace('#include "Input.h"', '')
          s = s.replace('#include "Log.h"', '')

          if '#include "dex_data.h"' in s:
              s = s.replace('#include "dex_data.h"',
                            '#include "Log.h"\n#include "dex_data.h"\n#include "ImGui.h"\n#include "Input.h"', 1)
          else:
              lines = s.split('\n')
              for i, line in enumerate(lines):
                  if line.strip().startswith('#include'):
                      lines.insert(i+1, '#include "Log.h"\n#include "ImGui.h"\n#include "Input.h"')
                      break
              s = '\n'.join(lines)

          s = re.sub(r'(?:#ifndef LOGI\s*\n)+', '#ifndef LOGI\n', s)
          s = re.sub(r'(?:#endif\s*\n)+', '#endif\n', s)

          lines = s.split('\n')
          insert_at = None
          for i, line in enumerate(lines):
              stripped = line.strip()
              if not stripped: continue
              if stripped.startswith('#'): continue
              if stripped.startswith('//'): continue
              if stripped.startswith('/*'): continue
              if stripped.startswith('*'): continue
              insert_at = i
              break
          if insert_at is None: raise SystemExit(2)
          lines[insert_at:insert_at] = [
              'static JavaVM* gVM = nullptr;',
              'static JavaVM* g_jvm = nullptr;',
              'static bool g_menuVisible = true;',
              'static bool gMenuOpen = false;',
              '',
          ]
          s = '\n'.join(lines)

          footer = textwrap.dedent(r"""
              static void setup_log_path(JNIEnv* env) {
                  std::string ext;
                  jclass at = env->FindClass("android/app/ActivityThread");
                  if (at) {
                      jmethodID m = env->GetStaticMethodID(at, "currentApplication", "()Landroid/app/Application;");
                      if (m) {
                          jobject app = env->CallStaticObjectMethod(at, m);
                          if (app) {
                              jclass ctx = env->FindClass("android/content/Context");
                              jmethodID gefd = env->GetMethodID(ctx, "getExternalFilesDir", "(Ljava/lang/String;)Ljava/io/File;");
                              if (gefd) {
                                  jobject f = env->CallObjectMethod(app, gefd, nullptr);
                                  if (f) {
                                      jclass fc = env->FindClass("java/io/File");
                                      jmethodID gap = env->GetMethodID(fc, "getAbsolutePath", "()Ljava/lang/String;");
                                      jstring jp = (jstring)env->CallObjectMethod(f, gap);
                                      if (jp) {
                                          const char* c = env->GetStringUTFChars(jp, nullptr);
                                          ext = c;
                                          env->ReleaseStringUTFChars(jp, c);
                                      }
                                  }
                              }
                          }
                      }
                  }
                  if (!ext.empty()) {
                      snprintf(g_log_path, sizeof(g_log_path), "%s/DexTool.log", ext.c_str());
                      const char* downloads[] = {
                          "/sdcard/Download/DexTool.log",
                          "/storage/emulated/0/Download/DexTool.log",
                      };
                      for (auto d : downloads) {
                          int fd = open(d, O_WRONLY | O_APPEND | O_CREAT, 0666);
                          if (fd >= 0) {
                              close(fd);
                              snprintf(g_log_path, sizeof(g_log_path), "%s", d);
                              break;
                          }
                      }
                  } else {
                      snprintf(g_log_path, sizeof(g_log_path),
                          "/sdcard/Android/data/com.example.tool/files/DexTool.log");
                      mkdir("/sdcard/Android/data/com.example.tool", 0777);
                      mkdir("/sdcard/Android/data/com.example.tool/files", 0777);
                  }
              }

              void DrawMenu() {
                  static int once = 0;
                  if (!once) { flog("[menu] DrawMenu first call"); once = 1; }
                  if (!g_menuVisible) return;
                  ImGui::SetNextWindowSize(ImVec2(500, 300), ImGuiCond_FirstUseEver);
                  if (ImGui::Begin("DexTool", &g_menuVisible)) {
                      ImGui::Text("DexTool via eglSwapBuffers + libinput hooks");
                      ImGui::Separator();
                      static char buf[256] = "";
                      ImGui::InputText("Test input", buf, sizeof(buf));
                      if (ImGui::Button("Close")) g_menuVisible = false;
                  }
                  ImGui::End();
              }

              extern "C" JNIEXPORT jint JNICALL JNI_OnLoad(JavaVM* vm, void*) {
                  gVM = vm; g_jvm = vm;
                  JNIEnv* env = nullptr;
                  if (vm->GetEnv((void**)&env, JNI_VERSION_1_6) != JNI_OK) return JNI_ERR;

                  setup_log_path(env);
                  flog("========== JNI_OnLoad start ==========");
                  flog("Log path: %s", g_log_path);

                  install_crash_handler();
                  flog("[1] crash handler installed");

                  loadDex(env);
                  flog("[2] loadDex done");

                  gum_init_embedded();
                  flog("[3] gum_init_embedded done");

                  init_frida_script();
                  flog("[4] init_frida_script done");

                  pthread_attr_t attr;
                  pthread_attr_init(&attr);
                  pthread_attr_setstacksize(&attr, 4 * 1024 * 1024);
                  pthread_t t;
                  pthread_create(&t, &attr, initModMenu, (void*)DrawMenu);
                  pthread_attr_destroy(&attr);
                  flog("[5] initModMenu thread started");

                  hookInput();
                  flog("[6] hookInput done");

                  flog("========== JNI_OnLoad done ==========");
                  return JNI_VERSION_1_6;
              }
          """).strip()
          s = s.rstrip() + "\n\n" + footer + "\n"
          p.write_text(s)
          PYEOF

      - name: Remove OverlaySurfaceView.java
        run: |
          rm -f app/src/main/java/com/menu/imgui/OverlaySurfaceView.java

      - name: Rebuild dex_data.h
        run: |
          set -e
          ANDROID_JAR=$(find "$ANDROID_HOME/platforms" -name "android.jar" | sort -V | tail -1)
          D8=$(find "$ANDROID_HOME/build-tools" -name "d8" | sort -V | tail -1)
          rm -rf /tmp/dex_build /tmp/dex_out
          mkdir -p /tmp/dex_build /tmp/dex_out
          javac -source 8 -target 8 -Xlint:-options -cp "$ANDROID_JAR" -d /tmp/dex_build app/src/main/java/com/menu/imgui/Helper.java 2>&1 | tee /tmp/javac.log
          [ ${PIPESTATUS[0]} -ne 0 ] && { echo "JAVAC_FAILED"; cat /tmp/javac.log; exit 1; }
          "$D8" --min-api 26 --lib "$ANDROID_JAR" --output /tmp/dex_out $(find /tmp/dex_build -name "*.class") 2>&1 | tee /tmp/d8.log
          [ ${PIPESTATUS[0]} -ne 0 ] && { echo "D8_FAILED"; cat /tmp/d8.log; exit 1; }
          xxd -i -n imgui_dex /tmp/dex_out/classes.dex > app/src/main/cpp/tool/dex_data.h

      - name: Write CMakeLists.txt (prebuilt Dobby)
        run: |
          cat > app/src/main/cpp/CMakeLists.txt <<'CMEOF'
          cmake_minimum_required(VERSION 3.22.1)
          project("tool")
          set(CMAKE_CXX_STANDARD 17)
          set(CMAKE_BUILD_TYPE Release)
          set(CMAKE_CXX_FLAGS_RELEASE "-Oz -DNDEBUG -ffunction-sections -fdata-sections -fvisibility=hidden")
          if(${ANDROID_ABI} STREQUAL "arm64-v8a")
              set(FRIDA_DIR /tmp/frida-built/arm64-v8a)
              set(DOBBY_DIR ${CMAKE_CURRENT_SOURCE_DIR}/Include/Dobby/lib/arm64-v8a)
          else()
              set(FRIDA_DIR /tmp/frida-built/armeabi-v7a)
              set(DOBBY_DIR ${CMAKE_CURRENT_SOURCE_DIR}/Include/Dobby/lib/armeabi-v7a)
          endif()
          include_directories(${FRIDA_DIR}/include ${FRIDA_DIR}/include/glib-2.0)
          add_library(frida-gumjs STATIC IMPORTED)
          set_target_properties(frida-gumjs PROPERTIES IMPORTED_LOCATION ${FRIDA_DIR}/lib/libfrida-gumjs.a)
          add_library(dobby STATIC IMPORTED)
          set_target_properties(dobby PROPERTIES IMPORTED_LOCATION ${DOBBY_DIR}/libdobby.a)
          include_directories(Include Include/Dobby/include imgui imgui/backends tool)
          add_library(tool SHARED
              tool/native-lib.cpp
              imgui/imgui.cpp imgui/imgui_draw.cpp imgui/imgui_tables.cpp imgui/imgui_widgets.cpp
              imgui/backends/imgui_impl_android.cpp imgui/backends/imgui_impl_opengl3.cpp)
          if(${ANDROID_ABI} STREQUAL "arm64-v8a")
              target_compile_options(tool PRIVATE -march=armv8-a)
          endif()
          target_link_options(tool PRIVATE -Wl,--gc-sections -Wl,--exclude-libs,ALL -Wl,--strip-all)
          target_link_libraries(tool dobby frida-gumjs android log EGL GLESv3 dl)
          CMEOF

      - name: Verify
        run: |
          FAIL=0
          for ABI in arm64-v8a armeabi-v7a; do
            if [ -f "app/src/main/cpp/Include/Dobby/lib/$ABI/libdobby.a" ]; then
              echo "OK $ABI libdobby.a present"
            else
              echo "ERR $ABI libdobby.a missing"; FAIL=1
            fi
          done
          if [ -f app/src/main/cpp/Include/Dobby/include/dobby.h ]; then
            echo "OK dobby.h present"
          else
            echo "ERR dobby.h missing"; FAIL=1
          fi
          if [ -f app/src/main/cpp/Include/Log.h ]; then
            echo "OK Log.h present"
          else
            echo "ERR Log.h missing"; FAIL=1
          fi
          NL="app/src/main/cpp/tool/native-lib.cpp"
          for pat in 'static JavaVM\* g_jvm = nullptr;' 'install_crash_handler' 'setup_log_path' 'flog("========== JNI_OnLoad start'; do
            if grep -qE "$pat" "$NL"; then
              echo "OK pattern present: $pat"
            else
              echo "ERR pattern missing: $pat"; FAIL=1
            fi
          done
          if [ "$(grep -c 'JNI_OnLoad' "$NL" || true)" -eq 1 ]; then
            echo "OK exactly one JNI_OnLoad"
          else
            echo "ERR JNI_OnLoad count != 1"; grep -n 'JNI_OnLoad' "$NL"; FAIL=1
          fi
          if [ $FAIL -ne 0 ]; then
            exit 1
          fi
          echo "ALL CHECKS PASSED"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Build APK
        run: |
          if [ ! -s gradlew ]; then gradle wrapper --gradle-version 8.5; fi
          chmod +x gradlew
          rm -rf app/.cxx app/build .gradle
          ./gradlew :app:assembleDebug --no-build-cache

      - name: Zipalign
        run: |
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          cp "$APK" /tmp/un.apk
          zipalign -p -f 4 /tmp/un.apk "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: app-slim
          path: app/build/outputs/apk/debug/*.apk

      - name: Commit
        if: always()
        run: |
          git config user.name "gh"
          git config user.email "gh@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "fix: use prebuilt Dobby from 3equals3/DobbyHook (deleted release asset) [skip ci]"
          git push
