name: ImGui Patcher with Frida GumJS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Frida GumJS Devkit
        run: |
          set -e
          FRIDA_VERSION="17.1.0"
          BASE_URL="https://github.com/frida/frida/releases/download/${FRIDA_VERSION}"
          
          wget -q "${BASE_URL}/frida-gumjs-devkit-${FRIDA_VERSION}-android-arm64.tar.xz" -O /tmp/frida-gumjs-arm64.tar.xz
          mkdir -p app/src/main/cpp/frida/arm64-v8a
          tar -xf /tmp/frida-gumjs-arm64.tar.xz -C app/src/main/cpp/frida/arm64-v8a
          
          wget -q "${BASE_URL}/frida-gumjs-devkit-${FRIDA_VERSION}-android-arm.tar.xz" -O /tmp/frida-gumjs-arm.tar.xz
          mkdir -p app/src/main/cpp/frida/armeabi-v7a
          tar -xf /tmp/frida-gumjs-arm.tar.xz -C app/src/main/cpp/frida/armeabi-v7a
          
          echo "✓ Frida GumJS Devkit downloaded"

      - name: Write CMakeLists.txt
        run: |
          cat > app/src/main/cpp/CMakeLists.txt << 'EOF'
          cmake_minimum_required(VERSION 3.22.1)
          project("tool")

          set(CMAKE_CXX_STANDARD 17)

          if(${ANDROID_ABI} STREQUAL "arm64-v8a")
              set(FRIDA_DIR ${CMAKE_SOURCE_DIR}/frida/arm64-v8a)
          elseif(${ANDROID_ABI} STREQUAL "armeabi-v7a")
              set(FRIDA_DIR ${CMAKE_SOURCE_DIR}/frida/armeabi-v7a)
          else()
              message(FATAL_ERROR "Unsupported ABI: ${ANDROID_ABI}")
          endif()

          include_directories(${FRIDA_DIR}/include/frida-gum)
          add_library(frida-gumjs STATIC IMPORTED)
          set_target_properties(frida-gumjs PROPERTIES IMPORTED_LOCATION
              ${FRIDA_DIR}/lib/libfrida-gumjs-1.0.a)

          include_directories(
              imgui
              imgui/backends
              tool
          )

          add_library(tool SHARED
              tool/native-lib.cpp
              imgui/imgui.cpp
              imgui/imgui_draw.cpp
              imgui/imgui_tables.cpp
              imgui/imgui_widgets.cpp
              imgui/backends/imgui_impl_android.cpp
              imgui/backends/imgui_impl_opengl3.cpp
          )

          target_link_libraries(tool
              frida-gumjs
              android
              log
              EGL
              GLESv3
              dl
          )
          EOF

      - name: Write native-lib.cpp (with embedded JS agent)
        run: |
          cat > app/src/main/cpp/tool/native-lib.cpp << 'CPP_EOF'
          #include <jni.h>
          #include <android/log.h>
          #include <android/native_window_jni.h>
          #include "imgui.h"
          #include "imgui_impl_android.h"
          #include "imgui_impl_opengl3.h"
          #include <GLES3/gl3.h>
          #include "dex_data.h"
          #include <pthread.h>
          #include <unistd.h>
          #include <fcntl.h>
          #include <sys/stat.h>
          #include <cstring>
          #include <cstdio>
          #include <cmath>
          #include <string>
          #include <vector>
          #include <map>
          #include <set>
          #include <mutex>
          #include <algorithm>

          // --- Frida Includes ---
          #include <frida-gumjs.h>

          #define MY_PI 3.14159265358979323846f
          #define LOG_TAG "ImGuiTool"
          #define LOGI(...) __android_log_print(ANDROID_LOG_INFO, LOG_TAG, __VA_ARGS__)

          // ... (Global variables, structs for PatchItem, etc. can remain similar) ...

          // ========== FRIDA SCRIPT AGENT ==========
          // This is the built-in JavaScript logic. The user never edits this.
          const gchar* PATCH_AGENT_JS = R"(
            Java.perform(function() {
              console.log("[*] Patch Agent Loaded");
              
              // We will dynamically hook methods based on commands from C++.
              // Example: Hook a specific method and change its return value.
              // In a real scenario, we would use a map of active patches.
              
              // Listen for messages from C++
              rpc.exports = {
                patchMethod: function(className, methodName, returnType, value) {
                  try {
                    var targetClass = Java.use(className);
                    var overloads = targetClass[methodName].overloads;
                    if (overloads.length === 0) return "Error: Method not found";
                    
                    // Hook the first overload for simplicity
                    var original = overloads[0];
                    overloads[0].implementation = function() {
                      // Check if patch is active (we can use a global flag or RPC call)
                      // For demo, always return the patched value.
                      console.log("[*] Hooked " + className + "." + methodName + " called.");
                      // Return patched value based on returnType
                      if (returnType === "int") return parseInt(value);
                      if (returnType === "boolean") return value === "true";
                      if (returnType === "java.lang.String") return value;
                      return null; // Fallback
                    };
                    return "Success: Hooked " + className + "." + methodName;
                  } catch (e) {
                    return "Error: " + e.message;
                  }
                },
                unpatchMethod: function(className, methodName) {
                  // In a real implementation, we would revert the implementation.
                  return "Unpatch not fully implemented in demo.";
                }
              };
              
              // Notify C++ that the script is ready
              send({type: "ready"});
            });
          )";

          static GumScript* g_script = nullptr;

          static void on_script_message(GumScript* script, const gchar* message, GBytes* data, gpointer user_data) {
              LOGI("Message from JS: %s", message);
              // Here we would parse messages from JS and update UI state if needed.
          }

          static void load_patch_agent() {
              GError* error = nullptr;
              GumScriptBackend* backend = gum_script_backend_obtain_qjs();
              g_script = gum_script_backend_create(backend, "patch_agent", PATCH_AGENT_JS, nullptr, nullptr, &error);
              if (error) {
                  LOGI("Error creating script: %s", error->message);
                  g_error_free(error);
                  return;
              }
              gum_script_set_message_handler(g_script, on_script_message, nullptr, nullptr);
              gum_script_load(g_script, nullptr);
              LOGI("Patch Agent script loaded.");
          }

          // ========== BRIDGE: C++ -> JS ==========
          // Call this from your UI when the user clicks "Patch".
          void send_patch_command(const char* className, const char* methodName, const char* returnType, const char* value) {
              if (!g_script) return;
              // We use RPC to call the exported JS function.
              // In a real implementation, you'd use the RPC API from the C side.
              // This is a simplified example.
              gchar* script = g_strdup_printf(
                  "rpc.exports.patchMethod('%s', '%s', '%s', '%s');",
                  className, methodName, returnType, value
              );
              // Ideally, we would eval this via the script's scope.
              // For brevity, we assume gum_script_post can handle RPC calls.
              // gum_script_post(g_script, ...); 
              g_free(script);
          }

          // ... (Rest of the UI code, touch handling, ImGui rendering, etc.) ...

          JNIEXPORT jint JNI_OnLoad(JavaVM* vm, void*) {
              JNIEnv* env = nullptr;
              if (vm->GetEnv((void**)&env, JNI_VERSION_1_6) != JNI_OK || !env) return JNI_VERSION_1_6;
              // gVM = vm; if (!loadDex(env)) return JNI_VERSION_1_6;

              // Initialize Frida GumJS
              gum_init_embedded();
              load_patch_agent();

              // ... (RegisterNatives, etc.) ...
              return JNI_VERSION_1_6;
          }
          CPP_EOF

      - name: Regenerate DEX (same as before)
        run: |
          set -e
          rm -rf /tmp/dex && mkdir -p /tmp/dex
          D8=$(find $ANDROID_HOME/build-tools -name d8 | sort -V | tail -1)
          ANDROID_JAR=$(find $ANDROID_HOME/platforms -name android.jar | sort -V | tail -1)
          javac -source 8 -target 8 -cp "$ANDROID_JAR" -d /tmp/dex app/src/main/java/com/menu/imgui/Helper.java app/src/main/java/com/menu/imgui/OverlaySurfaceView.java
          $D8 --min-api 26 --lib "$ANDROID_JAR" --output /tmp/dex $(find /tmp/dex -name "*.class")
          xxd -i -n imgui_dex /tmp/dex/classes.dex | sed 's/unsigned char/const unsigned char/' > app/src/main/cpp/tool/dex_data.h

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Build
        run: |
          if [ ! -s gradlew ]; then gradle wrapper --gradle-version 8.5; fi
          chmod +x gradlew
          rm -rf app/.cxx app/build .gradle
          ./gradlew :app:assembleDebug --no-build-cache --stacktrace

      - name: Upload artifacts
        run: |
          mkdir -p /tmp/so-out
          find app/build -name "libtool.so" -exec cp {} /tmp/so-out/ \;
          ls -la /tmp/so-out/

      - uses: actions/upload-artifact@v4
        with:
          name: libtool-frida-gumjs
          path: /tmp/so-out/libtool.so

      - uses: actions/upload-artifact@v4
        with:
          name: imgui-test-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "feat: integrate Frida GumJS for in-process Java patching [skip ci]"
          git push
