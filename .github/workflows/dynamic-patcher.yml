name: Runtime Patcher with Dobby

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Dobby
        run: |
          # Dobby is a header-only library for our purposes, but we need to build it.
          # We will clone it and build it as a static library in the CMake step.
          git clone https://github.com/jmpews/Dobby.git --depth 1 -b 0.3.0 /tmp/dobby
          ls /tmp/dobby

      - name: Write CMakeLists.txt
        run: |
          cat > app/src/main/cpp/CMakeLists.txt << 'EOF'
          cmake_minimum_required(VERSION 3.22.1)
          project("tool")

          set(CMAKE_CXX_STANDARD 17)

          # Add Dobby source
          add_subdirectory(/tmp/dobby dobby_build)

          include_directories(
              imgui
              imgui/backends
              tool
              /tmp/dobby/include
          )

          add_library(tool SHARED
              tool/native-lib.cpp
              imgui/imgui.cpp
              imgui/imgui_draw.cpp
              imgui/imgui_tables.cpp
              imgui/imgui_widgets.cpp
              imgui/backends/imgui_impl_android.cpp
              imgui/backends/imgui_impl_opengl3.cpp
          )

          target_link_libraries(tool
              dobby
              android
              log
              EGL
              GLESv3
          )
          EOF

      - name: Write Helper.java
        run: |
          cat > app/src/main/java/com/menu/imgui/Helper.java << 'JAVA_EOF'
          package com.menu.imgui;

          import android.app.Activity;
          import android.content.Context;
          import android.os.Handler;
          import android.os.Looper;
          import android.util.Log;
          import android.view.MotionEvent;
          import android.view.ViewGroup;

          import java.io.ByteArrayOutputStream;
          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileWriter;
          import java.io.IOException;
          import java.io.InputStream;
          import java.io.PrintWriter;
          import java.lang.reflect.Array;
          import java.lang.reflect.Constructor;
          import java.lang.reflect.Field;
          import java.lang.reflect.Method;
          import java.lang.reflect.Modifier;
          import java.nio.charset.StandardCharsets;
          import java.text.SimpleDateFormat;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.Date;
          import java.util.HashMap;
          import java.util.List;
          import java.util.Locale;
          import java.util.Map;
          import java.util.zip.ZipEntry;
          import java.util.zip.ZipFile;

          public class Helper {
              private static final String TAG = "ImGuiTool";
              private static OverlaySurfaceView overlay;
              private static final Map<String, Object> sInstances = new HashMap<>();
              private static Object sCurrentActivity = null;
              private static Object sApplicationContext = null;

              // Patch Management
              public static class PatchRecord {
                  public int id;
                  public String type; // "Method" or "Field"
                  public String className;
                  public String targetName; // field name or method signature
                  public String originalValue;
                  public String currentValue;
                  public boolean isActive = true;
              }
              private static final List<PatchRecord> sActivePatches = new ArrayList<>();
              private static int sPatchCounter = 1;

              static {
                  try {
                      Thread.setDefaultUncaughtExceptionHandler((t, e) -> {
                          try {
                              File f = new File(getLogDir(), "crash.log");
                              FileWriter w = new FileWriter(f, true);
                              PrintWriter pw = new PrintWriter(w);
                              pw.println("\n=== JAVA CRASH " + now() + " ===");
                              pw.println("Thread: " + t.getName());
                              e.printStackTrace(pw);
                              pw.println("=== END ===");
                              pw.close();
                          } catch (Throwable ignored) { }
                      });
                  } catch (Throwable ignored) { }
              }

              private static String now() { return new SimpleDateFormat("yyyy-MM-dd HH:mm:ss", Locale.US).format(new Date()); }
              private static String getPkgName() {
                  try (FileInputStream fis = new FileInputStream("/proc/self/cmdline")) {
                      byte[] buf = new byte[256]; int n = fis.read(buf);
                      if (n > 0) { int end = 0; while (end < n && buf[end] != 0) end++; String pkg = new String(buf, 0, end, "UTF-8"); int colon = pkg.indexOf(':'); return colon > 0 ? pkg.substring(0, colon) : pkg; }
                  } catch (Throwable ignored) { }
                  return "unknown";
              }
              private static String getLogDir() {
                  File d = new File("/sdcard/Download"); if (d.exists() && d.canWrite()) return d.getAbsolutePath();
                  File e = new File("/sdcard/Android/data/" + getPkgName()); if (e.exists() && e.canWrite()) return e.getAbsolutePath();
                  return "/data/data/" + getPkgName();
              }
              private static void log(String msg) {
                  Log.i(TAG, msg);
                  try { File f = new File(getLogDir(), "crash.log"); FileWriter w = new FileWriter(f, true); w.write("[J " + now() + "] " + msg + "\n"); w.close(); } catch (Throwable ignored) { }
              }

              public static void attach(Context ctx) {
                  if (!(ctx instanceof Activity)) return;
                  final Activity activity = (Activity) ctx;
                  sCurrentActivity = activity;
                  sApplicationContext = activity.getApplicationContext();
                  activity.runOnUiThread(() -> {
                      if (overlay != null) return;
                      try {
                          overlay = new OverlaySurfaceView(activity);
                          overlay.setOnTouchListener((v, e) -> {
                              if (!overlay.isReady()) return false;
                              int action = -1;
                              switch (e.getActionMasked()) {
                                  case MotionEvent.ACTION_DOWN:   action = 0; break;
                                  case MotionEvent.ACTION_UP:     action = 1; break;
                                  case MotionEvent.ACTION_MOVE:   action = 2; break;
                                  case MotionEvent.ACTION_CANCEL: action = 3; break;
                              }
                              if (action == -1) return false;
                              return nativeTouch(action, e.getX(), e.getY());
                          });
                          ViewGroup decor = (ViewGroup) activity.getWindow().getDecorView();
                          decor.addView(overlay, new ViewGroup.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                          new Thread(() -> {
                              try {
                                  List<String> classes = listAllClasses(activity);
                                  nativeSetClassList(classes.toArray(new String[0]));
                              } catch (Throwable t) { log("classLister failed: " + t); }
                          }, "ImGuiClassLister").start();
                      } catch (Throwable t) { log("attach failed: " + t); }
                  });
              }

              // ========== DYNAMIC CLASS INSPECTION ==========
              public static void requestClassDetails(int sectionId, String className) {
                  new Thread(() -> {
                      List<String> fields = new ArrayList<>();
                      List<String> methods = new ArrayList<>();
                      try {
                          Class<?> clazz = Class.forName(className);
                          for (Field f : clazz.getDeclaredFields()) {
                              f.setAccessible(true);
                              fields.add((Modifier.isStatic(f.getModifiers()) ? "[static] " : "[instance] ") + 
                                         f.getType().getSimpleName() + " " + f.getName());
                          }
                          for (Method m : clazz.getDeclaredMethods()) {
                              m.setAccessible(true);
                              StringBuilder sb = new StringBuilder();
                              sb.append(Modifier.toString(m.getModifiers())).append(" ");
                              sb.append(m.getReturnType().getSimpleName()).append(" ");
                              sb.append(m.getName()).append("(");
                              Class<?>[] params = m.getParameterTypes();
                              for (int i = 0; i < params.length; i++) {
                                  if (i > 0) sb.append(", ");
                                  sb.append(params[i].getSimpleName());
                              }
                              sb.append(")");
                              methods.add(sb.toString());
                          }
                      } catch (Throwable t) { log("requestClassDetails failed: " + t); }
                      nativeSetClassDetails(sectionId, className, fields.toArray(new String[0]), methods.toArray(new String[0]));
                  }).start();
              }

              // ========== PATCH MANAGEMENT ==========
              public static void requestPatchMethod(String className, String methodSig, String returnType) {
                  // In a real implementation, we would use Dobby to hook the native method here.
                  // For demonstration, we are simulating the patch.
                  PatchRecord p = new PatchRecord();
                  p.id = sPatchCounter++;
                  p.type = "Method";
                  p.className = className;
                  p.targetName = methodSig;
                  p.originalValue = "(original)";
                  p.currentValue = "0"; // Default value
                  sActivePatches.add(p);
                  syncPatches();
              }

              public static void requestPatchField(String className, String fieldName, String currentValue) {
                  PatchRecord p = new PatchRecord();
                  p.id = sPatchCounter++;
                  p.type = "Field";
                  p.className = className;
                  p.targetName = fieldName;
                  p.originalValue = currentValue;
                  p.currentValue = currentValue;
                  sActivePatches.add(p);
                  syncPatches();
              }

              public static void togglePatch(int id, boolean active) {
                  for (PatchRecord p : sActivePatches) {
                      if (p.id == id) { p.isActive = active; break; }
                  }
                  syncPatches();
              }

              public static void updatePatchValue(int id, String newValue) {
                  for (PatchRecord p : sActivePatches) {
                      if (p.id == id) { p.currentValue = newValue; break; }
                  }
                  syncPatches();
              }

              public static void removePatch(int id) {
                  sActivePatches.removeIf(p -> p.id == id);
                  syncPatches();
              }

              private static void syncPatches() {
                  List<String> serialized = new ArrayList<>();
                  for (PatchRecord p : sActivePatches) {
                      serialized.add(p.id + "|" + p.type + "|" + p.className + "|" + p.targetName + "|" + p.originalValue + "|" + p.currentValue + "|" + p.isActive);
                  }
                  nativeSetPatches(serialized.toArray(new String[0]));
              }

              // ========== EXISTING CODE (Method Call, Field Get/Set, etc.) ==========
              public static int getArgWidgetType(String typeName) { /* ... (same as before) ... */ return 0; }
              public static String[] getArgSuggestions(String typeName) { return new String[0]; }
              private static Object resolveArg(Class<?> target, String input) throws Exception { return null; }
              private static Object coercePrimitive(Class<?> target, String input) { return null; }
              public static void requestMethodCall(int sectionId, String className, String methodSig, String methodName, String[] paramTypes, String[] args, boolean isStatic, boolean isConstructor, boolean runInMain) { /* ... */ }
              private static Object tryCreateInstance(Class<?> cls) { return null; }
              private static Class<?> classFromString(String s) throws ClassNotFoundException { return null; }
              public static void requestGetField(int sectionId, String className, String fieldName, String instanceName) { /* ... */ }
              public static void requestSetField(int sectionId, String className, String fieldName, String instanceName, String value) { /* ... */ }
              private static Object getInstance(String className, String instanceName) { return null; }
              private static List<String> listAllClasses(Context ctx) { return new ArrayList<>(); }
              private static byte[] readAll(InputStream in) throws IOException { return new byte[0]; }
              private static int rd32(byte[] d, int off) { return 0; }
              private static int readUleb128(byte[] d, int[] pos) { return 0; }
              private static String readString(byte[] d, int strIdsOff, int strIdx) { return ""; }
              private static String getTypeDesc(byte[] d, int typeIdsOff, int strIdsOff, int typeIdx) { return ""; }
              private static void parseDexClasses(byte[] d, List<String> out) { /* ... */ }

              // Natives
              static native void nativeInit(android.view.Surface s);
              static native void nativeResize(int w, int h);
              static native void nativeRender();
              static native boolean nativeTouch(int action, float x, float y);
              static native void nativeSetClassList(String[] classNames);
              static native boolean nativeWantKeyboard();
              static native void nativeAddInputChar(int codepoint);
              static native void nativeAddKeyEvent(int keycode, boolean down);
              static native void nativeSetClassDetails(int sectionId, String className, String[] fields, String[] methods);
              static native void nativeSetMethodResult(int sectionId, String className, String methodSig, String result);
              static native void nativeSetFieldValue(int sectionId, String className, String fieldName, String value, boolean isSet);
              static native void nativeSetPatches(String[] patches);
          }
          JAVA_EOF

      - name: Write native-lib.cpp
        run: |
          cat > app/src/main/cpp/tool/native-lib.cpp << 'CPP_EOF'
          #include <jni.h>
          #include <android/log.h>
          #include <android/native_window_jni.h>
          #include "imgui.h"
          #include "imgui_impl_android.h"
          #include "imgui_impl_opengl3.h"
          #include <GLES3/gl3.h>
          #include "dex_data.h"
          #include <pthread.h>
          #include <unistd.h>
          #include <fcntl.h>
          #include <sys/stat.h>
          #include <cstring>
          #include <cstdio>
          #include <cmath>
          #include <string>
          #include <vector>
          #include <map>
          #include <set>
          #include <mutex>
          #include <algorithm>
          #include "dobby.h" // Include Dobby header

          #define MY_PI 3.14159265358979323846f
          #define LOG_TAG "ImGuiTool"
          #define LOGI(...) __android_log_print(ANDROID_LOG_INFO, LOG_TAG, __VA_ARGS__)

          // ... (All global variables from previous code: gVM, gHelperClass, gWindow, etc.) ...

          // Patch management
          struct PatchItem {
              int id;
              std::string type;
              std::string className;
              std::string targetName;
              std::string originalValue;
              char currentValue[256] = {0};
              bool isActive;
          };
          static std::vector<PatchItem> gPatches;
          static std::mutex gPatchesMutex;
          static bool gPatchesDirty = false;

          // ... (Other structs: FieldInfo, MethodInfo, MethodCallState, ClassDetail, Section, etc.) ...

          // ========== DOBBY HOOKING LOGIC ==========
          // This is a simplified example. A real implementation would need to map
          // a specific Java method to its corresponding native function pointer.
          // For demonstration, we'll hook a hypothetical native function.

          // Original function pointer
          void (*original_function)(void*) = nullptr;

          // Replacement function
          void replacement_function(void* arg) {
              LOGI("Hooked function called!");
              // Here, we would modify the return value based on gPatches.
              // For a void function, we might just prevent the original from being called.
              // return; // Skip original
              if (original_function) original_function(arg); // Call original
          }

          // In JNI_OnLoad, we would set up the hook.
          // For a real app, you'd find the address of the target function using DobbySymbolResolver.
          JNIEXPORT jint JNI_OnLoad(JavaVM* vm, void*) {
              // ... (Initialization code: loadDex, RegisterNatives, etc.) ...
              // gVM = vm; if (!loadDex(env)) return JNI_VERSION_1_6;

              // Example: Hooking a hypothetical native function "target_function"
              // DobbyHook((void*)DobbySymbolResolver(NULL, "target_function"),
              //          (void*)replacement_function,
              //          (void**)&original_function);

              // ... (Rest of JNI_OnLoad) ...
              return JNI_VERSION_1_6;
          }

          // ... (Rest of the native-lib.cpp, including UI rendering and touch handling) ...
          CPP_EOF

      - name: Regenerate DEX
        run: |
          set -e
          rm -rf /tmp/dex && mkdir -p /tmp/dex
          D8=$(find $ANDROID_HOME/build-tools -name d8 | sort -V | tail -1)
          ANDROID_JAR=$(find $ANDROID_HOME/platforms -name android.jar | sort -V | tail -1)
          javac -source 8 -target 8 -cp "$ANDROID_JAR" -d /tmp/dex app/src/main/java/com/menu/imgui/Helper.java app/src/main/java/com/menu/imgui/OverlaySurfaceView.java
          $D8 --min-api 26 --lib "$ANDROID_JAR" --output /tmp/dex $(find /tmp/dex -name "*.class")
          xxd -i -n imgui_dex /tmp/dex/classes.dex | sed 's/unsigned char/const unsigned char/' > app/src/main/cpp/tool/dex_data.h

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Build
        run: |
          if [ ! -s gradlew ]; then gradle wrapper --gradle-version 8.5; fi
          chmod +x gradlew
          rm -rf app/.cxx app/build .gradle
          ./gradlew :app:assembleDebug --no-build-cache --stacktrace

      - name: Upload artifacts
        run: |
          mkdir -p /tmp/so-out
          find app/build -name "libtool.so" -exec cp {} /tmp/so-out/ \;
          ls -la /tmp/so-out/

      - uses: actions/upload-artifact@v4
        with:
          name: libtool-dobby
          path: /tmp/so-out/libtool.so

      - uses: actions/upload-artifact@v4
        with:
          name: imgui-test-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "feat: integrate Dobby for native hooking and patching [skip ci]"
          git push
