name: Frida from Source (Dual-Arch Slim) - Fixed

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cleanup other workflows
        run: |
          cd .github/workflows
          for f in *.yml *.yaml; do
            if [ -f "$f" ] && [ "$f" != "frida-from-source.yml" ]; then
              echo "Removing: $f"
              rm -f "$f"
            fi
          done

      - name: Install Build Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pip ninja-build pkg-config libglib2.0-dev
          pip3 install --quiet --upgrade pip
          pip3 install --quiet meson
          meson --version
          ninja --version

      - name: Detect NDK
        run: |
          NDK_DIR=$(ls -d $ANDROID_HOME/ndk/* 2>/dev/null | head -1)
          [ -z "$NDK_DIR" ] && echo "FATAL: NDK not found" && exit 1
          echo "NDK_PATH=$NDK_DIR" >> $GITHUB_ENV
          echo "NDK: $NDK_DIR"

      - name: Download Frida HEADERS only (from devkit)
        run: |
          set -e
          FRIDA_VERSION="17.1.0"
          BASE_URL="https://github.com/frida/frida/releases/download/${FRIDA_VERSION}"

          for pair in "arm64-v8a:arm64" "armeabi-v7a:arm"; do
            ABI="${pair%%:*}"
            ARCH="${pair##*:}"
            echo "=== Headers for $ABI ($ARCH) ==="
            mkdir -p /tmp/frida-built/${ABI}
            wget -q "${BASE_URL}/frida-gumjs-devkit-${FRIDA_VERSION}-android-${ARCH}.tar.xz" \
              -O /tmp/devkit-${ARCH}.tar.xz
            # Extract ONLY include/ — skips the 180MB .a
            tar -xf /tmp/devkit-${ARCH}.tar.xz -C /tmp/frida-built/${ABI} include/
            echo "Headers:"
            ls /tmp/frida-built/${ABI}/include/ | head -10
            rm -f /tmp/devkit-${ARCH}.tar.xz
          done

      - name: Clone Frida source
        run: |
          set -e
          FRIDA_VERSION="17.1.0"
          git clone --recursive --depth 1 --branch ${FRIDA_VERSION} \
            https://github.com/frida/frida.git /tmp/frida
          echo "✓ Cloned"

      - name: Configure slim Frida
        run: |
          cat > /tmp/frida/config.mk << 'EOF'
          FRIDA_V8 = disabled
          FRIDA_DATABASE = disabled
          FRIDA_CONNECTIVITY = disabled
          FRIDA_OBJC_BRIDGE = disabled
          FRIDA_SWIFT_BRIDGE = disabled
          FRIDA_DEBUG = no
          EOF
          cat /tmp/frida/config.mk

      - name: Build Frida arm64-v8a
        timeout-minutes: 90
        run: |
          cd /tmp/frida
          rm -rf build
          export ANDROID_NDK_ROOT="$NDK_PATH"
          export FRIDA_HOST=android-arm64
          echo "=== Building arm64 ==="
          # Python build will fail at the END; gumjs is produced first
          make -j$(nproc) 2>&1 | tail -20 || true

          echo "=== Locating libfrida-gumjs ==="
          LIB=$(find build -name "libfrida-gumjs*.a" -not -name "*inspector*" | head -1)
          if [ -z "$LIB" ]; then
            echo "FATAL: libfrida-gumjs.a not found for arm64"
            find build -name "libfrida*.a" | head -10
            exit 1
          fi
          echo "Found: $LIB ($(ls -lah $LIB | awk '{print $5}'))"
          mkdir -p /tmp/frida-built/arm64-v8a/lib
          cp "$LIB" /tmp/frida-built/arm64-v8a/lib/libfrida-gumjs.a
          ls -lah /tmp/frida-built/arm64-v8a/lib/

      - name: Build Frida armeabi-v7a
        timeout-minutes: 90
        run: |
          cd /tmp/frida
          rm -rf build
          export ANDROID_NDK_ROOT="$NDK_PATH"
          export FRIDA_HOST=android-arm
          echo "=== Building arm ==="
          make -j$(nproc) 2>&1 | tail -20 || true

          echo "=== Locating libfrida-gumjs ==="
          LIB=$(find build -name "libfrida-gumjs*.a" -not -name "*inspector*" | head -1)
          if [ -z "$LIB" ]; then
            echo "FATAL: libfrida-gumjs.a not found for arm"
            find build -name "libfrida*.a" | head -10
            exit 1
          fi
          echo "Found: $LIB ($(ls -lah $LIB | awk '{print $5}'))"
          mkdir -p /tmp/frida-built/armeabi-v7a/lib
          cp "$LIB" /tmp/frida-built/armeabi-v7a/lib/libfrida-gumjs.a
          ls -lah /tmp/frida-built/armeabi-v7a/lib/

      - name: Verify both builds
        run: |
          set -e
          for ABI in arm64-v8a armeabi-v7a; do
            LIB=/tmp/frida-built/$ABI/lib/libfrida-gumjs.a
            HDR=/tmp/frida-built/$ABI/include/frida-gumjs.h
            test -s "$LIB" || (echo "MISSING lib for $ABI" && exit 1)
            test -s "$HDR" || (echo "MISSING header for $ABI" && exit 1)
            SIZE=$(stat -c%s "$LIB")
            echo "✓ $ABI: lib=$(echo "scale=2; $SIZE/1048576" | bc)MB, header OK"
          done

      - name: Verify source files
        run: |
          set -e
          test -s app/src/main/cpp/tool/native-lib.cpp || (echo "native-lib.cpp missing" && exit 1)
          test -s app/src/main/cpp/tool/dex_data.h || (echo "dex_data.h missing" && exit 1)
          test -s app/src/main/java/com/menu/imgui/Helper.java || (echo "Helper.java missing" && exit 1)
          test -s app/src/main/java/com/menu/imgui/OverlaySurfaceView.java || (echo "OverlaySurfaceView.java missing" && exit 1)
          grep -q "gum_init_embedded" app/src/main/cpp/tool/native-lib.cpp && echo "✓ Frida init present"

      - name: Write CMakeLists.txt
        run: |
          cat > app/src/main/cpp/CMakeLists.txt << 'EOF'
          cmake_minimum_required(VERSION 3.22.1)
          project("tool")
          set(CMAKE_CXX_STANDARD 17)

          if(NOT CMAKE_BUILD_TYPE)
              set(CMAKE_BUILD_TYPE Release CACHE STRING "" FORCE)
          endif()
          set(CMAKE_C_FLAGS_RELEASE "-Oz -DNDEBUG -ffunction-sections -fdata-sections -fvisibility=hidden")
          set(CMAKE_CXX_FLAGS_RELEASE "-Oz -DNDEBUG -ffunction-sections -fdata-sections -fvisibility=hidden")

          if(${ANDROID_ABI} STREQUAL "arm64-v8a")
              set(FRIDA_DIR /tmp/frida-built/arm64-v8a)
          elseif(${ANDROID_ABI} STREQUAL "armeabi-v7a")
              set(FRIDA_DIR /tmp/frida-built/armeabi-v7a)
          else()
              message(FATAL_ERROR "Unsupported ABI: ${ANDROID_ABI}")
          endif()

          if(NOT EXISTS "${FRIDA_DIR}/lib/libfrida-gumjs.a")
              message(FATAL_ERROR "Frida lib missing: ${FRIDA_DIR}/lib/libfrida-gumjs.a")
          endif()

          include_directories(${FRIDA_DIR}/include)

          add_library(frida-gumjs STATIC IMPORTED)
          set_target_properties(frida-gumjs PROPERTIES
              IMPORTED_LOCATION ${FRIDA_DIR}/lib/libfrida-gumjs.a)

          include_directories(imgui imgui/backends tool)

          add_library(tool SHARED
              tool/native-lib.cpp
              imgui/imgui.cpp
              imgui/imgui_draw.cpp
              imgui/imgui_tables.cpp
              imgui/imgui_widgets.cpp
              imgui/backends/imgui_impl_android.cpp
              imgui/backends/imgui_impl_opengl3.cpp)

          target_link_options(tool PRIVATE
              -Wl,--gc-sections
              -Wl,--exclude-libs,ALL
              -Wl,--strip-all)

          target_link_libraries(tool frida-gumjs android log EGL GLESv3 dl)
          EOF

      - name: Write app/build.gradle.kts
        run: |
          cat > app/build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.tool"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.tool"
                  minSdk = 27
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"

                  externalNativeBuild {
                      cmake {
                          cppFlags += "-std=c++17"
                          arguments += listOf("-DCMAKE_BUILD_TYPE=Release")
                      }
                  }
                  ndk { abiFilters += listOf("arm64-v8a", "armeabi-v7a") }
              }

              externalNativeBuild {
                  cmake {
                      path = file("src/main/cpp/CMakeLists.txt")
                      version = "3.22.1"
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }

              buildTypes {
                  getByName("debug") {
                      externalNativeBuild {
                          cmake {
                              arguments += listOf("-DCMAKE_BUILD_TYPE=Release")
                          }
                      }
                  }
              }

              packaging {
                  jniLibs { useLegacyPackaging = true }
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
          }
          EOF

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Build APK
        run: |
          if [ ! -s gradlew ]; then gradle wrapper --gradle-version 8.5; fi
          chmod +x gradlew
          rm -rf app/.cxx app/build .gradle
          ./gradlew :app:assembleDebug --no-build-cache --stacktrace

      - name: Strip .so
        run: |
          set -e
          NDK_STRIP=$(find $NDK_PATH -name "llvm-strip" | head -1)
          for SO in $(find app/build -name "libtool.so"); do
            echo "=== $SO ==="
            ls -lah "$SO"
            $NDK_STRIP --strip-all "$SO"
            ls -lah "$SO"
            SIZE=$(stat -c%s "$SO")
            echo "→ $(echo "scale=2; $SIZE/1048576" | bc) MB"
          done

      - name: Show APK info
        run: |
          APK=$(find app/build -name "*.apk" | head -1)
          ls -lah "$APK"
          unzip -l "$APK" | grep "\.so"

      - name: Extract .so files
        run: |
          mkdir -p /tmp/so-out
          for SO in $(find app/build -name "libtool.so"); do
            ABI=$(echo "$SO" | grep -oE "(arm64-v8a|armeabi-v7a)")
            cp "$SO" "/tmp/so-out/libtool-${ABI}.so"
          done
          ls -lah /tmp/so-out/

      - uses: actions/upload-artifact@v4
        with:
          name: libtool-frida-source
          path: /tmp/so-out/*.so

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-frida-source
          path: app/build/outputs/apk/debug/*.apk

      - name: Commit configs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "feat: frida from source (slim dual-arch) + devkit headers [skip ci]"
          git push
