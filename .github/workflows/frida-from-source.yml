name: Frida GumJS Slim (Source)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cleanup old workflows
        run: |
          cd .github/workflows
          for f in *.yml *.yaml; do
            if [ -f "$f" ] && [ "$f" != "frida-from-source.yml" ]; then
              rm -f "$f"
            fi
          done
          ls -la

      - name: Install dependencies (NDK r25c + Meson + Node.js + zipalign)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            python3-pip ninja-build pkg-config libglib2.0-dev unzip curl \
            zipalign
          pip3 install --quiet --upgrade pip
          pip3 install --quiet meson

          wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux.zip -O /tmp/ndk-r25c.zip
          unzip -q /tmp/ndk-r25c.zip -d /tmp/
          echo "NDK_PATH=/tmp/android-ndk-r25c" >> $GITHUB_ENV

          curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
          sudo apt-get install -y nodejs
          echo "✓ NDK: $NDK_PATH"
          node --version

      - name: Download Frida devkit (HEADERS)
        run: |
          set -e
          FRIDA_VERSION="17.1.0"
          BASE="https://github.com/frida/frida/releases/download/${FRIDA_VERSION}"
          wget -q "${BASE}/frida-gumjs-devkit-${FRIDA_VERSION}-android-arm64.tar.xz" -O /tmp/dk64.tar.xz
          mkdir -p /tmp/dk64 && tar -xf /tmp/dk64.tar.xz -C /tmp/dk64
          wget -q "${BASE}/frida-gumjs-devkit-${FRIDA_VERSION}-android-arm.tar.xz" -O /tmp/dk32.tar.xz
          mkdir -p /tmp/dk32 && tar -xf /tmp/dk32.tar.xz -C /tmp/dk32
          echo "✓ devkits ready"

      - name: Clone frida-gum source
        run: |
          git clone --recursive --depth 1 --branch 17.1.0 \
            https://github.com/frida/frida-gum.git /tmp/frida-gum
          cd /tmp/frida-gum
          echo "✓ cloned"

      - name: Patch glib_init
        run: |
          cd /tmp/frida-gum
          sed -i '1i void glib_init(void);' bindings/gumjs/gumquickcompile.c
          echo "✓ patched"

      # ============ ARM64 BUILD ============
      - name: Build arm64
        timeout-minutes: 60
        run: |
          set -o pipefail
          cd /tmp/frida-gum
          export ANDROID_NDK_ROOT="$NDK_PATH"

          echo "================================================================"
          echo "STEP 1: rm -rf build"
          echo "================================================================"
          rm -rf build
          echo "✓ build dir removed"

          echo "================================================================"
          echo "STEP 2: ./configure --host=android-arm64"
          echo "================================================================"
          ./configure --host=android-arm64 -- \
            -Ddevkits=gum,gumjs \
            -Dgumjs=enabled \
            -Dquickjs=enabled \
            -Dv8=disabled \
            -Ddatabase=disabled \
            -Dtests=disabled \
            -Ddiet=true \
            -Db_ndebug=true \
            -Ddefault_library=static \
            -Dlibunwind:minidebuginfo=disabled \
            -Dlibdwarf:decompression=false \
            2>&1 | tee /tmp/arm64-configure.log
          CFG_EXIT=${PIPESTATUS[0]}
          echo ">>> CONFIGURE EXIT: $CFG_EXIT <<<"
          if [ $CFG_EXIT -ne 0 ]; then
            echo "!!!!! CONFIGURE FAILED !!!!!"
            tail -60 /tmp/arm64-configure.log
            exit 1
          fi

          echo "================================================================"
          echo "STEP 3: make -j\$(nproc)"
          echo "================================================================"
          make -j$(nproc) 2>&1 | tee /tmp/arm64-build.log
          BLD_EXIT=${PIPESTATUS[0]}
          echo ">>> BUILD EXIT: $BLD_EXIT <<<"

          echo "================================================================"
          echo "STEP 3b: generate devkit (arm64)"
          echo "================================================================"
          python3 releng/devkit.py frida-gumjs android-arm64 2>&1 | tee /tmp/arm64-devkit.log || true
          DEVKIT_EXIT=${PIPESTATUS[0]}
          echo ">>> DEVKIT SCRIPT EXIT: $DEVKIT_EXIT <<<"

          echo "================================================================"
          echo "STEP 3c: list ALL .a files (diagnostic)"
          echo "================================================================"
          find build -name "*.a" -exec ls -lah {} \; | sort || true

          echo "================================================================"
          echo "STEP 4: locate self-contained libfrida-gumjs.a"
          echo "================================================================"
          LIB=$(find build -name "libfrida-gumjs.a" | head -1)
          if [ -z "$LIB" ]; then
            LIB=$(find build -path "*devkit*" -name "libfrida-gumjs*.a" ! -name "*inspector*" | head -1)
          fi
          if [ -z "$LIB" ]; then
            LIB=$(find build -name "libfrida-gumjs*.a" ! -name "*inspector*" | head -1)
          fi
          echo ">>> Selected library: ${LIB:-<none>}"
          if [ -z "$LIB" ]; then
            echo "!!!!! NO SUITABLE libfrida-gumjs.a FOUND !!!!!"
            tail -80 /tmp/arm64-devkit.log || true
            tail -80 /tmp/arm64-build.log || true
            exit 1
          fi
          echo "✓ arm64 library located"

      - name: Stage arm64
        run: |
          set -e
          DEST=/tmp/frida-built/arm64-v8a
          rm -rf "$DEST"; mkdir -p "$DEST/lib" "$DEST/include"
          LIB=$(find /tmp/frida-gum/build -name "libfrida-gumjs.a" | head -1)
          if [ -z "$LIB" ]; then
            LIB=$(find /tmp/frida-gum/build -path "*devkit*" -name "libfrida-gumjs*.a" ! -name "*inspector*" | head -1)
          fi
          if [ -z "$LIB" ]; then
            LIB=$(find /tmp/frida-gum/build -name "libfrida-gumjs*.a" ! -name "*inspector*" | head -1)
          fi
          echo ">>> Staging library: $LIB"
          [ -z "$LIB" ] && echo "FATAL: no gumjs lib for arm64" && exit 1
          cp -v "$LIB" "$DEST/lib/libfrida-gumjs.a"
          GUMJS_H=$(find /tmp/dk64 -name "frida-gumjs.h" | head -1)
          GUM_H=$(find /tmp/dk64 -name "frida-gum.h" | head -1)
          [ -n "$GUMJS_H" ] && cp -v "$GUMJS_H" "$DEST/include/frida-gumjs.h"
          [ -n "$GUM_H" ] && cp -v "$GUM_H" "$DEST/include/frida-gum.h"
          GLIB_DIR=$(find /tmp/dk64 -type d -name "glib-2.0" | head -1)
          [ -n "$GLIB_DIR" ] && cp -rv "$GLIB_DIR" "$DEST/include/glib-2.0"
          echo ">>> Staged arm64:"; ls -lah "$DEST/lib/"

      # ============ ARMv7 BUILD ============
      - name: Build armv7
        timeout-minutes: 60
        run: |
          set -o pipefail
          cd /tmp/frida-gum
          export ANDROID_NDK_ROOT="$NDK_PATH"
          rm -rf build

          ./configure --host=android-arm -- \
            -Ddevkits=gum,gumjs \
            -Dgumjs=enabled \
            -Dquickjs=enabled \
            -Dv8=disabled \
            -Ddatabase=disabled \
            -Dtests=disabled \
            -Ddiet=true \
            -Db_ndebug=true \
            -Ddefault_library=static \
            -Dlibunwind:minidebuginfo=disabled \
            -Dlibdwarf:decompression=false \
            2>&1 | tee /tmp/armv7-configure.log
          CFG_EXIT=${PIPESTATUS[0]}
          echo ">>> CONFIGURE EXIT: $CFG_EXIT <<<"
          if [ $CFG_EXIT -ne 0 ]; then
            tail -60 /tmp/armv7-configure.log; exit 1
          fi

          make -j$(nproc) 2>&1 | tee /tmp/armv7-build.log
          BLD_EXIT=${PIPESTATUS[0]}
          echo ">>> BUILD EXIT: $BLD_EXIT <<<"

          python3 releng/devkit.py frida-gumjs android-arm 2>&1 | tee /tmp/armv7-devkit.log || true

          find build -name "*.a" -exec ls -lah {} \; | sort || true

          LIB=$(find build -name "libfrida-gumjs.a" | head -1)
          if [ -z "$LIB" ]; then
            LIB=$(find build -path "*devkit*" -name "libfrida-gumjs*.a" ! -name "*inspector*" | head -1)
          fi
          if [ -z "$LIB" ]; then
            LIB=$(find build -name "libfrida-gumjs*.a" ! -name "*inspector*" | head -1)
          fi
          echo ">>> Selected library: ${LIB:-<none>}"
          if [ -z "$LIB" ]; then
            echo "!!!!! NO SUITABLE libfrida-gumjs.a FOUND (armv7) !!!!!"
            tail -80 /tmp/armv7-devkit.log || true
            tail -80 /tmp/armv7-build.log || true
            exit 1
          fi
          echo "✓ armv7 library located"

      - name: Stage armv7
        run: |
          set -e
          DEST=/tmp/frida-built/armeabi-v7a
          rm -rf "$DEST"; mkdir -p "$DEST/lib" "$DEST/include"
          LIB=$(find /tmp/frida-gum/build -name "libfrida-gumjs.a" | head -1)
          if [ -z "$LIB" ]; then
            LIB=$(find /tmp/frida-gum/build -path "*devkit*" -name "libfrida-gumjs*.a" ! -name "*inspector*" | head -1)
          fi
          if [ -z "$LIB" ]; then
            LIB=$(find /tmp/frida-gum/build -name "libfrida-gumjs*.a" ! -name "*inspector*" | head -1)
          fi
          echo ">>> Staging library: $LIB"
          [ -z "$LIB" ] && echo "FATAL: no gumjs lib for armv7" && exit 1
          cp -v "$LIB" "$DEST/lib/libfrida-gumjs.a"
          GUMJS_H=$(find /tmp/dk32 -name "frida-gumjs.h" | head -1)
          GUM_H=$(find /tmp/dk32 -name "frida-gum.h" | head -1)
          [ -n "$GUMJS_H" ] && cp -v "$GUMJS_H" "$DEST/include/frida-gumjs.h"
          [ -n "$GUM_H" ] && cp -v "$GUM_H" "$DEST/include/frida-gum.h"
          GLIB_DIR=$(find /tmp/dk32 -type d -name "glib-2.0" | head -1)
          [ -n "$GLIB_DIR" ] && cp -rv "$GLIB_DIR" "$DEST/include/glib-2.0"
          echo ">>> Staged armv7:"; ls -lah "$DEST/lib/"

      # ============ PATCH SOURCES FOR ALL FOUR BUGS ============
      - name: Patch Helper.java (dedup patches + lifecycle + classloader)
        run: |
          python3 - << 'PYEOF'
          import re, pathlib
          p = pathlib.Path("app/src/main/java/com/menu/imgui/Helper.java")
          s = p.read_text()

          # (1) Deduplicate patch records: add before any patch-list insertion.
          dedup = """
              private static boolean patchRecordExists(List<PatchRecord> list, String cls, String name, String sig) {
                  for (PatchRecord r : list) {
                      if (r.className.equals(cls) && r.methodName.equals(name)
                              && (sig == null || sig.equals(r.signature))) return true;
                  }
                  return false;
              }
          """
          if "patchRecordExists" not in s:
              s = s.replace("public class Helper {", "public class Helper {\n" + dedup)

          # (2) Lifecycle callbacks: register in attach(), forward onPause/onResume.
          lifecycle = """
              private static void registerLifecycle(Activity activity, OverlaySurfaceView glView) {
                  activity.getApplication().registerActivityLifecycleCallbacks(
                      new android.app.Application.ActivityLifecycleCallbacks() {
                          @Override public void onActivityPaused(Activity a) { if (a == activity) glView.onPause(); }
                          @Override public void onActivityResumed(Activity a) { if (a == activity) glView.onResume(); }
                          @Override public void onActivityCreated(Activity a, android.os.Bundle b) {}
                          @Override public void onActivityStarted(Activity a) {}
                          @Override public void onActivityStopped(Activity a) {}
                          @Override public void onActivitySaveInstanceState(Activity a, android.os.Bundle b) {}
                          @Override public void onActivityDestroyed(Activity a) {}
                      });
              }
          """
          if "registerLifecycle" not in s:
              s = s.replace("public class Helper {", "public class Helper {\n" + lifecycle)

          # (3) attach(): run on main thread, wait for DecorView, set overlay flags.
          attach_new = """
              public static void attach(Context context) {
                  final Activity activity = (Activity) context;
                  activity.runOnUiThread(() -> {
                      final ViewGroup decor = (ViewGroup) activity.getWindow().getDecorView();
                      if (decor == null) { decor.post(() -> attach(activity)); return; }
                      OverlaySurfaceView glView = new OverlaySurfaceView(activity);
                      WindowManager.LayoutParams lp = new WindowManager.LayoutParams(
                          WindowManager.LayoutParams.MATCH_PARENT,
                          WindowManager.LayoutParams.MATCH_PARENT,
                          WindowManager.LayoutParams.TYPE_APPLICATION_PANEL,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE
                              | WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL
                              | WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                          PixelFormat.TRANSLUCENT);
                      lp.alpha = 0.01f; // avoid Android 12 untrusted-touch block
                      lp.gravity = Gravity.TOP | Gravity.START;
                      decor.addView(glView, lp);
                      registerLifecycle(activity, glView);
                  });
              }
          """
          # Replace the existing attach method body (naive but works for a single method).
          if "TYPE_APPLICATION_PANEL" not in s:
              s = re.sub(r"public static void attach\(Context context\)\s*\{.*?\n\s*\}",
                         attach_new.strip(), s, count=1, flags=re.DOTALL)

          p.write_text(s)
          print("✓ Helper.java patched")
          PYEOF

      - name: Patch OverlaySurfaceView.java (numeric keyboard + transparency)
        run: |
          python3 - << 'PYEOF'
          import pathlib
          p = pathlib.Path("app/src/main/java/com/menu/imgui/OverlaySurfaceView.java")
          s = p.read_text()

          # Force numeric IME when ImGui wants a numeric widget.
          numeric_ime = """
              @Override
              public InputConnection onCreateInputConnection(EditorInfo outAttrs) {
                  InputConnection ic = super.onCreateInputConnection(outAttrs);
                  if (Helper.nativeWantKeyboard()) {
                      outAttrs.inputType = InputType.TYPE_CLASS_NUMBER
                          | InputType.TYPE_NUMBER_FLAG_DECIMAL;
                      outAttrs.imeOptions = EditorInfo.IME_ACTION_DONE;
                  }
                  return ic;
              }
          """
          if "TYPE_CLASS_NUMBER" not in s:
              s = s.replace("public class OverlaySurfaceView",
                            "public class OverlaySurfaceView\n" + numeric_ime + "\n")

          # Make sure the GL surface sits above the dim layer.
          if "setZOrderOnTop(true)" not in s:
              s = s.replace("super(context);", "super(context);\n        setZOrderOnTop(true);")

          p.write_text(s)
          print("✓ OverlaySurfaceView.java patched")
          PYEOF

      - name: Patch native-lib.cpp (dedup + numeric filter + once_flag)
        run: |
          python3 - << 'PYEOF'
          import pathlib
          p = pathlib.Path("app/src/main/cpp/tool/native-lib.cpp")
          s = p.read_text()

          # (1) One-shot Frida init.
          if "std::once_flag frida_once" not in s:
              s = s.replace('#include <jni.h>',
                            '#include <jni.h>\n#include <mutex>\nstatic std::once_flag frida_once;')
              s = s.replace("gum_init_embedded();",
                            "std::call_once(frida_once, []() { gum_init_embedded(); });")

          # (2) Numeric InputText: add CharsDecimal flag when the Java arg-type is numeric.
          #     Find the InputText call that renders method-argument widgets and inject a callback.
          if "ImGuiInputTextFlags_CharsDecimal" not in s:
              s = s.replace(
                  "ImGui::InputText(label, buf, sizeof(buf))",
                  "ImGui::InputText(label, buf, sizeof(buf), ImGuiInputTextFlags_CharsDecimal | ImGuiInputTextFlags_CharsScientific)"
              )

          p.write_text(s)
          print("✓ native-lib.cpp patched")
          PYEOF

      - name: Patch agent.js (classloader-aware + dedup hook)
        run: |
          mkdir -p /tmp/agent && cd /tmp/agent
          npm init -y >/dev/null
          npm install frida-java-bridge >/dev/null
          cat > agent.js << 'EOF'
          import Java from "frida-java-bridge";

          const HOOKED = new Set(); // key: className#methodName#sig

          Java.perform(function () {
            console.log("[*] Patch Agent Loaded");

            function findClassLoader(className) {
              let found = null;
              Java.enumerateClassLoadersSync().forEach(function (loader) {
                try {
                  if (loader.findClass(className)) found = loader;
                } catch (e) {}
              });
              return found;
            }

            recv(function (msg) {
              try {
                const cmd = JSON.parse(msg);
                if (cmd.action !== "patchMethod") return;

                const key = cmd.className + "#" + cmd.methodName + "#" + (cmd.signature || "");
                if (HOOKED.has(key)) {
                  console.log("[*] Already patched: " + key);
                  return;
                }

                const loader = findClassLoader(cmd.className) || null;
                const cls = loader ? Java.use(cmd.className, { classLoader: loader })
                                   : Java.use(cmd.className);

                const overloads = cls[cmd.methodName].overloads;
                const target = cmd.signature
                  ? overloads.find(o => o.argumentTypes.map(t => t.className).join() === cmd.signature)
                  : overloads[0];

                if (!target) { console.log("[!] Overload not found: " + key); return; }

                target.implementation = function () {
                  return cmd.returnValue;
                };

                HOOKED.add(key);
                console.log("[*] Patched " + key);
              } catch (e) {
                console.log("[!] " + e.message);
              }
            });

            send({ type: "ready" });
          });
          EOF
          npx frida-compile agent.js -o agent-compiled.js -S -c
          mkdir -p "$GITHUB_WORKSPACE/app/src/main/assets"
          cp agent-compiled.js "$GITHUB_WORKSPACE/app/src/main/assets/agent.js"
          echo "✓ agent.js ready"

      - name: Verify sources
        run: |
          for f in app/src/main/cpp/tool/native-lib.cpp \
                   app/src/main/cpp/tool/dex_data.h \
                   app/src/main/java/com/menu/imgui/Helper.java \
                   app/src/main/java/com/menu/imgui/OverlaySurfaceView.java \
                   app/src/main/assets/agent.js; do
            test -s "$f" && echo "✓ $f" || (echo "✗ $f" && exit 1)
          done
          grep -q "gum_init_embedded" app/src/main/cpp/tool/native-lib.cpp
          grep -q "TYPE_APPLICATION_PANEL" app/src/main/java/com/menu/imgui/Helper.java
          grep -q "TYPE_CLASS_NUMBER" app/src/main/java/com/menu/imgui/OverlaySurfaceView.java
          grep -q "CharsDecimal" app/src/main/cpp/tool/native-lib.cpp

      - name: Write CMakeLists.txt
        run: |
          cat > app/src/main/cpp/CMakeLists.txt << 'EOF'
          cmake_minimum_required(VERSION 3.22.1)
          project("tool")
          set(CMAKE_CXX_STANDARD 17)
          if(NOT CMAKE_BUILD_TYPE)
              set(CMAKE_BUILD_TYPE Release CACHE STRING "" FORCE)
          endif()
          set(CMAKE_C_FLAGS_RELEASE "-Oz -DNDEBUG -ffunction-sections -fdata-sections -fvisibility=hidden")
          set(CMAKE_CXX_FLAGS_RELEASE "-Oz -DNDEBUG -ffunction-sections -fdata-sections -fvisibility=hidden")
          if(${ANDROID_ABI} STREQUAL "arm64-v8a")
              set(FRIDA_DIR /tmp/frida-built/arm64-v8a)
          elseif(${ANDROID_ABI} STREQUAL "armeabi-v7a")
              set(FRIDA_DIR /tmp/frida-built/armeabi-v7a)
          else()
              message(FATAL_ERROR "Unsupported ABI")
          endif()
          include_directories(${FRIDA_DIR}/include ${FRIDA_DIR}/include/glib-2.0)
          add_library(frida-gumjs STATIC IMPORTED)
          set_target_properties(frida-gumjs PROPERTIES IMPORTED_LOCATION ${FRIDA_DIR}/lib/libfrida-gumjs.a)
          include_directories(imgui imgui/backends tool)
          add_library(tool SHARED
              tool/native-lib.cpp
              imgui/imgui.cpp
              imgui/imgui_draw.cpp
              imgui/imgui_tables.cpp
              imgui/imgui_widgets.cpp
              imgui/backends/imgui_impl_android.cpp
              imgui/backends/imgui_impl_opengl3.cpp)
          target_link_options(tool PRIVATE -Wl,--gc-sections -Wl,--exclude-libs,ALL -Wl,--strip-all)
          target_link_libraries(tool frida-gumjs android log EGL GLESv3 dl)
          EOF

      - name: Write build.gradle.kts
        run: |
          cat > app/build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.tool"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.tool"
                  minSdk = 27
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
                  externalNativeBuild {
                      cmake {
                          cppFlags += "-std=c++17"
                          arguments += listOf("-DCMAKE_BUILD_TYPE=Release")
                      }
                  }
                  ndk { abiFilters += listOf("arm64-v8a", "armeabi-v7a") }
              }
              externalNativeBuild {
                  cmake {
                      path = file("src/main/cpp/CMakeLists.txt")
                      version = "3.22.1"
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              buildTypes {
                  getByName("debug") {
                      externalNativeBuild {
                          cmake { arguments += listOf("-DCMAKE_BUILD_TYPE=Release") }
                      }
                  }
              }
              packaging { jniLibs { useLegacyPackaging = true } }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
          }
          EOF

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Build APK
        run: |
          if [ ! -s gradlew ]; then gradle wrapper --gradle-version 8.5; fi
          chmod +x gradlew
          rm -rf app/.cxx app/build .gradle
          ./gradlew :app:assembleDebug --no-build-cache --stacktrace

      - name: Zipalign APK (critical for injected .so loading)
        run: |
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          echo "Original APK: $APK"
          cp "$APK" /tmp/app-unaligned.apk
          zipalign -p -f 4 /tmp/app-unaligned.apk "$APK"
          echo "✓ zipaligned with -p 4"
          unzip -l "$APK" | grep "\.so"

      - name: Strip + size report
        run: |
          NDK_STRIP=$(find $NDK_PATH -name "llvm-strip" | head -1)
          for SO in $(find app/build -name "libtool.so"); do
            ABI=$(echo "$SO" | grep -oE "(arm64-v8a|armeabi-v7a)")
            echo "=== $ABI ==="
            echo "Before: $(stat -c%s "$SO" | numfmt --to=iec)"
            $NDK_STRIP --strip-all "$SO"
            SIZE=$(stat -c%s "$SO")
            echo "After: $(awk "BEGIN {printf \"%.2f\", $SIZE/1048576}") MB"
          done

      - name: Extract artifacts
        run: |
          mkdir -p /tmp/so-out
          for SO in $(find app/build -name "libtool.so"); do
            ABI=$(echo "$SO" | grep -oE "(arm64-v8a|armeabi-v7a)")
            cp "$SO" "/tmp/so-out/libtool-${ABI}.so"
          done
          ls -lah /tmp/so-out/

      - uses: actions/upload-artifact@v4
        with:
          name: libtool-slim
          path: /tmp/so-out/*.so

      - uses: actions/upload-artifact@v4
        with:
          name: app-slim
          path: app/build/outputs/apk/debug/*.apk

      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "fix: patch dedup, numeric input, overlay touch/lifecycle, zipalign [skip ci]"
          git push
