name: Frida Slim (Source .a + Devkit headers)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cleanup old workflows
        run: |
          cd .github/workflows
          for f in *.yml *.yaml; do
            if [ -f "$f" ] && [ "$f" != "frida-from-source.yml" ]; then
              rm -f "$f"
            fi
          done
          ls -la

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pip ninja-build pkg-config libglib2.0-dev rsync
          pip3 install --quiet --upgrade pip
          pip3 install --quiet meson

      - name: Detect NDK
        run: |
          NDK_DIR=$(ls -d $ANDROID_HOME/ndk/* 2>/dev/null | head -1)
          echo "NDK_PATH=$NDK_DIR" >> $GITHUB_ENV

      - name: Download Frida devkit (HEADERS ONLY - small)
        run: |
          set -e
          FRIDA_VERSION="17.1.0"
          BASE="https://github.com/frida/frida/releases/download/${FRIDA_VERSION}"

          # arm64 devkit (headers)
          wget -q "${BASE}/frida-gumjs-devkit-${FRIDA_VERSION}-android-arm64.tar.xz" -O /tmp/dk64.tar.xz
          mkdir -p /tmp/dk64
          tar -xf /tmp/dk64.tar.xz -C /tmp/dk64

          # armv7 devkit (headers)
          wget -q "${BASE}/frida-gumjs-devkit-${FRIDA_VERSION}-android-arm.tar.xz" -O /tmp/dk32.tar.xz
          mkdir -p /tmp/dk32
          tar -xf /tmp/dk32.tar.xz -C /tmp/dk32

          echo "=== arm64 devkit layout ==="
          find /tmp/dk64 -maxdepth 2 -type d | head -10
          echo "=== frida-gumjs.h present? ==="
          find /tmp/dk64 -name "frida-gumjs.h"

      - name: Clone Frida source
        run: |
          git clone --recursive --depth 1 --branch 17.1.0 \
            https://github.com/frida/frida.git /tmp/frida
          cd /tmp/frida
          cat > config.mk << 'EOF'
          FRIDA_V8 = disabled
          FRIDA_DATABASE = disabled
          FRIDA_CONNECTIVITY = disabled
          FRIDA_OBJC_BRIDGE = disabled
          FRIDA_SWIFT_BRIDGE = disabled
          FRIDA_DEBUG = no
          EOF
          cat config.mk

      - name: Build Frida arm64 (.a only)
        timeout-minutes: 60
        run: |
          cd /tmp/frida
          export ANDROID_NDK_ROOT="$NDK_PATH"
          export FRIDA_HOST=android-arm64
          echo "=== Building android-arm64 ==="
          make -j$(nproc) 2>&1 | tail -20 || echo "make exited non-zero (python failure ignored)"
          echo "=== .a files ==="
          find build -name "libfrida-gumjs*.a" -exec ls -lah {} \; 2>/dev/null || true

      - name: Stage arm64
        run: |
          set -e
          DEST=/tmp/frida-built/arm64-v8a
          rm -rf "$DEST"; mkdir -p "$DEST/lib" "$DEST/include"

          # Library from SOURCE build (slim)
          LIB=$(find /tmp/frida/build -name "libfrida-gumjs*.a" ! -name "*inspector*" 2>/dev/null | head -1)
          if [ -z "$LIB" ]; then
            LIB=$(find /tmp/frida/build -name "libfrida-gumjs*.a" ! -name "*inspector*" -exec ls -S {} + 2>/dev/null | head -1 | awk '{print $NF}')
          fi
          if [ -z "$LIB" ]; then
            echo "FATAL: no gumjs lib"; find /tmp/frida/build -name "*.a" | head -10; exit 1
          fi
          cp -v "$LIB" "$DEST/lib/libfrida-gumjs.a"

          # Headers from DEVKIT (reliable)
          DK_INC=$(find /tmp/dk64 -type d -name "include" | head -1)
          if [ -z "$DK_INC" ]; then
            echo "FATAL: devkit include dir not found"; find /tmp/dk64 -maxdepth 3 -type d | head; exit 1
          fi
          cp -rv "$DK_INC"/* "$DEST/include/"

          echo "=== Staged arm64 ==="
          ls -lah "$DEST/lib/"
          echo "--- include root ---"
          ls "$DEST/include/" | head -20
          echo "--- gumjs header check ---"
          test -f "$DEST/include/frida-gumjs.h" && echo "✓ frida-gumjs.h" || (echo "✗ MISSING" && exit 1)

      - name: Build Frida armv7 (.a only)
        timeout-minutes: 60
        run: |
          cd /tmp/frida
          rm -rf build
          export ANDROID_NDK_ROOT="$NDK_PATH"
          export FRIDA_HOST=android-arm
          echo "=== Building android-arm ==="
          make -j$(nproc) 2>&1 | tail -20 || echo "make exited non-zero (ignored)"
          find build -name "libfrida-gumjs*.a" -exec ls -lah {} \; 2>/dev/null || true

      - name: Stage armv7
        run: |
          set -e
          DEST=/tmp/frida-built/armeabi-v7a
          rm -rf "$DEST"; mkdir -p "$DEST/lib" "$DEST/include"

          LIB=$(find /tmp/frida/build -name "libfrida-gumjs*.a" ! -name "*inspector*" 2>/dev/null | head -1)
          [ -z "$LIB" ] && echo "FATAL: no gumjs lib arm" && exit 1
          cp -v "$LIB" "$DEST/lib/libfrida-gumjs.a"

          DK_INC=$(find /tmp/dk32 -type d -name "include" | head -1)
          [ -z "$DK_INC" ] && echo "FATAL: arm devkit not found" && exit 1
          cp -rv "$DK_INC"/* "$DEST/include/"

          test -f "$DEST/include/frida-gumjs.h" && echo "✓ frida-gumjs.h" || exit 1

      - name: Verify sources exist
        run: |
          for f in app/src/main/cpp/tool/native-lib.cpp \
                   app/src/main/cpp/tool/dex_data.h \
                   app/src/main/java/com/menu/imgui/Helper.java \
                   app/src/main/java/com/menu/imgui/OverlaySurfaceView.java; do
            test -s "$f" && echo "✓ $f" || (echo "✗ $f" && exit 1)
          done
          grep -q "gum_init_embedded" app/src/main/cpp/tool/native-lib.cpp
          grep -q "gum_script_backend_create_sync" app/src/main/cpp/tool/native-lib.cpp

      - name: Write CMakeLists.txt
        run: |
          cat > app/src/main/cpp/CMakeLists.txt << 'EOF'
          cmake_minimum_required(VERSION 3.22.1)
          project("tool")
          set(CMAKE_CXX_STANDARD 17)

          if(NOT CMAKE_BUILD_TYPE)
              set(CMAKE_BUILD_TYPE Release CACHE STRING "" FORCE)
          endif()
          set(CMAKE_C_FLAGS_RELEASE "-Oz -DNDEBUG -ffunction-sections -fdata-sections -fvisibility=hidden")
          set(CMAKE_CXX_FLAGS_RELEASE "-Oz -DNDEBUG -ffunction-sections -fdata-sections -fvisibility=hidden")

          if(${ANDROID_ABI} STREQUAL "arm64-v8a")
              set(FRIDA_DIR /tmp/frida-built/arm64-v8a)
          elseif(${ANDROID_ABI} STREQUAL "armeabi-v7a")
              set(FRIDA_DIR /tmp/frida-built/armeabi-v7a)
          else()
              message(FATAL_ERROR "Unsupported ABI")
          endif()

          if(NOT EXISTS "${FRIDA_DIR}/lib/libfrida-gumjs.a")
              message(FATAL_ERROR "Frida lib not found")
          endif()

          # Cover all possible header locations from devkit
          include_directories(
              ${FRIDA_DIR}/include
              ${FRIDA_DIR}/include/gum
              ${FRIDA_DIR}/include/glib-2.0
              ${FRIDA_DIR}/include/glib-config
          )

          add_library(frida-gumjs STATIC IMPORTED)
          set_target_properties(frida-gumjs PROPERTIES
              IMPORTED_LOCATION ${FRIDA_DIR}/lib/libfrida-gumjs.a)

          include_directories(imgui imgui/backends tool)

          add_library(tool SHARED
              tool/native-lib.cpp
              imgui/imgui.cpp
              imgui/imgui_draw.cpp
              imgui/imgui_tables.cpp
              imgui/imgui_widgets.cpp
              imgui/backends/imgui_impl_android.cpp
              imgui/backends/imgui_impl_opengl3.cpp)

          target_link_options(tool PRIVATE
              -Wl,--gc-sections
              -Wl,--exclude-libs,ALL
              -Wl,--strip-all)

          target_link_libraries(tool frida-gumjs android log EGL GLESv3 dl)
          EOF

      - name: Write app/build.gradle.kts
        run: |
          cat > app/build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.tool"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.tool"
                  minSdk = 27
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
                  externalNativeBuild {
                      cmake {
                          cppFlags += "-std=c++17"
                          arguments += listOf("-DCMAKE_BUILD_TYPE=Release")
                      }
                  }
                  ndk { abiFilters += listOf("arm64-v8a", "armeabi-v7a") }
              }
              externalNativeBuild {
                  cmake {
                      path = file("src/main/cpp/CMakeLists.txt")
                      version = "3.22.1"
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              buildTypes {
                  getByName("debug") {
                      externalNativeBuild {
                          cmake { arguments += listOf("-DCMAKE_BUILD_TYPE=Release") }
                      }
                  }
              }
              packaging { jniLibs { useLegacyPackaging = true } }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
          }
          EOF

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Build APK
        run: |
          if [ ! -s gradlew ]; then gradle wrapper --gradle-version 8.5; fi
          chmod +x gradlew
          rm -rf app/.cxx app/build .gradle
          ./gradlew :app:assembleDebug --no-build-cache --stacktrace

      - name: Strip .so + size report
        run: |
          NDK_STRIP=$(find $NDK_PATH -name "llvm-strip" | head -1)
          for SO in $(find app/build -name "libtool.so"); do
            ABI=$(echo "$SO" | grep -oE "(arm64-v8a|armeabi-v7a)")
            echo "=== $ABI ==="
            echo "Before: $(stat -c%s "$SO" | numfmt --to=iec)"
            $NDK_STRIP --strip-all "$SO"
            SIZE=$(stat -c%s "$SO")
            MB=$(awk "BEGIN {printf \"%.2f\", $SIZE/1048576}")
            echo "After:  ${MB} MB"
          done

      - name: Show APK breakdown
        run: |
          APK=$(find app/build -name "*.apk" | head -1)
          echo "APK: $(ls -lah "$APK" | awk '{print $5}')"
          unzip -l "$APK" | grep "\.so"

      - name: Extract artifacts
        run: |
          mkdir -p /tmp/so-out
          for SO in $(find app/build -name "libtool.so"); do
            ABI=$(echo "$SO" | grep -oE "(arm64-v8a|armeabi-v7a)")
            cp "$SO" "/tmp/so-out/libtool-${ABI}.so"
          done
          ls -lah /tmp/so-out/

      - uses: actions/upload-artifact@v4
        with:
          name: libtool-slim
          path: /tmp/so-out/*.so

      - uses: actions/upload-artifact@v4
        with:
          name: app-slim
          path: app/build/outputs/apk/debug/*.apk

      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "fix: devkit headers + source .a, guaranteed frida-gumjs.h [skip ci]"
          git push
