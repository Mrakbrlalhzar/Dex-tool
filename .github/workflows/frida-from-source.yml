name: Frida GumJS Slim (Source)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cleanup old workflows
        run: |
          cd .github/workflows
          for f in *.yml *.yaml; do
            if [ -f "$f" ] && [ "$f" != "frida-from-source.yml" ]; then
              rm -f "$f"
            fi
          done
          ls -la

      - name: Install dependencies (NDK r25c + Meson + Node.js)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pip ninja-build pkg-config libglib2.0-dev unzip curl
          pip3 install --quiet --upgrade pip
          pip3 install --quiet meson

          # NDK r25c
          wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux.zip -O /tmp/ndk-r25c.zip
          unzip -q /tmp/ndk-r25c.zip -d /tmp/
          echo "NDK_PATH=/tmp/android-ndk-r25c" >> $GITHUB_ENV
          echo "✓ NDK r25c installed"

          # Node.js 20 for frida-compile
          curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
          sudo apt-get install -y nodejs
          node --version

      - name: Download Frida devkit (HEADERS ONLY)
        run: |
          set -e
          FRIDA_VERSION="17.1.0"
          BASE="https://github.com/frida/frida/releases/download/${FRIDA_VERSION}"
          wget -q "${BASE}/frida-gumjs-devkit-${FRIDA_VERSION}-android-arm64.tar.xz" -O /tmp/dk64.tar.xz
          mkdir -p /tmp/dk64 && tar -xf /tmp/dk64.tar.xz -C /tmp/dk64
          wget -q "${BASE}/frida-gumjs-devkit-${FRIDA_VERSION}-android-arm.tar.xz" -O /tmp/dk32.tar.xz
          mkdir -p /tmp/dk32 && tar -xf /tmp/dk32.tar.xz -C /tmp/dk32
          echo "=== arm64 devkit structure ==="
          find /tmp/dk64 -maxdepth 3 -type f | head -20

      - name: Clone frida-gum source
        run: |
          git clone --recursive --depth 1 --branch 17.1.0 \
            https://github.com/frida/frida-gum.git /tmp/frida-gum
          cd /tmp/frida-gum
          echo "=== frida-gum cloned ==="
          ls meson.options

      - name: Create Meson cross files
        run: |
          set -e
          NDK="$NDK_PATH"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64"

          # arm64-v8a cross file
          cat > /tmp/android_arm64.ini << EOF
          [binaries]
          c = '$TOOLCHAIN/bin/aarch64-linux-android27-clang'
          cpp = '$TOOLCHAIN/bin/aarch64-linux-android27-clang++'
          ar = '$TOOLCHAIN/bin/llvm-ar'
          strip = '$TOOLCHAIN/bin/llvm-strip'
          pkgconfig = 'pkg-config'

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'arm64-v8a'
          endian = 'little'
          EOF

          # armeabi-v7a cross file
          cat > /tmp/android_arm.ini << EOF
          [binaries]
          c = '$TOOLCHAIN/bin/armv7a-linux-androideabi27-clang'
          cpp = '$TOOLCHAIN/bin/armv7a-linux-androideabi27-clang++'
          ar = '$TOOLCHAIN/bin/llvm-ar'
          strip = '$TOOLCHAIN/bin/llvm-strip'
          pkgconfig = 'pkg-config'

          [host_machine]
          system = 'android'
          cpu_family = 'arm'
          cpu = 'armeabi-v7a'
          endian = 'little'
          EOF

          echo "✓ Cross files created"
          cat /tmp/android_arm64.ini

      - name: Build frida-gumjs for android-arm64
        timeout-minutes: 60
        run: |
          cd /tmp/frida-gum
          export ANDROID_NDK_ROOT="$NDK_PATH"
          echo "=== Meson setup for arm64 ==="
          meson setup build-arm64 --cross-file /tmp/android_arm64.ini \
            -Ddevkits=gum,gumjs \
            -Dgumjs=enabled \
            -Dquickjs=enabled \
            -Dv8=disabled \
            -Ddatabase=disabled \
            -Dinspector=disabled \
            -Dtests=disabled \
            -Ddefault_library=static \
            -Doptimization=z \
            -Dstrip=true
          echo "=== Build ==="
          ninja -C build-arm64
          echo "=== .a files ==="
          find build-arm64 -name "libfrida-gumjs*.a" -exec ls -lah {} \; 2>/dev/null

      - name: Stage arm64
        run: |
          set -e
          DEST=/tmp/frida-built/arm64-v8a
          rm -rf "$DEST"; mkdir -p "$DEST/lib" "$DEST/include"

          LIB=$(find /tmp/frida-gum/build-arm64 -name "libfrida-gumjs*.a" ! -name "*inspector*" | head -1)
          [ -z "$LIB" ] && echo "FATAL: no gumjs lib for arm64" && exit 1
          cp -v "$LIB" "$DEST/lib/libfrida-gumjs.a"

          GUMJS_H=$(find /tmp/dk64 -name "frida-gumjs.h" | head -1)
          GUM_H=$(find /tmp/dk64 -name "frida-gum.h" | head -1)
          [ -n "$GUMJS_H" ] && cp -v "$GUMJS_H" "$DEST/include/frida-gumjs.h"
          [ -n "$GUM_H" ] && cp -v "$GUM_H" "$DEST/include/frida-gum.h"
          GLIB_DIR=$(find /tmp/dk64 -type d -name "glib-2.0" | head -1)
          [ -n "$GLIB_DIR" ] && cp -rv "$GLIB_DIR" "$DEST/include/glib-2.0"

          test -f "$DEST/include/frida-gumjs.h" && echo "✓ frida-gumjs.h" || (echo "✗ MISSING" && exit 1)

      - name: Build frida-gumjs for android-arm
        timeout-minutes: 60
        run: |
          cd /tmp/frida-gum
          export ANDROID_NDK_ROOT="$NDK_PATH"
          echo "=== Meson setup for arm ==="
          meson setup build-arm --cross-file /tmp/android_arm.ini \
            -Ddevkits=gum,gumjs \
            -Dgumjs=enabled \
            -Dquickjs=enabled \
            -Dv8=disabled \
            -Ddatabase=disabled \
            -Dinspector=disabled \
            -Dtests=disabled \
            -Ddefault_library=static \
            -Doptimization=z \
            -Dstrip=true
          echo "=== Build ==="
          ninja -C build-arm
          echo "=== .a files ==="
          find build-arm -name "libfrida-gumjs*.a" -exec ls -lah {} \; 2>/dev/null

      - name: Stage armv7
        run: |
          set -e
          DEST=/tmp/frida-built/armeabi-v7a
          rm -rf "$DEST"; mkdir -p "$DEST/lib" "$DEST/include"

          LIB=$(find /tmp/frida-gum/build-arm -name "libfrida-gumjs*.a" ! -name "*inspector*" | head -1)
          [ -z "$LIB" ] && echo "FATAL: no gumjs lib for armv7" && exit 1
          cp -v "$LIB" "$DEST/lib/libfrida-gumjs.a"

          GUMJS_H=$(find /tmp/dk32 -name "frida-gumjs.h" | head -1)
          GUM_H=$(find /tmp/dk32 -name "frida-gum.h" | head -1)
          [ -n "$GUMJS_H" ] && cp -v "$GUMJS_H" "$DEST/include/frida-gumjs.h"
          [ -n "$GUM_H" ] && cp -v "$GUM_H" "$DEST/include/frida-gum.h"
          GLIB_DIR=$(find /tmp/dk32 -type d -name "glib-2.0" | head -1)
          [ -n "$GLIB_DIR" ] && cp -rv "$GLIB_DIR" "$DEST/include/glib-2.0"

          test -f "$DEST/include/frida-gumjs.h" && echo "✓ frida-gumjs.h" || exit 1

      - name: Compile agent.js with Java bridge
        run: |
          mkdir -p /tmp/agent
          cd /tmp/agent
          npm init -y
          npm install frida-java-bridge
          cat > agent.js << 'EOF'
          import Java from "frida-java-bridge";
          Java.perform(function() {
            console.log("[*] Patch Agent Loaded");
            recv(function(msg) {
              console.log("[C++] -> [JS]: " + msg);
              try {
                var cmd = JSON.parse(msg);
                if (cmd.action === "patchMethod") {
                  var cls = Java.use(cmd.className);
                  var m = cls[cmd.methodName].overloads[0];
                  m.implementation = function() { return cmd.returnValue; };
                  console.log("[*] Patched " + cmd.className + "." + cmd.methodName);
                }
              } catch (e) { console.log("[!] " + e.message); }
            });
            send({type: "ready"});
          });
          EOF
          npx frida-compile agent.js -o agent-compiled.js -S -c
          mkdir -p "$GITHUB_WORKSPACE/app/src/main/assets"
          cp agent-compiled.js "$GITHUB_WORKSPACE/app/src/main/assets/agent.js"
          echo "✓ agent.js compiled and copied to assets"

      - name: Verify sources
        run: |
          for f in app/src/main/cpp/tool/native-lib.cpp \
                   app/src/main/cpp/tool/dex_data.h \
                   app/src/main/java/com/menu/imgui/Helper.java \
                   app/src/main/java/com/menu/imgui/OverlaySurfaceView.java \
                   app/src/main/assets/agent.js; do
            test -s "$f" && echo "✓ $f" || (echo "✗ $f" && exit 1)
          done
          grep -q "gum_init_embedded" app/src/main/cpp/tool/native-lib.cpp
          grep -q "gum_script_backend_create_sync" app/src/main/cpp/tool/native-lib.cpp

      - name: Write CMakeLists.txt
        run: |
          cat > app/src/main/cpp/CMakeLists.txt << 'EOF'
          cmake_minimum_required(VERSION 3.22.1)
          project("tool")
          set(CMAKE_CXX_STANDARD 17)
          if(NOT CMAKE_BUILD_TYPE)
              set(CMAKE_BUILD_TYPE Release CACHE STRING "" FORCE)
          endif()
          set(CMAKE_C_FLAGS_RELEASE "-Oz -DNDEBUG -ffunction-sections -fdata-sections -fvisibility=hidden")
          set(CMAKE_CXX_FLAGS_RELEASE "-Oz -DNDEBUG -ffunction-sections -fdata-sections -fvisibility=hidden")
          if(${ANDROID_ABI} STREQUAL "arm64-v8a")
              set(FRIDA_DIR /tmp/frida-built/arm64-v8a)
          elseif(${ANDROID_ABI} STREQUAL "armeabi-v7a")
              set(FRIDA_DIR /tmp/frida-built/armeabi-v7a)
          else()
              message(FATAL_ERROR "Unsupported ABI")
          endif()
          if(NOT EXISTS "${FRIDA_DIR}/lib/libfrida-gumjs.a")
              message(FATAL_ERROR "Frida lib not found")
          endif()
          include_directories(${FRIDA_DIR}/include ${FRIDA_DIR}/include/glib-2.0)
          add_library(frida-gumjs STATIC IMPORTED)
          set_target_properties(frida-gumjs PROPERTIES IMPORTED_LOCATION ${FRIDA_DIR}/lib/libfrida-gumjs.a)
          include_directories(imgui imgui/backends tool)
          add_library(tool SHARED
              tool/native-lib.cpp
              imgui/imgui.cpp
              imgui/imgui_draw.cpp
              imgui/imgui_tables.cpp
              imgui/imgui_widgets.cpp
              imgui/backends/imgui_impl_android.cpp
              imgui/backends/imgui_impl_opengl3.cpp)
          target_link_options(tool PRIVATE -Wl,--gc-sections -Wl,--exclude-libs,ALL -Wl,--strip-all)
          target_link_libraries(tool frida-gumjs android log EGL GLESv3 dl)
          EOF

      - name: Write app/build.gradle.kts
        run: |
          cat > app/build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.tool"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.tool"
                  minSdk = 27
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
                  externalNativeBuild {
                      cmake {
                          cppFlags += "-std=c++17"
                          arguments += listOf("-DCMAKE_BUILD_TYPE=Release")
                      }
                  }
                  ndk { abiFilters += listOf("arm64-v8a", "armeabi-v7a") }
              }
              externalNativeBuild {
                  cmake {
                      path = file("src/main/cpp/CMakeLists.txt")
                      version = "3.22.1"
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              buildTypes {
                  getByName("debug") {
                      externalNativeBuild {
                          cmake { arguments += listOf("-DCMAKE_BUILD_TYPE=Release") }
                      }
                  }
              }
              packaging { jniLibs { useLegacyPackaging = true } }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
          }
          EOF

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Build APK
        run: |
          if [ ! -s gradlew ]; then gradle wrapper --gradle-version 8.5; fi
          chmod +x gradlew
          rm -rf app/.cxx app/build .gradle
          ./gradlew :app:assembleDebug --no-build-cache --stacktrace

      - name: Strip .so + size report
        run: |
          NDK_STRIP=$(find $NDK_PATH -name "llvm-strip" | head -1)
          for SO in $(find app/build -name "libtool.so"); do
            ABI=$(echo "$SO" | grep -oE "(arm64-v8a|armeabi-v7a)")
            echo "=== $ABI ==="
            echo "Before: $(stat -c%s "$SO" | numfmt --to=iec)"
            $NDK_STRIP --strip-all "$SO"
            SIZE=$(stat -c%s "$SO")
            MB=$(awk "BEGIN {printf \"%.2f\", $SIZE/1048576}")
            echo "After:  ${MB} MB"
          done

      - name: Show APK breakdown
        run: |
          APK=$(find app/build -name "*.apk" | head -1)
          echo "APK: $(ls -lah "$APK" | awk '{print $5}')"
          unzip -l "$APK" | grep "\.so"

      - name: Extract artifacts
        run: |
          mkdir -p /tmp/so-out
          for SO in $(find app/build -name "libtool.so"); do
            ABI=$(echo "$SO" | grep -oE "(arm64-v8a|armeabi-v7a)")
            cp "$SO" "/tmp/so-out/libtool-${ABI}.so"
          done
          ls -lah /tmp/so-out/

      - uses: actions/upload-artifact@v4
        with:
          name: libtool-slim
          path: /tmp/so-out/*.so

      - uses: actions/upload-artifact@v4
        with:
          name: app-slim
          path: app/build/outputs/apk/debug/*.apk

      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "fix: build frida-gum directly with cross-file, correct agent.js path [skip ci]"
          git push
