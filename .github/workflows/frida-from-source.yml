name: "Frida GumJS Slim (Source)"

on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pip ninja-build pkg-config libglib2.0-dev unzip curl zipalign xxd
          pip3 install --quiet --upgrade pip
          pip3 install --quiet meson
          wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux.zip -O /tmp/ndk-r25c.zip
          unzip -q /tmp/ndk-r25c.zip -d /tmp/
          echo "NDK_PATH=/tmp/android-ndk-r25c" >> $GITHUB_ENV
          curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
          sudo apt-get install -y nodejs

      - name: Clone Dobby
        run: |
          git clone --recursive --depth 1 https://github.com/jmpews/Dobby.git app/src/main/cpp/Include/Dobby
          ls app/src/main/cpp/Include/Dobby

      - name: Download Frida devkit
        run: |
          set -e
          V=17.1.0
          B="https://github.com/frida/frida/releases/download/$V"
          wget -q "$B/frida-gumjs-devkit-$V-android-arm64.tar.xz" -O /tmp/dk64.tar.xz
          mkdir -p /tmp/dk64 && tar -xf /tmp/dk64.tar.xz -C /tmp/dk64
          wget -q "$B/frida-gumjs-devkit-$V-android-arm.tar.xz" -O /tmp/dk32.tar.xz
          mkdir -p /tmp/dk32 && tar -xf /tmp/dk32.tar.xz -C /tmp/dk32

      - name: Clone frida-gum
        run: |
          git clone --recursive --depth 1 --branch 17.1.0 https://github.com/frida/frida-gum.git /tmp/frida-gum
          cd /tmp/frida-gum
          sed -i '1i void glib_init(void);' bindings/gumjs/gumquickcompile.c

      - name: Build arm64
        run: |
          set -o pipefail
          cd /tmp/frida-gum
          export ANDROID_NDK_ROOT="$NDK_PATH"
          rm -rf build
          ./configure --host=android-arm64 -- -Ddevkits=gum,gumjs -Dgumjs=enabled -Dquickjs=enabled -Dv8=disabled -Ddatabase=disabled -Dtests=disabled -Ddiet=true -Db_ndebug=true -Ddefault_library=static -Dlibunwind:minidebuginfo=disabled -Dlibdwarf:decompression=false 2>&1 | tee /tmp/a64.log
          [ ${PIPESTATUS[0]} -ne 0 ] && { tail -60 /tmp/a64.log; exit 1; }
          make -j$(nproc) 2>&1 | tee -a /tmp/a64.log
          LIB=$(find build -name "libfrida-gumjs.a" | head -1)
          [ -z "$LIB" ] && LIB=$(find build -path "*devkit*" -name "libfrida-gumjs*.a" ! -name "*inspector*" | head -1)
          [ -z "$LIB" ] && { echo "NO_LIB"; exit 1; }
          D=/tmp/frida-built/arm64-v8a
          rm -rf "$D"; mkdir -p "$D/lib" "$D/include"
          cp -v "$LIB" "$D/lib/libfrida-gumjs.a"
          cp -v "$(find /tmp/dk64 -name 'frida-gumjs.h' | head -1)" "$D/include/frida-gumjs.h"
          G=$(find /tmp/dk64 -name "frida-gum.h" | head -1)
          [ -n "$G" ] && cp -v "$G" "$D/include/frida-gum.h"
          GLIB_DIR=$(find /tmp/dk64 -type d -name 'glib-2.0' 2>/dev/null | head -1)
          [ -n "$GLIB_DIR" ] && cp -rv "$GLIB_DIR" "$D/include/glib-2.0"

      - name: Build armv7
        run: |
          set -o pipefail
          cd /tmp/frida-gum
          export ANDROID_NDK_ROOT="$NDK_PATH"
          rm -rf build
          ./configure --host=android-arm -- -Ddevkits=gum,gumjs -Dgumjs=enabled -Dquickjs=enabled -Dv8=disabled -Ddatabase=disabled -Dtests=disabled -Ddiet=true -Db_ndebug=true -Ddefault_library=static -Dlibunwind:minidebuginfo=disabled -Dlibdwarf:decompression=false 2>&1 | tee /tmp/a32.log
          [ ${PIPESTATUS[0]} -ne 0 ] && { tail -60 /tmp/a32.log; exit 1; }
          make -j$(nproc) 2>&1 | tee -a /tmp/a32.log
          LIB=$(find build -name "libfrida-gumjs.a" | head -1)
          [ -z "$LIB" ] && LIB=$(find build -path "*devkit*" -name "libfrida-gumjs*.a" ! -name "*inspector*" | head -1)
          [ -z "$LIB" ] && { echo "NO_LIB"; exit 1; }
          D=/tmp/frida-built/armeabi-v7a
          rm -rf "$D"; mkdir -p "$D/lib" "$D/include"
          cp -v "$LIB" "$D/lib/libfrida-gumjs.a"
          cp -v "$(find /tmp/dk32 -name 'frida-gumjs.h' | head -1)" "$D/include/frida-gumjs.h"
          G=$(find /tmp/dk32 -name "frida-gum.h" | head -1)
          [ -n "$G" ] && cp -v "$G" "$D/include/frida-gum.h"
          GLIB_DIR=$(find /tmp/dk32 -type d -name 'glib-2.0' 2>/dev/null | head -1)
          [ -n "$GLIB_DIR" ] && cp -rv "$GLIB_DIR" "$D/include/glib-2.0"

      - name: Write Include/ImGui.h
        run: |
          mkdir -p app/src/main/cpp/Include
          cat > app/src/main/cpp/Include/ImGui.h <<'IMGUIEOF'
          #pragma once
          #include <EGL/egl.h>
          #include <android/log.h>
          #include <pthread.h>
          #include <unistd.h>
          #include <cstring>
          #include "imgui.h"
          #include "imgui_impl_opengl3.h"
          #include "imgui_impl_android.h"
          #include "Dobby/include/dobby.h"
          #define LOGI(...) __android_log_print(ANDROID_LOG_INFO, "DexTool", __VA_ARGS__)
          using swapbuffers_orig = EGLBoolean (*)(EGLDisplay, EGLSurface);
          static swapbuffers_orig o_swapbuffers = nullptr;
          static bool isInitialized = false;
          static void (*menuAddress)() = nullptr;
          static bool isLibraryLoaded(const char *name) {
              FILE *fp = fopen("/proc/self/maps", "rt");
              if (!fp) return false;
              char line[512];
              while (fgets(line, sizeof(line), fp)) { if (strstr(line, name)) { fclose(fp); return true; } }
              fclose(fp); return false;
          }
          static EGLBoolean swapbuffers_hook(EGLDisplay dpy, EGLSurface surf) {
              EGLint w, h;
              eglQuerySurface(dpy, surf, EGL_WIDTH, &w);
              eglQuerySurface(dpy, surf, EGL_HEIGHT, &h);
              if (!isInitialized) {
                  ImGui::CreateContext();
                  ImGuiIO& io = ImGui::GetIO();
                  io.DisplaySize = ImVec2((float)w, (float)h);
                  io.IniFilename = nullptr;
                  ImGui_ImplAndroid_Init();
                  ImGui_ImplOpenGL3_Init("#version 300 es");
                  isInitialized = true;
                  LOGI("ImGui initialized %dx%d", w, h);
              }
              ImGui_ImplOpenGL3_NewFrame();
              ImGui_ImplAndroid_NewFrame(w, h);
              ImGui::NewFrame();
              if (menuAddress) menuAddress();
              ImGui::Render();
              ImGui_ImplOpenGL3_RenderDrawData(ImGui::GetDrawData());
              return o_swapbuffers(dpy, surf);
          }
          void *initModMenu(void *menu_addr) {
              menuAddress = (void (*)())menu_addr;
              while (!isLibraryLoaded("libEGL.so")) sleep(1);
              auto swapBuffers = (uintptr_t)DobbySymbolResolver("libEGL.so", "eglSwapBuffers");
              DobbyHook((void*)swapBuffers, (void*)swapbuffers_hook, (void**)&o_swapbuffers);
              LOGI("eglSwapBuffers hooked");
              return nullptr;
          }
          IMGUIEOF

      - name: Write Include/Input.h
        run: |
          cat > app/src/main/cpp/Include/Input.h <<'INPUTEOF'
          #pragma once
          #include <android/input.h>
          #include <cstdint>
          #include "Dobby/include/dobby.h"
          using Input_orig = void (*)(void*, void*, void*);
          static Input_orig o_input = nullptr;
          static void input_hook(void* thiz, void* ex_ab, void* ex_ac) {
              o_input(thiz, ex_ab, ex_ac);
              ImGui_ImplAndroid_HandleInputEvent((AInputEvent*)thiz);
          }
          using Consume_orig = int32_t (*)(void*, void*, bool, long, uint32_t*, AInputEvent**);
          static Consume_orig o_consume = nullptr;
          static int32_t consume_hook(void* thiz, void* factory, bool raw, long seq, uint32_t* flags, AInputEvent** event) {
              int32_t ret = o_consume(thiz, factory, raw, seq, flags, event);
              if (ret == 0 && event && *event) ImGui_ImplAndroid_HandleInputEvent(*event);
              return ret;
          }
          static void hookInput() {
              void* sym = DobbySymbolResolver("libinput.so", "_ZN7android13InputConsumer21initializeMotionEventEPNS_11MotionEventEPKNS_12InputMessageE");
              if (sym) { DobbyHook(sym, (void*)input_hook, (void**)&o_input); LOGI("input hooked (legacy)"); return; }
              sym = DobbySymbolResolver("libinput.so", "_ZN7android13InputConsumer7consumeEPNS_26InputEventFactoryInterfaceEblPjPPNS_10InputEventE");
              if (sym) { DobbyHook(sym, (void*)consume_hook, (void**)&o_consume); LOGI("consume hooked (Android 15+)"); }
          }
          INPUTEOF

      - name: Patch native-lib.cpp (remove old, append DrawMenu + JNI_OnLoad)
        run: |
          python3 - <<'PYEOF'
          import re, pathlib, textwrap
          p = pathlib.Path("app/src/main/cpp/tool/native-lib.cpp")
          s = p.read_text()

          def rm_method(src, pat):
              n = 0
              while True:
                  m = re.search(pat, src)
                  if not m: break
                  i = src.index('{', m.end()-1); d=0; e=-1
                  for k in range(i, len(src)):
                      if src[k]=='{': d+=1
                      elif src[k]=='}':
                          d-=1
                          if d==0: e=k+1; break
                  if e<0: break
                  src = src[:m.start()] + src[e:]; n+=1
              return src, n

          # Remove pollThread, nativeTouch, doInit, doResize
          s, _ = rm_method(s, r'static\s+void\*\s+pollThread\s*\([^)]*\)\s*\{')
          s, _ = rm_method(s, r'extern\s+"C"\s+JNIEXPORT\s+jboolean\s+JNICALL\s+Java_com_menu_imgui_Helper_nativeTouch\s*\([^)]*\)\s*\{')
          s, _ = rm_method(s, r'static\s+void\s+doInit\s*\([^)]*\)\s*\{')
          s, _ = rm_method(s, r'static\s+void\s+doResize\s*\([^)]*\)\s*\{')

          # Remove old JNI_OnLoad (both variants)
          s, _ = rm_method(s, r'extern\s+"C"\s+JNIEXPORT\s+jint\s+JNICALL\s+JNI_OnLoad\s*\([^)]*\)\s*\{')
          s, _ = rm_method(s, r'JNIEXPORT\s+jint\s+JNICALL\s+JNI_OnLoad\s*\([^)]*\)\s*\{')
          s, _ = rm_method(s, r'jint\s+JNICALL\s+JNI_OnLoad\s*\([^)]*\)\s*\{')

          # Strip old JNI VM globals
          s = re.sub(r'(?m)^[ \t]*(?:static\s+)?JavaVM\s*\*\s*gVM[^\n;]*;\s*\n?', '', s)
          s = re.sub(r'(?m)^[ \t]*(?:static\s+)?JavaVM\s*\*\s*g_jvm[^\n;]*;\s*\n?', '', s)
          s = re.sub(r'(?m)^[ \t]*(?:static\s+)?bool\s+g_menuVisible[^\n;]*;\s*\n?', '', s)

          # Fix include paths (use "ImGui.h" not "Include/ImGui.h")
          s = s.replace('#include "Include/ImGui.h"', '#include "ImGui.h"')
          s = s.replace('#include "Include/Input.h"', '#include "Input.h"')

          # Add new includes if not present
          if '#include "ImGui.h"' not in s:
              s = s.replace('#include "dex_data.h"', '#include "dex_data.h"\n#include "ImGui.h"\n#include "Input.h"', 1)

          # Append footer with textwrap.dedent so YAML indentation is safe
          footer = textwrap.dedent(r"""
              // ====== GLOBALS ======
              static JavaVM* gVM = nullptr;
              static JavaVM* g_jvm = nullptr;
              static bool g_menuVisible = true;

              // ====== DRAW MENU ======
              void DrawMenu() {
                  if (!g_menuVisible) return;
                  ImGui::SetNextWindowSize(ImVec2(600, 500), ImGuiCond_FirstUseEver);
                  if (ImGui::Begin("DexTool", &g_menuVisible)) {
                      if (ImGui::BeginTabBar("##tabs")) {
                          if (ImGui::BeginTabItem("Classes")) {
                              if (!gSections.empty()) renderSectionContent(gSections[0]);
                              ImGui::EndTabItem();
                          }
                          if (ImGui::BeginTabItem("Patches")) {
                              renderPatchesTab();
                              ImGui::EndTabItem();
                          }
                          ImGui::EndTabBar();
                      }
                  }
                  ImGui::End();
              }

              // ====== JNI_OnLoad ======
              extern "C" JNIEXPORT jint JNICALL JNI_OnLoad(JavaVM* vm, void*) {
                  gVM = vm;
                  g_jvm = vm;
                  JNIEnv* env = nullptr;
                  if (vm->GetEnv((void**)&env, JNI_VERSION_1_6) != JNI_OK) return JNI_ERR;

                  loadDex(env);

                  std::call_once(frida_once, []() {
                      gum_init_embedded();
                  });
                  init_frida_script();

                  pthread_t t;
                  pthread_create(&t, nullptr, initModMenu, (void*)DrawMenu);
                  hookInput();

                  return JNI_VERSION_1_6;
              }
          """).strip()

          s = s.rstrip() + "\n\n" + footer + "\n"
          p.write_text(s)
          print("native-lib.cpp patched successfully")
          print("JNI_OnLoad count:", s.count("JNI_OnLoad"))
          print("DrawMenu count:", s.count("void DrawMenu()"))
          PYEOF

      - name: Patch Helper.java (remove overlay)
        run: |
          python3 - <<'PYEOF'
          import re, pathlib
          p = pathlib.Path("app/src/main/java/com/menu/imgui/Helper.java")
          s = p.read_text()

          for fname in ['sOverlayWm','sOverlayLp','sDecorContainer','sFabSize','sFabMargin','sOverlayActivity','sMenuOpen']:
              s = re.sub(r'(?m)^[ \t]*(?:private|public|protected)?\s*static\s+(?:final\s+)?[A-Za-z_][\w.<>\[\], ]*\s+' + re.escape(fname) + r'\b[^;\n]*;\s*\n?', '', s)

          def rm_method(src, pat):
              n = 0
              while True:
                  m = re.search(pat, src)
                  if not m: break
                  i = src.index('{', m.end()-1); d=0; e=-1
                  for k in range(i, len(src)):
                      if src[k]=='{': d+=1
                      elif src[k]=='}':
                          d-=1
                          if d==0: e=k+1; break
                  if e<0: break
                  src = src[:m.start()] + src[e:]; n+=1
              return src, n

          s, _ = rm_method(s, r'public\s+static\s+void\s+attach\s*\([^)]*\)\s*\{')
          s, _ = rm_method(s, r'public\s+static\s+void\s+setMenuOpen\s*\([^)]*\)\s*\{')
          s, _ = rm_method(s, r'(?:static|private\s+static|public\s+static)\s+void\s+doAttach\s*\([^)]*\)\s*\{')
          s, _ = rm_method(s, r'private\s+static\s+void\s+registerLifecycle\s*\([^)]*\)\s*\{')

          s = re.sub(r'(?m)^[ \t]*(?:static\s+)?native\s+(?:jboolean|boolean|void)\s+nativeTouch\s*\([^)]*\)\s*;\s*\n?', '', s)

          p.write_text(s)
          print("Helper.java cleaned")
          PYEOF

      - name: Remove OverlaySurfaceView.java
        run: |
          rm -f app/src/main/java/com/menu/imgui/OverlaySurfaceView.java
          echo "Removed OverlaySurfaceView.java"

      - name: Rebuild dex_data.h (Helper only)
        run: |
          set -e
          ANDROID_JAR=$(find "$ANDROID_HOME/platforms" -name "android.jar" | sort -V | tail -1)
          D8=$(find "$ANDROID_HOME/build-tools" -name "d8" | sort -V | tail -1)
          rm -rf /tmp/dex_build /tmp/dex_out
          mkdir -p /tmp/dex_build /tmp/dex_out
          javac -source 8 -target 8 -Xlint:-options -cp "$ANDROID_JAR" -d /tmp/dex_build app/src/main/java/com/menu/imgui/Helper.java 2>&1 | tee /tmp/javac.log
          [ ${PIPESTATUS[0]} -ne 0 ] && { echo "JAVAC_FAILED"; cat /tmp/javac.log; exit 1; }
          "$D8" --min-api 26 --lib "$ANDROID_JAR" --output /tmp/dex_out $(find /tmp/dex_build -name "*.class") 2>&1 | tee /tmp/d8.log
          [ ${PIPESTATUS[0]} -ne 0 ] && { echo "D8_FAILED"; cat /tmp/d8.log; exit 1; }
          xxd -i -n imgui_dex /tmp/dex_out/classes.dex > app/src/main/cpp/tool/dex_data.h
          echo "dex_data.h rebuilt"

      - name: Write CMakeLists.txt
        run: |
          cat > app/src/main/cpp/CMakeLists.txt <<'CMEOF'
          cmake_minimum_required(VERSION 3.22.1)
          project("tool")
          set(CMAKE_CXX_STANDARD 17)
          set(CMAKE_BUILD_TYPE Release)
          set(CMAKE_CXX_FLAGS_RELEASE "-Oz -DNDEBUG -ffunction-sections -fdata-sections -fvisibility=hidden")
          if(${ANDROID_ABI} STREQUAL "arm64-v8a")
              set(FRIDA_DIR /tmp/frida-built/arm64-v8a)
          else()
              set(FRIDA_DIR /tmp/frida-built/armeabi-v7a)
          endif()
          include_directories(${FRIDA_DIR}/include ${FRIDA_DIR}/include/glib-2.0)
          add_library(frida-gumjs STATIC IMPORTED)
          set_target_properties(frida-gumjs PROPERTIES IMPORTED_LOCATION ${FRIDA_DIR}/lib/libfrida-gumjs.a)
          add_subdirectory(Include/Dobby dobby.out)
          include_directories(Include Include/Dobby/include imgui imgui/backends tool)
          add_library(tool SHARED
              tool/native-lib.cpp
              imgui/imgui.cpp imgui/imgui_draw.cpp imgui/imgui_tables.cpp imgui/imgui_widgets.cpp
              imgui/backends/imgui_impl_android.cpp imgui/backends/imgui_impl_opengl3.cpp)
          target_link_options(tool PRIVATE -Wl,--gc-sections -Wl,--exclude-libs,ALL -Wl,--strip-all)
          target_link_libraries(tool dobby frida-gumjs android log EGL GLESv3 dl)
          CMEOF

      - name: Verify
        run: |
          FAIL=0
          test -s app/src/main/cpp/Include/ImGui.h && echo "OK ImGui.h" || { echo "ERR ImGui.h"; FAIL=1; }
          test -s app/src/main/cpp/Include/Input.h && echo "OK Input.h" || { echo "ERR Input.h"; FAIL=1; }
          if [ "$(grep -cF 'JNI_OnLoad' app/src/main/cpp/tool/native-lib.cpp)" -eq 1 ]; then echo "OK exactly 1 JNI_OnLoad"; else echo "ERR JNI_OnLoad count=$(grep -cF 'JNI_OnLoad' app/src/main/cpp/tool/native-lib.cpp)"; FAIL=1; fi
          grep -qF "void DrawMenu()" app/src/main/cpp/tool/native-lib.cpp && echo "OK DrawMenu" || { echo "ERR DrawMenu"; FAIL=1; }
          grep -qF "initModMenu" app/src/main/cpp/tool/native-lib.cpp && echo "OK initModMenu" || { echo "ERR initModMenu"; FAIL=1; }
          grep -qF "hookInput" app/src/main/cpp/tool/native-lib.cpp && echo "OK hookInput" || { echo "ERR hookInput"; FAIL=1; }
          test ! -f app/src/main/java/com/menu/imgui/OverlaySurfaceView.java && echo "OK OverlaySurfaceView removed" || { echo "ERR"; FAIL=1; }
          if grep -qF "sOverlayWm" app/src/main/java/com/menu/imgui/Helper.java; then echo "ERR overlay fields in Helper"; FAIL=1; else echo "OK Helper cleaned"; fi
          [ $FAIL -ne 0 ] && exit 1
          echo "ALL CHECKS PASSED"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Build APK
        run: |
          if [ ! -s gradlew ]; then gradle wrapper --gradle-version 8.5; fi
          chmod +x gradlew
          rm -rf app/.cxx app/build .gradle
          ./gradlew :app:assembleDebug --no-build-cache

      - name: Zipalign
        run: |
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          cp "$APK" /tmp/un.apk
          zipalign -p -f 4 /tmp/un.apk "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: app-slim
          path: app/build/outputs/apk/debug/*.apk

      - name: Commit
        if: always()
        run: |
          git config user.name "gh"
          git config user.email "gh@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "feat: migrate to eglSwapBuffers + libinput (reveny pattern) [skip ci]"
          git push
