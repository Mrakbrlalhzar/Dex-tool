name: Frida GumJS Slim (Source)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            python3-pip ninja-build pkg-config libglib2.0-dev unzip curl
          pip3 install --quiet --upgrade pip
          pip3 install --quiet meson

          wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux.zip -O /tmp/ndk-r25c.zip
          unzip -q /tmp/ndk-r25c.zip -d /tmp/
          echo "NDK_PATH=/tmp/android-ndk-r25c" >> $GITHUB_ENV

          curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
          sudo apt-get install -y nodejs

      - name: Clone and Build Frida for arm64
        timeout-minutes: 90
        run: |
          set -e
          git clone --recursive --depth 1 --branch 17.1.0 \
            https://github.com/frida/frida-gum.git /tmp/frida-gum
          cd /tmp/frida-gum
          sed -i '1i void glib_init(void);' bindings/gumjs/gumquickcompile.c
          export ANDROID_NDK_ROOT="$NDK_PATH"
          ./configure --host=android-arm64 -- \
            -Ddevkits=gum,gumjs \
            -Dgumjs=enabled -Dquickjs=enabled -Dv8=disabled -Ddatabase=disabled \
            -Dtests=disabled -Ddiet=true -Db_ndebug=true -Ddefault_library=static \
            -Dlibunwind:minidebuginfo=disabled -Dlibdwarf:decompression=false
          make -j$(nproc) || true
          # کپی تمام کتابخانه‌های استاتیک تولید شده
          mkdir -p /tmp/frida-built/arm64-v8a/lib
          find build -name '*.a' -exec cp -v {} /tmp/frida-built/arm64-v8a/lib/ \;

      - name: Build Frida for armv7
        timeout-minutes: 90
        run: |
          set -e
          cd /tmp/frida-gum
          rm -rf build
          export ANDROID_NDK_ROOT="$NDK_PATH"
          ./configure --host=android-arm -- \
            -Ddevkits=gum,gumjs \
            -Dgumjs=enabled -Dquickjs=enabled -Dv8=disabled -Ddatabase=disabled \
            -Dtests=disabled -Ddiet=true -Db_ndebug=true -Ddefault_library=static \
            -Dlibunwind:minidebuginfo=disabled -Dlibdwarf:decompression=false
          make -j$(nproc) || true
          mkdir -p /tmp/frida-built/armeabi-v7a/lib
          find build -name '*.a' -exec cp -v {} /tmp/frida-built/armeabi-v7a/lib/ \;

      - name: Download Frida devkit headers (for frida-gumjs.h & glib headers)
        run: |
          FRIDA_VERSION="17.1.0"
          BASE="https://github.com/frida/frida/releases/download/${FRIDA_VERSION}"
          wget -q "${BASE}/frida-gumjs-devkit-${FRIDA_VERSION}-android-arm64.tar.xz" -O /tmp/dk64.tar.xz
          wget -q "${BASE}/frida-gumjs-devkit-${FRIDA_VERSION}-android-arm.tar.xz" -O /tmp/dk32.tar.xz
          mkdir -p /tmp/dk64 /tmp/dk32
          tar -xf /tmp/dk64.tar.xz -C /tmp/dk64
          tar -xf /tmp/dk32.tar.xz -C /tmp/dk32

      - name: Stage Headers
        run: |
          for arch in arm64-v8a armeabi-v7a; do
            DEST="/tmp/frida-built/$arch/include"
            mkdir -p "$DEST"
            if [ "$arch" = "arm64-v8a" ]; then SRC="/tmp/dk64"; else SRC="/tmp/dk32"; fi
            cp -rv "$SRC"/*.h "$DEST"/ 2>/dev/null || true
            # کپی هدرهای GLib از سیستمی که Frida با آن بیلد شده
            cp -rv /usr/include/glib-2.0 "$DEST"/ 2>/dev/null || true
            cp -rv /usr/lib/x86_64-linux-gnu/glib-2.0/include "$DEST"/glib-2.0-include 2>/dev/null || true
          done

      - name: Compile agent.js
        run: |
          mkdir -p /tmp/agent && cd /tmp/agent
          npm init -y >/dev/null
          npm install frida-java-bridge >/dev/null
          cat > agent.js << 'EOF'
          import Java from "frida-java-bridge";
          Java.perform(function() {
            console.log("[*] Patch Agent Loaded");
            recv(function(msg) {
              try {
                var cmd = JSON.parse(msg);
                if (cmd.action === "patchMethod") {
                  var cls = Java.use(cmd.className);
                  var m = cls[cmd.methodName].overloads[0];
                  m.implementation = function() { return cmd.returnValue; };
                  console.log("[*] Patched " + cmd.className + "." + cmd.methodName);
                }
              } catch (e) { console.log("[!] " + e.message); }
            });
            send({type: "ready"});
          });
          EOF
          npx frida-compile agent.js -o agent-compiled.js -S -c
          mkdir -p "$GITHUB_WORKSPACE/app/src/main/assets"
          cp agent-compiled.js "$GITHUB_WORKSPACE/app/src/main/assets/agent.js"

      - name: Verify sources
        run: |
          for f in app/src/main/cpp/tool/native-lib.cpp app/src/main/cpp/tool/dex_data.h \
                   app/src/main/java/com/menu/imgui/Helper.java app/src/main/java/com/menu/imgui/OverlaySurfaceView.java \
                   app/src/main/assets/agent.js; do
            test -s "$f" && echo "✓ $f" || (echo "✗ $f" && exit 1)
          done
          grep -q "gum_init_embedded" app/src/main/cpp/tool/native-lib.cpp

      - name: Write CMakeLists.txt
        run: |
          cat > app/src/main/cpp/CMakeLists.txt << 'EOF'
          cmake_minimum_required(VERSION 3.22.1)
          project("tool")
          set(CMAKE_CXX_STANDARD 17)
          if(NOT CMAKE_BUILD_TYPE)
              set(CMAKE_BUILD_TYPE Release CACHE STRING "" FORCE)
          endif()
          set(CMAKE_C_FLAGS_RELEASE "-Oz -DNDEBUG -ffunction-sections -fdata-sections -fvisibility=hidden")
          set(CMAKE_CXX_FLAGS_RELEASE "-Oz -DNDEBUG -ffunction-sections -fdata-sections -fvisibility=hidden")

          if(${ANDROID_ABI} STREQUAL "arm64-v8a")
              set(FRIDA_DIR /tmp/frida-built/arm64-v8a)
          elseif(${ANDROID_ABI} STREQUAL "armeabi-v7a")
              set(FRIDA_DIR /tmp/frida-built/armeabi-v7a)
          else()
              message(FATAL_ERROR "Unsupported ABI")
          endif()

          include_directories(
              ${FRIDA_DIR}/include
              ${FRIDA_DIR}/include/glib-2.0
              ${FRIDA_DIR}/include/glib-2.0-include
          )

          # Import همه کتابخانه‌های استاتیک Frida
          file(GLOB FRIDA_LIBS "${FRIDA_DIR}/lib/*.a")
          add_library(frida-bundle STATIC IMPORTED)
          set_target_properties(frida-bundle PROPERTIES IMPORTED_LOCATION "${FRIDA_DIR}/lib/libfrida-gumjs.a")

          include_directories(imgui imgui/backends tool)

          add_library(tool SHARED
              tool/native-lib.cpp
              imgui/imgui.cpp
              imgui/imgui_draw.cpp
              imgui/imgui_tables.cpp
              imgui/imgui_widgets.cpp
              imgui/backends/imgui_impl_android.cpp
              imgui/backends/imgui_impl_opengl3.cpp)

          # لینک کردن تمام کتابخانه‌های استاتیک همراه با group برای حل وابستگی دایره‌ای
          target_link_libraries(tool
              -Wl,--start-group
              ${FRIDA_LIBS}
              -Wl,--end-group
              android log EGL GLESv3 dl)

          target_link_options(tool PRIVATE -Wl,--gc-sections -Wl,--exclude-libs,ALL -Wl,--strip-all)
          EOF

      - name: Write build.gradle.kts
        run: |
          cat > app/build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.tool"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.tool"
                  minSdk = 27
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
                  externalNativeBuild {
                      cmake {
                          cppFlags += "-std=c++17"
                          arguments += listOf("-DCMAKE_BUILD_TYPE=Release")
                      }
                  }
                  ndk { abiFilters += listOf("arm64-v8a", "armeabi-v7a") }
              }
              externalNativeBuild {
                  cmake {
                      path = file("src/main/cpp/CMakeLists.txt")
                      version = "3.22.1"
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              buildTypes {
                  getByName("debug") {
                      externalNativeBuild {
                          cmake { arguments += listOf("-DCMAKE_BUILD_TYPE=Release") }
                      }
                  }
              }
              packaging { jniLibs { useLegacyPackaging = true } }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
          }
          EOF

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Build APK
        run: |
          if [ ! -s gradlew ]; then gradle wrapper --gradle-version 8.5; fi
          chmod +x gradlew
          rm -rf app/.cxx app/build .gradle
          ./gradlew :app:assembleDebug --no-build-cache --stacktrace

      - name: Strip + size report
        run: |
          NDK_STRIP=$(find $NDK_PATH -name "llvm-strip" | head -1)
          for SO in $(find app/build -name "libtool.so"); do
            ABI=$(echo "$SO" | grep -oE "(arm64-v8a|armeabi-v7a)")
            echo "=== $ABI ==="
            echo "Before: $(stat -c%s "$SO" | numfmt --to=iec)"
            $NDK_STRIP --strip-all "$SO"
            SIZE=$(stat -c%s "$SO")
            echo "After: $(awk "BEGIN {printf \"%.2f\", $SIZE/1048576}") MB"
          done

      - name: Show APK
        run: |
          APK=$(find app/build -name "*.apk" | head -1)
          echo "APK: $(ls -lah "$APK" | awk '{print $5}')"
          unzip -l "$APK" | grep "\.so"

      - name: Extract artifacts
        run: |
          mkdir -p /tmp/so-out
          for SO in $(find app/build -name "libtool.so"); do
            ABI=$(echo "$SO" | grep -oE "(arm64-v8a|armeabi-v7a)")
            cp "$SO" "/tmp/so-out/libtool-${ABI}.so"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: libtool-slim
          path: /tmp/so-out/*.so

      - uses: actions/upload-artifact@v4
        with:
          name: app-slim
          path: app/build/outputs/apk/debug/*.apk

      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "fix: link all frida static libs (gum, glib, gio, ...) with --start-group [skip ci]"
          git push
