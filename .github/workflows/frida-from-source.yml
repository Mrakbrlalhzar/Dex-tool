name: "Frida GumJS Slim (Source)"

on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cleanup old workflows
        run: |
          cd .github/workflows
          for f in *.yml *.yaml; do [ -f "$f" ] && [ "$f" != "frida-from-source.yml" ] && rm -f "$f"; done
          ls -la

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pip ninja-build pkg-config libglib2.0-dev unzip curl zipalign xxd
          pip3 install --quiet --upgrade pip
          pip3 install --quiet meson
          wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux.zip -O /tmp/ndk-r25c.zip
          unzip -q /tmp/ndk-r25c.zip -d /tmp/
          echo "NDK_PATH=/tmp/android-ndk-r25c" >> $GITHUB_ENV
          curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
          sudo apt-get install -y nodejs
          node --version

      - name: Download Frida devkit
        run: |
          set -e
          V=17.1.0
          B="https://github.com/frida/frida/releases/download/$V"
          wget -q "$B/frida-gumjs-devkit-$V-android-arm64.tar.xz" -O /tmp/dk64.tar.xz
          mkdir -p /tmp/dk64
          tar -xf /tmp/dk64.tar.xz -C /tmp/dk64
          wget -q "$B/frida-gumjs-devkit-$V-android-arm.tar.xz" -O /tmp/dk32.tar.xz
          mkdir -p /tmp/dk32
          tar -xf /tmp/dk32.tar.xz -C /tmp/dk32
          echo "devkits ready"

      - name: Clone frida-gum
        run: |
          git clone --recursive --depth 1 --branch 17.1.0 https://github.com/frida/frida-gum.git /tmp/frida-gum
          cd /tmp/frida-gum
          sed -i '1i void glib_init(void);' bindings/gumjs/gumquickcompile.c
          echo "patched"

      - name: Build arm64
        run: |
          set -o pipefail
          cd /tmp/frida-gum
          export ANDROID_NDK_ROOT="$NDK_PATH"
          rm -rf build
          ./configure --host=android-arm64 -- -Ddevkits=gum,gumjs -Dgumjs=enabled -Dquickjs=enabled -Dv8=disabled -Ddatabase=disabled -Dtests=disabled -Ddiet=true -Db_ndebug=true -Ddefault_library=static -Dlibunwind:minidebuginfo=disabled -Dlibdwarf:decompression=false 2>&1 | tee /tmp/a64.log
          [ ${PIPESTATUS[0]} -ne 0 ] && { tail -60 /tmp/a64.log; exit 1; }
          make -j$(nproc) 2>&1 | tee -a /tmp/a64.log
          python3 releng/devkit.py frida-gumjs android-arm64 2>&1 | tail -20 || true
          LIB=$(find build -name "libfrida-gumjs.a" | head -1)
          [ -z "$LIB" ] && LIB=$(find build -path "*devkit*" -name "libfrida-gumjs*.a" ! -name "*inspector*" | head -1)
          [ -z "$LIB" ] && { echo "NO_LIB"; exit 1; }
          echo "arm64 lib: $LIB"

      - name: Stage arm64
        run: |
          set -e
          D=/tmp/frida-built/arm64-v8a
          rm -rf "$D"
          mkdir -p "$D/lib" "$D/include"
          LIB=$(find /tmp/frida-gum/build -name "libfrida-gumjs.a" | head -1)
          [ -z "$LIB" ] && LIB=$(find /tmp/frida-gum/build -path "*devkit*" -name "libfrida-gumjs*.a" ! -name "*inspector*" | head -1)
          [ -z "$LIB" ] && { echo "FATAL_no_lib"; exit 1; }
          cp -v "$LIB" "$D/lib/libfrida-gumjs.a"
          cp -v "$(find /tmp/dk64 -name 'frida-gumjs.h' | head -1)" "$D/include/frida-gumjs.h"
          G=$(find /tmp/dk64 -name "frida-gum.h" | head -1)
          [ -z "$G" ] && G=$(find /tmp/frida-gum/build/gum/devkit -name "frida-gum.h" | head -1)
          [ -n "$G" ] && cp -v "$G" "$D/include/frida-gum.h"
          GLIB_DIR=$(find /tmp/dk64 -type d -name 'glib-2.0' 2>/dev/null | head -1)
          [ -n "$GLIB_DIR" ] && cp -rv "$GLIB_DIR" "$D/include/glib-2.0"
          ls -lah "$D/lib/"

      - name: Build armv7
        run: |
          set -o pipefail
          cd /tmp/frida-gum
          export ANDROID_NDK_ROOT="$NDK_PATH"
          rm -rf build
          ./configure --host=android-arm -- -Ddevkits=gum,gumjs -Dgumjs=enabled -Dquickjs=enabled -Dv8=disabled -Ddatabase=disabled -Dtests=disabled -Ddiet=true -Db_ndebug=true -Ddefault_library=static -Dlibunwind:minidebuginfo=disabled -Dlibdwarf:decompression=false 2>&1 | tee /tmp/a32.log
          [ ${PIPESTATUS[0]} -ne 0 ] && { tail -60 /tmp/a32.log; exit 1; }
          make -j$(nproc) 2>&1 | tee -a /tmp/a32.log
          python3 releng/devkit.py frida-gumjs android-arm 2>&1 | tail -20 || true
          LIB=$(find build -name "libfrida-gumjs.a" | head -1)
          [ -z "$LIB" ] && LIB=$(find build -path "*devkit*" -name "libfrida-gumjs*.a" ! -name "*inspector*" | head -1)
          [ -z "$LIB" ] && { echo "NO_LIB"; exit 1; }
          echo "armv7 lib: $LIB"

      - name: Stage armv7
        run: |
          set -e
          D=/tmp/frida-built/armeabi-v7a
          rm -rf "$D"
          mkdir -p "$D/lib" "$D/include"
          LIB=$(find /tmp/frida-gum/build -name "libfrida-gumjs.a" | head -1)
          [ -z "$LIB" ] && LIB=$(find /tmp/frida-gum/build -path "*devkit*" -name "libfrida-gumjs*.a" ! -name "*inspector*" | head -1)
          [ -z "$LIB" ] && { echo "FATAL_no_lib"; exit 1; }
          cp -v "$LIB" "$D/lib/libfrida-gumjs.a"
          cp -v "$(find /tmp/dk32 -name 'frida-gumjs.h' | head -1)" "$D/include/frida-gumjs.h"
          G=$(find /tmp/dk32 -name "frida-gum.h" | head -1)
          [ -z "$G" ] && G=$(find /tmp/frida-gum/build/gum/devkit -name "frida-gum.h" | head -1)
          [ -n "$G" ] && cp -v "$G" "$D/include/frida-gum.h"
          GLIB_DIR=$(find /tmp/dk32 -type d -name 'glib-2.0' 2>/dev/null | head -1)
          [ -n "$GLIB_DIR" ] && cp -rv "$GLIB_DIR" "$D/include/glib-2.0"
          ls -lah "$D/lib/"

      - name: Patch Helper.java
        run: |
          python3 - <<'PYEOF'
          import re, pathlib, textwrap
          p = pathlib.Path("app/src/main/java/com/menu/imgui/Helper.java")
          s = p.read_text()

          FIELDS = ['sOverlayWm','sOverlayLp','sDecorContainer','sFabSize','sFabMargin','sOverlayActivity','sMenuOpen']

          s = re.sub(r'private\s+static\s+OverlaySurfaceView\s+overlay;[^\n]*?sOverlayWm[^\n]*?sOverlayLp[^\n]*?;',
                     'private static OverlaySurfaceView overlay;', s)
          for fname in FIELDS:
              s = re.sub(r'(?m)^[ \t]*(?:private|public|protected)?\s*static\s+(?:final\s+)?[A-Za-z_][\w.<>\[\], ]*\s+' + re.escape(fname) + r'\b[^;\n]*;\s*\n?', '', s)
              s = re.sub(r'(?:private|public|protected)?\s*static\s+(?:final\s+)?[A-Za-z_][\w.<>\[\], ]*\s+' + re.escape(fname) + r'\b[^;\n]*;\s*', '', s)

          m = re.search(r'public\s+class\s+Helper\s*\{', s)
          if not m: print("FATAL: class"); raise SystemExit(2)
          s = s[:m.end()] + "\n" + "\n".join([
              "    private static android.view.WindowManager sOverlayWm;",
              "    private static android.view.WindowManager.LayoutParams sOverlayLp;",
              "    private static android.widget.FrameLayout sDecorContainer;",
              "    private static int sFabSize = 200;",
              "    private static int sFabMargin = 40;",
              "    private static android.app.Activity sOverlayActivity;",
              "    private static boolean sMenuOpen = false;",
          ]) + "\n" + s[m.end():]

          def rm_method(src, pat):
              n = 0
              while True:
                  mm = re.search(pat, src)
                  if not mm: break
                  i = src.index('{', mm.end()-1); d=0; e=-1
                  for k in range(i, len(src)):
                      if src[k]=='{': d+=1
                      elif src[k]=='}':
                          d-=1
                          if d==0: e=k+1; break
                  if e<0: break
                  src = src[:mm.start()] + src[e:]; n+=1
              return src, n

          s, _ = rm_method(s, r'public\s+static\s+void\s+attach\s*\(\s*(?:final\s+)?(?:android\.content\.)?Context\s+\w+\s*\)\s*\{')
          s, _ = rm_method(s, r'public\s+static\s+void\s+setMenuOpen\s*\([^)]*\)\s*\{')
          s, _ = rm_method(s, r'(?:public\s+|private\s+)?static\s+void\s+doAttach\s*\([^)]*\)\s*\{')

          methods = textwrap.dedent(r"""
              public static void attach(final Context context) {
                  final android.app.Activity activity;
                  if (context instanceof android.app.Activity) activity = (android.app.Activity) context;
                  else if (context instanceof android.content.ContextWrapper) {
                      android.content.Context base = ((android.content.ContextWrapper) context).getBaseContext();
                      activity = (base instanceof android.app.Activity) ? (android.app.Activity) base : null;
                  } else activity = null;
                  if (activity == null) { android.util.Log.e("DexTool", "attach: no Activity"); return; }
                  sOverlayActivity = activity;
                  activity.getWindow().getDecorView().post(new Runnable() {
                      @Override public void run() { doAttach(activity); }
                  });
              }

              static void doAttach(android.app.Activity activity) {
                  OverlaySurfaceView glView = new OverlaySurfaceView(activity);
                  android.view.WindowManager wm = activity.getWindowManager();
                  android.util.DisplayMetrics dm = activity.getResources().getDisplayMetrics();
                  int fabSize = (int)(80 * dm.density);
                  int margin = (int)(20 * dm.density);
                  sFabSize = fabSize; sFabMargin = margin;
                  android.view.WindowManager.LayoutParams lp = new android.view.WindowManager.LayoutParams(
                      fabSize, fabSize,
                      android.view.WindowManager.LayoutParams.TYPE_APPLICATION_PANEL,
                      android.view.WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE
                          | android.view.WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                      android.graphics.PixelFormat.TRANSPARENT);
                  lp.token = activity.getWindow().getDecorView().getWindowToken();
                  lp.gravity = android.view.Gravity.TOP | android.view.Gravity.START;
                  lp.x = dm.widthPixels - fabSize - margin;
                  lp.y = margin * 4;
                  try {
                      wm.addView(glView, lp);
                      sOverlayWm = wm; sOverlayLp = lp; overlay = glView;
                      android.util.Log.i("DexTool", "Overlay added via WM (size=" + fabSize + ")");
                  } catch (Throwable t) {
                      android.util.Log.w("DexTool", "WM failed, decor fallback", t);
                      try {
                          android.view.ViewGroup decor = (android.view.ViewGroup) activity.getWindow().getDecorView();
                          android.widget.FrameLayout container = new android.widget.FrameLayout(activity);
                          container.setClipChildren(false);
                          android.widget.FrameLayout.LayoutParams clp = new android.widget.FrameLayout.LayoutParams(fabSize, fabSize);
                          clp.gravity = android.view.Gravity.TOP | android.view.Gravity.END;
                          clp.rightMargin = margin; clp.topMargin = margin * 4;
                          container.addView(glView, clp);
                          sDecorContainer = container; overlay = glView;
                          decor.addView(container, new android.view.ViewGroup.LayoutParams(-1, -1));
                          android.util.Log.i("DexTool", "Overlay added to DecorView (small container)");
                      } catch (Throwable t2) { android.util.Log.e("DexTool", "ALL FAILED", t2); }
                  }
                  registerLifecycle(activity, glView);
              }

              public static void setMenuOpen(final boolean open) {
                  sMenuOpen = open;
                  if (overlay == null) return;
                  final int w = sFabSize, m = sFabMargin;
                  overlay.post(new Runnable() {
                      @Override public void run() {
                          try {
                              if (sOverlayWm != null && sOverlayLp != null) {
                                  if (open) {
                                      sOverlayLp.width = android.view.WindowManager.LayoutParams.MATCH_PARENT;
                                      sOverlayLp.height = android.view.WindowManager.LayoutParams.MATCH_PARENT;
                                      sOverlayLp.x = 0; sOverlayLp.y = 0;
                                  } else {
                                      sOverlayLp.width = w; sOverlayLp.height = w;
                                      sOverlayLp.x = sOverlayActivity.getResources().getDisplayMetrics().widthPixels - w - m;
                                      sOverlayLp.y = m * 4;
                                  }
                                  sOverlayWm.updateViewLayout(overlay, sOverlayLp);
                              } else if (sDecorContainer != null) {
                                  android.widget.FrameLayout.LayoutParams clp = (android.widget.FrameLayout.LayoutParams) overlay.getLayoutParams();
                                  if (open) { clp.width = -1; clp.height = -1; clp.gravity = 0; clp.rightMargin = 0; clp.topMargin = 0; }
                                  else { clp.width = w; clp.height = w; clp.gravity = android.view.Gravity.TOP | android.view.Gravity.END; clp.rightMargin = m; clp.topMargin = m * 4; }
                                  overlay.setLayoutParams(clp);
                              }
                              android.util.Log.i("DexTool", "setMenuOpen(" + open + ")");
                          } catch (Throwable t) { android.util.Log.w("DexTool", "setMenuOpen err", t); }
                      }
                  });
              }
          """).strip()

          anchor = re.search(r'(?:private\s+static|public\s+static|static)\s+void\s+registerLifecycle\b', s)
          if anchor:
              s = s[:anchor.start()] + methods + "\n\n" + s[anchor.start():]
          else:
              m2 = re.search(r'public\s+class\s+Helper\s*\{', s)
              s = s[:m2.end()] + "\n" + methods + "\n" + s[m2.end():]

          old = "if (a == activity) { glView.onResume(); }"
          new = ("if (a == activity) { try { glView.onResume(); } catch (Throwable t) {} "
                 "try { if (glView.getParent() == null && sOverlayWm != null && sOverlayLp != null) { "
                 "sOverlayWm.addView(glView, sOverlayLp); android.util.Log.i(\"DexTool\", \"re-attached\"); } } catch (Throwable t) {} }")
          if old in s and "re-attached" not in s:
              s = s.replace(old, new, 1)

          if "nativePatchMethod" not in s:
              m2 = re.search(r'static\s+native\s+void\s+nativeSetPatches\s*\([^)]*\)\s*;', s)
              if m2:
                  s = s[:m2.start()] + "static native void nativePatchMethod(String c, String m, String v); " + s[m2.start():]

          m = re.search(r'public\s+static\s+void\s+requestPatchMethod\s*\([^)]*\)\s*\{', s)
          if m:
              i = s.index('{', m.end()-1); d=0; e=-1
              for k in range(i, len(s)):
                  if s[k]=='{': d+=1
                  elif s[k]=='}':
                      d-=1
                      if d==0: e=k+1; break
              if e>0:
                  body = ('public static void requestPatchMethod(String className, String target, String value) { '
                      'for (PatchRecord __p : sActivePatches) { '
                      'if ("Method".equals(__p.type) && className.equals(__p.className) && target.equals(__p.targetName)) { '
                      '__p.currentValue = value; syncPatches(); nativePatchMethod(className, target, value); return; } } '
                      'PatchRecord p = new PatchRecord(); p.id = sPatchCounter++; p.type = "Method"; p.className = className; '
                      'p.targetName = target; p.originalValue = "(original)"; p.currentValue = value; sActivePatches.add(p); '
                      'syncPatches(); nativePatchMethod(className, target, value); }')
                  s = s[:m.start()] + body + s[e:]
          p.write_text(s)
          print("Helper.java done")
          PYEOF

      - name: Patch OverlaySurfaceView.java
        run: |
          python3 - <<'PYEOF'
          import re, pathlib, textwrap
          p = pathlib.Path("app/src/main/java/com/menu/imgui/OverlaySurfaceView.java")
          s = p.read_text()
          if "setZOrderMediaOverlay" not in s:
              if "setZOrderOnTop(true);" in s:
                  s = s.replace("setZOrderOnTop(true);", "setZOrderOnTop(true);\n        setZOrderMediaOverlay(true);", 1)
              else:
                  s = s.replace("super(context);", "super(context);\n        setZOrderOnTop(true);\n        setZOrderMediaOverlay(true);", 1)
          if "setPreserveEGLContextOnPause" not in s:
              s = s.replace("setRenderMode(RENDERMODE_CONTINUOUSLY);", "setRenderMode(RENDERMODE_CONTINUOUSLY);\n        setPreserveEGLContextOnPause(true);", 1)
          if "onTouchEvent" not in s:
              m = re.search(r'public\s+class\s+OverlaySurfaceView\b[^{]*\{', s)
              if not m: print("FATAL: class"); raise SystemExit(2)
              methods = textwrap.dedent(r"""
                  @Override public boolean onTouchEvent(android.view.MotionEvent e) {
                      int action = e.getActionMasked();
                      boolean handled = Helper.nativeTouch(action, e.getX(), e.getY());
                      if (action == android.view.MotionEvent.ACTION_DOWN) return handled;
                      return super.onTouchEvent(e);
                  }
                  @Override public boolean dispatchKeyEvent(android.view.KeyEvent e) {
                      int c = e.getKeyCode();
                      if (e.getAction() == android.view.KeyEvent.ACTION_DOWN) {
                          if (c >= android.view.KeyEvent.KEYCODE_0 && c <= android.view.KeyEvent.KEYCODE_9) { Helper.nativeAddInputChar((char)('0'+(c-android.view.KeyEvent.KEYCODE_0))); return true; }
                          if (c == android.view.KeyEvent.KEYCODE_PERIOD || c == android.view.KeyEvent.KEYCODE_NUMPAD_DOT) { Helper.nativeAddInputChar('.'); return true; }
                          if (c == android.view.KeyEvent.KEYCODE_MINUS || c == android.view.KeyEvent.KEYCODE_NUMPAD_SUBTRACT) { Helper.nativeAddInputChar('-'); return true; }
                      }
                      return super.dispatchKeyEvent(e);
                  }
              """).strip()
              s = s[:m.end()] + "\n" + methods + "\n" + s[m.end():]
          p.write_text(s)
          print("OverlaySurfaceView.java done")
          PYEOF

      - name: Fix native-lib.cpp globals + native methods (g_jvm via touch)
        run: |
          python3 - <<'PYEOF'
          import re, pathlib, textwrap
          p = pathlib.Path("app/src/main/cpp/tool/native-lib.cpp")
          s = p.read_text()

          s = re.sub(r'(?m)^[ \t]*(?:static\s+)?JavaVM\s*\*\s*g_jvm[^\n;]*;\s*\n?', '', s)
          s = re.sub(r'(?m)^[ \t]*(?:static\s+)?bool\s+gMenuOpen[^\n;]*;\s*\n?', '', s)
          s = re.sub(r'(?m)^[ \t]*(?:static\s+)?std::vector<std::string>\s+gCallLog[^\n;]*;\s*\n?', '', s)
          s = re.sub(r'(?m)^[ \t]*(?:static\s+)?std::mutex\s+gCallLogMutex[^\n;]*;\s*\n?', '', s)
          s = re.sub(r'env\s*->\s*GetJavaVM\s*\(\s*&g_jvm\s*\)\s*;', '', s)

          def rm_method(src, pat):
              n = 0
              while True:
                  mm = re.search(pat, src)
                  if not mm: break
                  i = src.index('{', mm.end()-1); d=0; e=-1
                  for k in range(i, len(src)):
                      if src[k]=='{': d+=1
                      elif src[k]=='}':
                          d-=1
                          if d==0: e=k+1; break
                  if e<0: break
                  src = src[:mm.start()] + src[e:]; n+=1
              return src, n

          s, _ = rm_method(s, r'static\s+void\s+notifyMenuOpen\s*\([^)]*\)\s*\{')
          s, _ = rm_method(s, r'extern\s+"C"\s+JNIEXPORT\s+jboolean\s+JNICALL\s+Java_com_menu_imgui_Helper_nativeTouch\s*\([^)]*\)\s*\{')
          s, _ = rm_method(s, r'extern\s+"C"\s+JNIEXPORT\s+void\s+JNICALL\s+Java_com_menu_imgui_Helper_nativePatchMethod\s*\([^)]*\)\s*\{')

          for inc in ['<mutex>', '<vector>', '<string>']:
              if '#include ' + inc not in s:
                  s = s.replace('#include <jni.h>', '#include <jni.h>\n#include ' + inc, 1)

          lines = s.split('\n')
          last_inc = 0
          for i, line in enumerate(lines[:60]):
              if line.strip().startswith('#include'):
                  last_inc = i
          lines[last_inc+1:last_inc+1] = [
              '',
              'static JavaVM* g_jvm = nullptr;',
              'static bool gMenuOpen = false;',
              'static std::vector<std::string> gCallLog;',
              'static std::mutex gCallLogMutex;',
              '',
          ]
          s = '\n'.join(lines)

          notify_helper = textwrap.dedent(r"""
              static void notifyMenuOpen(bool open) {
                  if (!g_jvm) return;
                  JNIEnv* env = nullptr;
                  bool detach = false;
                  if (g_jvm->GetEnv((void**)&env, JNI_VERSION_1_6) != JNI_OK) {
                      if (g_jvm->AttachCurrentThread(&env, nullptr) != JNI_OK) return;
                      detach = true;
                  }
                  jclass cls = env->FindClass("com/menu/imgui/Helper");
                  if (cls) {
                      jmethodID mid = env->GetStaticMethodID(cls, "setMenuOpen", "(Z)V");
                      if (mid) env->CallStaticVoidMethod(cls, mid, open ? JNI_TRUE : JNI_FALSE);
                      env->DeleteLocalRef(cls);
                  }
                  if (detach) g_jvm->DetachCurrentThread();
              }
          """).strip()
          gpos = s.find('static std::mutex gCallLogMutex;')
          if gpos > 0:
              end = s.find('\n', gpos) + 1
              s = s[:end] + '\n' + notify_helper + '\n\n' + s[end:]

          new_touch = textwrap.dedent(r"""
              extern "C" JNIEXPORT jboolean JNICALL
              Java_com_menu_imgui_Helper_nativeTouch(JNIEnv* env, jclass, jint action, jfloat x, jfloat y) {
                  if (!g_jvm) env->GetJavaVM(&g_jvm);
                  ImGuiIO& io = ImGui::GetIO();
                  io.AddMousePosEvent(x, y);
                  if (action == 0) io.AddMouseButtonEvent(0, true);
                  else if (action == 1) io.AddMouseButtonEvent(0, false);
                  else if (action == 3) io.AddMouseButtonEvent(0, false);
                  return io.WantCaptureMouse ? JNI_TRUE : JNI_FALSE;
              }
          """).strip()
          anchor = 'static void drawSigil'
          if anchor in s:
              s = s.replace(anchor, new_touch + '\n\n' + anchor, 1)
          else:
              pos = s.find('extern "C" JNIEXPORT')
              if pos > 0: s = s[:pos] + new_touch + '\n\n' + s[pos:]

          new_patch = textwrap.dedent(r"""
              extern "C" JNIEXPORT void JNICALL
              Java_com_menu_imgui_Helper_nativePatchMethod(JNIEnv* env, jclass, jstring jc, jstring jm, jstring jv) {
                  if (!g_jvm) env->GetJavaVM(&g_jvm);
                  if (!g_script) return;
                  const char* c = env->GetStringUTFChars(jc, nullptr);
                  const char* m = env->GetStringUTFChars(jm, nullptr);
                  const char* v = env->GetStringUTFChars(jv, nullptr);
                  std::string json = "{\"action\":\"patchMethod\",\"className\":\"";
                  json += c; json += "\",\"methodName\":\""; json += m;
                  json += "\",\"returnValue\":\""; json += v; json += "\"}";
                  gum_script_post(g_script, json.c_str(), nullptr, nullptr);
                  env->ReleaseStringUTFChars(jc, c);
                  env->ReleaseStringUTFChars(jm, m);
                  env->ReleaseStringUTFChars(jv, v);
              }
          """).strip()
          if anchor in s:
              s = s.replace(anchor, new_patch + '\n\n' + anchor, 1)
          else:
              pos = s.find('extern "C" JNIEXPORT')
              if pos > 0: s = s[:pos] + new_patch + '\n\n' + s[pos:]

          if 'void nativeRender()' in s and 'lastMenuOpen' not in s:
              s = s.replace('void nativeRender() {',
                            'void nativeRender() {\n    static bool lastMenuOpen = false;\n    if (lastMenuOpen != gMenuOpen) { lastMenuOpen = gMenuOpen; notifyMenuOpen(gMenuOpen); }', 1)

          p.write_text(s)
          print("native-lib.cpp done")
          PYEOF

      - name: Patch native-lib.cpp (agent + log)
        run: |
          python3 - <<'PYEOF'
          import re, pathlib, textwrap
          p = pathlib.Path("app/src/main/cpp/tool/native-lib.cpp")
          s = p.read_text()

          new_js = textwrap.dedent(r"""
              Java.perform(function() {
                function log(m){ console.log("[DexTool] "+m); try{ send({type:"log", msg:m}); }catch(e){} }
                log("agent loaded");
                var HOOKED = {};
                recv(function(raw) {
                  try {
                    var cmd = JSON.parse(raw);
                    log("recv: "+raw);
                    if (cmd.action !== "patchMethod") return;
                    var key = cmd.className+"#"+cmd.methodName;
                    if (HOOKED[key]) { log("already patched: "+key); return; }
                    var loaders = Java.enumerateClassLoadersSync();
                    var loader = null;
                    for (var i=0;i<loaders.length;i++){ try{ if(loaders[i].findClass(cmd.className)){ loader=loaders[i]; break; } }catch(e){} }
                    if (loader) Java.classFactory.loader = loader;
                    var cls = Java.use(cmd.className);
                    var ovs = cls[cmd.methodName].overloads;
                    var target = null;
                    for (var i=0;i<ovs.length;i++){ if(target===null && ovs[i].argumentTypes.length===0) target=ovs[i]; }
                    if (!target) target = ovs[0];
                    var rt = target.returnType.className;
                    var rv = cmd.returnValue;
                    target.implementation = function() {
                      log("HOOK HIT: "+cmd.methodName);
                      if (rt==="int"||rt==="long"||rt==="short"||rt==="byte") return parseInt(rv,10);
                      if (rt==="float"||rt==="double") return parseFloat(rv);
                      if (rt==="boolean") return rv==="true"||rv==="1";
                      if (rt==="void") return undefined;
                      return rv;
                    };
                    HOOKED[key] = true;
                    log("PATCHED: "+key);
                  } catch(e) { log("ERROR: "+e.message); }
                });
                send({type:"ready"});
              });
          """).strip()
          if 'PATCH_AGENT_JS' in s:
              s = re.sub(r'const gchar\* PATCH_AGENT_JS = R"\(.*?\)";',
                  'const gchar* PATCH_AGENT_JS = R"(' + new_js + ')";', s, flags=re.DOTALL)

          if 'type\\":\\"log' not in s:
              s = s.replace('LOGI("Frida JS: %s", message);',
                  'LOGI("Frida JS: %s", message); if (message && strstr(message, "\\"type\\":\\"log\\"")) { std::lock_guard<std::mutex> lk(gCallLogMutex); gCallLog.push_back(std::string("[JS] ")+message); if (gCallLog.size()>200) gCallLog.erase(gCallLog.begin()); }', 1)

          if 'push_back("[CALL]' not in s:
              s = s.replace("gPendingCallReqs.push_back(c);",
                  "gPendingCallReqs.push_back(c); { std::lock_guard<std::mutex> lk(gCallLogMutex); gCallLog.push_back(std::string(\"[CALL] \")+className+\".\"+m.name); if (gCallLog.size()>200) gCallLog.erase(gCallLog.begin()); }", 1)

          if 'BeginTabItem("Log")' not in s:
              old = 'if (ImGui::BeginTabItem("Patches"))'
              new = ('if (ImGui::BeginTabItem("Log")) { std::lock_guard<std::mutex> lk(gCallLogMutex); '
                     'ImGui::BeginChild("##logchild", ImVec2(0,0), true); '
                     'for (auto& l : gCallLog) ImGui::TextUnformatted(l.c_str()); '
                     'ImGui::EndChild(); ImGui::EndTabItem(); }\n        ' + old)
              if old in s:
                  s = s.replace(old, new, 1)
          p.write_text(s)
          print("native-lib.cpp agent done")
          PYEOF

      - name: Rebuild dex_data.h
        run: |
          set -e
          ANDROID_JAR=$(find "$ANDROID_HOME/platforms" -name "android.jar" | sort -V | tail -1)
          D8=$(find "$ANDROID_HOME/build-tools" -name "d8" | sort -V | tail -1)
          rm -rf /tmp/dex_build /tmp/dex_out
          mkdir -p /tmp/dex_build /tmp/dex_out
          javac -source 8 -target 8 -Xlint:-options -cp "$ANDROID_JAR" -d /tmp/dex_build $(find app/src/main/java/com/menu/imgui -name "*.java") 2>&1 | tee /tmp/javac.log
          [ ${PIPESTATUS[0]} -ne 0 ] && { echo "JAVAC_FAILED"; cat /tmp/javac.log; exit 1; }
          "$D8" --min-api 26 --lib "$ANDROID_JAR" --output /tmp/dex_out $(find /tmp/dex_build -name "*.class") 2>&1 | tee /tmp/d8.log
          [ ${PIPESTATUS[0]} -ne 0 ] && { echo "D8_FAILED"; cat /tmp/d8.log; exit 1; }
          xxd -i -n imgui_dex /tmp/dex_out/classes.dex > app/src/main/cpp/tool/dex_data.h
          echo "dex_data.h rebuilt"

      - name: Verify
        run: |
          FAIL=0
          chk() { if grep -qF "$2" "$1"; then echo "OK  $2"; else echo "ERR $2"; FAIL=1; fi; }
          chk app/src/main/cpp/tool/native-lib.cpp "static JavaVM* g_jvm = nullptr;"
          chk app/src/main/cpp/tool/native-lib.cpp "notifyMenuOpen"
          chk app/src/main/cpp/tool/native-lib.cpp "Java_com_menu_imgui_Helper_nativeTouch"
          chk app/src/main/cpp/tool/native-lib.cpp "Java_com_menu_imgui_Helper_nativePatchMethod"
          chk app/src/main/cpp/tool/dex_data.h "imgui_dex_len"
          chk app/src/main/java/com/menu/imgui/Helper.java "nativePatchMethod"
          if grep -qE "\[\s*\]\s*\(\s*\)\s*\{[^}]*env\s*->\s*GetJavaVM" app/src/main/cpp/tool/native-lib.cpp; then
            echo "ERR env->GetJavaVM inside lambda"; FAIL=1
          else
            echo "OK  no env->GetJavaVM in lambda"
          fi
          N_VM=$(grep -c "env->GetJavaVM(&g_jvm)" app/src/main/cpp/tool/native-lib.cpp)
          if [ "$N_VM" -ge 1 ]; then echo "OK  env->GetJavaVM appears $N_VM times"; else echo "ERR env->GetJavaVM not present"; FAIL=1; fi
          N_TOUCH=$(grep -c "Java_com_menu_imgui_Helper_nativeTouch" app/src/main/cpp/tool/native-lib.cpp)
          if [ "$N_TOUCH" -ge 1 ]; then echo "OK  nativeTouch present"; else echo "ERR no nativeTouch"; FAIL=1; fi
          if [ $FAIL -ne 0 ]; then
            echo "=== native-lib top 40 ==="; head -40 app/src/main/cpp/tool/native-lib.cpp
            exit 1
          fi
          echo "ALL CHECKS PASSED"

      - name: Write CMakeLists.txt
        run: |
          cat > app/src/main/cpp/CMakeLists.txt <<'CMEOF'
          cmake_minimum_required(VERSION 3.22.1)
          project("tool")
          set(CMAKE_CXX_STANDARD 17)
          set(CMAKE_BUILD_TYPE Release)
          set(CMAKE_CXX_FLAGS_RELEASE "-Oz -DNDEBUG -ffunction-sections -fdata-sections -fvisibility=hidden")
          if(${ANDROID_ABI} STREQUAL "arm64-v8a")
              set(FRIDA_DIR /tmp/frida-built/arm64-v8a)
          else()
              set(FRIDA_DIR /tmp/frida-built/armeabi-v7a)
          endif()
          include_directories(${FRIDA_DIR}/include ${FRIDA_DIR}/include/glib-2.0)
          add_library(frida-gumjs STATIC IMPORTED)
          set_target_properties(frida-gumjs PROPERTIES IMPORTED_LOCATION ${FRIDA_DIR}/lib/libfrida-gumjs.a)
          include_directories(imgui imgui/backends tool)
          add_library(tool SHARED tool/native-lib.cpp imgui/imgui.cpp imgui/imgui_draw.cpp imgui/imgui_tables.cpp imgui/imgui_widgets.cpp imgui/backends/imgui_impl_android.cpp imgui/backends/imgui_impl_opengl3.cpp)
          target_link_options(tool PRIVATE -Wl,--gc-sections -Wl,--exclude-libs,ALL -Wl,--strip-all)
          target_link_libraries(tool frida-gumjs android log EGL GLESv3 dl)
          CMEOF

      - name: Write build.gradle.kts
        run: |
          cat > app/build.gradle.kts <<'GEOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.tool"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.tool"
                  minSdk = 27
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
                  externalNativeBuild { cmake { cppFlags += "-std=c++17"; arguments += "-DCMAKE_BUILD_TYPE=Release" } }
                  ndk { abiFilters += listOf("arm64-v8a", "armeabi-v7a") }
              }
              externalNativeBuild { cmake { path = file("src/main/cpp/CMakeLists.txt"); version = "3.22.1" } }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
              packaging { jniLibs { useLegacyPackaging = true } }
          }
          dependencies { implementation("androidx.core:core-ktx:1.12.0") }
          GEOF

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Build APK
        run: |
          if [ ! -s gradlew ]; then gradle wrapper --gradle-version 8.5; fi
          chmod +x gradlew
          rm -rf app/.cxx app/build .gradle
          ./gradlew :app:assembleDebug --no-build-cache

      - name: Zipalign
        run: |
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          cp "$APK" /tmp/un.apk
          zipalign -p -f 4 /tmp/un.apk "$APK"
          unzip -l "$APK" | grep "\.so"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: app-slim
          path: app/build/outputs/apk/debug/*.apk

      - name: Commit
        if: always()
        run: |
          git config user.name "gh"
          git config user.email "gh@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "fix: grep -qF (literal) so '*' doesn't break Verify [skip ci]"
          git push
