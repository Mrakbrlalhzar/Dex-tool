name: Frida from Source (Stripped, Dual-Arch)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cleanup old workflows
        run: |
          cd .github/workflows
          for f in *.yml *.yaml; do
            if [ -f "$f" ] && [ "$f" != "frida-from-source.yml" ]; then
              rm -f "$f"
            fi
          done
          ls -la

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pip ninja-build pkg-config libglib2.0-dev rsync
          pip3 install --quiet --upgrade pip
          pip3 install --quiet meson
          meson --version && ninja --version

      - name: Detect NDK
        run: |
          NDK_DIR=$(ls -d $ANDROID_HOME/ndk/* 2>/dev/null | head -1)
          [ -z "$NDK_DIR" ] && echo "FATAL: NDK not found" && exit 1
          echo "NDK_PATH=$NDK_DIR" >> $GITHUB_ENV
          echo "NDK: $NDK_DIR"

      - name: Clone Frida
        run: |
          git clone --recursive --depth 1 --branch 17.1.0 \
            https://github.com/frida/frida.git /tmp/frida
          echo "✓ Frida 17.1.0 cloned"

      - name: Configure slim Frida
        run: |
          cd /tmp/frida
          cat > config.mk << 'EOF'
          FRIDA_V8 = disabled
          FRIDA_DATABASE = disabled
          FRIDA_CONNECTIVITY = disabled
          FRIDA_OBJC_BRIDGE = disabled
          FRIDA_SWIFT_BRIDGE = disabled
          FRIDA_DEBUG = no
          EOF
          cat config.mk

      - name: Build Frida arm64 (ignore python failure)
        timeout-minutes: 60
        run: |
          cd /tmp/frida
          export ANDROID_NDK_ROOT="$NDK_PATH"
          export FRIDA_HOST=android-arm64
          echo "=== Building android-arm64 ==="
          make -j$(nproc) 2>&1 | tail -30 || echo "make returned non-zero (python is OK to ignore)"
          echo ""
          echo "=== Artifacts (pre-strip) ==="
          find build -name "libfrida-gumjs*.a" ! -name "*inspector*" -exec ls -lah {} \;
          echo "=== All headers with 'script' ==="
          find . -path "*frida-gum*" -name "*script*.h" 2>/dev/null | head -20

      - name: Strip arm64 .a files
        run: |
          NDK_STRIP=$(find $NDK_PATH -name "llvm-strip" | head -1)
          echo "strip: $NDK_STRIP"
          cd /tmp/frida
          for A in $(find build -name "*.a" 2>/dev/null); do
            $NDK_STRIP --strip-unneeded "$A" 2>/dev/null || true
          done
          echo "=== After strip ==="
          find build -name "libfrida-gumjs*.a" ! -name "*inspector*" -exec ls -lah {} \;

      - name: Stage arm64 (lib + headers + deps + synthetic amalgamated header)
        run: |
          set -e
          DEST=/tmp/frida-built/arm64-v8a
          rm -rf "$DEST"; mkdir -p "$DEST/lib" "$DEST/include" "$DEST/deps"

          # 1) Copy stripped .a
          LIB=$(find /tmp/frida/build -name "libfrida-gumjs*.a" ! -name "*inspector*" | head -1)
          [ -z "$LIB" ] && echo "FATAL: no lib" && exit 1
          cp "$LIB" "$DEST/lib/libfrida-gumjs.a"
          echo "✓ lib: $(stat -c%s "$DEST/lib/libfrida-gumjs.a") bytes"

          # 2) Stage all source + build headers, preserving tree
          for SRC in \
            /tmp/frida/subprojects/frida-gum \
            /tmp/frida/build/subprojects/frida-gum; do
            if [ -d "$SRC" ]; then
              rsync -a --include="*/" --include="*.h" --exclude="*" "$SRC/" "$DEST/include/" 2>/dev/null || true
            fi
          done

          # 3) Stage third-party dep headers (glib, json-glib, ffi, capstone)
          DEPS_DIR=/tmp/frida/deps/sdk-android-arm64
          if [ -d "$DEPS_DIR/include" ]; then
            cp -r "$DEPS_DIR/include/"* "$DEST/include/" 2>/dev/null || true
          fi

          # 4) Discover the actual header files
          GUM_H=$(find "$DEST/include" -name "gum.h" -not -name "*.h.in" | head -1)
          GUMSCRIPT_H=$(find "$DEST/include" -name "gumscript.h" | head -1)
          GUMSCRIPTBACKEND_H=$(find "$DEST/include" -name "gumscriptbackend.h" | head -1)

          echo "=== Discovered headers ==="
          echo "gum.h:               $GUM_H"
          echo "gumscript.h:         $GUMSCRIPT_H"
          echo "gumscriptbackend.h:  $GUMSCRIPTBACKEND_H"

          if [ -z "$GUM_H" ]; then
            echo "FATAL: gum.h not found"
            find "$DEST/include" -name "*.h" | head -30
            exit 1
          fi

          # 5) Create synthetic frida-gumjs.h that includes everything
          {
            echo '#ifndef _FRIDA_GUMJS_H_'
            echo '#define _FRIDA_GUMJS_H_'
            echo ''
            echo '#include <glib.h>'
            echo '#include <glib-object.h>'
            echo ''
            echo "#include \"${GUM_H#$DEST/include/}\""
            [ -n "$GUMSCRIPT_H" ] && echo "#include \"${GUMSCRIPT_H#$DEST/include/}\""
            [ -n "$GUMSCRIPTBACKEND_H" ] && echo "#include \"${GUMSCRIPTBACKEND_H#$DEST/include/}\""
            echo ''
            echo '#endif'
          } > "$DEST/include/frida-gumjs.h"
          echo "=== Synthetic frida-gumjs.h ==="
          cat "$DEST/include/frida-gumjs.h"

          # 6) Stage dep .a files for linking
          if [ -d "$DEPS_DIR/lib" ]; then
            cp "$DEPS_DIR/lib/"*.a "$DEST/deps/" 2>/dev/null || true
            echo "=== Staged deps ==="
            ls -lah "$DEST/deps/" | head -20
          fi

          # 7) Sanity check: which header declares gum_script_backend_obtain_qjs?
          echo "=== Searching for gum_script_backend_obtain_qjs declaration ==="
          grep -rl "gum_script_backend_obtain_qjs" "$DEST/include" 2>/dev/null || echo "WARN: not found in staged headers"

      - name: Build Frida arm (armeabi-v7a)
        timeout-minutes: 60
        run: |
          cd /tmp/frida
          rm -rf build
          export ANDROID_NDK_ROOT="$NDK_PATH"
          export FRIDA_HOST=android-arm
          echo "=== Building android-arm ==="
          make -j$(nproc) 2>&1 | tail -20 || echo "make returned non-zero (OK)"
          find build -name "libfrida-gumjs*.a" ! -name "*inspector*" -exec ls -lah {} \;

      - name: Strip + Stage arm
        run: |
          set -e
          NDK_STRIP=$(find $NDK_PATH -name "llvm-strip" | head -1)
          cd /tmp/frida
          for A in $(find build -name "*.a" 2>/dev/null); do
            $NDK_STRIP --strip-unneeded "$A" 2>/dev/null || true
          done

          DEST=/tmp/frida-built/armeabi-v7a
          rm -rf "$DEST"; mkdir -p "$DEST/lib" "$DEST/include" "$DEST/deps"

          LIB=$(find /tmp/frida/build -name "libfrida-gumjs*.a" ! -name "*inspector*" | head -1)
          [ -z "$LIB" ] && echo "FATAL: no arm lib" && exit 1
          cp "$LIB" "$DEST/lib/libfrida-gumjs.a"
          echo "✓ arm lib: $(stat -c%s "$DEST/lib/libfrida-gumjs.a") bytes"

          for SRC in \
            /tmp/frida/subprojects/frida-gum \
            /tmp/frida/build/subprojects/frida-gum; do
            [ -d "$SRC" ] && rsync -a --include="*/" --include="*.h" --exclude="*" "$SRC/" "$DEST/include/" 2>/dev/null || true
          done

          DEPS_DIR=/tmp/frida/deps/sdk-android-arm
          if [ -d "$DEPS_DIR/include" ]; then
            cp -r "$DEPS_DIR/include/"* "$DEST/include/" 2>/dev/null || true
          fi

          GUM_H=$(find "$DEST/include" -name "gum.h" -not -name "*.h.in" | head -1)
          GUMSCRIPT_H=$(find "$DEST/include" -name "gumscript.h" | head -1)
          GUMSCRIPTBACKEND_H=$(find "$DEST/include" -name "gumscriptbackend.h" | head -1)

          {
            echo '#ifndef _FRIDA_GUMJS_H_'
            echo '#define _FRIDA_GUMJS_H_'
            echo '#include <glib.h>'
            echo '#include <glib-object.h>'
            [ -n "$GUM_H" ] && echo "#include \"${GUM_H#$DEST/include/}\""
            [ -n "$GUMSCRIPT_H" ] && echo "#include \"${GUMSCRIPT_H#$DEST/include/}\""
            [ -n "$GUMSCRIPTBACKEND_H" ] && echo "#include \"${GUMSCRIPTBACKEND_H#$DEST/include/}\""
            echo '#endif'
          } > "$DEST/include/frida-gumjs.h"

          if [ -d "$DEPS_DIR/lib" ]; then
            cp "$DEPS_DIR/lib/"*.a "$DEST/deps/" 2>/dev/null || true
            echo "✓ $(ls "$DEST/deps" | wc -l) dep libs staged"
          fi

      - name: Verify source files
        run: |
          for f in app/src/main/cpp/tool/native-lib.cpp app/src/main/cpp/tool/dex_data.h \
                   app/src/main/java/com/menu/imgui/Helper.java \
                   app/src/main/java/com/menu/imgui/OverlaySurfaceView.java; do
            test -s "$f" && echo "✓ $f" || (echo "✗ MISSING: $f" && exit 1)
          done

      - name: Write CMakeLists.txt
        run: |
          cat > app/src/main/cpp/CMakeLists.txt << 'EOF'
          cmake_minimum_required(VERSION 3.22.1)
          project("tool")
          set(CMAKE_CXX_STANDARD 17)

          if(NOT CMAKE_BUILD_TYPE)
              set(CMAKE_BUILD_TYPE Release CACHE STRING "" FORCE)
          endif()
          set(CMAKE_C_FLAGS_RELEASE "-Oz -DNDEBUG -ffunction-sections -fdata-sections -fvisibility=hidden")
          set(CMAKE_CXX_FLAGS_RELEASE "-Oz -DNDEBUG -ffunction-sections -fdata-sections -fvisibility=hidden")

          if(${ANDROID_ABI} STREQUAL "arm64-v8a")
              set(FRIDA_DIR /tmp/frida-built/arm64-v8a)
          elseif(${ANDROID_ABI} STREQUAL "armeabi-v7a")
              set(FRIDA_DIR /tmp/frida-built/armeabi-v7a)
          else()
              message(FATAL_ERROR "Unsupported ABI: ${ANDROID_ABI}")
          endif()

          if(NOT EXISTS "${FRIDA_DIR}/lib/libfrida-gumjs.a")
              message(FATAL_ERROR "Frida lib missing: ${FRIDA_DIR}/lib/libfrida-gumjs.a")
          endif()

          include_directories(${FRIDA_DIR}/include)

          add_library(frida-gumjs STATIC IMPORTED)
          set_target_properties(frida-gumjs PROPERTIES
              IMPORTED_LOCATION ${FRIDA_DIR}/lib/libfrida-gumjs.a)

          file(GLOB FRIDA_DEPS "${FRIDA_DIR}/deps/*.a")
          message(STATUS "Frida deps: ${FRIDA_DEPS}")

          include_directories(imgui imgui/backends tool)

          add_library(tool SHARED
              tool/native-lib.cpp
              imgui/imgui.cpp
              imgui/imgui_draw.cpp
              imgui/imgui_tables.cpp
              imgui/imgui_widgets.cpp
              imgui/backends/imgui_impl_android.cpp
              imgui/backends/imgui_impl_opengl3.cpp)

          target_link_options(tool PRIVATE
              -Wl,--gc-sections
              -Wl,--strip-all)

          target_link_libraries(tool
              frida-gumjs
              ${FRIDA_DEPS}
              android log EGL GLESv3 dl)
          EOF

      - name: Write app/build.gradle.kts
        run: |
          cat > app/build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.tool"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.tool"
                  minSdk = 27
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
                  externalNativeBuild {
                      cmake {
                          cppFlags += "-std=c++17"
                          arguments += listOf("-DCMAKE_BUILD_TYPE=Release")
                      }
                  }
                  ndk { abiFilters += listOf("arm64-v8a", "armeabi-v7a") }
              }
              externalNativeBuild {
                  cmake {
                      path = file("src/main/cpp/CMakeLists.txt")
                      version = "3.22.1"
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              buildTypes {
                  getByName("debug") {
                      externalNativeBuild {
                          cmake { arguments += listOf("-DCMAKE_BUILD_TYPE=Release") }
                      }
                  }
              }
              packaging { jniLibs { useLegacyPackaging = true } }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
          }
          EOF

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Build APK
        run: |
          if [ ! -s gradlew ]; then gradle wrapper --gradle-version 8.5; fi
          chmod +x gradlew
          rm -rf app/.cxx app/build .gradle
          ./gradlew :app:assembleDebug --no-build-cache --stacktrace

      - name: Size report
        run: |
          for SO in $(find app/build -name "libtool.so"); do
            ABI=$(echo "$SO" | grep -oE "(arm64-v8a|armeabi-v7a)")
            SIZE=$(stat -c%s "$SO")
            MB=$(awk "BEGIN {printf \"%.2f\", $SIZE/1048576}")
            echo "$ABI libtool.so = $MB MB"
          done
          APK=$(find app/build -name "*.apk" | head -1)
          echo "APK = $(ls -lah "$APK" | awk '{print $5}')"

      - name: Extract .so
        run: |
          mkdir -p /tmp/so-out
          for SO in $(find app/build -name "libtool.so"); do
            ABI=$(echo "$SO" | grep -oE "(arm64-v8a|armeabi-v7a)")
            cp "$SO" "/tmp/so-out/libtool-${ABI}.so"
          done
          ls -lah /tmp/so-out/

      - uses: actions/upload-artifact@v4
        with:
          name: libtool-frida-source
          path: /tmp/so-out/*.so

      - uses: actions/upload-artifact@v4
        with:
          name: app-frida-source
          path: app/build/outputs/apk/debug/*.apk

      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "feat: frida from source (stripped, synthetic headers, deps linked) [skip ci]"
          git push
