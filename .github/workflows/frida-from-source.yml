name: Frida GumJS Slim (Source)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cleanup old workflows
        run: |
          cd .github/workflows
          for f in *.yml *.yaml; do
            if [ -f "$f" ] && [ "$f" != "frida-from-source.yml" ]; then
              rm -f "$f"
            fi
          done
          ls -la

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            python3-pip ninja-build pkg-config libglib2.0-dev unzip curl zipalign
          pip3 install --quiet --upgrade pip
          pip3 install --quiet meson
          wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux.zip -O /tmp/ndk-r25c.zip
          unzip -q /tmp/ndk-r25c.zip -d /tmp/
          echo "NDK_PATH=/tmp/android-ndk-r25c" >> $GITHUB_ENV
          curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
          sudo apt-get install -y nodejs
          echo "NDK_PATH=$NDK_PATH"; node --version

      - name: Download Frida devkit
        run: |
          set -e
          FRIDA_VERSION="17.1.0"
          BASE="https://github.com/frida/frida/releases/download/${FRIDA_VERSION}"
          wget -q "${BASE}/frida-gumjs-devkit-${FRIDA_VERSION}-android-arm64.tar.xz" -O /tmp/dk64.tar.xz
          mkdir -p /tmp/dk64 && tar -xf /tmp/dk64.tar.xz -C /tmp/dk64
          wget -q "${BASE}/frida-gumjs-devkit-${FRIDA_VERSION}-android-arm.tar.xz" -O /tmp/dk32.tar.xz
          mkdir -p /tmp/dk32 && tar -xf /tmp/dk32.tar.xz -C /tmp/dk32
          echo "devkits ready"

      - name: Clone frida-gum source
        run: |
          git clone --recursive --depth 1 --branch 17.1.0 \
            https://github.com/frida/frida-gum.git /tmp/frida-gum
          cd /tmp/frida-gum; echo "cloned"

      - name: Patch glib_init
        run: |
          cd /tmp/frida-gum
          sed -i '1i void glib_init(void);' bindings/gumjs/gumquickcompile.c
          echo "patched"

      - name: Build arm64
        timeout-minutes: 60
        run: |
          set -o pipefail
          cd /tmp/frida-gum
          export ANDROID_NDK_ROOT="$NDK_PATH"
          rm -rf build
          ./configure --host=android-arm64 -- \
            -Ddevkits=gum,gumjs -Dgumjs=enabled -Dquickjs=enabled -Dv8=disabled \
            -Ddatabase=disabled -Dtests=disabled -Ddiet=true -Db_ndebug=true \
            -Ddefault_library=static -Dlibunwind:minidebuginfo=disabled \
            -Dlibdwarf:decompression=false 2>&1 | tee /tmp/arm64-configure.log
          [ ${PIPESTATUS[0]} -ne 0 ] && { tail -60 /tmp/arm64-configure.log; exit 1; }
          make -j$(nproc) 2>&1 | tee /tmp/arm64-build.log
          python3 releng/devkit.py frida-gumjs android-arm64 2>&1 | tee /tmp/arm64-devkit.log || true
          find build -name "*.a" -exec ls -lah {} \; | sort || true
          LIB=$(find build -name "libfrida-gumjs.a" | head -1)
          [ -z "$LIB" ] && LIB=$(find build -path "*devkit*" -name "libfrida-gumjs*.a" ! -name "*inspector*" | head -1)
          [ -z "$LIB" ] && LIB=$(find build -name "libfrida-gumjs*.a" ! -name "*inspector*" | head -1)
          echo ">>> Selected: ${LIB:-none}"
          [ -z "$LIB" ] && { tail -80 /tmp/arm64-devkit.log; exit 1; }
          echo "arm64 library located"

      - name: Stage arm64
        run: |
          set -e
          DEST=/tmp/frida-built/arm64-v8a; rm -rf "$DEST"; mkdir -p "$DEST/lib" "$DEST/include"
          LIB=$(find /tmp/frida-gum/build -name "libfrida-gumjs.a" | head -1)
          [ -z "$LIB" ] && LIB=$(find /tmp/frida-gum/build -path "*devkit*" -name "libfrida-gumjs*.a" ! -name "*inspector*" | head -1)
          [ -z "$LIB" ] && LIB=$(find /tmp/frida-gum/build -name "libfrida-gumjs*.a" ! -name "*inspector*" | head -1)
          echo ">>> Staging: $LIB"; [ -z "$LIB" ] && exit 1
          cp -v "$LIB" "$DEST/lib/libfrida-gumjs.a"
          GUMJS_H=$(find /tmp/dk64 -name "frida-gumjs.h" | head -1)
          GUM_H=$(find /tmp/dk64 -name "frida-gum.h" | head -1)
          [ -n "$GUMJS_H" ] && cp -v "$GUMJS_H" "$DEST/include/frida-gumjs.h"
          [ -n "$GUM_H" ] && cp -v "$GUM_H" "$DEST/include/frida-gum.h"
          GLIB_DIR=$(find /tmp/dk64 -type d -name "glib-2.0" | head -1)
          [ -n "$GLIB_DIR" ] && cp -rv "$GLIB_DIR" "$DEST/include/glib-2.0"
          ls -lah "$DEST/lib/"

      - name: Build armv7
        timeout-minutes: 60
        run: |
          set -o pipefail
          cd /tmp/frida-gum
          export ANDROID_NDK_ROOT="$NDK_PATH"
          rm -rf build
          ./configure --host=android-arm -- \
            -Ddevkits=gum,gumjs -Dgumjs=enabled -Dquickjs=enabled -Dv8=disabled \
            -Ddatabase=disabled -Dtests=disabled -Ddiet=true -Db_ndebug=true \
            -Ddefault_library=static -Dlibunwind:minidebuginfo=disabled \
            -Dlibdwarf:decompression=false 2>&1 | tee /tmp/armv7-configure.log
          [ ${PIPESTATUS[0]} -ne 0 ] && { tail -60 /tmp/armv7-configure.log; exit 1; }
          make -j$(nproc) 2>&1 | tee /tmp/armv7-build.log
          python3 releng/devkit.py frida-gumjs android-arm 2>&1 | tee /tmp/armv7-devkit.log || true
          find build -name "*.a" -exec ls -lah {} \; | sort || true
          LIB=$(find build -name "libfrida-gumjs.a" | head -1)
          [ -z "$LIB" ] && LIB=$(find build -path "*devkit*" -name "libfrida-gumjs*.a" ! -name "*inspector*" | head -1)
          [ -z "$LIB" ] && LIB=$(find build -name "libfrida-gumjs*.a" ! -name "*inspector*" | head -1)
          echo ">>> Selected: ${LIB:-none}"
          [ -z "$LIB" ] && { tail -80 /tmp/armv7-devkit.log; exit 1; }
          echo "armv7 library located"

      - name: Stage armv7
        run: |
          set -e
          DEST=/tmp/frida-built/armeabi-v7a; rm -rf "$DEST"; mkdir -p "$DEST/lib" "$DEST/include"
          LIB=$(find /tmp/frida-gum/build -name "libfrida-gumjs.a" | head -1)
          [ -z "$LIB" ] && LIB=$(find /tmp/frida-gum/build -path "*devkit*" -name "libfrida-gumjs*.a" ! -name "*inspector*" | head -1)
          [ -z "$LIB" ] && LIB=$(find /tmp/frida-gum/build -name "libfrida-gumjs*.a" ! -name "*inspector*" | head -1)
          echo ">>> Staging: $LIB"; [ -z "$LIB" ] && exit 1
          cp -v "$LIB" "$DEST/lib/libfrida-gumjs.a"
          GUMJS_H=$(find /tmp/dk32 -name "frida-gumjs.h" | head -1)
          GUM_H=$(find /tmp/dk32 -name "frida-gum.h" | head -1)
          [ -n "$GUMJS_H" ] && cp -v "$GUMJS_H" "$DEST/include/frida-gumjs.h"
          [ -n "$GUM_H" ] && cp -v "$GUM_H" "$DEST/include/frida-gum.h"
          GLIB_DIR=$(find /tmp/dk32 -type d -name "glib-2.0" | head -1)
          [ -n "$GLIB_DIR" ] && cp -rv "$GLIB_DIR" "$DEST/include/glib-2.0"
          ls -lah "$DEST/lib/"

      - name: Patch Helper.java
        run: |
          python3 - <<'PYEOF'
          import re, pathlib, sys
          p = pathlib.Path("app/src/main/java/com/menu/imgui/Helper.java")
          s = p.read_text(); orig = s

          # 1. registerLifecycle (insert after class opening)
          register_lifecycle = "\n".join([
              "private static void registerLifecycle(android.app.Activity activity, OverlaySurfaceView glView) {",
              "    activity.getApplication().registerActivityLifecycleCallbacks(",
              "        new android.app.Application.ActivityLifecycleCallbacks() {",
              "            @Override public void onActivityPaused(android.app.Activity a) { if (a == activity) glView.onPause(); }",
              "            @Override public void onActivityResumed(android.app.Activity a) { if (a == activity) glView.onResume(); }",
              "            @Override public void onActivityCreated(android.app.Activity a, android.os.Bundle b) {}",
              "            @Override public void onActivityStarted(android.app.Activity a) {}",
              "            @Override public void onActivityStopped(android.app.Activity a) {}",
              "            @Override public void onActivitySaveInstanceState(android.app.Activity a, android.os.Bundle b) {}",
              "            @Override public void onActivityDestroyed(android.app.Activity a) {}",
              "        });",
              "}",
          ])
          if "registerLifecycle" not in s:
              m = re.search(r'(public\s+class\s+Helper\s*\{)', s)
              if not m:
                  print("FAIL: could not find 'public class Helper {'")
                  sys.exit(2)
              s = s[:m.end()] + "\n" + register_lifecycle + "\n" + s[m.end():]
              print("PASS: inserted registerLifecycle")
          else:
              print("SKIP: registerLifecycle already present")

          # 2. replace attach (idempotency marker: 'Overlay added to DecorView')
          if "Overlay added to DecorView" not in s:
              m = re.search(r'public\s+static\s+void\s+attach\s*\(\s*(?:android\.content\.)?(?:Context|Activity)\s+\w+\s*\)\s*\{', s)
              if not m:
                  print("FAIL: attach(Context|Activity) signature not found")
                  print("--- grep of 'attach' ---")
                  for i, line in enumerate(s.splitlines(), 1):
                      if "attach" in line:
                          print(i, line)
                  sys.exit(2)
              brace_start = s.index('{', m.end() - 1)
              depth = 0; end = -1
              for i in range(brace_start, len(s)):
                  if s[i] == '{': depth += 1
                  elif s[i] == '}':
                      depth -= 1
                      if depth == 0: end = i + 1; break
              if end < 0:
                  print("FAIL: brace-count failed for attach")
                  sys.exit(2)
              new_attach = "\n".join([
                  "public static void attach(Context context) {",
                  "    final android.app.Activity activity;",
                  "    if (context instanceof android.app.Activity) {",
                  "        activity = (android.app.Activity) context;",
                  "    } else if (context instanceof android.content.ContextWrapper) {",
                  "        android.content.Context base = ((android.content.ContextWrapper) context).getBaseContext();",
                  "        activity = (base instanceof android.app.Activity) ? (android.app.Activity) base : null;",
                  "    } else {",
                  "        activity = null;",
                  "    }",
                  "    if (activity == null) { android.util.Log.e(\"DexTool\", \"attach: no Activity\"); return; }",
                  "    activity.runOnUiThread(() -> {",
                  "        final android.view.ViewGroup decor = (android.view.ViewGroup) activity.getWindow().getDecorView();",
                  "        if (decor == null) { activity.getWindow().getDecorView().post(() -> attach(activity)); return; }",
                  "        OverlaySurfaceView glView = new OverlaySurfaceView(activity);",
                  "        android.view.ViewGroup.LayoutParams lp = new android.view.ViewGroup.LayoutParams(",
                  "            android.view.ViewGroup.LayoutParams.MATCH_PARENT,",
                  "            android.view.ViewGroup.LayoutParams.MATCH_PARENT);",
                  "        decor.addView(glView, lp);",
                  "        registerLifecycle(activity, glView);",
                  "        android.util.Log.i(\"DexTool\", \"Overlay added to DecorView\");",
                  "    });",
                  "}",
              ])
              s = s[:m.start()] + new_attach + s[end:]
              print("PASS: replaced attach")
          else:
              print("SKIP: attach already replaced")

          # 3. best-effort dedup in syncPatches
          if "TEMP:DEDUP" not in s:
              sm = re.search(r'void\s+syncPatches\s*\(\s*\)\s*\{', s)
              fm = re.search(r'((?:List|ArrayList|Collection|LinkedList)\s*<\s*PatchRecord\s*>\s*)(\w+)\s*[;=]', s)
              if sm and fm:
                  field_name = fm.group(2)
                  dedup = "\n".join([
                      "        // TEMP:DEDUP",
                      "        try {",
                      "            java.util.Map<String, PatchRecord> __map = new java.util.LinkedHashMap<>();",
                      "            java.lang.reflect.Field __fC = null, __fM = null;",
                      "            for (PatchRecord __r : " + field_name + ") {",
                      "                if (__fC == null) {",
                      "                    try { __fC = __r.getClass().getDeclaredField(\"className\"); __fC.setAccessible(true); } catch (Throwable __e) {}",
                      "                    try { __fM = __r.getClass().getDeclaredField(\"methodName\"); __fM.setAccessible(true); } catch (Throwable __e) {}",
                      "                }",
                      "                String __k;",
                      "                if (__fC != null && __fM != null) {",
                      "                    __k = String.valueOf(__fC.get(__r)) + \"#\" + String.valueOf(__fM.get(__r));",
                      "                } else {",
                      "                    __k = String.valueOf(System.identityHashCode(__r));",
                      "                }",
                      "                __map.put(__k, __r);",
                      "            }",
                      "            " + field_name + ".clear();",
                      "            " + field_name + ".addAll(__map.values());",
                      "        } catch (Throwable __t) { }",
                      "",
                  ])
                  s = s[:sm.end()] + dedup + s[sm.end():]
                  print("PASS: inserted dedup in syncPatches (field '" + field_name + "')")
              else:
                  print("WARN: syncPatches or patch list field not found; dedup skipped")
          else:
              print("SKIP: dedup already present")

          if s == orig:
              print("WARN: Helper.java unchanged")
          p.write_text(s)
          PYEOF

      - name: Patch OverlaySurfaceView.java
        run: |
          python3 - <<'PYEOF'
          import re, pathlib, sys
          p = pathlib.Path("app/src/main/java/com/menu/imgui/OverlaySurfaceView.java")
          s = p.read_text(); orig = s

          numeric_ime = "\n".join([
              "@Override",
              "public android.view.inputmethod.InputConnection onCreateInputConnection(android.view.inputmethod.EditorInfo outAttrs) {",
              "    android.view.inputmethod.InputConnection ic = super.onCreateInputConnection(outAttrs);",
              "    if (Helper.nativeWantKeyboard()) {",
              "        outAttrs.inputType = android.text.InputType.TYPE_CLASS_NUMBER",
              "            | android.text.InputType.TYPE_NUMBER_FLAG_DECIMAL",
              "            | android.text.InputType.TYPE_NUMBER_FLAG_SIGNED;",
              "        outAttrs.imeOptions = android.view.inputmethod.EditorInfo.IME_ACTION_DONE;",
              "    }",
              "    return ic;",
              "}",
          ])
          if "TYPE_CLASS_NUMBER" not in s:
              m = re.search(r'(public\s+)?class\s+OverlaySurfaceView\b[^{]*\{', s)
              if not m:
                  print("FAIL: class OverlaySurfaceView declaration not found")
                  sys.exit(2)
              s = s[:m.end()] + "\n" + numeric_ime + "\n" + s[m.end():]
              print("PASS: inserted numeric onCreateInputConnection")
          else:
              print("SKIP: TYPE_CLASS_NUMBER already present")

          if s == orig:
              print("WARN: OverlaySurfaceView.java unchanged")
          p.write_text(s)
          PYEOF

      - name: Patch native-lib.cpp
        run: |
          python3 - <<'PYEOF'
          import pathlib
          p = pathlib.Path("app/src/main/cpp/tool/native-lib.cpp")
          s = p.read_text(); orig = s

          if "std::once_flag frida_once" not in s:
              if '#include <mutex>' not in s:
                  s = s.replace('#include <jni.h>', '#include <jni.h>\n#include <mutex>', 1)
              if 'gum_init_embedded();' in s:
                  s = s.replace('gum_init_embedded();',
                                'static std::once_flag frida_once;\n    std::call_once(frida_once, []() { gum_init_embedded(); });', 1)
                  print("PASS: wrapped gum_init_embedded")
              else:
                  print("WARN: gum_init_embedded() not found verbatim")
          else:
              print("SKIP: once_flag already present")

          if s == orig:
              print("WARN: native-lib.cpp unchanged")
          p.write_text(s)
          PYEOF

      - name: Patch agent.js
        run: |
          mkdir -p /tmp/agent && cd /tmp/agent
          npm init -y >/dev/null
          npm install frida-java-bridge >/dev/null
          cat > agent.js <<'AGENTEOF'
          import Java from "frida-java-bridge";
          const HOOKED = new Set();
          Java.perform(function () {
            console.log("[*] Patch Agent Loaded");
            function findClassLoader(className) {
              let found = null;
              try {
                Java.enumerateClassLoadersSync().forEach(function (loader) {
                  try { if (loader.findClass(className)) found = loader; } catch (e) {}
                });
              } catch (e) {}
              return found;
            }
            recv(function (msg) {
              try {
                const cmd = JSON.parse(msg);
                if (cmd.action !== "patchMethod") return;
                const key = cmd.className + "#" + cmd.methodName + "#" + (cmd.signature || "");
                if (HOOKED.has(key)) { console.log("[*] Already patched: " + key); return; }
                const loader = findClassLoader(cmd.className) || null;
                const cls = loader ? Java.use(cmd.className, { classLoader: loader })
                                   : Java.use(cmd.className);
                const overloads = cls[cmd.methodName].overloads;
                const target = cmd.signature
                  ? overloads.find(o => o.argumentTypes.map(t => t.className).join() === cmd.signature)
                  : overloads[0];
                if (!target) { console.log("[!] Overload not found: " + key); return; }
                target.implementation = function () { return cmd.returnValue; };
                HOOKED.add(key);
                console.log("[*] Patched " + key);
              } catch (e) { console.log("[!] " + e.message); }
            });
            send({ type: "ready" });
          });
          AGENTEOF
          npx frida-compile agent.js -o agent-compiled.js -S -c
          mkdir -p "$GITHUB_WORKSPACE/app/src/main/assets"
          cp agent-compiled.js "$GITHUB_WORKSPACE/app/src/main/assets/agent.js"
          echo "agent.js ready"

      - name: Verify sources
        run: |
          FAIL=0
          for f in app/src/main/cpp/tool/native-lib.cpp \
                   app/src/main/cpp/tool/dex_data.h \
                   app/src/main/java/com/menu/imgui/Helper.java \
                   app/src/main/java/com/menu/imgui/OverlaySurfaceView.java \
                   app/src/main/assets/agent.js; do
            if [ -s "$f" ]; then echo "OK  exists: $f"; else echo "ERR MISSING: $f"; FAIL=1; fi
          done
          check() {
            if grep -q "$2" "$1"; then echo "OK  found '$2' in $1"; else echo "ERR MISSING '$2' in $1"; FAIL=1; fi
          }
          check app/src/main/cpp/tool/native-lib.cpp "frida_once"
          check app/src/main/java/com/menu/imgui/Helper.java "registerLifecycle"
          check app/src/main/java/com/menu/imgui/Helper.java "Overlay added to DecorView"
          check app/src/main/java/com/menu/imgui/OverlaySurfaceView.java "onCreateInputConnection"
          if [ $FAIL -ne 0 ]; then
            echo "===== DIAGNOSTIC: Helper.java attach area ====="
            grep -n "attach\|registerLifecycle\|Overlay added" app/src/main/java/com/menu/imgui/Helper.java | head -30 || true
            echo "===== DIAGNOSTIC: OverlaySurfaceView class decl ====="
            grep -n "class OverlaySurfaceView\|onCreateInputConnection\|TYPE_CLASS_NUMBER\|setZOrderOnTop" app/src/main/java/com/menu/imgui/OverlaySurfaceView.java | head -20 || true
            echo "===== DIAGNOSTIC: native-lib InputText usages ====="
            grep -n "InputText\|InputInt\|InputFloat" app/src/main/cpp/tool/native-lib.cpp | head -20 || true
            exit 1
          fi
          echo "all source checks passed"

      - name: Write CMakeLists.txt
        run: |
          cat > app/src/main/cpp/CMakeLists.txt <<'CMEOF'
          cmake_minimum_required(VERSION 3.22.1)
          project("tool")
          set(CMAKE_CXX_STANDARD 17)
          if(NOT CMAKE_BUILD_TYPE)
              set(CMAKE_BUILD_TYPE Release CACHE STRING "" FORCE)
          endif()
          set(CMAKE_C_FLAGS_RELEASE "-Oz -DNDEBUG -ffunction-sections -fdata-sections -fvisibility=hidden")
          set(CMAKE_CXX_FLAGS_RELEASE "-Oz -DNDEBUG -ffunction-sections -fdata-sections -fvisibility=hidden")
          if(${ANDROID_ABI} STREQUAL "arm64-v8a")
              set(FRIDA_DIR /tmp/frida-built/arm64-v8a)
          elseif(${ANDROID_ABI} STREQUAL "armeabi-v7a")
              set(FRIDA_DIR /tmp/frida-built/armeabi-v7a)
          else()
              message(FATAL_ERROR "Unsupported ABI")
          endif()
          include_directories(${FRIDA_DIR}/include ${FRIDA_DIR}/include/glib-2.0)
          add_library(frida-gumjs STATIC IMPORTED)
          set_target_properties(frida-gumjs PROPERTIES IMPORTED_LOCATION ${FRIDA_DIR}/lib/libfrida-gumjs.a)
          include_directories(imgui imgui/backends tool)
          add_library(tool SHARED
              tool/native-lib.cpp
              imgui/imgui.cpp
              imgui/imgui_draw.cpp
              imgui/imgui_tables.cpp
              imgui/imgui_widgets.cpp
              imgui/backends/imgui_impl_android.cpp
              imgui/backends/imgui_impl_opengl3.cpp)
          target_link_options(tool PRIVATE -Wl,--gc-sections -Wl,--exclude-libs,ALL -Wl,--strip-all)
          target_link_libraries(tool frida-gumjs android log EGL GLESv3 dl)
          CMEOF

      - name: Write build.gradle.kts
        run: |
          cat > app/build.gradle.kts <<'GRADLEEOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.tool"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.tool"
                  minSdk = 27
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
                  externalNativeBuild {
                      cmake {
                          cppFlags += "-std=c++17"
                          arguments += listOf("-DCMAKE_BUILD_TYPE=Release")
                      }
                  }
                  ndk { abiFilters += listOf("arm64-v8a", "armeabi-v7a") }
              }
              externalNativeBuild {
                  cmake {
                      path = file("src/main/cpp/CMakeLists.txt")
                      version = "3.22.1"
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              buildTypes {
                  getByName("debug") {
                      externalNativeBuild {
                          cmake { arguments += listOf("-DCMAKE_BUILD_TYPE=Release") }
                      }
                  }
              }
              packaging { jniLibs { useLegacyPackaging = true } }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
          }
          GRADLEEOF

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Build APK
        run: |
          if [ ! -s gradlew ]; then gradle wrapper --gradle-version 8.5; fi
          chmod +x gradlew
          rm -rf app/.cxx app/build .gradle
          ./gradlew :app:assembleDebug --no-build-cache --stacktrace

      - name: Zipalign APK
        run: |
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          echo "Original APK: $APK"
          cp "$APK" /tmp/app-unaligned.apk
          zipalign -p -f 4 /tmp/app-unaligned.apk "$APK"
          echo "zipaligned with -p 4"
          unzip -l "$APK" | grep "\.so"

      - name: Strip and size report
        run: |
          NDK_STRIP=$(find $NDK_PATH -name "llvm-strip" | head -1)
          for SO in $(find app/build -name "libtool.so"); do
            ABI=$(echo "$SO" | grep -oE "(arm64-v8a|armeabi-v7a)")
            echo "=== $ABI ==="
            echo "Before: $(stat -c%s "$SO" | numfmt --to=iec)"
            $NDK_STRIP --strip-all "$SO"
            SIZE=$(stat -c%s "$SO")
            echo "After: $(awk "BEGIN {printf \"%.2f\", $SIZE/1048576}") MB"
          done

      - name: Extract artifacts
        run: |
          mkdir -p /tmp/so-out
          for SO in $(find app/build -name "libtool.so"); do
            ABI=$(echo "$SO" | grep -oE "(arm64-v8a|armeabi-v7a)")
            cp "$SO" "/tmp/so-out/libtool-${ABI}.so"
          done
          ls -lah /tmp/so-out/

      - uses: actions/upload-artifact@v4
        with:
          name: libtool-slim
          path: /tmp/so-out/*.so

      - uses: actions/upload-artifact@v4
        with:
          name: app-slim
          path: app/build/outputs/apk/debug/*.apk

      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "fix: YAML syntax + robust java/cpp patches + zipalign [skip ci]"
          git push
