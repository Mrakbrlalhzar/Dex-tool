name: Frida GumJS Slim (Source)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cleanup old workflows
        run: |
          cd .github/workflows
          for f in *.yml *.yaml; do
            if [ -f "$f" ] && [ "$f" != "frida-from-source.yml" ]; then rm -f "$f"; fi
          done
          ls -la

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pip ninja-build pkg-config libglib2.0-dev unzip curl zipalign
          pip3 install --quiet --upgrade pip
          pip3 install --quiet meson
          wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux.zip -O /tmp/ndk-r25c.zip
          unzip -q /tmp/ndk-r25c.zip -d /tmp/
          echo "NDK_PATH=/tmp/android-ndk-r25c" >> $GITHUB_ENV
          curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
          sudo apt-get install -y nodejs
          echo "NDK_PATH=$NDK_PATH"; node --version

      - name: Download Frida devkit
        run: |
          set -e
          FRIDA_VERSION="17.1.0"
          BASE="https://github.com/frida/frida/releases/download/${FRIDA_VERSION}"
          wget -q "${BASE}/frida-gumjs-devkit-${FRIDA_VERSION}-android-arm64.tar.xz" -O /tmp/dk64.tar.xz
          mkdir -p /tmp/dk64 && tar -xf /tmp/dk64.tar.xz -C /tmp/dk64
          wget -q "${BASE}/frida-gumjs-devkit-${FRIDA_VERSION}-android-arm.tar.xz" -O /tmp/dk32.tar.xz
          mkdir -p /tmp/dk32 && tar -xf /tmp/dk32.tar.xz -C /tmp/dk32
          echo "=== arm64 devkit contents ==="
          find /tmp/dk64 -type f | head -40
          echo "=== arm devkit contents ==="
          find /tmp/dk32 -type f | head -40

      - name: Clone frida-gum source
        run: |
          git clone --recursive --depth 1 --branch 17.1.0 https://github.com/frida/frida-gum.git /tmp/frida-gum
          cd /tmp/frida-gum; echo "cloned"

      - name: Patch glib_init
        run: |
          cd /tmp/frida-gum
          sed -i '1i void glib_init(void);' bindings/gumjs/gumquickcompile.c
          echo "patched"

      - name: Build arm64
        timeout-minutes: 60
        run: |
          set -o pipefail
          cd /tmp/frida-gum
          export ANDROID_NDK_ROOT="$NDK_PATH"
          rm -rf build
          ./configure --host=android-arm64 -- \
            -Ddevkits=gum,gumjs -Dgumjs=enabled -Dquickjs=enabled -Dv8=disabled \
            -Ddatabase=disabled -Dtests=disabled -Ddiet=true -Db_ndebug=true \
            -Ddefault_library=static -Dlibunwind:minidebuginfo=disabled \
            -Dlibdwarf:decompression=false 2>&1 | tee /tmp/arm64-configure.log
          [ ${PIPESTATUS[0]} -ne 0 ] && { tail -60 /tmp/arm64-configure.log; exit 1; }
          make -j$(nproc) 2>&1 | tee /tmp/arm64-build.log
          python3 releng/devkit.py frida-gumjs android-arm64 2>&1 | tee /tmp/arm64-devkit.log || true
          LIB=$(find build -name "libfrida-gumjs.a" | head -1)
          [ -z "$LIB" ] && LIB=$(find build -path "*devkit*" -name "libfrida-gumjs*.a" ! -name "*inspector*" | head -1)
          [ -z "$LIB" ] && LIB=$(find build -name "libfrida-gumjs*.a" ! -name "*inspector*" | head -1)
          [ -z "$LIB" ] && { tail -80 /tmp/arm64-devkit.log; exit 1; }
          echo "arm64 library located: $LIB"
          echo "=== generated headers in build (arm64) ==="
          find build -maxdepth 4 -name "frida-*.h" -type f 2>/dev/null | head -20 || true

      - name: Stage arm64
        run: |
          set -e
          DEST=/tmp/frida-built/arm64-v8a
          rm -rf "$DEST"; mkdir -p "$DEST/lib" "$DEST/include"

          LIB=$(find /tmp/frida-gum/build -name "libfrida-gumjs.a" | head -1)
          [ -z "$LIB" ] && LIB=$(find /tmp/frida-gum/build -path "*devkit*" -name "libfrida-gumjs*.a" ! -name "*inspector*" | head -1)
          [ -z "$LIB" ] && LIB=$(find /tmp/frida-gum/build -name "libfrida-gumjs*.a" ! -name "*inspector*" | head -1)
          if [ -z "$LIB" ]; then echo "FATAL: no libfrida-gumjs.a for arm64"; exit 1; fi
          cp -v "$LIB" "$DEST/lib/libfrida-gumjs.a"

          echo "=== devkit files (arm64) ==="
          find /tmp/dk64 -type f 2>/dev/null | head -40 || true

          # frida-gumjs.h (required)
          GUMJS_H=$(find /tmp/dk64 -name "frida-gumjs.h" 2>/dev/null | head -1)
          if [ -z "$GUMJS_H" ]; then
            echo "FATAL: frida-gumjs.h not found in devkit"
            find /tmp/dk64 -type f 2>/dev/null | head -40
            exit 1
          fi
          cp -v "$GUMJS_H" "$DEST/include/frida-gumjs.h"

          # frida-gum.h (optional; search multiple locations)
          GUM_H=$(find /tmp/dk64 -name "frida-gum.h" 2>/dev/null | head -1)
          [ -z "$GUM_H" ] && GUM_H=$(find /tmp/frida-gum/build -name "frida-gum.h" 2>/dev/null | head -1)
          [ -z "$GUM_H" ] && GUM_H=$(find /tmp/frida-gum -name "frida-gum.h" 2>/dev/null | head -1)
          if [ -n "$GUM_H" ]; then
            echo "Found frida-gum.h at: $GUM_H"
            cp -v "$GUM_H" "$DEST/include/frida-gum.h"
          else
            echo "WARN: frida-gum.h not found anywhere"
            if grep -q 'frida-gum\.h' /tmp/dk64/frida-gumjs.h 2>/dev/null; then
              echo "FATAL: frida-gumjs.h includes frida-gum.h but it is missing"
              exit 1
            else
              echo "OK: frida-gumjs.h does not require frida-gum.h (self-contained)"
            fi
          fi

          # glib-2.0 headers
          GLIB_DIR=$(find /tmp/dk64 -type d -name "glib-2.0" 2>/dev/null | head -1)
          if [ -n "$GLIB_DIR" ]; then
            cp -rv "$GLIB_DIR" "$DEST/include/glib-2.0"
          else
            echo "WARN: glib-2.0 directory not found in devkit"
          fi

          echo "=== Staged arm64 lib ==="
          ls -lah "$DEST/lib/"
          echo "=== Staged arm64 include ==="
          ls -lah "$DEST/include/"

      - name: Build armv7
        timeout-minutes: 60
        run: |
          set -o pipefail
          cd /tmp/frida-gum
          export ANDROID_NDK_ROOT="$NDK_PATH"
          rm -rf build
          ./configure --host=android-arm -- \
            -Ddevkits=gum,gumjs -Dgumjs=enabled -Dquickjs=enabled -Dv8=disabled \
            -Ddatabase=disabled -Dtests=disabled -Ddiet=true -Db_ndebug=true \
            -Ddefault_library=static -Dlibunwind:minidebuginfo=disabled \
            -Dlibdwarf:decompression=false 2>&1 | tee /tmp/armv7-configure.log
          [ ${PIPESTATUS[0]} -ne 0 ] && { tail -60 /tmp/armv7-configure.log; exit 1; }
          make -j$(nproc) 2>&1 | tee /tmp/armv7-build.log
          python3 releng/devkit.py frida-gumjs android-arm 2>&1 | tee /tmp/armv7-devkit.log || true
          LIB=$(find build -name "libfrida-gumjs.a" | head -1)
          [ -z "$LIB" ] && LIB=$(find build -path "*devkit*" -name "libfrida-gumjs*.a" ! -name "*inspector*" | head -1)
          [ -z "$LIB" ] && LIB=$(find build -name "libfrida-gumjs*.a" ! -name "*inspector*" | head -1)
          [ -z "$LIB" ] && { tail -80 /tmp/armv7-devkit.log; exit 1; }
          echo "armv7 library located: $LIB"
          echo "=== generated headers in build (armv7) ==="
          find build -maxdepth 4 -name "frida-*.h" -type f 2>/dev/null | head -20 || true

      - name: Stage armv7
        run: |
          set -e
          DEST=/tmp/frida-built/armeabi-v7a
          rm -rf "$DEST"; mkdir -p "$DEST/lib" "$DEST/include"

          LIB=$(find /tmp/frida-gum/build -name "libfrida-gumjs.a" | head -1)
          [ -z "$LIB" ] && LIB=$(find /tmp/frida-gum/build -path "*devkit*" -name "libfrida-gumjs*.a" ! -name "*inspector*" | head -1)
          [ -z "$LIB" ] && LIB=$(find /tmp/frida-gum/build -name "libfrida-gumjs*.a" ! -name "*inspector*" | head -1)
          if [ -z "$LIB" ]; then echo "FATAL: no libfrida-gumjs.a for armv7"; exit 1; fi
          cp -v "$LIB" "$DEST/lib/libfrida-gumjs.a"

          echo "=== devkit files (armv7) ==="
          find /tmp/dk32 -type f 2>/dev/null | head -40 || true

          GUMJS_H=$(find /tmp/dk32 -name "frida-gumjs.h" 2>/dev/null | head -1)
          if [ -z "$GUMJS_H" ]; then
            echo "FATAL: frida-gumjs.h not found in devkit"
            find /tmp/dk32 -type f 2>/dev/null | head -40
            exit 1
          fi
          cp -v "$GUMJS_H" "$DEST/include/frida-gumjs.h"

          GUM_H=$(find /tmp/dk32 -name "frida-gum.h" 2>/dev/null | head -1)
          [ -z "$GUM_H" ] && GUM_H=$(find /tmp/frida-gum/build -name "frida-gum.h" 2>/dev/null | head -1)
          [ -z "$GUM_H" ] && GUM_H=$(find /tmp/frida-gum -name "frida-gum.h" 2>/dev/null | head -1)
          if [ -n "$GUM_H" ]; then
            echo "Found frida-gum.h at: $GUM_H"
            cp -v "$GUM_H" "$DEST/include/frida-gum.h"
          else
            echo "WARN: frida-gum.h not found anywhere"
            if grep -q 'frida-gum\.h' /tmp/dk32/frida-gumjs.h 2>/dev/null; then
              echo "FATAL: frida-gumjs.h includes frida-gum.h but it is missing"
              exit 1
            else
              echo "OK: frida-gumjs.h does not require frida-gum.h (self-contained)"
            fi
          fi

          GLIB_DIR=$(find /tmp/dk32 -type d -name "glib-2.0" 2>/dev/null | head -1)
          if [ -n "$GLIB_DIR" ]; then
            cp -rv "$GLIB_DIR" "$DEST/include/glib-2.0"
          else
            echo "WARN: glib-2.0 directory not found in devkit"
          fi

          echo "=== Staged armv7 lib ==="
          ls -lah "$DEST/lib/"
          echo "=== Staged armv7 include ==="
          ls -lah "$DEST/include/"

      # ============ FIX Helper.java ============
      - name: Fix Helper.java (remove dead patchRecordExists + dedup + attach)
        run: |
          python3 - <<'PYEOF'
          import re, pathlib, sys
          p = pathlib.Path("app/src/main/java/com/menu/imgui/Helper.java")
          s = p.read_text(); orig = s

          if "patchRecordExists" in s:
              m = re.search(r'private\s+static\s+boolean\s+patchRecordExists\s*\([^)]*\)\s*\{', s)
              if m:
                  brace = s.index('{', m.end()-1); depth = 0; end = -1
                  for i in range(brace, len(s)):
                      if s[i]=='{': depth+=1
                      elif s[i]=='}':
                          depth-=1
                          if depth==0: end=i+1; break
                  if end > 0:
                      s = s[:m.start()] + s[end:]
                      print("PASS: removed broken patchRecordExists")
                  else:
                      print("WARN: could not brace-count patchRecordExists")

          def patch_request(sig_regex, type_str):
              global s
              m = re.search(sig_regex, s)
              if not m:
                  print("WARN: signature not found: " + sig_regex)
                  return
              brace = s.index('{', m.end()-1); depth=0; end=-1
              for i in range(brace, len(s)):
                  if s[i]=='{': depth+=1
                  elif s[i]=='}':
                      depth-=1
                      if depth==0: end=i+1; break
              if end < 0:
                  print("WARN: brace-count failed for " + type_str); return
              body = "\n".join([
                  "public static void requestPatch" + type_str + "(String className, String target, String value) {",
                  "    for (PatchRecord __p : sActivePatches) {",
                  "        if (__p.type.equals(\"" + type_str + "\") && __p.className.equals(className) && __p.targetName.equals(target)) {",
                  "            __p.currentValue = value;",
                  "            syncPatches();",
                  "            return;",
                  "        }",
                  "    }",
                  "    PatchRecord p = new PatchRecord();",
                  "    p.id = sPatchCounter++;",
                  "    p.type = \"" + type_str + "\";",
                  "    p.className = className;",
                  "    p.targetName = target;",
                  "    p.originalValue = \"(original)\";",
                  "    p.currentValue = value;",
                  "    sActivePatches.add(p);",
                  "    syncPatches();",
                  "}",
              ])
              s = s[:m.start()] + body + s[end:]
              print("PASS: dedup added to requestPatch" + type_str)

          patch_request(r'public\s+static\s+void\s+requestPatchMethod\s*\([^)]*\)\s*\{', "Method")
          patch_request(r'public\s+static\s+void\s+requestPatchField\s*\([^)]*\)\s*\{', "Field")

          if "WindowManager" not in s or "Overlay added via WindowManager" not in s:
              m = re.search(r'public\s+static\s+void\s+attach\s*\(\s*(?:android\.content\.)?(?:Context|Activity)\s+\w+\s*\)\s*\{', s)
              if not m:
                  print("FAIL: attach(Context|Activity) not found"); sys.exit(2)
              brace = s.index('{', m.end()-1); depth=0; end=-1
              for i in range(brace, len(s)):
                  if s[i]=='{': depth+=1
                  elif s[i]=='}':
                      depth-=1
                      if depth==0: end=i+1; break
              if end < 0:
                  print("FAIL: brace-count failed for attach"); sys.exit(2)

              new_attach = "\n".join([
                  "public static void attach(Context context) {",
                  "    final android.app.Activity activity;",
                  "    if (context instanceof android.app.Activity) {",
                  "        activity = (android.app.Activity) context;",
                  "    } else if (context instanceof android.content.ContextWrapper) {",
                  "        android.content.Context base = ((android.content.ContextWrapper) context).getBaseContext();",
                  "        activity = (base instanceof android.app.Activity) ? (android.app.Activity) base : null;",
                  "    } else { activity = null; }",
                  "    if (activity == null) { android.util.Log.e(\"DexTool\", \"attach: no Activity\"); return; }",
                  "    activity.runOnUiThread(() -> {",
                  "        OverlaySurfaceView glView = new OverlaySurfaceView(activity);",
                  "        try {",
                  "            android.view.WindowManager wm = activity.getWindowManager();",
                  "            android.view.WindowManager.LayoutParams lp = new android.view.WindowManager.LayoutParams(",
                  "                android.view.WindowManager.LayoutParams.MATCH_PARENT,",
                  "                android.view.WindowManager.LayoutParams.MATCH_PARENT,",
                  "                android.view.WindowManager.LayoutParams.TYPE_APPLICATION_PANEL,",
                  "                android.view.WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE",
                  "                    | android.view.WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL",
                  "                    | android.view.WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,",
                  "                android.graphics.PixelFormat.TRANSLUCENT);",
                  "            lp.token = activity.getWindow().getDecorView().getWindowToken();",
                  "            lp.alpha = 0.01f;",
                  "            lp.gravity = android.view.Gravity.TOP | android.view.Gravity.START;",
                  "            wm.addView(glView, lp);",
                  "            registerLifecycle(activity, glView);",
                  "            android.util.Log.i(\"DexTool\", \"Overlay added via WindowManager\");",
                  "            return;",
                  "        } catch (Throwable t) {",
                  "            android.util.Log.w(\"DexTool\", \"WindowManager failed, fallback to DecorView\", t);",
                  "        }",
                  "        android.view.ViewGroup decor = (android.view.ViewGroup) activity.getWindow().getDecorView();",
                  "        if (decor == null) { activity.getWindow().getDecorView().post(() -> attach(activity)); return; }",
                  "        decor.addView(glView, new android.view.ViewGroup.LayoutParams(-1, -1));",
                  "        registerLifecycle(activity, glView);",
                  "        android.util.Log.i(\"DexTool\", \"Overlay added to DecorView (fallback)\");",
                  "    });",
                  "}",
              ])
              s = s[:m.start()] + new_attach + s[end:]
              print("PASS: attach replaced with WindowManager + fallback")

          if "registerLifecycle" not in s:
              rl = "\n".join([
                  "    private static void registerLifecycle(android.app.Activity activity, OverlaySurfaceView glView) {",
                  "        activity.getApplication().registerActivityLifecycleCallbacks(",
                  "            new android.app.Application.ActivityLifecycleCallbacks() {",
                  "                @Override public void onActivityPaused(android.app.Activity a) { if (a == activity) { try { glView.onPause(); } catch (Throwable t) {} } }",
                  "                @Override public void onActivityResumed(android.app.Activity a) { if (a == activity) { try { glView.onResume(); } catch (Throwable t) {} } }",
                  "                @Override public void onActivityCreated(android.app.Activity a, android.os.Bundle b) {}",
                  "                @Override public void onActivityStarted(android.app.Activity a) {}",
                  "                @Override public void onActivityStopped(android.app.Activity a) {}",
                  "                @Override public void onActivitySaveInstanceState(android.app.Activity a, android.os.Bundle b) {}",
                  "                @Override public void onActivityDestroyed(android.app.Activity a) {}",
                  "            });",
                  "    }",
              ])
              m2 = re.search(r'(public\s+class\s+Helper\s*\{)', s)
              if m2:
                  s = s[:m2.end()] + "\n" + rl + "\n" + s[m2.end():]
                  print("PASS: inserted registerLifecycle")

          if s == orig:
              print("WARN: Helper.java unchanged")
          p.write_text(s)
          PYEOF

      # ============ FIX getArgWidgetType (numeric) ============
      - name: Fix getArgWidgetType (numeric types)
        run: |
          python3 - <<'PYEOF'
          import re, pathlib
          p = pathlib.Path("app/src/main/java/com/menu/imgui/Helper.java")
          s = p.read_text()
          if "return 6;" in s and "return 7;" in s:
              print("SKIP: numeric widget types already present"); raise SystemExit(0)
          m = re.search(r'public\s+static\s+int\s+getArgWidgetType\s*\([^)]*\)\s*\{', s)
          if not m:
              print("FAIL: getArgWidgetType not found"); raise SystemExit(2)
          brace = s.index('{', m.end()-1); depth=0; end=-1
          for i in range(brace, len(s)):
              if s[i]=='{': depth+=1
              elif s[i]=='}':
                  depth-=1
                  if depth==0: end=i+1; break
          if end < 0:
              print("FAIL: brace-count failed"); raise SystemExit(2)
          new_fn = "\n".join([
              "public static int getArgWidgetType(String typeName) {",
              "    try {",
              "        Class<?> c = classFromString(typeName);",
              "        if (c == boolean.class || c == Boolean.class) return 1;",
              "        if (c.isEnum()) return 2;",
              "        if (Context.class.isAssignableFrom(c) || Activity.class.isAssignableFrom(c)) return 3;",
              "        if (c.isArray()) return 5;",
              "        if (c == int.class || c == Integer.class || c == long.class || c == Long.class",
              "                || c == short.class || c == Short.class || c == byte.class || c == Byte.class",
              "                || c == java.math.BigInteger.class) return 6;",
              "        if (c == float.class || c == Float.class || c == double.class || c == Double.class",
              "                || c == java.math.BigDecimal.class) return 7;",
              "        if (c == String.class || c == CharSequence.class || c == char.class || c == Character.class) return 0;",
              "        return 4;",
              "    } catch (Throwable t) { return 0; }",
              "}",
          ])
          s = s[:m.start()] + new_fn + s[end:]
          p.write_text(s)
          print("PASS: getArgWidgetType updated (6=integer, 7=float)")
          PYEOF

      # ============ FIX native-lib.cpp (InputInt / InputFloat) ============
      - name: Fix native-lib.cpp (numeric widgets)
        run: |
          python3 - <<'PYEOF'
          import pathlib
          p = pathlib.Path("app/src/main/cpp/tool/native-lib.cpp")
          s = p.read_text(); orig = s
          if "wt == 6" in s:
              print("SKIP: numeric widgets already present"); raise SystemExit(0)
          old = 'ImGui::InputText("##arg", st.argBufs[i], sizeof(st.argBufs[i])); } else if (wt == 1)'
          new = "\n".join([
              'ImGui::InputText("##arg", st.argBufs[i], sizeof(st.argBufs[i]));',
              '} else if (wt == 6) {',
              '    int iv = 0; try { iv = std::stoi(st.argBufs[i]); } catch (...) {}',
              '    ImGui::SetNextItemWidth(-1);',
              '    if (ImGui::InputInt("##int", &iv)) snprintf(st.argBufs[i], sizeof(st.argBufs[i]), "%d", iv);',
              '} else if (wt == 7) {',
              '    float fv = 0.0f; try { fv = std::stof(st.argBufs[i]); } catch (...) {}',
              '    ImGui::SetNextItemWidth(-1);',
              '    if (ImGui::InputFloat("##float", &fv)) snprintf(st.argBufs[i], sizeof(st.argBufs[i]), "%.6g", fv);',
              '} else if (wt == 1)',
          ])
          if old in s:
              s = s.replace(old, new, 1)
              print("PASS: inserted InputInt/InputFloat for wt==6/7")
          else:
              print("WARN: primary pattern not found; trying fallback")
              fb = '} else { ImGui::SetNextItemWidth(-1); ImGui::InputText("##arg", st.argBufs[i], sizeof(st.argBufs[i])); }'
              if fb in s:
                  s = s.replace(fb, new + '\n} else { ImGui::SetNextItemWidth(-1); ImGui::InputText("##arg", st.argBufs[i], sizeof(st.argBufs[i])); }', 1)
                  print("PASS: inserted via fallback")
              else:
                  print("FATAL: could not locate insertion point — dumping wt-related lines")
                  for i, line in enumerate(s.splitlines(), 1):
                      if 'InputText' in line or 'wt ==' in line or 'argBufs' in line:
                          print(i, line)
                  raise SystemExit(2)
          if s == orig:
              print("WARN: native-lib.cpp unchanged")
          p.write_text(s)
          PYEOF

      - name: Verify sources
        run: |
          FAIL=0
          check() { if grep -q "$2" "$1"; then echo "OK  '$2' in $1"; else echo "ERR MISSING '$2' in $1"; FAIL=1; fi; }
          check app/src/main/java/com/menu/imgui/Helper.java "TYPE_APPLICATION_PANEL"
          check app/src/main/java/com/menu/imgui/Helper.java "return 6;"
          check app/src/main/cpp/tool/native-lib.cpp "InputInt"
          if grep -q "patchRecordExists" app/src/main/java/com/menu/imgui/Helper.java; then
            echo "ERR patchRecordExists still present"; FAIL=1
          else
            echo "OK  patchRecordExists removed"
          fi
          if [ $FAIL -ne 0 ]; then
            echo "===== Helper.java attach area ====="; grep -n "attach\|WindowManager\|registerLifecycle\|patchRecordExists" app/src/main/java/com/menu/imgui/Helper.java | head -30
            echo "===== native-lib wt handling ====="; grep -n "wt == 6\|wt == 7\|InputInt\|InputFloat" app/src/main/cpp/tool/native-lib.cpp | head -20
            exit 1
          fi
          echo "all checks passed"

      - name: Write CMakeLists.txt
        run: |
          cat > app/src/main/cpp/CMakeLists.txt <<'CMEOF'
          cmake_minimum_required(VERSION 3.22.1)
          project("tool")
          set(CMAKE_CXX_STANDARD 17)
          if(NOT CMAKE_BUILD_TYPE)
              set(CMAKE_BUILD_TYPE Release CACHE STRING "" FORCE)
          endif()
          set(CMAKE_C_FLAGS_RELEASE "-Oz -DNDEBUG -ffunction-sections -fdata-sections -fvisibility=hidden")
          set(CMAKE_CXX_FLAGS_RELEASE "-Oz -DNDEBUG -ffunction-sections -fdata-sections -fvisibility=hidden")
          if(${ANDROID_ABI} STREQUAL "arm64-v8a")
              set(FRIDA_DIR /tmp/frida-built/arm64-v8a)
          elseif(${ANDROID_ABI} STREQUAL "armeabi-v7a")
              set(FRIDA_DIR /tmp/frida-built/armeabi-v7a)
          else()
              message(FATAL_ERROR "Unsupported ABI")
          endif()
          include_directories(${FRIDA_DIR}/include ${FRIDA_DIR}/include/glib-2.0)
          add_library(frida-gumjs STATIC IMPORTED)
          set_target_properties(frida-gumjs PROPERTIES IMPORTED_LOCATION ${FRIDA_DIR}/lib/libfrida-gumjs.a)
          include_directories(imgui imgui/backends tool)
          add_library(tool SHARED
              tool/native-lib.cpp
              imgui/imgui.cpp
              imgui/imgui_draw.cpp
              imgui/imgui_tables.cpp
              imgui/imgui_widgets.cpp
              imgui/backends/imgui_impl_android.cpp
              imgui/backends/imgui_impl_opengl3.cpp)
          target_link_options(tool PRIVATE -Wl,--gc-sections -Wl,--exclude-libs,ALL -Wl,--strip-all)
          target_link_libraries(tool frida-gumjs android log EGL GLESv3 dl)
          CMEOF

      - name: Write build.gradle.kts
        run: |
          cat > app/build.gradle.kts <<'GRADLEEOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.tool"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.tool"
                  minSdk = 27
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
                  externalNativeBuild {
                      cmake {
                          cppFlags += "-std=c++17"
                          arguments += listOf("-DCMAKE_BUILD_TYPE=Release")
                      }
                  }
                  ndk { abiFilters += listOf("arm64-v8a", "armeabi-v7a") }
              }
              externalNativeBuild {
                  cmake {
                      path = file("src/main/cpp/CMakeLists.txt")
                      version = "3.22.1"
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              buildTypes {
                  getByName("debug") {
                      externalNativeBuild {
                          cmake { arguments += listOf("-DCMAKE_BUILD_TYPE=Release") }
                      }
                  }
              }
              packaging { jniLibs { useLegacyPackaging = true } }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
          }
          GRADLEEOF

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Build APK
        run: |
          if [ ! -s gradlew ]; then gradle wrapper --gradle-version 8.5; fi
          chmod +x gradlew
          rm -rf app/.cxx app/build .gradle
          ./gradlew :app:assembleDebug --no-build-cache --stacktrace

      - name: Zipalign APK
        run: |
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          cp "$APK" /tmp/app-unaligned.apk
          zipalign -p -f 4 /tmp/app-unaligned.apk "$APK"
          echo "zipaligned with -p 4"
          unzip -l "$APK" | grep "\.so"

      - name: Strip and size report
        run: |
          NDK_STRIP=$(find $NDK_PATH -name "llvm-strip" | head -1)
          for SO in $(find app/build -name "libtool.so"); do
            ABI=$(echo "$SO" | grep -oE "(arm64-v8a|armeabi-v7a)")
            echo "=== $ABI ==="
            echo "Before: $(stat -c%s "$SO" | numfmt --to=iec)"
            $NDK_STRIP --strip-all "$SO"
            SIZE=$(stat -c%s "$SO")
            echo "After: $(awk "BEGIN {printf \"%.2f\", $SIZE/1048576}") MB"
          done

      - name: Extract artifacts
        run: |
          mkdir -p /tmp/so-out
          for SO in $(find app/build -name "libtool.so"); do
            ABI=$(echo "$SO" | grep -oE "(arm64-v8a|armeabi-v7a)")
            cp "$SO" "/tmp/so-out/libtool-${ABI}.so"
          done
          ls -lah /tmp/so-out/

      - uses: actions/upload-artifact@v4
        with:
          name: libtool-slim
          path: /tmp/so-out/*.so

      - uses: actions/upload-artifact@v4
        with:
          name: app-slim
          path: app/build/outputs/apk/debug/*.apk

      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "fix: optional frida-gum.h, robust header staging, dedup + numeric + overlay fixes [skip ci]"
          git push
