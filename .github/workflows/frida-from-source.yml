name: Frida GumJS Slim (Source)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }

      - name: Cleanup old workflows
        run: |
          cd .github/workflows
          for f in *.yml *.yaml; do [ -f "$f" ] && [ "$f" != "frida-from-source.yml" ] && rm -f "$f"; done
          ls -la

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pip ninja-build pkg-config libglib2.0-dev unzip curl zipalign
          pip3 install --quiet --upgrade pip
          pip3 install --quiet meson
          wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux.zip -O /tmp/ndk-r25c.zip
          unzip -q /tmp/ndk-r25c.zip -d /tmp/
          echo "NDK_PATH=/tmp/android-ndk-r25c" >> $GITHUB_ENV
          curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
          sudo apt-get install -y nodejs
          node --version

      - name: Download Frida devkit
        run: |
          set -e
          V=17.1.0; B="https://github.com/frida/frida/releases/download/$V"
          wget -q "$B/frida-gumjs-devkit-$V-android-arm64.tar.xz" -O /tmp/dk64.tar.xz
          mkdir -p /tmp/dk64 && tar -xf /tmp/dk64.tar.xz -C /tmp/dk64
          wget -q "$B/frida-gumjs-devkit-$V-android-arm.tar.xz" -O /tmp/dk32.tar.xz
          mkdir -p /tmp/dk32 && tar -xf /tmp/dk32.tar.xz -C /tmp/dk32
          echo "devkits ready"

      - name: Clone frida-gum
        run: |
          git clone --recursive --depth 1 --branch 17.1.0 https://github.com/frida/frida-gum.git /tmp/frida-gum
          cd /tmp/frida-gum
          sed -i '1i void glib_init(void);' bindings/gumjs/gumquickcompile.c
          echo "patched"

      - name: Build arm64
        timeout-minutes: 60
        run: |
          set -o pipefail
          cd /tmp/frida-gum
          export ANDROID_NDK_ROOT="$NDK_PATH"
          rm -rf build
          ./configure --host=android-arm64 -- \
            -Ddevkits=gum,gumjs -Dgumjs=enabled -Dquickjs=enabled -Dv8=disabled \
            -Ddatabase=disabled -Dtests=disabled -Ddiet=true -Db_ndebug=true \
            -Ddefault_library=static -Dlibunwind:minidebuginfo=disabled \
            -Dlibdwarf:decompression=false 2>&1 | tee /tmp/a64.log
          [ ${PIPESTATUS[0]} -ne 0 ] && { tail -60 /tmp/a64.log; exit 1; }
          make -j$(nproc) 2>&1 | tee -a /tmp/a64.log
          python3 releng/devkit.py frida-gumjs android-arm64 2>&1 | tail -20 || true
          LIB=$(find build -name "libfrida-gumjs.a" | head -1)
          [ -z "$LIB" ] && LIB=$(find build -path "*devkit*" -name "libfrida-gumjs*.a" ! -name "*inspector*" | head -1)
          [ -z "$LIB" ] && { echo "NO LIB"; tail -60 /tmp/a64.log; exit 1; }
          echo "arm64 lib: $LIB"

      - name: Stage arm64
        run: |
          set -e
          D=/tmp/frida-built/arm64-v8a; rm -rf "$D"; mkdir -p "$D/lib" "$D/include"
          LIB=$(find /tmp/frida-gum/build -name "libfrida-gumjs.a" | head -1)
          [ -z "$LIB" ] && LIB=$(find /tmp/frida-gum/build -path "*devkit*" -name "libfrida-gumjs*.a" ! -name "*inspector*" | head -1)
          [ -z "$LIB" ] && { echo "FATAL: no arm64 lib"; exit 1; }
          cp -v "$LIB" "$D/lib/libfrida-gumjs.a"
          GUMJS_H=$(find /tmp/dk64 -name 'frida-gumjs.h' | head -1)
          [ -z "$GUMJS_H" ] && { echo "FATAL: frida-gumjs.h missing"; exit 1; }
          cp -v "$GUMJS_H" "$D/include/frida-gumjs.h"
          G=$(find /tmp/dk64 -name "frida-gum.h" | head -1)
          [ -z "$G" ] && G=$(find /tmp/frida-gum/build/gum/devkit -name "frida-gum.h" | head -1)
          [ -z "$G" ] && G=$(find /tmp/frida-gum/build -name "frida-gum.h" | head -1)
          [ -n "$G" ] && cp -v "$G" "$D/include/frida-gum.h"
          GLIB_DIR=$(find /tmp/dk64 -type d -name 'glib-2.0' 2>/dev/null | head -1)
          [ -z "$GLIB_DIR" ] && GLIB_DIR=$(find /tmp/frida-gum/build/gum/devkit -type d -name 'glib-2.0' 2>/dev/null | head -1)
          [ -n "$GLIB_DIR" ] && cp -rv "$GLIB_DIR" "$D/include/glib-2.0"
          ls -lah "$D/lib/"

      - name: Build armv7
        timeout-minutes: 60
        run: |
          set -o pipefail
          cd /tmp/frida-gum
          export ANDROID_NDK_ROOT="$NDK_PATH"
          rm -rf build
          ./configure --host=android-arm -- \
            -Ddevkits=gum,gumjs -Dgumjs=enabled -Dquickjs=enabled -Dv8=disabled \
            -Ddatabase=disabled -Dtests=disabled -Ddiet=true -Db_ndebug=true \
            -Ddefault_library=static -Dlibunwind:minidebuginfo=disabled \
            -Dlibdwarf:decompression=false 2>&1 | tee /tmp/a32.log
          [ ${PIPESTATUS[0]} -ne 0 ] && { tail -60 /tmp/a32.log; exit 1; }
          make -j$(nproc) 2>&1 | tee -a /tmp/a32.log
          python3 releng/devkit.py frida-gumjs android-arm 2>&1 | tail -20 || true
          LIB=$(find build -name "libfrida-gumjs.a" | head -1)
          [ -z "$LIB" ] && LIB=$(find build -path "*devkit*" -name "libfrida-gumjs*.a" ! -name "*inspector*" | head -1)
          [ -z "$LIB" ] && { echo "NO LIB"; tail -60 /tmp/a32.log; exit 1; }
          echo "armv7 lib: $LIB"

      - name: Stage armv7
        run: |
          set -e
          D=/tmp/frida-built/armeabi-v7a; rm -rf "$D"; mkdir -p "$D/lib" "$D/include"
          LIB=$(find /tmp/frida-gum/build -name "libfrida-gumjs.a" | head -1)
          [ -z "$LIB" ] && LIB=$(find /tmp/frida-gum/build -path "*devkit*" -name "libfrida-gumjs*.a" ! -name "*inspector*" | head -1)
          [ -z "$LIB" ] && { echo "FATAL: no armv7 lib"; exit 1; }
          cp -v "$LIB" "$D/lib/libfrida-gumjs.a"
          GUMJS_H=$(find /tmp/dk32 -name 'frida-gumjs.h' | head -1)
          [ -z "$GUMJS_H" ] && { echo "FATAL: frida-gumjs.h missing"; exit 1; }
          cp -v "$GUMJS_H" "$D/include/frida-gumjs.h"
          G=$(find /tmp/dk32 -name "frida-gum.h" | head -1)
          [ -z "$G" ] && G=$(find /tmp/frida-gum/build/gum/devkit -name "frida-gum.h" | head -1)
          [ -z "$G" ] && G=$(find /tmp/frida-gum/build -name "frida-gum.h" | head -1)
          [ -n "$G" ] && cp -v "$G" "$D/include/frida-gum.h"
          GLIB_DIR=$(find /tmp/dk32 -type d -name 'glib-2.0' 2>/dev/null | head -1)
          [ -z "$GLIB_DIR" ] && GLIB_DIR=$(find /tmp/frida-gum/build/gum/devkit -type d -name 'glib-2.0' 2>/dev/null | head -1)
          [ -n "$GLIB_DIR" ] && cp -rv "$GLIB_DIR" "$D/include/glib-2.0"
          ls -lah "$D/lib/"

      # ============================================================
      # PATCH 1: Clean up broken notifyMenuOpen from previous iteration
      # ============================================================
      - name: Remove broken notifyMenuOpen from native-lib.cpp
        run: |
          python3 - <<'PYEOF'
          import re, pathlib
          p = pathlib.Path("app/src/main/cpp/tool/native-lib.cpp")
          if not p.exists():
              print("no file"); raise SystemExit(0)
          s = p.read_text(); orig = s

          # Remove helper function body
          if "static void notifyMenuOpen" in s:
              m = re.search(r'static void notifyMenuOpen\(bool open\)\s*\{', s)
              if m:
                  i = s.index('{', m.end()-1); d=0; e=-1
                  for k in range(i, len(s)):
                      if s[k]=='{': d+=1
                      elif s[k]=='}':
                          d-=1
                          if d==0: e=k+1; break
                  if e>0:
                      s = s[:m.start()] + s[e:]
                      print("PASS: removed notifyMenuOpen helper")

          # Remove call in nativeRender (with or without leading blank line)
          s = s.replace("    static bool lastMenuOpen = false;\n    if (lastMenuOpen != gMenuOpen) { lastMenuOpen = gMenuOpen; notifyMenuOpen(gMenuOpen); }\n", "")
          s = s.replace("    if (lastMenuOpen != gMenuOpen) { lastMenuOpen = gMenuOpen; notifyMenuOpen(gMenuOpen); }\n", "")
          s = s.replace("    static bool lastMenuOpen = false;\n", "")

          if s != orig:
              p.write_text(s)
          else:
              print("nothing to remove")
          PYEOF

      # ============================================================
      # PATCH 2: Helper.java
      # ============================================================
      - name: Patch Helper.java
        run: |
          python3 - <<'PYEOF'
          import re, pathlib, textwrap
          p = pathlib.Path("app/src/main/java/com/menu/imgui/Helper.java")
          s = p.read_text()

          if "sOverlayWm" not in s:
              s = s.replace("private static OverlaySurfaceView overlay;",
                  "private static OverlaySurfaceView overlay; private static android.view.WindowManager sOverlayWm; private static android.view.WindowManager.LayoutParams sOverlayLp;", 1)

          if "sOverlayWm = wm;" not in s:
              s = s.replace("wm.addView(glView, lp);",
                  "wm.addView(glView, lp); sOverlayWm = wm; sOverlayLp = lp;", 1)

          old = "if (a == activity) glView.onResume();"
          new = ("if (a == activity) { glView.onResume(); try { "
                 "if (glView.getParent() == null && sOverlayWm != null && sOverlayLp != null) { "
                 "sOverlayWm.addView(glView, sOverlayLp); android.util.Log.i(\"DexTool\", \"re-attached\"); "
                 "} } catch (Throwable t) {} }")
          if old in s and "re-attached" not in s:
              s = s.replace(old, new, 1)

          if "nativePatchMethod" not in s:
              s = s.replace("static native void nativeSetPatches",
                  "static native void nativePatchMethod(String c, String m, String v); static native void nativeSetPatches", 1)

          m = re.search(r'public static void requestPatchMethod\([^)]*\)\s*\{', s)
          if m:
              i = s.index('{', m.end()-1); d=0; end=-1
              for k in range(i, len(s)):
                  if s[k]=='{': d+=1
                  elif s[k]=='}':
                      d-=1
                      if d==0: end=k+1; break
              if end>0:
                  body = textwrap.dedent("""\
                      public static void requestPatchMethod(String className, String target, String value) {
                          for (PatchRecord __p : sActivePatches) {
                              if ("Method".equals(__p.type) && className.equals(__p.className) && target.equals(__p.targetName)) {
                                  __p.currentValue = value; syncPatches(); nativePatchMethod(className, target, value); return;
                              }
                          }
                          PatchRecord p = new PatchRecord();
                          p.id = sPatchCounter++; p.type = "Method"; p.className = className;
                          p.targetName = target; p.originalValue = "(original)"; p.currentValue = value;
                          sActivePatches.add(p); syncPatches(); nativePatchMethod(className, target, value);
                      }
                  """)
                  s = s[:m.start()] + body + s[end:]

          p.write_text(s)
          print("Helper.java patched")
          PYEOF

      # ============================================================
      # PATCH 3: OverlaySurfaceView.java
      # ============================================================
      - name: Patch OverlaySurfaceView.java
        run: |
          python3 - <<'PYEOF'
          import pathlib, textwrap
          p = pathlib.Path("app/src/main/java/com/menu/imgui/OverlaySurfaceView.java")
          s = p.read_text()

          if "setPreserveEGLContextOnPause" not in s:
              s = s.replace("setRenderMode(RENDERMODE_CONTINUOUSLY);",
                  "setRenderMode(RENDERMODE_CONTINUOUSLY); setPreserveEGLContextOnPause(true);", 1)

          if "onTouchEvent" not in s:
              methods = textwrap.dedent("""
                  @Override public boolean onTouchEvent(android.view.MotionEvent e) {
                      int action = e.getActionMasked();
                      boolean handled = Helper.nativeTouch(action, e.getX(), e.getY());
                      if (action == android.view.MotionEvent.ACTION_DOWN) return handled;
                      return super.onTouchEvent(e);
                  }
                  @Override public boolean dispatchKeyEvent(android.view.KeyEvent e) {
                      int c = e.getKeyCode();
                      if (e.getAction() == android.view.KeyEvent.ACTION_DOWN) {
                          if (c >= android.view.KeyEvent.KEYCODE_0 && c <= android.view.KeyEvent.KEYCODE_9) { Helper.nativeAddInputChar((char)('0'+(c-android.view.KeyEvent.KEYCODE_0))); return true; }
                          if (c == android.view.KeyEvent.KEYCODE_PERIOD || c == android.view.KeyEvent.KEYCODE_NUMPAD_DOT) { Helper.nativeAddInputChar('.'); return true; }
                          if (c == android.view.KeyEvent.KEYCODE_MINUS || c == android.view.KeyEvent.KEYCODE_NUMPAD_SUBTRACT) { Helper.nativeAddInputChar('-'); return true; }
                      }
                      return super.dispatchKeyEvent(e);
                  }
              """)
              s = s.replace("@Override public boolean onCheckIsTextEditor()",
                  methods + "\n@Override public boolean onCheckIsTextEditor()", 1)
          p.write_text(s)
          print("OverlaySurfaceView.java patched")
          PYEOF

      # ============================================================
      # PATCH 4: native-lib.cpp
      # ============================================================
      - name: Patch native-lib.cpp
        run: |
          python3 - <<'PYEOF'
          import re, pathlib, textwrap
          p = pathlib.Path("app/src/main/cpp/tool/native-lib.cpp")
          s = p.read_text()

          if "#include <vector>" not in s:
              s = s.replace("#include <mutex>", "#include <mutex>\n#include <vector>\n#include <string>", 1)

          if "gCallLog" not in s:
              s = s.replace("static GumScript* g_script = nullptr;",
                  "static GumScript* g_script = nullptr;\nstatic std::vector<std::string> gCallLog;\nstatic std::mutex gCallLogMutex;", 1)

          new_js = textwrap.dedent(r"""
              Java.perform(function() {
                function log(m){ console.log("[DexTool] "+m); try{ send({type:"log", msg:m}); }catch(e){} }
                log("agent loaded");
                var HOOKED = {};
                recv(function(raw) {
                  try {
                    var cmd = JSON.parse(raw);
                    log("recv: "+raw);
                    if (cmd.action !== "patchMethod") return;
                    var key = cmd.className+"#"+cmd.methodName;
                    if (HOOKED[key]) { log("already patched: "+key); return; }
                    var loaders = Java.enumerateClassLoadersSync();
                    var loader = null;
                    for (var i=0;i<loaders.length;i++){ try{ if(loaders[i].findClass(cmd.className)){ loader=loaders[i]; break; } }catch(e){} }
                    if (loader) Java.classFactory.loader = loader;
                    var cls = Java.use(cmd.className);
                    var ovs = cls[cmd.methodName].overloads;
                    var target = null;
                    for (var i=0;i<ovs.length;i++){ if(target===null && ovs[i].argumentTypes.length===0) target=ovs[i]; }
                    if (!target) target = ovs[0];
                    var rt = target.returnType.className;
                    var rv = cmd.returnValue;
                    target.implementation = function() {
                      log("HOOK HIT: "+cmd.methodName);
                      if (rt==="int"||rt==="long"||rt==="short"||rt==="byte") return parseInt(rv,10);
                      if (rt==="float"||rt==="double") return parseFloat(rv);
                      if (rt==="boolean") return rv==="true"||rv==="1";
                      if (rt==="void") return undefined;
                      return rv;
                    };
                    HOOKED[key] = true;
                    log("PATCHED: "+key);
                  } catch(e) { log("ERROR: "+e.message); }
                });
                send({type:"ready"});
              });
          """)
          if 'PATCH_AGENT_JS' in s:
              s = re.sub(r'const gchar\* PATCH_AGENT_JS = R"\(.*?\)";',
                  'const gchar* PATCH_AGENT_JS = R"(' + new_js + ')";', s, flags=re.DOTALL)

          if "Java_com_menu_imgui_Helper_nativePatchMethod" not in s:
              impl = textwrap.dedent(r'''
                  extern "C" JNIEXPORT void JNICALL
                  Java_com_menu_imgui_Helper_nativePatchMethod(JNIEnv* env, jclass, jstring jc, jstring jm, jstring jv) {
                      if (!g_script) return;
                      const char* c = env->GetStringUTFChars(jc, nullptr);
                      const char* m = env->GetStringUTFChars(jm, nullptr);
                      const char* v = env->GetStringUTFChars(jv, nullptr);
                      std::string json = "{\"action\":\"patchMethod\",\"className\":\"";
                      json += c; json += "\",\"methodName\":\""; json += m;
                      json += "\",\"returnValue\":\""; json += v; json += "\"}";
                      send_to_js(json.c_str());
                      env->ReleaseStringUTFChars(jc, c);
                      env->ReleaseStringUTFChars(jm, m);
                      env->ReleaseStringUTFChars(jv, v);
                  }
              ''')
              s = s.replace("static void drawSigil", impl + "\nstatic void drawSigil", 1)

          if "Java_com_menu_imgui_Helper_nativeTouch" not in s:
              touch = textwrap.dedent(r'''
                  extern "C" JNIEXPORT jboolean JNICALL
                  Java_com_menu_imgui_Helper_nativeTouch(JNIEnv*, jclass, jint action, jfloat x, jfloat y) {
                      ImGuiIO& io = ImGui::GetIO();
                      io.AddMousePosEvent(x, y);
                      if (action == 0) io.AddMouseButtonEvent(0, true);
                      else if (action == 1) io.AddMouseButtonEvent(0, false);
                      else if (action == 3) io.AddMouseButtonEvent(0, false);
                      return io.WantCaptureMouse ? JNI_TRUE : JNI_FALSE;
                  }
              ''')
              s = s.replace("static void drawSigil", touch + "\nstatic void drawSigil", 1)

          if 'type\\":\\"log' not in s:
              s = s.replace('LOGI("Frida JS: %s", message);',
                  'LOGI("Frida JS: %s", message); if (message && strstr(message, "\\"type\\":\\"log\\"")) { std::lock_guard<std::mutex> lk(gCallLogMutex); gCallLog.push_back(std::string("[JS] ")+message); if (gCallLog.size()>200) gCallLog.erase(gCallLog.begin()); }', 1)

          if 'push_back("[CALL]' not in s:
              s = s.replace("gPendingCallReqs.push_back(c);",
                  "gPendingCallReqs.push_back(c); { std::lock_guard<std::mutex> lk(gCallLogMutex); gCallLog.push_back(std::string(\"[CALL] \")+className+\".\"+m.name); if (gCallLog.size()>200) gCallLog.erase(gCallLog.begin()); }", 1)

          if 'BeginTabItem("Log")' not in s:
              s = s.replace('if (ImGui::BeginTabItem("Patches"))',
                  'if (ImGui::BeginTabItem("Log")) { std::lock_guard<std::mutex> lk(gCallLogMutex); ImGui::BeginChild("##logchild", ImVec2(0,0), true); for (auto& l : gCallLog) ImGui::TextUnformatted(l.c_str()); ImGui::EndChild(); ImGui::EndTabItem(); }\n        if (ImGui::BeginTabItem("Patches"))', 1)

          p.write_text(s)
          print("native-lib.cpp patched")
          PYEOF

      # ============================================================
      # REBUILD dex_data.h WITH CORRECT VARIABLE NAME
      # ============================================================
      - name: Rebuild dex_data.h (correct imgui_dex naming)
        run: |
          set -e
          ANDROID_JAR=$(find "$ANDROID_HOME/platforms" -name "android.jar" | sort -V | tail -1)
          echo "android.jar: $ANDROID_JAR"
          D8=$(find "$ANDROID_HOME/build-tools" -name "d8" | sort -V | tail -1)
          echo "d8: $D8"

          rm -rf /tmp/dex_build /tmp/dex_out
          mkdir -p /tmp/dex_build /tmp/dex_out

          echo "=== javac ==="
          javac -source 8 -target 8 -Xlint:-options -cp "$ANDROID_JAR" -d /tmp/dex_build \
            $(find app/src/main/java/com/menu/imgui -name "*.java") 2>&1 | tee /tmp/javac.log
          [ ${PIPESTATUS[0]} -ne 0 ] && { echo "JAVAC FAILED"; cat /tmp/javac.log; exit 1; }
          echo "javac OK"
          find /tmp/dex_build -name "*.class" | sort

          echo "=== d8 ==="
          "$D8" --min-api 26 --lib "$ANDROID_JAR" --output /tmp/dex_out \
            $(find /tmp/dex_build -name "*.class") 2>&1 | tee /tmp/d8.log
          [ ${PIPESTATUS[0]} -ne 0 ] && { echo "D8 FAILED"; cat /tmp/d8.log; exit 1; }
          echo "d8 OK"
          ls -lah /tmp/dex_out/classes.dex

          echo "=== xxd (with -n imgui_dex) ==="
          xxd -i -n imgui_dex /tmp/dex_out/classes.dex > app/src/main/cpp/tool/dex_data.h
          echo "dex_data.h head:"
          head -5 app/src/main/cpp/tool/dex_data.h
          echo "dex_data.h tail (check variable name):"
          tail -3 app/src/main/cpp/tool/dex_data.h
          wc -l app/src/main/cpp/tool/dex_data.h

      # ============================================================
      # VERIFY
      # ============================================================
      - name: Verify
        run: |
          FAIL=0
          chk() { if grep -q "$2" "$1"; then echo "OK  $2"; else echo "ERR $2"; FAIL=1; fi; }
          chk app/src/main/java/com/menu/imgui/Helper.java "nativePatchMethod"
          chk app/src/main/java/com/menu/imgui/OverlaySurfaceView.java "setPreserveEGLContextOnPause"
          chk app/src/main/java/com/menu/imgui/OverlaySurfaceView.java "onTouchEvent"
          chk app/src/main/java/com/menu/imgui/OverlaySurfaceView.java "dispatchKeyEvent"
          chk app/src/main/cpp/tool/native-lib.cpp "Java_com_menu_imgui_Helper_nativePatchMethod"
          chk app/src/main/cpp/tool/native-lib.cpp "Java_com_menu_imgui_Helper_nativeTouch"
          chk app/src/main/cpp/tool/native-lib.cpp 'BeginTabItem("Log")'
          chk app/src/main/cpp/tool/dex_data.h "imgui_dex_len"
          if grep -q "notifyMenuOpen" app/src/main/cpp/tool/native-lib.cpp; then
            echo "ERR notifyMenuOpen still present"; FAIL=1
          else
            echo "OK  notifyMenuOpen removed"
          fi
          if [ $FAIL -ne 0 ]; then
            echo "===== diagnostics ====="
            grep -n "notifyMenuOpen\|g_jvm" app/src/main/cpp/tool/native-lib.cpp | head -10
            tail -3 app/src/main/cpp/tool/dex_data.h
            exit 1
          fi
          echo "ALL OK"

      - name: Write CMakeLists.txt
        run: |
          cat > app/src/main/cpp/CMakeLists.txt <<'CMEOF'
          cmake_minimum_required(VERSION 3.22.1)
          project("tool")
          set(CMAKE_CXX_STANDARD 17)
          set(CMAKE_BUILD_TYPE Release)
          set(CMAKE_CXX_FLAGS_RELEASE "-Oz -DNDEBUG -ffunction-sections -fdata-sections -fvisibility=hidden")
          if(${ANDROID_ABI} STREQUAL "arm64-v8a")
              set(FRIDA_DIR /tmp/frida-built/arm64-v8a)
          else()
              set(FRIDA_DIR /tmp/frida-built/armeabi-v7a)
          endif()
          include_directories(${FRIDA_DIR}/include ${FRIDA_DIR}/include/glib-2.0)
          add_library(frida-gumjs STATIC IMPORTED)
          set_target_properties(frida-gumjs PROPERTIES IMPORTED_LOCATION ${FRIDA_DIR}/lib/libfrida-gumjs.a)
          include_directories(imgui imgui/backends tool)
          add_library(tool SHARED
              tool/native-lib.cpp
              imgui/imgui.cpp imgui/imgui_draw.cpp imgui/imgui_tables.cpp imgui/imgui_widgets.cpp
              imgui/backends/imgui_impl_android.cpp imgui/backends/imgui_impl_opengl3.cpp)
          target_link_options(tool PRIVATE -Wl,--gc-sections -Wl,--exclude-libs,ALL -Wl,--strip-all)
          target_link_libraries(tool frida-gumjs android log EGL GLESv3 dl)
          CMEOF

      - name: Write build.gradle.kts
        run: |
          cat > app/build.gradle.kts <<'GEOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.tool"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.tool"
                  minSdk = 27
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
                  externalNativeBuild { cmake { cppFlags += "-std=c++17"; arguments += "-DCMAKE_BUILD_TYPE=Release" } }
                  ndk { abiFilters += listOf("arm64-v8a", "armeabi-v7a") }
              }
              externalNativeBuild { cmake { path = file("src/main/cpp/CMakeLists.txt"); version = "3.22.1" } }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
              packaging { jniLibs { useLegacyPackaging = true } }
          }
          dependencies { implementation("androidx.core:core-ktx:1.12.0") }
          GEOF

      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: 8.5 }

      - name: Build APK
        run: |
          if [ ! -s gradlew ]; then gradle wrapper --gradle-version 8.5; fi
          chmod +x gradlew
          rm -rf app/.cxx app/build .gradle
          ./gradlew :app:assembleDebug --no-build-cache

      - name: Zipalign
        run: |
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          cp "$APK" /tmp/un.apk
          zipalign -p -f 4 /tmp/un.apk "$APK"
          unzip -l "$APK" | grep "\.so"

      - name: Upload
        uses: actions/upload-artifact@v4
        with: { name: app-slim, path: app/build/outputs/apk/debug/*.apk }

      - name: Commit
        if: always()
        run: |
          git config user.name "gh"; git config user.email "gh@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "fix: xxd -n imgui_dex + remove broken notifyMenuOpen + rebuild dex [skip ci]"
          git push
