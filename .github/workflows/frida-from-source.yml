name: Frida from Source (Dual-Arch Slim)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cleanup old workflows
        run: |
          cd .github/workflows
          for f in *.yml *.yaml; do
            if [ -f "$f" ] && [ "$f" != "frida-from-source.yml" ]; then
              rm -f "$f"
            fi
          done
          ls -la

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pip ninja-build pkg-config libglib2.0-dev rsync
          pip3 install --quiet --upgrade pip
          pip3 install --quiet meson
          meson --version
          ninja --version

      - name: Detect NDK
        id: ndk
        run: |
          NDK_DIR=$(ls -d $ANDROID_HOME/ndk/* 2>/dev/null | head -1)
          [ -z "$NDK_DIR" ] && echo "FATAL: NDK not found" && exit 1
          echo "NDK_PATH=$NDK_DIR" >> $GITHUB_ENV
          echo "Using NDK: $NDK_DIR"

      - name: Clone Frida
        run: |
          FRIDA_VERSION="17.1.0"
          git clone --recursive --depth 1 --branch ${FRIDA_VERSION} \
            https://github.com/frida/frida.git /tmp/frida
          echo "✓ Frida ${FRIDA_VERSION} cloned"

      - name: Configure slim Frida
        run: |
          cd /tmp/frida
          cat > config.mk << 'EOF'
          FRIDA_V8 = disabled
          FRIDA_DATABASE = disabled
          FRIDA_CONNECTIVITY = disabled
          FRIDA_OBJC_BRIDGE = disabled
          FRIDA_SWIFT_BRIDGE = disabled
          FRIDA_DEBUG = no
          EOF
          cat config.mk

      - name: Build Frida arm64 (ignore python failures)
        timeout-minutes: 60
        run: |
          cd /tmp/frida
          export ANDROID_NDK_ROOT="$NDK_PATH"
          export FRIDA_HOST=android-arm64
          echo "=== Building android-arm64 (python subproject may fail, ignored) ==="
          make -j$(nproc) 2>&1 | tail -40 || echo "make exited non-zero (python failure is OK)"
          echo "=== Available artifacts after build ==="
          find build -name "libfrida-gumjs*.a" -exec ls -lah {} \; 2>/dev/null || true
          find build -name "frida-gumjs.h" -exec ls -lah {} \; 2>/dev/null || true
          find subprojects -name "frida-gumjs.h" -exec ls -lah {} \; 2>/dev/null || true

      - name: Stage arm64 artifacts
        run: |
          set -e
          DEST=/tmp/frida-built/arm64-v8a
          rm -rf "$DEST"; mkdir -p "$DEST/lib" "$DEST/include"

          # 1) Find the library — accept both names (with/without -1.0)
          LIB=$(find /tmp/frida/build -name "libfrida-gumjs*.a" ! -name "*inspector*" ! -name "*2*" 2>/dev/null | head -1)
          if [ -z "$LIB" ]; then
            LIB=$(find /tmp/frida/build -path "*bindings/gumjs*" -name "*.a" ! -name "*inspector*" 2>/dev/null | head -1)
          fi
          if [ -z "$LIB" ]; then
            echo "FATAL: no gumjs lib found"
            find /tmp/frida/build -name "*.a" | head -20
            exit 1
          fi
          echo "Library found: $LIB ($(stat -c%s "$LIB" | numfmt --to=iec))"
          cp -v "$LIB" "$DEST/lib/libfrida-gumjs.a"

          # 2) Copy source headers from frida-gum
          if [ -d "/tmp/frida/subprojects/frida-gum" ]; then
            rsync -a --include="*/" --include="*.h" --exclude="*" \
              /tmp/frida/subprojects/frida-gum/ "$DEST/include/" 2>/dev/null || true
          fi

          # 3) Copy generated headers from build tree (overwrite if duplicates)
          if [ -d "/tmp/frida/build/subprojects/frida-gum" ]; then
            rsync -a --include="*/" --include="*.h" --exclude="*" \
              /tmp/frida/build/subprojects/frida-gum/ "$DEST/include/" 2>/dev/null || true
          fi

          # 4) Ensure frida-gumjs.h and frida-gum.h are at include root
          GUMJS_H=$(find /tmp/frida -name "frida-gumjs.h" 2>/dev/null | head -1)
          GUM_H=$(find /tmp/frida -name "frida-gum.h" 2>/dev/null | head -1)
          [ -n "$GUMJS_H" ] && cp -v "$GUMJS_H" "$DEST/include/frida-gumjs.h" || echo "WARN: no frida-gumjs.h"
          [ -n "$GUM_H" ] && cp -v "$GUM_H" "$DEST/include/frida-gum.h" || echo "WARN: no frida-gum.h"

          echo "=== Staged arm64 ==="
          ls -lah "$DEST/lib/"
          echo "--- include root ---"
          ls "$DEST/include/" | head -20

      - name: Build Frida armv7 (fresh build)
        timeout-minutes: 60
        run: |
          cd /tmp/frida
          # Wipe build dir to force fresh configure for arm
          rm -rf build
          export ANDROID_NDK_ROOT="$NDK_PATH"
          export FRIDA_HOST=android-arm
          echo "=== Building android-arm ==="
          make -j$(nproc) 2>&1 | tail -40 || echo "make exited non-zero (python failure is OK)"
          echo "=== Artifacts ==="
          find build -name "libfrida-gumjs*.a" -exec ls -lah {} \; 2>/dev/null || true

      - name: Stage armv7 artifacts
        run: |
          set -e
          DEST=/tmp/frida-built/armeabi-v7a
          rm -rf "$DEST"; mkdir -p "$DEST/lib" "$DEST/include"

          LIB=$(find /tmp/frida/build -name "libfrida-gumjs*.a" ! -name "*inspector*" ! -name "*2*" 2>/dev/null | head -1)
          if [ -z "$LIB" ]; then
            LIB=$(find /tmp/frida/build -path "*bindings/gumjs*" -name "*.a" ! -name "*inspector*" 2>/dev/null | head -1)
          fi
          [ -z "$LIB" ] && echo "FATAL: no gumjs lib (arm)" && exit 1
          echo "Library: $LIB ($(stat -c%s "$LIB" | numfmt --to=iec))"
          cp -v "$LIB" "$DEST/lib/libfrida-gumjs.a"

          # Headers same as arm64
          if [ -d "/tmp/frida/subprojects/frida-gum" ]; then
            rsync -a --include="*/" --include="*.h" --exclude="*" \
              /tmp/frida/subprojects/frida-gum/ "$DEST/include/" 2>/dev/null || true
          fi
          if [ -d "/tmp/frida/build/subprojects/frida-gum" ]; then
            rsync -a --include="*/" --include="*.h" --exclude="*" \
              /tmp/frida/build/subprojects/frida-gum/ "$DEST/include/" 2>/dev/null || true
          fi
          GUMJS_H=$(find /tmp/frida -name "frida-gumjs.h" 2>/dev/null | head -1)
          GUM_H=$(find /tmp/frida -name "frida-gum.h" 2>/dev/null | head -1)
          [ -n "$GUMJS_H" ] && cp -v "$GUMJS_H" "$DEST/include/frida-gumjs.h" || echo "WARN: no gumjs.h"
          [ -n "$GUM_H" ] && cp -v "$GUM_H" "$DEST/include/frida-gum.h" || echo "WARN: no gum.h"

          echo "=== Staged armv7 ==="
          ls -lah "$DEST/lib/"

      - name: Report both architectures
        run: |
          echo "=== Frida libraries ==="
          echo "arm64:     $(ls -lah /tmp/frida-built/arm64-v8a/lib/libfrida-gumjs.a | awk '{print $5}')"
          echo "armeabi:   $(ls -lah /tmp/frida-built/armeabi-v7a/lib/libfrida-gumjs.a | awk '{print $5}')"

      - name: Verify source files exist
        run: |
          set -e
          for f in app/src/main/cpp/tool/native-lib.cpp \
                   app/src/main/cpp/tool/dex_data.h \
                   app/src/main/java/com/menu/imgui/Helper.java \
                   app/src/main/java/com/menu/imgui/OverlaySurfaceView.java; do
            test -s "$f" && echo "✓ $f" || (echo "✗ $f MISSING" && exit 1)
          done
          grep -q "gum_init_embedded" app/src/main/cpp/tool/native-lib.cpp && echo "✓ gum_init_embedded present"
          grep -q "gum_script_backend_create_sync" app/src/main/cpp/tool/native-lib.cpp && echo "✓ create_sync present"

      - name: Write CMakeLists.txt
        run: |
          cat > app/src/main/cpp/CMakeLists.txt << 'EOF'
          cmake_minimum_required(VERSION 3.22.1)
          project("tool")
          set(CMAKE_CXX_STANDARD 17)

          if(NOT CMAKE_BUILD_TYPE)
              set(CMAKE_BUILD_TYPE Release CACHE STRING "" FORCE)
          endif()
          set(CMAKE_C_FLAGS_RELEASE "-Oz -DNDEBUG -ffunction-sections -fdata-sections -fvisibility=hidden")
          set(CMAKE_CXX_FLAGS_RELEASE "-Oz -DNDEBUG -ffunction-sections -fdata-sections -fvisibility=hidden")

          if(${ANDROID_ABI} STREQUAL "arm64-v8a")
              set(FRIDA_DIR /tmp/frida-built/arm64-v8a)
          elseif(${ANDROID_ABI} STREQUAL "armeabi-v7a")
              set(FRIDA_DIR /tmp/frida-built/armeabi-v7a)
          else()
              message(FATAL_ERROR "Unsupported ABI: ${ANDROID_ABI}")
          endif()

          if(NOT EXISTS "${FRIDA_DIR}/lib/libfrida-gumjs.a")
              message(FATAL_ERROR "Frida lib not found: ${FRIDA_DIR}/lib/libfrida-gumjs.a")
          endif()

          # Include the root + gum subdir for good measure
          include_directories(${FRIDA_DIR}/include)
          include_directories(${FRIDA_DIR}/include/gum)

          add_library(frida-gumjs STATIC IMPORTED)
          set_target_properties(frida-gumjs PROPERTIES
              IMPORTED_LOCATION ${FRIDA_DIR}/lib/libfrida-gumjs.a)

          include_directories(imgui imgui/backends tool)

          add_library(tool SHARED
              tool/native-lib.cpp
              imgui/imgui.cpp
              imgui/imgui_draw.cpp
              imgui/imgui_tables.cpp
              imgui/imgui_widgets.cpp
              imgui/backends/imgui_impl_android.cpp
              imgui/backends/imgui_impl_opengl3.cpp)

          target_link_options(tool PRIVATE
              -Wl,--gc-sections
              -Wl,--exclude-libs,ALL
              -Wl,--strip-all)

          target_link_libraries(tool frida-gumjs android log EGL GLESv3 dl)
          EOF

      - name: Write app/build.gradle.kts
        run: |
          cat > app/build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.tool"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.tool"
                  minSdk = 27
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
                  externalNativeBuild {
                      cmake {
                          cppFlags += "-std=c++17"
                          arguments += listOf("-DCMAKE_BUILD_TYPE=Release")
                      }
                  }
                  ndk { abiFilters += listOf("arm64-v8a", "armeabi-v7a") }
              }
              externalNativeBuild {
                  cmake {
                      path = file("src/main/cpp/CMakeLists.txt")
                      version = "3.22.1"
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              buildTypes {
                  getByName("debug") {
                      externalNativeBuild {
                          cmake { arguments += listOf("-DCMAKE_BUILD_TYPE=Release") }
                      }
                  }
              }
              packaging { jniLibs { useLegacyPackaging = true } }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
          }
          EOF

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Build APK
        run: |
          if [ ! -s gradlew ]; then gradle wrapper --gradle-version 8.5; fi
          chmod +x gradlew
          rm -rf app/.cxx app/build .gradle
          ./gradlew :app:assembleDebug --no-build-cache --stacktrace

      - name: Strip .so files + size report
        run: |
          set -e
          NDK_STRIP=$(find $NDK_PATH -name "llvm-strip" | head -1)
          for SO in $(find app/build -name "libtool.so"); do
            ABI=$(echo "$SO" | grep -oE "(arm64-v8a|armeabi-v7a)")
            echo "=== $ABI ==="
            echo "Before strip: $(ls -lah "$SO" | awk '{print $5}')"
            $NDK_STRIP --strip-all "$SO"
            SIZE=$(stat -c%s "$SO")
            MB=$(awk "BEGIN {printf \"%.2f\", $SIZE/1048576}")
            echo "After strip:  ${MB} MB"
          done

      - name: Show APK structure
        run: |
          APK=$(find app/build -name "*.apk" | head -1)
          echo "=== APK total: $(ls -lah "$APK" | awk '{print $5}') ==="
          unzip -l "$APK" | grep "\.so"

      - name: Extract artifacts
        run: |
          mkdir -p /tmp/so-out
          for SO in $(find app/build -name "libtool.so"); do
            ABI=$(echo "$SO" | grep -oE "(arm64-v8a|armeabi-v7a)")
            cp "$SO" "/tmp/so-out/libtool-${ABI}.so"
          done
          ls -lah /tmp/so-out/

      - uses: actions/upload-artifact@v4
        with:
          name: libtool-frida-source
          path: /tmp/so-out/*.so

      - uses: actions/upload-artifact@v4
        with:
          name: app-frida-source
          path: app/build/outputs/apk/debug/*.apk

      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "feat: frida from source, dual-arch, python-errors-ignored [skip ci]"
          git push
