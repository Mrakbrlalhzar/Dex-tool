name: Frida from Source (Dual-Arch Slim)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cleanup old Frida artifacts from repo
        run: |
          # Remove any Frida files previously committed to repo
          git rm -rf --cached app/src/main/cpp/frida/ 2>/dev/null || true
          rm -rf app/src/main/cpp/frida/
          grep -q "app/src/main/cpp/frida" .gitignore 2>/dev/null || echo "app/src/main/cpp/frida/" >> .gitignore
          grep -q ".cxx/" .gitignore 2>/dev/null || echo ".cxx/" >> .gitignore
          grep -q "app/build/" .gitignore 2>/dev/null || echo "app/build/" >> .gitignore
          echo "✓ Repo cleaned"

      - name: Cleanup old workflows
        run: |
          cd .github/workflows
          for f in *.yml *.yaml; do
            if [ -f "$f" ] && [ "$f" != "frida-from-source.yml" ]; then
              rm -f "$f"
            fi
          done
          ls -la

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pip ninja-build pkg-config libglib2.0-dev rsync
          pip3 install --quiet --upgrade pip
          pip3 install --quiet meson
          meson --version
          ninja --version

      - name: Detect NDK
        run: |
          NDK_DIR=$(ls -d $ANDROID_HOME/ndk/* 2>/dev/null | head -1)
          [ -z "$NDK_DIR" ] && echo "FATAL: NDK not found" && exit 1
          echo "NDK_PATH=$NDK_DIR" >> $GITHUB_ENV
          echo "Using NDK: $NDK_DIR"

      - name: Clone Frida
        run: |
          FRIDA_VERSION="17.1.0"
          git clone --recursive --depth 1 --branch ${FRIDA_VERSION} \
            https://github.com/frida/frida.git /tmp/frida
          echo "✓ Cloned Frida ${FRIDA_VERSION}"

      - name: Configure slim Frida
        run: |
          cd /tmp/frida
          cat > config.mk << 'EOF'
          FRIDA_V8 = disabled
          FRIDA_DATABASE = disabled
          FRIDA_CONNECTIVITY = disabled
          FRIDA_OBJC_BRIDGE = disabled
          FRIDA_SWIFT_BRIDGE = disabled
          FRIDA_DEBUG = no
          EOF
          cat config.mk

      - name: Build Frida arm64 (ignore python failure)
        timeout-minutes: 60
        run: |
          cd /tmp/frida
          export ANDROID_NDK_ROOT="$NDK_PATH"
          export FRIDA_HOST=android-arm64
          echo "=== Building android-arm64 (python failure OK) ==="
          make -j$(nproc) 2>&1 | tail -50 || echo "make exited with non-zero (python failure expected)"
          echo "=== Available .a files ==="
          find build -name "libfrida-gumjs*.a" ! -name "*inspector*" -exec ls -lah {} \; 2>/dev/null || true
          echo "=== Available headers ==="
          find build -name "frida-gumjs.h" -exec ls -lah {} \; 2>/dev/null || true
          echo "=== Android deps ==="
          ls -d /tmp/frida/deps/sdk-android-* 2>/dev/null || echo "(no android deps)"

      - name: Stage arm64 artifacts (with glib headers)
        run: |
          set -e
          DEST=/tmp/frida-built/arm64-v8a
          rm -rf "$DEST"; mkdir -p "$DEST/lib" "$DEST/include" "$DEST/include/glib-config"

          # 1) Frida gumjs library
          LIB=$(find /tmp/frida/build -name "libfrida-gumjs*.a" ! -name "*inspector*" ! -name "*2*" 2>/dev/null | head -1)
          [ -z "$LIB" ] && echo "FATAL: lib not found" && exit 1
          echo "Library: $LIB ($(stat -c%s "$LIB" | numfmt --to=iec))"
          cp -v "$LIB" "$DEST/lib/libfrida-gumjs.a"

          # 2) Frida gum headers
          if [ -d "/tmp/frida/subprojects/frida-gum" ]; then
            rsync -a --include="*/" --include="*.h" --exclude="*" \
              /tmp/frida/subprojects/frida-gum/ "$DEST/include/" 2>/dev/null || true
          fi
          if [ -d "/tmp/frida/build/subprojects/frida-gum" ]; then
            rsync -a --include="*/" --include="*.h" --exclude="*" \
              /tmp/frida/build/subprojects/frida-gum/ "$DEST/include/" 2>/dev/null || true
          fi

          # 3) Main frida-gumjs.h and frida-gum.h to root
          GUMJS_H=$(find /tmp/frida -name "frida-gumjs.h" 2>/dev/null | head -1)
          GUM_H=$(find /tmp/frida -name "frida-gum.h" 2>/dev/null | head -1)
          [ -n "$GUMJS_H" ] && cp -v "$GUMJS_H" "$DEST/include/frida-gumjs.h"
          [ -n "$GUM_H" ] && cp -v "$GUM_H" "$DEST/include/frida-gum.h"

          # 4) *** CRITICAL: Copy glib and other Android deps headers ***
          ANDROID_DEPS="/tmp/frida/deps/sdk-android-arm64"
          if [ -d "$ANDROID_DEPS/include" ]; then
            echo "=== Copying deps from $ANDROID_DEPS/include ==="
            ls "$ANDROID_DEPS/include/" | head -10
            rsync -a "$ANDROID_DEPS/include/" "$DEST/include/"
            echo "✓ Copied Android deps (glib, json-glib, etc.)"
          else
            echo "WARN: $ANDROID_DEPS not found. Searching alternatives..."
            for d in /tmp/frida/deps/sdk-android-arm64 /tmp/frida/deps/sdk-android-arm; do
              [ -d "$d/include" ] && echo "Found: $d" && rsync -a "$d/include/" "$DEST/include/"
            done
          fi
          if [ -d "$ANDROID_DEPS/lib/glib-2.0/include" ]; then
            cp -v "$ANDROID_DEPS/lib/glib-2.0/include/"*.h "$DEST/include/glib-config/"
            echo "✓ Copied glibconfig.h"
          fi

          echo "=== Final include structure ==="
          find "$DEST/include" -maxdepth 2 -type d | head -20
          echo "--- Check glib.h ---"
          find "$DEST" -name "glib.h" | head -3
          echo "--- Check glibconfig.h ---"
          find "$DEST" -name "glibconfig.h" | head -3

      - name: Build Frida arm (fresh)
        timeout-minutes: 60
        run: |
          cd /tmp/frida
          rm -rf build
          export ANDROID_NDK_ROOT="$NDK_PATH"
          export FRIDA_HOST=android-arm
          echo "=== Building android-arm (python failure OK) ==="
          make -j$(nproc) 2>&1 | tail -50 || echo "make exited non-zero (expected)"
          echo "=== Available .a files ==="
          find build -name "libfrida-gumjs*.a" ! -name "*inspector*" -exec ls -lah {} \; 2>/dev/null || true

      - name: Stage arm artifacts (with glib headers)
        run: |
          set -e
          DEST=/tmp/frida-built/armeabi-v7a
          rm -rf "$DEST"; mkdir -p "$DEST/lib" "$DEST/include" "$DEST/include/glib-config"

          LIB=$(find /tmp/frida/build -name "libfrida-gumjs*.a" ! -name "*inspector*" ! -name "*2*" 2>/dev/null | head -1)
          [ -z "$LIB" ] && echo "FATAL: lib not found (arm)" && exit 1
          echo "Library: $LIB ($(stat -c%s "$LIB" | numfmt --to=iec))"
          cp -v "$LIB" "$DEST/lib/libfrida-gumjs.a"

          if [ -d "/tmp/frida/subprojects/frida-gum" ]; then
            rsync -a --include="*/" --include="*.h" --exclude="*" \
              /tmp/frida/subprojects/frida-gum/ "$DEST/include/" 2>/dev/null || true
          fi
          if [ -d "/tmp/frida/build/subprojects/frida-gum" ]; then
            rsync -a --include="*/" --include="*.h" --exclude="*" \
              /tmp/frida/build/subprojects/frida-gum/ "$DEST/include/" 2>/dev/null || true
          fi

          GUMJS_H=$(find /tmp/frida -name "frida-gumjs.h" 2>/dev/null | head -1)
          GUM_H=$(find /tmp/frida -name "frida-gum.h" 2>/dev/null | head -1)
          [ -n "$GUMJS_H" ] && cp -v "$GUMJS_H" "$DEST/include/frida-gumjs.h"
          [ -n "$GUM_H" ] && cp -v "$GUM_H" "$DEST/include/frida-gum.h"

          ANDROID_DEPS="/tmp/frida/deps/sdk-android-arm"
          if [ -d "$ANDROID_DEPS/include" ]; then
            rsync -a "$ANDROID_DEPS/include/" "$DEST/include/"
            echo "✓ Copied Android arm deps"
          else
            echo "WARN: $ANDROID_DEPS not found"
          fi
          if [ -d "$ANDROID_DEPS/lib/glib-2.0/include" ]; then
            cp -v "$ANDROID_DEPS/lib/glib-2.0/include/"*.h "$DEST/include/glib-config/"
            echo "✓ Copied glibconfig.h"
          fi

          echo "=== Final arm include check ==="
          find "$DEST" -name "glib.h" | head -1
          find "$DEST" -name "glibconfig.h" | head -1

      - name: Report sizes
        run: |
          echo "=== Frida libs ==="
          ls -lah /tmp/frida-built/arm64-v8a/lib/libfrida-gumjs.a
          ls -lah /tmp/frida-built/armeabi-v7a/lib/libfrida-gumjs.a

      - name: Verify source files
        run: |
          set -e
          for f in app/src/main/cpp/tool/native-lib.cpp \
                   app/src/main/cpp/tool/dex_data.h \
                   app/src/main/java/com/menu/imgui/Helper.java \
                   app/src/main/java/com/menu/imgui/OverlaySurfaceView.java; do
            test -s "$f" && echo "✓ $f" || (echo "✗ $f MISSING" && exit 1)
          done
          grep -q "gum_init_embedded" app/src/main/cpp/tool/native-lib.cpp && echo "✓ gum_init"

      - name: Write CMakeLists.txt (with glib include paths)
        run: |
          cat > app/src/main/cpp/CMakeLists.txt << 'EOF'
          cmake_minimum_required(VERSION 3.22.1)
          project("tool")
          set(CMAKE_CXX_STANDARD 17)

          if(NOT CMAKE_BUILD_TYPE)
              set(CMAKE_BUILD_TYPE Release CACHE STRING "" FORCE)
          endif()
          set(CMAKE_C_FLAGS_RELEASE "-Oz -DNDEBUG -ffunction-sections -fdata-sections -fvisibility=hidden")
          set(CMAKE_CXX_FLAGS_RELEASE "-Oz -DNDEBUG -ffunction-sections -fdata-sections -fvisibility=hidden")

          if(${ANDROID_ABI} STREQUAL "arm64-v8a")
              set(FRIDA_DIR /tmp/frida-built/arm64-v8a)
          elseif(${ANDROID_ABI} STREQUAL "armeabi-v7a")
              set(FRIDA_DIR /tmp/frida-built/armeabi-v7a)
          else()
              message(FATAL_ERROR "Unsupported ABI: ${ANDROID_ABI}")
          endif()

          if(NOT EXISTS "${FRIDA_DIR}/lib/libfrida-gumjs.a")
              message(FATAL_ERROR "Frida lib not found: ${FRIDA_DIR}/lib/libfrida-gumjs.a")
          endif()

          # Include paths for frida + glib + glibconfig
          include_directories(
              ${FRIDA_DIR}/include
              ${FRIDA_DIR}/include/glib-2.0
              ${FRIDA_DIR}/include/glib-config
              ${FRIDA_DIR}/include/gum
          )

          add_library(frida-gumjs STATIC IMPORTED)
          set_target_properties(frida-gumjs PROPERTIES
              IMPORTED_LOCATION ${FRIDA_DIR}/lib/libfrida-gumjs.a)

          include_directories(imgui imgui/backends tool)

          add_library(tool SHARED
              tool/native-lib.cpp
              imgui/imgui.cpp
              imgui/imgui_draw.cpp
              imgui/imgui_tables.cpp
              imgui/imgui_widgets.cpp
              imgui/backends/imgui_impl_android.cpp
              imgui/backends/imgui_impl_opengl3.cpp)

          target_link_options(tool PRIVATE
              -Wl,--gc-sections
              -Wl,--exclude-libs,ALL
              -Wl,--strip-all)

          target_link_libraries(tool frida-gumjs android log EGL GLESv3 dl)
          EOF

      - name: Write build.gradle.kts
        run: |
          cat > app/build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.tool"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.tool"
                  minSdk = 27
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
                  externalNativeBuild {
                      cmake {
                          cppFlags += "-std=c++17"
                          arguments += listOf("-DCMAKE_BUILD_TYPE=Release")
                      }
                  }
                  ndk { abiFilters += listOf("arm64-v8a", "armeabi-v7a") }
              }
              externalNativeBuild {
                  cmake {
                      path = file("src/main/cpp/CMakeLists.txt")
                      version = "3.22.1"
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              buildTypes {
                  getByName("debug") {
                      externalNativeBuild {
                          cmake { arguments += listOf("-DCMAKE_BUILD_TYPE=Release") }
                      }
                  }
              }
              packaging { jniLibs { useLegacyPackaging = true } }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
          }
          EOF

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Build APK
        run: |
          if [ ! -s gradlew ]; then gradle wrapper --gradle-version 8.5; fi
          chmod +x gradlew
          rm -rf app/.cxx app/build .gradle
          ./gradlew :app:assembleDebug --no-build-cache --stacktrace

      - name: Strip & size report
        run: |
          NDK_STRIP=$(find $NDK_PATH -name "llvm-strip" | head -1)
          for SO in $(find app/build -name "libtool.so"); do
            ABI=$(echo "$SO" | grep -oE "(arm64-v8a|armeabi-v7a)")
            echo "=== $ABI ==="
            ls -lah "$SO"
            $NDK_STRIP --strip-all "$SO"
            SIZE=$(stat -c%s "$SO")
            MB=$(awk "BEGIN {printf \"%.2f\", $SIZE/1048576}")
            echo "After strip: ${MB} MB"
          done

      - name: Show APK
        run: |
          APK=$(find app/build -name "*.apk" | head -1)
          ls -lah "$APK"
          unzip -l "$APK" | grep "\.so"

      - name: Extract artifacts
        run: |
          mkdir -p /tmp/so-out
          for SO in $(find app/build -name "libtool.so"); do
            ABI=$(echo "$SO" | grep -oE "(arm64-v8a|armeabi-v7a)")
            cp "$SO" "/tmp/so-out/libtool-${ABI}.so"
          done
          ls -lah /tmp/so-out/

      - uses: actions/upload-artifact@v4
        with:
          name: libtool-frida
          path: /tmp/so-out/*.so

      - uses: actions/upload-artifact@v4
        with:
          name: app-frida
          path: app/build/outputs/apk/debug/*.apk

      - name: Final commit (only config files)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Make sure no frida source leaks in
          rm -rf app/src/main/cpp/frida/
          git rm -rf --cached app/src/main/cpp/frida/ 2>/dev/null || true
          git add -A
          git diff --staged --quiet || git commit -m "feat: frida-from-source with glib headers, dual-arch [skip ci]"
          git push
