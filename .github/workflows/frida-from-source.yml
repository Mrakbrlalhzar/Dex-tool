name: Frida GumJS Slim (Source)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cleanup old workflows
        run: |
          cd .github/workflows
          for f in *.yml *.yaml; do
            if [ -f "$f" ] && [ "$f" != "frida-from-source.yml" ]; then
              rm -f "$f"
            fi
          done

      - name: Install dependencies (NDK r25c + Meson + Node.js)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            python3-pip ninja-build pkg-config libglib2.0-dev unzip curl gettext
          pip3 install --quiet --upgrade pip
          pip3 install --quiet meson

          wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux.zip -O /tmp/ndk-r25c.zip
          unzip -q /tmp/ndk-r25c.zip -d /tmp/
          echo "NDK_PATH=/tmp/android-ndk-r25c" >> $GITHUB_ENV

          curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
          sudo apt-get install -y nodejs

      - name: Download Frida devkit (HEADERS ONLY)
        run: |
          FRIDA_VERSION="17.1.0"
          BASE="https://github.com/frida/frida/releases/download/${FRIDA_VERSION}"
          wget -q "${BASE}/frida-gumjs-devkit-${FRIDA_VERSION}-android-arm64.tar.xz" -O /tmp/dk64.tar.xz
          mkdir -p /tmp/dk64 && tar -xf /tmp/dk64.tar.xz -C /tmp/dk64
          wget -q "${BASE}/frida-gumjs-devkit-${FRIDA_VERSION}-android-arm.tar.xz" -O /tmp/dk32.tar.xz
          mkdir -p /tmp/dk32 && tar -xf /tmp/dk32.tar.xz -C /tmp/dk32

      - name: Clone frida-gum source
        run: |
          git clone --recursive --depth 1 --branch 17.1.0 \
            https://github.com/frida/frida-gum.git /tmp/frida-gum

      - name: Patch glib_init
        run: |
          cd /tmp/frida-gum
          sed -i '1i void glib_init(void);' bindings/gumjs/gumquickcompile.c

      - name: Create libintl.h stub (safe isolation)
        run: |
          mkdir -p /tmp/intl-stub
          cat > /tmp/intl-stub/libintl.h << 'EOF'
          #ifndef LIBINTL_H
          #define LIBINTL_H
          static inline char *gettext(const char *msgid) { return (char *)msgid; }
          static inline char *dgettext(const char *domain, const char *msgid) { return (char *)msgid; }
          static inline char *ngettext(const char *msgid, const char *msgid_plural, unsigned long n) {
              return (char *)(n == 1 ? msgid : msgid_plural);
          }
          static inline char *bindtextdomain(const char *domainname, const char *dirname) { return (char *)dirname; }
          static inline char *textdomain(const char *domainname) { return (char *)domainname; }
          #endif
          EOF

      # Helper to configure with all slim options
      - name: Configure helper (defines MESON_OPTS)
        run: |
          cat > /tmp/meson_opts.sh << 'EOF'
          #!/bin/bash
          # Core slim options
          OPTS=(
            --buildtype=minsize
            -Ddevkits=gum,gumjs
            -Dgumjs=enabled
            -Dinspector=disabled
            -Dquickjs=enabled
            -Dv8=disabled
            -Ddatabase=disabled
            -Dtests=disabled
            -Ddiet=true
            -Db_ndebug=true
            -Ddefault_library=static
            -Dlibunwind:minidebuginfo=disabled
            -Dlibdwarf:decompression=false
          )
          # Try to disable json-glib subproject entirely
          OPTS+=(-Djson-glib:enabled=false)
          # Fallback: pass the stub include only to json-glib if it still builds
          # OPTS+=(-Djson-glib:c_args=["-I/tmp/intl-stub"])
          echo "MESON_OPTS: ${OPTS[*]}"
          export MESON_OPTS
          EOF
          chmod +x /tmp/meson_opts.sh
          source /tmp/meson_opts.sh

      - name: Build arm64
        timeout-minutes: 60
        run: |
          set -o pipefail
          source /tmp/meson_opts.sh
          cd /tmp/frida-gum
          export ANDROID_NDK_ROOT="$NDK_PATH"
          rm -rf build
          ./configure --host=android-arm64 -- \
            "${OPTS[@]}" \
            2>&1 | tee /tmp/arm64-configure.log
          CFG_EXIT=${PIPESTATUS[0]}
          if [ $CFG_EXIT -ne 0 ]; then tail -80 /tmp/arm64-configure.log; exit 1; fi

          # Build the gumjs static library target directly
          make -j$(nproc) 2>&1 | tee /tmp/arm64-build.log
          BLD_EXIT=${PIPESTATUS[0]}
          # Tolerate failure on python/tools bindings if the .a already exists
          LIB=$(find build -name "libfrida-gumjs-*.a" ! -name "*inspector*" | head -1)
          if [ -z "$LIB" ]; then
            echo "::error::No libfrida-gumjs .a found after make"
            tail -100 /tmp/arm64-build.log
            exit 1
          fi
          echo "Found library: $LIB"
          find build -name "libfrida-gumjs*.a" -exec ls -lah {} \; || true

      - name: Stage arm64
        run: |
          DEST=/tmp/frida-built/arm64-v8a
          mkdir -p "$DEST/lib" "$DEST/include"
          LIB=$(find /tmp/frida-gum/build -name "libfrida-gumjs-*.a" ! -name "*inspector*" | head -1)
          if [ -z "$LIB" ]; then echo "No arm64 lib"; exit 1; fi
          cp -v "$LIB" "$DEST/lib/libfrida-gumjs.a"
          cp -v /tmp/dk64/frida-gumjs.h "$DEST/include/"
          cp -v /tmp/dk64/frida-gum.h "$DEST/include/" 2>/dev/null || true

      - name: Build armv7
        timeout-minutes: 60
        run: |
          set -o pipefail
          source /tmp/meson_opts.sh
          cd /tmp/frida-gum
          export ANDROID_NDK_ROOT="$NDK_PATH"
          rm -rf build
          ./configure --host=android-arm -- \
            "${OPTS[@]}" \
            2>&1 | tee /tmp/armv7-configure.log
          CFG_EXIT=${PIPESTATUS[0]}
          if [ $CFG_EXIT -ne 0 ]; then tail -80 /tmp/armv7-configure.log; exit 1; fi

          make -j$(nproc) 2>&1 | tee /tmp/armv7-build.log
          BLD_EXIT=${PIPESTATUS[0]}
          LIB=$(find build -name "libfrida-gumjs-*.a" ! -name "*inspector*" | head -1)
          if [ -z "$LIB" ]; then
            echo "::error::No libfrida-gumjs .a found after make (armv7)"
            tail -100 /tmp/armv7-build.log
            exit 1
          fi
          echo "Found armv7 library: $LIB"

      - name: Stage armv7
        run: |
          DEST=/tmp/frida-built/armeabi-v7a
          mkdir -p "$DEST/lib" "$DEST/include"
          LIB=$(find /tmp/frida-gum/build -name "libfrida-gumjs-*.a" ! -name "*inspector*" | head -1)
          if [ -z "$LIB" ]; then echo "No armv7 lib"; exit 1; fi
          cp -v "$LIB" "$DEST/lib/libfrida-gumjs.a"
          cp -v /tmp/dk32/frida-gumjs.h "$DEST/include/"

      - name: Compile agent.js
        run: |
          mkdir -p /tmp/agent && cd /tmp/agent
          npm init -y >/dev/null
          npm install frida-java-bridge >/dev/null
          cat > agent.js << 'EOF'
          import Java from "frida-java-bridge";
          Java.perform(function() {
            console.log("[*] Patch Agent Loaded");
            recv(function(msg) {
              try {
                var cmd = JSON.parse(msg);
                if (cmd.action === "patchMethod") {
                  var cls = Java.use(cmd.className);
                  var m = cls[cmd.methodName].overloads[0];
                  m.implementation = function() { return cmd.returnValue; };
                }
              } catch (e) { console.log("[!] " + e.message); }
            });
            send({type: "ready"});
          });
          EOF
          npx frida-compile agent.js -o agent-compiled.js -S -c
          mkdir -p "$GITHUB_WORKSPACE/app/src/main/assets"
          cp agent-compiled.js "$GITHUB_WORKSPACE/app/src/main/assets/agent.js"

      - name: Write CMakeLists.txt
        run: |
          cat > app/src/main/cpp/CMakeLists.txt << 'EOF'
          cmake_minimum_required(VERSION 3.22.1)
          project("tool")
          set(CMAKE_CXX_STANDARD 17)
          set(CMAKE_C_FLAGS_RELEASE "-Oz -DNDEBUG -ffunction-sections -fdata-sections -fvisibility=hidden")
          set(CMAKE_CXX_FLAGS_RELEASE "-Oz -DNDEBUG -ffunction-sections -fdata-sections -fvisibility=hidden")
          if(${ANDROID_ABI} STREQUAL "arm64-v8a")
              set(FRIDA_DIR /tmp/frida-built/arm64-v8a)
          elseif(${ANDROID_ABI} STREQUAL "armeabi-v7a")
              set(FRIDA_DIR /tmp/frida-built/armeabi-v7a)
          endif()
          include_directories(${FRIDA_DIR}/include)
          add_library(frida-gumjs STATIC IMPORTED)
          set_target_properties(frida-gumjs PROPERTIES IMPORTED_LOCATION ${FRIDA_DIR}/lib/libfrida-gumjs.a)
          include_directories(imgui imgui/backends tool)
          add_library(tool SHARED
              tool/native-lib.cpp
              imgui/imgui.cpp imgui/imgui_draw.cpp imgui/imgui_tables.cpp imgui/imgui_widgets.cpp
              imgui/backends/imgui_impl_android.cpp imgui/backends/imgui_impl_opengl3.cpp)
          target_link_options(tool PRIVATE -Wl,--gc-sections -Wl,--exclude-libs,ALL -Wl,--strip-all)
          target_link_libraries(tool frida-gumjs android log EGL GLESv3 dl)
          EOF

      - name: Write build.gradle.kts
        run: |
          cat > app/build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.tool"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.tool"
                  minSdk = 27
                  targetSdk = 34
                  externalNativeBuild { cmake {
                      cppFlags += "-std=c++17"
                      arguments += listOf("-DCMAKE_BUILD_TYPE=Release")
                  } }
                  ndk { abiFilters += listOf("arm64-v8a", "armeabi-v7a") }
              }
              externalNativeBuild { cmake {
                  path = file("src/main/cpp/CMakeLists.txt")
                  version = "3.22.1"
              } }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              packaging { jniLibs { useLegacyPackaging = true } }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
          }
          EOF

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Build APK
        run: |
          if [ ! -s gradlew ]; then gradle wrapper --gradle-version 8.5; fi
          chmod +x gradlew
          rm -rf app/.cxx app/build .gradle
          ./gradlew :app:assembleDebug --no-build-cache --stacktrace

      - name: Strip + report
        run: |
          NDK_STRIP=$(find $NDK_PATH -name "llvm-strip" | head -1)
          mkdir -p /tmp/so-out
          for SO in $(find app/build -name "libtool.so"); do
            ABI=$(echo "$SO" | grep -oE "(arm64-v8a|armeabi-v7a)")
            cp "$SO" "/tmp/so-out/libtool-${ABI}.so"
            $NDK_STRIP --strip-all "/tmp/so-out/libtool-${ABI}.so"
            echo "$ABI: $(awk "BEGIN {printf \"%.2f MB\", $(stat -c%s /tmp/so-out/libtool-${ABI}.so)/1048576}")"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: libtool-slim
          path: /tmp/so-out/*.so
