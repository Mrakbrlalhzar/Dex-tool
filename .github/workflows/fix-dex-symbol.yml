name: Fix DEX Symbol Name

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Regenerate dex_data.h with correct symbol
        run: |
          set -e
          mkdir -p /tmp/dex
          D8=$(find $ANDROID_HOME/build-tools -name d8 | sort -V | tail -1)
          echo "Using d8: $D8"
          javac -source 8 -target 8 \
                -cp $ANDROID_HOME/platforms/android-34/android.jar \
                -d /tmp/dex app/src/main/java/com/menu/imgui/Helper.java
          $D8 --min-api 26 --output /tmp/dex /tmp/dex/com/menu/imgui/Helper.class
          ls -la /tmp/dex/classes.dex

          # THE FIX: -n imgui_dex names the array "imgui_dex" (not "_tmp_dex_classes_dex")
          xxd -i -n imgui_dex /tmp/dex/classes.dex \
            | sed 's/unsigned char/const unsigned char/' \
            > app/src/main/cpp/tool/dex_data.h

          echo "=== dex_data.h (first 5 lines) ==="
          head -5 app/src/main/cpp/tool/dex_data.h
          echo "=== dex_data.h (last 3 lines) ==="
          tail -3 app/src/main/cpp/tool/dex_data.h

          grep -q "imgui_dex\[\]" app/src/main/cpp/tool/dex_data.h \
            && echo "✓ imgui_dex[] declared" \
            || (echo "✗ imgui_dex[] NOT FOUND" && exit 1)
          grep -q "imgui_dex_len" app/src/main/cpp/tool/dex_data.h \
            && echo "✓ imgui_dex_len declared" \
            || (echo "✗ imgui_dex_len NOT FOUND" && exit 1)

      - name: Update CMakeLists to include tool/ directory
        run: |
          cat > app/src/main/cpp/CMakeLists.txt << 'EOF'
          cmake_minimum_required(VERSION 3.22.1)
          project("tool")

          set(CMAKE_CXX_STANDARD 17)

          include_directories(
              imgui
              imgui/backends
              tool
          )

          add_library(tool SHARED
              tool/native-lib.cpp
              imgui/imgui.cpp
              imgui/imgui_draw.cpp
              imgui/imgui_tables.cpp
              imgui/imgui_widgets.cpp
              imgui/backends/imgui_impl_android.cpp
              imgui/backends/imgui_impl_opengl3.cpp
          )

          target_link_libraries(tool
              android
              log
              EGL
              GLESv3
          )
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Ensure Gradle Wrapper
        run: |
          if [ ! -s gradlew ]; then gradle wrapper --gradle-version 8.5; fi
          chmod +x gradlew

      - name: Build
        run: |
          rm -rf app/.cxx app/build .gradle
          ./gradlew :app:assembleDebug --no-build-cache --stacktrace

      - name: Extract libtool.so
        run: |
          mkdir -p /tmp/so-out
          find app/build -name "libtool.so" -exec cp {} /tmp/so-out/ \;
          ls -la /tmp/so-out/
          file /tmp/so-out/libtool.so
          echo "=== Symbols check ==="
          nm -D /tmp/so-out/libtool.so 2>/dev/null | grep -E "JNI_OnLoad" || true

      - name: Upload .so
        uses: actions/upload-artifact@v4
        with:
          name: libtool-self-contained
          path: /tmp/so-out/libtool.so

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: imgui-tool-test-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Commit fix
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "fix: correct xxd symbol name to imgui_dex [skip ci]"
          git push
