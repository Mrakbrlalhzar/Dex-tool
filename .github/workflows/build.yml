                  try {
                      var ByteBuffer = Java.use('java.nio.ByteBuffer');
                      var IMDC = Java.use('dalvik.system.InMemoryDexClassLoader');
                      var CL = Java.use('java.lang.ClassLoader');
                      var bb = ByteBuffer.wrap(dexBytes);
