                                      try { lbl = String(inst); }
                                      catch (eL) { lbl = '(toString failed)'; }
                                      if (lbl.length > 160)
                                          lbl = lbl.substring(0, 157) + '...';
                                      rows.push({ str: lbl, handle: h,
                                                  fields: field_rows(jc, inst) });
                                  } catch (e0) {}
                                  if (rows.length >= 20) return 'stop';
                              },
                              onComplete: function () {
