      - name: Commit and push generated sources to dev
        run: |
          git fetch origin dev || true
          git checkout -B dev origin/dev 2>/dev/null || git checkout -B dev
          git add --ignore-errors \
            CMakeLists.txt \
            src/ \
            agent/ \
            sample-app/ \
            README.md \
            .gitignore \
            .github/workflows/build.yml
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "fix: cross-thread ui-state race + cheap egl ctx rebuild + atomic g_script [skip ci]"
            git push origin HEAD:dev
            echo "Pushed to dev."
          fi
