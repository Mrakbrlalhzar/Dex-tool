          #include "menu.h"
          #include "frida_bridge.h"
          #include "logger.h"
          #include "imgui.h"
          #include <string>
          #include <vector>
          #include <cstdio>
          #include <cstring>
          
          // ── Minimal JSON extractors (flat object, string / array-of-string) ─
          static std::string j_str(const std::string& j, const std::string& key) {
              std::string n = "\"" + key + "\":\"";
              size_t p = j.find(n);
              if (p == std::string::npos) return "";
              p += n.size();
              std::string out;
              while (p < j.size() && j[p] != '"') {
                  if (j[p] == '\\' && p + 1 < j.size()) {
                      char c = j[p+1];
                      switch (c) {
                          case 'n': out += '\n'; break;
                          case 't': out += '\t'; break;
                          case 'r': out += '\r'; break;
                          case '"': out += '"';  break;
                          case '\\': out += '\\'; break;
                          case '/': out += '/';  break;
                          case 'u': {
                              if (p + 5 < j.size()) {
                                  unsigned cp = 0;
                                  for (int k = 0; k < 4; k++) {
                                      char h = j[p+2+k];
                                      cp <<= 4;
                                      if (h >= '0' && h <= '9') cp |= h - '0';
                                      else if (h >= 'a' && h <= 'f') cp |= h - 'a' + 10;
                                      else if (h >= 'A' && h <= 'F') cp |= h - 'A' + 10;
                                  }
                                  if (cp < 0x80) out += (char)cp;
                                  else if (cp < 0x800) {
                                      out += (char)(0xC0 | (cp >> 6));
                                      out += (char)(0x80 | (cp & 0x3F));
                                  } else {
                                      out += (char)(0xE0 | (cp >> 12));
                                      out += (char)(0x80 | ((cp >> 6) & 0x3F));
                                      out += (char)(0x80 | (cp & 0x3F));
                                  }
                                  p += 4;
                              }
                              break;
                          }
                          default: out += c; break;
                      }
                      p += 2;
                  } else out += j[p++];
              }
              return out;
          }
          
          static std::vector<std::string> j_arr(const std::string& j, const std::string& key) {
              std::vector<std::string> out;
              std::string n = "\"" + key + "\":[";
              size_t p = j.find(n);
              if (p == std::string::npos) return out;
              p += n.size();
              size_t e = j.find(']', p);
              if (e == std::string::npos) return out;
              std::string seg = j.substr(p, e - p);
              size_t i = 0;
              while (i < seg.size()) {
                  while (i < seg.size() && seg[i] != '"') i++;
                  if (i >= seg.size()) break;
                  i++;
                  std::string val;
                  while (i < seg.size() && seg[i] != '"') {
                      if (seg[i] == '\\' && i + 1 < seg.size()) {
                          char c = seg[i+1];
                          switch (c) {
                              case 'n': val += '\n'; break;
                              case 't': val += '\t'; break;
                              case 'r': val += '\r'; break;
                              case '"': val += '"';  break;
                              case '\\': val += '\\'; break;
                              case '/': val += '/';  break;
                              case 'u': {
                                  if (i + 5 < seg.size()) {
                                      unsigned cp = 0;
                                      for (int k = 0; k < 4; k++) {
                                          char h = seg[i+2+k];
                                          cp <<= 4;
                                          if (h >= '0' && h <= '9') cp |= h - '0';
                                          else if (h >= 'a' && h <= 'f') cp |= h - 'a' + 10;
                                          else if (h >= 'A' && h <= 'F') cp |= h - 'A' + 10;
                                      }
                                      if (cp < 0x80) val += (char)cp;
                                      else if (cp < 0x800) {
                                          val += (char)(0xC0 | (cp >> 6));
                                          val += (char)(0x80 | (cp & 0x3F));
                                      } else {
                                          val += (char)(0xE0 | (cp >> 12));
                                          val += (char)(0x80 | ((cp >> 6) & 0x3F));
                                          val += (char)(0x80 | (cp & 0x3F));
                                      }
                                      i += 4;
                                  }
                                  break;
                              }
                              default: val += c; break;
                          }
                          i += 2;
                      } else val += seg[i++];
                  }
                  i++;
                  out.push_back(val);
                  while (i < seg.size() && seg[i] != ',') i++;
                  if (i < seg.size()) i++;
              }
              return out;
          }
          
          // ── UI state (GL thread only after menu_init) ──────────────
          static float s_opacity = 0.92f;
          static float s_font_sz = 14.f;
          static int   s_theme   = 0;
          static bool  s_visible = true;
          
          struct PatchEntry  { std::string name, value; bool enabled = true; };
          struct HookEntry   { std::string name, code;  bool enabled = true; int mode = 0; };
          struct TrackerEntry{ std::string name; std::vector<std::string> log; };
          struct ClassWin    { std::string cname; std::vector<std::string> methods, fields; bool loaded = false; };
          
          static std::vector<PatchEntry>   s_patches;
          static std::vector<HookEntry>    s_hooks;
          static std::vector<TrackerEntry> s_trackers;
          static std::vector<ClassWin>     s_classes;
          
          static bool s_rec_on = false, s_mon_on = false;
          static std::vector<std::string> s_rec_log, s_mon_log, s_script_out;
          
          static char s_pname[256]  = {};
          static char s_pval[512]   = {};
          static char s_hname[256]  = {};
          static char s_hcode[2048] = {};
          static int  s_hmode       = 0;
          static char s_tname[256]  = {};
          static char s_script[8192]= "// Frida JS\n";
          static char s_cname[256]  = {};
          
          static void post_rpc(const char* fn, const char* args) {
              char buf[4096];
              snprintf(buf, sizeof(buf),
                       "{\"type\":\"rpc\",\"fn\":\"%s\",\"args\":%s}", fn, args);
              frida_post(std::string(buf));
          }
          
          static void apply_theme() {
              if (!ImGui::GetCurrentContext()) return;
              switch (s_theme) {
                  case 0: ImGui::StyleColorsDark();    break;
                  case 1: ImGui::StyleColorsLight();   break;
                  case 2: ImGui::StyleColorsClassic(); break;
              }
              ImGui::GetStyle().Alpha = s_opacity;
              ImGui::GetIO().FontGlobalScale = s_font_sz / 14.0f;
          }
          
          // GL thread only.
          static void handle_message(const std::string& j) {
              std::string type = j_str(j, "type");
              if (type.empty()) return;
              if (type == "classInfo") {
                  std::string cls = j_str(j, "class");
                  auto methods = j_arr(j, "methods");
                  auto fields  = j_arr(j, "fields");
                  for (auto& c : s_classes) {
                      if (c.cname == cls) {
                          c.methods = std::move(methods);
                          c.fields  = std::move(fields);
                          c.loaded  = true;
                          break;
                      }
                  }
              } else if (type == "instanceList") {
                  std::string cls = j_str(j, "class");
                  auto list = j_arr(j, "instances");
                  for (auto& c : s_classes) {
                      if (c.cname == cls) {
                          for (auto& s : list) c.methods.push_back("instance: " + s);
                          break;
                      }
                  }
              } else if (type == "trackerEvent") {
                  std::string name = j_str(j, "name");
                  auto args = j_arr(j, "args");
                  std::string line = "[" + name + "]";
                  for (auto& a : args) line += " " + a;
                  for (auto& t : s_trackers)
                      if (t.name == name) t.log.push_back(line);
              } else if (type == "recorded") {
                  s_rec_log.push_back(j_str(j, "cls") + "." + j_str(j, "method"));
              } else if (type == "scriptResult" || type == "scriptError") {
                  s_script_out.push_back(j_str(j, "result").empty()
                      ? j_str(j, "msg") : j_str(j, "result"));
              } else if (type == "sslInit" || type == "monitorInfo") {
                  s_mon_log.push_back(j_str(j, "note"));
              } else if (type == "error") {
                  s_script_out.push_back("ERR[" + j_str(j, "fn") + "]: " + j_str(j, "msg"));
              } else if (type == "info" || type == "warn" || type == "fatal") {
                  s_script_out.push_back(j_str(j, "msg"));
              } else if (type == "ready") {
                  s_script_out.push_back("agent ready: " + j_str(j, "msg"));
              }
          }
          
          void menu_init() {
              apply_theme();   // sets initial theme/font
          }
          
          void menu_poll_messages() {
              if (!ImGui::GetCurrentContext()) return;
              std::vector<std::string> msgs;
              int n = frida_drain_messages(msgs);
              if (n <= 0) return;
              for (auto& m : msgs) {
                  try { handle_message(m); }
                  catch(...) {}
              }
          }
          
          // ── Tabs ───────────────────────────────────────────────────
          static void tab_settings() {
              if (ImGui::SliderFloat("Font size", &s_font_sz, 8, 32)) {
                  ImGui::GetIO().FontGlobalScale = s_font_sz / 14.0f;
              }
              if (ImGui::SliderFloat("Opacity", &s_opacity, .3f, 1.f)) apply_theme();
              const char* th[] = {"Dark","Light","Classic"};
              if (ImGui::Combo("Theme", &s_theme, th, 3)) apply_theme();
              ImGui::Checkbox("Visible", &s_visible);
          }
          
          static void tab_patches() {
              ImGui::InputText("Name##pn",  s_pname, sizeof(s_pname));
              ImGui::InputText("Value##pv", s_pval,  sizeof(s_pval));
              if (ImGui::Button("Add Patch") && s_pname[0]) {
                  char a[1024];
                  snprintf(a, sizeof(a), "{\"name\":\"%s\",\"value\":\"%s\"}", s_pname, s_pval);
                  post_rpc("addPatch", a);
                  s_patches.push_back({s_pname, s_pval, true});
                  s_pname[0] = s_pval[0] = 0;
              }
              ImGui::Separator();
              for (int i = 0; i < (int)s_patches.size(); i++) {
                  ImGui::PushID(i);
                  auto& p = s_patches[i];
                  if (ImGui::Checkbox("##e", &p.enabled)) {
                      char a[256];
                      snprintf(a, sizeof(a), "{\"name\":\"%s\",\"enabled\":%s}",
                               p.name.c_str(), p.enabled ? "true" : "false");
                      post_rpc("setPatchEnabled", a);
                  }
                  ImGui::SameLine();
                  ImGui::Text("%s=%s", p.name.c_str(), p.value.c_str());
                  ImGui::SameLine();
                  if (ImGui::SmallButton("X")) {
                      char a[256]; snprintf(a, sizeof(a), "{\"name\":\"%s\"}", p.name.c_str());
                      post_rpc("removePatch", a);
                      s_patches.erase(s_patches.begin() + i);
                      ImGui::PopID(); break;
                  }
                  ImGui::PopID();
              }
          }
          
          static void tab_hooks() {
              const char* modes[] = {"Java","Smali","noop"};
              ImGui::InputText("Method##hn", s_hname, sizeof(s_hname));
              ImGui::Combo("Mode", &s_hmode, modes, 3);
              ImGui::InputTextMultiline("Code##hc", s_hcode, sizeof(s_hcode), ImVec2(-1, 80));
              if (ImGui::Button("Add Hook") && s_hname[0]) {
                  char a[2048];
                  snprintf(a, sizeof(a), "{\"name\":\"%s\",\"mode\":\"%s\",\"code\":\"%s\"}",
                           s_hname, modes[s_hmode], s_hcode);
                  post_rpc("addHook", a);
                  s_hooks.push_back({s_hname, s_hcode, true, s_hmode});
                  s_hname[0] = s_hcode[0] = 0;
              }
              ImGui::Separator();
              for (int i = 0; i < (int)s_hooks.size(); i++) {
                  ImGui::PushID(i);
                  auto& h = s_hooks[i];
                  if (ImGui::Checkbox("##he", &h.enabled)) {
                      char a[256];
                      snprintf(a, sizeof(a), "{\"name\":\"%s\",\"enabled\":%s}",
                               h.name.c_str(), h.enabled ? "true" : "false");
                      post_rpc("setHookEnabled", a);
                  }
                  ImGui::SameLine();
                  ImGui::Text("[%s] %s", modes[h.mode], h.name.c_str());
                  ImGui::SameLine();
                  if (ImGui::SmallButton("X")) {
                      char a[256]; snprintf(a, sizeof(a), "{\"name\":\"%s\"}", h.name.c_str());
                      post_rpc("removeHook", a);
                      s_hooks.erase(s_hooks.begin() + i);
                      ImGui::PopID(); break;
                  }
                  ImGui::PopID();
              }
          }
          
          static void tab_tracker() {
              ImGui::InputText("Method##tn", s_tname, sizeof(s_tname));
              if (ImGui::Button("Track") && s_tname[0]) {
                  char a[256]; snprintf(a, sizeof(a), "{\"name\":\"%s\"}", s_tname);
                  post_rpc("addTracker", a);
                  s_trackers.push_back({s_tname, {}});
                  s_tname[0] = 0;
              }
              ImGui::Separator();
              for (int i = 0; i < (int)s_trackers.size(); i++) {
                  ImGui::PushID(i);
                  auto& t = s_trackers[i];
                  if (ImGui::CollapsingHeader(t.name.c_str())) {
                      for (auto& l : t.log) ImGui::TextUnformatted(l.c_str());
                      if (ImGui::SmallButton("Remove")) {
                          char a[256]; snprintf(a, sizeof(a), "{\"name\":\"%s\"}", t.name.c_str());
                          post_rpc("removeTracker", a);
                          s_trackers.erase(s_trackers.begin() + i);
                          ImGui::PopID(); break;
                      }
                  }
                  ImGui::PopID();
              }
          }
          
          static void tab_recorder() {
              if (!s_rec_on) {
                  if (ImGui::Button("Start")) {
                      s_rec_on = true; s_rec_log.clear();
                      post_rpc("startRecorder", "{}");
                  }
              } else {
                  if (ImGui::Button("Stop")) { s_rec_on = false; post_rpc("stopRecorder", "{}"); }
                  ImGui::SameLine(); ImGui::TextColored(ImVec4(0,1,0,1), "REC");
              }
              ImGui::Separator();
              ImGui::BeginChild("rl", ImVec2(0, 180), true);
              for (auto& l : s_rec_log) ImGui::TextUnformatted(l.c_str());
              ImGui::SetScrollHereY(1.f);
              ImGui::EndChild();
          }
          
          static void tab_monitor() {
              ImGui::TextDisabled("(best-effort: Java SSLContext.init)");
              if (!s_mon_on) {
                  if (ImGui::Button("Start")) {
                      s_mon_on = true; s_mon_log.clear();
                      post_rpc("startMonitor", "{}");
                  }
              } else {
                  if (ImGui::Button("Stop")) { s_mon_on = false; post_rpc("stopMonitor", "{}"); }
                  ImGui::SameLine(); ImGui::TextColored(ImVec4(0,1,0,1), "MON");
              }
              ImGui::Separator();
              ImGui::BeginChild("ml", ImVec2(0, 180), true);
              for (auto& l : s_mon_log) ImGui::TextUnformatted(l.c_str());
              ImGui::SetScrollHereY(1.f);
              ImGui::EndChild();
          }
          
          static void tab_script() {
              ImGui::InputTextMultiline("##sc", s_script, sizeof(s_script), ImVec2(-1, 140));
              if (ImGui::Button("Run")) {
                  s_script_out.clear();
                  char a[8256]; snprintf(a, sizeof(a), "{\"src\":\"%s\"}", s_script);
                  post_rpc("evalScript", a);
              }
              ImGui::SameLine();
              if (ImGui::Button("Clear")) s_script_out.clear();
              ImGui::Separator();
              ImGui::BeginChild("so", ImVec2(0, 120), true);
              for (auto& l : s_script_out) ImGui::TextUnformatted(l.c_str());
              ImGui::EndChild();
          }
          
          static void tab_classes() {
              ImGui::InputText("Class##cn", s_cname, sizeof(s_cname));
              ImGui::SameLine();
              if (ImGui::Button("Open") && s_cname[0]) {
                  char a[256]; snprintf(a, sizeof(a), "{\"class\":\"%s\"}", s_cname);
                  post_rpc("openClass", a);
                  s_classes.push_back({s_cname, {}, {}, false});
                  s_cname[0] = 0;
              }
              for (int i = 0; i < (int)s_classes.size(); i++) {
                  ImGui::PushID(i);
                  auto& c = s_classes[i];
                  if (ImGui::CollapsingHeader(c.cname.c_str())) {
                      if (!c.loaded) ImGui::TextDisabled("Loading…");
                      if (ImGui::Button("List Instances")) {
                          char a[256]; snprintf(a, sizeof(a), "{\"class\":\"%s\"}", c.cname.c_str());
                          post_rpc("listInstances", a);
                      }
                      ImGui::Text("Methods:");
                      for (auto& m : c.methods) {
                          ImGui::BulletText("%s", m.c_str()); ImGui::SameLine();
                          if (ImGui::SmallButton("Hook")) {
                              char a[256];
                              snprintf(a, sizeof(a), "{\"class\":\"%s\",\"method\":\"%s\"}",
                                       c.cname.c_str(), m.c_str());
                              post_rpc("hookMethod", a);
                          }
                          ImGui::SameLine();
                          if (ImGui::SmallButton("Track")) {
                              char a[256];
                              snprintf(a, sizeof(a), "{\"class\":\"%s\",\"method\":\"%s\"}",
                                       c.cname.c_str(), m.c_str());
                              post_rpc("trackMethod", a);
                          }
                      }
                      ImGui::Text("Fields:");
                      for (auto& f : c.fields) {
                          ImGui::BulletText("%s", f.c_str()); ImGui::SameLine();
                          if (ImGui::SmallButton("Patch")) {
                              char a[256];
                              snprintf(a, sizeof(a), "{\"class\":\"%s\",\"field\":\"%s\"}",
                                       c.cname.c_str(), f.c_str());
                              post_rpc("patchField", a);
                          }
                      }
                  }
                  ImGui::PopID();
              }
          }
          
          void menu_draw() {
              if (!s_visible || !ImGui::GetCurrentContext()) return;
              ImGuiIO& io = ImGui::GetIO();
              ImGui::SetNextWindowPos(ImVec2(20, 20), ImGuiCond_Once);
              ImGui::SetNextWindowSize(ImVec2(io.DisplaySize.x * .75f, 500), ImGuiCond_Once);
              ImGui::SetNextWindowBgAlpha(s_opacity);
              ImGui::Begin("Dex-tool v1.3", &s_visible, ImGuiWindowFlags_NoCollapse);
              if (ImGui::BeginTabBar("tb")) {
                  if (ImGui::BeginTabItem("Settings")) { tab_settings(); ImGui::EndTabItem(); }
                  if (ImGui::BeginTabItem("Patches"))  { tab_patches();  ImGui::EndTabItem(); }
                  if (ImGui::BeginTabItem("Hooks"))    { tab_hooks();    ImGui::EndTabItem(); }
                  if (ImGui::BeginTabItem("Tracker"))  { tab_tracker();  ImGui::EndTabItem(); }
                  if (ImGui::BeginTabItem("Recorder")) { tab_recorder(); ImGui::EndTabItem(); }
                  if (ImGui::BeginTabItem("Monitor"))  { tab_monitor();  ImGui::EndTabItem(); }
                  if (ImGui::BeginTabItem("Script"))   { tab_script();   ImGui::EndTabItem(); }
                  if (ImGui::BeginTabItem("Classes"))  { tab_classes();  ImGui::EndTabItem(); }
                  ImGui::EndTabBar();
              }
              ImGui::End();
          }
          DXTMNC

      - name: Generate main.cpp
        run: |
          cat > src/main.cpp << 'DXTMAIN'
          #include "logger.h"
          #include "overlay.h"
          #include "frida-gumjs.h"
          #include <jni.h>
          #include <fcntl.h>
          #include <unistd.h>
          #include <cstring>
          #include <ctime>
          #include <cstdio>
          
          JavaVM* g_jvm_global = nullptr;
          
          static void write_marker(const char* path, const char* msg) {
              int fd = open(path, O_WRONLY|O_CREAT|O_TRUNC, 0644);
              if (fd < 0) return;
              char buf[256];
              int n = snprintf(buf, sizeof(buf), "%s ts=%ld\n", msg, (long)time(nullptr));
              write(fd, buf, (size_t)n);
              close(fd);
          }
          
          extern "C" JNIEXPORT jint JNICALL
          JNI_OnLoad(JavaVM* vm, void*) {
              g_jvm_global = vm;
              write_marker("/sdcard/Download/dextool-jni.marker", "checkpoint=entry");
              logger_init("/sdcard/Download");
              log_info("[JNI_OnLoad] entry");
              write_marker("/sdcard/Download/dextool-jni.marker", "checkpoint=logger_ready");
              overlay_set_java_vm(vm);
              if (!install_swap_hook()) {
                  log_crash_raw("[JNI_OnLoad] FATAL: install_swap_hook failed\n");
              }
              write_marker("/sdcard/Download/dextool-jni.marker", "checkpoint=hooks_installed");
              log_info("[JNI_OnLoad] done — awaiting first eglSwapBuffers");
              write_marker("/sdcard/Download/dextool-jni.marker", "checkpoint=jni_return");
              return JNI_VERSION_1_6;
          }
          DXTMAIN

      - name: Generate agent.js
        run: |
          cat > agent/agent.js << 'DXTAGNT'
          'use strict';
          
          (function() {
              try {
                  var patches  = {};
                  var hooks    = {};
                  var trackers = {};
                  var recOn    = false;
                  var monOn    = false;
          
                  function sendMsg(type, payload) {
                      try { send(JSON.stringify({ type: type, payload: payload })); } catch(e) {}
                  }
          
                  var fnTouch = null, fnKey = null, fnText = null, fnBksp = null;
                  try {
                      var sT = Module.findExportByName('libtool.so', 'dextool_on_touch');
                      var sK = Module.findExportByName('libtool.so', 'dextool_on_key');
                      var sX = Module.findExportByName('libtool.so', 'dextool_on_text');
                      var sB = Module.findExportByName('libtool.so', 'dextool_on_backspace');
                      if (sT) fnTouch = new NativeFunction(sT, 'void', ['float','float','int']);
                      if (sK) fnKey   = new NativeFunction(sK, 'void', ['int','int']);
                      if (sX) fnText  = new NativeFunction(sX, 'void', ['pointer']);
                      if (sB) fnBksp  = new NativeFunction(sB, 'void', []);
                  } catch(e) {
                      sendMsg('warn', { msg: 'native lookup failed: ' + e.message });
                  }
          
                  var currentActivity = null;
                  var imeEditText = null;
                  var imeViewGroup = null;
          
                  function installActivityTracker() {
                      Java.perform(function() {
                          try {
                              var Activity = Java.use('android.app.Activity');
                              Activity.onResume.implementation = function() {
                                  currentActivity = this;
                                  this.onResume();
                              };
                              Activity.onPause.implementation = function() {
                                  if (currentActivity === this) currentActivity = null;
                                  this.onPause();
                              };
                              sendMsg('info', { msg: 'activity tracker OK' });
                          } catch(e) {
                              sendMsg('warn', { msg: 'activity track hook failed: ' + e.message });
                          }
                      });
                  }
                  function installTouchHook() {
                      if (!fnTouch) { sendMsg('warn', { msg: 'dextool_on_touch missing' }); return; }
                      Java.perform(function() {
                          try {
                              var Activity = Java.use('android.app.Activity');
                              Activity.dispatchTouchEvent.implementation = function(ev) {
                                  try { fnTouch(ev.getRawX(), ev.getRawY(), ev.getAction() & 0xff); } catch(e2) {}
                                  return this.dispatchTouchEvent(ev);
                              };
                              sendMsg('info', { msg: 'touch hook OK' });
                          } catch(e) {
                              sendMsg('warn', { msg: 'touch hook failed: ' + e.message });
                          }
                      });
                  }
                  function installKeyHook() {
                      if (!fnKey) return;
                      Java.perform(function() {
                          try {
                              var Activity = Java.use('android.app.Activity');
                              Activity.dispatchKeyEvent.implementation = function(ev) {
                                  try { fnKey(ev.getKeyCode(), ev.getAction()); } catch(e2) {}
                                  return this.dispatchKeyEvent(ev);
                              };
                          } catch(e) {
                              sendMsg('warn', { msg: 'key hook failed: ' + e.message });
                          }
                      });
                  }
                  function installImeInputHooks() {
                      if (!fnText && !fnBksp) return;
                      Java.perform(function() {
                          try {
                              var BaseIC = Java.use('android.view.inputmethod.BaseInputConnection');
                              BaseIC.commitText.implementation = function(text, ncp) {
                                  try {
                                      if (imeEditText && text && text.length() > 0 && fnText) {
                                          fnText(Memory.allocUtf8String(text.toString()));
                                      }
                                  } catch(e) {}
                                  return this.commitText(text, ncp);
                              };
                              BaseIC.deleteSurroundingText.implementation = function(before, after) {
                                  try {
                                      if (imeEditText && fnBksp) {
                                          for (var i = 0; i < (before | 0); i++) fnBksp();
                                      }
                                  } catch(e) {}
                                  return this.deleteSurroundingText(before, after);
                              };
                              sendMsg('info', { msg: 'IME input hooks OK' });
                          } catch(e) {
                              sendMsg('warn', { msg: 'IME hooks failed: ' + e.message });
                          }
                      });
                  }
                  function showKeyboard() {
                      if (!currentActivity || imeEditText) return;
                      var act = currentActivity;
                      Java.perform(function() {
                          try {
                              var EditText   = Java.use('android.widget.EditText');
                              var ViewGroup  = Java.use('android.view.ViewGroup$LayoutParams');
                              var decor      = act.getWindow().getDecorView();
                              imeViewGroup   = decor;
                              imeEditText    = EditText.$new(act);
                              imeEditText.setAlpha(0);
                              imeEditText.setSingleLine(true);
                              imeEditText.setInputType(0x00000001);
                              decor.addView(imeEditText, ViewGroup.$new(1, 1));
                              imeEditText.requestFocus();
                              var immInst = act.getSystemService('input_method');
                              immInst.showSoftInput(imeEditText, 0);
                              sendMsg('info', { msg: 'IME shown' });
                          } catch (e) {
                              sendMsg('error', { fn: 'showKeyboard', msg: e.message });
                          }
                      });
                  }
                  function hideKeyboard() {
                      if (!currentActivity) return;
                      var act = currentActivity;
                      Java.perform(function() {
                          try {
                              var immInst = act.getSystemService('input_method');
                              if (imeEditText) {
                                  try { immInst.hideSoftInputFromWindow(imeEditText.getWindowToken(), 0); } catch(e) {}
                                  try { imeViewGroup.removeView(imeEditText); } catch(e) {}
                                  imeEditText = null;
                              }
                              sendMsg('info', { msg: 'IME hidden' });
                          } catch (e) {
                              sendMsg('error', { fn: 'hideKeyboard', msg: e.message });
                          }
                      });
                  }
          
                  setImmediate(function() {
                      try {
                          installActivityTracker();
                          installTouchHook();
                          installKeyHook();
                          installImeInputHooks();
                      } catch(e) {
                          sendMsg('error', { fn: 'deferred_install', msg: e.message });
                      }
                  });
          
                  rpc.exports = {
                      addPatch: function(name, value) {
                          try {
                              Java.perform(function() {
                                  var parts = name.split('.'); var field = parts.pop();
                                  var jcls  = Java.use(parts.join('.'));
                                  var f     = jcls.class.getDeclaredField(field);
                                  f.setAccessible(true);
                                  var t = f.getType().getName();
                                  if (t==='int'||t==='long'||t==='short'||t==='byte') f.set(null, parseInt(value));
                                  else if (t==='boolean') f.set(null, value === 'true');
                                  else if (t==='float'||t==='double') f.set(null, parseFloat(value));
                                  else f.set(null, value);
                                  patches[name] = { value: value, enabled: true };
                                  sendMsg('patchApplied', { name: name });
                              });
                          } catch(e) { sendMsg('error', { fn: 'addPatch', msg: e.message }); }
                      },
                      removePatch: function(name) { delete patches[name]; sendMsg('patchRemoved', { name: name }); },
                      setPatchEnabled: function(name, enabled) {
                          if (patches[name]) patches[name].enabled = enabled;
                          sendMsg('patchUpdated', { name: name, enabled: enabled });
                      },
                      addHook: function(name, mode, code) {
                          try {
                              Java.perform(function() {
                                  var parts = name.split('.'); var method = parts.pop();
                                  var jcls  = Java.use(parts.join('.'));
                                  if (mode === 'noop') {
                                      jcls[method].implementation = function() {
                                          sendMsg('hookFired', { name: name, mode: 'noop' });
                                          return null;
                                      };
                                  } else if (mode === 'Java') {
                                      var fn = new Function('Java', 'send', 'args', code);
                                      jcls[method].implementation = function() {
                                          return fn(Java, send, Array.from(arguments));
                                      };
                                  }
                                  hooks[name] = { mode: mode, enabled: true };
                                  sendMsg('hookAdded', { name: name });
                              });
                          } catch(e) { sendMsg('error', { fn: 'addHook', msg: e.message }); }
                      },
                      removeHook: function(name) {
                          try {
                              Java.perform(function() {
                                  var parts = name.split('.'); var m = parts.pop();
                                  Java.use(parts.join('.'))[m].implementation = null;
                                  delete hooks[name];
                                  sendMsg('hookRemoved', { name: name });
                              });
                          } catch(e) { sendMsg('error', { fn: 'removeHook', msg: e.message }); }
                      },
                      setHookEnabled: function(name, enabled) {
                          if (hooks[name]) hooks[name].enabled = enabled;
                          sendMsg('hookUpdated', { name: name, enabled: enabled });
                      },
                      addTracker: function(name) {
                          try {
                              Java.perform(function() {
                                  var parts = name.split('.'); var m = parts.pop();
                                  var jcls  = Java.use(parts.join('.'));
                                  jcls[m].implementation = function() {
                                      var args = Array.from(arguments).map(String);
                                      var ret;
                                      try { ret = this[m].apply(this, arguments); } catch(e) { ret = null; }
                                      sendMsg('trackerEvent', { name: name, args: args, ret: String(ret) });
                                      return ret;
                                  };
                                  trackers[name] = true;
                                  sendMsg('trackerAdded', { name: name });
                              });
                          } catch(e) { sendMsg('error', { fn: 'addTracker', msg: e.message }); }
                      },
                      removeTracker: function(name) {
                          try {
                              Java.perform(function() {
                                  var parts = name.split('.'); var m = parts.pop();
                                  Java.use(parts.join('.'))[m].implementation = null;
                                  delete trackers[name];
                                  sendMsg('trackerRemoved', { name: name });
                              });
                          } catch(e) { sendMsg('error', { fn: 'removeTracker', msg: e.message }); }
                      },
                      startRecorder: function() {
                          recOn = true;
                          Java.perform(function() {
                              Java.enumerateLoadedClassesSync().forEach(function(cls) {
                                  try {
                                      var jcls = Java.use(cls);
                                      jcls.class.getDeclaredMethods().forEach(function(md) {
                                          var mn = md.getName();
                                          try {
                                              jcls[mn].overloads.forEach(function(ovl) {
                                                  ovl.implementation = function() {
                                                      if (!recOn) { ovl.implementation = null; return this[mn].apply(this, arguments); }
                                                      sendMsg('recorded', { cls: cls, method: mn, args: Array.from(arguments).map(String) });
                                                      return this[mn].apply(this, arguments);
                                                  };
                                              });
                                          } catch(ignored) {}
                                      });
                                  } catch(ignored) {}
                              });
                          });
                          sendMsg('recorderStarted', {});
                      },
                      stopRecorder: function() { recOn = false; sendMsg('recorderStopped', {}); },
                      startMonitor: function() {
                          monOn = true;
                          Java.perform(function() {
                              try {
                                  var SSLCtx = Java.use('javax.net.ssl.SSLContext');
                                  SSLCtx.init.overload(
                                      '[Ljavax.net.ssl.KeyManager;',
                                      '[Ljavax.net.ssl.TrustManager;',
                                      'java.security.SecureRandom'
                                  ).implementation = function(km, tm, sr) {
                                      sendMsg('sslInit', { note: 'SSLContext.init intercepted' });
                                      return this.init(km, tm, sr);
                                  };
                              } catch(e) {}
                              try { Java.use('okhttp3.OkHttpClient'); sendMsg('monitorInfo', { note: 'OkHttp detected' }); } catch(e) {}
                          });
                          sendMsg('monitorStarted', {});
                      },
                      stopMonitor: function() { monOn = false; sendMsg('monitorStopped', {}); },
                      evalScript: function(src) {
                          try { sendMsg('scriptResult', { result: String(eval(src)) }); }
                          catch(e) { sendMsg('scriptError', { msg: e.message }); }
                      },
                      openClass: function(className) {
                          try {
                              Java.perform(function() {
                                  var jcls = Java.use(className);
                                  sendMsg('classInfo', {
                                      class:   className,
                                      methods: jcls.class.getDeclaredMethods().map(function(m) { return m.getName(); }),
                                      fields:  jcls.class.getDeclaredFields().map(function(f)  { return f.getName(); })
                                  });
                              });
                          } catch(e) { sendMsg('error', { fn: 'openClass', msg: e.message }); }
                      },
                      listInstances: function(className) {
                          try {
                              Java.perform(function() {
                                  var list = [];
                                  Java.choose(className, {
                                      onMatch:    function(i) { list.push(String(i)); if (list.length >= 20) return 'stop'; },
                                      onComplete: function()  { sendMsg('instanceList', { class: className, instances: list }); }
                                  });
                              });
                          } catch(e) { sendMsg('error', { fn: 'listInstances', msg: e.message }); }
                      },
                      hookMethod:  function(cls, m) { this.addHook(cls + '.' + m, 'noop', ''); },
                      trackMethod: function(cls, m) { this.addTracker(cls + '.' + m); },
                      patchField:  function(cls, f) { sendMsg('info', { msg: 'patchField: ' + cls + '.' + f }); }
                  };
          
                  function onMsg(msg) {
                      if (!msg) return;
                      if (msg.type === 'keyboard') {
                          if (msg.show) showKeyboard(); else hideKeyboard();
                      } else if (msg.type === 'rpc' && rpc.exports[msg.fn]) {
                          var a = msg.args || {};
                          try { rpc.exports[msg.fn].apply(rpc.exports, Object.values(a)); }
                          catch(e) { sendMsg('error', { fn: msg.fn, msg: e.message }); }
                      }
                      recv(onMsg);
                  }
                  recv(onMsg);
          
                  sendMsg('ready', { msg: 'Dex-tool agent v1.3 loaded' });
              } catch (e) {
                  try { send(JSON.stringify({ type: 'fatal', payload: { msg: String(e) } })); } catch(_) {}
              }
          })();
          DXTAGNT

      - name: Embed agent.js as C array
        run: |
          cat > /tmp/gen_embed.js << 'DXTNJS'
          const fs    = require('fs');
          const data  = fs.readFileSync('agent/agent.js');
          const bytes = Array.from(data);
          let out = '// Auto-generated from agent/agent.js\n';
          out += '#pragma once\n#include <stddef.h>\n\n';
          out += 'static const char g_agent_js[] = {\n';
          let line = '';
          for (let i = 0; i < bytes.length; i++) {
              line += '0x' + bytes[i].toString(16).padStart(2, '0') + ',';
              if ((i + 1) % 16 === 0) { out += '    ' + line + '\n'; line = ''; }
          }
          if (line) out += '    ' + line + '\n';
          out += '    0x00\n};\n';
          out += 'static const size_t g_agent_js_size = ' + bytes.length + ';\n';
          fs.writeFileSync('src/agent_bundle_embed.h', out);
          console.log('agent_bundle_embed.h: ' + bytes.length + ' bytes');
          DXTNJS
                    node /tmp/gen_embed.js

