# === BRANCH TARGET: dev ===
name: Build Dex-tool

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: "${{ !contains(github.event.head_commit.message || '', '[skip ci]') }}"
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    env:
      ANDROID_HOME: "${{ github.workspace }}/android-sdk"
      ANDROID_NDK_ROOT: "${{ github.workspace }}/android-sdk/ndk/25.2.9519653"

    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          token: "${{ secrets.GITHUB_TOKEN }}"
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.email "ci@dextool"
          git config user.name  "Dex-tool CI"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install system packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build python3-pip unzip curl \
            build-essential lib32stdc++6 lib32z1 flex bison

      - name: Setup Android SDK manually
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          wget -q \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
            -O /tmp/cmdtools.zip
          unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
          mv /tmp/cmdtools/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses >/dev/null 2>&1 || true
          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-26" \
            "platforms;android-34" \
            "build-tools;35.0.1" \
            "ndk;25.2.9519653"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools"           >> "$GITHUB_PATH"

      - name: Install Gradle 8.5
        run: |
          wget -q "https://services.gradle.org/distributions/gradle-8.5-bin.zip" \
            -O /tmp/gradle.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.5/bin" >> "$GITHUB_PATH"

      - name: Install meson
        run: pip3 install meson

      - name: Ensure debug keystore exists
        run: |
          mkdir -p ~/.android
          keytool -genkey -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000 2>/dev/null || true

      - name: Cache frida-gum arm64-v8a
        id: cache-frida-arm64
        uses: actions/cache@v4
        with:
          path: deps/frida-gum/arm64-v8a
          key: frida-gum-16.7.19-arm64-v3

      - name: Build frida-gum 16.7.19 arm64-v8a
        if: "${{ steps.cache-frida-arm64.outputs.cache-hit != 'true' }}"
        run: |
          git clone --recurse-submodules --depth 1 --branch 16.7.19 \
            https://github.com/frida/frida-gum.git frida-gum-src
          cd frida-gum-src
          FRIDA_PFX="$GITHUB_WORKSPACE/frida-dist-arm64"
          mkdir -p "$FRIDA_PFX"
          ANDROID_NDK_ROOT="$ANDROID_NDK_ROOT" \
          ./configure --host=android-arm64 --prefix="$FRIDA_PFX" \
            -- -Dgumjs=enabled -Dv8=disabled -Ddatabase=disabled \
               -Dtests=disabled -Dgraft_tool=disabled -Ddevkits=gumjs
          make -j"$(nproc)"
          make install || true
          mkdir -p "$GITHUB_WORKSPACE/deps/frida-gum/arm64-v8a"
          GUMLIB="$(find . "$FRIDA_PFX" -name 'libfrida-gumjs.a' 2>/dev/null | head -1)"
          GUMHDR="$(find . "$FRIDA_PFX" -name 'frida-gumjs.h'   2>/dev/null | head -1)"
          [ -z "$GUMLIB" ] && { echo "ERROR: libfrida-gumjs.a not found"; exit 1; }
          [ -z "$GUMHDR" ] && { echo "ERROR: frida-gumjs.h not found";   exit 1; }
          cp "$GUMLIB" "$GITHUB_WORKSPACE/deps/frida-gum/arm64-v8a/libfrida-gumjs.a"
          cp "$GUMHDR" "$GITHUB_WORKSPACE/deps/frida-gum/arm64-v8a/frida-gumjs.h"

      - name: Cache frida-gum armeabi-v7a
        id: cache-frida-arm
        uses: actions/cache@v4
        with:
          path: deps/frida-gum/armeabi-v7a
          key: frida-gum-16.7.19-armeabi-v7a-v3

      - name: Build frida-gum 16.7.19 armeabi-v7a
        if: "${{ steps.cache-frida-arm.outputs.cache-hit != 'true' }}"
        run: |
          if [ ! -d frida-gum-src ]; then
            git clone --recurse-submodules --depth 1 --branch 16.7.19 \
              https://github.com/frida/frida-gum.git frida-gum-src
          fi
          cd frida-gum-src
          rm -rf build
          FRIDA_PFX="$GITHUB_WORKSPACE/frida-dist-arm"
          mkdir -p "$FRIDA_PFX"
          ANDROID_NDK_ROOT="$ANDROID_NDK_ROOT" \
          ./configure --host=android-arm --prefix="$FRIDA_PFX" \
            -- -Dgumjs=enabled -Dv8=disabled -Ddatabase=disabled \
               -Dtests=disabled -Dgraft_tool=disabled -Ddevkits=gumjs
          make -j"$(nproc)"
          make install || true
          mkdir -p "$GITHUB_WORKSPACE/deps/frida-gum/armeabi-v7a"
          GUMLIB="$(find . "$FRIDA_PFX" -name 'libfrida-gumjs.a' 2>/dev/null | head -1)"
          GUMHDR="$(find . "$FRIDA_PFX" -name 'frida-gumjs.h'   2>/dev/null | head -1)"
          [ -z "$GUMLIB" ] && { echo "ERROR: armeabi-v7a lib not found"; exit 1; }
          cp "$GUMLIB" "$GITHUB_WORKSPACE/deps/frida-gum/armeabi-v7a/libfrida-gumjs.a"
          cp "$GUMHDR" "$GITHUB_WORKSPACE/deps/frida-gum/armeabi-v7a/frida-gumjs.h"

      - name: Cache Dobby
        id: cache-dobby
        uses: actions/cache@v4
        with:
          path: deps/dobby
          key: dobby-lsposed-v2

      - name: Build Dobby for both ABIs
        if: "${{ steps.cache-dobby.outputs.cache-hit != 'true' }}"
        run: |
          git clone --depth 1 https://github.com/LSPosed/Dobby.git dobby-src
          mkdir -p deps/dobby
          cp -r dobby-src/include deps/dobby/
          for ABI in arm64-v8a armeabi-v7a; do
            cmake -S dobby-src -B "dobby-src/build-$ABI" \
              -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI="$ABI" -DANDROID_PLATFORM=android-26 \
              -DCMAKE_BUILD_TYPE=Release -DDOBBY_DEBUG=OFF \
              -DDOBBY_GENERATE_SHARED=OFF -GNinja
            ninja -C "dobby-src/build-$ABI" -j"$(nproc)" dobby
            mkdir -p "deps/dobby/$ABI"
            cp "dobby-src/build-$ABI/libdobby.a" "deps/dobby/$ABI/"
          done

      - name: Clone ImGui 1.90.4
        run: |
          git clone --depth 1 --branch v1.90.4 \
            https://github.com/ocornut/imgui.git imgui
          ls imgui/backends/imgui_impl_opengl3.cpp

      - name: Download smali 3.0.7 fat jar
        run: |
          mkdir -p deps/smali
          BASE="https://dl.google.com/dl/android/maven2/com/android/tools/smali"
          SMVER="3.0.7"
          for art in smali smali-dexlib2 smali-util; do
            wget -q "$BASE/$art/$SMVER/$art-$SMVER.jar" -O "deps/smali/$art.jar"
          done
          wget -q "https://repo1.maven.org/maven2/com/beust/jcommander/1.72/jcommander-1.72.jar" \
            -O deps/smali/jcommander.jar
          wget -q "https://repo1.maven.org/maven2/com/google/guava/guava/30.1.1-android/guava-30.1.1-android.jar" \
            -O deps/smali/guava.jar
          MERGE="$(mktemp -d)"
          for j in deps/smali/*.jar; do unzip -nqo "$j" -d "$MERGE" 2>/dev/null || true; done
          jar cf deps/smali/smali-fat.jar -C "$MERGE" .
          ls -lh deps/smali/smali-fat.jar

      - name: Create project directories
        run: |
          mkdir -p src agent \
            sample-app/app/src/main/java/com/dextool/app \
            sample-app/app/src/main/assets \
            sample-app/app/src/main/res/values \
            sample-app/app/src/main/jniLibs/arm64-v8a \
            sample-app/app/src/main/jniLibs/armeabi-v7a \
            out/lib/arm64-v8a out/lib/armeabi-v7a \
            .github/workflows

      - name: Generate CMakeLists.txt
        run: |
          cat > CMakeLists.txt << 'DXTCMK'
          cmake_minimum_required(VERSION 3.22)
          project(dextool CXX C)
          set(CMAKE_CXX_STANDARD 17)
          set(CMAKE_C_STANDARD 11)

          set(FRIDA_GUM_DIR "${CMAKE_SOURCE_DIR}/deps/frida-gum/${ANDROID_ABI}")
          add_library(frida-gumjs STATIC IMPORTED)
          set_target_properties(frida-gumjs PROPERTIES
              IMPORTED_LOCATION "${FRIDA_GUM_DIR}/libfrida-gumjs.a")

          set(DOBBY_DIR "${CMAKE_SOURCE_DIR}/deps/dobby")
          add_library(dobby_static STATIC IMPORTED)
          set_target_properties(dobby_static PROPERTIES
              IMPORTED_LOCATION "${DOBBY_DIR}/${ANDROID_ABI}/libdobby.a")

          find_library(lib_egl     EGL)
          find_library(lib_gles2   GLESv2)
          find_library(lib_gles3   GLESv3)
          find_library(lib_log     log)
          find_library(lib_dl      dl)
          find_library(lib_android android)

          set(IMGUI_DIR "${CMAKE_SOURCE_DIR}/imgui")
          set(IMGUI_SRC
              ${IMGUI_DIR}/imgui.cpp
              ${IMGUI_DIR}/imgui_draw.cpp
              ${IMGUI_DIR}/imgui_tables.cpp
              ${IMGUI_DIR}/imgui_widgets.cpp
              ${IMGUI_DIR}/backends/imgui_impl_opengl3.cpp)

          add_library(tool SHARED
              src/main.cpp
              src/logger.cpp
              src/overlay.cpp
              src/touch.cpp
              src/frida_bridge.cpp
              src/smali_runtime.cpp
              src/menu.cpp
              ${IMGUI_SRC})

          target_include_directories(tool PRIVATE
              src/
              ${FRIDA_GUM_DIR}/
              ${DOBBY_DIR}/include/
              ${IMGUI_DIR}/
              ${IMGUI_DIR}/backends/)

          target_compile_definitions(tool PRIVATE IMGUI_IMPL_OPENGL_ES2=1)

          target_compile_options(tool PRIVATE
              -fvisibility=hidden -ffunction-sections -fdata-sections -O2
              -Wno-unused-variable -Wno-unused-function)

          target_link_libraries(tool
              frida-gumjs dobby_static
              ${lib_egl} ${lib_gles2} ${lib_gles3} ${lib_log} ${lib_dl} ${lib_android}
              -lm -Wl,--gc-sections -Wl,--exclude-libs,ALL)
          DXTCMK

      - name: Generate logger.h
        run: |
          cat > src/logger.h << 'DXTLOGH'
          #pragma once
          #include <android/log.h>
          #define DTAG "DexTool"
          #define LOGI(...) __android_log_print(ANDROID_LOG_INFO,  DTAG, __VA_ARGS__)
          #define LOGD(...) __android_log_print(ANDROID_LOG_DEBUG, DTAG, __VA_ARGS__)
          #define LOGE(...) __android_log_print(ANDROID_LOG_ERROR, DTAG, __VA_ARGS__)
          void logger_init(const char* base_dir);
          void log_info(const char* msg);
          void log_debug(const char* msg);
          void log_crash_raw(const char* msg);
          /* r11: base dir captured at init, for menu.cpp config IO */
          const char* logger_base_dir();
          void logger_install_abort_capture();
          DXTLOGH

      - name: Generate logger.cpp
        run: |
          cat > src/logger.cpp << 'DXTLOGC'
          #include "logger.h"
          #include "frida-gumjs.h"
          #include <cstdio>
          #include <cstring>
          #include <ctime>
          #include <cstdlib>
          #include <exception>
          #include <fcntl.h>
          #include <unistd.h>
          #include <sys/stat.h>
          #include <signal.h>
          #include <ucontext.h>
          #include <dlfcn.h>
          #include <pthread.h>

          static FILE* g_info_fp  = nullptr;
          static FILE* g_debug_fp = nullptr;
          static int   g_crash_fd = -1;
          static char  g_base_dir[512] = "";      /* r11: for menu.cpp config IO */

          const char* logger_base_dir() { return g_base_dir; }
          static pthread_mutex_t g_mtx = PTHREAD_MUTEX_INITIALIZER;

          static void ts(char* buf, size_t n) {
              time_t t = time(nullptr);
              struct tm tm;
              localtime_r(&t, &tm);
              snprintf(buf, n, "%04d-%02d-%02d %02d:%02d:%02d",
                       tm.tm_year+1900, tm.tm_mon+1, tm.tm_mday,
                       tm.tm_hour, tm.tm_min, tm.tm_sec);
          }

          /* Fatal-signal capture. SA_SIGINFO logs signal/si_code/fault
             addr/PC, then the PREVIOUS handler is restored and the signal
             re-raised so debuggerd still writes its tombstone and the
             "Fatal signal" backtrace to logcat (streamed to
             dextool-logcat.txt by DexToolApp). */
          static struct sigaction g_prev_act[32];
          static bool             g_prev_set[32];
          static char             g_alt_stack[64 * 1024];

          static void crash_sig_action(int sig, siginfo_t* si, void* uc) {
              uintptr_t pc = 0;
              ucontext_t* u = (ucontext_t*)uc;
          #if defined(__aarch64__)
              if (u) pc = (uintptr_t)u->uc_mcontext.pc;
          #elif defined(__arm__)
              if (u) pc = (uintptr_t)u->uc_mcontext.arm_pc;
          #endif
              char m[160];
              snprintf(m, sizeof(m), "CRASH signal=%d code=%d addr=%p pc=%p\n",
             sig, si ? si->si_code : 0,
                       si ? si->si_addr : NULL, (void*)pc);
              log_crash_raw(m);
              {
                  Dl_info di;
                  if (dladdr((const void*)pc, &di) && di.dli_fname) {
                      char lm[256];
                      snprintf(lm, sizeof(lm),
                               "pc=%p in %s base=%p off=+%zx\n",
                               (void*)pc, di.dli_fname, di.dli_fbase,
                               (size_t)(pc - (uintptr_t)di.dli_fbase));
                      log_crash_raw(lm);
                  }
              }
              if (g_prev_set[sig]) {
                  sigaction(sig, &g_prev_act[sig], NULL);
              } else {
                  signal(sig, SIG_DFL);
              }
              raise(sig);
          }

          static void install_crash_sig(int sig) {
              struct sigaction sa;
              memset(&sa, 0, sizeof(sa));
              sa.sa_sigaction = crash_sig_action;
              sa.sa_flags     = SA_SIGINFO | SA_RESTART | SA_ONSTACK;
              sigemptyset(&sa.sa_mask);
              g_prev_set[sig] = (sigaction(sig, &sa, &g_prev_act[sig]) == 0);
          }

          void logger_init(const char* base_dir) {
              mkdir(base_dir, 0755);
              snprintf(g_base_dir, sizeof(g_base_dir), "%s", base_dir);
              char p[640];
              snprintf(p, sizeof(p), "%s/dextool.log",       base_dir);
              g_info_fp  = fopen(p, "a");
              snprintf(p, sizeof(p), "%s/dextool-debug.log",  base_dir);
              g_debug_fp = fopen(p, "a");
              /* keep last boot's crash log; start fresh for this boot so
                 entries map 1:1 to runs */
              char pprev[640];
              snprintf(pprev, sizeof(pprev), "%s/dextool-crash.prev.log", base_dir);
              snprintf(p, sizeof(p), "%s/dextool-crash.log", base_dir);
              rename(p, pprev);
              g_crash_fd = open(p, O_WRONLY|O_CREAT|O_TRUNC, 0644);
              {
                  stack_t ss;
                  memset(&ss, 0, sizeof(ss));
                  ss.ss_sp    = g_alt_stack;
                  ss.ss_size  = sizeof(g_alt_stack);
                  ss.ss_flags = 0;
                  sigaltstack(&ss, NULL);
              }
              install_crash_sig(SIGSEGV);
              install_crash_sig(SIGABRT);
              install_crash_sig(SIGBUS);
              install_crash_sig(SIGILL);
              install_crash_sig(SIGFPE);
              {
                  char boot[96];
                  snprintf(boot, sizeof(boot), "--- boot %ld ---\n", (long)time(nullptr));
                  log_crash_raw(boot);
              }
              /* r14: memory snapshot at boot. lmkd kills (the "crash when I
                 open any app" class) are invisible to signal handlers, so the
                 field report must show how much headroom the process had. */
              {
                  char ln[256];
                  long avail = -1, rss = -1;
                  FILE* mf = fopen("/proc/meminfo", "r");
                  if (mf) {
                      while (fgets(ln, sizeof(ln), mf))
                          if (sscanf(ln, "MemAvailable: %ld kB", &avail) == 1) break;
                      fclose(mf);
                  }
                  FILE* sf = fopen("/proc/self/status", "r");
                  if (sf) {
                      while (fgets(ln, sizeof(ln), sf))
                          if (sscanf(ln, "VmRSS: %ld kB", &rss) == 1) break;
                      fclose(sf);
                  }
                  char mm[160];
                  snprintf(mm, sizeof(mm),
                           "mem: VmRSS=%ldkB MemAvailable=%ldkB", rss, avail);
                  log_info(mm);
              }
              log_info("logger_init done (build r14: IME show fix, phased agent init, small-surface ownership gate)");
          }

          void log_info(const char* msg) {
              if (!g_info_fp) return;
              pthread_mutex_lock(&g_mtx);
              char t[32]; ts(t, sizeof(t));
              fprintf(g_info_fp, "[%s][I] %s\n", t, msg);
              fflush(g_info_fp);
              pthread_mutex_unlock(&g_mtx);
          }

          void log_debug(const char* msg) {
              if (!g_debug_fp) return;
              pthread_mutex_lock(&g_mtx);
              char t[32]; ts(t, sizeof(t));
              fprintf(g_debug_fp, "[%s][D] %s\n", t, msg);
              fflush(g_debug_fp);
              pthread_mutex_unlock(&g_mtx);
          }

          void log_crash_raw(const char* msg) {
              if (g_crash_fd >= 0) write(g_crash_fd, msg, strlen(msg));
          }

          static void glib_log_capture(const gchar* domain, GLogLevelFlags level,
                                       const gchar* message, gpointer) {
              const char* lv =
                  (level & G_LOG_LEVEL_ERROR)    ? "ERROR"    :
                  (level & G_LOG_LEVEL_CRITICAL) ? "CRITICAL" :
                  (level & G_LOG_LEVEL_WARNING)  ? "WARNING"  : "MSG";
              char m[1024];
              snprintf(m, sizeof(m), "[GLIB] %s-%s: %s\n",
                       domain ? domain : "GLib", lv, message ? message : "(null)");
              log_crash_raw(m);
              if (level & G_LOG_FLAG_FATAL) {
                  /* custom handler must abort fatal messages itself */
                  abort();
              }
          }

          static void dt_terminate() {
              log_crash_raw("std::terminate called\n");
              try { std::rethrow_exception(std::current_exception()); }
              catch (const std::exception& e) {
                  char m[512];
                  snprintf(m, sizeof(m), "  uncaught exception: %s\n", e.what());
                  log_crash_raw(m);
              } catch (...) {
                  log_crash_raw("  uncaught exception: (unknown)\n");
              }
              abort();
          }

          void logger_install_abort_capture() {
              if (g_crash_fd >= 0) {
                  dup2(g_crash_fd, STDOUT_FILENO);
                  dup2(g_crash_fd, STDERR_FILENO);
              }
              g_log_set_default_handler(glib_log_capture, nullptr);
              std::set_terminate(dt_terminate);
              log_info("abort capture installed (glib+terminate+stderr -> crash log)");
          }
          DXTLOGC

      - name: Generate overlay.h
        run: |
          cat > src/overlay.h << 'DXTOVLH'
          #pragma once
          #include <EGL/egl.h>
          #include <jni.h>
          #include <string>
          #include <vector>

          bool install_swap_hook();
          void overlay_set_java_vm(JavaVM* vm);
          void overlay_start(JavaVM* vm);

          /* owner has a live ImGui world and at least one frame has been drawn */
          bool overlay_ready();
          /* last known DisplaySize of the owner surface (0,0 if none) */
          void overlay_get_display_size(float* w, float* h);
          /* rebuild the font atlas at `size` px on the next owner frame */
          void overlay_request_font_rebuild(float size);

          /* menu.cpp publishes the scrollable rects of the current frame (owner
             thread only); overlay converts drags inside them into wheel events at
             the given speed, which is what makes the huge lists touch-scrollable */
          void overlay_publish_scroll_regions(const std::vector<float>& xywh_speed);

          /* ---- r12 ---- */
          /* manual Y nudge applied after the touch map (Settings slider). With
             the Y rescale gone (map_touch) this bias is what corrects the
             residual status-bar offset on hosts where the view rect cannot
             be measured. */
          void overlay_set_touch_bias(float dy);
          /* one-line description of the active touch map for the Settings status */
          void overlay_touch_map_desc(char* buf, int n);

          #ifdef __cplusplus
          extern "C" {
          #endif
          /* JNI surface used by the JS agent (and by the AInputQueue fallback) */
          JNIEXPORT void dextool_on_touch(float x, float y, int action);      /* raw window coords */
          JNIEXPORT void dextool_set_touch_map(int x, int y, int w, int h);   /* overlay view rect in window */
          JNIEXPORT void dextool_add_char(int codepoint);
          JNIEXPORT void dextool_backspace();
          JNIEXPORT bool dextool_want_mouse();
          JNIEXPORT int  dextool_display_size();  /* (w<<16)|h, 0 until the overlay is up */
          JNIEXPORT void dextool_agent_log(const char* msg); /* r14: agent phase markers -> logs */
          #ifdef __cplusplus
          }
          #endif
          DXTOVLH

      - name: Generate overlay.cpp
        run: |
          cat > src/overlay.cpp << 'DXTOVLC'
          #include "overlay.h"
          #include "logger.h"
          #include "menu.h"
          #include "frida_bridge.h"
          #include "touch.h"
          #include "imgui.h"
          #include "imgui_impl_opengl3.h"
          #include "dobby.h"
          #include "frida-gumjs.h"
          #include <EGL/egl.h>
          #include <GLES2/gl2.h>
          #include <GLES3/gl3.h>
          #include <dlfcn.h>
          #include <cstring>
          #include <cmath>
          #include <unistd.h>
          #include <ctime>
          #include <pthread.h>
          #include <atomic>
          #include <vector>
          #include <mutex>
          #include <unordered_map>

          typedef EGLBoolean (*fn_swap)(EGLDisplay, EGLSurface);
          typedef EGLBoolean (*fn_swap_dmg)(EGLDisplay, EGLSurface, EGLint*, EGLint);
          typedef EGLBoolean (*fn_destroy_ctx)(EGLDisplay, EGLContext);
          typedef EGLBoolean (*fn_terminate)(EGLDisplay);

          static fn_swap        g_orig_swap        = nullptr;
          static fn_swap_dmg    g_orig_swap_dmg    = nullptr;
          static fn_destroy_ctx g_orig_destroy_ctx = nullptr;
          static fn_terminate   g_orig_terminate   = nullptr;

          static std::atomic<bool> g_gum_inited {false};
          static JavaVM*           g_jvm        = nullptr;

          /* ---- single-owner overlay ---------------------------------------- r9
             r7 elected exactly one EGL context as the overlay owner (the
             continuously rendering GL thread of the game/view) and only that
             thread touches ImGui or GL. r9 keeps that, and adds:

             PARK + ADOPT. When the owner context dies (app switch: the
             GLSurfaceView destroys its context in onPause; keyboard with
             adjustResize on some devices; activity relayout) r7 destroyed the
             whole ImGui world and had to re-elect from scratch after 45 swaps,
             which looked like "switch to another app and back -> the app closes /
             the menu is gone". r9 parks the ImGui context (all window layout,
             input and scroll state) in g_orphan_imgui and the NEXT context that
             reaches 8 swaps adopts it: the menu reappears exactly as it was,
             usually within a fraction of a second of coming back to the app.
             The backend's GL handles died with the old context, so adoption
             calls ImGui_ImplOpenGL3_Shutdown (GL deletes are no-ops for names
             that were never created in the new context) and Init again, which
             makes NewFrame recreate the font texture and shader on the new
             context. The old context's objects are freed by the driver; we never
             call GL without a current context.

             r11 also retires every slot in the eglTerminate hook: terminating a
             display invalidates all of its contexts, and if the driver later hands
             out a new context at the same address, the stale slot would happily
             draw with handles that are invalid in it - the classic
             "glUseProgram -> GL_INVALID_VALUE (0x501)" abort class reported from
             the field. */
          #define DT_ELECT_MIN_SWAPS 45
          #define DT_ADOPT_MIN_SWAPS  8
          #define DT_OWNER_STALE_MS  1500

          struct GlState {
              GLint program = 0;
              GLint vao = 0, ab = 0, eb = 0;
              GLint fb = 0;                     /* r9: app FBO restored too */
              GLint active_tex = GL_TEXTURE0, tex2d = 0;
              GLint viewport[4]    = {0, 0, 0, 0};
              GLint scissor_box[4] = {0, 0, 0, 0};
              GLboolean scissor = GL_FALSE, depth = GL_FALSE,
                        stencil = GL_FALSE, blend = GL_FALSE, cull = GL_FALSE;
              GLint blend_src_rgb = GL_ONE, blend_dst_rgb = GL_ZERO,
                    blend_src_a = GL_ONE, blend_dst_a = GL_ZERO,
                    blend_eq_rgb = GL_FUNC_ADD, blend_eq_a = GL_FUNC_ADD;
          };
          struct Slot {
              ImGuiContext* imgui = nullptr;
              bool  failed = false;
              bool  es3 = false;
              bool  dead = false;         /* under g_slots_mtx */
              bool  reject_logged = false;  /* r14: one log per rejection */
              long  swaps = 0;            /* under g_slots_mtx */
              long  last_swap_ms = 0;     /* under g_slots_mtx */
              long  last_frame_ms = 0;    /* owner thread only */
              GlState gl;
          };
          static std::mutex g_slots_mtx;
          static std::unordered_map<EGLContext, Slot*> g_slots;
          static std::vector<Slot*> g_graveyard;  /* never freed: no dangling */
          static EGLContext g_owner = nullptr;    /* under g_slots_mtx */
          static ImGuiContext* g_orphan_imgui = nullptr;  /* g_tick_mtx only */
          /* r14: DisplaySize of the parked world; surfaces far smaller than
             this must NOT adopt it (the "small clone of our menu" bug) */
          static float g_orphan_dw = 0.f, g_orphan_dh = 0.f;
          static std::mutex g_tick_mtx;  /* one ImGui drawer at a time; also
                                            serializes ownership changes, adoption
                                            and slot teardown against frames */
          static std::atomic<bool> g_ready {false};

          /* ---- touch mapping ------------------------------------------------
             Events arrive in raw window pixels from both input paths. Two sources
             feed the map, best one wins:
             (a) the agent measured where the overlay's GL view actually sits in
                 the window (view rect via getLocationInWindow) -> dextool_set_touch_map;
                 r11 makes this measurement happen on Activity.onResume and on
                 every touch (throttled), so it no longer depends on
                 onWindowFocusChanged firing, which it never did in the field.
             (b) native estimate: the largest surface seen on ANY context is
                 ~= the full window (a typical app's HWUI surface spans the whole
                 540x960 window while the game surface is smaller). r11 tracks
                 every swap for this, not just the owner's.
             On top of the map, overlay_set_touch_bias() adds a manual Y nudge
             (Settings) for hosts where neither source can be measured. */
          struct TouchMap { float x=0, y=0, w=0, h=0; bool ok=false; bool est=false; };
          static std::mutex g_map_mtx;
          static TouchMap   g_map;
          static float      g_bias_y = -80.f;    /* manual nudge, under g_map_mtx; r13 default = constant status-bar offset */

          /* Touch stream with dedup: a NativeActivity host can deliver the same
             physical tap through BOTH the AInputQueue and the Java bridge; an
             event identical to the previous one within 40 ms is dropped. */
          struct TouchEvent { float x, y; int phase; };
          static std::mutex              g_touch_mtx;
          static std::vector<TouchEvent> g_touch_q;
          static TouchEvent              g_touch_last;
          static long                    g_touch_last_ms = 0;
          static std::atomic<bool>       g_want_mouse {false};

          static std::mutex            g_char_mtx;
          static std::vector<unsigned>  g_pending_chars;
          static bool                   g_pending_bs    = false;

          /* scroll regions published by menu_draw (owner thread) */
          static std::vector<float> g_scroll_regions;

          /* font atlas: rebuilt on demand from a system font, so the Font Size
             slider actually changes the glyphs instead of just scaling them */
          static float g_font_size  = 18.0f;
          static bool  g_font_dirty = false;
          static char  g_font_path[128] = "";
          static std::mutex g_disp_mtx;
          static float g_disp_w = 0.f, g_disp_h = 0.f;
          static float g_max_surf_w = 0.f, g_max_surf_h = 0.f;   /* seen on ANY ctx */

          static long now_ms() {
              timespec ts;
              clock_gettime(CLOCK_MONOTONIC, &ts);
              return (long)ts.tv_sec * 1000 + ts.tv_nsec / 1000000;
          }

          static void touch_push(float x, float y, int phase) {
              std::lock_guard<std::mutex> lk(g_touch_mtx);
              long now = now_ms();
              if (g_touch_last.phase == phase &&
                  fabsf(x - g_touch_last.x) < 0.01f &&
                  fabsf(y - g_touch_last.y) < 0.01f &&
                  (now - g_touch_last_ms) < 40)
                  return;                          /* duplicate from the 2nd path */
              g_touch_last = {x, y, phase};
              g_touch_last_ms = now;
              if (g_touch_q.size() > 96) g_touch_q.erase(g_touch_q.begin());
              g_touch_q.push_back({x, y, phase});
          }

          extern "C" JNIEXPORT void dextool_on_touch(float x, float y, int action) {
              int a = action & 0xff;
              if      (a == 0)            touch_push(x, y, 0);  /* DOWN */
              else if (a == 1 || a == 3)  touch_push(x, y, 1);  /* UP/CANCEL */
              else if (a == 2)            touch_push(x, y, 2);  /* MOVE */
              else if (a == 5 || a == 6)  touch_push(x, y, 2);  /* PTR up/dn */
          }

          extern "C" JNIEXPORT void dextool_set_touch_map(int x, int y, int w, int h) {
              if (w <= 0 || h <= 0) return;
              std::lock_guard<std::mutex> lk(g_map_mtx);
              bool was = g_map.ok;
              g_map = { (float)x, (float)y, (float)w, (float)h, true, false };
              if (!was)
                  LOGI("[overlay] touch map: view rect in window = (%d,%d %dx%d)",
                       x, y, w, h);
          }

          void overlay_set_touch_bias(float dy) {
              if (dy < -100.f) dy = -100.f;
              if (dy >  100.f) dy =  100.f;
              std::lock_guard<std::mutex> lk(g_map_mtx);
              g_bias_y = dy;
          }

          void overlay_touch_map_desc(char* buf, int n) {
              if (!buf || n <= 0) return;
              std::lock_guard<std::mutex> lk(g_map_mtx);
              if (g_map.ok)
                  snprintf(buf, n, "%s view (%.0f,%.0f) %.0fx%.0f + Y%+.0f",
                           g_map.est ? "est" : "measured",
                           g_map.x, g_map.y, g_map.w, g_map.h, g_bias_y);
              else
                  snprintf(buf, n, "none yet (raw passthrough) + Y%+.0f", g_bias_y);
          }

          /* native estimate: while the agent has not measured the view rect yet,
             assume the window is as tall as the largest surface we have seen (a
             typical app's HWUI surface spans the full window) and that the GL
             view starts at the top-left. This already corrects the systematic
             vertical offset; the agent's real measurement replaces it. */
          static void maybe_estimate_map() {
              std::lock_guard<std::mutex> lk(g_map_mtx);
              if (g_map.ok) return;                      /* real map present */
              float w = 0.f, h = 0.f;
              {
                  std::lock_guard<std::mutex> lk2(g_disp_mtx);
                  w = g_max_surf_w; h = g_max_surf_h;
              }
              if (w <= 0.f || h <= 0.f) return;
              g_map = { 0.f, 0.f, w, h, true, true };
              LOGI("[overlay] touch map: estimate 0,0 %.0fx%.0f (max surface)", w, h);
          }

          /* defined further down */
          static ImVec2 map_touch(float x, float y, const ImVec2& ds);

          extern "C" JNIEXPORT bool dextool_want_mouse() {
              /* r12: the drawn keyboard is gone (text input is the system IME
                 now, which is its own window - its taps never reach the
                 activity). Only the menu itself claims events. */
              return g_want_mouse.load();
          }

          extern "C" JNIEXPORT int dextool_display_size() {
              std::lock_guard<std::mutex> lk(g_disp_mtx);
              if (g_disp_w <= 0 || g_disp_h <= 0) return 0;
              return ((int)g_disp_w << 16) | (int)g_disp_h;
          }

          extern "C" JNIEXPORT void dextool_add_char(int cp) {
              std::lock_guard<std::mutex> lk(g_char_mtx);
              g_pending_chars.push_back((unsigned)cp);
          }

          extern "C" JNIEXPORT void dextool_backspace() {
              std::lock_guard<std::mutex> lk(g_char_mtx);
              g_pending_bs = true;
          }

          /* r14: the GumJS agent posts phase markers here (NativeFunction on
             this export) before and around every risky init step. The markers
             land in dextool-crash.log AND dextool-debug.log, so a field abort
             pins the exact phase that killed the process. */
          extern "C" JNIEXPORT void dextool_agent_log(const char* msg) {
              if (!msg) return;
              char m[560];
              snprintf(m, sizeof(m), "[agent] %.500s\n", msg);
              log_crash_raw(m);
              log_debug(m);
          }

          bool overlay_ready() { return g_ready.load(); }

          void overlay_get_display_size(float* w, float* h) {
              std::lock_guard<std::mutex> lk(g_disp_mtx);
              if (w) *w = g_disp_w;
              if (h) *h = g_disp_h;
          }

          void overlay_request_font_rebuild(float size) {
              if (size < 10.f) size = 10.f;
              if (size > 40.f) size = 40.f;
              g_font_size  = size;
              g_font_dirty = true;
          }

          void overlay_publish_scroll_regions(const std::vector<float>& xywh_speed) {
              /* publisher (menu_draw) and consumer (replay) are both the owner
                 thread, one frame apart - no lock needed */
              g_scroll_regions = xywh_speed;
          }

          static void* frida_thread(void*) {
              frida_bridge_start(g_jvm);
              return nullptr;
          }

          /* called from JNI_OnLoad before overlay_start; the frida thread and
             the bridge read g_jvm afterwards */
          void overlay_set_java_vm(JavaVM* vm) { g_jvm = vm; }

          void overlay_start(JavaVM*) {
              if (g_gum_inited.exchange(true)) return;
              gum_init_embedded();
              log_info("[overlay] gum_init_embedded done");
              pthread_t ft;
              pthread_attr_t a;
              pthread_attr_init(&a);
              pthread_attr_setstacksize(&a, 8 * 1024 * 1024);
              pthread_attr_setdetachstate(&a, PTHREAD_CREATE_DETACHED);
              pthread_create(&ft, &a, frida_thread, nullptr);
              pthread_attr_destroy(&a);
              touch_install_hooks();
              log_info("[overlay] touch hooks installed, frida thread started");
          }

          static void menu_init_once() {
              static bool done = false;
              if (!done) { done = true; menu_init(); }
          }

          static Slot* slot_for(EGLContext ctx) {
              std::lock_guard<std::mutex> lk(g_slots_mtx);
              Slot*& s = g_slots[ctx];
              if (!s) s = new Slot();
              return s;
          }

          /* Ownership rules (map work under g_slots_mtx, whole frame under
             g_tick_mtx, so this can never race a draw):
               - fast path: we are already the owner;
               - if the owner went quiet for DT_OWNER_STALE_MS while we keep
                 swapping, ownership migrates to us;
               - with no owner: the first slot to reach DT_ELECT_MIN_SWAPS swaps
                 wins (the continuously rendering thread, not the bursty HWUI
                 RenderThread). If an ImGui world is parked from a dead context,
                 DT_ADOPT_MIN_SWAPS is enough - coming back from the background
                 the new context adopts it almost immediately. */
          static bool ensure_ownership(Slot* s, EGLContext ctx, float sw,
                                       float sh) {
              std::lock_guard<std::mutex> lk(g_slots_mtx);
              if (s->dead) return false;
              s->swaps++;
              long now = now_ms();
              s->last_swap_ms = now;
              Slot* ow = nullptr;
              if (g_owner) {
                  auto it = g_slots.find(g_owner);
                  if (it != g_slots.end() && !it->second->dead) ow = it->second;
              }
              if (ow == s) return true;

              /* r14: never take over a surface far smaller than the menu
                 world. When the owner context died (app menu, dialog,
                 keyboard relayout), the parked ImGui world used to be ADOPTED
                 by the next context to reach 8 swaps - including small popup
                 surfaces, which then rendered the whole menu inside their
                 tiny window ("tapping the app's menu spawns a small clone of
                 our menu"), and the clone ignores taps because the touch map
                 belongs to the main surface. The real surface re-adopts when
                 it returns. */
              if (sw > 0.f && sh > 0.f) {
                  bool ok;
                  if (g_orphan_imgui && g_orphan_dw > 0.f && g_orphan_dh > 0.f) {
                      float pa = g_orphan_dw * g_orphan_dh;
                      ok = (sw * sh) >= pa * 0.5f &&
                           sw >= g_orphan_dw * 0.45f &&
                           sh >= g_orphan_dh * 0.45f;
                  } else {
                      ok = sw >= 220.f && sh >= 220.f;
                  }
                  if (!ok) {
                      if (!s->reject_logged) {
                          s->reject_logged = true;
                          LOGI("[overlay] skip small surface %.0fx%.0f (%s)",
                               sw, sh, g_orphan_imgui ?
                                   "menu parked - not adopting" : "election");
                      }
                      return false;
                  }
              }
              if (ow) {
                  bool stale = (now - ow->last_swap_ms) > DT_OWNER_STALE_MS &&
                               (now - s->last_swap_ms)  < 600;
                  if (!stale) return false;     /* healthy owner elsewhere */
                  g_owner = nullptr;
                  LOGI("[overlay] owner migrated (previous went quiet)");
              }
              if (g_owner == nullptr) {
                  long need = g_orphan_imgui ? DT_ADOPT_MIN_SWAPS : DT_ELECT_MIN_SWAPS;
                  if (s->swaps >= need) {
                      g_owner = ctx;
                      LOGI("[overlay] owner elected after %ld swaps%s",
                           s->swaps, g_orphan_imgui ? " (adopting parked ImGui)" : "");
                      return true;
                  }
              }
              return false;
          }

          static void resolve_font_path() {
              if (g_font_path[0]) return;
              const char* cands[] = {
                  "/system/fonts/Roboto-Regular.ttf",
                  "/system/fonts/NotoSans-Regular.ttf",
                  "/system/fonts/DroidSans.ttf",
                  "/system/fonts/NotoSansCJK-Regular.ttc",
              };
              for (const char* c : cands)
                  if (access(c, R_OK) == 0) {
                      snprintf(g_font_path, sizeof(g_font_path), "%s", c);
                      return;
                  }
          }

          static void build_fonts(ImGuiIO& io) {
              resolve_font_path();
              io.Fonts->Clear();
              bool ok = false;
              if (g_font_path[0]) {
                  ImFontConfig cfg;
                  cfg.SizePixels = g_font_size;
                  ok = io.Fonts->AddFontFromFileTTF(g_font_path, g_font_size,
                                                   nullptr, nullptr) != nullptr;
              }
              if (!ok) io.Fonts->AddFontDefault();
              io.Fonts->Build();
              g_font_dirty = false;
          }

          /* build (or adopt) the ImGui world of a freshly elected slot */
          static void slot_init(EGLDisplay dpy, EGLSurface surf, Slot* s) {
              EGLint w = 1080, h = 1920;
              eglQuerySurface(dpy, surf, EGL_WIDTH,  &w);
              eglQuerySurface(dpy, surf, EGL_HEIGHT, &h);

              const GLubyte* ver = glGetString(GL_VERSION);
              if (!ver || !strstr((const char*)ver, "OpenGL ES")) {
                  LOGE("[overlay] not OpenGL ES: %s", ver ? (const char*)ver : "null");
                  s->failed = true;
                  return;
              }
              s->es3 = strstr((const char*)ver, "OpenGL ES 3") != nullptr;

              if (g_orphan_imgui) {
                  /* adopt the parked world; its backend GL handles are stale, so
                     ShutDown + Init to force CreateDeviceObjects on this context */
                  s->imgui = g_orphan_imgui;
                  g_orphan_imgui = nullptr;
                  g_orphan_dw = 0.f; g_orphan_dh = 0.f;
                  ImGui::SetCurrentContext(s->imgui);
                  ImGui_ImplOpenGL3_Shutdown();   /* GL deletes: no-ops here, the
                                                     names never existed in this
                                                     context; zeroes the handles */
                  LOGI("[overlay] ImGui world adopted after context switch");
              } else {
                  s->imgui = ImGui::CreateContext();
                  ImGui::SetCurrentContext(s->imgui);
                  LOGI("[overlay] GL: %s (%dx%d)", (const char*)ver, w, h);
              }

              ImGuiIO& io   = ImGui::GetIO();
              io.DisplaySize = ImVec2((float)w, (float)h);
              io.DeltaTime   = 1.0f / 60.0f;
              io.IniFilename = nullptr;
              io.ConfigFlags |= ImGuiConfigFlags_NoMouseCursorChange;
              io.ConfigWindowsMoveFromTitleBarOnly = true;  /* touch friendly */
              ImGui::StyleColorsDark();
              ImGui::GetStyle().WindowRounding = 6.0f;
              if (io.Fonts->Fonts.empty() || g_font_dirty) build_fonts(io);
              ImGui_ImplOpenGL3_Init("#version 100");
              s->last_frame_ms = now_ms();
              {
                  std::lock_guard<std::mutex> lk(g_disp_mtx);
                  g_disp_w = (float)w; g_disp_h = (float)h;
              }
              LOGI("[overlay] ImGui up OK (%dx%d, font %.0fpx)", w, h, g_font_size);
          }

          /* eglDestroyContext hook: retire the slot WITH its context. r7 tore the
             whole ImGui world down here, so every activity relayout that recycled
             the GL context (keyboard with adjustResize, app switch, rotation) was
             fatal - the user saw it as "the app closes". r9 parks the owner's
             ImGui world instead and never frees the Slot (graveyard), so an
             in-flight tick just sees dead=true on its next lock. */
          static void slot_destroy(EGLContext ctx) {
              std::lock_guard<std::mutex> lk(g_tick_mtx);
              std::lock_guard<std::mutex> lk2(g_slots_mtx);
              auto it = g_slots.find(ctx);
              if (it == g_slots.end()) return;
              Slot* s = it->second;
              s->dead = true;
              g_slots.erase(it);
              g_graveyard.push_back(s);
              if (g_owner == ctx) {
                  g_owner = nullptr;
                  g_ready.store(false);
                  if (s->imgui) {
                      if (g_orphan_imgui)
                          ImGui::DestroyContext(g_orphan_imgui);  /* keep newest */
                      g_orphan_imgui = s->imgui;
                      s->imgui = nullptr;
                      {
                          std::lock_guard<std::mutex> lk3(g_disp_mtx);
                          g_orphan_dw = g_disp_w;
                          g_orphan_dh = g_disp_h;
                      }
                      if (eglGetCurrentContext() == ctx) {
                          /* only valid while the dying context is still current;
                             otherwise the driver frees everything with the ctx */
                          ImGui::SetCurrentContext(g_orphan_imgui);
                          ImGui_ImplOpenGL3_Shutdown();
                      }
                      LOGI("[overlay] owner context destroyed - ImGui parked, "
                           "waiting for the next GL context");
                  }
              }
          }

          /* HWUI and several driver wrappers abort the whole process on stray GL
             errors (the "glUseProgram -> GL_INVALID_VALUE (0x501)" SIGABRT seen in
             the field), so every binding the ES2 ImGui backend touches goes back
             exactly the way the app had it before the swap continues. */
          static void gl_state_save(Slot* s) {
              GlState& g = s->gl;
              glGetIntegerv(GL_CURRENT_PROGRAM, &g.program);
              glGetIntegerv(GL_ARRAY_BUFFER_BINDING,         &g.ab);
              glGetIntegerv(GL_ELEMENT_ARRAY_BUFFER_BINDING, &g.eb);
              if (s->es3)
                  glGetIntegerv(GL_VERTEX_ARRAY_BINDING, &g.vao);
              glGetIntegerv(GL_FRAMEBUFFER_BINDING, &g.fb);
              glGetIntegerv(GL_ACTIVE_TEXTURE, &g.active_tex);
              glActiveTexture(GL_TEXTURE0);
              glGetIntegerv(GL_TEXTURE_BINDING_2D, &g.tex2d);
              glGetIntegerv(GL_VIEWPORT,    g.viewport);
              glGetIntegerv(GL_SCISSOR_BOX, g.scissor_box);
              g.scissor = glIsEnabled(GL_SCISSOR_TEST);
              g.depth   = glIsEnabled(GL_DEPTH_TEST);
              g.stencil = glIsEnabled(GL_STENCIL_TEST);
              g.blend   = glIsEnabled(GL_BLEND);
              g.cull    = glIsEnabled(GL_CULL_FACE);
              glGetIntegerv(GL_BLEND_SRC_RGB,   &g.blend_src_rgb);
              glGetIntegerv(GL_BLEND_DST_RGB,   &g.blend_dst_rgb);
              glGetIntegerv(GL_BLEND_SRC_ALPHA, &g.blend_src_a);
              glGetIntegerv(GL_BLEND_DST_ALPHA, &g.blend_dst_a);
              glGetIntegerv(GL_BLEND_EQUATION_RGB,   &g.blend_eq_rgb);
              glGetIntegerv(GL_BLEND_EQUATION_ALPHA, &g.blend_eq_a);
          }

          /* r11: eat whatever the draw left in the error queue and make it
             visible in the debug log - some wrappers abort on a stray sticky
             error at their next check. */
          static void gl_drain_errors() {
              GLenum first = GL_NO_ERROR;
              for (int i = 0; i < 12; i++) {
                  GLenum e = glGetError();
                  if (e == GL_NO_ERROR) break;
                  if (first == GL_NO_ERROR) first = e;
              }
              if (first != GL_NO_ERROR)
                  LOGD("[overlay] drained GL error 0x%04x after draw", first);
          }

          static void gl_state_restore(Slot* s) {
              GlState& g = s->gl;
              if (s->es3) glBindVertexArray(g.vao);
              glBindBuffer(GL_ARRAY_BUFFER,         g.ab);
              glBindBuffer(GL_ELEMENT_ARRAY_BUFFER, g.eb);
              glBindFramebuffer(GL_FRAMEBUFFER,     g.fb);
              glActiveTexture(g.active_tex);
              glBindTexture(GL_TEXTURE_2D, g.tex2d);
              glBlendEquationSeparate(g.blend_eq_rgb, g.blend_eq_a);
              glBlendFuncSeparate(g.blend_src_rgb, g.blend_dst_rgb,
                                  g.blend_src_a, g.blend_dst_a);
              if (g.blend)   glEnable(GL_BLEND);        else glDisable(GL_BLEND);
              if (g.scissor) glEnable(GL_SCISSOR_TEST); else glDisable(GL_SCISSOR_TEST);
              if (g.depth)   glEnable(GL_DEPTH_TEST);   else glDisable(GL_DEPTH_TEST);
              if (g.stencil) glEnable(GL_STENCIL_TEST); else glDisable(GL_STENCIL_TEST);
              if (g.cull)    glEnable(GL_CULL_FACE);    else glDisable(GL_CULL_FACE);
              glScissor(g.scissor_box[0], g.scissor_box[1],
                        g.scissor_box[2], g.scissor_box[3]);
              glViewport(g.viewport[0], g.viewport[1],
                         g.viewport[2], g.viewport[3]);
              /* r11: only restore a real program. Apps that never bind one (the
                 sample host just clears) have 0 current; some ES wrappers raise
                 GL_INVALID_VALUE for glUseProgram(0) and the app's next error
                 check aborts. If the app had none bound it will bind its own
                 before drawing, so leaving ours is safe. */
              if (g.program != 0)
                  glUseProgram(g.program);
              gl_drain_errors();
          }

          /* is a display-space point inside one of the published scroll rects? */
          static float region_speed_at(float x, float y) {
              const std::vector<float>& r = g_scroll_regions;
              for (size_t i = 0; i + 4 < r.size(); i += 5) {
                  if (x >= r[i] && x <= r[i] + r[i+2] &&
                      y >= r[i+1] && y <= r[i+1] + r[i+3])
                      return r[i+4];
              }
              return 0.f;
          }

          /* map a raw window position into the overlay surface's coordinate
             space via the measured view rect; falls back to identity. r11 adds
             the manual Y bias on top (Settings). */
          static ImVec2 map_touch(float x, float y, const ImVec2& ds) {
              float mx = x, my = y;
              {
                  std::lock_guard<std::mutex> lk(g_map_mtx);
                  if (g_map.ok && g_map.w > 0 && g_map.h > 0) {
                      /* r12 fix (Y-axis scaling mismatch): sy used to be
                         ds.y / g_map.h, but the view rect is TALLER than the
                         GL surface (window 960 vs surface 832), so the false
                         0.867 scale pulled taps toward the center: taps near
                         the top landed low, taps near the bottom landed high,
                         and only the exact center was right. Y is a pure
                         translation now; the static status-bar offset belongs
                         to the manual Y bias (g_bias_y, "Touch Y offset" in
                         Settings). */
                      float sx = ds.x / g_map.w;
                      float sy = 1.0f;
                      mx = (x - g_map.x) * sx;
                      my = (y - g_map.y) * sy;
                  }
                  my += g_bias_y;
              }
              if (mx < 0.f)   mx = 0.f;
              if (my < 0.f)   my = 0.f;
              if (mx > ds.x)  mx = ds.x;
              if (my > ds.y)  my = ds.y;
              return ImVec2(mx, my);
          }

          static void overlay_tick(EGLDisplay dpy, EGLSurface surf) {
              static thread_local bool in_tick = false;
              if (in_tick) return;   /* driver re-entry (swap->swapWithDamage) */
              in_tick = true;
              struct TickReset { bool& b; ~TickReset() { b = false; } }
                  tick_reset{in_tick};

              EGLContext ctx = eglGetCurrentContext();
              if (ctx == EGL_NO_CONTEXT) return;

              /* r11: surface bookkeeping for EVERY context, before ownership
                 gating. The largest surface on any thread (the HWUI window
                 surface spans the whole window) is the best native estimate of
                 the full window, so the touch-map fallback no longer depends on
                 this thread being the owner. */
              EGLint sw = 0, sh = 0;
              eglQuerySurface(dpy, surf, EGL_WIDTH,  &sw);
              eglQuerySurface(dpy, surf, EGL_HEIGHT, &sh);
              if (sw > 0 && sh > 0) {
                  std::lock_guard<std::mutex> lk(g_disp_mtx);
                  if ((float)sw > g_max_surf_w) g_max_surf_w = (float)sw;
                  if ((float)sh > g_max_surf_h) g_max_surf_h = (float)sh;
                  if (g_disp_w <= 0.f) { g_disp_w = (float)sw; g_disp_h = (float)sh; }
              }

              /* one drawer at a time; also serializes ownership changes, adoption
                 and slot teardown against in-flight frames */
              std::lock_guard<std::mutex> lk(g_tick_mtx);

              Slot* s = slot_for(ctx);
              if (!ensure_ownership(s, ctx, (float)sw, (float)sh)) return;
              if (s->dead || s->failed) return;

              if (!s->imgui) slot_init(dpy, surf, s);
              if (!s->imgui) return;
              ImGui::SetCurrentContext(s->imgui);
              ImGuiIO& io = ImGui::GetIO();
              io.DisplaySize = ImVec2((float)sw, (float)sh);
              {
                  std::lock_guard<std::mutex> lk2(g_disp_mtx);
                  g_disp_w = (float)sw; g_disp_h = (float)sh;
              }
              {
                  long nowt = now_ms();
                  if (s->last_frame_ms > 0) {
                      float dt = (float)(nowt - s->last_frame_ms) / 1000.0f;
                      if (dt < 0.001f) dt = 0.001f;
                      if (dt > 0.05f)  dt = 0.05f;
                      io.DeltaTime = dt;
                  }
                  s->last_frame_ms = nowt;
              }

              /* replay queued touch events as real ImGui events. Drags that
                 start inside a published scroll rect additionally become wheel
                 events, scaled by that rect's speed - this is the touch
                 scrolling of the recorder/monitor/class lists and of the menu
                 itself. (r12: the drawn keyboard is gone; IME text arrives as
                 character events further down.) */
              {
                  std::vector<TouchEvent> q;
                  {
                      std::lock_guard<std::mutex> lk2(g_touch_mtx);
                      q.swap(g_touch_q);
                  }
                  ImVec2 ds = io.DisplaySize;
                  ImVec2 prev(0, 0);
                  bool   have_prev = false;
                  for (const TouchEvent& t : q) {
                      ImVec2 p = map_touch(t.x, t.y, ds);
                      io.AddMousePosEvent(p.x, p.y);
                      if (t.phase == 0) io.AddMouseButtonEvent(0, true);
                      if (t.phase == 1) io.AddMouseButtonEvent(0, false);
                      if (t.phase == 2) {
                          io.AddMouseButtonEvent(0, true);
                          if (have_prev) {
                              float sp = region_speed_at(prev.x, prev.y);
                              if (sp > 0.f) {
                                  float wy = (p.y - prev.y) * sp;
                                  if (wy >  400.f) wy =  400.f;
                                  if (wy < -400.f) wy = -400.f;
                                  if (fabsf(wy) > 2.f) io.AddMouseWheelEvent(0.f, -wy);
                              }
                          }
                      }
                      prev = p;
                      have_prev = true;
                  }
              }

              {
                  std::lock_guard<std::mutex> lk2(g_char_mtx);
                  for (unsigned cp : g_pending_chars) io.AddInputCharacter(cp);
                  g_pending_chars.clear();
                  if (g_pending_bs) {
                      io.AddKeyEvent(ImGuiKey_Backspace, true);
                      io.AddKeyEvent(ImGuiKey_Backspace, false);
                      g_pending_bs = false;
                  }
              }

              menu_init_once();
              maybe_estimate_map();     /* native fallback until the agent measures */
              if (g_font_dirty) {
                  build_fonts(io);
                  /* drop the GL font texture so NewFrame re-uploads it at the
                     new size; the current context is ours and live right here */
                  ImGui_ImplOpenGL3_DestroyDeviceObjects();
              }

              gl_state_save(s);
              glBindFramebuffer(GL_FRAMEBUFFER, 0);
              /* the ES2 backend relies on GL_SCISSOR_TEST for clipping; the app
                 may leave it disabled. Enable it for our draw - restore puts the
                 app's state back afterwards. */
              glEnable(GL_SCISSOR_TEST);
              ImGui_ImplOpenGL3_NewFrame();
              ImGui::NewFrame();
              menu_draw();
              g_want_mouse.store(io.WantCaptureMouse);
              ImGui::Render();
              ImGui_ImplOpenGL3_RenderDrawData(ImGui::GetDrawData());
              gl_state_restore(s);
              g_ready.store(true);
          }

          static EGLBoolean my_destroy_ctx(EGLDisplay dpy, EGLContext ctx) {
              slot_destroy(ctx);
              return g_orig_destroy_ctx ? g_orig_destroy_ctx(dpy, ctx) : EGL_TRUE;
          }

          static EGLBoolean my_terminate(EGLDisplay dpy) {
              /* r11: terminating a display invalidates every context of that
                 display. Retire all slots now; otherwise the next eglCreateContext
                 can land at a recycled address whose stale slot would draw with
                 GL handles that are invalid in the new context (the
                 glUseProgram GL_INVALID_VALUE 0x501 abort class). */
              {
                  std::lock_guard<std::mutex> lk(g_tick_mtx);
                  std::lock_guard<std::mutex> lk2(g_slots_mtx);
                  ImGuiContext* park = nullptr;
                  bool had_owner = false;
                  for (auto& kv : g_slots) {
                      Slot* s = kv.second;
                      s->dead = true;
                      g_graveyard.push_back(s);
                      if (g_owner == kv.first) {
                          had_owner = true;
                          if (s->imgui) {
                              if (park) ImGui::DestroyContext(park);
                              park = s->imgui;
                              s->imgui = nullptr;
                          }
                      } else if (s->imgui) {
                          ImGui::DestroyContext(s->imgui);
                          s->imgui = nullptr;
                      }
                  }
                  g_slots.clear();
                  if (had_owner) {
                      g_owner = nullptr;
                      g_ready.store(false);
                      if (park) {
                          if (g_orphan_imgui)
                              ImGui::DestroyContext(g_orphan_imgui);  /* keep newest */
                          g_orphan_imgui = park;
                          {
                              std::lock_guard<std::mutex> lk3(g_disp_mtx);
                              g_orphan_dw = g_disp_w;
                              g_orphan_dh = g_disp_h;
                          }
                          LOGI("[overlay] display terminated - ImGui parked, "
                               "waiting for the next GL context");
                      }
                  }
              }
              return g_orig_terminate ? g_orig_terminate(dpy) : EGL_TRUE;
          }

          static EGLBoolean my_swap(EGLDisplay dpy, EGLSurface surf) {
              overlay_tick(dpy, surf);
              return g_orig_swap ? g_orig_swap(dpy, surf) : EGL_FALSE;
          }

          static EGLBoolean my_swap_dmg(EGLDisplay dpy, EGLSurface surf,
                                        EGLint* rects, EGLint n) {
              overlay_tick(dpy, surf);
              return g_orig_swap_dmg ? g_orig_swap_dmg(dpy, surf, rects, n)
                                     : EGL_FALSE;
          }

          bool install_swap_hook() {
              void* egl = dlopen("libEGL.so", RTLD_NOW);
              if (!egl) { LOGE("dlopen libEGL.so: %s", dlerror()); return false; }
              bool ok = false;
              void* sym = dlsym(egl, "eglSwapBuffers");
              if (sym) {
                  int r = DobbyHook(sym,
                      reinterpret_cast<dobby_dummy_func_t>(my_swap),
                      reinterpret_cast<dobby_dummy_func_t*>(&g_orig_swap));
                  if (r == 0) { LOGI("eglSwapBuffers hooked OK"); ok = true; }
                  else LOGE("DobbyHook eglSwapBuffers: %d", r);
              }
              void* sym_dmg = dlsym(egl, "eglSwapBuffersWithDamageKHR");
              if (!sym_dmg) {
                  typedef void* (*PFN)(const char*);
                  PFN gpa = (PFN)dlsym(egl, "eglGetProcAddress");
                  if (gpa) {
                      sym_dmg = gpa("eglSwapBuffersWithDamageKHR");
                      if (!sym_dmg) sym_dmg = gpa("eglSwapBuffersWithDamageEXT");
                  }
              }
              if (sym_dmg) {
                  int r = DobbyHook(sym_dmg,
                      reinterpret_cast<dobby_dummy_func_t>(my_swap_dmg),
                      reinterpret_cast<dobby_dummy_func_t*>(&g_orig_swap_dmg));
                  if (r == 0) LOGI("eglSwapBuffersWithDamageKHR hooked OK");
                  else        LOGE("DobbyHook eglSwapBuffersWithDamageKHR: %d", r);
              }
              void* sym_dc = dlsym(egl, "eglDestroyContext");
              if (sym_dc) {
                  int r = DobbyHook(sym_dc,
                      reinterpret_cast<dobby_dummy_func_t>(my_destroy_ctx),
                      reinterpret_cast<dobby_dummy_func_t*>(&g_orig_destroy_ctx));
                  if (r == 0) LOGI("eglDestroyContext hooked OK");
                  else LOGE("DobbyHook eglDestroyContext: %d", r);
              }
              void* sym_term = dlsym(egl, "eglTerminate");
              if (!sym_term) {
                  typedef void* (*PFN)(const char*);
                  PFN gpa = (PFN)dlsym(egl, "eglGetProcAddress");
                  if (gpa) sym_term = gpa("eglTerminate");
              }
              if (sym_term) {
                  int r = DobbyHook(sym_term,
                      reinterpret_cast<dobby_dummy_func_t>(my_terminate),
                      reinterpret_cast<dobby_dummy_func_t*>(&g_orig_terminate));
                  if (r == 0) LOGI("eglTerminate hooked OK (r11)");
                  else LOGE("DobbyHook eglTerminate: %d", r);
              }
              return ok;
          }
          DXTOVLC

      - name: Generate touch.h and touch.cpp
        run: |
          cat > src/touch.h << 'DXTTHH'
          #pragma once
          void touch_install_hooks();
          DXTTHH
          cat > src/touch.cpp << 'DXTTCH'
          #include "touch.h"
          #include "overlay.h"
          #include "logger.h"
          #include "dobby.h"
          #include <dlfcn.h>
          #include <android/input.h>

          typedef int32_t (*fn_getEvent)(AInputQueue*, AInputEvent**);
          static fn_getEvent g_orig_get = nullptr;

          /* Both input paths (this AInputQueue hook for NativeActivity hosts and
             the Java dispatchTouchEvent hook in agent.js) deliver events in the
             SAME coordinate space: raw window pixels. r7/r8 fed them straight into
             ImGui's DisplaySize, which is the *surface* rect of the GL view - on
             the sample app that surface (540x832) sits inside a taller window
             (540x960), so every tap landed above its target. r9 maps the raw
             coords through the rect the agent measured (dextool_set_touch_map)
             before they reach ImGui; this hook therefore forwards untouched
             window coords and lets overlay.cpp do the mapping. */
          static int32_t my_getEvent(AInputQueue* q, AInputEvent** ev) {
              int32_t rc = g_orig_get(q, ev);
              if (rc >= 0 && ev && *ev) {
                  if (AInputEvent_getType(*ev) == AINPUT_EVENT_TYPE_MOTION) {
                      int32_t act = AMotionEvent_getAction(*ev) & AMOTION_EVENT_ACTION_MASK;
                      float x = AMotionEvent_getX(*ev, 0);
                      float y = AMotionEvent_getY(*ev, 0);
                      int a = 2;                       /* move */
                      if      (act == 0)           a = 0;  /* DOWN */
                      else if (act == 1 || act == 3) a = 1; /* UP / CANCEL */
                      else if (act == 5 || act == 6) a = 2; /* pointer up/down */
                      dextool_on_touch(x, y, a);
                  }
              }
              return rc;
          }

          void touch_install_hooks() {
              void* lib = dlopen("libandroid.so", RTLD_NOW);
              if (!lib) { LOGD("touch: libandroid not found (OK for Java apps)"); return; }
              void* sym = dlsym(lib, "AInputQueue_getEvent");
              if (!sym) { LOGD("touch: AInputQueue_getEvent not found (OK for Java apps)"); return; }
              int r = DobbyHook(sym,
                  reinterpret_cast<dobby_dummy_func_t>(my_getEvent),
                  reinterpret_cast<dobby_dummy_func_t*>(&g_orig_get));
              if (r == 0) LOGI("touch: AInputQueue_getEvent hooked (NativeActivity)");
              else        LOGD("touch: DobbyHook AInputQueue_getEvent: %d", r);
          }
          DXTTCH

      - name: Generate frida_bridge.h
        run: |
          cat > src/frida_bridge.h << 'DXTFBH'
          #pragma once
          #include <jni.h>
          #include <string>
          #include <functional>
          void frida_bridge_start(JavaVM* jvm);
          void frida_post(const std::string& json);
          using MsgCallback = std::function<void(const std::string&)>;
          void frida_set_message_callback(MsgCallback cb);
          DXTFBH

      - name: Generate frida_bridge.cpp
        run: |
          cat > src/frida_bridge.cpp << 'DXTFBC'
          #include "frida_bridge.h"
          #include "logger.h"
          #include "frida-gumjs.h"
          #include "agent_bundle_embed.h"
          #include <mutex>
          #include <string>
          #include <cstdio>
          #include <cstring>

          static GumScriptBackend* g_backend = nullptr;
          static GumScript*        g_script  = nullptr;
          static GMainLoop*        g_loop    = nullptr;
          static GMainContext*     g_ctx     = nullptr;
          static std::mutex        g_pmtx;
          static MsgCallback       g_cb;

          /* GumJS `msg` for send(x) is: {"type":"send","payload":<x>}.
             menu.cpp wants <x> (the agent's own JSON object), not the whole
             envelope, so extract the payload substring. Log every agent
             "error" message verbatim - r6 could never match it because the
             escaping inside the envelope hid the quotes. */
          static std::string extract_payload(const char* msg) {
              if (!msg) return "";
              std::string m(msg);
              size_t p = m.find("\"payload\":");
              if (p == std::string::npos) return "";
              p += 10;   /* "payload": is 10 chars incl. quotes+colon */
              while (p < m.size() && m[p] == ' ') p++;
              /* payload runs to the end of the envelope object */
              size_t e = m.rfind('}');
              if (e == std::string::npos || e < p) return "";
              return m.substr(p, e - p);
          }

          static void on_message(const gchar* msg, GBytes*, gpointer) {
              if (!msg) return;
              std::string pl = extract_payload(msg);
              if (!pl.empty()) {
                  const char* t = strstr(pl.c_str(), "\"type\":\"");
                  if (t) {
                      char tag[72];
                      snprintf(tag, sizeof(tag), "[msg] %.48s", t + 8);
                      char* q = strchr(tag, '"');
                      if (q) *q = '\0';
                      log_debug(tag);
                      if (strncmp(tag, "[msg] error", 11) == 0) {
                          char em[640];
                          snprintf(em, sizeof(em), "[agent error] %.600s\n", pl.c_str());
                          log_crash_raw(em);
                      }
                  }
              }
              MsgCallback local;
              {
                  std::lock_guard<std::mutex> lk(g_pmtx);
                  local = g_cb;
              }
              if (local && !pl.empty()) local(pl);
          }
          void frida_bridge_start(JavaVM*) {
              log_info("[frida_bridge] starting GumJS");
              g_ctx  = g_main_context_new();
              g_loop = g_main_loop_new(g_ctx, FALSE);
              g_main_context_push_thread_default(g_ctx);
              g_backend = gum_script_backend_obtain_qjs();
              if (!g_backend) {
                  log_crash_raw("[frida_bridge] FATAL: no QJS backend\n");
                  return;
              }
              log_info("[frida_bridge] QJS backend obtained");
              GError* err = nullptr;
              g_script = gum_script_backend_create_sync(
                             g_backend, "dextool-agent",
                             g_agent_js, nullptr, nullptr, &err);
              if (!g_script || err) {
                  char m[512];
                  snprintf(m, sizeof(m), "[frida_bridge] create: %s\n",
                           err ? err->message : "(null)");
                  log_crash_raw(m);
                  if (err) g_error_free(err);
                  return;
              }
              log_info("[frida_bridge] script created, loading agent");
              gum_script_set_message_handler(g_script, on_message, nullptr, nullptr);
              gum_script_load_sync(g_script, nullptr);
              log_info("[frida_bridge] agent running");
              g_main_loop_run(g_loop);
              log_info("[frida_bridge] loop exited");
          }

          void frida_post(const std::string& json) {
              if (!g_script) return;
              std::lock_guard<std::mutex> lk(g_pmtx);
              gum_script_post(g_script, json.c_str(), nullptr);
          }

          void frida_set_message_callback(MsgCallback cb) {
              std::lock_guard<std::mutex> lk(g_pmtx);
              g_cb = cb;
          }
          DXTFBC

      - name: Generate smali_runtime.h and smali_runtime.cpp
        run: |
          cat > src/smali_runtime.h << 'DXTSRH'
          #pragma once
          #include <cstdint>
          #include <string>
          #include <vector>
          std::string smali_compile(const std::string& src,
                                    const std::string& class_name,
                                    std::vector<uint8_t>& dex_out);
          DXTSRH
          cat > src/smali_runtime.cpp << 'DXTSRC'
          #include "smali_runtime.h"
          #include "logger.h"
          #include <jni.h>
          #include <android/asset_manager.h>
          #include <android/asset_manager_jni.h>
          #include <vector>
          #include <cstdio>
          #include <cstdint>
          #include <unistd.h>
          #include <sys/stat.h>

          extern JavaVM* g_jvm_global;
          static bool   s_ready    = false;
          static jclass s_main_cls = nullptr;

          static std::string extract_jar(JNIEnv* env) {
              jclass   act = env->FindClass("android/app/ActivityThread");
              jobject  app = env->CallStaticObjectMethod(act,
                  env->GetStaticMethodID(act,"currentApplication","()Landroid/app/Application;"));
              jobject  am  = env->CallObjectMethod(app,
                  env->GetMethodID(env->FindClass("android/content/Context"),
                                   "getAssets","()Landroid/content/res/AssetManager;"));
              jstring  fds = (jstring)env->CallObjectMethod(app,
                  env->GetMethodID(env->FindClass("android/content/Context"),
                                   "getFilesDir","()Ljava/io/File;"));
              fds = (jstring)env->CallObjectMethod(fds,
                  env->GetMethodID(env->FindClass("java/io/File"),
                                   "getAbsolutePath","()Ljava/lang/String;"));
              const char* fdp = env->GetStringUTFChars(fds, nullptr);
              char jar[512];
              snprintf(jar, sizeof(jar), "%s/smali-fat.jar", fdp);
              env->ReleaseStringUTFChars(fds, fdp);
              if (access(jar, F_OK) == 0) return jar;
              AAssetManager* amgr = AAssetManager_fromJava(env, am);
              AAsset* a = AAssetManager_open(amgr, "smali-fat.jar", AASSET_MODE_BUFFER);
              if (!a) return "";
              FILE* f = fopen(jar, "wb");
              if (!f) { AAsset_close(a); return ""; }
              fwrite(AAsset_getBuffer(a), 1, (size_t)AAsset_getLength(a), f);
              fclose(f); AAsset_close(a);
              return std::string(jar);
          }

          static bool ensure_ready(JNIEnv* env) {
              if (s_ready) return true;
              std::string jar = extract_jar(env);
              if (jar.empty()) return false;
              jclass cl = env->FindClass("java/lang/ClassLoader");
              jobject sc = env->CallStaticObjectMethod(cl,
                  env->GetStaticMethodID(cl,"getSystemClassLoader","()Ljava/lang/ClassLoader;"));
              jclass dcl = env->FindClass("dalvik/system/PathClassLoader");
              jstring js = env->NewStringUTF(jar.c_str());
              jobject lo = env->NewObject(dcl,
                  env->GetMethodID(dcl,"<init>",
                      "(Ljava/lang/String;Ljava/lang/ClassLoader;)V"),js,sc);
              if (!lo) return false;
              jstring cn = env->NewStringUTF("com.android.tools.smali.smali.Main");
              s_main_cls = (jclass)env->CallObjectMethod(lo,
                  env->GetMethodID(cl,"loadClass","(Ljava/lang/String;)Ljava/lang/Class;"),cn);
              if (!s_main_cls||env->ExceptionCheck()){env->ExceptionClear();return false;}
              s_main_cls = (jclass)env->NewGlobalRef(s_main_cls);
              s_ready = true;
              return true;
          }

          std::string smali_compile(const std::string& src, const std::string& cname,
                                    std::vector<uint8_t>& out) {
              JNIEnv* env = nullptr;
              if (!g_jvm_global) return "no JVM";
              g_jvm_global->AttachCurrentThread(&env, nullptr);
              if (!ensure_ready(env)) return "smali not ready";
              char tmp[] = "/data/local/tmp/dxt-XXXXXX";
              if (!mkdtemp(tmp)) return "mkdtemp failed";
              std::string sf = std::string(tmp)+"/"+cname+".smali";
              std::string df = std::string(tmp)+"/out.dex";
              FILE* f = fopen(sf.c_str(),"w");
              if (!f) return "fopen failed";
              fwrite(src.c_str(),1,src.size(),f); fclose(f);
              jclass sc = env->FindClass("java/lang/String");
              jmethodID m = env->GetStaticMethodID(s_main_cls,"main","([Ljava/lang/String;)V");
              if (!m) return "no main method";
              jobjectArray a = env->NewObjectArray(4,sc,nullptr);
              env->SetObjectArrayElement(a,0,env->NewStringUTF("assemble"));
              env->SetObjectArrayElement(a,1,env->NewStringUTF("-o"));
              env->SetObjectArrayElement(a,2,env->NewStringUTF(df.c_str()));
              env->SetObjectArrayElement(a,3,env->NewStringUTF(sf.c_str()));
              env->CallStaticVoidMethod(s_main_cls,m,a);
              if (env->ExceptionCheck()){env->ExceptionClear();return "smali threw";}
              FILE* df2 = fopen(df.c_str(),"rb");
              if (!df2) return "no dex output";
              fseek(df2,0,SEEK_END); long sz=ftell(df2); rewind(df2);
              out.resize((size_t)sz);
              fread(out.data(),1,(size_t)sz,df2); fclose(df2);
              return "";
          }
          DXTSRC

      - name: Generate menu.h
