                      if (ImGui::SmallButton("Remove##tr")) {
                          std::string a = "{\"name\":\"" + jesc(t.name) + "\"}";
                          post_rpc("removeTracker", a);
                          s_trackers.erase(s_trackers.begin() + i);
                          ImGui::PopID(); MULK(); return;
                      }
                  }
                  ImGui::PopID();
              }
              MULK();
