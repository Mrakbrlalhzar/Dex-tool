static void apply_theme() {
    switch (s_theme) {
        case 0: ImGui::StyleColorsDark();    break;
        case 1: ImGui::StyleColorsLight();   break;
        case 2: ImGui::StyleColorsClassic(); break;
    }
    ImGui::GetStyle().Alpha = s_opacity;
}

void menu_init() {
    apply_theme();
    // Set message handler: JS → C++ responses
    frida_set_message_callback([](const std::string& json) {
        log_debug(("[menu] msg: " + json).c_str());
        // Simple output routing: append to script output
        s_script_out += json + "\n";
        // A real implementation would parse JSON and route to correct tab
    });
}

static void draw_settings_tab() {
    ImGui::Text("Settings");
    ImGui::Separator();
    if (ImGui::SliderFloat("Font Size",    &s_font_size,  8.f, 32.f))  {}
    if (ImGui::SliderFloat("Opacity",      &s_opacity,    0.3f, 1.f)) apply_theme();
    if (ImGui::SliderFloat("Scroll Speed", &s_scroll_speed, 0.5f, 5.f)) {}
    const char* themes[] = {"Dark","Light","Classic"};
    if (ImGui::Combo("Theme", &s_theme, themes, 3)) apply_theme();
    ImGui::Checkbox("Show Menu", &s_menu_visible);
}

static void draw_patches_tab() {
