          static std::string jesc(const std::string& s) {
              std::string r;
              r.reserve(s.size() + 8);
              for (size_t i = 0; i < s.size(); i++) {
                  unsigned char c = (unsigned char)s[i];
                  switch (c) {
                      case '"':  r += "\\\""; break;
                      case '\\': r += "\\\\"; break;
                      case '\n': r += "\\n";  break;
                      case '\r': r += "\\r";  break;
                      case '\t': r += "\\t";  break;
                      default:
                          if (c < 0x20) {
                              char b[8];
                              snprintf(b, sizeof(b), "\\u%04x", c);
                              r += b;
                          } else r += (char)c;
                  }
              }
              return r;
          }
          static std::string junesc(const std::string& s) {
              std::string r;
              r.reserve(s.size());
              for (size_t i = 0; i < s.size(); i++) {
                  if (s[i] != '\\' || i + 1 >= s.size()) { r += s[i]; continue; }
                  char n = s[++i];
                  switch (n) {
                      case 'n': r += '\n'; break;
                      case 't': r += '\t'; break;
                      case 'r': r += '\r'; break;
                      case 'b': r += '\b'; break;
                      case 'f': r += '\f'; break;
                      case '"': r += '"';  break;
                      case '\\':r += '\\'; break;
                      case '/': r += '/';  break;
                      case 'u':
                          if (i + 4 < s.size()) {
                              unsigned v = 0;
                              for (int k = 1; k <= 4; k++) {
                                  char h = s[i + k];
                                  v <<= 4;
                                  if (h >= '0' && h <= '9') v |= (unsigned)(h - '0');
                                  else if (h >= 'a' && h <= 'f') v |= (unsigned)(h - 'a' + 10);
                                  else if (h >= 'A' && h <= 'F') v |= (unsigned)(h - 'A' + 10);
                                  else { v = 0xFFFF; break; }
                              }
                              i += 4;
                              if (v < 0x80) r += (char)v;
                              else if (v < 0x800) {
                                  r += (char)(0xC0 | (v >> 6));
                                  r += (char)(0x80 | (v & 0x3F));
                              } else {
                                  r += (char)(0xE0 | (v >> 12));
                                  r += (char)(0x80 | ((v >> 6) & 0x3F));
                                  r += (char)(0x80 | (v & 0x3F));
                              }
                          } else r += n;
                          break;
                      default: r += n; break;
                  }
              }
              return r;
          }
          static std::vector<std::string> jarr(const std::string& j, const char* key) {
              std::vector<std::string> r;
              std::string k = std::string("\"")+key+"\":";
              auto p = j.find(k);
              if (p == std::string::npos) return r;
              p = j.find('[', p + k.size());
              if (p == std::string::npos) return r;
              size_t i = p + 1;
              while (i < j.size()) {
                  while (i < j.size() && (j[i]==' '||j[i]==','||j[i]=='\n')) i++;
                  if (i >= j.size() || j[i] != '"') break;
                  size_t s = ++i;
                  std::string val;
                  while (i < j.size()) {
                      if (j[i] == '\\' && i + 1 < j.size()) { i += 2; continue; }
                      if (j[i] == '"') break;
                      i++;
                  }
                  if (i > s) val = j.substr(s, i - s);
                  r.push_back(junesc(val));
                  i++;                      /* closing quote */
              }
              return r;
          }
          static std::string jstr(const std::string& j, const char* key) {
              std::string k = std::string("\"")+key+"\":\"";
              auto p = j.find(k);
              if (p == std::string::npos) return "";
              p += k.size();
              std::string val;
              size_t i = p;
              while (i < j.size()) {
                  if (j[i] == '\\' && i + 1 < j.size()) { i += 2; continue; }
                  if (j[i] == '"') break;
                  i++;
              }
              if (i > p) val = j.substr(p, i - p);
              return junesc(val);
          }
          static long jnum(const std::string& j, const char* key, long dflt=0) {
              std::string k = std::string("\"")+key+"\":";
              auto p = j.find(k);
              if (p == std::string::npos) return dflt;
              p += k.size();
              while (p < j.size() && j[p]==' ') p++;
              bool neg = false;
              if (p < j.size() && j[p]=='-') { neg = true; p++; }
              long v = 0; bool any=false;
              while (p < j.size() && j[p] >= '0' && j[p] <= '9') {
                  v = v*10 + (j[p]-'0'); p++; any=true;
              }
              return any ? (neg ? -v : v) : dflt;
          }
          static bool jhas(const std::string& j, const char* key) {
              return j.find(std::string("\"") + key + "\":") != std::string::npos;
          }
          static std::string jtype(const std::string& j) {
              const std::string k = "\"type\":\"";
              auto p = j.find(k);
              if (p == std::string::npos) return "";
              p += k.size();
              size_t i = p;
              while (i < j.size() && j[i] != '"') {
                  if (j[i] == '\\' && i + 1 < j.size()) i++;
                  i++;
              }
              return j.substr(p, i - p);
          }
          static std::vector<std::string> jobjarr(const std::string& j,
                                                  const char* key) {
              std::vector<std::string> r;
              std::string k = std::string("\"") + key + "\":[";
              auto p = j.find(k);
              if (p == std::string::npos) return r;
              p += k.size();
              while (p < j.size()) {
                  while (p < j.size() && (j[p] == ' ' || j[p] == ',')) p++;
                  if (p >= j.size() || j[p] != '{') break;
                  size_t s = p;
                  int depth = 0;
                  bool instr = false;
                  while (p < j.size()) {
                      char c = j[p];
                      if (instr) {
                          if (c == '\\') p++;
                          else if (c == '"') instr = false;
                      } else {
                          if (c == '"') instr = true;
                          else if (c == '{') depth++;
                          else if (c == '}') {
                              depth--;
                              if (depth == 0) { p++; break; }
                          }
                      }
                      p++;
                  }
                  r.push_back(j.substr(s, p - s));
              }
              return r;
          }
