# === BRANCH TARGET: dev ===
name: Build Dex-tool

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: "${{ !contains(github.event.head_commit.message || '', '[skip ci]') }}"
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    env:
      ANDROID_HOME: "${{ github.workspace }}/android-sdk"
      ANDROID_NDK_ROOT: "${{ github.workspace }}/android-sdk/ndk/25.2.9519653"

    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          token: "${{ secrets.GITHUB_TOKEN }}"
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.email "ci@dextool"
          git config user.name  "Dex-tool CI"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install system packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build python3-pip unzip curl \
            build-essential lib32stdc++6 lib32z1 flex bison

      - name: Setup Android SDK manually
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          wget -q \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
            -O /tmp/cmdtools.zip
          unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
          mv /tmp/cmdtools/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses >/dev/null 2>&1 || true
          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-26" \
            "platforms;android-34" \
            "build-tools;35.0.1" \
            "ndk;25.2.9519653"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools"           >> "$GITHUB_PATH"
          echo "NDK check: $(ls "$ANDROID_NDK_ROOT/build/cmake/")"

      - name: Install Gradle 8.5
        run: |
          wget -q "https://services.gradle.org/distributions/gradle-8.5-bin.zip" \
            -O /tmp/gradle.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.5/bin" >> "$GITHUB_PATH"

      - name: Install meson
        run: pip3 install meson

      - name: Ensure debug keystore exists
        run: |
          mkdir -p ~/.android
          keytool -genkey -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000 2>/dev/null || true

      - name: Cache frida-gum arm64-v8a
        id: cache-frida-arm64
        uses: actions/cache@v4
        with:
          path: deps/frida-gum/arm64-v8a
          key: frida-gum-16.7.19-arm64-v3

      - name: Build frida-gum 16.7.19 arm64-v8a
        if: "${{ steps.cache-frida-arm64.outputs.cache-hit != 'true' }}"
        run: |
          git clone --recurse-submodules --depth 1 --branch 16.7.19 \
            https://github.com/frida/frida-gum.git frida-gum-src
          cd frida-gum-src
          FRIDA_PFX="$GITHUB_WORKSPACE/frida-dist-arm64"
          mkdir -p "$FRIDA_PFX"
          ANDROID_NDK_ROOT="$ANDROID_NDK_ROOT" \
          ./configure \
            --host=android-arm64 \
            --prefix="$FRIDA_PFX" \
            -- \
            -Dgumjs=enabled \
            -Dv8=disabled \
            -Ddatabase=disabled \
            -Dtests=disabled \
            -Dgraft_tool=disabled \
            -Ddevkits=gumjs
          make -j"$(nproc)"
          make install || true
          mkdir -p "$GITHUB_WORKSPACE/deps/frida-gum/arm64-v8a"
          GUMLIB="$(find . "$FRIDA_PFX" -name 'libfrida-gumjs.a' 2>/dev/null | head -1)"
          GUMHDR="$(find . "$FRIDA_PFX" -name 'frida-gumjs.h'   2>/dev/null | head -1)"
          [ -z "$GUMLIB" ] && { echo "ERROR: libfrida-gumjs.a not found"; find . -name "*.a" | head -20; exit 1; }
          [ -z "$GUMHDR" ] && { echo "ERROR: frida-gumjs.h not found"; find . -name "*.h" | head -20; exit 1; }
          cp "$GUMLIB" "$GITHUB_WORKSPACE/deps/frida-gum/arm64-v8a/libfrida-gumjs.a"
          cp "$GUMHDR" "$GITHUB_WORKSPACE/deps/frida-gum/arm64-v8a/frida-gumjs.h"
          ls -lh "$GITHUB_WORKSPACE/deps/frida-gum/arm64-v8a/"

      - name: Cache frida-gum armeabi-v7a
        id: cache-frida-arm
        uses: actions/cache@v4
        with:
          path: deps/frida-gum/armeabi-v7a
          key: frida-gum-16.7.19-armeabi-v7a-v3

      - name: Build frida-gum 16.7.19 armeabi-v7a
        if: "${{ steps.cache-frida-arm.outputs.cache-hit != 'true' }}"
        run: |
          if [ ! -d frida-gum-src ]; then
            git clone --recurse-submodules --depth 1 --branch 16.7.19 \
              https://github.com/frida/frida-gum.git frida-gum-src
          fi
          cd frida-gum-src
          rm -rf build
          FRIDA_PFX="$GITHUB_WORKSPACE/frida-dist-arm"
          mkdir -p "$FRIDA_PFX"
          ANDROID_NDK_ROOT="$ANDROID_NDK_ROOT" \
          ./configure \
            --host=android-arm \
            --prefix="$FRIDA_PFX" \
            -- \
            -Dgumjs=enabled \
            -Dv8=disabled \
            -Ddatabase=disabled \
            -Dtests=disabled \
            -Dgraft_tool=disabled \
            -Ddevkits=gumjs
          make -j"$(nproc)"
          make install || true
          mkdir -p "$GITHUB_WORKSPACE/deps/frida-gum/armeabi-v7a"
          GUMLIB="$(find . "$FRIDA_PFX" -name 'libfrida-gumjs.a' 2>/dev/null | head -1)"
          GUMHDR="$(find . "$FRIDA_PFX" -name 'frida-gumjs.h'   2>/dev/null | head -1)"
          [ -z "$GUMLIB" ] && { echo "ERROR: armeabi-v7a lib not found"; exit 1; }
          cp "$GUMLIB" "$GITHUB_WORKSPACE/deps/frida-gum/armeabi-v7a/libfrida-gumjs.a"
          cp "$GUMHDR" "$GITHUB_WORKSPACE/deps/frida-gum/armeabi-v7a/frida-gumjs.h"
          ls -lh "$GITHUB_WORKSPACE/deps/frida-gum/armeabi-v7a/"

      - name: Cache Dobby
        id: cache-dobby
        uses: actions/cache@v4
        with:
          path: deps/dobby
          key: dobby-lsposed-v2

      - name: Build Dobby for both ABIs
        if: "${{ steps.cache-dobby.outputs.cache-hit != 'true' }}"
        run: |
          git clone --depth 1 https://github.com/LSPosed/Dobby.git dobby-src
          mkdir -p deps/dobby
          cp -r dobby-src/include deps/dobby/
          for ABI in arm64-v8a armeabi-v7a; do
            cmake -S dobby-src -B "dobby-src/build-$ABI" \
              -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI="$ABI" \
              -DANDROID_PLATFORM=android-26 \
              -DCMAKE_BUILD_TYPE=Release \
              -DDOBBY_DEBUG=OFF \
              -DDOBBY_GENERATE_SHARED=OFF \
              -GNinja
            ninja -C "dobby-src/build-$ABI" -j"$(nproc)" dobby
            mkdir -p "deps/dobby/$ABI"
            cp "dobby-src/build-$ABI/libdobby.a" "deps/dobby/$ABI/"
            echo "Dobby $ABI: $(ls -lh deps/dobby/$ABI/libdobby.a)"
          done

      - name: Clone ImGui 1.90.4
        run: |
          git clone --depth 1 --branch v1.90.4 \
            https://github.com/ocornut/imgui.git imgui
          ls imgui/backends/imgui_impl_opengl3.cpp

      - name: Download smali 3.0.7 fat jar
        run: |
          mkdir -p deps/smali
          BASE="https://dl.google.com/dl/android/maven2/com/android/tools/smali"
          SMVER="3.0.7"
          for art in smali smali-dexlib2 smali-util; do
            wget -q "$BASE/$art/$SMVER/$art-$SMVER.jar" -O "deps/smali/$art.jar"
          done
          wget -q \
            "https://repo1.maven.org/maven2/com/beust/jcommander/1.72/jcommander-1.72.jar" \
            -O deps/smali/jcommander.jar
          wget -q \
            "https://repo1.maven.org/maven2/com/google/guava/guava/30.1.1-android/guava-30.1.1-android.jar" \
            -O deps/smali/guava.jar
          MERGE="$(mktemp -d)"
          for j in deps/smali/*.jar; do unzip -nqo "$j" -d "$MERGE" 2>/dev/null || true; done
          jar cf deps/smali/smali-fat.jar -C "$MERGE" .
          ls -lh deps/smali/smali-fat.jar

      - name: Create project directories
        run: |
          mkdir -p src agent \
            sample-app/app/src/main/java/com/dextool/app \
            sample-app/app/src/main/assets \
            sample-app/app/src/main/res/values \
            sample-app/app/src/main/jniLibs/arm64-v8a \
            sample-app/app/src/main/jniLibs/armeabi-v7a \
            out/lib/arm64-v8a out/lib/armeabi-v7a \
            .github/workflows

      - name: Generate CMakeLists.txt
        run: |
          cat > CMakeLists.txt << 'DXTCMK'
          cmake_minimum_required(VERSION 3.22)
          project(dextool CXX C)
          set(CMAKE_CXX_STANDARD 17)
          set(CMAKE_C_STANDARD 11)
          
          set(FRIDA_GUM_DIR "${CMAKE_SOURCE_DIR}/deps/frida-gum/${ANDROID_ABI}")
          add_library(frida-gumjs STATIC IMPORTED)
          set_target_properties(frida-gumjs PROPERTIES
              IMPORTED_LOCATION "${FRIDA_GUM_DIR}/libfrida-gumjs.a")
          
          set(DOBBY_DIR "${CMAKE_SOURCE_DIR}/deps/dobby")
          add_library(dobby_static STATIC IMPORTED)
          set_target_properties(dobby_static PROPERTIES
              IMPORTED_LOCATION "${DOBBY_DIR}/${ANDROID_ABI}/libdobby.a")
          
          find_library(lib_egl     EGL)
          find_library(lib_gles2   GLESv2)
          find_library(lib_log     log)
          find_library(lib_dl      dl)
          find_library(lib_android android)
          
          set(IMGUI_DIR "${CMAKE_SOURCE_DIR}/imgui")
          set(IMGUI_SRC
              ${IMGUI_DIR}/imgui.cpp
              ${IMGUI_DIR}/imgui_draw.cpp
              ${IMGUI_DIR}/imgui_tables.cpp
              ${IMGUI_DIR}/imgui_widgets.cpp
              ${IMGUI_DIR}/backends/imgui_impl_opengl3.cpp)
          
          add_library(tool SHARED
              src/main.cpp
              src/logger.cpp
              src/overlay.cpp
              src/touch.cpp
              src/frida_bridge.cpp
              src/smali_runtime.cpp
              src/menu.cpp
              ${IMGUI_SRC})
          
          target_include_directories(tool PRIVATE
              src/
              ${FRIDA_GUM_DIR}/
              ${DOBBY_DIR}/include/
              ${IMGUI_DIR}/
              ${IMGUI_DIR}/backends/)
          
          target_compile_definitions(tool PRIVATE IMGUI_IMPL_OPENGL_ES2=1)
          
          target_compile_options(tool PRIVATE
              -fvisibility=hidden -ffunction-sections -fdata-sections -O2
              -Wno-unused-variable -Wno-unused-function)
          
          target_link_libraries(tool
              frida-gumjs dobby_static
              ${lib_egl} ${lib_gles2} ${lib_log} ${lib_dl} ${lib_android}
              -lm -Wl,--gc-sections -Wl,--exclude-libs,ALL)
          DXTCMK

      - name: Generate logger.h
        run: |
          cat > src/logger.h << 'DXTLOGH'
          #pragma once
          #include <android/log.h>
          #define DTAG "DexTool"
          #define LOGI(...) __android_log_print(ANDROID_LOG_INFO,  DTAG, __VA_ARGS__)
          #define LOGD(...) __android_log_print(ANDROID_LOG_DEBUG, DTAG, __VA_ARGS__)
          #define LOGE(...) __android_log_print(ANDROID_LOG_ERROR, DTAG, __VA_ARGS__)
          void logger_init(const char* base_dir);
          void log_info(const char* msg);
          void log_debug(const char* msg);
          void log_crash_raw(const char* msg);
          DXTLOGH

      - name: Generate logger.cpp
        run: |
          cat > src/logger.cpp << 'DXTLOGC'
          #include "logger.h"
          #include <cstdio>
          #include <cstring>
          #include <cstdint>
          #include <ctime>
          #include <fcntl.h>
          #include <unistd.h>
          #include <sys/stat.h>
          #include <signal.h>
          #include <ucontext.h>
          #include <pthread.h>
          
          static FILE* g_info_fp  = nullptr;
          static FILE* g_debug_fp = nullptr;
          static int   g_crash_fd = -1;
          static pthread_mutex_t g_mtx = PTHREAD_MUTEX_INITIALIZER;
          static char g_altstack[65536];
          
          static void ts(char* buf, size_t n) {
              time_t t = time(nullptr);
              struct tm tm;
              localtime_r(&t, &tm);
              snprintf(buf, n, "%04d-%02d-%02d %02d:%02d:%02d",
                       tm.tm_year+1900, tm.tm_mon+1, tm.tm_mday,
                       tm.tm_hour, tm.tm_min, tm.tm_sec);
          }
          
          static size_t put_hex(char* dst, size_t cap, uintptr_t v) {
              char tmp[20]; int n = 0;
              if (v == 0) tmp[n++] = '0';
              while (v > 0) { tmp[n++] = "0123456789abcdef"[v & 0xf]; v >>= 4; }
              size_t p = 0;
              if (cap < 3) return 0;
              dst[p++] = '0'; dst[p++] = 'x';
              while (n > 0 && p < cap - 1) dst[p++] = tmp[--n];
              dst[p] = 0;
              return p;
          }
          
          static void crash_handler(int sig, siginfo_t* info, void* ucv) {
              char buf[192]; size_t p = 0;
              auto append = [&](const char* s) {
                  while (*s && p < sizeof(buf) - 1) buf[p++] = *s++;
              };
              append("CRASH sig=");
              if (sig >= 10) buf[p++] = '0' + ((sig / 10) % 10);
              buf[p++] = '0' + (sig % 10);
              append(" addr=");
              char hx[24];
              put_hex(hx, sizeof(hx), (uintptr_t)info->si_addr);
              append(hx);
              append(" pc=");
              uintptr_t pc = 0;
          #if defined(__aarch64__)
              if (ucv) pc = (uintptr_t)((ucontext_t*)ucv)->uc_mcontext.pc;
          #elif defined(__arm__)
              if (ucv) pc = (uintptr_t)((ucontext_t*)ucv)->uc_mcontext.arm_pc;
          #endif
              put_hex(hx, sizeof(hx), pc);
              append(hx);
              buf[p++] = '\n';
              if (g_crash_fd >= 0) write(g_crash_fd, buf, p);
              _exit(128 + sig);
          }
          
          void logger_init(const char* base_dir) {
              mkdir(base_dir, 0755);
              char p[640];
              snprintf(p, sizeof(p), "%s/dextool.log",      base_dir);
              g_info_fp  = fopen(p, "a");
              snprintf(p, sizeof(p), "%s/dextool-debug.log", base_dir);
              g_debug_fp = fopen(p, "a");
              snprintf(p, sizeof(p), "%s/dextool-crash.log", base_dir);
              g_crash_fd = open(p, O_WRONLY|O_CREAT|O_APPEND, 0644);
          
              stack_t ss;
              ss.ss_sp    = g_altstack;
              ss.ss_size  = sizeof(g_altstack);
              ss.ss_flags = 0;
              sigaltstack(&ss, nullptr);
          
              struct sigaction sa;
              memset(&sa, 0, sizeof(sa));
              sa.sa_sigaction = crash_handler;
              sa.sa_flags     = SA_SIGINFO | SA_ONSTACK;
              sigemptyset(&sa.sa_mask);
              sigaction(SIGSEGV, &sa, nullptr);
              sigaction(SIGABRT, &sa, nullptr);
              sigaction(SIGBUS,  &sa, nullptr);
              sigaction(SIGILL,  &sa, nullptr);
              sigaction(SIGFPE,  &sa, nullptr);
              log_info("logger_init done");
          }
          
          void log_info(const char* msg) {
              if (!g_info_fp) return;
              pthread_mutex_lock(&g_mtx);
              char t[32]; ts(t, sizeof(t));
              fprintf(g_info_fp, "[%s][I] %s\n", t, msg);
              fflush(g_info_fp);
              pthread_mutex_unlock(&g_mtx);
          }
          
          void log_debug(const char* msg) {
              if (!g_debug_fp) return;
              pthread_mutex_lock(&g_mtx);
              char t[32]; ts(t, sizeof(t));
              fprintf(g_debug_fp, "[%s][D] %s\n", t, msg);
              fflush(g_debug_fp);
              pthread_mutex_unlock(&g_mtx);
          }
          
          void log_crash_raw(const char* msg) {
              if (g_crash_fd >= 0) write(g_crash_fd, msg, strlen(msg));
          }
          DXTLOGC

      - name: Generate overlay.h
        run: |
          cat > src/overlay.h << 'DXTOVLH'
          #pragma once
          #include <EGL/egl.h>
          #include <jni.h>
          bool install_swap_hook();
          void overlay_set_java_vm(JavaVM* vm);
          void overlay_on_touch(float x, float y, bool pressed);
          
          #ifdef __cplusplus
          extern "C" {
          #endif
          JNIEXPORT void dextool_on_touch(float x, float y, int action);
          JNIEXPORT void dextool_on_key(int keycode, int action);
          JNIEXPORT void dextool_on_text(const char* utf8);
          JNIEXPORT void dextool_on_backspace(void);
          #ifdef __cplusplus
          }
          #endif
          DXTOVLH

      # ─────────────────────────────────────────────────────────────
      # overlay.cpp — fixes:
      #   - message drain via menu_poll_messages (GL thread only touches UI state)
      #   - context change rebuilds ONLY the GL backend (no ImGui destroy)
      #   - context change debounce: new contexts tracked; oscillation detected
      #   - menu_draw null-guard
      # ─────────────────────────────────────────────────────────────
      - name: Generate overlay.cpp
        run: |
          cat > src/overlay.cpp << 'DXTOVLC'
          #include "overlay.h"
          #include "logger.h"
          #include "menu.h"
          #include "frida_bridge.h"
          #include "touch.h"
          #include "imgui.h"
          #include "imgui_impl_opengl3.h"
          #include "dobby.h"
          #include "frida-gumjs.h"
          #include <EGL/egl.h>
          #include <GLES2/gl2.h>
          #include <dlfcn.h>
          #include <cstring>
          #include <pthread.h>
          #include <atomic>
          #include <mutex>
          #include <vector>
          
          typedef EGLBoolean (*fn_swap)(EGLDisplay, EGLSurface);
          typedef EGLBoolean (*fn_swap_dmg)(EGLDisplay, EGLSurface, const EGLint*, EGLint);
          
          static fn_swap        g_orig_swap     = nullptr;
          static fn_swap_dmg    g_orig_swap_khr = nullptr;
          static fn_swap_dmg    g_orig_swap_ext = nullptr;
          static std::atomic<bool> g_gum_inited   {false};
          static std::atomic<bool> g_imgui_up     {false};
          static bool              g_imgui_failed  = false;
          static JavaVM*           g_jvm           = nullptr;
          static EGLContext        g_egl_ctx       = EGL_NO_CONTEXT;
          static std::atomic<bool> g_want_text_last{false};
          
          // Track known EGL contexts so A<->B oscillation doesn't reinit forever.
          static EGLContext g_known_ctx[8]   = {};
          static int        g_known_count    = 0;
          static int        g_reinit_count   = 0;
          
          struct Evt {
              enum Kind { TOUCH, KEY, TEXT, BACKSPACE } kind;
              float x = 0, y = 0;
              bool  pressed = false;
              int   keycode = 0, action = 0;
              char  text[128] = {};
          };
          static std::mutex       g_in_mtx;
          static std::vector<Evt> g_in_q;
          
          static void push_evt(const Evt& e) {
              std::lock_guard<std::mutex> lk(g_in_mtx);
              if (g_in_q.size() > 256) g_in_q.erase(g_in_q.begin());
              g_in_q.push_back(e);
          }
          
          void overlay_set_java_vm(JavaVM* vm) { g_jvm = vm; }
          void overlay_on_touch(float x, float y, bool p) {
              Evt e; e.kind = Evt::TOUCH; e.x = x; e.y = y; e.pressed = p;
              push_evt(e);
          }
          
          extern "C" JNIEXPORT void dextool_on_touch(float x, float y, int action) {
              Evt e; e.kind = Evt::TOUCH; e.x = x; e.y = y;
              e.pressed = (action == 0 || action == 2);
              push_evt(e);
          }
          extern "C" JNIEXPORT void dextool_on_key(int keycode, int action) {
              Evt e; e.kind = Evt::KEY; e.keycode = keycode; e.action = action;
              push_evt(e);
          }
          extern "C" JNIEXPORT void dextool_on_text(const char* utf8) {
              if (!utf8) return;
              Evt e; e.kind = Evt::TEXT;
              strncpy(e.text, utf8, sizeof(e.text) - 1);
              push_evt(e);
          }
          extern "C" JNIEXPORT void dextool_on_backspace(void) {
              Evt e; e.kind = Evt::BACKSPACE;
              push_evt(e);
          }
          
          static void* frida_thread(void*) {
              frida_bridge_start(g_jvm);
              return nullptr;
          }
          
          static void spawn_frida_thread() {
              log_info("[overlay] spawning frida thread (16MB stack)");
              pthread_t ft;
              pthread_attr_t a;
              pthread_attr_init(&a);
              pthread_attr_setdetachstate(&a, PTHREAD_CREATE_DETACHED);
              pthread_attr_setstacksize(&a, 16 * 1024 * 1024);
              int rc = pthread_create(&ft, &a, frida_thread, nullptr);
              pthread_attr_destroy(&a);
              if (rc != 0) {
                  char m[64]; snprintf(m, sizeof(m), "[overlay] pthread_create rc=%d", rc);
                  log_crash_raw(m);
              }
          }
          
          // Full init: called exactly ONCE per process.
          static void imgui_full_init(EGLDisplay dpy, EGLSurface surf) {
              log_info("[overlay] imgui_full_init entry");
              EGLint w = 1080, h = 1920;
              eglQuerySurface(dpy, surf, EGL_WIDTH,  &w);
              eglQuerySurface(dpy, surf, EGL_HEIGHT, &h);
          
              const GLubyte* ver = glGetString(GL_VERSION);
              bool is_es = ver && strstr((const char*)ver, "OpenGL ES");
              if (!is_es) {
                  log_info("[overlay] GL not OpenGL ES, ImGui disabled");
                  g_imgui_failed = true;
                  return;
              }
              ImGui::CreateContext();
              ImGuiIO& io   = ImGui::GetIO();
              io.DisplaySize = ImVec2((float)w, (float)h);
              io.DeltaTime   = 1.0f / 60.0f;
              io.IniFilename = nullptr;
              io.ConfigFlags |= ImGuiConfigFlags_NoMouseCursorChange;
              ImGui::StyleColorsDark();
              ImGui::GetStyle().WindowRounding = 6.0f;
              ImGui_ImplOpenGL3_Init("#version 100");
              menu_init();          // <-- one-time: applies theme only
              g_imgui_up.store(true);
              log_info("[overlay] imgui_full_init done");
          }
          
          // Rebuild GL backend only (context change). Keeps UI state.
          static void imgui_rebuild_backend() {
              log_info("[overlay] imgui_rebuild_backend (GL context changed)");
              ImGui_ImplOpenGL3_Shutdown();
              ImGui_ImplOpenGL3_Init("#version 100");
              g_imgui_up.store(true);
          }
          
          static ImGuiKey map_key(int kc) {
              switch (kc) {
                  case 67:  return ImGuiKey_Backspace;
                  case 66:  return ImGuiKey_Enter;
                  case 4:   return ImGuiKey_Escape;
                  case 19:  return ImGuiKey_UpArrow;
                  case 20:  return ImGuiKey_DownArrow;
                  case 21:  return ImGuiKey_LeftArrow;
                  case 22:  return ImGuiKey_RightArrow;
                  case 61:  return ImGuiKey_Tab;
                  case 112: return ImGuiKey_Delete;
                  case 122: return ImGuiKey_Home;
                  case 123: return ImGuiKey_End;
                  default:  return ImGuiKey_None;
              }
          }
          
          static void drain_input() {
              std::lock_guard<std::mutex> lk(g_in_mtx);
              if (g_in_q.empty()) return;
              ImGuiIO& io = ImGui::GetIO();
              for (const auto& e : g_in_q) {
                  switch (e.kind) {
                      case Evt::TOUCH:
                          io.AddMousePosEvent(e.x, e.y);
                          io.AddMouseButtonEvent(0, e.pressed);
                          break;
                      case Evt::KEY: {
                          ImGuiKey k = map_key(e.keycode);
                          if (k != ImGuiKey_None) io.AddKeyEvent(k, e.action == 0);
                          break;
                      }
                      case Evt::TEXT:
                          io.AddInputCharactersUTF8(e.text);
                          break;
                      case Evt::BACKSPACE:
                          io.AddKeyEvent(ImGuiKey_Backspace, true);
                          io.AddKeyEvent(ImGuiKey_Backspace, false);
                          break;
                  }
              }
              g_in_q.clear();
          }
          
          static bool is_known_ctx(EGLContext ctx) {
              for (int i = 0; i < g_known_count; i++)
                  if (g_known_ctx[i] == ctx) return true;
              return false;
          }
          static void remember_ctx(EGLContext ctx) {
              if (g_known_count < 8) g_known_ctx[g_known_count++] = ctx;
          }
          
          static void render_frame(EGLDisplay dpy, EGLSurface surf) {
              EGLContext cur_ctx = eglGetCurrentContext();
          
              if (!g_gum_inited.exchange(true)) {
                  // ── First swap ─────────────────────────────────────────
                  g_egl_ctx = cur_ctx;
                  if (cur_ctx != EGL_NO_CONTEXT) remember_ctx(cur_ctx);
                  log_info("[overlay] first swap: gum_init_embedded");
                  gum_init_embedded();
                  log_info("[overlay] gum_init_embedded done");
                  touch_install_hooks();
                  imgui_full_init(dpy, surf);
                  spawn_frida_thread();
                  log_info("[overlay] first-frame setup complete");
          
              } else if (cur_ctx != EGL_NO_CONTEXT && cur_ctx != g_egl_ctx) {
                  // ── Context changed ───────────────────────────────────
                  if (!is_known_ctx(cur_ctx)) {
                      remember_ctx(cur_ctx);
                      g_egl_ctx = cur_ctx;
                      if (g_reinit_count++ < 8) imgui_rebuild_backend();
                      else log_info("[overlay] too many reinits, keeping current state");
                  } else {
                      // Oscillation between known contexts: rebuild once, then
                      // stop (dropping ImGui GL objects for that ctx is fine).
                      g_egl_ctx = cur_ctx;
                      if (g_reinit_count++ < 8) imgui_rebuild_backend();
                  }
              }
          
              if (!g_imgui_up.load() || g_imgui_failed) return;
              if (!ImGui::GetCurrentContext()) return;
          
              menu_poll_messages();   // <-- drain frida msgs on GL thread
              drain_input();
              ImGui_ImplOpenGL3_NewFrame();
              ImGui::NewFrame();
              menu_draw();
              ImGui::Render();
              ImGui_ImplOpenGL3_RenderDrawData(ImGui::GetDrawData());
          
              bool want = ImGui::GetIO().WantTextInput;
              if (want != g_want_text_last.load()) {
                  g_want_text_last.store(want);
                  frida_post(want
                      ? "{\"type\":\"keyboard\",\"show\":true}"
                      : "{\"type\":\"keyboard\",\"show\":false}");
              }
          }
          
          static EGLBoolean my_swap(EGLDisplay dpy, EGLSurface surf) {
              render_frame(dpy, surf);
              return g_orig_swap(dpy, surf);
          }
          static EGLBoolean my_swap_khr(EGLDisplay dpy, EGLSurface surf,
                                        const EGLint* rects, EGLint n) {
              render_frame(dpy, surf);
              if (g_orig_swap_khr) return g_orig_swap_khr(dpy, surf, rects, n);
              if (g_orig_swap)     return g_orig_swap(dpy, surf);
              return EGL_FALSE;
          }
          static EGLBoolean my_swap_ext(EGLDisplay dpy, EGLSurface surf,
                                        const EGLint* rects, EGLint n) {
              render_frame(dpy, surf);
              if (g_orig_swap_ext) return g_orig_swap_ext(dpy, surf, rects, n);
              if (g_orig_swap_khr) return g_orig_swap_khr(dpy, surf, rects, n);
              if (g_orig_swap)     return g_orig_swap(dpy, surf);
              return EGL_FALSE;
          }
          
          bool install_swap_hook() {
              void* egl = dlopen("libEGL.so", RTLD_NOW);
              if (!egl) { LOGE("dlopen libEGL.so: %s", dlerror()); return false; }
              int hooked = 0;
              void* s1 = dlsym(egl, "eglSwapBuffers");
              if (s1 && DobbyHook(s1,
                      reinterpret_cast<dobby_dummy_func_t>(my_swap),
                      reinterpret_cast<dobby_dummy_func_t*>(&g_orig_swap)) == 0) {
                  LOGI("eglSwapBuffers hooked"); hooked++;
              }
              void* s2 = dlsym(egl, "eglSwapBuffersWithDamageKHR");
              if (s2 && DobbyHook(s2,
                      reinterpret_cast<dobby_dummy_func_t>(my_swap_khr),
                      reinterpret_cast<dobby_dummy_func_t*>(&g_orig_swap_khr)) == 0) {
                  LOGI("eglSwapBuffersWithDamageKHR hooked"); hooked++;
              }
              void* s3 = dlsym(egl, "eglSwapBuffersWithDamageEXT");
              if (s3 && DobbyHook(s3,
                      reinterpret_cast<dobby_dummy_func_t>(my_swap_ext),
                      reinterpret_cast<dobby_dummy_func_t*>(&g_orig_swap_ext)) == 0) {
                  LOGI("eglSwapBuffersWithDamageEXT hooked"); hooked++;
              }
              return hooked > 0;
          }
          DXTOVLC

