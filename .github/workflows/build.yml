          /* ===================== Classes =====================
             r26 restructure: the Classes MAIN tab hosts the secondary bar
             (opened-class tabs + the "+" button); search moved into the Class
             Explorer windows; class content moved into floating Inspector
             windows. */
          /* deferred "Open in new window": pushing into s_classes while the
             window loop holds references would REALLOCATE the vector under
             them - the duplicate is created after the loop instead */
          static std::string s_dup_req;

          static void run_search(const char* text, int mode, bool cs) {
              MLK();
              snprintf(s_search, sizeof(s_search), "%s", text);
              s_search_mode = mode;
              s_search_cs   = cs;
              s_search_wait = true;
              int sqid = ++s_search_seq;
              s_search_qid   = sqid;     /* r23: generation armed at SEND time */
              s_search_page0 = false;
              MULK();
              std::string a = "{\"filter\":\"" + jesc(s_search)
                             + "\",\"qid\":" + std::to_string(sqid)
                             + ",\"mode\":" + std::to_string(mode)
                             + ",\"sys\":" + (s_search_sys ? "true" : "false")
                             + ",\"cs\":" + (cs ? "true" : "false") + "}";
              post_rpc("listLoadedClasses", a);
          }

          /* ---- Instances (receiver picker + live field editor) ---- */
          static void inst_view(ClassTab& c) {
              if (ImGui::Button("Find instances##fi")) {
                  std::string a = "{\"class\":\"" + jesc(c.cname) + "\"}";
                  post_rpc("listInstances", a);
              }
              if (c.instances.empty()) {
                  ImGui::TextDisabled("no instances loaded - tap Find instances");
              }
              for (int i = 0; i < (int)c.instances.size(); i++) {
                  ImGui::PushID(i);
                  bool sel = (c.sel_inst == i);
                  char lbl[256];
                  snprintf(lbl, sizeof(lbl), "#%d %s", i,
                           c.instances[i].str.c_str());
                  if (ImGui::Selectable(lbl, sel)) c.sel_inst = i;
                  ImGui::PopID();
              }
              if (c.sel_inst >= 0 && c.sel_inst < (int)c.instances.size()) {
                  InstInfo& in = c.instances[c.sel_inst];
                  ImGui::Separator();
                  ImGui::Text("fields of #%d:", c.sel_inst);
                  /* edit buffers are (re)filled only when a different instance
                     is picked, not every frame - otherwise the user's typing
                     would be overwritten before it ever reaches the agent.
                     r23: the key used to be the BARE index - picking instance
                     0 of another class kept the stale text of the previous
                     class (nv_for still matched). The key is class + list
                     generation + index now. */
                  static char        nv[32][128];
                  static std::string nv_key;
                  static int         nv_idx = -1;
                  {
                      std::string key = c.cname + "#" + std::to_string(c.gen);
                      if (key != nv_key || nv_idx != c.sel_inst) {
                          nv_key = key;
                          nv_idx = c.sel_inst;
                          for (int f = 0; f < 32; f++) {
                              nv[f][0] = 0;
                              if (f < (int)in.fields.size())
                                  snprintf(nv[f], sizeof(nv[f]), "%s",
                                           in.fields[f].value.c_str());
                          }
                      }
                  }
                  for (int f = 0; f < (int)in.fields.size() && f < 32; f++) {
                      FieldInfo& fi = in.fields[f];
                      ImGui::PushID(1000 + f);
                      ImGui::Text("%s (%s)", fi.name.c_str(), fi.type.c_str());
                      ImGui::SameLine();
                      if (ImGui::SmallButton("Track##ft")) {
                          std::string a = "{\"class\":\"" + jesc(c.cname)
                                        + "\",\"field\":\"" + jesc(fi.name) + "\"}";
                          post_rpc("trackField", a);
                          MLK();
                          s_trackers.push_back({c.cname + "." + fi.name, true, {}});
                          MULK();
                      }
                      ImGui::Text("  value:");
                      ImGui::SameLine();
                      ImGui::SetNextItemWidth(140);
                      ime_textfield("##fv", nv[f], sizeof(nv[f]));   /* r15: IME-aware wrapper */
                      ImGui::SameLine();
                      if (ImGui::Button("Set##fs")) {
                          /* r23: address the instance by the agent's retained
                             handle when one exists - the index-only request
                             had NO receiver, so f.set() failed on every
                             instance field (same fix as callMethod below) */
                          long h = in.handle;
                          std::string a = "{\"class\":\"" + jesc(c.cname)
                                        + "\",\"handle\":" + std::to_string(h)
                                        + ",\"index\":" + std::to_string(c.sel_inst)
                                        + ",\"field\":\"" + jesc(fi.name)
                                        + "\",\"value\":\"" + jesc(nv[f]) + "\"}";
                          post_rpc("setInstanceField", a);
                      }
                      ImGui::PopID();
                  }
              }
          }

          /* ---- Static Fields (field spec: its own section) ----
             The agent marks every field "(static)"/"(instance)" until the
             values are read on demand, so the split is client-side. */
          static void static_fields_view(ClassTab& c) {
              MLK();
              if (ImGui::SmallButton("Read static values"))
                  post_rpc("readStaticFields",
                           "{\"class\":\"" + jesc(c.cname) + "\"}");
              ImGui::SameLine();
              int nst = 0;
              for (auto& f : c.fields)
                  if (f.value != "(instance)") nst++;
              ImGui::TextDisabled("%d static fields", nst);
              ImGui::Separator();
              for (int i = 0; i < (int)c.fields.size(); i++) {
                  FieldInfo& f = c.fields[i];
                  if (f.value == "(instance)") continue;
                  ImGui::PushID(5000 + i);
                  bool hitf = c.hit(c.hits_f, f.name);
                  if (hitf) ImGui::PushStyleColor(ImGuiCol_Text,
                             ImVec4(0.25f, 0.95f, 0.35f, 1.f));
                  ImGui::BulletText("%s : %s = %s", f.name.c_str(),
                                    f.type.c_str(), f.value.c_str());
                  if (hitf) ImGui::PopStyleColor();
                  ImGui::SameLine();
                  if (ImGui::SmallButton("Patch##fp")) {
                      snprintf(s_pcls, sizeof(s_pcls), "%s", c.cname.c_str());
                      snprintf(s_pfld, sizeof(s_pfld), "%s", f.name.c_str());
                      snprintf(s_pval, sizeof(s_pval), "%s", f.value.c_str());
                      s_next_tab = "Patches";
                  }
                  ImGui::SameLine();
                  if (ImGui::SmallButton("Track##ftf")) {
                      std::string a = "{\"class\":\"" + jesc(c.cname)
                                    + "\",\"field\":\"" + jesc(f.name) + "\"}";
                      post_rpc("trackField", a);
                      s_trackers.push_back({c.cname + "." + f.name, true, {}});
                  }
                  ImGui::PopID();
              }
              MULK();
          }

          /* ---- Fields (all fields, the spec's plain "Fields List") ---- */
          static void fields_view(ClassTab& c) {
              MLK();
              ImGui::TextDisabled("%lu fields (static values: Static Fields tab)",
                                  (unsigned long)c.fields.size());
              for (int i = 0; i < (int)c.fields.size(); i++) {
                  FieldInfo& f = c.fields[i];
                  ImGui::PushID(6000 + i);
                  bool hitf = c.hit(c.hits_f, f.name);
                  if (hitf) ImGui::PushStyleColor(ImGuiCol_Text,
                             ImVec4(0.25f, 0.95f, 0.35f, 1.f));
                  ImGui::BulletText("%s : %s", f.name.c_str(), f.type.c_str());
                  if (hitf) ImGui::PopStyleColor();
                  ImGui::SameLine();
                  if (ImGui::SmallButton("Patch##fp2")) {
                      snprintf(s_pcls, sizeof(s_pcls), "%s", c.cname.c_str());
                      snprintf(s_pfld, sizeof(s_pfld), "%s", f.name.c_str());
                      snprintf(s_pval, sizeof(s_pval), "%s", f.value.c_str());
                      s_next_tab = "Patches";
                  }
                  ImGui::SameLine();
                  if (ImGui::SmallButton("Track##ftf2")) {
                      std::string a = "{\"class\":\"" + jesc(c.cname)
                                    + "\",\"field\":\"" + jesc(f.name) + "\"}";
                      post_rpc("trackField", a);
                      s_trackers.push_back({c.cname + "." + f.name, true, {}});
                  }
                  ImGui::PopID();
              }
              MULK();
          }

          /* ---- expanded-method sub-tabs (field spec: Caller / Patcher /
             Tracer / Hooker) ---- */
          static void caller_tab(ClassTab& c, const MethodSig& m) {
              std::vector<std::string> ps = split_params(m.params);
              int na = (int)ps.size();
              if (na > 8) na = 8;
              for (int k = 0; k < na; k++) {
                  ImGui::PushID(2000 + k);
                  bool prim = is_prim_type(ps[k]);
                  char lb[96];
                  snprintf(lb, sizeof(lb), "arg%d (%s)", k, ps[k].c_str());
                  if (prim) {
                      ImGui::SetNextItemWidth(210);
                      ime_textfield(lb, c.call_args[k], sizeof(c.call_args[k]));
                  } else {
                      /* field spec: object parameters get a dropdown that opens
                         the Object Finder for the PARAMETER's class */
                      ImGui::Text("%s", lb);
                      ImGui::SetNextItemWidth(-52.f);
                      ime_textfield("##co", c.call_args[k], sizeof(c.call_args[k]));
                      ImGui::SameLine();
                      if (ImGui::SmallButton("Find...")) {
                          snprintf(s_of.cls, sizeof(s_of.cls), "%s", ps[k].c_str());
                          snprintf(s_of.typ, sizeof(s_of.typ), "%s", ps[k].c_str());
                          s_of.ctx_uid = c.uid;
                          s_of.ctx_arg = k;
                          s_of.open    = true;
                          s_of.results.clear();
                          s_of.waiting  = false;
                          s_of.creating = false;
                      }
                  }
                  ImGui::PopID();
              }
              if (c.sel_inst >= 0 && c.sel_inst < (int)c.instances.size())
                  ImGui::TextDisabled("receiver: instance #%d", c.sel_inst);
              else
                  ImGui::TextDisabled("instance methods need a receiver - pick "
                                      "one on the Instances tab or via Inspector");
              ImGui::SetNextItemWidth(130);
              if (ImGui::InputInt("Call count", &c.call_count)) {
                  if (c.call_count < 1)    c.call_count = 1;
                  if (c.call_count > 50)   c.call_count = 50;
              }
              if (ImGui::IsItemHovered())
                  ImGui::SetTooltip("how many times to call with these args; "
                                    "every call is logged below");
              if (ImGui::Button("Call")) {
                  long h = (c.sel_inst >= 0 && c.sel_inst < (int)c.instances.size())
                               ? c.instances[c.sel_inst].handle : -1;
                  std::string a = "{\"class\":\"" + jesc(c.cname)
                                + "\",\"method\":\"" + jesc(m.name)
                                + "\",\"handle\":" + std::to_string(h)
                                + ",\"args\":[";
                  for (int k = 0; k < na; k++) {
                      if (k) a += ",";
                      std::string v = c.call_args[k];
                      if (v.rfind("@handle:", 0) == 0) {
                          long oh = strtol(v.c_str() + 8, nullptr, 10);
                          if (oh > 0) a += "{\"handle\":" + std::to_string(oh) + "}";
                          else        a += "\"" + jesc(v) + "\"";
                      } else {
                          a += "\"" + jesc(v) + "\"";
                      }
                  }
                  a += "],\"count\":" + std::to_string(c.call_count)
                     + ",\"main\":false}";
                  post_rpc("callMethod", a);
                  char note[80];
                  snprintf(note, sizeof(note), "sent %d call(s)...", c.call_count);
                  c.call_log.push_back(note);
              }
              ImGui::SameLine();
              if (ImGui::Button("Call in Main Thread")) {
                  long h = (c.sel_inst >= 0 && c.sel_inst < (int)c.instances.size())
                               ? c.instances[c.sel_inst].handle : -1;
                  std::string a = "{\"class\":\"" + jesc(c.cname)
                                + "\",\"method\":\"" + jesc(m.name)
                                + "\",\"handle\":" + std::to_string(h)
                                + ",\"args\":[";
                  for (int k = 0; k < na; k++) {
                      if (k) a += ",";
                      std::string v = c.call_args[k];
                      if (v.rfind("@handle:", 0) == 0) {
                          long oh = strtol(v.c_str() + 8, nullptr, 10);
                          if (oh > 0) a += "{\"handle\":" + std::to_string(oh) + "}";
                          else        a += "\"" + jesc(v) + "\"";
                      } else {
                          a += "\"" + jesc(v) + "\"";
                      }
                  }
                  a += "],\"count\":" + std::to_string(c.call_count)
                     + ",\"main\":true}";
                  post_rpc("callMethod", a);
                  char note[96];
                  snprintf(note, sizeof(note), "sent %d call(s) on the main thread...",
                           c.call_count);
                  c.call_log.push_back(note);
              }
              if (!c.call_log.empty()) {
                  ImGui::TextDisabled("call results:");
                  ImGui::SameLine();
                  if (ImGui::SmallButton("Clear##clg")) c.call_log.clear();
                  ImGui::BeginChild("calllog", ImVec2(0, 150), true);
                  for (auto& l : c.call_log)
                      ImGui::TextWrapped("%s", l.c_str());
                  /* r24 pattern: auto-scroll INSIDE the child */
                  if (ImGui::GetScrollY() >= ImGui::GetScrollMaxY() - 40)
                      ImGui::SetScrollHereY(1.f);
                  ImGui::EndChild();
                  mark_scroll_item(s_lst_scroll);
              }
          }

          static void patcher_tab(ClassTab& c, const MethodSig& m) {
              ImGui::TextDisabled("Patch NOP: skip the body (auto return value by "
                                  "return type). Redirect: force the return value "
                                  "below on every subsequent call.");
              ImGui::SetNextItemWidth(220);
              ime_textfield("Value##pv26", c.patch_val, sizeof(c.patch_val));
              if (ImGui::Button("Patch NOP")) {
                  std::string a = "{\"class\":\"" + jesc(c.cname)
                                + "\",\"method\":\"" + jesc(m.name)
                                + "\",\"mode\":\"noop\",\"code\":\"\"}";
                  post_rpc("addHook", a);
                  MLK();
                  s_hooks.push_back({c.cname, m.name, 2, "", true, "..."});
                  MULK();
                  c.patch_note = "NOP armed on " + m.name;
              }
              ImGui::SameLine();
              if (ImGui::Button("Redirect") && c.patch_val[0]) {
                  std::string a = "{\"class\":\"" + jesc(c.cname)
                                + "\",\"method\":\"" + jesc(m.name)
                                + "\",\"args\":[],\"ret\":{\"on\":true,\"v\":\""
                                + jesc(c.patch_val) + "\"}}";
                  post_rpc("setMethodIO", a);
                  c.patch_note = "redirect armed -> " + std::string(c.patch_val);
              }
              if (!c.patch_val[0]) {
                  ImGui::SameLine();
                  ImGui::TextDisabled("(enter a value first)");
              }
              ImGui::SameLine();
              if (ImGui::Button("Stop redirect")) {
                  std::string a = "{\"class\":\"" + jesc(c.cname)
                                + "\",\"method\":\"" + jesc(m.name)
                                + "\",\"args\":[],\"ret\":{\"on\":false,\"v\":\"\"}}";
                  post_rpc("setMethodIO", a);
                  c.patch_note = "redirect removed";
              }
              if (!c.patch_note.empty())
                  ImGui::TextColored(ImVec4(0, 1, 0, 1), "%s", c.patch_note.c_str());
              /* r25 live IO editor kept: probe one call, patch the marked rows */
              if (ImGui::CollapsingHeader("Live IO patch (probe)##ioh")) {
                  if (!c.io_open) {
                      if (ImGui::SmallButton("Probe next call values")) {
                          c.io_sig    = m;
                          c.io_wait   = true;
                          c.io_nargs  = 0;
                          c.io_result = "waiting for the next call...";
                          std::string a = "{\"class\":\"" + jesc(c.cname)
                                        + "\",\"method\":\"" + jesc(m.name) + "\"}";
                          post_rpc("getMethodIO", a);
                      }
                  } else {
                      ImGui::TextColored(ImVec4(0, 1, 0, 1), "patch IO %s.%s",
                                         c.cname.c_str(), c.io_sig.name.c_str());
                      ImGui::TextDisabled("P = patch this item; only marked "
                                          "items are changed. Values refresh "
                                          "on the next probed call.");
                      for (int k = 0; k < c.io_nargs && k < 8; k++) {
                          ImGui::PushID(3000 + k);
                          ImGui::Checkbox("##ioe", &c.io_arg_on[k]);
                          ImGui::SameLine();
                          ImGui::Text("arg%d (%s) = %s", k, c.io_arg_typ[k],
                                      c.io_arg_cur[k]);
                          ImGui::SetNextItemWidth(220);
                          ime_textfield("##iov", c.io_arg[k], sizeof(c.io_arg[k]));
                          ImGui::PopID();
                      }
                      ImGui::Checkbox("##ioeR", &c.io_ret_on);
                      ImGui::SameLine();
                      ImGui::Text("ret (%s) = %s", c.io_ret_typ, c.io_ret_cur);
                      ImGui::SetNextItemWidth(220);
                      ime_textfield("##iovR", c.io_ret, sizeof(c.io_ret));
                      if (ImGui::Button("Apply patch")) {
                          std::string a = "{\"class\":\"" + jesc(c.cname)
                                        + "\",\"method\":\"" + jesc(c.io_sig.name)
                                        + "\",\"args\":[";
                          int n = 0;
                          for (int k = 0; k < c.io_nargs && k < 8; k++) {
                              if (!c.io_arg_on[k]) continue;
                              if (n++) a += ",";
                              a += "{\"i\":" + std::to_string(k)
                                 + ",\"v\":\"" + jesc(c.io_arg[k]) + "\"}";
                          }
                          a += "],\"ret\":{";
                          a += std::string("\"on\":") + (c.io_ret_on ? "true" : "false");
                          a += ",\"v\":\"" + jesc(c.io_ret) + "\"}}";
                          post_rpc("setMethodIO", a);
                          c.io_result = "...";
                      }
                      ImGui::SameLine();
                      if (ImGui::Button("Stop patching")) {
                          std::string a = "{\"class\":\"" + jesc(c.cname)
                                        + "\",\"method\":\"" + jesc(c.io_sig.name)
                                        + "\",\"args\":[],\"ret\":{\"on\":false,\"v\":\"\"}}";
                          post_rpc("setMethodIO", a);
                          c.io_result = "patching stopped";
                      }
                      ImGui::SameLine();
                      if (ImGui::Button("Refresh values")) {
                          std::string a = "{\"class\":\"" + jesc(c.cname)
                                        + "\",\"method\":\"" + jesc(c.io_sig.name) + "\"}";
                          post_rpc("getMethodIO", a);
                          c.io_wait = true;
                          c.io_result = "waiting for the next call...";
                      }
                      ImGui::SameLine();
                      if (ImGui::Button("Close##ioc")) c.io_open = false;
                      if (!c.io_result.empty())
                          ImGui::TextWrapped("%s", c.io_result.c_str());
                  }
              }
          }

          static void tracer_tab(ClassTab& c, const MethodSig& m) {
              std::string tname = c.cname + "." + m.name;
              int ti = find_tracker(tname);
              if (ti < 0) {
                  if (ImGui::Button("Track this method")) {
                      std::string a = "{\"class\":\"" + jesc(c.cname)
                                    + "\",\"method\":\"" + jesc(m.name) + "\"}";
                      post_rpc("addTracker", a);
                      MLK();
                      s_trackers.push_back({tname, false, {}});
                      MULK();
                  }
                  ImGui::SameLine();
                  ImGui::TextDisabled("not tracking yet");
              } else {
                  Tracker& t = s_trackers[ti];
                  ImGui::TextDisabled("tracking - %lu events (full log: Trackers)",
                                      (unsigned long)t.log.size());
                  ImGui::BeginChild("texp", ImVec2(0, 160), true);
                  for (auto& r : t.log) {
                      for (auto& cl : r.callers) {
                          if (ImGui::SmallButton(("@ " + cl).c_str()))
                              menu_open_class(cls_of_member(cl));
                      }
                      ImGui::BulletText("args=%s ret=%s%s%s",
                                        r.args.c_str(), r.ret.c_str(),
                                        r.err.empty() ? "" : " ERR=",
                                        r.err.c_str());
                      ImGui::Separator();
                  }
                  ImGui::EndChild();
                  mark_scroll_item(s_lst_scroll);
                  if (ImGui::SmallButton("Remove tracker")) {
                      std::string a = "{\"name\":\"" + jesc(tname) + "\"}";
                      post_rpc("removeTracker", a);
                      s_trackers.erase(s_trackers.begin() + ti);
                  }
              }
          }

          static void hooker_tab(ClassTab& c, const MethodSig& m) {
              const char* modes[] = {"Java(JS)", "Smali", "Nop (auto)"};
              ImGui::Combo("Mode##hx26", &c.hook_mode, modes, 3);
              ime_multiline("Code##hx26", c.hook_code, sizeof(c.hook_code),
                            ImVec2(-1, 90));
              ImGui::TextDisabled("Java: fn(Java,send,console,thiz,args,orig). "
                                  "Smali: body of static hook(Object thiz, Object[] args); "
                                  "p0=thiz p1=args, must return an Object.");
              if (ImGui::Button("Add Hook")) {
                  std::string a = "{\"class\":\"" + jesc(c.cname)
                                + "\",\"method\":\"" + jesc(m.name)
                                + "\",\"mode\":\"" + modes[c.hook_mode]
                                + "\",\"code\":\"" + jesc(c.hook_code) + "\"}";
                  post_rpc("addHook", a);
                  MLK();
                  s_hooks.push_back({c.cname, m.name, c.hook_mode, c.hook_code,
                                     true, "..."});
                  MULK();
              }
              ImGui::SameLine();
              if (ImGui::SmallButton("Method source")) {
                  /* r25 pipeline: the real bytecode into the Hooks tab panel */
                  snprintf(s_hcls, sizeof(s_hcls), "%s", c.cname.c_str());
                  snprintf(s_hmth, sizeof(s_hmth), "%s", m.name.c_str());
                  std::string a = "{\"class\":\"" + jesc(c.cname)
                                + "\",\"method\":\"" + jesc(m.name) + "\"}";
                  post_rpc("getMethodSrc", a);
                  snprintf(s_hsrc_note, sizeof(s_hsrc_note), "disassembling...");
                  s_hsrc_have = false;
                  s_next_tab = "Hooks";
              }
          }

          /* the expanded method body: exactly the 4 sub-tabs of the spec */
          static void method_body(ClassTab& c, const MethodSig& m) {
              ImGui::Indent();
              if (ImGui::BeginTabBar("mexp")) {
                  static const char* msubs[] = {"Caller", "Patcher", "Tracer",
                                                "Hooker"};
                  char tlbl[40];
                  for (int t = 0; t < 4; t++) {
                      snprintf(tlbl, sizeof(tlbl), "%s##mexp%d", msubs[t], t);
                      if (ImGui::BeginTabItem(tlbl)) {
                          c.msub = t;
                          if      (t == 0) caller_tab(c, m);
                          else if (t == 1) patcher_tab(c, m);
                          else if (t == 2) tracer_tab(c, m);
                          else             hooker_tab(c, m);
                          ImGui::EndTabItem();
                      }
                  }
                  ImGui::EndTabBar();
              }
              ImGui::Unindent();
          }

          /* ---- Methods list (tap = expand; right-click / "..." = context
             menu per the field spec) ---- */
          static void methods_view(ClassTab& c) {
              MLK();
              ImGui::BeginChild("clsm", ImVec2(0, 0), true);
              ImGuiListClipper clip;
              clip.Begin((int)c.methods.size());
              while (clip.Step()) {
                  for (int i = clip.DisplayStart; i < clip.DisplayEnd; i++) {
                      MethodSig& m = c.methods[i];
                      ImGui::PushID(i);
                      /* r25: code-text hits are painted green (field spec:
                         "methods or fields that have this string should be
                         marked in green") */
                      bool hitm = c.hit(c.hits_m, m.name);
                      if (hitm) ImGui::PushStyleColor(ImGuiCol_Text,
                                 ImVec4(0.25f, 0.95f, 0.35f, 1.f));
                      bool is_exp = (c.expanded == i);
                      char lbl[512];
                      snprintf(lbl, sizeof(lbl), "%s %s(%s) -> %s",
                               is_exp ? "-" : "+", m.name.c_str(),
                               m.params.c_str(), m.ret.c_str());
                      if (ImGui::Selectable(lbl, is_exp)) {
                          if (c.expanded == i) {
                              c.expanded = -1;
                          } else {
                              c.expanded = i;
                              c.msub = 0;
                              /* fresh Caller state when the method changes */
                              if (c.call_sig.name != m.name ||
                                  c.call_sig.params != m.params) {
                                  c.call_sig = m;
                                  c.call_nargs = 0;
                                  c.call_count = 1;
                                  c.call_log.clear();
                                  for (int k = 0; k < 8; k++) c.call_args[k][0] = 0;
                              }
                          }
                      }
                      if (hitm) ImGui::PopStyleColor();
                      bool rclk = ImGui::IsItemClicked(ImGuiMouseButton_Right);
                      float bx = ImGui::GetCursorPosX() +
                                 ImGui::GetContentRegionAvail().x - 26.f;
                      ImGui::SameLine(bx);
                      bool dot = ImGui::SmallButton("...");
                      if (rclk || dot) ImGui::OpenPopup("mctx");
                      if (ImGui::BeginPopup("mctx")) {
                          if (ImGui::MenuItem("Open in new window")) {
                              /* deferred: pushing into s_classes here would
                                 reallocate the vector this loop is walking */
                              MLK();
                              s_dup_req = c.cname;
                              MULK();
                          }
                          if (ImGui::MenuItem("Full Method View")) {
                              s_fm_cls  = c.cname;
                              s_fm_mth  = m.name;
                              s_fm_open = true;
                              s_fm_have = false;
                              snprintf(s_fm_note, sizeof(s_fm_note),
                                       "disassembling...");
                              std::string a = "{\"class\":\"" + jesc(c.cname)
                                            + "\",\"method\":\"" + jesc(m.name) + "\"}";
                              post_rpc("getMethodSrc", a);
                          }
                          if (ImGui::MenuItem("Copy Method Name"))
                              copy_text("method", m.name);
                          if (ImGui::MenuItem("Copy Class Name"))
                              copy_text("class", c.cname);
                          ImGui::EndPopup();
                      }
                      if (c.expanded == i) method_body(c, m);
                      ImGui::PopID();
                  }
              }
              ImGui::EndChild();
              mark_scroll_item(s_lst_scroll);
              MULK();
          }

          static void tab_classes() {
              /* r12: the full class list loads BY DEFAULT - no "+ search" gate.
                 The agent streams every loaded class in pages of 400; the
                 Explorer's Filter re-queries with a substring. */
              MLK();
              bool agent_ready = s_agent_ready;
              bool need_auto   = !s_cls_auto_done && !s_search_wait &&
                                 s_search_res.empty();
              int  qid         = 0;
              if (agent_ready && need_auto) {
                  s_cls_auto_done = true;
                  s_search_wait   = true;
                  qid = ++s_search_seq;
                  s_search_qid   = qid;      /* r23: generation armed at SEND time */
                  s_search_page0 = false;
              }
              /* r26: the first Explorer window opens by itself so the class
                 list is visible immediately (the r12 default-list behavior) */
              bool want_expl = s_explorers.empty();
              MULK();
              if (want_expl) {
                  ExplorerWin e{};
                  e.id = ++s_expl_seq;
                  s_explorers.push_back(e);
              }
              /* r25: the AUTO default list is always a plain, sorted class
                 listing (mode 0) - a user who left the mode on Code text
                 would otherwise trigger a full dex scan just by opening the
                 tab. The System gate still applies. */
              if (qid)
                  post_rpc("listLoadedClasses",
                           "{\"filter\":\"\",\"qid\":" + std::to_string(qid)
                           + ",\"mode\":0"
                           + ",\"sys\":" + (s_search_sys ? "true" : "false") + "}");

              /* ---- secondary bar: opened classes + "+" (field spec) ---- */
              MLK();
              static int s_cls_cur_uid = -1;
              int active_uid = -1;
              float bh = ImGui::GetFrameHeight();
              float avail = ImGui::GetContentRegionAvail().x;
              ImGui::BeginChild("##clstabs", ImVec2(avail - 46.f, bh), false);
              if (ImGui::BeginTabBar("clsTabs")) {
                  /* r13: unique tab-bar id kept; labels carry ##t<uid> so two
                     windows of the SAME class ("Open in new window") never
                     share an id */
                  for (int i = 0; i < (int)s_classes.size(); i++) {
                      std::string lbl = s_classes[i].cname + "##t"
                                      + std::to_string(s_classes[i].uid);
                      ImGuiTabItemFlags fl = 0;
                      if (s_classes[i].uid == s_cls_cur_uid)
                          fl |= ImGuiTabItemFlags_SetSelected;
                      if (ImGui::BeginTabItem(lbl.c_str(), nullptr, fl)) {
                          active_uid = s_classes[i].uid;
                          ImGui::EndTabItem();
                      }
                  }
                  ImGui::EndTabBar();
              }
              ImGui::EndChild();
              if (active_uid >= 0 && active_uid != s_cls_cur_uid) {
                  /* a tab was clicked -> raise its inspector window */
                  for (auto& c : s_classes)
                      if (c.uid == active_uid) { s_focus_win = win_title(c); break; }
                  s_cls_cur_uid = active_uid;
              }
              MULK();
              ImGui::SameLine(0, 6);
              if (ImGui::Button("+##newexpl", ImVec2(40, bh))) s_expl_req = true;
              if (ImGui::IsItemHovered())
                  ImGui::SetTooltip("open a new Class Explorer window");
              ImGui::Separator();
              if (s_classes.empty())
                  ImGui::TextDisabled("no class windows - pick a class in the "
                                      "Class Explorer (the + button)");
              /* r26: the "+" opens a NEW Explorer window (field spec) */
              if (s_expl_req) {
                  s_expl_req = false;
                  if (s_explorers.size() < 4) {
                      ExplorerWin e{};
                      e.id = ++s_expl_seq;
                      s_explorers.push_back(e);
                      s_focus_expl = e.id;
                  }
              }
          }

          /* ===================== Class Explorer windows (r26) ===================== */
          static void draw_explorer_windows(ImVec2 ds) {
              for (int i = 0; i < (int)s_explorers.size(); ) {
                  ExplorerWin& e = s_explorers[i];
                  bool open = e.open;
                  std::string title = "Class Explorer##" + std::to_string(e.id);
                  if (s_focus_expl == e.id) {
                      ImGui::SetNextWindowFocus();
                      s_focus_expl = 0;
                  }
                  ImGui::SetNextWindowPos(ImVec2(70.f + 30.f * (e.id % 4),
                                                 50.f + 30.f * (e.id % 4)),
                                          ImGuiCond_FirstUseEver);
                  ImGui::SetNextWindowSizeConstraints(ImVec2(320, 240),
                      ImVec2(ds.x * .96f, ds.y * .96f));
                  ImGui::SetNextWindowSize(ImVec2(ds.x * .62f, ds.y * .72f),
                                           ImGuiCond_Once);
                  bool body = ImGui::Begin(title.c_str(), &open,
                                           ImGuiWindowFlags_NoSavedSettings);
                  ImVec2 wp = ImGui::GetWindowPos(), ws = ImGui::GetWindowSize();
                  bool do_search = false;
                  /* r26: the mutex is HELD across the body - the GumJS callback
                     thread can rebuild s_families / s_search_res at ANY moment,
                     and the family dropdown caches const char* INTO those
                     strings (r25 drew its lists under the lock for the same
                     reason). run_search/open_inspector re-lock recursively. */
                  MLK();
                  if (body) {
                      /* the dropdown can be opened before the agent finished
                         streaming - fill families from whatever is buffered */
                      if (s_families.empty() && !s_search_res.empty() &&
                          !s_search_wait) {
                          for (auto& n : s_search_res) {
                              std::string f = family_of(n);
                              if (!f.empty() &&
                                  std::find(s_families.begin(), s_families.end(), f)
                                      == s_families.end())
                                  s_families.push_back(f);
                          }
                          std::sort(s_families.begin(), s_families.end());
                      }
                      std::vector<const char*> famc;
                      for (auto& f : s_families) famc.push_back(f.c_str());
                      int nf = (int)famc.size();
                      /* family row (spec: dropdown left + "All" checkbox) */
                      if (e.family >= nf || e.family < 0) e.family = 0;
                      ImGui::SetNextItemWidth(
                          ImGui::GetContentRegionAvail().x - 90.f);
                      const char* fprev = nf ? famc[e.family]
                                              : "(no classes yet)";
                      if (ImGui::BeginCombo("##fam",
                                            e.all_fam ? "(All families)" : fprev)) {
                          for (int f = 0; f < nf; f++) {
                              bool sel = (!e.all_fam && e.family == f);
                              if (ImGui::Selectable(famc[f], sel)) {
                                  e.family  = f;
                                  e.all_fam = false;
                              }
                          }
                          ImGui::EndCombo();
                      }
                      ImGui::SameLine();
                      ImGui::Checkbox("All", &e.all_fam);
                      /* search row (spec: text input + Filter button). r23:
                         search on Enter / button ONLY - every keystroke used
                         to re-run enumerateLoadedClasses on the agent. */
                      ImGui::PushItemWidth(ImGui::GetContentRegionAvail().x - 84.f);
                      do_search |= ime_textfield("##esearch", e.search,
                                                 sizeof(e.search),
                                                 ImGuiInputTextFlags_EnterReturnsTrue);
                      ImGui::PopItemWidth();
                      ImGui::SameLine();
                      if (ImGui::Button("Filter")) do_search = true;
                      /* options row (spec: pink Options button) */
                      ImGui::PushStyleColor(ImGuiCol_Button,
                                            ImVec4(0.94f, 0.44f, 0.66f, 1.f));
                      ImGui::PushStyleColor(ImGuiCol_ButtonHovered,
                                            ImVec4(0.98f, 0.55f, 0.74f, 1.f));
                      ImGui::PushStyleColor(ImGuiCol_ButtonActive,
                                            ImVec4(0.88f, 0.34f, 0.58f, 1.f));
                      if (ImGui::Button("Options")) ImGui::OpenPopup("explOpts");
                      ImGui::PopStyleColor(3);
                      ImGui::SameLine();
                      if (s_search_wait) ImGui::TextDisabled("(listing...)");
                      else ImGui::TextDisabled("%ld of %ld loaded classes",
                                               (long)s_search_shown,
                                               (long)s_search_total);
                      if (ImGui::BeginPopup("explOpts")) {
                          ImGui::Checkbox("Case sensitive", &e.case_sensitive);
                          ImGui::TextDisabled("Filter by:");
                          int fb = e.advanced ? 3 : e.filter_by;
                          if (ImGui::RadioButton("Class",  fb == 0)) {
                              e.filter_by = 0; e.advanced = false; }
                          if (ImGui::RadioButton("Method", fb == 1)) {
                              e.filter_by = 1; e.advanced = false; }
                          if (ImGui::RadioButton("Field",  fb == 2)) {
                              e.filter_by = 2; e.advanced = false; }
                          if (ImGui::RadioButton(
                                  "Code text (advanced: string inside class code)",
                                  fb == 3))
                              e.advanced = true;
                          bool sys = s_search_sys;
                          if (ImGui::Checkbox("System classes", &sys))
                              s_search_sys = sys;
                          ImGui::EndPopup();
                      }
                      ImGui::Separator();
                      /* filtered class list */
                      ImGui::BeginChild("explst", ImVec2(0, 0), true);
                      ImGuiListClipper clip;
                      clip.Begin((int)s_search_res.size());
                      while (clip.Step()) {
                          for (int k = clip.DisplayStart; k < clip.DisplayEnd; k++) {
                              const std::string& nm = s_search_res[k];
                              if (!e.all_fam && e.family < (int)s_families.size() &&
                                  family_of(nm) != s_families[e.family]) continue;
                              ImGui::PushID(k);
                              if (ImGui::Selectable(nm.c_str()))
                                  open_inspector(nm, false);
                              ImGui::PopID();
                          }
                      }
                      ImGui::EndChild();
                      mark_scroll_item(s_lst_scroll);
                  }
                  MULK();
                  ImGui::End();
                  mark_rect(wp.x, wp.y, ws.x, ws.y, s_ovl_scroll);
                  if (do_search)
                      run_search(e.search, e.advanced ? 3 : e.filter_by,
                                 e.case_sensitive);
                  if (!open) {
                      s_explorers.erase(s_explorers.begin() + i);
                      continue;
                  }
                  i++;
              }
          }

          /* ===================== floating Inspector windows (r26) =====================
             One per opened class; the secondary bar raises them, "-" collapses,
             "X" closes. s_dup_req (declared at the top of this section) defers
             the "Open in new window" duplicate to after the loop. */

          static void draw_class_windows(ImVec2 ds) {
              for (int i = 0; i < (int)s_classes.size(); i++) {
                  MLK();
                  ClassTab& c = s_classes[i];
                  std::string title = win_title(c);
                  bool open = true;
                  if (s_focus_win == title) {
                      ImGui::SetNextWindowFocus();
                      s_focus_win.clear();
                  }
                  ImGui::SetNextWindowPos(ImVec2(40.f + 24.f * (c.uid % 6),
                                                 60.f + 24.f * (c.uid % 5)),
                                          ImGuiCond_FirstUseEver);
                  ImGui::SetNextWindowSizeConstraints(ImVec2(320, 220),
                      ImVec2(ds.x * .96f, ds.y * .96f));
                  ImGui::SetNextWindowSize(ImVec2(ds.x * .70f, ds.y * .60f),
                                           ImGuiCond_Once);
                  /* r13 comment kept: the sub-tab bar id is unique per scope */
                  bool body = ImGui::Begin(title.c_str(), &open,
                                           ImGuiWindowFlags_NoSavedSettings);
                  ImVec2 wp = ImGui::GetWindowPos(), ws = ImGui::GetWindowSize();
                  if (body) {
                      if (ImGui::SmallButton("Inspector")) {
                          snprintf(s_of.cls, sizeof(s_of.cls), "%s", c.cname.c_str());
                          snprintf(s_of.typ, sizeof(s_of.typ), "%s", "this");
                          s_of.ctx_uid = c.uid;
                          s_of.ctx_arg = -1;
                          s_of.open    = true;
                          s_of.results.clear();
                          s_of.waiting  = false;
                          s_of.creating = false;
                      }
                      if (ImGui::IsItemHovered())
                          ImGui::SetTooltip("find / create objects of this class");
                      ImGui::SameLine();
                      if (ImGui::SmallButton("-##min")) {
                          ImGui::SetWindowCollapsed(true);   /* restore: title [+] */
                      }
                      float xr = ImGui::GetWindowWidth() - 34.f;
                      ImGui::SameLine(xr);
                      if (ImGui::SmallButton("X")) { c.win_close = true; open = false; }
                      ImGui::TextDisabled("%s", c.cname.c_str());
                      if (!c.got_info)
                          ImGui::TextDisabled(c.waiting ? "(waiting for agent...)"
                                                        : "(no data - tap Refresh)");
                      if (ImGui::Button("Refresh"))
                          open_inspector(c.cname, false);
                      ImGui::Separator();
                      if (c.of_handle >= 0)
                          ImGui::TextColored(ImVec4(0, 1, 0, 1), "%s",
                                             c.of_note.c_str());
                      static const char* subs[] = {"Instances", "Static Fields",
                                                   "Methods", "Fields"};
                      char sl[40];
                      if (ImGui::BeginTabBar("clssub")) {
                          for (int si = 0; si < 4; si++) {
                              snprintf(sl, sizeof(sl), "%s##cs%d", subs[si], si);
                              if (ImGui::BeginTabItem(sl)) {
                                  c.sub = si;
                                  if      (si == 0) inst_view(c);
                                  else if (si == 1) static_fields_view(c);
                                  else if (si == 2) methods_view(c);
                                  else              fields_view(c);
                                  ImGui::EndTabItem();
                              }
                          }
                          ImGui::EndTabBar();
                      }
                  }
                  ImGui::End();
                  MULK();
                  mark_rect(wp.x, wp.y, ws.x, ws.y, s_ovl_scroll);
                  if (!open || c.win_close) {
                      MLK();
                      s_classes.erase(s_classes.begin() + i);
                      MULK();
                      i--;   /* the next entry shifted into this slot */
                  }
              }
              /* deferred "Open in new window": duplicate AFTER all references
                 are gone */
              if (!s_dup_req.empty()) {
                  MLK();
                  ClassTab nt{};
                  nt.cname   = s_dup_req;
                  nt.uid     = ++s_tab_uid_seq;
                  nt.waiting = true;
                  s_classes.push_back(nt);
                  s_focus_win = win_title(s_classes.back());
                  MULK();
                  std::string a = "{\"class\":\"" + jesc(s_dup_req) + "\"}";
                  post_rpc("openClass", a);
                  s_dup_req.clear();
              }
          }

          /* ===================== Full Method View window (r26) ===================== */
          static void draw_fm_window(ImVec2 ds) {
              if (!s_fm_open) return;
              ImGui::SetNextWindowPos(ImVec2(90.f, 80.f), ImGuiCond_FirstUseEver);
              ImGui::SetNextWindowSizeConstraints(ImVec2(300, 200),
                  ImVec2(ds.x * .96f, ds.y * .96f));
              ImGui::SetNextWindowSize(ImVec2(ds.x * .58f, ds.y * .52f),
                                       ImGuiCond_Once);
              bool open = s_fm_open;
              ImGui::Begin("Method view##fm", &open,
                           ImGuiWindowFlags_NoSavedSettings);
              ImVec2 wp = ImGui::GetWindowPos(), ws = ImGui::GetWindowSize();
              MLK();   /* s_fm_* are written by the GumJS callback thread too */
              ImGui::Text("%s.%s", s_fm_cls.c_str(), s_fm_mth.c_str());
              if (ImGui::SmallButton("Load source")) {
                  std::string a = "{\"class\":\"" + jesc(s_fm_cls)
                                + "\",\"method\":\"" + jesc(s_fm_mth) + "\"}";
                  post_rpc("getMethodSrc", a);
                  snprintf(s_fm_note, sizeof(s_fm_note), "disassembling...");
                  s_fm_have = false;
              }
              ImGui::SameLine();
              if (ImGui::SmallButton("Copy source") && s_fm_have)
                  copy_text("source", s_fm_src);
              ImGui::SameLine();
              ImGui::TextDisabled("%s", s_fm_note);
              if (s_fm_have) {
                  ImGui::BeginChild("fmsrc", ImVec2(0, 0), true);
                  ImGui::TextUnformatted(s_fm_src);
                  ImGui::EndChild();
                  mark_scroll_item(s_lst_scroll);
              }
              if (!open) s_fm_open = false;
              MULK();
              ImGui::End();
              mark_rect(wp.x, wp.y, ws.x, ws.y, s_ovl_scroll);
          }

          /* ===================== Object Finder window (r26) ===================== */
          static void of_deliver(long handle, const std::string& str) {
              MLK();
              if (s_of.ctx_arg >= 0) {
                  for (auto& c : s_classes) {
                      if (c.uid == s_of.ctx_uid) {
                          char tok[40];
                          snprintf(tok, sizeof(tok), "@handle:%ld", handle);
                          if (s_of.ctx_arg < 8)
                              snprintf(c.call_args[s_of.ctx_arg],
                                       sizeof(c.call_args[0]), "%s", tok);
                          break;
                      }
                  }
              } else {
                  for (auto& c : s_classes) {
                      if (c.uid == s_of.ctx_uid) {
                          c.of_handle = handle;
                          std::string t = str;
                          if (t.size() > 120) t = t.substr(0, 117) + "...";
                          c.of_note = "selected: " + t;
                          for (int k = 0; k < (int)c.instances.size(); k++)
                              if (c.instances[k].handle == handle) {
                                  c.sel_inst = k;
                                  break;
                              }
                          break;
                      }
                  }
              }
              MULK();
              s_of.open = false;
          }

          static void draw_object_finder(ImVec2 ds) {
              if (!s_of.open) return;
              ImGui::SetNextWindowPos(ImVec2(110.f, 100.f), ImGuiCond_FirstUseEver);
              ImGui::SetNextWindowSizeConstraints(ImVec2(320, 220),
                  ImVec2(ds.x * .96f, ds.y * .96f));
              ImGui::SetNextWindowSize(ImVec2(460, 380), ImGuiCond_Once);
              bool open = s_of.open;
              ImGui::Begin("Object Finder", &open,
                           ImGuiWindowFlags_NoSavedSettings);
              ImVec2 wp = ImGui::GetWindowPos(), ws = ImGui::GetWindowSize();
              MLK();   /* s_of.results is written by the GumJS callback thread */
              ImGui::Text("class: %s", s_of.cls);
              if (s_of.ctx_arg >= 0)
                  ImGui::TextDisabled("selecting for arg%d (%s)",
                                      s_of.ctx_arg, s_of.typ);
              else
                  ImGui::TextDisabled("selecting for the Inspector");
              if (ImGui::Button("Find Objects")) {
                  /* the spec's Java.choose */
                  s_of.results.clear();
                  s_of.waiting = true;
                  post_rpc("listInstances", "{\"class\":\"" + jesc(s_of.cls) + "\"}");
              }
              ImGui::SameLine();
              if (ImGui::Button("Create Object")) {
                  /* the spec's $new() through the constructor */
                  s_of.creating = true;
                  post_rpc("createInstance", "{\"class\":\"" + jesc(s_of.cls) + "\"}");
              }
              ImGui::SameLine();
              if (ImGui::Button("Clear##ofc")) {
                  s_of.results.clear();
                  s_of.waiting  = false;
                  s_of.creating = false;
              }
              ImGui::SetNextItemWidth(180);
              ime_textfield("##ofman", s_of.manual, sizeof(s_of.manual));
              ImGui::SameLine();
              if (ImGui::Button("Use##ofman") && s_of.manual[0]) {
                  MLK();
                  if (s_of.ctx_arg >= 0) {
                      for (auto& c : s_classes)
                          if (c.uid == s_of.ctx_uid && s_of.ctx_arg < 8) {
                              snprintf(c.call_args[s_of.ctx_arg],
                                       sizeof(c.call_args[0]), "%s", s_of.manual);
                              break;
                          }
                  } else {
                      for (auto& c : s_classes)
                          if (c.uid == s_of.ctx_uid) {
                              c.of_note = std::string("manual: ") + s_of.manual;
                              break;
                          }
                  }
                  MULK();
                  s_of.open = false;
              }
              ImGui::Separator();
              MLK();
              ImGui::BeginChild("oflst", ImVec2(0, 0), true);
              int N = (int)s_of.results.size();
              for (int k = 0; k < N; k++) {
                  ImGui::PushID(k);
                  InstInfo& in = s_of.results[k];
                  /* the spec's row format: "GameComputer (0/0)" */
                  char lbl[220];
                  snprintf(lbl, sizeof(lbl), "%s (%d/%d)",
                           short_name(s_of.cls).c_str(), k, N);
                  if (ImGui::Selectable(lbl))
                      of_deliver(in.handle, in.str);
                  ImGui::TextDisabled("    %s", in.str.c_str());
                  ImGui::PopID();
              }
              if (s_of.waiting)  ImGui::TextDisabled("(scanning the heap...)");
              if (s_of.creating) ImGui::TextDisabled("(constructing...)");
              if (N == 0 && !s_of.waiting && !s_of.creating)
                  ImGui::TextDisabled("no results yet - tap Find Objects");
              ImGui::EndChild();
              mark_scroll_item(s_lst_scroll);
              if (!open) s_of.open = false;
              MULK();
              ImGui::End();
              mark_rect(wp.x, wp.y, ws.x, ws.y, s_ovl_scroll);
          }


          /* ===================== floating toggle button =====================
             Always available (unless disabled in Settings), draggable, and a
             plain tap toggles the menu - r7 only showed it while the menu was
             hidden and it could not be moved. */
          static ImVec2 s_fab_pos(-1, -1);
          static bool    s_fab_drag = false;
          static bool    s_fab_moved = false;
          static ImVec2  s_fab_grab(0, 0), s_fab_orig(0, 0);

          static void draw_fab(ImVec2 ds) {
              if (!s_show_fab) return;
              if (s_fab_pos.x < 0) s_fab_pos = ImVec2(ds.x - 90.f, ds.y - 110.f);
              ImGuiIO& io = ImGui::GetIO();
              ImGui::SetNextWindowPos(s_fab_pos, ImGuiCond_Always);
              ImGui::SetNextWindowBgAlpha(0.55f);
              ImGui::PushStyleVar(ImGuiStyleVar_FrameRounding, 22.f);
              ImGui::PushStyleColor(ImGuiCol_Button,
                  s_visible ? ImVec4(.25f, .55f, .25f, .85f)
                            : ImVec4(.55f, .30f, .55f, .85f));
              ImGui::Begin("##fab", nullptr,
                           ImGuiWindowFlags_NoDecoration |
                           ImGuiWindowFlags_NoMove |
                           ImGuiWindowFlags_NoSavedSettings |
                           ImGuiWindowFlags_AlwaysAutoResize |
                           ImGuiWindowFlags_NoFocusOnAppearing);
              if (ImGui::Button(s_visible ? "HIDE" : "MENU", ImVec2(64, 44))) {
                  /* click handled on release below for taps; drags reposition */
              }
              if (ImGui::IsItemActive()) {
                  if (!s_fab_drag) {
                      s_fab_drag  = true;
                      s_fab_moved = false;
                      s_fab_grab  = io.MousePos;
                      s_fab_orig  = s_fab_pos;
                  }
                  ImVec2 d(io.MousePos.x - s_fab_grab.x, io.MousePos.y - s_fab_grab.y);
                  if (fabsf(d.x) > 8.f || fabsf(d.y) > 8.f) s_fab_moved = true;
                  if (s_fab_moved) {
                      s_fab_pos = ImVec2(s_fab_orig.x + d.x, s_fab_orig.y + d.y);
                      if (s_fab_pos.x < 0)  s_fab_pos.x = 0;
                      if (s_fab_pos.y < 0)  s_fab_pos.y = 0;
                      if (s_fab_pos.x > ds.x - 80) s_fab_pos.x = ds.x - 80;
                      if (s_fab_pos.y > ds.y - 60) s_fab_pos.y = ds.y - 60;
                      ImGui::SetWindowPos(s_fab_pos);
                  }
              } else if (s_fab_drag) {
                  s_fab_drag = false;
                  if (!s_fab_moved) {           /* it was a tap, not a drag */
                      s_visible = !s_visible;
                      s_conf_dirty = true;
                  }
              }
              ImGui::End();
              ImGui::PopStyleColor();
              ImGui::PopStyleVar();
          }

          /* ===================== frame pump (r25) =====================
             0/1/2 level for dextool_want_frames(); the agent postInvalidate()s
             the host DecorView at this rate so render-on-demand hosts keep
             producing frames while the menu is up. Without it the menu only
             advanced when the host happened to swap ("menu hangs, lags and
             freezes on other apps ... when I touch the app, the touch I had
             previously made on the menu works"). */
          int menu_frame_pump_level() {
              MLK();
              bool vis = s_visible;
              MULK();
              if (vis) return 2;                    /* full rate */
              return overlay_ready() ? 1 : 0;       /* FAB-only slow pump  */
          }

          /* ===================== main window ===================== */
          void menu_draw() {
              ImGuiIO& io = ImGui::GetIO();
              ImVec2 ds = io.DisplaySize;
              apply_theme();

              MLK();
              bool vis = s_visible;
              MULK();

              if (!vis) {
                  draw_fab(ds);
                  MLK();
                  bool ime_was    = s_ime_active;
                  s_ime_active    = false;
                  bool clear_req  = s_ime_clear;
                  s_ime_clear     = false;
                  MULK();
                  if (ime_was) ime_hide();  /* menu hidden: close the phone kb */
                  if (clear_req) ImGui::ClearActiveID();
                  /* publish empty region list: drags elsewhere must not scroll */
                  overlay_publish_scroll_regions(s_regions);
                  s_regions.clear();
                  return;
              }
              draw_fab(ds);
              ime_frame_prelude();

              ImGui::SetNextWindowPos(ImVec2(20, 20), ImGuiCond_Once);
              ImGui::SetNextWindowSizeConstraints(
                  ImVec2(420, 300), ImVec2(ds.x * .95f, ds.y * .95f));
              ImGui::SetNextWindowSize(ImVec2(ds.x * .8f, ds.y * .85f), ImGuiCond_Once);
              /* r24: the r23 "style.Alpha is the single source" call was wrong -
                 style.Alpha faded EVERYTHING (text included) while the spec
                 wants only the window BACKGROUND transparent. apply_theme() no
                 longer touches style.Alpha; SetNextWindowBgAlpha(s_opacity)
                 here is the single opacity source. */
              ImGui::SetNextWindowBgAlpha(s_opacity);
              bool open = vis;
              ImGui::Begin("Dex-tool v1.3 (r26)", &open,
                           ImGuiWindowFlags_NoCollapse);
              if (!open) {
                  MLK();
                  s_visible = false;
                  s_conf_dirty = true;
                  /* r23 UI polish: pressing the window X with the toggle button
                     disabled stranded the menu (nothing could bring it back) -
                     the FAB force-returns, same policy as the Settings rescue */
                  if (!s_show_fab) s_show_fab = true;
                  MULK();
              }

              if (ImGui::BeginTabBar("tb")) {
                  struct TabDef { const char* name; void (*fn)(); };
                  /* r26: EXACT order + names of the field spec: Classes,
                     Patches, Trackers, Hooks, Recorder, Monitor, Script,
                     Settings */
                  TabDef tabs[] = {
                      {"Classes",  tab_classes},  {"Patches",  tab_patches},
                      {"Trackers", tab_tracker},  {"Hooks",    tab_hooks},
                      {"Recorder", tab_recorder}, {"Monitor",  tab_monitor},
                      {"Script",   tab_script},   {"Settings", tab_settings},
                  };
                  MLK();
                  std::string want = s_next_tab;
                  s_next_tab.clear();
                  MULK();
                  for (auto& t : tabs) {
                      ImGuiTabItemFlags fl = 0;
                      if (want == t.name) fl |= ImGuiTabItemFlags_SetSelected;
                      if (ImGui::BeginTabItem(t.name, nullptr, fl)) {
                          t.fn();          /* the body was missing: tabs drew empty */
                          ImGui::EndTabItem();
                      }
                  }
                  ImGui::EndTabBar();
              }
              /* r26: clipboard echo (Copy Method Name / Copy Class Name / the
                 source copy) - visible for 2.5 s under the tab bar */
              if (s_clip_msg[0] && conf_now_ms() - s_clip_ms < 2500)
                  ImGui::TextColored(ImVec4(.4f, 1.f, .5f, 1), "%s", s_clip_msg);
              ImVec2 wp = ImGui::GetWindowPos(), ws = ImGui::GetWindowSize();
              ImGui::End();
              /* the whole window body pans at the overlay speed */
              mark_rect(wp.x, wp.y, ws.x, ws.y, s_ovl_scroll);
              /* r26: the floating spec windows - Class Explorer(s), one
                 Inspector per opened class, Full Method View, Object Finder */
              draw_explorer_windows(ds);
              draw_class_windows(ds);
              draw_fm_window(ds);
              draw_object_finder(ds);
              overlay_publish_scroll_regions(s_regions);
              s_regions.clear();

              /* debounce the conf write so sliders do not hit the disk 60x/s */
              if (s_conf_dirty && s_conf_path[0] &&
                  conf_now_ms() - s_conf_last_ms > 700) {
                  conf_save();
                  MLK();
                  overlay_set_touch_bias(s_y_off);
                  MULK();
              }
          }
          DXTMNC

      - name: Generate main.cpp
        run: |
          cat > src/main.cpp << 'DXTMAIN'
          #include "logger.h"
          #include "overlay.h"
          #include "frida-gumjs.h"
          #include <jni.h>
          #include <fcntl.h>
          #include <unistd.h>
          #include <cstring>
          #include <ctime>
          #include <cstdio>
          #include <sys/stat.h>

          JavaVM* g_jvm_global = nullptr;

          static void write_marker(const char* path, const char* msg) {
              int fd = open(path, O_WRONLY|O_CREAT|O_TRUNC, 0644);
              if (fd < 0) return;
              char buf[256];
              int n = snprintf(buf, sizeof(buf), "%s ts=%ld\n", msg, (long)time(nullptr));
              write(fd, buf, (size_t)n);
              close(fd);
          }

          static void write_marker_in(const char* dir, const char* name,
                                      const char* msg) {
              char p[600];
              snprintf(p, sizeof(p), "%s/%s", dir, name);
              write_marker(p, msg);
          }

          /* r15: the Java log copier (DexToolApp.copyLogs) reads
             getFilesDir()/dextool-logs/ - but the native side logged to
             /sdcard/Download, so the copier never saw the files (and the
             /sdcard writes themselves fail silently under scoped storage on
             newer devices). Resolve the app's private dir via JNI and log
             THERE; /sdcard/Download stays as the fallback when the JVM or
             the Application is not reachable.
             r16: currentApplication() is frequently still NULL during
             Application.onCreate (JNI_OnLoad runs inside
             System.loadLibrary), so the fallback wins exactly when the
             logs matter most. DexToolApp now calls nativeSetLogDir() right
             after loadLibrary; this JNI resolution remains the safety net
             for other entry points. */
          static void resolve_log_dir(char* out, size_t n) {
              snprintf(out, n, "/sdcard/Download");
              JNIEnv* env = nullptr;
              if (!g_jvm_global) return;
              if (g_jvm_global->GetEnv((void**)&env, JNI_VERSION_1_6) != JNI_OK)
                  return;
              if (!env) return;
              do {
                  jclass act = env->FindClass("android/app/ActivityThread");
                  if (!act || env->ExceptionCheck()) break;
                  jmethodID cur = env->GetStaticMethodID(act,
                      "currentApplication", "()Landroid/app/Application;");
                  if (!cur || env->ExceptionCheck()) break;
                  jobject app = env->CallStaticObjectMethod(act, cur);
                  if (!app || env->ExceptionCheck()) break;
                  jclass ctx = env->FindClass("android/content/Context");
                  if (!ctx || env->ExceptionCheck()) break;
                  jmethodID gfd = env->GetMethodID(ctx, "getFilesDir",
                                                   "()Ljava/io/File;");
                  if (!gfd || env->ExceptionCheck()) break;
                  jobject fdir = env->CallObjectMethod(app, gfd);
                  if (!fdir || env->ExceptionCheck()) break;
                  jclass fio = env->FindClass("java/io/File");
                  if (!fio || env->ExceptionCheck()) break;
                  jmethodID gap = env->GetMethodID(fio, "getAbsolutePath",
                                                   "()Ljava/lang/String;");
                  if (!gap || env->ExceptionCheck()) break;
                  jstring js = (jstring)env->CallObjectMethod(fdir, gap);
                  if (!js || env->ExceptionCheck()) break;
                  const char* p = env->GetStringUTFChars(js, nullptr);
                  if (p) {
                      snprintf(out, n, "%s/dextool-logs", p);
                      env->ReleaseStringUTFChars(js, p);
                  }
              } while (0);
              if (env->ExceptionCheck()) env->ExceptionClear();
          }

          /* r16: called by DexToolApp right after System.loadLibrary. That
             is the one moment the Java side knows getFilesDir() for certain
             and the native logger can still be re-pointed cheaply (see
             logger_retarget). */
          extern "C" JNIEXPORT void JNICALL
          Java_com_dextool_app_DexToolApp_nativeSetLogDir(JNIEnv* env, jclass,
                                                          jstring path) {
              if (!path) return;
              const char* p = env->GetStringUTFChars(path, nullptr);
              if (!p) return;
              logger_retarget(p);
              env->ReleaseStringUTFChars(path, p);
          }

          extern "C" JNIEXPORT jint JNICALL
          JNI_OnLoad(JavaVM* vm, void*) {
              g_jvm_global = vm;
              char base[512];
              resolve_log_dir(base, sizeof(base));
              mkdir(base, 0755);       /* entry marker + logs land even on the
                                          very first boot */
              write_marker_in(base, "dextool-jni.marker", "checkpoint=entry");
              logger_init(base);        /* mkdir()s <filesDir>/dextool-logs */
              logger_install_abort_capture();
              {
                  char m[600];
                  snprintf(m, sizeof(m), "[JNI_OnLoad] entry (r16: log dir %s)",
                           base);
                  log_info(m);
              }
              write_marker_in(base, "dextool-jni.marker", "checkpoint=logger_ready");
              overlay_set_java_vm(vm);
              overlay_start(vm);
              if (!install_swap_hook())
                  log_crash_raw("[JNI_OnLoad] FATAL: install_swap_hook failed\n");
              write_marker_in(base, "dextool-jni.marker", "checkpoint=hooks_installed");
              log_info("[JNI_OnLoad] done — awaiting first eglSwapBuffers");
              write_marker_in(base, "dextool-jni.marker", "checkpoint=jni_return");
              return JNI_VERSION_1_6;
          }
          DXTMAIN

      - name: Generate agent.js
        run: |
          cat > agent/agent.js << 'DXTAGNT'
          'use strict';
          /* Dex-tool agent (r26). All Java logic lives here (frida-java-bridge);
             libtool.so only feeds input/GL. Messages both ways are JSON via
             send()/recv(); the C++ menu decodes them in menu.cpp.

             r26 changes (menu restructure per the field spec - Class Explorer
             windows, Inspector windows, Caller/Patcher/Tracer/Hooker sub-tabs,
             Object Finder):
             - callMethod gained count (N calls, per-call callResult with
               idx/of) and main (Java.scheduleOnMainThread - the spec's "Call
               in Main Thread" button).
             - Object args travel as {"handle":N} - call_with_args resolves the
               retained instance, so the Object Finder can feed an actual object
               into any parameter (the old text-only args could not).
             - createInstance: the Object Finder's "Create Object" - $new() via
               the no-arg constructor, retained like a Java.choose match.
             - listLoadedClasses gained cs (case-sensitive compare for mode 0
               and the dex scan; the Explorer Options popup checkbox).
             - r25 changes (field report: menu hangs/lags/freezes on OTHER apps +
             feature requests for the Hooks/Monitor/Classes sections):
             - FRAME PUMP (the freeze fix): the menu is drawn inside the
               eglSwapBuffers hook, so a host that renders on demand (most
               non-game apps) only advanced the menu when it happened to
               redraw - queued menu touches waited for the next swap ("when
               I touch the app, the touch I had previously made on the menu
               works"). The agent now polls dextool_want_frames() from a 30 ms
               timer and DecorView.postInvalidate()s the captured activity
               while frames are wanted: full rate with the menu up, slow rate
               (FAB only) when it is hidden.
             - METHOD SOURCE VIEW: "Src" on a method (or Load source in the
               Hooks tab) disassembles the REAL method body on-device with a
               bundled baksmali (org.smali 2.5.2 - baksmali is not on Google
               Maven for 3.x) and shows it in a read-only panel; Smali mode
               can copy the body into the hook editor. Java decompilation is
               NOT bundled (too heavy to run inside the host process) - both
               modes show the bytecode.
             - ONE-TAP NOP: the "Nop" button adds a noop hook that returns the
               default value for the method's return type (void -> plain
               return, numeric -> 0, boolean -> false, object/array -> null).
             - METHOD INPUT/OUTPUT PATCHING: "IO" probes one call of the
               method, reports the captured current values (toString-safe),
               and only the checkbox-marked rows are patched from then on
               (args replaced before the original call, return value replaced
               after).
             - NETWORK MONITOR: okhttp calls now log a REQUEST row AND a
               RESPONSE row (response body peeked up to 4 KB, request body
               when accessible); HttpURLConnection.getInputStream is hooked
               too. Clicking a row opens a detail window: type, http method,
               URL, the app method that sent/received it (clickable), note and
               the payload preview.
             - CLASSES TAB: the list is sorted alphabetically and android/
               androidx/com.android/com.google/java/javax/dalvik/kotlin
               classes are HIDDEN by default (System checkbox brings them
               back). Search has 4 modes: class name, method name, field name
               and CODE TEXT - the last one scans every method's const-string
               instructions and static String field values of the app's dex
               files (chunked, cancellable, capped at 4000 hits); classes it
               reports get their matched methods/fields painted GREEN when
               opened.
             - r24 changes (patch #3 - performance on heavy apps + logic/CI
             leftovers from the latest static audit; the menu froze and
             logcat showed "Skipped 40 frames! The application may be doing
             too much work on its main thread"):
             - Field-tracker flooding fixed: field_layer_emit() sent a
               trackerEvent on EVERY method call of the tracked class,
               changed or not (the old else-branch). Values are polled at
               most every 20 ms, emitted only when the value actually
               changed, and at most once per 100 ms per field - hot classes
               no longer flood the bridge.
             - dt_is_loaded() race fixed: the 3 s loaded-class cache could
               predate a class actually loading, and loadClass would never
               fire again - the queued install waited forever. A cache miss
               now forces ONE rebuild of the set (once per cache
               generation) before the class is declared unloaded.
             - Dispatcher overhead: cls/mn are parsed from the LAYERS key
               LAZILY (only recorder rows need them) instead of substring'ing
               the key on every hooked call; the dispatchTouchEvent hook
               keeps doing the minimum on the main thread.
             - Eaten gestures no longer leak UP: gTouchEat was cleared on
               UP/CANCEL BEFORE the consume check, so the app received an
               UP for a gesture whose DOWN the menu had consumed. The flag
               is captured first and consumed after.
             - IME ladder stops when the keyboard is already up: retries
               now check isAcceptingText() (logged once), and every show
               request carries a session token - newer requests and
               Done/hide invalidate the pending ladder instead of
               re-sending showSoftInput 4x per tap.
             - Enter is forwarded to ImGui: onEditorAction sends an
               "imeEnter" message BEFORE imeHidden; the menu injects
               ImGuiKey_Enter (DOWN, then UP next frame) so fields with
               EnterReturnsTrue (the class filter) actually search.

             r23 changes (patch #2 of the 47-item audit - 22 open + 7 partial
             items finished):
             - ONE layering registry (LAYERS) per class+method: Hook, Tracker,
               field-Tracker, Recorder and Monitor now STACK on the same method
               instead of overwriting each other's ov.implementation. A single
               dispatcher runs recorder -> monitor -> tracker -> field-diff ->
               user hook; removing the last layer of a method restores the
               original implementation.
             - Recorder Stop and Monitor Stop really UNHOOK: their layer is
               removed and the method's original implementation returns (the
               r22 stop only flipped a flag and left every hook installed).
             - listInstances retains every instance (Java.retain) and returns a
               structured protocol {str, handle, fields:[{n,t,v}]} - the old
               "toString##name=value;name=value" string corrupted every value
               containing | # or ;. setInstanceField/callMethod address the
               instance by HANDLE, so instance methods finally have a receiver
               (callMethod without a handle now refuses non-static calls with a
               hint instead of failing on ov.apply(null)).
             - Class access avoids premature <clinit> where possible: hook and
               tracker installs only Java.use classes that are ALREADY loaded;
               anything else is DEFERRED and installed by a loadClass watcher
               when the target loads the class (frida-java-bridge always runs
               ensureClassInitialized in use(), so "not loaded yet" is the one
               case we can avoid triggering).
             - trackField/tracker values no longer call toString() inside
               hooks: field_repr() stringifies primitives and boxes only, and
               reports '@class#identityHashCode' for anything else - no more
               recursion/crash through an app's own toString (which this agent
               may itself be recording).
             - Click-through: the dispatchTouchEvent hook asks
               dextool_hit_test(rawX, rawY) BEFORE the app sees the gesture and
               consumes the whole gesture when it starts on a live menu window
               (menu.cpp publishes every ImGui window rect each frame; the old
               gWantMouse path still called the app's dispatch and leaked taps).
             - Touch map view choice: the probe now scores SurfaceView/
               TextureView candidates against the overlay's ACTUAL GL surface
               size (dextool_display_size) instead of blindly taking the
               largest, and overlay.cpp dropped its coordinate clamping - taps
               outside the view no longer snap onto edge widgets (both axes
               were already proportional since r15).
             - IME focus: before the hidden EditText takes focus the app's
               currently-focused view is retained; ime_hide / Done / imeHidden
               restore focus to it and clear the EditText - the app gets its
               focus state back instead of the 1x1 view keeping it forever.
             - Everything from r22 (script new Function fix, mode
               normalisation, orig() receiver/args, patch snapshot/restore,
               ordered input queue + UTF-16, code-point deletions, OkHttp
               enqueue, readable console, smali loader hardening) and r21
               (addContentView host attach, ime_read_text cast chain) is kept.

             r22 changes (third-party audit, the 18 patch-fixed items ported
             here and MERGED with the r21 IME code - the audit's raw patch
             targeted a pre-r19 snapshot and its ime_on_text hunk would have
             clobbered the r21 fixes):
             - Script tab runs user code now: the LAST argument of
               new Function() is the body - the old call made "src" the body
               and passed the code as a parameter VALUE, so nothing executed.
             - Java(JS) hooks install: the menu label 'Java(JS)' is
               normalised to 'Java' (mode strings are compared literally).
             - orig() in Java hooks keeps the REAL receiver + arguments.
             - Patch OFF/delete RESTORES the original value (snapshotted
               before the first write); noop/'char' fallbacks return
               '\u0000' instead of 'a'.
             - Recorder pre-filters enumerateLoadedClassesSync() ONCE (the
               install loop counted skipped classes against its 12-class
               batch, so a package filter took ~a minute over 30k names).
             - Tracker callers no longer list the tracked method itself.
             - Monitor also hooks OkHttp enqueue (async requests).
             - Script console output is readable via cstr() (no 160-char
               cut, no '|'->'!' rewrite, objects JSON-stringified).
             - Smali jar: extracted to a temp file + rename (a killed
               process cannot leave a truncated jar), setReadOnly() for
               Android 14+ (writable dex refused), assembled via
               ClassFactory.get(loader) (loadClass returns a Class wrapper
               without static main()) trying both Main class names, source
               written as UTF-8.
             - smali_load uses the single-ByteBuffer InMemoryDexClassLoader
               ctor (the ByteBuffer[] one needs API 27; minSdk is 26).
             - IME deletions are counted in CODE POINTS: an astral char went
               in as 2 UTF-16 units but ImGui deletes one CHARACTER per
               backspace, so unit-counting over-deleted the field.
               Insertions stay per-UTF-16-unit; overlay.cpp (r22) routes the
               halves through io.AddInputCharacterUTF16() so pairs
               recombine.
             - Touch map also refreshed on ACTION_DOWN (throttled), not just
               on moves.
             - Dead code removed: DOTS/DMAX, parse_rules, lit_to_java,
               CONS_Lines/CONS_Dummy batching, gDispSize lookup.

             r21 changes (two field reports on the r20 build, both pinned by
             the r20 stage tags):
             - "stage decor.addView: decor.addView typeof undefined": on this
               bridge the wrapper returned by win.getDecorView() does not
               resolve ViewGroup methods, so the hidden EditText could never
               be attached. Fix per field fix-spec: attach through
               act.addContentView(edit, lp) instead - a plain public Activity
               method on the same wrapper whose hashCode/getWindow/
               getSystemService all work (proven by the successful r20 run
               that opened the keyboard). The win/decor stages are gone; the
               r19 early guard now probes BOTH act.getWindow and
               act.addContentView before any state mutation.
