      - name: Build sample-nolib-signed.apk (without libtool.so)
        run: |
          # r15: build from a scratch copy. The old sed -i stripped
          # System.loadLibrary from the WORKING TREE, so the commit step
          # shipped a DexToolApp.java that logs "libtool.so loaded" without
          # ever calling System.loadLibrary() - exactly what the code audit
          # flagged. The checked-in source now stays pristine.
          rm -rf /tmp/nolib-app
          cp -r sample-app /tmp/nolib-app
          rm -f /tmp/nolib-app/app/src/main/jniLibs/arm64-v8a/libtool.so
          rm -f /tmp/nolib-app/app/src/main/jniLibs/armeabi-v7a/libtool.so
          sed -i -e 's/System\.loadLibrary("tool");//' \
                 -e 's/Log.i(TAG, "libtool.so loaded");//' \
            /tmp/nolib-app/app/src/main/java/com/dextool/app/DexToolApp.java
          cd /tmp/nolib-app
          gradle assembleRelease --no-daemon -q
          cp app/build/outputs/apk/release/app-release.apk \
             "$GITHUB_WORKSPACE/sample-nolib-signed.apk"
