          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          DXTGRADP
          cat > sample-app/settings.gradle << 'DXTSETS'
          rootProject.name = "DexToolSample"
          include ':app'
          DXTSETS
          cat > sample-app/build.gradle << 'DXTROOTB'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.1.4' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          DXTROOTB
          cat > sample-app/app/build.gradle << 'DXTAPPB'
          plugins { id 'com.android.application' }
          android {
              namespace          'com.dextool.app'
              compileSdk         34
