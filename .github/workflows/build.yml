          static void tab_script(){
              ImGui::InputTextMultiline("##sc",s_script,sizeof(s_script),ImVec2(-1,140));
              if(ImGui::Button("Run")){
                  MLK(); s_script_out.clear(); MULK();
                  std::string a = "{\"src\":\""+jesc(s_script)+"\"}";
                  post_rpc("evalScript",a);
              }
              ImGui::SameLine();
              if(ImGui::Button("Clear")){ MLK(); s_script_out.clear(); MULK(); }
              ImGui::Separator();
              ImGui::BeginChild("so",ImVec2(0,120),true);
              MLK(); for(auto& l:s_script_out) ImGui::TextUnformatted(l.c_str()); MULK();
              ImGui::EndChild();
          }
          
          static void tab_classes(){
              /* --- loaded class list with filter (the missing feature) --- */
              if (ImGui::Button("List loaded classes")) {
                  post_rpc("listLoadedClasses","{}");
                  s_loaded_queried = true;   /* shows "(waiting)" until reply */
              }
              ImGui::SameLine();
              MLK();
              bool have = !s_loaded.empty();
              MULK();
              ImGui::TextDisabled(have ? "%d classes" :
                                  (s_loaded_queried ? "(waiting)" : "(not queried)"));
          
              if (ImGui::InputText("Filter##cf", s_loaded_filter, sizeof(s_loaded_filter)))
                  s_loaded_filter_dirty = true;
          
              MLK();
              if (s_loaded_filter_dirty) { refresh_loaded_filtered(); s_loaded_filter_dirty = false; }
              int n = (int)s_loaded_filtered.size();
              MULK();
          
              ImGui::BeginChild("cl", ImVec2(0, 220), true);
              for (int i = 0; i < n; i++) {
                  ImGui::PushID(1000000 + i);
                  const std::string& c = s_loaded_filtered[i];
                  if (ImGui::Selectable(c.c_str(), false,
                                        ImGuiSelectableFlags_AllowDoubleClick)) {
                      if (ImGui::IsMouseDoubleClicked(0)) {
                          snprintf(s_cname, sizeof(s_cname), "%s", c.c_str());
                      }
                  }
                  ImGui::PopID();
              }
              ImGui::EndChild();
          
              if (ImGui::Button("Open selected class") && s_cname[0]) {
                  std::string a = "{\"class\":\""+jesc(s_cname)+"\"}";
                  post_rpc("openClass",a);
                  MLK();
                  bool dup=false;
                  for (auto& cw : s_classes) if (cw.cname==s_cname) { dup=true; break; }
                  if (!dup) s_classes.push_back({s_cname,{},{}});
                  MULK();
                  s_cname[0]=0;
              }
              ImGui::SameLine();
              ImGui::TextUnformatted(s_cname[0] ? s_cname : "(double-tap a class above)");
          
              ImGui::Separator();
              ImGui::InputText("Class##cn",s_cname,sizeof(s_cname));
              if (ImGui::Button("Open##cls")&&s_cname[0]){
                  std::string a = "{\"class\":\""+jesc(s_cname)+"\"}";
                  post_rpc("openClass",a);
                  MLK();
                  bool dup=false;
                  for (auto& cw : s_classes) if (cw.cname==s_cname) { dup=true; break; }
                  if (!dup) s_classes.push_back({s_cname,{},{}});
                  MULK();
                  s_cname[0]=0;
              }
              ImGui::Separator();
              MLK();
              for(int i=0;i<(int)s_classes.size();i++){
                  ImGui::PushID(i); auto& c=s_classes[i];
                  if(ImGui::CollapsingHeader(c.cname.c_str())){
                      if(ImGui::Button("List Instances")){
                          std::string a = "{\"class\":\""+jesc(c.cname.c_str())+"\"}";
                          post_rpc("listInstances",a);
                      }
                      ImGui::Text("Methods (%d):",(int)c.methods.size());
                      for(auto& m:c.methods){
                          ImGui::BulletText("%s",m.c_str()); ImGui::SameLine();
                          std::string hid="H##h"+m, tid="T##t"+m;
                          if(ImGui::SmallButton(hid.c_str())){
                              std::string a = "{\"class\":\""+jesc(c.cname.c_str())
                                            + "\",\"method\":\""+jesc(m)+"\"}";
                              post_rpc("hookMethod",a);
                          }
                          ImGui::SameLine();
                          if(ImGui::SmallButton(tid.c_str())){
                              std::string a = "{\"class\":\""+jesc(c.cname.c_str())
                                            + "\",\"method\":\""+jesc(m)+"\"}";
                              post_rpc("trackMethod",a);
                          }
                      }
                      ImGui::Text("Fields (%d):",(int)c.fields.size());
                      for(auto& f:c.fields){
                          ImGui::BulletText("%s",f.c_str()); ImGui::SameLine();
                          std::string pid="P##p"+f;
                          if(ImGui::SmallButton(pid.c_str())){
                              std::string a = "{\"class\":\""+jesc(c.cname.c_str())
                                            + "\",\"field\":\""+jesc(f)+"\"}";
                              post_rpc("patchField",a);
                          }
                      }
                  }
                  ImGui::PopID();
              }
              MULK();
          }
          
          /* floating toggle button: brings the menu back after it was hidden
             (X button or Visible off) — previously there was NO way back and
             the state combination could leave the user stranded. */
          static void draw_fab(ImVec2 ds) {
              if (!s_show_fab || s_visible) return;
              ImGui::SetNextWindowPos(ImVec2(ds.x - 76.f, ds.y - 76.f),
                                      ImGuiCond_Always);
              ImGui::SetNextWindowBgAlpha(0.55f);
              ImGui::PushStyleVar(ImGuiStyleVar_FrameRounding, 22.f);
              ImGui::Begin("##fab", nullptr,
                           ImGuiWindowFlags_NoDecoration |
                           ImGuiWindowFlags_NoMove |
                           ImGuiWindowFlags_NoSavedSettings |
                           ImGuiWindowFlags_AlwaysAutoResize |
                           ImGuiWindowFlags_NoFocusOnAppearing);
              if (ImGui::Button("MENU", ImVec2(56, 40))) {
                  s_visible = true;
                  apply_theme();
              }
              ImGui::End();
              ImGui::PopStyleVar();
          }
          
          void menu_draw(){
              ImGuiIO& io=ImGui::GetIO();
              ImVec2 ds = io.DisplaySize;
              draw_fab(ds);
              if(!s_visible) return;
              ImGui::SetNextWindowPos(ImVec2(20,20),ImGuiCond_Once);
              ImGui::SetNextWindowSize(ImVec2(io.DisplaySize.x*.75f,500),ImGuiCond_Once);
              ImGui::SetNextWindowBgAlpha(s_opacity);
              ImGui::Begin("Dex-tool v1.1",&s_visible,ImGuiWindowFlags_NoCollapse);
              if(ImGui::BeginTabBar("tb")){
                  if(ImGui::BeginTabItem("Settings")) { tab_settings(); ImGui::EndTabItem(); }
                  if(ImGui::BeginTabItem("Patches"))  { tab_patches();  ImGui::EndTabItem(); }
                  if(ImGui::BeginTabItem("Hooks"))    { tab_hooks();    ImGui::EndTabItem(); }
                  if(ImGui::BeginTabItem("Tracker"))  { tab_tracker();  ImGui::EndTabItem(); }
                  if(ImGui::BeginTabItem("Recorder")) { tab_recorder(); ImGui::EndTabItem(); }
                  if(ImGui::BeginTabItem("Monitor"))  { tab_monitor();  ImGui::EndTabItem(); }
                  if(ImGui::BeginTabItem("Script"))   { tab_script();   ImGui::EndTabItem(); }
                  if(ImGui::BeginTabItem("Classes"))  { tab_classes();  ImGui::EndTabItem(); }
                  ImGui::EndTabBar();
              }
              ImGui::End();
          }
          DXTMNC

      - name: Generate main.cpp
        run: |
          cat > src/main.cpp << 'DXTMAIN'
          #include "logger.h"
          #include "overlay.h"
          #include "frida-gumjs.h"
          #include <jni.h>
          #include <fcntl.h>
          #include <unistd.h>
          #include <cstring>
          #include <ctime>
          #include <cstdio>
          
          JavaVM* g_jvm_global = nullptr;
          
          static void write_marker(const char* path, const char* msg) {
              int fd = open(path, O_WRONLY|O_CREAT|O_TRUNC, 0644);
              if (fd < 0) return;
              char buf[256];
              int n = snprintf(buf, sizeof(buf), "%s ts=%ld\n", msg, (long)time(nullptr));
              write(fd, buf, (size_t)n);
              close(fd);
          }
          
          extern "C" JNIEXPORT jint JNICALL
          JNI_OnLoad(JavaVM* vm, void*) {
              g_jvm_global = vm;
              write_marker("/sdcard/Download/dextool-jni.marker", "checkpoint=entry");
              logger_init("/sdcard/Download");
              logger_install_abort_capture();
              log_info("[JNI_OnLoad] entry");
              write_marker("/sdcard/Download/dextool-jni.marker", "checkpoint=logger_ready");
              overlay_set_java_vm(vm);
              overlay_start(vm);
              if (!install_swap_hook())
                  log_crash_raw("[JNI_OnLoad] FATAL: install_swap_hook failed\n");
              write_marker("/sdcard/Download/dextool-jni.marker", "checkpoint=hooks_installed");
              log_info("[JNI_OnLoad] done — awaiting first eglSwapBuffers");
              write_marker("/sdcard/Download/dextool-jni.marker", "checkpoint=jni_return");
              return JNI_VERSION_1_6;
          }
          DXTMAIN

      - name: Generate agent.js
        run: |
          cat > agent/agent.js << 'DXTAGNT'
          'use strict';
          
          var patches={}, hooks={}, trackers={};
          var recOn=false, monOn=false;
          
          /* send the OBJECT, not a string. GumJS wraps it as
             {"type":"send","payload":{...}} and the C++ side (fix2) extracts
             the payload — r6 sent JSON.stringify(...) which arrived
             escaped, so no message ever matched. */
          function sendMsg(type, payload) {
              send({ type: type, payload: payload });
          }
          
          // Touch offset
          var gOffX=0, gOffY=0;
          
          function updateOffset(activity) {
              try {
                  var cv = activity.getWindow().getDecorView().findViewById(0x01020002);
                  if (!cv) return;
                  var loc = Java.array('int', [0,0]);
                  cv.getLocationInWindow(loc);
                  gOffX = loc[0]; gOffY = loc[1];
              } catch(e) {}
          }
          
          // Keyboard bridge
          var gET=null, gIMM=null, gClearing=false;
          var gAddChar=null, gBackspace=null, gWantMouse=null;
          
          function setupKeyboardBridge(activity) {
              try {
                  var sym1 = Module.findExportByName('libtool.so','dextool_add_char');
                  var sym2 = Module.findExportByName('libtool.so','dextool_backspace');
                  if (!sym1||!sym2) return;
                  gAddChar   = new NativeFunction(sym1,'void',['int']);
                  gBackspace = new NativeFunction(sym2,'void',[]);
              } catch(e) { return; }
          
              Java.scheduleOnMainThread(function() {
                  try {
                      var ET  = Java.use('android.widget.EditText');
                      var FL  = Java.use('android.widget.FrameLayout');
                      var LP  = Java.use('android.widget.FrameLayout$LayoutParams');
                      var TW  = Java.use('android.text.TextWatcher');
                      var IMMCls = Java.use('android.view.inputmethod.InputMethodManager');
                      var Editable = Java.use('android.text.Editable');
                      var CS = Java.use('java.lang.CharSequence');
          
                      var et = ET.$new(activity);
                      et.setAlpha(0.0);
                      et.setFocusableInTouchMode(true);
          
                      var params = LP.$new(1,1);
                      Java.cast(activity.getWindow().getDecorView(), FL).addView(et, params);
          
                      var WatcherCls = Java.registerClass({
                          name: 'com.dextool.app.DxtoolKbd_'+Date.now(),
                          implements: [TW],
                          methods: {
                              beforeTextChanged: function(s,st,c,a){},
                              onTextChanged: function(s,st,before,count) {
                                  if (gClearing) return;
                                  try {
                                      if (count>before) {
                                          var txt = Java.cast(s,CS).toString();
                                          var added = txt.substring(st+before, st+count);
                                          for (var i=0;i<added.length;i++)
                                              gAddChar(added.charCodeAt(i));
                                      } else if (before>count) {
                                          for (var i=0;i<before-count;i++) gBackspace();
                                      }
                                  } catch(e2) {}
                              },
                              afterTextChanged: function(e) {
                                  if (!gClearing) {
                                      gClearing=true;
                                      try { Java.cast(e,Editable).clear(); } catch(e2){}
                                      gClearing=false;
                                  }
                              }
                          }
                      });
                      et.addTextChangedListener(WatcherCls.$new());
                      gET  = et;
                      gIMM = Java.cast(activity.getSystemService('input_method'), IMMCls);
                      sendMsg('info',{msg:'Keyboard bridge OK'});
                  } catch(e) { sendMsg('warn',{msg:'setupKeyboardBridge: '+e.message}); }
              });
          }
          
          // Touch hook
          function installTouchHook() {
              try {
                  var sym = Module.findExportByName('libtool.so','dextool_on_touch');
                  var wm  = Module.findExportByName('libtool.so','dextool_want_mouse');
                  if (!sym) { sendMsg('warn',{msg:'dextool_on_touch not found'}); return; }
                  var nativeTouch = new NativeFunction(sym,'void',['float','float','int']);
                  try {
                      if (wm) gWantMouse = new NativeFunction(wm,'bool',[]);
                  } catch(we) { gWantMouse = null; }
          
                  Java.perform(function() {
                      var Activity = Java.use('android.app.Activity');
          
                      Activity.onWindowFocusChanged.implementation = function(has) {
                          if (has) {
                              updateOffset(this);
                              if (!gET) setupKeyboardBridge(this);
                          }
                          return this.onWindowFocusChanged(has);
                      };
          
                      Activity.dispatchTouchEvent.implementation = function(ev) {
                          try {
                              var wants = gWantMouse ? gWantMouse() : false;
                              if (wants) {
                                  // overlay is hovered: feed it AND consume
                                  nativeTouch(ev.getX()-gOffX, ev.getY()-gOffY,
                                              ev.getAction()&0xff);
                                  return true;
                              }
                              nativeTouch(ev.getX()-gOffX, ev.getY()-gOffY,
                                          ev.getAction()&0xff);
                          } catch(e2){}
                          return this.dispatchTouchEvent(ev);
                      };
                      sendMsg('info',{msg:'Touch hook installed'});
                  });
              } catch(e) { sendMsg('error',{fn:'installTouchHook',msg:e.message}); }
          }
          
          installTouchHook();
          
          function splitName(name) {
              var parts = name.split('.');
              var last  = parts.pop();
              var cls = parts.join('.');
              // name may be "pkg.Class.method" OR "method" after class split
              return { cls: cls, member: last };
          }
          
          rpc.exports = {
              addPatch: function(name,value) {
                  try {
                      Java.perform(function(){
                          var parts=name.split('.'); var field=parts.pop();
                          var jcls=Java.use(parts.join('.'));
                          var f=jcls.class.getDeclaredField(field);
                          f.setAccessible(true);
                          var t=f.getType().getName();
                          if(t==='int'||t==='long'||t==='short'||t==='byte')
                              f.set(null,parseInt(value));
                          else if(t==='boolean') f.set(null,value==='true');
                          else if(t==='float'||t==='double') f.set(null,parseFloat(value));
                          else f.set(null,value);
                          patches[name]={value:value,enabled:true};
                          sendMsg('patchApplied',{name:name});
                      });
                  } catch(e){ sendMsg('error',{fn:'addPatch',msg:e.message}); }
              },
              removePatch: function(name){ delete patches[name]; sendMsg('patchRemoved',{name:name}); },
              setPatchEnabled: function(name,en){ if(patches[name])patches[name].enabled=en; sendMsg('patchUpdated',{name:name,enabled:en}); },
          
              addHook: function(name,mode,code) {
                  try {
                      Java.perform(function(){
                          var parts=name.split('.'); var method=parts.pop();
                          var jcls=Java.use(parts.join('.'));
                          if(mode==='noop'){
                              jcls[method].implementation=function(){
                                  sendMsg('hookFired',{name:name,mode:'noop'}); return null;
                              };
                          } else if(mode==='Java'){
                              var fn=new Function('Java','send','args',code);
                              jcls[method].implementation=function(){
                                  return fn(Java,send,Array.from(arguments));
                              };
                          } else if(mode==='Smali'){
                              sendMsg('smaliRequest',{name:name,code:code});
                          }
                          hooks[name]={mode:mode,enabled:true};
                          sendMsg('hookAdded',{name:name});
                      });
                  } catch(e){ sendMsg('error',{fn:'addHook',msg:e.message}); }
              },
              removeHook: function(name) {
                  try {
                      Java.perform(function(){
                          var parts=name.split('.'); var m=parts.pop();
                          Java.use(parts.join('.'))[m].implementation=null;
                          delete hooks[name]; sendMsg('hookRemoved',{name:name});
                      });
                  } catch(e){ sendMsg('error',{fn:'removeHook',msg:e.message}); }
              },
              setHookEnabled: function(name,en){ if(hooks[name])hooks[name].enabled=en; sendMsg('hookUpdated',{name:name,enabled:en}); },
          
              addTracker: function(name) {
                  try {
                      Java.perform(function(){
                          var parts=name.split('.'); var m=parts.pop();
                          var jcls=Java.use(parts.join('.'));
                          jcls[m].implementation=function(){
                              var args=Array.from(arguments).map(String); var ret;
                              try{ret=this[m].apply(this,arguments);}catch(e){ret=null;}
                              sendMsg('trackerEvent',{name:name,args:args,ret:String(ret)});
                              return ret;
                          };
                          trackers[name]=true; sendMsg('trackerAdded',{name:name});
                      });
                  } catch(e){ sendMsg('error',{fn:'addTracker',msg:e.message}); }
              },
              removeTracker: function(name) {
                  try {
                      Java.perform(function(){
                          var parts=name.split('.'); var m=parts.pop();
                          Java.use(parts.join('.'))[m].implementation=null;
                          delete trackers[name]; sendMsg('trackerRemoved',{name:name});
                      });
                  } catch(e){ sendMsg('error',{fn:'removeTracker',msg:e.message}); }
              },
          
              startRecorder: function(){
                  recOn=true;
                  Java.perform(function(){
                      Java.enumerateLoadedClassesSync().forEach(function(cls){
                          try{
                              var jcls=Java.use(cls);
                              jcls.class.getDeclaredMethods().forEach(function(md){
                                  var mn=md.getName();
                                  try{
                                      jcls[mn].overloads.forEach(function(ovl){
                                          ovl.implementation=function(){
                                              if(!recOn){ovl.implementation=null;return this[mn].apply(this,arguments);}
                                              sendMsg('recorded',{cls:cls,method:mn,args:Array.from(arguments).map(String)});
                                              return this[mn].apply(this,arguments);
                                          };
                                      });
                                  }catch(ig){}
                              });
                          }catch(ig){}
                      });
                  });
                  sendMsg('recorderStarted',{});
              },
              stopRecorder: function(){ recOn=false; sendMsg('recorderStopped',{}); },
          
              startMonitor: function(){
                  monOn=true;
                  Java.perform(function(){
                      try{
                          var SSLCtx=Java.use('javax.net.ssl.SSLContext');
                          SSLCtx.init.overload(
                              '[Ljavax.net.ssl.KeyManager;',
                              '[Ljavax.net.ssl.TrustManager;',
                              'java.security.SecureRandom'
                          ).implementation=function(km,tm,sr){
                              sendMsg('sslInit',{note:'SSLContext.init intercepted'});
                              return this.init(km,tm,sr);
                          };
                      }catch(e){}
                      try{Java.use('okhttp3.OkHttpClient');sendMsg('monitorInfo',{note:'OkHttp detected'});}catch(e){}
                  });
                  sendMsg('monitorStarted',{});
              },
              stopMonitor: function(){ monOn=false; sendMsg('monitorStopped',{}); },
          
              evalScript: function(src){
                  try{ sendMsg('scriptResult',{result:String(eval(src))}); }
                  catch(e){ sendMsg('scriptError',{msg:e.message}); }
              },
          
              listLoadedClasses: function(){
                  try{
                      Java.perform(function(){
                          var list=Java.enumerateLoadedClassesSync();
                          sendMsg('classList',{classes:list});
                      });
                  }catch(e){ sendMsg('error',{fn:'listLoadedClasses',msg:e.message}); }
              },
          
              openClass: function(className){
                  try{
                      Java.perform(function(){
                          var jcls=Java.use(className);
                          sendMsg('classInfo',{
                              class:className,
                              methods:jcls.class.getDeclaredMethods().map(function(m){return m.getName();}),
                              fields: jcls.class.getDeclaredFields().map(function(f){return f.getName();})
                          });
                      });
                  }catch(e){ sendMsg('error',{fn:'openClass',msg:e.message}); }
              },
          
              listInstances: function(className){
                  try{
                      Java.perform(function(){
                          var list=[];
                          Java.choose(className,{
                              onMatch:function(i){list.push(String(i));if(list.length>=20)return 'stop';},
                              onComplete:function(){sendMsg('instanceList',{class:className,instances:list});}
                          });
                      });
                  }catch(e){ sendMsg('error',{fn:'listInstances',msg:e.message}); }
              },
          
              hookMethod:  function(cls,m){ this.addHook(cls+'.'+m,'noop',''); },
              trackMethod: function(cls,m){ this.addTracker(cls+'.'+m); },
              patchField:  function(cls,f){ sendMsg('info',{msg:'patchField: '+cls+'.'+f}); }
          };
          
          recv(function onMsg(msg){
              if(!msg){ recv(onMsg); return; }
              if(msg.type==='rpc'&&rpc.exports[msg.fn]){
                  var a=msg.args||{};
                  rpc.exports[msg.fn].apply(rpc.exports,Object.values(a));
              } else if(msg.type==='showKeyboard'){
                  Java.scheduleOnMainThread(function(){
                      try{
                          if(gET&&gIMM){
                              gET.requestFocus();
                              // 0 = SHOW_FORCED-less explicit request: r6 used
                              // 1 (SHOW_IMPLICIT) which the IME is free to
                              // ignore from a non-user focus path
                              gIMM.showSoftInput(gET,0);
                          }
                      }catch(e){}
                  });
              } else if(msg.type==='hideKeyboard'){
                  Java.scheduleOnMainThread(function(){
                      try{
                          if(gET&&gIMM){
                              var b=gET.getWindowToken();
                              if(b) gIMM.hideSoftInputFromWindow(b,0);
                          }
                      }catch(e){}
                  });
              }
              recv(onMsg);
          });
          
          sendMsg('ready',{msg:'Dex-tool agent loaded'});
          DXTAGNT

      - name: Embed agent.js as C array
        run: |
          cat > /tmp/gen_embed.js << 'DXTNJS'
          const fs    = require('fs');
          const data  = fs.readFileSync('agent/agent.js');
          const bytes = Array.from(data);
          let out = '// Auto-generated from agent/agent.js\n';
          out += '#pragma once\n#include <stddef.h>\n\n';
          out += 'static const char g_agent_js[] = {\n';
          let line = '';
          for (let i = 0; i < bytes.length; i++) {
              line += '0x' + bytes[i].toString(16).padStart(2,'0') + ',';
              if ((i+1)%16===0) { out += '    '+line+'\n'; line=''; }
          }
          if (line) out += '    '+line+'\n';
          out += '    0x00\n};\n';
          out += 'static const size_t g_agent_js_size = '+bytes.length+';\n';
          fs.writeFileSync('src/agent_bundle_embed.h', out);
          console.log('agent_bundle_embed.h: '+bytes.length+' bytes');
          DXTNJS
          node /tmp/gen_embed.js

