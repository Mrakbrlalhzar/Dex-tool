      # ═══════════════════════════════════════════════════════════
      # 25. GENERATE README
      # ═══════════════════════════════════════════════════════════
      - name: Generate README.md
        run: |
          cat > README.md << 'READMEEOF'
# Dex-tool

Standalone runtime instrumentation framework for Android APKs.
Ships as a single native shared library: libtool.so (armeabi-v7a + arm64-v8a).

## Usage

    1. Take any target APK.
    2. Drop libtool.so into lib/arm64-v8a/ and lib/armeabi-v7a/.
    3. Inject System.loadLibrary("tool") into the launcher activity smali
       or into an Application subclass.
    4. Copy smali-fat.jar into assets/.
    5. Re-sign and install.

## Architecture

    libtool.so
      |-- JNI_OnLoad: installs eglSwapBuffers hook via Dobby
      |-- eglSwapBuffers replacement (GL thread):
      |     |-- gum_init_embedded()  (first gum call, context valid)
      |     |-- spawns frida pthread
      |     |-- renders ImGui overlay
      |     |-- calls original eglSwapBuffers
      |-- frida_bridge: GumJS (QuickJS) + agent.js
      |-- agent.js: Java.*, hooking, patching, tracking, monitoring

## Menu Tabs

    Settings  - Font size, opacity, theme, scroll speed
    Patches   - Patch Java fields at runtime
    Hooks     - Hook methods (Java/Smali/noop modes)
    Tracker   - Log method calls with args/return values
    Recorder  - Record all Java method calls
    Monitor   - Network traffic interception (best-effort TLS)
    Script    - Run arbitrary Frida JS
    Classes   - Browse loaded classes, fields, methods, instances

## Diagnostic Files (written to /sdcard/Download/)

    dextool-boot.marker  - written by DexToolApp.onCreate BEFORE loadLibrary
    dextool-jni.marker   - written by JNI_OnLoad at 4 checkpoints
    dextool.log          - INFO level log
    dextool-debug.log    - DEBUG level log
    dextool-crash.log    - crash handler output

## Known Limitations

    - Smali runtime (Hooks tab, Smali mode) requires API 26+ for
      InMemoryDexClassLoader. Re-compiling the same class name requires
      a fresh ClassLoader instance per invocation.
    - Network monitor is best-effort: hooks Java HTTP layer and SSLContext.init.
      Native TLS (BoringSSL) requires additional Interceptor hooks not included
      in this initial release.
    - eglSwapBuffers hook requires the target app to use OpenGL ES 3.0+.
      ES 2.x targets will not render the ImGui overlay (graceful degradation).
    - gum_init_embedded is deferred to the first eglSwapBuffers call to ensure
      a valid EGL/GL context exists, avoiding early-init crashes.

## Build

    See .github/workflows/build.yml — fully self-contained CI build.
    All sources generated inside the workflow via heredoc.
    No prebuilt binaries; Frida, ImGui, Dobby all built from source.

## Components

    Frida-gum 16.7.19   QuickJS runtime (GumJS)
    Dobby               inline hook framework
    ImGui 1.90.4        immediate-mode GUI
    smali 3.0.7         runtime .smali -> DEX assembler (bundled as JAR)

## Minimum Requirements

    Android 8.0 (API 26), armeabi-v7a or arm64-v8a, OpenGL ES 3.0
READMEEOF
