                                         "##"/";" protocol corrupted values and
                                         the bare scan index gave later calls no
                                         receiver at all. The label is NOT run
                                         through jstr() - its | -> ! and # -> %
                                         rewrites were only needed by the old
                                         delimiter protocol. */
