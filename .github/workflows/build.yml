              addPatch:        ['class', 'field', 'value'],
              setPatchEnabled: ['class', 'field', 'enabled'],
              removePatch:     ['class', 'field'],
              addHook:         ['class', 'method', 'mode', 'code'],
              setHookEnabled:  ['class', 'method', 'enabled'],
              removeHook:      ['class', 'method'],
              addTracker:      ['class', 'method'],
              trackField:      ['class', 'field'],
              removeTracker:   ['name'],
              startRecorder:   ['filter', 'cap'],
              stopRecorder:    [],
              startMonitor:    [],
              stopMonitor:     [],
              evalScript:      ['src'],
              listLoadedClasses: ['filter', 'qid', 'mode', 'sys', 'cs'],
              getMethodSrc:    ['class', 'method'],
              getMethodIO:     ['class', 'method'],
              setMethodIO:     ['class', 'method', 'args', 'ret'],
              openClass:       ['class'],
              readStaticFields: ['class'],
              showIme:         [],
              hideIme:         [],
              listInstances:   ['class'],
              setInstanceField:['class', 'index', 'field', 'value', 'handle'],
              callMethod:      ['class', 'method', 'args', 'handle', 'count', 'main'],
              createInstance:  ['class']
          };
          agentLog('phase: deferred init scheduled');
          setTimeout(function () {
              try {
                  install_lifecycle();
              } catch (eL) {
                  agentLog('ERR lifecycle: ' + eL);
                  sendMsg('error', { fn: 'lifecycle',
                                     msg: String(eL && eL.message || eL) });
              }
              try {
                  installTouchHook();
              } catch (eT) {
                  agentLog('ERR touch hook: ' + eT);
                  sendMsg('error', { fn: 'touchhook',
                                     msg: String(eT && eT.message || eT) });
              }
              var pkgR = '';
              try {
                  var ATr = Java.use('android.app.ActivityThread');
                  var appR = ATr.currentApplication();
                  if (appR) pkgR = String(appR.getPackageName());
              } catch (eP) {}
              sendMsg('ready', { msg: 'Dex-tool agent r28 loaded', pkg: pkgR });
              agentLog('phase: ready sent');
          }, 0);
          DXTAGNT

      - name: Embed agent.js as C array
        run: |
          cat > /tmp/gen_embed.js << 'DXTNJS'
          const fs    = require('fs');
          const data  = fs.readFileSync('agent/agent.js');
          const bytes = Array.from(data);
          let out = '// Auto-generated from agent/agent.js\n';
          out += '#pragma once\n#include <stddef.h>\n\n';
          out += 'static const char g_agent_js[] = {\n';
          let line = '';
          for (let i = 0; i < bytes.length; i++) {
              line += '0x' + bytes[i].toString(16).padStart(2,'0') + ',';
              if ((i+1)%16===0) { out += '    '+line+'\n'; line=''; }
          }
          if (line) out += '    '+line+'\n';
          out += '    0x00\n};\n';
          out += 'static const size_t g_agent_js_size = '+bytes.length+';\n';
          fs.writeFileSync('src/agent_bundle_embed.h', out);
          console.log('agent_bundle_embed.h: '+bytes.length+' bytes');
          DXTNJS
          node /tmp/gen_embed.js

