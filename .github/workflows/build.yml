                  overlay_request_font_rebuild(s_font_size);
              ImGui::SliderFloat("Opacity", &s_opacity, .3f, 1.f);
              const char* th[] = {"Dark", "Light", "Classic"};
              ImGui::Combo("Theme", &s_theme, th, 3);
              ImGui::Separator();
