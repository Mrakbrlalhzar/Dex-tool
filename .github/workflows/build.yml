#pragma once
#include <jni.h>
#include <string>
#include <functional>

// Called from frida pthread — blocks until engine is torn down.
void frida_bridge_start(JavaVM* jvm);

// C++ → JS: post a message to the running GumScript.
// 'json' must be a valid JSON string.
void frida_post(const std::string& json);

// JS → C++: registered callback for messages coming from agent.
using MsgCallback = std::function<void(const std::string& json)>;
void frida_set_message_callback(MsgCallback cb);
FBHEOF

          cat > src/frida_bridge.cpp << 'FBCEOF'
#include "frida_bridge.h"
#include "logger.h"
#include "frida-gumjs.h"
#include <cstring>
#include <cstdlib>
#include <mutex>
#include <string>
#include <android/asset_manager.h>
#include <android/asset_manager_jni.h>

// The compiled agent bundle is embedded as a C array (generated below).
extern const char g_agent_js[];
extern const size_t g_agent_js_size;

static GumScriptBackend* g_backend  = nullptr;
static GumScript*        g_script   = nullptr;
static GMainLoop*        g_loop     = nullptr;
static GMainContext*     g_ctx      = nullptr;
static std::mutex        g_post_mtx;
static MsgCallback       g_msg_cb;

static void on_message(GumScript*   script,
                       const gchar* message,
                       GBytes*      data,
                       gpointer     user_data) {
    (void)script; (void)data; (void)user_data;
    if (g_msg_cb && message) g_msg_cb(std::string(message));
}

void frida_bridge_start(JavaVM* jvm) {
    (void)jvm;
    log_info("[frida_bridge] starting GumJS engine");

    g_ctx  = g_main_context_new();
    g_loop = g_main_loop_new(g_ctx, FALSE);
    g_main_context_push_thread_default(g_ctx);

    // QuickJS backend (V8 not compiled in)
    g_backend = gum_script_backend_obtain_qjs();
    if (!g_backend) {
        log_crash_raw("[frida_bridge] FATAL: could not obtain QJS backend\n");
        return;
    }

    GError* err = nullptr;
    // agent JS source is a plain JS string embedded at compile time
    g_script = gum_script_backend_create_sync(
                   g_backend,
                   "dextool-agent",
                   g_agent_js,
                   nullptr,
                   nullptr,
                   &err);

    if (!g_script || err) {
        char msg[512];
        snprintf(msg, sizeof(msg),
                 "[frida_bridge] script create failed: %s",
                 err ? err->message : "(null)");
        log_crash_raw(msg);
        if (err) g_error_free(err);
        return;
    }

    gum_script_set_message_handler(g_script, on_message, nullptr, nullptr);

    err = nullptr;
    gum_script_load_sync(g_script, nullptr, &err);
    if (err) {
        char msg[512];
        snprintf(msg, sizeof(msg),
                 "[frida_bridge] script load failed: %s", err->message);
        log_crash_raw(msg);
        g_error_free(err);
        return;
    }

    log_info("[frida_bridge] agent loaded, running main loop");
    g_main_loop_run(g_loop);
    log_info("[frida_bridge] main loop exited");
}

void frida_post(const std::string& json) {
    if (!g_script) return;
    std::lock_guard<std::mutex> lk(g_post_mtx);
    gum_script_post(g_script, json.c_str(), nullptr);
}

void frida_set_message_callback(MsgCallback cb) {
    g_msg_cb = cb;
}
FBCEOF
          echo "frida_bridge generated."

