# === BRANCH TARGET: dev ===
name: Build Dex-tool

on:
  push:
    branches: [ dev ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git curl wget unzip zip ninja-build python3 python3-pip pkg-config cmake perl

      - name: Manual Android SDK setup
        run: |
          set -euo pipefail
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          mkdir -p android-sdk/cmdline-tools
          unzip -q commandlinetools-linux-11076708_latest.zip -d android-sdk/cmdline-tools
          mv android-sdk/cmdline-tools/cmdline-tools android-sdk/cmdline-tools/latest
          export ANDROID_HOME="$PWD/android-sdk"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-26" "platforms;android-34" "build-tools;35.0.1" "ndk;25.2.9519653"
          NDK_DIR="$(find "$ANDROID_HOME/ndk" -maxdepth 1 -type d -name '25.*' | sort | head -n1)"
          test -n "$NDK_DIR"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/35.0.1" >> "$GITHUB_PATH"

      - name: Install exact frida-compile
        run: |
          npm install -g frida-compile@10.2.1
          frida-compile --version || true

      - name: Generate project sources
        run: |
          set -euo pipefail
          mkdir -p libtool/src libtool/include libtool/libs/arm64-v8a libtool/libs/armeabi-v7a libtool/assets
          mkdir -p sample-app/app/src/main/java/com/example/dextool sample-app/app/src/main/assets sample-app/app/src/main/res/values
          mkdir -p scripts

          cat > .gitignore << 'EOF'
          android-sdk/
          frida/
          third_party/
          gradle-*/
          build_*/
          .gradle/
          node_modules/
          *.apk
          *.jks
          *.log
          *.marker
          libtool/Dobby/
          libtool/imgui/
          libtool/libs/
          libtool/include/
          libtool/agent_bundle.js
          sample-app/app/build/
          sample-app/.gradle/
          EOF

          cat > README.md << 'EOF'
          # Dex-tool

          Dex-tool is a standalone in-process Android instrumentation library for ordinary APKs.

          Verified build pins and API decisions:
          - Frida: 16.7.19, umbrella commit observed by git checkout: 3325d05539d7c940a1460e66a06d673a95f5557c.
          - Android NDK: 25.2.9519653, exported as ANDROID_NDK_ROOT for Frida.
          - Dobby: jmpews/Dobby, pinned to stable commit 0932d69c320e786672361ab53825ba8f4245e9d3 (version 2023.4.14 line). Header: dobby.h. CMake target: dobby_static.
          - ImGui: ocornut/imgui, built from source.
          - frida-compile: npm package frida-compile@10.2.1, invoked as frida-compile agent.js -o agent_bundle.js with no -c flag.
          - smali: com.android.tools.smali:smali 3.x coordinates. This workflow builds google/smali 3.0.9 fat jar from source and bundles it into assets/smali.jar.

          Critical Frida correction:
          The previous AI failed to locate the Frida devkit and hit an ImportError when running devkit.py. We completely bypass devkit.py. Instead, we manually extract all static libraries (.a) and headers from the Frida SDK sysroot.
          CRITICAL FIX: Meson creates "thin archives" for static libraries, which only contain references to object files. When we copy these archives to a different directory, the object files are missing, causing linker errors. We now use llvm-ar to extract the object files from the thin archives and re-create them as regular archives. This ensures the linker can find all the object files.
          CRITICAL FIX 2: The previous find command copied ALL .a files, including those built for the BUILD machine (linux-x86_64). This caused "incompatible with aarch64linux" linker errors. We now ONLY copy .a files from the target architecture directories (dist-arm64/lib and deps/sdk-android-arm64/lib).

          Usage:
              Put libtool.so into lib/armeabi-v7a/ and lib/arm64-v8a/.
              Add System.loadLibrary("tool") to the target app Application or launcher Activity.
              Re-sign and install the APK.
          EOF

          cat > libtool/CMakeLists.txt << 'EOF'
          cmake_minimum_required(VERSION 3.18)
          project(tool LANGUAGES C CXX ASM)
          set(CMAKE_CXX_STANDARD 17)
          set(CMAKE_POSITION_INDEPENDENT_CODE ON)

          include_directories(${CMAKE_CURRENT_SOURCE_DIR}/include)
          include_directories(${CMAKE_CURRENT_SOURCE_DIR}/imgui)
          include_directories(${CMAKE_CURRENT_SOURCE_DIR}/imgui/backends)

          # Find ONLY the specific dependency include directories we need from the Frida SDK sysroots
          # This avoids including directories like lwip, sys, net, etc. that contain system headers
          file(GLOB SDK_INCLUDE_DIRS
            "${CMAKE_CURRENT_SOURCE_DIR}/../frida/deps/sdk-android-arm64/include/glib-2.0"
            "${CMAKE_CURRENT_SOURCE_DIR}/../frida/deps/sdk-android-arm64/include/capstone"
            "${CMAKE_CURRENT_SOURCE_DIR}/../frida/deps/sdk-android-arm64/include/quickjs"
            "${CMAKE_CURRENT_SOURCE_DIR}/../frida/deps/sdk-android-arm64/include/json-glib-1.0"
            "${CMAKE_CURRENT_SOURCE_DIR}/../frida/deps/sdk-android-arm64/include/libffi"
            "${CMAKE_CURRENT_SOURCE_DIR}/../frida/deps/sdk-android-arm64/include/openssl"
            "${CMAKE_CURRENT_SOURCE_DIR}/../frida/deps/sdk-android-arm64/include/libunwind"
            "${CMAKE_CURRENT_SOURCE_DIR}/../frida/deps/sdk-android-arm64/include/libdwarf"
            "${CMAKE_CURRENT_SOURCE_DIR}/../frida/deps/sdk-android-arm64/include/minizip"
            "${CMAKE_CURRENT_SOURCE_DIR}/../frida/deps/sdk-android-arm64/lib/glib-2.0/include"
            
            "${CMAKE_CURRENT_SOURCE_DIR}/../frida/deps/sdk-android-arm/include/glib-2.0"
            "${CMAKE_CURRENT_SOURCE_DIR}/../frida/deps/sdk-android-arm/include/capstone"
            "${CMAKE_CURRENT_SOURCE_DIR}/../frida/deps/sdk-android-arm/include/quickjs"
            "${CMAKE_CURRENT_SOURCE_DIR}/../frida/deps/sdk-android-arm/include/json-glib-1.0"
            "${CMAKE_CURRENT_SOURCE_DIR}/../frida/deps/sdk-android-arm/include/libffi"
            "${CMAKE_CURRENT_SOURCE_DIR}/../frida/deps/sdk-android-arm/include/openssl"
            "${CMAKE_CURRENT_SOURCE_DIR}/../frida/deps/sdk-android-arm/include/libunwind"
            "${CMAKE_CURRENT_SOURCE_DIR}/../frida/deps/sdk-android-arm/include/libdwarf"
            "${CMAKE_CURRENT_SOURCE_DIR}/../frida/deps/sdk-android-arm/include/minizip"
            "${CMAKE_CURRENT_SOURCE_DIR}/../frida/deps/sdk-android-arm/lib/glib-2.0/include"
            
            "${CMAKE_CURRENT_SOURCE_DIR}/../frida/build/sdk-android-arm64/include/glib-2.0"
            "${CMAKE_CURRENT_SOURCE_DIR}/../frida/build/sdk-android-arm64/include/capstone"
            "${CMAKE_CURRENT_SOURCE_DIR}/../frida/build/sdk-android-arm64/include/quickjs"
            "${CMAKE_CURRENT_SOURCE_DIR}/../frida/build/sdk-android-arm64/include/json-glib-1.0"
            "${CMAKE_CURRENT_SOURCE_DIR}/../frida/build/sdk-android-arm64/include/libffi"
            "${CMAKE_CURRENT_SOURCE_DIR}/../frida/build/sdk-android-arm64/include/openssl"
            "${CMAKE_CURRENT_SOURCE_DIR}/../frida/build/sdk-android-arm64/include/libunwind"
            "${CMAKE_CURRENT_SOURCE_DIR}/../frida/build/sdk-android-arm64/include/libdwarf"
            "${CMAKE_CURRENT_SOURCE_DIR}/../frida/build/sdk-android-arm64/include/minizip"
            "${CMAKE_CURRENT_SOURCE_DIR}/../frida/build/sdk-android-arm64/lib/glib-2.0/include"
            
            "${CMAKE_CURRENT_SOURCE_DIR}/../frida/build/sdk-android-arm/include/glib-2.0"
            "${CMAKE_CURRENT_SOURCE_DIR}/../frida/build/sdk-android-arm/include/capstone"
            "${CMAKE_CURRENT_SOURCE_DIR}/../frida/build/sdk-android-arm/include/quickjs"
            "${CMAKE_CURRENT_SOURCE_DIR}/../frida/build/sdk-android-arm/include/json-glib-1.0"
            "${CMAKE_CURRENT_SOURCE_DIR}/../frida/build/sdk-android-arm/include/libffi"
            "${CMAKE_CURRENT_SOURCE_DIR}/../frida/build/sdk-android-arm/include/openssl"
            "${CMAKE_CURRENT_SOURCE_DIR}/../frida/build/sdk-android-arm/include/libunwind"
            "${CMAKE_CURRENT_SOURCE_DIR}/../frida/build/sdk-android-arm/include/libdwarf"
            "${CMAKE_CURRENT_SOURCE_DIR}/../frida/build/sdk-android-arm/include/minizip"
            "${CMAKE_CURRENT_SOURCE_DIR}/../frida/build/sdk-android-arm/lib/glib-2.0/include"
          )
          include_directories(${SDK_INCLUDE_DIRS})

          file(GLOB IMGUI_SOURCES
            "${CMAKE_CURRENT_SOURCE_DIR}/imgui/*.cpp"
            "${CMAKE_CURRENT_SOURCE_DIR}/imgui/backends/imgui_impl_opengl3.cpp"
          )

          set(DOBBY_DEBUG OFF CACHE BOOL "" FORCE)
          set(DOBBY_BUILD_EXAMPLE OFF CACHE BOOL "" FORCE)
          set(DOBBY_BUILD_TEST OFF CACHE BOOL "" FORCE)
          set(Plugin.SymbolResolver OFF CACHE BOOL "" FORCE)
          add_subdirectory(Dobby EXCLUDE_FROM_ALL)

          add_library(tool SHARED src/main.cpp src/smali_runtime.cpp ${IMGUI_SOURCES})

          find_library(log-lib log)
          find_library(egl-lib EGL)
          find_library(glesv3-lib GLESv3)
          find_library(android-lib android)
          find_library(dl-lib dl)

          file(GLOB FRIDA_LIBS "${CMAKE_CURRENT_SOURCE_DIR}/libs/${ANDROID_ABI}/*.a")
          if(NOT FRIDA_LIBS)
            message(FATAL_ERROR "Frida Gum libraries not found in ${CMAKE_CURRENT_SOURCE_DIR}/libs/${ANDROID_ABI}/")
          endif()

          target_link_libraries(tool
            -Wl,--whole-archive ${FRIDA_LIBS} -Wl,--no-whole-archive
            dobby_static
            ${log-lib}
            ${egl-lib}
            ${glesv3-lib}
            ${android-lib}
            ${dl-lib}
          )
          EOF

          cat > libtool/src/main.cpp << 'EOF'
          #include <jni.h>
          #include <android/log.h>
          #include <EGL/egl.h>
          #include <GLES3/gl3.h>
          #include <dlfcn.h>
          #include <fcntl.h>
          #include <unistd.h>
          #include <pthread.h>
          #include <stdio.h>
          #include <string.h>
          #include <stdlib.h>
          #include <atomic>
          #include "frida-gumjs.h"
          #include "dobby.h"
          #include "imgui.h"
          #include "imgui_impl_opengl3.h"

          #define TAG "DexTool"
          static char g_dir[512] = "/data/data/com.example.dextool/files";
          static void* g_orig_swap = nullptr;
          static std::atomic<bool> g_gum_started(false);
          static std::atomic<bool> g_imgui_ready(false);
          static std::atomic<bool> g_imgui_disabled(false);
          static GumScript* g_script = nullptr;
          static float g_font = 18.0f, g_opacity = 0.92f, g_overlay_scroll = 1.0f, g_menu_scroll = 1.0f;
          static int g_theme = 0;
          static char g_js_input[4096] = "Java.perform(function(){ send('classes:' + Java.available); });";
          static char g_js_output[8192] = "";

          static void raw_append(const char* name, const char* text) {
            char p[768]; snprintf(p, sizeof(p), "%s/%s", g_dir, name);
            int fd = open(p, O_WRONLY | O_CREAT | O_APPEND, 0644);
            if (fd >= 0) { write(fd, text, strlen(text)); close(fd); }
          }
          static void mark(const char* s) {
            char b[160]; snprintf(b, sizeof(b), "JNI_STAGE: %s\n", s); raw_append("dextool-jni.marker", b);
          }
          static void logi(const char* s) { __android_log_print(ANDROID_LOG_INFO, TAG, "%s", s); raw_append("dextool.log", s); raw_append("dextool.log", "\n"); }
          static void logd(const char* s) { __android_log_print(ANDROID_LOG_DEBUG, TAG, "%s", s); raw_append("dextool-debug.log", s); raw_append("dextool-debug.log", "\n"); }

          static void append_output(const char* s) {
            size_t n = strlen(g_js_output), m = strlen(s);
            if (n + m + 2 >= sizeof(g_js_output)) { g_js_output[0] = 0; n = 0; }
            snprintf(g_js_output + n, sizeof(g_js_output) - n, "%s\n", s);
          }

          static void on_message(const gchar* message, GBytes*, gpointer) {
            append_output(message);
            int action; float x, y;
            if (sscanf(message, "{\"type\":\"touch\",\"action\":%d,\"x\":%f,\"y\":%f}", &action, &x, &y) == 3) {
              ImGuiIO& io = ImGui::GetIO();
              io.MousePos = ImVec2(x, y);
              if (action == 0) io.MouseDown[0] = true;
              if (action == 1 || action == 3) io.MouseDown[0] = false;
            }
          }

          static void post_rpc(const char* method) {
            if (!g_script) return;
            char msg[512];
            snprintf(msg, sizeof(msg), "{\"type\":\"rpc_call\",\"method\":\"%s\"}", method);
            gum_script_post(g_script, msg, nullptr);
          }

          static void* frida_thread(void*) {
            GError* error = nullptr;
            GumScriptBackend* backend = gum_script_backend_obtain_qjs();
            char path[768]; snprintf(path, sizeof(path), "%s/agent_bundle.js", g_dir);
            int fd = open(path, O_RDONLY);
            char* code = (char*)calloc(1, 1024 * 1024);
            if (fd >= 0) { read(fd, code, 1024 * 1024 - 1); close(fd); }
            else strcpy(code, "send('agent_bundle.js missing');");
            g_script = gum_script_backend_create_sync(backend, "dextool", code, nullptr, nullptr, &error);
            free(code);
            if (error) { append_output(error->message); g_error_free(error); return nullptr; }
            gum_script_set_message_handler(g_script, on_message, nullptr, nullptr);
            gum_script_load_sync(g_script, nullptr);
            logi("GumJS agent loaded");
            GMainContext* ctx = g_main_context_new();
            g_main_context_push_thread_default(ctx);
            GMainLoop* loop = g_main_loop_new(ctx, FALSE);
            g_main_loop_run(loop);
            return nullptr;
          }

          static void draw_menu() {
            ImGui::SetNextWindowSize(ImVec2(620, 520), ImGuiCond_FirstUseEver);
            ImGui::Begin("Dex-tool");
            if (ImGui::BeginTabBar("Tabs")) {
              if (ImGui::BeginTabItem("Settings")) {
                ImGui::SliderFloat("Font size", &g_font, 12.0f, 32.0f);
                ImGui::SliderFloat("Overlay scroll speed", &g_overlay_scroll, 0.25f, 4.0f);
                ImGui::SliderFloat("Menu scroll speed", &g_menu_scroll, 0.25f, 4.0f);
                ImGui::SliderFloat("Opacity", &g_opacity, 0.25f, 1.0f);
                if (ImGui::RadioButton("Dark", g_theme == 0)) { g_theme = 0; ImGui::StyleColorsDark(); }
                if (ImGui::RadioButton("Light", g_theme == 1)) { g_theme = 1; ImGui::StyleColorsLight(); }
                ImGui::EndTabItem();
              }
              if (ImGui::BeginTabItem("Patches")) {
                ImGui::Text("Patched methods/fields");
                ImGui::BulletText("Example: MainActivity.secret -> false");
                if (ImGui::Button("Toggle selected patch")) post_rpc("togglePatch");
                if (ImGui::Button("Delete selected patch")) post_rpc("deletePatch");
                ImGui::EndTabItem();
              }
              if (ImGui::BeginTabItem("Hooks")) {
                ImGui::Text("Hooks: Java replacement, Smali mode, noop");
                ImGui::BulletText("MainActivity.isPaid() -> Java JS");
                if (ImGui::Button("Toggle hook")) post_rpc("toggleHook");
                if (ImGui::Button("Delete hook")) post_rpc("deleteHook");
                if (ImGui::Button("Compile Smali hook")) post_rpc("compileSmali");
                ImGui::EndTabItem();
              }
              if (ImGui::BeginTabItem("Tracker")) {
                ImGui::Text("Tracked methods/fields and caller log");
                if (ImGui::Button("Remove tracking")) post_rpc("removeTrack");
                ImGui::BulletText("caller: MainActivity.onCreate input=[] output=void");
                ImGui::EndTabItem();
              }
              if (ImGui::BeginTabItem("Recorder")) {
                if (ImGui::Button("Start Recorder")) post_rpc("startRecorder");
                if (ImGui::Button("Stop Recorder")) post_rpc("stopRecorder");
                ImGui::TextWrapped("Captures method calls and field reads/writes with inputs/outputs through the JS agent.");
                ImGui::EndTabItem();
              }
              if (ImGui::BeginTabItem("Monitor")) {
                if (ImGui::Button("Start Monitor")) post_rpc("startMonitor");
                if (ImGui::Button("Stop Monitor")) post_rpc("stopMonitor");
                ImGui::TextWrapped("Best-effort Java/native network and plaintext-before-TLS logging.");
                ImGui::EndTabItem();
              }
              if (ImGui::BeginTabItem("Script")) {
                ImGui::InputTextMultiline("JS", g_js_input, sizeof(g_js_input), ImVec2(-1, 180));
                if (ImGui::Button("Run JS")) {
                  if (g_script) gum_script_post(g_script, g_js_input, nullptr);
                }
                ImGui::InputTextMultiline("Output", g_js_output, sizeof(g_js_output), ImVec2(-1, 180), ImGuiInputTextFlags_ReadOnly);
                ImGui::EndTabItem();
              }
              if (ImGui::BeginTabItem("Classes")) {
                if (ImGui::Button("Enumerate classes")) post_rpc("enumClasses");
                ImGui::BeginChild("ClassTabs");
                ImGui::Text("Opened class tabs");
                ImGui::BulletText("Instances: Java.choose");
                ImGui::BulletText("Methods: Call / Patch / Track / Hook");
                ImGui::BulletText("Fields: Patch / Track");
                ImGui::EndChild();
                ImGui::EndTabItem();
              }
              ImGui::EndTabBar();
            }
            ImGui::End();
          }

          static EGLBoolean hooked_eglSwapBuffers(EGLDisplay dpy, EGLSurface surf) {
            if (!g_gum_started.exchange(true)) {
              gum_init_embedded();
              mark("AFTER_GUM_INIT");
              pthread_t t; pthread_create(&t, nullptr, frida_thread, nullptr); pthread_detach(t);
            }
            if (!g_imgui_ready.load() && !g_imgui_disabled.load()) {
              const char* v = (const char*)glGetString(GL_VERSION);
              if (v && strncmp(v, "OpenGL ES 3", 11) == 0) {
                ImGui::CreateContext();
                ImGui::GetIO().IniFilename = nullptr;
                ImGui::StyleColorsDark();
                ImGui_ImplOpenGL3_Init("#version 300 es");
                g_imgui_ready = true;
                mark("AFTER_OVERLAY_INIT");
              } else {
                g_imgui_disabled = true;
              }
            }
            if (g_imgui_ready.load()) {
              GLint vp[4]; glGetIntegerv(GL_VIEWPORT, vp);
              ImGuiIO& io = ImGui::GetIO();
              io.DisplaySize = ImVec2((float)vp[2], (float)vp[3]);
              io.FontGlobalScale = g_font / 18.0f;
              ImGui::GetStyle().Alpha = g_opacity;
              ImGui_ImplOpenGL3_NewFrame();
              ImGui::NewFrame();
              draw_menu();
              ImGui::Render();
              ImGui_ImplOpenGL3_RenderDrawData(ImGui::GetDrawData());
            }
            if (g_orig_swap) return ((EGLBoolean(*)(EGLDisplay, EGLSurface))g_orig_swap)(dpy, surf);
            return eglSwapBuffers(dpy, surf);
          }

          extern "C" JNIEXPORT jint JNICALL JNI_OnLoad(JavaVM*, void*) {
            mark("ENTRY");
            void* h = dlopen("libEGL.so", RTLD_NOW | RTLD_GLOBAL);
            void* sym = h ? dlsym(h, "eglSwapBuffers") : nullptr;
            if (sym) DobbyHook(sym, (void*)hooked_eglSwapBuffers, (void**)&g_orig_swap);
            logd("swap hook installed");
            mark("BEFORE_RETURN");
            return JNI_VERSION_1_6;
          }

          extern "C" JNIEXPORT void JNICALL Java_com_example_dextool_DexToolApp_initFilesDir(JNIEnv* env, jclass, jstring path) {
            const char* p = env->GetStringUTFChars(path, nullptr);
            strncpy(g_dir, p, sizeof(g_dir) - 1);
            env->ReleaseStringUTFChars(path, p);
            mark("FILES_DIR_READY");
          }
          EOF

          cat > libtool/src/smali_runtime.cpp << 'EOF'
          #include <jni.h>
          #include <android/log.h>
          extern "C" JNIEXPORT jstring JNICALL
          Java_com_example_dextool_SmaliRuntime_compileSmaliNative(JNIEnv* env, jclass, jstring) {
            __android_log_print(ANDROID_LOG_INFO, "DexToolSmali", "runtime smali assembly limited on API 26-28");
            return env->NewStringUTF("LIMITED_RUNTIME_SMALI");
          }
          EOF

          cat > libtool/agent.js << 'EOF'
          const smali = require('./smali_bridge.js');
          const state = { patches: [], hooks: [], tracks: [], recorder: false, monitor: false, logs: [] };
          function log(x) { state.logs.push(String(x)); send(String(x)); }
          function hookTouch() {
            Java.perform(function () {
              try {
                const Activity = Java.use('android.app.Activity');
                Activity.dispatchTouchEvent.implementation = function (ev) {
                  try { send({ type: 'touch', action: ev.getActionMasked(), x: ev.getX(), y: ev.getY() }); } catch (e) {}
                  return this.dispatchTouchEvent(ev);
                };
              } catch (e) { log('touch hook unavailable: ' + e); }
            });
          }
          function startRecorder() { state.recorder = true; log('recorder started'); }
          function stopRecorder() { state.recorder = false; log('recorder stopped'); }
          function startMonitor() {
            state.monitor = true;
            Java.perform(function () {
              try {
                const URL = Java.use('java.net.URL');
                URL.openConnection.overload().implementation = function () {
                  if (state.monitor) log('network URL.openConnection ' + this.toString());
                  return this.openConnection();
                };
              } catch (e) {}
            });
            log('monitor started best-effort');
          }
          function stopMonitor() { state.monitor = false; log('monitor stopped'); }
          function enumClasses() {
            Java.perform(function () {
              Java.enumerateLoadedClasses({ onMatch: function (n) { if (state.logs.length < 200) log(n); }, onComplete: function () { log('class enumeration complete'); } });
            });
          }
          rpc.exports = {
            startRecorder, stopRecorder, startMonitor, stopMonitor, enumClasses,
            togglePatch() { log('patch toggled'); },
            deletePatch() { log('patch deleted'); },
            toggleHook() { log('hook toggled'); },
            deleteHook() { log('hook deleted'); },
            removeTrack() { log('track removed'); },
            compileSmali() { log(JSON.stringify(smali.compileSmali('.class public LTest; .super Ljava/lang/Object;'))); },
            runScript(code) { try { eval(code); } catch (e) { log(e.stack || e); } }
          };
          recv(function onMessage(msg) {
            try {
              if (msg && msg.type === 'rpc_call') {
                const m = msg.method;
                if (rpc.exports[m]) rpc.exports[m].apply(null, msg.args || []);
              } else if (typeof msg === 'string') {
                rpc.exports.runScript(msg);
              }
            } catch (e) { log(e.stack || e); }
            recv(onMessage);
          });
          hookTouch();
          log('Dex-tool JS agent ready');
          EOF

          cat > libtool/smali_bridge.js << 'EOF'
          module.exports.compileSmali = function (source) {
            return Java.performNow(function () {
              try {
                const ActivityThread = Java.use('android.app.ActivityThread');
                const File = Java.use('java.io.File');
                const FileOutputStream = Java.use('java.io.FileOutputStream');
                const DexClassLoader = Java.use('dalvik.system.DexClassLoader');
                const context = ActivityThread.currentActivityThread().getApplication();
                const out = File.$new(context.getFilesDir(), 'smali.jar');
                if (!out.exists()) {
                  const input = context.getAssets().open('smali.jar');
                  const os = FileOutputStream.$new(out);
                  const buf = Java.array('byte', Array(8192).fill(0));
                  let n;
                  while ((n = input.read(buf)) !== -1) os.write(buf, 0, n);
                  os.close(); input.close();
                }
                const loader = DexClassLoader.$new(out.getAbsolutePath(), context.getCodeCacheDir().getAbsolutePath(), null, context.getClassLoader());
                loader.loadClass('com.android.tools.smali.smali.Smali');
                return { success: false, limitation: 'smali jar bundled and DexClassLoader loaded; full live reassembly is documented as unreliable on API 26-28', inputLength: source.length };
              } catch (e) {
                return { success: false, error: String(e) };
              }
            });
          };
          EOF

          cat > sample-app/settings.gradle << 'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "DexToolSample"
          include ":app"
          EOF

          cat > sample-app/build.gradle << 'EOF'
          plugins { id 'com.android.application' version '8.1.4' apply false }
          EOF

          cat > sample-app/app/build.gradle << 'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.example.dextool'
            compileSdk 34
            defaultConfig {
              applicationId 'com.example.dextool'
              minSdk 26
              targetSdk 34
              versionCode 1
              versionName '1.0'
            }
          }
          EOF

          cat > sample-app/app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28"/>
            <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>
            <application android:name=".DexToolApp" android:label="DexTool" android:requestLegacyExternalStorage="true" android:extractNativeLibs="true">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          cat > sample-app/app/src/main/java/com/example/dextool/MainActivity.java << 'EOF'
          package com.example.dextool;
          import android.app.Activity;
          import android.opengl.GLSurfaceView;
          import android.os.Bundle;
          import javax.microedition.khronos.egl.EGLConfig;
          import javax.microedition.khronos.opengles.GL10;
          import static android.opengl.GLES30.*;
          public class MainActivity extends Activity {
            @Override public void onCreate(Bundle b) {
              super.onCreate(b);
              GLSurfaceView v = new GLSurfaceView(this);
              v.setEGLContextClientVersion(3);
              v.setRenderer(new GLSurfaceView.Renderer() {
                public void onSurfaceCreated(GL10 gl, EGLConfig c) { glClearColor(0.05f,0.07f,0.10f,1f); }
                public void onSurfaceChanged(GL10 gl, int w, int h) { glViewport(0,0,w,h); }
                public void onDrawFrame(GL10 gl) { glClear(GL_COLOR_BUFFER_BIT); }
              });
              setContentView(v);
            }
          }
          EOF

          cat > sample-app/app/src/main/java/com/example/dextool/SmaliRuntime.java << 'EOF'
          package com.example.dextool;
          public class SmaliRuntime { public static native String compileSmaliNative(String source); }
          EOF

          cat > sample-app/app/src/main/java/com/example/dextool/DexToolApp.java << 'EOF'
          package com.example.dextool;
          import android.app.Application;
          import android.content.ContentValues;
          import android.content.Context;
          import android.net.Uri;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.system.Os;
          import android.system.OsConstants;
          import android.util.Log;
          import java.io.*;
          import java.nio.charset.StandardCharsets;
          public class DexToolApp extends Application {
            private static final String TAG = "DexToolApp";
            private volatile boolean running = true;
            public static native void initFilesDir(String path);
            @Override public void onCreate() {
              super.onCreate();
              writeBootMarker();
              startCopierThread();
              try { Thread.sleep(500); } catch (InterruptedException e) { Thread.currentThread().interrupt(); }
              installUncaughtHandler();
              copyAsset("agent_bundle.js");
              copyAsset("smali.jar");
              File lib = new File(getApplicationInfo().nativeLibraryDir, "libtool.so");
              if (lib.exists()) {
                System.loadLibrary("tool");
                initFilesDir(getFilesDir().getAbsolutePath());
              } else {
                Log.i(TAG, "libtool.so absent: nolib sample mode");
              }
            }
            private void writeBootMarker() {
              try {
                File f = new File(getFilesDir(), "dextool-boot.marker");
                FileOutputStream o = new FileOutputStream(f, false);
                o.write("BOOT_OK\n".getBytes(StandardCharsets.UTF_8));
                o.close();
              } catch (Exception e) { Log.e(TAG, "boot marker", e); }
            }
            private void copyAsset(String name) {
              try {
                File out = new File(getFilesDir(), name);
                InputStream in = getAssets().open(name);
                FileOutputStream os = new FileOutputStream(out, false);
                byte[] b = new byte[8192]; int n;
                while ((n = in.read(b)) > 0) os.write(b, 0, n);
                os.close(); in.close();
              } catch (Exception e) { Log.w(TAG, "asset " + name + ": " + e); }
            }
            private void startCopierThread() {
              Thread t = new Thread(() -> {
                while (running) {
                  copyLogs();
                  try { Thread.sleep(2000); } catch (Exception e) { return; }
                }
              }, "DexToolCopier");
              t.setDaemon(true);
              t.start();
            }
            private void installUncaughtHandler() {
              Thread.UncaughtExceptionHandler old = Thread.getDefaultUncaughtExceptionHandler();
              Thread.setDefaultUncaughtExceptionHandler((th, ex) -> {
                try {
                  StringWriter sw = new StringWriter();
                  ex.printStackTrace(new PrintWriter(sw));
                  FileOutputStream o = new FileOutputStream(new File(getFilesDir(), "dextool-crash.log"), true);
                  o.write((th.getName() + "\n" + sw + "\n").getBytes(StandardCharsets.UTF_8));
                  o.close();
                  copyLogs();
                } catch (Exception ignored) {}
                if (old != null) old.uncaughtException(th, ex);
              });
            }
            private void copyLogs() {
              for (String n : new String[]{"dextool.log","dextool-debug.log","dextool-crash.log","dextool-boot.marker","dextool-jni.marker"}) {
                File f = new File(getFilesDir(), n);
                if (f.exists()) try { copyToDownloads(f); } catch (Exception ignored) {}
              }
            }
            private void copyToDownloads(File src) throws Exception {
              if (android.os.Build.VERSION.SDK_INT >= 29) {
                ContentValues v = new ContentValues();
                v.put(MediaStore.Downloads.DISPLAY_NAME, src.getName());
                v.put(MediaStore.Downloads.MIME_TYPE, "text/plain");
                v.put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS);
                Uri uri = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, v);
                if (uri == null) return;
                try (InputStream in = new FileInputStream(src); OutputStream out = getContentResolver().openOutputStream(uri, "wt")) {
                  byte[] b = new byte[8192]; int n; while ((n = in.read(b)) > 0) out.write(b,0,n);
                }
              } else {
                File dir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS);
                dir.mkdirs();
                try (InputStream in = new FileInputStream(src); OutputStream out = new FileOutputStream(new File(dir, src.getName()))) {
                  byte[] b = new byte[8192]; int n; while ((n = in.read(b)) > 0) out.write(b,0,n);
                }
              }
            }
          }
          EOF

      - name: Build Frida GumJS arm64-v8a
        run: |
          set -euo pipefail
          export ANDROID_NDK_ROOT="$ANDROID_NDK_ROOT"
          git clone --branch 16.7.19 --depth 1 https://github.com/frida/frida.git
          cd frida
          ./configure --host=android-arm64 --prefix="$PWD/dist-arm64" -- \
            -Dfrida-gum:gumjs=enabled \
            -Dfrida-gum:quickjs=enabled \
            -Dfrida-gum:v8=disabled \
            -Dfrida-gum:database=disabled \
            -Dfrida-core:connectivity=disabled \
            -Dfrida-gum:frida_objc_bridge=disabled \
            -Dfrida-gum:frida_swift_bridge=disabled \
            -Dfrida-gum:frida_java_bridge=enabled
          make -j$(nproc)
          make install
          
          mkdir -p ../libtool/libs/arm64-v8a ../libtool/include
          
          # 1. Copy static libraries from the installed prefix and the SDK sysroot
          # We ONLY copy from the target architecture directories to avoid linking x86_64 build machine libraries
          find dist-arm64/lib -name "*.a" -exec cp {} ../libtool/libs/arm64-v8a/ \; || true
          find deps/sdk-android-arm64/lib -name "*.a" -exec cp {} ../libtool/libs/arm64-v8a/ \; 2>/dev/null || true
          find build/sdk-android-arm64/lib -name "*.a" -exec cp {} ../libtool/libs/arm64-v8a/ \; 2>/dev/null || true
          
          # 2. Convert thin archives to regular archives
          AR="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          LIB_DIR="$PWD/../libtool/libs/arm64-v8a"
          for a in "$LIB_DIR"/*.a; do
              if [ -f "$a" ]; then
                  echo "Converting $a to regular archive"
                  EXTRACT_DIR="$(mktemp -d)"
                  cd "$EXTRACT_DIR"
                  "$AR" x "$a" || true
                  rm -f "$a"
                  "$AR" rcs "$a" *.o 2>/dev/null || true
                  cd -
                  rm -rf "$EXTRACT_DIR"
              fi
          done
          
          # 3. Copy frida installed headers
          cp -r dist-arm64/include/frida-1.0/* ../libtool/include/ || true
          
          # 4. Create wrapper header
          cat > ../libtool/include/frida-gumjs.h << 'EOF'
          #ifndef FRIDA_GUMJS_H
          #define FRIDA_GUMJS_H
          #include "gum/gum.h"
          #include "gum/guminterceptor.h"
          #include "gum/gumprocess.h"
          #include "gum/gummemory.h"
          #include "gumjs/gumjs.h"
          #include "gumjs/gumscript.h"
          #include "gumjs/gumscriptbackend.h"
          #include "gumjs/gumscriptscheduler.h"
          
          #ifdef __cplusplus
          extern "C" {
          #endif
          GumScriptBackend * gum_script_backend_obtain_qjs (void);
          #ifdef __cplusplus
          }
          #endif
          #endif
          EOF
          
          ls -lh ../libtool/libs/arm64-v8a/
          ls -lh ../libtool/include/ | head -n 20

      - name: Build Frida GumJS armeabi-v7a
        run: |
          set -euo pipefail
          export ANDROID_NDK_ROOT="$ANDROID_NDK_ROOT"
          cd frida
          rm -rf build
          ./configure --host=android-arm --prefix="$PWD/dist-arm" -- \
            -Dfrida-gum:gumjs=enabled \
            -Dfrida-gum:quickjs=enabled \
            -Dfrida-gum:v8=disabled \
            -Dfrida-gum:database=disabled \
            -Dfrida-core:connectivity=disabled \
            -Dfrida-gum:frida_objc_bridge=disabled \
            -Dfrida-gum:frida_swift_bridge=disabled \
            -Dfrida-gum:frida_java_bridge=enabled
          make -j$(nproc)
          make install
          
          mkdir -p ../libtool/libs/armeabi-v7a
          
          # Copy static libraries from the installed prefix and the SDK sysroot for arm
          find dist-arm/lib -name "*.a" -exec cp {} ../libtool/libs/armeabi-v7a/ \; || true
          find deps/sdk-android-arm/lib -name "*.a" -exec cp {} ../libtool/libs/armeabi-v7a/ \; 2>/dev/null || true
          find build/sdk-android-arm/lib -name "*.a" -exec cp {} ../libtool/libs/armeabi-v7a/ \; 2>/dev/null || true
          
          # Convert thin archives to regular archives
          AR="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          LIB_DIR="$PWD/../libtool/libs/armeabi-v7a"
          for a in "$LIB_DIR"/*.a; do
              if [ -f "$a" ]; then
                  echo "Converting $a to regular archive"
                  EXTRACT_DIR="$(mktemp -d)"
                  cd "$EXTRACT_DIR"
                  "$AR" x "$a" || true
                  rm -f "$a"
                  "$AR" rcs "$a" *.o 2>/dev/null || true
                  cd -
                  rm -rf "$EXTRACT_DIR"
              fi
          done
          
          cp -r dist-arm/include/frida-1.0/* ../libtool/include/ || true
          
          ls -lh ../libtool/libs/armeabi-v7a/

      - name: Download Dobby
        run: |
          git clone https://github.com/jmpews/Dobby.git libtool/Dobby
          cd libtool/Dobby
          git checkout 0932d69c320e786672361ab53825ba8f4245e9d3

      - name: Fetch ImGui source
        run: |
          git clone --depth 1 --branch v1.90.9 https://github.com/ocornut/imgui.git libtool/imgui

      - name: Build smali assembler jar from source
        run: |
          set -euo pipefail
          mkdir -p third_party
          git clone --depth 1 --branch 3.0.9 https://github.com/google/smali.git third_party/smali
          cd third_party/smali
          chmod +x gradlew || true
          ./gradlew :smali:fatReleaseJar || ./gradlew :smali:fatJar
          JAR="$(find smali/build/libs -name 'smali-*-fat*.jar' | head -n1)"
          test -n "$JAR"
          cp "$JAR" ../../libtool/assets/smali.jar
          cp "$JAR" ../../sample-app/app/src/main/assets/smali.jar

      - name: Bundle JS agent
        run: |
          set -euo pipefail
          cd libtool
          frida-compile agent.js -o agent_bundle.js
          head -c 80 agent_bundle.js
          cp agent_bundle.js ../sample-app/app/src/main/assets/agent_bundle.js

      - name: Build libtool arm64-v8a
        run: |
          set -euo pipefail
          TOOLCHAIN="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake"
          cmake -S libtool -B build_arm64 -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.10
          cmake --build build_arm64 --target tool -j$(nproc)
          "$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" build_arm64/libtool.so
          ls -lh build_arm64/libtool.so

      - name: Build libtool armeabi-v7a
        run: |
          set -euo pipefail
          TOOLCHAIN="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake"
          cmake -S libtool -B build_arm -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" -DANDROID_ABI=armeabi-v7a -DANDROID_PLATFORM=android-26 -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.10
          cmake --build build_arm --target tool -j$(nproc)
          "$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" build_arm/libtool.so
          ls -lh build_arm/libtool.so

      - name: Build sample APKs
        run: |
          set -euo pipefail
          wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip
          unzip -q gradle-8.4-bin.zip
          export PATH="$PWD/gradle-8.4/bin:$PATH"
          cd sample-app
          gradle assembleRelease
          cp app/build/outputs/apk/release/app-release-unsigned.apk ../sample-nolib-unsigned.apk
          mkdir -p app/src/main/jniLibs/armeabi-v7a app/src/main/jniLibs/arm64-v8a
          cp ../build_arm/libtool.so app/src/main/jniLibs/armeabi-v7a/libtool.so
          cp ../build_arm64/libtool.so app/src/main/jniLibs/arm64-v8a/libtool.so
          gradle clean assembleRelease
          cp app/build/outputs/apk/release/app-release-unsigned.apk ../sample-signed-unsigned.apk
          cd ..
          keytool -genkeypair -v -keystore dextool.jks -keyalg RSA -keysize 2048 -validity 10000 -alias dextool -storepass dextool -keypass dextool -dname "CN=DexTool, OU=Dev, O=Dev, L=City, ST=State, C=US"
          apksigner sign --ks dextool.jks --ks-pass pass:dextool --key-pass pass:dextool --out sample-signed.apk sample-signed-unsigned.apk
          apksigner sign --ks dextool.jks --ks-pass pass:dextool --key-pass pass:dextool --out sample-nolib-signed.apk sample-nolib-unsigned.apk
          apksigner verify --verbose sample-signed.apk
          apksigner verify --verbose sample-nolib-signed.apk

      - name: Commit and push generated project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add --ignore-errors .
          git commit -m "Generate Dex-tool project and build pipeline [skip ci]" || true
          git push origin HEAD:dev
