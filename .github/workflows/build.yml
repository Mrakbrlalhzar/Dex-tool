      - name: Generate DexToolApp.java
        run: |
          cat > sample-app/app/src/main/java/com/dextool/app/DexToolApp.java << 'DXTAPPJ'
          package com.dextool.app;
          
          import android.app.Application;
          import android.util.Log;
          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.io.IOException;
          import java.io.InputStream;
          import java.io.OutputStream;
          
          public class DexToolApp extends Application {
              private static final String TAG = "DexToolApp";
              private static final String DL  = "/sdcard/Download";
          
              @Override
              public void onCreate() {
                  super.onCreate();
                  startLogcatThread();
                  writeBootMarker();
                  startCopierThread();
                  try { Thread.sleep(500); } catch (InterruptedException ignored) {}
                  installUncaughtHandler();
                  try {
                      System.loadLibrary("tool");
                      Log.i(TAG, "libtool.so loaded");
                  } catch (UnsatisfiedLinkError e) {
                      Log.e(TAG, "loadLibrary failed: " + e.getMessage());
                  }
              }
          
              /* stream this process' logcat (own uid, allowed) so native
                 abort messages that only reach logcat are captured too */
              private void startLogcatThread() {
                  Thread t = new Thread(() -> {
                      try {
                          new File(DL, "dextool-logcat.txt").delete();
                          Process p = Runtime.getRuntime().exec(new String[]{
                              "logcat", "-b", "main", "-b", "crash",
                              "-b", "system",
                              "--pid=" + android.os.Process.myPid(),
                              "-v", "brief"});
                          java.io.BufferedReader r = new java.io.BufferedReader(
                              new java.io.InputStreamReader(p.getInputStream()));
                          FileOutputStream f =
                              new FileOutputStream(DL + "/dextool-logcat.txt", true);
                          String line; int n = 0;
                          while ((line = r.readLine()) != null) {
                              if (n++ < 20000) {
                                  f.write((line + "\n").getBytes());
                                  f.flush();
                              }
                          }
                      } catch (Exception e) {
                          Log.w(TAG, "logcat: " + e.getMessage());
                      }
                  }, "dextool-logcat");
                  t.setDaemon(true);
                  t.start();
              }

              private void writeBootMarker() {
                  try {
                      new File(DL).mkdirs();
                      try (FileOutputStream f = new FileOutputStream(DL+"/dextool-boot.marker")) {
                          f.write(("boot ts="+System.currentTimeMillis()+"\n").getBytes());
                      }
                  } catch (IOException e) { Log.w(TAG, "boot marker: "+e.getMessage()); }
              }
          
              private void startCopierThread() {
                  Thread t = new Thread(() -> {
                      while (true) {
                          try {
                              Thread.sleep(5000);
                              copyLogs();
                          } catch (InterruptedException e) { break; }
                            catch (Exception e) { Log.w(TAG, "copier: "+e.getMessage()); }
                      }
                  }, "dextool-copier");
                  t.setDaemon(true);
                  t.start();
              }
          
              private void copyLogs() throws IOException {
                  String[] names = {"dextool.log","dextool-debug.log","dextool-crash.log"};
                  new File(DL).mkdirs();
                  for (String n : names) {
                      File s = new File(getFilesDir(), "dextool-logs/"+n);
                      if (!s.exists()) continue;
                      File d = new File(DL, n);
                      try (InputStream  is = new FileInputStream(s);
                           OutputStream os = new FileOutputStream(d, true)) {
                          byte[] buf = new byte[8192]; int len;
                          while ((len=is.read(buf))!=-1) os.write(buf,0,len);
                      }
                  }
              }
          
              private void installUncaughtHandler() {
                  Thread.UncaughtExceptionHandler prev =
                      Thread.getDefaultUncaughtExceptionHandler();
                  Thread.setDefaultUncaughtExceptionHandler((thr, ex) -> {
                      try (FileOutputStream f =
                               new FileOutputStream(DL+"/dextool-crash.log",true)) {
                          f.write(("JAVA_CRASH thr="+thr.getName()+" "+ex+"\n").getBytes());
                      } catch (IOException ignored) {}
                      if (prev!=null) prev.uncaughtException(thr, ex);
                  });
              }
          }
          DXTAPPJ

      - name: Generate MainActivity.java
        run: |
          cat > sample-app/app/src/main/java/com/dextool/app/MainActivity.java << 'DXTMAINAJ'
          package com.dextool.app;
          
          import android.app.Activity;
          import android.opengl.GLSurfaceView;
          import static android.opengl.GLES20.glClearColor;
          import static android.opengl.GLES20.glViewport;
          import static android.opengl.GLES20.glClear;
          import static android.opengl.GLES20.GL_COLOR_BUFFER_BIT;
          import android.os.Bundle;
          import javax.microedition.khronos.egl.EGLConfig;
          import javax.microedition.khronos.opengles.GL10;
          
          public class MainActivity extends Activity {
              private GLSurfaceView mGLView;
          
              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  mGLView = new GLSurfaceView(this);
                  mGLView.setEGLContextClientVersion(2);
                  mGLView.setRenderer(new GLSurfaceView.Renderer() {
                      public void onSurfaceCreated(GL10 g, EGLConfig c) {
                        glClearColor(0.08f, 0.10f, 0.14f, 1f);
                      }
                      public void onSurfaceChanged(GL10 g, int w, int h) {
                        glViewport(0, 0, w, h);
                      }
                      public void onDrawFrame(GL10 g) {
                        glClear(GL_COLOR_BUFFER_BIT);
                      }
                  });
                  setContentView(mGLView);
              }
          
              @Override protected void onResume() { super.onResume(); mGLView.onResume(); }
              @Override protected void onPause()  { super.onPause();  mGLView.onPause();  }
          }
          DXTMAINAJ

      - name: Generate Android Manifest and resources
        run: |
          cat > sample-app/app/src/main/AndroidManifest.xml << 'DXTMNFST'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>
              <uses-permission android:name="android.permission.INTERNET"/>
              <application
                  android:name=".DexToolApp"
                  android:label="DexTool Sample"
                  android:requestLegacyExternalStorage="true"
                  android:allowBackup="true">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          DXTMNFST
          cat > sample-app/app/src/main/res/values/strings.xml << 'DXTSTRS'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">DexTool Sample</string>
          </resources>
          DXTSTRS

      - name: Generate Gradle build files
        run: |
          cat > sample-app/gradle.properties << 'DXTGRADP'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          DXTGRADP
          cat > sample-app/settings.gradle << 'DXTSETS'
          rootProject.name = "DexToolSample"
          include ':app'
          DXTSETS
          cat > sample-app/build.gradle << 'DXTROOTB'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.1.4' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          DXTROOTB
          cat > sample-app/app/build.gradle << 'DXTAPPB'
          plugins { id 'com.android.application' }
          android {
              namespace          'com.dextool.app'
              compileSdk         34
              defaultConfig {
                  applicationId  'com.dextool.app'
                  minSdk         26
                  targetSdk       34
                  versionCode     1
                  versionName    '1.0'
              }
              signingConfigs {
                  debug {
                      storeFile     file(System.getProperty('user.home')+'/.android/debug.keystore')
                      storePassword 'android'
                      keyAlias      'androiddebugkey'
                      keyPassword   'android'
                  }
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.debug
                  }
              }
              sourceSets {
                  main { jniLibs.srcDirs = ['src/main/jniLibs'] }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          DXTAPPB
          echo "sdk.dir=$ANDROID_HOME" > sample-app/local.properties

      - name: Build sample-signed.apk (with libtool.so)
        run: |
          cp out/lib/arm64-v8a/libtool.so \
             sample-app/app/src/main/jniLibs/arm64-v8a/libtool.so
          cp out/lib/armeabi-v7a/libtool.so \
             sample-app/app/src/main/jniLibs/armeabi-v7a/libtool.so
          cp deps/smali/smali-fat.jar \
             sample-app/app/src/main/assets/smali-fat.jar
          cd sample-app
          gradle assembleRelease --no-daemon -q
          cp app/build/outputs/apk/release/app-release.apk \
             "$GITHUB_WORKSPACE/sample-signed.apk"
          echo "sample-signed.apk: $(du -sh "$GITHUB_WORKSPACE/sample-signed.apk")"

      - name: Build sample-nolib-signed.apk (without libtool.so)
        run: |
          rm -f sample-app/app/src/main/jniLibs/arm64-v8a/libtool.so
          rm -f sample-app/app/src/main/jniLibs/armeabi-v7a/libtool.so
          sed -i 's/System\.loadLibrary("tool");//' \
            sample-app/app/src/main/java/com/dextool/app/DexToolApp.java
          cd sample-app
          gradle assembleRelease --no-daemon -q
          cp app/build/outputs/apk/release/app-release.apk \
             "$GITHUB_WORKSPACE/sample-nolib-signed.apk"
          echo "nolib: $(du -sh "$GITHUB_WORKSPACE/sample-nolib-signed.apk")"

      - name: Generate README.md and .gitignore
        run: |
          cat > README.md << 'DXTRDME'
          # Dex-tool
          
          Standalone runtime instrumentation for Android APKs.
          libtool.so for armeabi-v7a + arm64-v8a. No root. API 26+.
          
          ## Fixes in this version (r10)
          
              1. All tabs drew empty - the tab loop created the tab items but
                 never called their body functions (Settings/Patches/Hooks/
                 Tracker/Recorder/Monitor/Script/Classes are ~500 lines of UI
                 that simply never ran). The loop now calls each tab's
                 function between BeginTabItem/EndTabItem.
          
              2. App crash right after boot (JNI 'invalid jobject' abort in
                 nativePollOnce). The keyboard bridge built a TextWatcher with
                 Java.registerClass and posted it via Java.scheduleOnMainThread
                 - both are fatal on 32-bit ART with JNI checks. Rewritten -
                 the hidden EditText and the IME show/hide now happen inside
                 the main-thread dispatchTouchEvent hook (plain reflection
                 only), and the frida thread polls the EditText text and feeds
                 the delta to ImGui (chars + backspace).
          
              3. Touch offset still present when the agent died before
                 measuring. The overlay now derives a native fallback map from
                 the largest surface ever seen (the HWUI surface spans the full
                 window), so input is scaled correctly from the first frame;
                 the agent's real measurement replaces it when it arrives.
          
              4. Park/adopt confirmed in the field - the r9 log shows the menu
                 surviving an app-switch context destroy ('ImGui parked',
                 'adopted after 8 swaps'). That path is kept as-is.
          
          ## Usage
          
              1. Drop libtool.so into lib/arm64-v8a/ and lib/armeabi-v7a/.
              2. Inject System.loadLibrary("tool") into Application.onCreate()
                 or the launcher Activity.
              3. Copy smali-fat.jar into assets/.
              4. Re-sign and install.
          
          ## Components
          
              frida-gum 16.7.19   QuickJS / GumJS scripting runtime
              Dobby (LSPosed)     inline function hook framework
              ImGui 1.90.4        immediate-mode overlay GUI (ES2 mode)
              smali 3.0.7         runtime .smali to DEX assembler (bundled JAR)
          DXTRDME
          cat > .gitignore << 'DXTGI'
          build-arm64/
          build-arm/
          frida-gum-src/
          frida-dist-arm/
          frida-dist-arm64/
          dobby-src/
          imgui/
          out/
          *.zip
          *.tar.*
          DXTGI

      - name: Upload libtool.so artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libtool-so-both-abis
          path: |
            out/lib/arm64-v8a/libtool.so
            out/lib/armeabi-v7a/libtool.so

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sample-apks
          path: |
            sample-signed.apk
            sample-nolib-signed.apk

      - name: Commit and push generated sources to dev
        run: |
          git fetch origin dev || true
          git checkout -B dev origin/dev 2>/dev/null || git checkout -B dev
          git add --ignore-errors \
            CMakeLists.txt \
            src/ \
            agent/ \
            sample-app/ \
            README.md \
            .gitignore \
            .github/workflows/build.yml
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "fix r10: tab bodies never drawn, JNI crash in keyboard bridge, native touch-map fallback [skip ci]"
            git push origin HEAD:dev
            echo "Pushed to dev."
          fi
