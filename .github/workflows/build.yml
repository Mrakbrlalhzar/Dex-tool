          static void explorer_body(ExplorerWin& e) {
              bool do_search = false;
              if (s_families.empty() && !s_search_res.empty() && !s_search_wait) {
                  for (auto& n : s_search_res) {
                      std::string f = family_of(n);
                      if (!f.empty() &&
                          std::find(s_families.begin(), s_families.end(), f)
                              == s_families.end())
                          s_families.push_back(f);
                  }
                  std::sort(s_families.begin(), s_families.end());
              }
              std::vector<const char*> famc;
              for (auto& f : s_families) famc.push_back(f.c_str());
              int nf = (int)famc.size();
              if (e.family >= nf || e.family < 0) e.family = 0;
              ImGui::SetNextItemWidth(
                  ImGui::GetContentRegionAvail().x - 90.f);
              const char* fprev = nf ? famc[e.family]
                                      : "(no classes yet)";
              if (ImGui::BeginCombo("##fam",
                                    e.all_fam ? "(All families)" : fprev)) {
                  ImGui::SetNextItemWidth(-1.f);
                  ime_textfield("Search families...##fsearch",
                                e.fam_search, sizeof(e.fam_search));
                  ImGui::Separator();
                  if (ImGui::Selectable("(All families)##fsearchall",
                                        e.all_fam))
                      e.all_fam = true;
                  ImGui::Separator();
                  for (int f = 0; f < nf; f++) {
                      if (!contains_ci(s_families[f], e.fam_search))
                          continue;
                      bool sel = (!e.all_fam && e.family == f);
                      if (ImGui::Selectable(famc[f], sel)) {
                          e.family  = f;
                          e.all_fam = false;
                      }
                  }
                  ImGui::EndCombo();
              }
              ImGui::SameLine();
              ImGui::Checkbox("All", &e.all_fam);
              ImGui::PushItemWidth(ImGui::GetContentRegionAvail().x - 84.f);
              do_search |= ime_textfield("##esearch", e.search,
                                         sizeof(e.search),
                                         ImGuiInputTextFlags_EnterReturnsTrue);
              ImGui::PopItemWidth();
              ImGui::SameLine();
              if (ImGui::Button("Filter")) do_search = true;
              ImGui::PushStyleColor(ImGuiCol_Button,
                                    ImVec4(0.94f, 0.44f, 0.66f, 1.f));
              ImGui::PushStyleColor(ImGuiCol_ButtonHovered,
                                    ImVec4(0.98f, 0.55f, 0.74f, 1.f));
              ImGui::PushStyleColor(ImGuiCol_ButtonActive,
                                    ImVec4(0.88f, 0.34f, 0.58f, 1.f));
              if (ImGui::Button("Options")) ImGui::OpenPopup("explOpts");
              ImGui::PopStyleColor(3);
              ImGui::SameLine();
              if (s_search_wait) ImGui::TextDisabled("(listing...)");
              else ImGui::TextDisabled("%ld of %ld loaded classes",
                                       (long)s_search_shown,
                                       (long)s_search_total);
              if (ImGui::BeginPopup("explOpts")) {
                  ImGui::Checkbox("Case sensitive", &e.case_sensitive);
                  ImGui::TextDisabled("Filter by:");
                  int fb = e.advanced ? 3 : e.filter_by;
                  if (ImGui::RadioButton("Class",  fb == 0)) {
                      e.filter_by = 0; e.advanced = false; }
                  if (ImGui::RadioButton("Method", fb == 1)) {
                      e.filter_by = 1; e.advanced = false; }
                  if (ImGui::RadioButton("Field",  fb == 2)) {
                      e.filter_by = 2; e.advanced = false; }
                  if (ImGui::RadioButton(
                          "Code text (advanced: string inside class code)",
                          fb == 3))
                      e.advanced = true;
                  bool sys = s_search_sys;
                  if (ImGui::Checkbox("System classes", &sys))
                      s_search_sys = sys;
                  ImGui::EndPopup();
              }
              ImGui::Separator();
              ImGui::BeginChild("explst", ImVec2(0, 0), true);
              ImGuiListClipper clip;
              clip.Begin((int)s_search_res.size());
              while (clip.Step()) {
                  for (int k = clip.DisplayStart; k < clip.DisplayEnd; k++) {
                      const std::string& nm = s_search_res[k];
                      if (!e.all_fam && e.family < (int)s_families.size() &&
                          family_of(nm) != s_families[e.family]) continue;
                      ImGui::PushID(k);
                      if (ImGui::Selectable(nm.c_str()))
                          open_inspector(nm, false);
                      ImGui::PopID();
                  }
              }
              ImGui::EndChild();
              mark_scroll_item(s_lst_scroll);
              if (do_search)
                  run_search(e.search, e.advanced ? 3 : e.filter_by,
                             e.case_sensitive);
          }
          static void class_tab_body(ClassTab& c) {
              ImGui::PushTextWrapPos();
              ImGui::TextUnformatted(c.cname.c_str());
              ImGui::PopTextWrapPos();
              if (ImGui::SmallButton("Inspector##ct")) {
                  snprintf(s_of.cls, sizeof(s_of.cls), "%s", c.cname.c_str());
                  snprintf(s_of.typ, sizeof(s_of.typ), "%s", "this");
                  s_of.ctx_uid = c.uid;
                  s_of.ctx_arg = -1;
                  s_of.open    = true;
                  s_of.results.clear();
                  s_of.waiting  = false;
                  s_of.creating = false;
                  s_open_objfinder = true;   /* r28: popup instead of window */
              }
              if (ImGui::IsItemHovered())
                  ImGui::SetTooltip("find / create objects of this class");
              ImGui::SameLine();
              if (ImGui::SmallButton("Refresh##ct"))
                  open_inspector(c.cname, false);
              ImGui::SameLine();
              if (c.of_handle >= 0)
                  ImGui::TextColored(ImVec4(0, 1, 0, 1), "%s",
                                     c.of_note.c_str());
              if (!c.got_info)
                  ImGui::TextDisabled(c.waiting ? "(waiting for agent...)"
                                                : "(no data - tap Refresh)");
              ImGui::Separator();
              static const char* subs[] = {"Instances", "Static Fields",
                                           "Methods", "Fields"};
              char sl[40];
              if (ImGui::BeginTabBar("clssub")) {
                  for (int si = 0; si < 4; si++) {
                      snprintf(sl, sizeof(sl), "%s##cs%d", subs[si], si);
                      if (ImGui::BeginTabItem(sl)) {
                          c.sub = si;
                          if      (si == 0) inst_view(c);
                          else if (si == 1) static_fields_view(c);
                          else if (si == 2) methods_view(c);
                          else              fields_view(c);
                          ImGui::EndTabItem();
                      }
                  }
                  ImGui::EndTabBar();
              }
          }
          static void tab_tools() {
              MLK();
              bool agent_ready = s_agent_ready;
              bool need_auto   = !s_cls_auto_done && !s_search_wait &&
                                 s_search_res.empty();
              int  qid         = 0;
              if (agent_ready && need_auto) {
                  s_cls_auto_done = true;
                  s_search_wait   = true;
                  qid = ++s_search_seq;
                  s_search_qid   = qid;      /* r23: generation armed at SEND time */
                  s_search_page0 = false;
              }
              bool want_expl = s_explorers.empty();
              MULK();
              if (want_expl) {
                  ExplorerWin e{};
                  e.id = ++s_expl_seq;
                  MLK();
                  s_explorers.push_back(e);
                  MULK();
              }
              if (qid)
                  post_rpc("listLoadedClasses",
                           "{\"filter\":\"\",\"qid\":" + std::to_string(qid)
                           + ",\"mode\":0"
                           + ",\"sys\":" + (s_search_sys ? "true" : "false") + "}");
              if (ImGui::Checkbox("Fullscreen", &s_fullscreen)) {
                  if (s_fullscreen) {
                      s_fs_last_pos  = ImGui::GetWindowPos();
                      s_fs_last_size = ImGui::GetWindowSize();
                  } else {
                      s_fs_restore = true;
                  }
                  s_conf_dirty = true;
              }
              MLK();
              if (ImGui::BeginTabBar("tabber",
                                     ImGuiTabBarFlags_AutoSelectNewTabs |
                                     ImGuiTabBarFlags_FittingPolicyScroll |
                                     ImGuiTabBarFlags_TabListPopupButton)) {
                  if (ImGui::TabItemButton("+",
                                           ImGuiTabItemFlags_NoTooltip |
                                           ImGuiTabItemFlags_Leading))
                      s_expl_req = true;
                  if (s_expl_req) {
                      s_expl_req = false;
                      if (s_explorers.size() < 6) {
                          ExplorerWin e{};
                          e.id = ++s_expl_seq;
                          s_explorers.push_back(e);
                          s_focus_expl = e.id;
                      }
                  }
                  int exi = 0;
                  for (int i = 0; i < (int)s_explorers.size(); ) {
                      ExplorerWin& e = s_explorers[i];
                      bool open = true;
                      char lbl[192];
                      if (e.search[0])
                          snprintf(lbl, sizeof(lbl), "%s", e.search);
                      else if (exi == 0)
                          snprintf(lbl, sizeof(lbl), "Classes");
                      else
                          snprintf(lbl, sizeof(lbl), "Classes [%d]", e.id);
                      ImGuiTabItemFlags fl = 0;
                      if (s_focus_expl == e.id) {
                          fl |= ImGuiTabItemFlags_SetSelected;
                          s_focus_expl = 0;
                      }
                      if (ImGui::BeginTabItem(lbl, &open, fl)) {
                          explorer_body(e);
                          ImGui::EndTabItem();
                      }
                      if (!open) {
                          s_explorers.erase(s_explorers.begin() + i);
                          continue;   /* no i++ - the next tab shifted in */
                      }
                      exi++;
                      i++;
                  }
                  if (s_explorers.empty()) {
                      ExplorerWin e{};
                      e.id = ++s_expl_seq;
                      s_explorers.push_back(e);
                  }
                  for (int i = 0; i < (int)s_classes.size(); ) {
                      ClassTab& c = s_classes[i];
                      bool open = true;
                      std::string lbl = win_title(c);
                      ImGuiTabItemFlags fl = 0;
                      if (s_focus_win == lbl) {
                          fl |= ImGuiTabItemFlags_SetSelected;
                          s_focus_win.clear();
                      }
                      if (ImGui::BeginTabItem(lbl.c_str(), &open, fl)) {
                          class_tab_body(c);
                          ImGui::EndTabItem();
                      }
                      if (!open) {
                          s_classes.erase(s_classes.begin() + i);
                          continue;
                      }
                      i++;
                  }
                  if (!s_dup_req.empty()) {
                      ClassTab nt{};
                      nt.cname   = s_dup_req;
                      nt.uid     = ++s_tab_uid_seq;
                      nt.waiting = true;
                      s_classes.push_back(nt);
                      s_focus_win = win_title(s_classes.back());
                      std::string a = "{\"class\":\"" + jesc(s_dup_req) + "\"}";
                      post_rpc("openClass", a);
                      s_dup_req.clear();
                  }
                  for (int i = 0; i < (int)s_objtabs.size(); ) {
                      ObjTab& t = s_objtabs[i];
                      bool open = true;
                      char lbl[96];
                      snprintf(lbl, sizeof(lbl), "[0x%lx]##ot%ld",
                               t.handle, t.handle);
                      ImGuiTabItemFlags fl = 0;
                      if (s_objfocus == t.handle) {
                          fl |= ImGuiTabItemFlags_SetSelected;
                          s_objfocus = -1;
                      }
                      if (ImGui::BeginTabItem(lbl, &open, fl)) {
                          obj_tab_body(t);
                          ImGui::EndTabItem();
                      }
                      if (!open) {
                          s_objtabs.erase(s_objtabs.begin() + i);
                          continue;
                      }
                      i++;
                  }
                  ImGui::EndTabBar();
              }
              MULK();
          }
          static ImVec2 s_fab_pos(-1, -1);
          static bool    s_fab_drag = false;
          static bool    s_fab_moved = false;
          static ImVec2  s_fab_grab(0, 0), s_fab_orig(0, 0);
          static void draw_fab(ImVec2 ds) {
              if (!s_show_fab) return;
              if (s_fab_pos.x < 0) s_fab_pos = ImVec2(ds.x - 90.f, ds.y - 110.f);
              ImGuiIO& io = ImGui::GetIO();
              ImGui::SetNextWindowPos(s_fab_pos, ImGuiCond_Always);
              ImGui::SetNextWindowBgAlpha(0.55f);
              ImGui::PushStyleVar(ImGuiStyleVar_FrameRounding, 22.f);
              ImGui::PushStyleColor(ImGuiCol_Button,
                  s_visible ? ImVec4(.25f, .55f, .25f, .85f)
                            : ImVec4(.55f, .30f, .55f, .85f));
              ImGui::Begin("##fab", nullptr,
                           ImGuiWindowFlags_NoDecoration |
                           ImGuiWindowFlags_NoMove |
                           ImGuiWindowFlags_NoSavedSettings |
                           ImGuiWindowFlags_AlwaysAutoResize |
                           ImGuiWindowFlags_NoFocusOnAppearing);
              if (ImGui::Button(s_visible ? "HIDE" : "MENU", ImVec2(64, 44))) {
              }
              if (ImGui::IsItemActive()) {
                  if (!s_fab_drag) {
                      s_fab_drag  = true;
                      s_fab_moved = false;
                      s_fab_grab  = io.MousePos;
                      s_fab_orig  = s_fab_pos;
                  }
                  ImVec2 d(io.MousePos.x - s_fab_grab.x, io.MousePos.y - s_fab_grab.y);
                  if (fabsf(d.x) > 8.f || fabsf(d.y) > 8.f) s_fab_moved = true;
                  if (s_fab_moved) {
                      s_fab_pos = ImVec2(s_fab_orig.x + d.x, s_fab_orig.y + d.y);
                      if (s_fab_pos.x < 0)  s_fab_pos.x = 0;
                      if (s_fab_pos.y < 0)  s_fab_pos.y = 0;
                      if (s_fab_pos.x > ds.x - 80) s_fab_pos.x = ds.x - 80;
                      if (s_fab_pos.y > ds.y - 60) s_fab_pos.y = ds.y - 60;
                      ImGui::SetWindowPos(s_fab_pos);
                  }
              } else if (s_fab_drag) {
                  s_fab_drag = false;
                  if (!s_fab_moved) {           /* it was a tap, not a drag */
                      s_visible = !s_visible;
                      s_conf_dirty = true;
                  }
              }
              ImGui::End();
              ImGui::PopStyleColor();
              ImGui::PopStyleVar();
          }
          int menu_frame_pump_level() {
              MLK();
              bool vis = s_visible;
              MULK();
              if (vis) return 2;                    /* full rate */
              return overlay_ready() ? 1 : 0;       /* FAB-only slow pump  */
          }
          void menu_draw() {
              ImGuiIO& io = ImGui::GetIO();
              ImVec2 ds = io.DisplaySize;
              apply_theme();
              MLK();
              bool vis = s_visible;
              MULK();
              if (!vis) {
                  draw_fab(ds);
                  MLK();
                  bool ime_was    = s_ime_active;
                  s_ime_active    = false;
                  bool clear_req  = s_ime_clear;
                  s_ime_clear     = false;
                  MULK();
                  if (ime_was) ime_hide();  /* menu hidden: close the phone kb */
                  if (clear_req) ImGui::ClearActiveID();
                  overlay_publish_scroll_regions(s_regions);
                  s_regions.clear();
                  return;
              }
              draw_fab(ds);
              ime_frame_prelude();
              {
                  ImDrawList* dl = ImGui::GetBackgroundDrawList();
                  float dt = io.DeltaTime;
                  float lh = ImGui::CalcTextSize("X").y;
                  if (lh <= 0.f) lh = 18.f;
                  int maxline = (int)((ds.y - 150.f) / lh) - 5;
                  if (maxline > 10) maxline = 10;
                  int i = 0;
                  for (int k = 0; k < (int)s_flash.size(); ) {
                      HitFlash& f = s_flash[k];
                      f.time -= dt;
                      f.gone -= dt;
                      if (f.gone <= 0.f || f.name.empty()) {
                          s_flash.erase(s_flash.begin() + k);
                          continue;
                      }
                      if (i < maxline) {
                          char lbl[300];
                          snprintf(lbl, sizeof(lbl), "%s (%ldx)",
                                   f.name.c_str(), f.count);
                          ImVec2 pos(20.f, 150.f + lh * (float)i);
                          ImVec2 ts = ImGui::CalcTextSize(lbl);
                          float g = f.time > 0.f
                                        ? (f.time > 1.f ? 1.f : f.time) : 0.f;
                          ImVec4 col(1.f - g, 1.f, 1.f - g, 1.f);
                          if (f.gone < 1.f) col.w = f.gone;
                          dl->AddRectFilled(pos,
                                            ImVec2(pos.x + ts.x, pos.y + ts.y),
                                            IM_COL32(0, 0, 0, 100));
                          dl->AddText(pos, ImGui::GetColorU32(col), lbl);
                          i++;
                      }
                      k++;
                  }
              }
              ImGuiWindowFlags wflags = ImGuiWindowFlags_NoCollapse;
              if (s_fullscreen) {
                  ImGui::SetNextWindowPos(ImVec2(0, 0));
                  ImGui::SetNextWindowSize(ds);
                  wflags |= ImGuiWindowFlags_NoResize | ImGuiWindowFlags_NoMove;
              } else {
                  if (s_fs_restore) {
                      s_fs_restore = false;
                      ImGui::SetNextWindowPos(s_fs_last_pos);
                      ImGui::SetNextWindowSize(s_fs_last_size);
                  }
                  ImGui::SetNextWindowPos(ImVec2(20, 20), ImGuiCond_Once);
                  ImGui::SetNextWindowSizeConstraints(
                      ImVec2(420, 300), ImVec2(ds.x * .95f, ds.y * .95f));
                  ImGui::SetNextWindowSize(ImVec2(ds.x * .8f, ds.y * .85f),
                                           ImGuiCond_Once);
              }
              ImGui::SetNextWindowBgAlpha(s_opacity);
              bool open = vis;
              ImGui::Begin("Dex-tool v1.3 (r28)", &open, wflags);
              if (!open) {
                  MLK();
                  s_visible = false;
                  s_conf_dirty = true;
                  if (!s_show_fab) s_show_fab = true;
                  MULK();
              }
              if (ImGui::BeginTabBar("mainTabber")) {
                  struct TabDef { const char* name; void (*fn)(); };
                  TabDef tabs[] = {
                      {"Tools",    tab_tools},    {"Tracer",   tab_tracer},
                      {"Patches",  tab_patches},  {"Dumper",   tab_dumper},
                      {"Recorder", tab_recorder}, {"Monitor",  tab_monitor},
                      {"Script",   tab_script},   {"Settings", tab_settings},
                  };
                  MLK();
                  std::string want = s_next_tab;
                  s_next_tab.clear();
                  MULK();
                  for (auto& t : tabs) {
                      ImGuiTabItemFlags fl = 0;
                      if (want == t.name) fl |= ImGuiTabItemFlags_SetSelected;
                      if (ImGui::BeginTabItem(t.name, nullptr, fl)) {
                          t.fn();          /* the body was missing: tabs drew empty */
                          ImGui::EndTabItem();
                      }
                  }
                  ImGui::EndTabBar();
              }
              if (s_clip_msg[0] && conf_now_ms() - s_clip_ms < 2500)
                  ImGui::TextColored(ImVec4(.4f, 1.f, .5f, 1), "%s", s_clip_msg);
              if (s_open_objfinder) {
                  s_open_objfinder = false;
                  ImGui::OpenPopup("ObjFinderPopup");
              }
              if (s_open_fmview) {
                  s_open_fmview = false;
                  ImGui::OpenPopup("fmPopup");
              }
              objfinder_popup();
              fm_popup();
              ImVec2 wp = ImGui::GetWindowPos(), ws = ImGui::GetWindowSize();
              ImGui::End();
              mark_rect(wp.x, wp.y, ws.x, ws.y, s_ovl_scroll);
              overlay_publish_scroll_regions(s_regions);
              s_regions.clear();
              if (s_conf_dirty && s_conf_path[0] &&
                  conf_now_ms() - s_conf_last_ms > 700) {
                  conf_save();
                  MLK();
                  overlay_set_touch_bias(s_y_off);
                  MULK();
              }
          }
          DXTMNC

      - name: Generate main.cpp
        run: |
          cat > src/main.cpp << 'DXTMAIN'
          #include "logger.h"
          #include "overlay.h"
          #include "frida-gumjs.h"
          #include <jni.h>
          #include <fcntl.h>
          #include <unistd.h>
          #include <cstring>
          #include <ctime>
          #include <cstdio>
          #include <sys/stat.h>
          JavaVM* g_jvm_global = nullptr;
          static void write_marker(const char* path, const char* msg) {
              int fd = open(path, O_WRONLY|O_CREAT|O_TRUNC, 0644);
              if (fd < 0) return;
              char buf[256];
              int n = snprintf(buf, sizeof(buf), "%s ts=%ld\n", msg, (long)time(nullptr));
              write(fd, buf, (size_t)n);
              close(fd);
          }
          static void write_marker_in(const char* dir, const char* name,
                                      const char* msg) {
              char p[600];
              snprintf(p, sizeof(p), "%s/%s", dir, name);
              write_marker(p, msg);
          }
          static void resolve_log_dir(char* out, size_t n) {
              snprintf(out, n, "/sdcard/Download");
              JNIEnv* env = nullptr;
              if (!g_jvm_global) return;
              if (g_jvm_global->GetEnv((void**)&env, JNI_VERSION_1_6) != JNI_OK)
                  return;
              if (!env) return;
              do {
                  jclass act = env->FindClass("android/app/ActivityThread");
                  if (!act || env->ExceptionCheck()) break;
                  jmethodID cur = env->GetStaticMethodID(act,
                      "currentApplication", "()Landroid/app/Application;");
                  if (!cur || env->ExceptionCheck()) break;
                  jobject app = env->CallStaticObjectMethod(act, cur);
                  if (!app || env->ExceptionCheck()) break;
                  jclass ctx = env->FindClass("android/content/Context");
                  if (!ctx || env->ExceptionCheck()) break;
                  jmethodID gfd = env->GetMethodID(ctx, "getFilesDir",
                                                   "()Ljava/io/File;");
                  if (!gfd || env->ExceptionCheck()) break;
                  jobject fdir = env->CallObjectMethod(app, gfd);
                  if (!fdir || env->ExceptionCheck()) break;
                  jclass fio = env->FindClass("java/io/File");
                  if (!fio || env->ExceptionCheck()) break;
                  jmethodID gap = env->GetMethodID(fio, "getAbsolutePath",
                                                   "()Ljava/lang/String;");
                  if (!gap || env->ExceptionCheck()) break;
                  jstring js = (jstring)env->CallObjectMethod(fdir, gap);
                  if (!js || env->ExceptionCheck()) break;
                  const char* p = env->GetStringUTFChars(js, nullptr);
                  if (p) {
                      snprintf(out, n, "%s/dextool-logs", p);
                      env->ReleaseStringUTFChars(js, p);
                  }
              } while (0);
              if (env->ExceptionCheck()) env->ExceptionClear();
          }
          extern "C" JNIEXPORT void JNICALL
          Java_com_dextool_app_DexToolApp_nativeSetLogDir(JNIEnv* env, jclass,
                                                          jstring path) {
              if (!path) return;
              const char* p = env->GetStringUTFChars(path, nullptr);
              if (!p) return;
              logger_retarget(p);
              env->ReleaseStringUTFChars(path, p);
          }
          extern "C" JNIEXPORT jint JNICALL
          JNI_OnLoad(JavaVM* vm, void*) {
              g_jvm_global = vm;
              char base[512];
              resolve_log_dir(base, sizeof(base));
              mkdir(base, 0755);       /* entry marker + logs land even on the
                                          very first boot */
              write_marker_in(base, "dextool-jni.marker", "checkpoint=entry");
              logger_init(base);        /* mkdir()s <filesDir>/dextool-logs */
              logger_install_abort_capture();
              {
                  char m[600];
                  snprintf(m, sizeof(m), "[JNI_OnLoad] entry (r16: log dir %s)",
                           base);
                  log_info(m);
              }
              write_marker_in(base, "dextool-jni.marker", "checkpoint=logger_ready");
              overlay_set_java_vm(vm);
              overlay_start(vm);
              if (!install_swap_hook())
                  log_crash_raw("[JNI_OnLoad] FATAL: install_swap_hook failed\n");
              write_marker_in(base, "dextool-jni.marker", "checkpoint=hooks_installed");
              log_info("[JNI_OnLoad] done — awaiting first eglSwapBuffers");
              write_marker_in(base, "dextool-jni.marker", "checkpoint=jni_return");
              return JNI_VERSION_1_6;
          }
          DXTMAIN

      - name: Generate agent.js
        run: |
          cat > agent/agent.js << 'DXTAGNT'
          'use strict';
          function sendMsg(type, payload) { send({ type: type, payload: payload }); }
          var gAgentLog = null;
          function agentLog(msg) {
              try {
                  if (!gAgentLog) {
                      var p = Module.findExportByName('libtool.so',
                                                      'dextool_agent_log');
                      if (!p) return;
                      gAgentLog = new NativeFunction(p, 'void', ['pointer']);
                  }
                  gAgentLog(Memory.allocUtf8String(
                      String(msg).substring(0, 400)));
              } catch (e) {}
          }
          agentLog('agent: script running (entry)');
          function jstr(v) {
              try {
                  if (v === null || v === undefined) return 'null';
                  var s = String(v);
                  if (s.length > 160) s = s.substring(0, 157) + '...';
                  return s.replace(/\|/g, '!').replace(/#/g, '%');
              } catch (e) { return '?'; }
          }
          function jargs(a) {
              try {
                  if (!a || !a.length) return '';
                  return Array.prototype.map.call(a, jstr).join(',').substring(0, 240);
              } catch (e) { return '?'; }
          }
          function jstack(limit) {
              try {
                  var st = Java.use('java.lang.Thread').currentThread().getStackTrace();
                  var out = [];
                  for (var i = 0; i < st.length && out.length < (limit || 4); i++) {
                      var f = st[i].toString();
                      if (f.indexOf('java.') === 0 || f.indexOf('android.') === 0 ||
                          f.indexOf('com.android.') === 0 ||
                          f.indexOf('dalvik.') === 0) continue;
                      out.push(f.split('(')[0]);
                  }
                  return out;
              } catch (e) { return []; }
          }
          var gSysCls = null;
          function field_repr(v) {
              try {
                  if (v === null || v === undefined) return 'null';
                  if (typeof v === 'string') return v.substring(0, 160);
                  if (typeof v === 'number' || typeof v === 'boolean')
                      return String(v);
                  var cn = '';
                  try { cn = String(v.$className || ''); } catch (e0) {}
                  if (cn === 'java.lang.String' || cn === 'java.lang.Integer' ||
                      cn === 'java.lang.Long'    || cn === 'java.lang.Boolean' ||
                      cn === 'java.lang.Short'   || cn === 'java.lang.Byte' ||
                      cn === 'java.lang.Float'   || cn === 'java.lang.Double' ||
                      cn === 'java.lang.Character')
                      return String(v).substring(0, 160);   /* boxes: toString is safe */
                  if (cn) {
                      var id = '?';
                      try {
                          if (!gSysCls) gSysCls = Java.use('java.lang.System');
                          id = String(gSysCls.identityHashCode(v));
                      } catch (e1) {}
                      return '@' + cn + '#' + id;
                  }
                  return String(v).substring(0, 160);   /* plain JS values */
              } catch (e) { return '?'; }
          }
          var gAddChar = null, gBackspace = null, gWantMouse = null;
          var gNativeTouch = null, gSetMap = null;
          var gHitTest = null, gDisplaySize = null;   /* r23 */
          var gWantFrames = null;                     /* r25 frame pump */
          function ensure_native_fns() {
              if (gNativeTouch) return true;
              try {
                  var m = Module.findExportByName('libtool.so', 'dextool_add_char');
                  var b = Module.findExportByName('libtool.so', 'dextool_backspace');
                  var w = Module.findExportByName('libtool.so', 'dextool_want_mouse');
                  var t = Module.findExportByName('libtool.so', 'dextool_on_touch');
                  var s = Module.findExportByName('libtool.so', 'dextool_set_touch_map');
                  if (!m || !b || !t || !s) return false;
                  gAddChar   = new NativeFunction(m, 'void', ['int']);
                  gBackspace = new NativeFunction(b, 'void', []);
                  gNativeTouch = new NativeFunction(t, 'void', ['float', 'float', 'int']);
                  gSetMap    = new NativeFunction(s, 'void', ['int', 'int', 'int', 'int']);
                  if (w) gWantMouse = new NativeFunction(w, 'bool', []);
                  var h = Module.findExportByName('libtool.so', 'dextool_hit_test');
                  if (h) gHitTest = new NativeFunction(h, 'bool', ['float', 'float']);
                  var d = Module.findExportByName('libtool.so', 'dextool_display_size');
                  if (d) gDisplaySize = new NativeFunction(d, 'int', []);
                  var wf = Module.findExportByName('libtool.so', 'dextool_want_frames');
                  if (wf) gWantFrames = new NativeFunction(wf, 'int', []);
                  return true;
              } catch (e) { return false; }
          }
          var gMapSent = { w: -1, h: -1, x: -9999, y: -9999 };
          var gMapLastTouch = 0;
          var gTouchEat = false;   /* r23: the current gesture started on the menu */
          var gPumpTick = 0, gPumpLogged = 0, gPumpMissLogged = 0;
          function pump_frames() {
              try {
                  if (!gWantFrames) return;
                  var lvl = 0;
                  try { lvl = gWantFrames(); } catch (eL) { return; }
                  if (!lvl || !IME || !IME.act) return;
                  gPumpTick++;
                  if (lvl === 1 && (gPumpTick % 4) !== 0) return;
                  if (!gPumpLogged) {
                      gPumpLogged = 1;
                      agentLog('frame pump: on (level ' + lvl + ')');
                  }
                  var w = null, dv = null;
                  try { w = IME.act.getWindow(); } catch (eW) { return; }
                  if (!w) return;
                  try { dv = w.getDecorView(); } catch (eD) { return; }
                  if (!dv) return;
                  if (typeof dv.postInvalidate !== 'function') {
                      if (!gPumpMissLogged) {
                          gPumpMissLogged = 1;
                          agentLog('frame pump: decor.postInvalidate typeof ' +
                              (typeof dv.postInvalidate) + ' - pump disabled');
                      }
                      return;
                  }
                  dv.postInvalidate();
              } catch (e) {}
          }
          setInterval(pump_frames, 30);
          function report_map(view) {
              try {
                  if (!view) return;
                  var loc = Java.array('int', [0, 0]);
                  view.getLocationOnScreen(loc);
                  var w = view.getWidth(), h = view.getHeight();
                  if (w <= 0 || h <= 0) return;
                  if (w === gMapSent.w && h === gMapSent.h &&
                      loc[0] === gMapSent.x && loc[1] === gMapSent.y) return;
                  gMapSent = { w: w, h: h, x: loc[0], y: loc[1] };
                  gSetMap(loc[0], loc[1], w, h);
                  sendMsg('info', { msg: 'touch map (screen): ' + loc[0] + ',' + loc[1] + ' ' + w + 'x' + h });
              } catch (e) {}
          }
          function content_view(activity) {
              try {
                  return activity.getWindow().getDecorView()
                                  .findViewById(0x01020002);
              } catch (e) { return null; }
          }
          function gl_surface_hint() {
              try {
                  if (!gDisplaySize && !ensure_native_fns()) return null;
                  if (!gDisplaySize) return null;
                  var v = gDisplaySize();
                  if (!v || v <= 0) return null;
                  return { w: (v >>> 16) & 0xffff, h: v & 0xffff };
              } catch (e) { return null; }
          }
          function find_gl_view(activity) {
              try {
                  var decor = activity.getWindow().getDecorView();
                  if (!decor) return content_view(activity);
                  var VG = Java.use('android.view.ViewGroup');
                  var cands = [];
                  var stack = [decor];
                  while (stack.length) {
                      var v = stack.pop();
                      if (v === null || v === undefined) continue;
                      var cn = '';
                      try { cn = String(v.getClass().getName()); } catch (e0) {}
                      if (cn.indexOf('SurfaceView') >= 0 ||
                          cn.indexOf('GLSurfaceView') >= 0 ||
                          cn.indexOf('TextureView') >= 0) {
                          var w = 0, h = 0;
                          try { w = v.getWidth(); h = v.getHeight(); } catch (e1) {}
                          if (w > 0 && h > 0)
                              cands.push({ v: v, w: w, h: h });
                      }
                      var grp = null;
                      try { grp = Java.cast(v, VG); } catch (e2) {}
                      if (grp) {
                          var n = grp.getChildCount();
                          for (var i = 0; i < n; i++) stack.push(grp.getChildAt(i));
                      }
                  }
                  if (!cands.length) return content_view(activity);
                  var hint = gl_surface_hint();
                  var best = null, bestScore = -1e30;
                  for (var k = 0; k < cands.length; k++) {
                      var c = cands[k];
                      var score = -Math.abs(c.w * c.h);
                      if (hint && hint.w > 0 && hint.h > 0) {
                          score = -Math.abs(Math.log((c.w * c.h + 1) /
                                                     (hint.w * hint.h + 1))) * 100;
                          var ar1 = c.w / c.h, ar2 = hint.w / hint.h;
                          if (Math.abs(ar1 - ar2) / ar2 < 0.25) score += 50;
                      }
                      if (score > bestScore) { bestScore = score; best = c; }
                  }
                  if (best) return best.v;
                  return content_view(activity);
              } catch (e3) {}
              return content_view(activity);
          }
          var IME = { act: null, edit: null, actHash: 0, prev: '',
                      silent: false, cnt: 0, everLogged: false,
                      mapProbed: false,                   /* r20: one-shot view-map probe */
                      restore: null,                      /* r23: app view whose focus we borrowed */
                      showSeq: 0,                         /* r24: show-request session token */
                      upLogged: false };                  /* r24: "already up" logged once per session */
          function ime_release_act(obj) {
              try {
                  if (!obj) return;
                  if (typeof Java.release === 'function') { Java.release(obj); return; }
                  if (typeof obj.$dispose === 'function') obj.$dispose();
              } catch (e) {}
          }
          function ime_set_restore(v) {
              try {
                  if (IME.restore && v) {
