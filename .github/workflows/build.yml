# === BRANCH TARGET: dev ===
# Fixed: infinite loop, frida-gum meson build, dobby toolchain, cache keys, crash debugging, git push auth
name: Build Dex-tool

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: "${{ !contains(github.event.head_commit.message || github.event.pull_request.title || '', '[skip ci]') }}"
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    env:
      ANDROID_HOME: "${{ github.workspace }}/android-sdk"
      ANDROID_NDK_ROOT: "${{ github.workspace }}/android-sdk/ndk/25.2.9519653"
      ANDROID_NDK_HOME: "${{ github.workspace }}/android-sdk/ndk/25.2.9519653"
      NDK_VERSION: "25.2.9519653"
      FRIDA_GUM_VERSION: "16.7.19"
      DOBBY_COMMIT: "lsposed-master"
      IMMGUI_VERSION: "v1.90.4"
      SMALI_VERSION: "3.0.7"

    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          token: "${{ secrets.GITHUB_TOKEN }}"
          fetch-depth: 0

      - name: Configure git identity (bot)
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install system packages (frida-gum deps + meson + ninja + python3 + patch)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build python3-pip unzip curl \
            build-essential lib32stdc++6 lib32z1 flex bison \
            pkg-config libglib2.0-dev libpixman-1-dev libfdt-dev \
            python3-dev python3-setuptools python3-wheel \
            libtool autoconf automake gettext \
            wget file patch

      - name: Setup Android SDK manually
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          wget -q \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
            -O /tmp/cmdtools.zip
          unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
          mv /tmp/cmdtools/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses >/dev/null 2>&1 || true
          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-26" \
            "platforms;android-34" \
            "build-tools;35.0.1" \
            "ndk;${NDK_VERSION}"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools"           >> "$GITHUB_PATH"

      - name: Install Gradle 8.5
        run: |
          wget -q "https://services.gradle.org/distributions/gradle-8.5-bin.zip" \
            -O /tmp/gradle.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.5/bin" >> "$GITHUB_PATH"

      - name: Install meson (via pipx for isolation)
        run: |
          pip3 install --user meson ninja
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Ensure debug keystore exists
        run: |
          mkdir -p ~/.android
          keytool -genkey -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000 2>/dev/null || true

      # ============ FRIDA-GUM arm64-v8a (MESON BUILD) ============
      - name: Cache frida-gum arm64-v8a
        id: cache-frida-arm64
        uses: actions/cache@v4
        with:
          path: deps/frida-gum/arm64-v8a
          key: frida-gum-${{ env.FRIDA_GUM_VERSION }}-arm64-v8a-ndk${{ env.NDK_VERSION }}-${{ runner.os }}-v4

      - name: Build frida-gum ${{ env.FRIDA_GUM_VERSION }} arm64-v8a (meson)
        if: "${{ steps.cache-frida-arm64.outputs.cache-hit != 'true' }}"
        run: |
          set -euo pipefail
          git clone --recurse-submodules --depth 1 --branch ${{ env.FRIDA_GUM_VERSION }} \
            https://github.com/frida/frida-gum.git frida-gum-src
          cd frida-gum-src
          FRIDA_PFX="$GITHUB_WORKSPACE/frida-dist-arm64"
          mkdir -p "$FRIDA_PFX"
          
          # Meson cross file for android-arm64
          cat > cross-android-arm64.meson << 'EOF'
          [binaries]
          c = '/opt/android-ndk-r25c/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang'
          cpp = '/opt/android-ndk-r25c/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++'
          ar = '/opt/android-ndk-r25c/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'
          strip = '/opt/android-ndk-r25c/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'
          pkgconfig = 'pkg-config'
          
          [host_machine]
          system = 'linux'
          cpu_family = 'aarch64'
          cpu = 'aarch64'
          endian = 'little'
          
          [properties]
          sys_root = '/opt/android-ndk-r25c/toolchains/llvm/prebuilt/linux-x86_64/sysroot'
          EOF
          
          # Use NDK's clang directly (more reliable than configure)
          export ANDROID_NDK_ROOT="${{ env.ANDROID_NDK_ROOT }}"
          export PATH="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          
          meson setup build-arm64 \
            --cross-file cross-android-arm64.meson \
            --prefix="$FRIDA_PFX" \
            -Dgumjs=enabled -Dv8=disabled -Ddatabase=disabled \
            -Dtests=disabled -Dgraft_tool=disabled -Ddevkits=gumjs \
            -Ddefault_library=static \
            --buildtype=release
          
          meson compile -C build-arm64 -j"$(nproc)"
          meson install -C build-arm64
          
          mkdir -p "$GITHUB_WORKSPACE/deps/frida-gum/arm64-v8a"
          GUMLIB="$(find "$FRIDA_PFX" -name 'libfrida-gumjs.a' 2>/dev/null | head -1)"
          GUMHDR="$(find "$FRIDA_PFX" -name 'frida-gumjs.h'   2>/dev/null | head -1)"
          [ -z "$GUMLIB" ] && { echo "ERROR: libfrida-gumjs.a not found"; find "$FRIDA_PFX" -type f -name '*.a'; exit 1; }
          [ -z "$GUMHDR" ] && { echo "ERROR: frida-gumjs.h not found";   find "$FRIDA_PFX" -type f -name '*.h';  exit 1; }
          cp "$GUMLIB" "$GITHUB_WORKSPACE/deps/frida-gum/arm64-v8a/libfrida-gumjs.a"
          cp "$GUMHDR" "$GITHUB_WORKSPACE/deps/frida-gum/arm64-v8a/frida-gumjs.h"
          echo "arm64-v8a frida-gum OK"

      # ============ FRIDA-GUM armeabi-v7a (MESON BUILD) ============
      - name: Cache frida-gum armeabi-v7a
        id: cache-frida-arm
        uses: actions/cache@v4
        with:
          path: deps/frida-gum/armeabi-v7a
          key: frida-gum-${{ env.FRIDA_GUM_VERSION }}-armeabi-v7a-ndk${{ env.NDK_VERSION }}-${{ runner.os }}-v4

      - name: Build frida-gum ${{ env.FRIDA_GUM_VERSION }} armeabi-v7a (meson)
        if: "${{ steps.cache-frida-arm.outputs.cache-hit != 'true' }}"
        run: |
          set -euo pipefail
          if [ ! -d frida-gum-src ]; then
            git clone --recurse-submodules --depth 1 --branch ${{ env.FRIDA_GUM_VERSION }} \
              https://github.com/frida/frida-gum.git frida-gum-src
          fi
          cd frida-gum-src
          rm -rf build-arm
          FRIDA_PFX="$GITHUB_WORKSPACE/frida-dist-arm"
          mkdir -p "$FRIDA_PFX"
          
          cat > cross-android-arm.meson << 'EOF'
          [binaries]
          c = '/opt/android-ndk-r25c/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi26-clang'
          cpp = '/opt/android-ndk-r25c/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi26-clang++'
          ar = '/opt/android-ndk-r25c/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'
          strip = '/opt/android-ndk-r25c/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'
          pkgconfig = 'pkg-config'
          
          [host_machine]
          system = 'linux'
          cpu_family = 'arm'
          cpu = 'armv7a'
          endian = 'little'
          
          [properties]
          sys_root = '/opt/android-ndk-r25c/toolchains/llvm/prebuilt/linux-x86_64/sysroot'
          EOF
          
          export ANDROID_NDK_ROOT="${{ env.ANDROID_NDK_ROOT }}"
          export PATH="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          
          meson setup build-arm \
            --cross-file cross-android-arm.meson \
            --prefix="$FRIDA_PFX" \
            -Dgumjs=enabled -Dv8=disabled -Ddatabase=disabled \
            -Dtests=disabled -Dgraft_tool=disabled -Ddevkits=gumjs \
            -Ddefault_library=static \
            --buildtype=release
          
          meson compile -C build-arm -j"$(nproc)"
          meson install -C build-arm
          
          mkdir -p "$GITHUB_WORKSPACE/deps/frida-gum/armeabi-v7a"
          GUMLIB="$(find "$FRIDA_PFX" -name 'libfrida-gumjs.a' 2>/dev/null | head -1)"
          GUMHDR="$(find "$FRIDA_PFX" -name 'frida-gumjs.h'   2>/dev/null | head -1)"
          [ -z "$GUMLIB" ] && { echo "ERROR: armeabi-v7a lib not found"; find "$FRIDA_PFX" -type f -name '*.a'; exit 1; }
          cp "$GUMLIB" "$GITHUB_WORKSPACE/deps/frida-gum/armeabi-v7a/libfrida-gumjs.a"
          cp "$GUMHDR" "$GITHUB_WORKSPACE/deps/frida-gum/armeabi-v7a/frida-gumjs.h"
          echo "armeabi-v7a frida-gum OK"

      # ============ DOBBY (CMAKE WITH PROPER TOOLCHAIN) ============
      - name: Cache Dobby
        id: cache-dobby
        uses: actions/cache@v4
        with:
          path: deps/dobby
          key: dobby-${{ env.DOBBY_COMMIT }}-ndk${{ env.NDK_VERSION }}-${{ runner.os }}-v2

      - name: Build Dobby for both ABIs
        if: "${{ steps.cache-dobby.outputs.cache-hit != 'true' }}"
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/LSPosed/Dobby.git dobby-src
          mkdir -p deps/dobby
          cp -r dobby-src/include deps/dobby/
          for ABI in arm64-v8a armeabi-v7a; do
            cmake -S dobby-src -B "dobby-src/build-$ABI" \
              -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI="$ABI" -DANDROID_PLATFORM=android-26 \
              -DANDROID_NDK="$ANDROID_NDK_ROOT" \
              -DCMAKE_BUILD_TYPE=Release -DDOBBY_DEBUG=OFF \
              -DDOBBY_GENERATE_SHARED=OFF -GNinja
            ninja -C "dobby-src/build-$ABI" -j"$(nproc)" dobby
            mkdir -p "deps/dobby/$ABI"
            cp "dobby-src/build-$ABI/libdobby.a" "deps/dobby/$ABI/"
          done

      # ============ IMGUI ============
      - name: Clone ImGui ${{ env.IMMGUI_VERSION }}
        run: |
          git clone --depth 1 --branch ${{ env.IMMGUI_VERSION }} \
            https://github.com/ocornut/imgui.git imgui
          test -f imgui/backends/imgui_impl_opengl3.cpp

      # ============ SMALI FAT JAR ============
      - name: Download smali ${{ env.SMALI_VERSION }} fat jar
        run: |
          mkdir -p deps/smali
          BASE="https://dl.google.com/dl/android/maven2/com/android/tools/smali"
          SMVER="${{ env.SMALI_VERSION }}"
          for art in smali smali-dexlib2 smali-util; do
            wget -q "$BASE/$art/$SMVER/$art-$SMVER.jar" -O "deps/smali/$art.jar"
          done
          wget -q "https://repo1.maven.org/maven2/com/beust/jcommander/1.72/jcommander-1.72.jar" \
            -O deps/smali/jcommander.jar
          wget -q "https://repo1.maven.org/maven2/com/google/guava/guava/30.1.1-android/guava-30.1.1-android.jar" \
            -O deps/smali/guava.jar
          MERGE="$(mktemp -d)"
          for j in deps/smali/*.jar; do unzip -nqo "$j" -d "$MERGE" 2>/dev/null || true; done
          jar cf deps/smali/smali-fat.jar -C "$MERGE" .
          ls -lh deps/smali/smali-fat.jar

      # ============ PROJECT STRUCTURE ============
      - name: Create project directories
        run: |
          mkdir -p src agent \
            sample-app/app/src/main/java/com/dextool/app \
            sample-app/app/src/main/assets \
            sample-app/app/src/main/res/values \
            sample-app/app/src/main/jniLibs/arm64-v8a \
            sample-app/app/src/main/jniLibs/armeabi-v7a \
            out/lib/arm64-v8a out/lib/armeabi-v7a \
            .github/workflows

      # ============ SOURCE FILE GENERATION (identical to your original, omitted for brevity) ============
      # ALL your cat > src/... << 'EOF' steps go here EXACTLY as you had them.
      # I'm omitting them for space — KEEP YOUR ORIGINAL GENERATION STEPS.
      # The only changes needed are in the BUILD STEPS below.

      # ============ BUILD libtool.so arm64-v8a (WITH DEBUG SYMBOLS FOR CRASH ANALYSIS) ============
      - name: Build libtool.so arm64-v8a (RelWithDebInfo)
        run: |
          cmake -S . -B build-arm64 \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -GNinja
          ninja -C build-arm64 -j"$(nproc)" tool
          # Keep unstripped for crash analysis
          cp build-arm64/libtool.so out/lib/arm64-v8a/libtool.so.unstripped
          STRIP="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          "$STRIP" --strip-unneeded build-arm64/libtool.so \
                   -o out/lib/arm64-v8a/libtool.so
          echo "arm64: $(du -sh out/lib/arm64-v8a/libtool.so)"

      # ============ BUILD libtool.so armeabi-v7a ============
      - name: Build libtool.so armeabi-v7a (RelWithDebInfo)
        run: |
          cmake -S . -B build-arm \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=armeabi-v7a -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -GNinja
          ninja -C build-arm -j"$(nproc)" tool
          cp build-arm/libtool.so out/lib/armeabi-v7a/libtool.so.unstripped
          STRIP="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          "$STRIP" --strip-unneeded build-arm/libtool.so \
                   -o out/lib/armeabi-v7a/libtool.so
          echo "armeabi-v7a: $(du -sh out/lib/armeabi-v7a/libtool.so)"

      # ============ CRASH DEBUG: addr2line SYMBOLS ============
      - name: Generate addr2line maps for crash debugging
        if: always()
        run: |
          for ABI in arm64-v8a armeabi-v7a; do
            UNS="out/lib/$ABI/libtool.so.unstripped"
            [ -f "$UNS" ] || continue
            OBJDUMP="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-objdump"
            ADDR2LINE="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-addr2line"
            $OBJDUMP -t "$UNS" > "out/lib/$ABI/libtool.sym" 2>/dev/null || true
            $ADDR2LINE -e "$UNS" -f -C 0x0 2>/dev/null | head -5 > "out/lib/$ABI/addr2line.test" || true
          done
          ls -la out/lib/*/

      # ============ SAMPLE APP BUILDS (SEPARATE COPIES, NO IN-PLACE MODIFICATION) ============
      - name: Prepare sample-app with libs (with libtool)
        run: |
          cp out/lib/arm64-v8a/libtool.so sample-app/app/src/main/jniLibs/arm64-v8a/libtool.so
          cp out/lib/armeabi-v7a/libtool.so sample-app/app/src/main/jniLibs/armeabi-v7a/libtool.so
          cp deps/smali/smali-fat.jar sample-app/app/src/main/assets/smali-fat.jar

      - name: Build sample-signed.apk (with libtool.so)
        run: |
          cd sample-app
          gradle assembleRelease --no-daemon -q
          cp app/build/outputs/apk/release/app-release.apk \
             "$GITHUB_WORKSPACE/sample-signed.apk"
          echo "sample-signed.apk: $(du -sh "$GITHUB_WORKSPACE/sample-signed.apk")"

      - name: Prepare sample-app without libs (nolib variant)
        run: |
          rm -f sample-app/app/src/main/jniLibs/arm64-v8a/libtool.so
          rm -f sample-app/app/src/main/jniLibs/armeabi-v7a/libtool.so
          # Create a variant DexToolApp without loadLibrary
          cat > sample-app/app/src/main/java/com/dextool/app/DexToolAppNoLib.java << 'DXTAPPJNL'
          package com.dextool.app;
          import android.app.Application;
          import android.util.Log;
          import java.io.*;
          public class DexToolAppNoLib extends Application {
              private static final String TAG = "DexToolApp";
              private static final String DL  = "/sdcard/Download";
              @Override public void onCreate() {
                  super.onCreate();
                  new File(DL).mkdirs();
                  try (FileOutputStream f = new FileOutputStream(DL+"/dextool-boot.marker")) {
                      f.write(("boot ts="+System.currentTimeMillis()+"\n").getBytes());
                  } catch (IOException e) { Log.w(TAG, "boot marker: "+e.getMessage()); }
                  Thread t = new Thread(() -> {
                      while (true) {
                          try { Thread.sleep(5000); copyLogs(); }
                          catch (InterruptedException e) { break; }
                          catch (Exception e) { Log.w(TAG, "copier: "+e.getMessage()); }
                      }
                  }, "dextool-copier");
                  t.setDaemon(true); t.start();
                  Thread.setDefaultUncaughtExceptionHandler((thr, ex) -> {
                      try (FileOutputStream f = new FileOutputStream(DL+"/dextool-crash.log",true)) {
                          f.write(("JAVA_CRASH thr="+thr.getName()+" "+ex+"\n").getBytes());
                      } catch (IOException ignored) {}
                  });
              }
              private void copyLogs() throws IOException {
                  String[] names = {"dextool.log","dextool-debug.log","dextool-crash.log"};
                  new File(DL).mkdirs();
                  for (String n : names) {
                      File s = new File(getFilesDir(), "dextool-logs/"+n);
                      if (!s.exists()) continue;
                      File d = new File(DL, n);
                      try (InputStream is = new FileInputStream(s); OutputStream os = new FileOutputStream(d, true)) {
                          byte[] buf = new byte[8192]; int len;
                          while ((len=is.read(buf))!=-1) os.write(buf,0,len);
                      }
                  }
              }
          }
          DXTAPPJNL
          # Temporarily swap manifest to use NoLib app
          sed -i 's/android:name=".DexToolApp"/android:name=".DexToolAppNoLib"/' \
            sample-app/app/src/main/AndroidManifest.xml

      - name: Build sample-nolib-signed.apk (without libtool.so)
        run: |
          cd sample-app
          gradle assembleRelease --no-daemon -q
          cp app/build/outputs/apk/release/app-release.apk \
             "$GITHUB_WORKSPACE/sample-nolib-signed.apk"
          echo "nolib: $(du -sh "$GITHUB_WORKSPACE/sample-nolib-signed.apk")"

      # Restore manifest
      - name: Restore manifest
        run: |
          sed -i 's/android:name=".DexToolAppNoLib"/android:name=".DexToolApp"/' \
            sample-app/app/src/main/AndroidManifest.xml
          rm -f sample-app/app/src/main/java/com/dextool/app/DexToolAppNoLib.java

      # ============ GENERATE README.md and .gitignore ============
      - name: Generate README.md and .gitignore
        run: |
          cat > README.md << 'DXTRDME'
          # Dex-tool
          
          Standalone runtime instrumentation for Android APKs.
          libtool.so for armeabi-v7a + arm64-v8a. No root. API 26+.
          
          ## Fixes in this version
          
              1. Touch offset: Activity.dispatchTouchEvent coordinates are
                 corrected by the content-view y-offset measured in
                 onWindowFocusChanged (removes ActionBar shift).
          
              2. Keyboard: invisible EditText + TextWatcher bridge. When ImGui
                 sets WantCaptureKeyboard, the agent posts showKeyboard to the
                 C++ layer, which calls frida_post back to the GumJS agent,
                 which shows the IME on the main thread. Characters arrive via
                 TextWatcher -> dextool_add_char NativeFunction -> ImGui
                 AddInputCharacter on the GL thread.
          
              3. Font size: FontGlobalScale is updated immediately when the
                 slider changes value.
          
              4. Classes tab: JSON response from openClass is parsed in the
                 message callback and stored in ClassWin.methods/fields under
                 mutex. CollapsingHeader now shows method/field counts.
          
              5. Menu in injected APKs: eglSwapBuffersWithDamageKHR is now
                 also hooked (many apps use this instead of eglSwapBuffers).
                 glBindFramebuffer(0) is called before ImGui render to ensure
                 we draw to the default framebuffer.
          
              6. Thread safety: menu data structures are protected with a
                 pthread_mutex (message callback = GumJS thread, draw = GL thread).
          
          ## Usage
          
              1. Drop libtool.so into lib/arm64-v8a/ and lib/armeabi-v7a/.
              2. Inject System.loadLibrary("tool") into Application.onCreate()
                 or the launcher Activity.
              3. Copy smali-fat.jar into assets/.
              4. Re-sign and install.
          
          ## Components
          
              frida-gum 16.7.19   QuickJS / GumJS scripting runtime
              Dobby (LSPosed)     inline function hook framework
              ImGui 1.90.4        immediate-mode overlay GUI (ES2 mode)
              smali 3.0.7         runtime .smali to DEX assembler (bundled JAR)
          DXTRDME
          cat > .gitignore << 'DXTGI'
          build-arm64/
          build-arm/
          frida-gum-src/
          frida-dist-arm/
          frida-dist-arm64/
          dobby-src/
          imgui/
          out/
          *.zip
          *.tar.*
          DXTGI

      # ============ UPLOAD ARTIFACTS ============
      - name: Upload libtool.so artifacts (stripped + unstripped + symbols)
        uses: actions/upload-artifact@v4
        with:
          name: libtool-so-both-abis
          path: |
            out/lib/arm64-v8a/libtool.so
            out/lib/arm64-v8a/libtool.so.unstripped
            out/lib/arm64-v8a/libtool.sym
            out/lib/armeabi-v7a/libtool.so
            out/lib/armeabi-v7a/libtool.so.unstripped
            out/lib/armeabi-v7a/libtool.sym

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sample-apks
          path: |
            sample-signed.apk
            sample-nolib-signed.apk

      # ============ COMMIT GENERATED SOURCES (NO INFINITE LOOP) ============
      - name: Commit and push generated sources to dev
        if: github.ref == 'refs/heads/dev' && github.event_name != 'pull_request'
        run: |
          # Only commit if there are actual changes to tracked source files
          git status --porcelain | grep -E '^(M|A|D).*(CMakeLists\.txt|src/|agent/|sample-app/|README\.md|\.gitignore|\.github/workflows/build\.yml)' || {
            echo "No relevant source changes to commit."
            exit 0
          }
          
          git add --ignore-errors \
            CMakeLists.txt \
            src/ \
            agent/ \
            sample-app/ \
            README.md \
            .gitignore \
            .github/workflows/build.yml
          
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "chore: regenerate sources [skip ci]"
            # Push with leak-free token
            git push origin HEAD:dev
            echo "Pushed to dev."
          fi
