name: Build Dex-tool

on:
  workflow_dispatch:
  push:
    branches: [ main ]

# [skip ci] on commit prevents loops from the push-to-dev step

env:
  ANDROID_API: android-26
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # ═══════════════════════════════════════════════════════════
      # NOTE: steps 1..12 (checkout, NDK setup, Frida/ImGui/Dobby
      # downloads, CMakeLists.txt, logger.h/cpp, deps/smali)
      # are expected to be in the earlier part of the workflow
      # (the file this was continued from).
      # ═══════════════════════════════════════════════════════════

      - name: Alias NDK path for CMake
        run: echo "ANDROID_NDK_ROOT=$ANDROID_NDK_HOME" >> $GITHUB_ENV

      # ═══════════════════════════════════════════════════════════
      # 13. GENERATE — overlay.h / overlay.cpp
      # ═══════════════════════════════════════════════════════════
      - name: Generate overlay.h and overlay.cpp
        run: |
          cat > src/overlay.h << 'OVLHEOF'
#pragma once
#include <jni.h>

void overlay_set_java_vm(JavaVM* vm);
void overlay_on_touch(float x, float y, bool pressed);
bool install_swap_hook();
OVLHEOF

          cat > src/overlay.cpp << 'OVLCEOF'
#include "overlay.h"
#include "logger.h"
#include "menu.h"
#include "frida_bridge.h"
#include "touch.h"
#include "imgui.h"
#include "imgui_impl_opengl3.h"
#include "dobby.h"
#include "frida-gumjs.h"
#include <dlfcn.h>
#include <cstring>
#include <pthread.h>
#include <atomic>
#include <EGL/egl.h>
#include <GLES3/gl3.h>

typedef EGLBoolean (*fn_eglSwapBuffers)(EGLDisplay, EGLSurface);
static fn_eglSwapBuffers  g_orig_eglSwapBuffers = nullptr;
static std::atomic<bool>  g_gum_initialized{false};
static std::atomic<bool>  g_imgui_initialized{false};
static JavaVM*            g_jvm = nullptr;

struct TouchState {
    std::atomic<float> x{0.f};
    std::atomic<float> y{0.f};
    std::atomic<bool>  pressed{false};
    std::atomic<bool>  dirty{false};
};
static TouchState g_touch;

void overlay_set_java_vm(JavaVM* vm) { g_jvm = vm; }

void overlay_on_touch(float x, float y, bool pressed) {
    g_touch.x.store(x);
    g_touch.y.store(y);
    g_touch.pressed.store(pressed);
    g_touch.dirty.store(true);
}

static void* frida_thread_entry(void*) {
    frida_bridge_start(g_jvm);
    return nullptr;
}

static bool s_imgui_failed = false;

static void init_imgui_once(EGLDisplay dpy, EGLSurface surf) {
    EGLint w = 1080, h = 1920;
    eglQuerySurface(dpy, surf, EGL_WIDTH,  &w);
    eglQuerySurface(dpy, surf, EGL_HEIGHT, &h);

    const GLubyte* ver = glGetString(GL_VERSION);
    if (!ver || !strstr((const char*)ver, "OpenGL ES 3")) {
        LOGE("ImGui disabled: not ES3 (got: %s)", ver ? (const char*)ver : "null");
        s_imgui_failed = true;
        return;
    }
    ImGui::CreateContext();
    ImGuiIO& io   = ImGui::GetIO();
    io.DisplaySize = ImVec2((float)w, (float)h);
    io.DeltaTime   = 1.f / 60.f;
    io.IniFilename = nullptr;
    io.ConfigFlags |= ImGuiConfigFlags_NoMouseCursorChange;
    ImGui::StyleColorsDark();
    ImGui::GetStyle().WindowRounding = 6.f;
    ImGui_ImplOpenGL3_Init("#version 300 es");
    menu_init();
    g_imgui_initialized = true;
    LOGI("ImGui up (%dx%d ES3)", w, h);
}

// CRITICAL: calls g_orig_eglSwapBuffers, NOT eglSwapBuffers
static EGLBoolean my_eglSwapBuffers(EGLDisplay dpy, EGLSurface surf) {
    // First-call block: runs once on GL thread, deferred from JNI_OnLoad
    // so a valid EGL context already exists when gum_init_embedded() fires.
    if (!g_gum_initialized.exchange(true)) {
        gum_init_embedded();      // FIRST gum_* call, on GL thread, context valid
        log_info("[overlay] gum_init_embedded done");

        // Spawn frida bridge on its own thread
        pthread_t ft;
        pthread_attr_t attr;
        pthread_attr_init(&attr);
        pthread_attr_setdetachstate(&attr, PTHREAD_CREATE_DETACHED);
        pthread_create(&ft, &attr, frida_thread_entry, nullptr);
        pthread_attr_destroy(&attr);

        // Install touch hook
        touch_install_hooks();

        init_imgui_once(dpy, surf);
    }

    // ImGui frame
    if (g_imgui_initialized && !s_imgui_failed) {
        ImGuiIO& io = ImGui::GetIO();

        // Inject touch
        if (g_touch.dirty.exchange(false)) {
            io.MousePos     = ImVec2(g_touch.x.load(), g_touch.y.load());
            io.MouseDown[0] = g_touch.pressed.load();
        }

        ImGui_ImplOpenGL3_NewFrame();
        ImGui::NewFrame();
        menu_draw();
        ImGui::Render();
        ImGui_ImplOpenGL3_RenderDrawData(ImGui::GetDrawData());
    }

    // ALWAYS call original — NEVER recurse into eglSwapBuffers symbol
    return g_orig_eglSwapBuffers(dpy, surf);
}

bool install_swap_hook() {
    void* egl_handle = dlopen("libEGL.so", RTLD_NOW);
    if (!egl_handle) {
        LOGE("dlopen libEGL.so failed: %s", dlerror());
        return false;
    }
    void* swap_sym = dlsym(egl_handle, "eglSwapBuffers");
    if (!swap_sym) {
        LOGE("dlsym eglSwapBuffers failed");
        return false;
    }
    int rc = DobbyHook(swap_sym,
                       (void*)my_eglSwapBuffers,
                       (void**)&g_orig_eglSwapBuffers);
    if (rc != 0) {
        LOGE("DobbyHook eglSwapBuffers failed: %d", rc);
        return false;
    }
    LOGI("eglSwapBuffers hooked OK");
    return true;
}
OVLCEOF
          echo "overlay generated."

      # ═══════════════════════════════════════════════════════════
      # 14. GENERATE — touch.h / touch.cpp
      # ═══════════════════════════════════════════════════════════
      - name: Generate touch.h and touch.cpp
        run: |
          cat > src/touch.h << 'THEOF'
#pragma once
// Install hooks for touch input forwarding to ImGui.
// Primary: hook libinput.so  (android_input_event_*)
// Fallback: hook MotionEvent via GumJS
void touch_install_hooks();
THEOF

          cat > src/touch.cpp << 'TCEOF'
#include "touch.h"
#include "overlay.h"
#include "logger.h"
#include "dobby.h"
#include <dlfcn.h>
#include <android/input.h>
#include <cstdint>

// ── libinput approach ──────────────────────────────────────────
// AInputEvent_getType / AMotionEvent_getX / AMotionEvent_getY live in
// libandroid.so but the actual dispatch uses android_app_process_input
// which is internal to libinput.so.  We hook AInputQueue_getEvent
// to intercept before the app sees it.

typedef int32_t (*fn_AIQ_getEvent)(AInputQueue*, AInputEvent**);
static fn_AIQ_getEvent g_orig_getEvent = nullptr;

static int32_t my_AIQ_getEvent(AInputQueue* q, AInputEvent** ev) {
    int32_t rc = g_orig_getEvent(q, ev);
    if (rc >= 0 && ev && *ev) {
        int32_t type = AInputEvent_getType(*ev);
        if (type == AINPUT_EVENT_TYPE_MOTION) {
            int32_t action = AMotionEvent_getAction(*ev) & AMOTION_EVENT_ACTION_MASK;
            float x = AMotionEvent_getX(*ev, 0);
            float y = AMotionEvent_getY(*ev, 0);
            bool pressed = (action == AMOTION_EVENT_ACTION_DOWN ||
                            action == AMOTION_EVENT_ACTION_MOVE);
            overlay_on_touch(x, y, pressed);
        }
    }
    return rc;
}

void touch_install_hooks() {
    void* lib = dlopen("libandroid.so", RTLD_NOW);
    if (!lib) { LOGE("touch: dlopen libandroid.so failed"); return; }
    void* sym = dlsym(lib, "AInputQueue_getEvent");
    if (!sym) { LOGE("touch: AInputQueue_getEvent not found"); return; }
    int rc = DobbyHook(sym,
                       (void*)my_AIQ_getEvent,
                       (void**)&g_orig_getEvent);
    if (rc != 0)
        LOGE("touch: DobbyHook AInputQueue_getEvent failed: %d", rc);
    else
        LOGI("touch: AInputQueue_getEvent hooked");
}
TCEOF
          echo "touch generated."

