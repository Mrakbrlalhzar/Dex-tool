# === BRANCH TARGET: dev ===
#
# Dex-tool: reproducible Android native build
#
# Source dependencies:
#   Frida Gum:       16.7.19
#   Frida GumJS:     16.7.19 (QuickJS)
#   Frida Java:      frida-java-bridge 6.3.9
#   frida-compile:   10.2.1
#   Dobby:           5dfc854 (pinned commit)
#   Dear ImGui:      v1.92.9b
#   Android NDK:     25.2.9519653
#   Android API:     26
#
# Important:
#   - Java 17 is required by Android SDK command-line tools.
#   - Gradle 8.7 is used with Android Gradle Plugin 8.6.1.
#   - frida-gum standalone uses Meson directly.
#   - GumJS uses QuickJS.
#   - frida-core is deliberately not built.
#   - The Java bridge is bundled separately with frida-compile.
#
# Limitations:
#   This workflow builds a basic GLES sample and native dependencies.
#   It does not implement universal ART method replacement,
#   universal TLS decryption, or universal Java field watchpoints.

name: Dex-tool Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - dev

permissions:
  contents: write

concurrency:
  group: dextool-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    env:
      ANDROID_API: 26
      ANDROID_NDK_VERSION: 25.2.9519653
      FRIDA_VERSION: 16.7.19
      FRIDA_JAVA_BRIDGE_VERSION: 6.3.9
      DOBBY_COMMIT: 5dfc854
      IMGUI_TAG: v1.92.9b
      FRIDA_COMPILE_VERSION: 10.2.1
      GRADLE_VERSION: 8.7

    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Verify Java
        shell: bash
        run: |
          set -euxo pipefail

          java -version
          javac -version

          JAVA_MAJOR="$(java -version 2>&1 | sed -n '1s/.*version "\([0-9]*\).*/\1/p')"

          if [ "$JAVA_MAJOR" != "17" ]; then
              echo "Java 17 is required, found: $JAVA_MAJOR"
              exit 1
          fi

      - name: Install host dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            llvm \
            lld \
            cmake \
            ninja-build \
            meson \
            pkg-config \
            python3 \
            python3-pip \
            python3-setuptools \
            python3-wheel \
            git \
            curl \
            wget \
            unzip \
            zip \
            xz-utils \
            bzip2 \
            autoconf \
            automake \
            libtool \
            gettext \
            flex \
            bison \
            nasm \
            patchelf \
            file

          python3 -m pip install --upgrade \
            meson \
            ninja \
            packaging \
            six \
            pyyaml

          node --version
          npm --version
          java -version

      - name: Install Gradle
        shell: bash
        run: |
          set -euxo pipefail

          GRADLE_DIR="$HOME/gradle"

          mkdir -p "$GRADLE_DIR"

          curl -fL \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
            -o "$HOME/gradle.zip"

          unzip -q "$HOME/gradle.zip" -d "$GRADLE_DIR"

          echo "$GRADLE_DIR/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

          "$GRADLE_DIR/gradle-${GRADLE_VERSION}/bin/gradle" --version

      - name: Generate project structure
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p \
            .github/workflows \
            native/src \
            native/include \
            native/overlay \
            native/third_party \
            agent \
            sample/app/src/main/java/com/dextool/sample \
            sample/app/src/main/assets \
            sample/app/src/main/jniLibs/armeabi-v7a \
            sample/app/src/main/jniLibs/arm64-v8a \
            sample/gradle/wrapper \
            build

          cat > .gitignore <<'EOF'
          .gradle/
          build/
          .cxx/
          .externalNativeBuild/
          node_modules/
          dist/
          *.o
          *.a
          *.so
          *.apk
          EOF

      - name: Generate CMake project
        shell: bash
        run: |
          set -euxo pipefail

          cat > native/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.22)

          project(dextool LANGUAGES C CXX)

          set(CMAKE_C_STANDARD 11)
          set(CMAKE_CXX_STANDARD 17)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)

          set(CMAKE_POSITION_INDEPENDENT_CODE ON)

          if(NOT ANDROID)
              message(FATAL_ERROR "Android cross-compilation required")
          endif()

          if(NOT DEFINED DEPS_ROOT)
              message(FATAL_ERROR "DEPS_ROOT missing")
          endif()

          if(NOT DEFINED FRIDA_ROOT)
              message(FATAL_ERROR "FRIDA_ROOT missing")
          endif()

          add_subdirectory(
              "${DEPS_ROOT}/Dobby"
              "${CMAKE_CURRENT_BINARY_DIR}/dobby"
              EXCLUDE_FROM_ALL
          )

          set(IMGUI_DIR "${DEPS_ROOT}/imgui")

          add_library(imgui STATIC
              ${IMGUI_DIR}/imgui.cpp
              ${IMGUI_DIR}/imgui_draw.cpp
              ${IMGUI_DIR}/imgui_tables.cpp
              ${IMGUI_DIR}/imgui_widgets.cpp
              ${IMGUI_DIR}/backends/imgui_impl_opengl3.cpp
          )

          target_include_directories(imgui PUBLIC
              ${IMGUI_DIR}
              ${IMGUI_DIR}/backends
          )

          target_compile_definitions(imgui PRIVATE
              IMGUI_IMPL_OPENGL_ES3
          )

          add_library(tool SHARED
              src/main.cpp
              src/overlay.cpp
              src/frida_bridge.cpp
              src/agent_bundle.cpp
          )

          target_include_directories(tool PRIVATE
              include
              ${IMGUI_DIR}
              ${IMGUI_DIR}/backends
              ${FRIDA_ROOT}/include
              ${FRIDA_ROOT}/include/gum-1.0
          )

          target_compile_definitions(tool PRIVATE
              IMGUI_IMPL_OPENGL_ES3
              GUM_STATIC
              GUMJS_STATIC
          )

          target_compile_options(tool PRIVATE
              -fvisibility=hidden
              -fPIC
              -Wall
              -Wextra
              -Wno-unused-parameter
          )

          target_link_libraries(tool PRIVATE
              dobby_static
              imgui
              EGL
              GLESv3
              android
              log
              dl
              m
              z
          )

          file(GLOB FRIDA_STATIC_LIBRARIES
              "${FRIDA_ROOT}/lib/*.a"
              "${FRIDA_ROOT}/lib/*/*.a"
          )

          if(NOT FRIDA_STATIC_LIBRARIES)
              message(FATAL_ERROR
                  "No installed Frida static archives found"
              )
          endif()

          message(STATUS "Frida archives:")

          foreach(lib ${FRIDA_STATIC_LIBRARIES})
              message(STATUS "  ${lib}")
          endforeach()

          target_link_libraries(tool PRIVATE
              "-Wl,--start-group"
              ${FRIDA_STATIC_LIBRARIES}
              "-Wl,--end-group"
          )

          set_target_properties(tool PROPERTIES
              OUTPUT_NAME "tool"
              CXX_VISIBILITY_PRESET hidden
              VISIBILITY_INLINES_HIDDEN ON
          )
          EOF

      - name: Generate native overlay
        shell: bash
        run: |
          set -euxo pipefail

          cat > native/include/overlay.h <<'EOF'
          #pragma once

          void OverlayInitialize();
          void OverlayRender();
          void OverlayShutdown();
          EOF

          cat > native/src/overlay.cpp <<'EOF'
          #include "overlay.h"

          #include "imgui.h"
          #include "imgui_impl_opengl3.h"

          #include <GLES3/gl3.h>
          #include <cstring>

          static bool initialized = false;
          static bool visible = true;
          static bool enabled = true;

          static float opacity = 0.94f;
          static float fontSize = 16.0f;

          void OverlayInitialize() {
              if (initialized) {
                  return;
              }

              const GLubyte* version = glGetString(GL_VERSION);

              if (!version) {
                  enabled = false;
                  return;
              }

              const char* versionText =
                  reinterpret_cast<const char*>(version);

              if (std::strstr(versionText, "OpenGL ES 3") == nullptr) {
                  enabled = false;
                  return;
              }

              IMGUI_CHECKVERSION();

              ImGui::CreateContext();

              ImGui::StyleColorsDark();

              ImGui::GetStyle().Alpha = opacity;

              if (!ImGui_ImplOpenGL3_Init("#version 300 es")) {
                  ImGui::DestroyContext();
                  enabled = false;
                  return;
              }

              initialized = true;
          }

          static void SettingsTab() {
              ImGui::SliderFloat(
                  "Font size",
                  &fontSize,
                  10.0f,
                  30.0f
              );

              ImGui::SliderFloat(
                  "Opacity",
                  &opacity,
                  0.2f,
                  1.0f
              );

              ImGui::GetStyle().Alpha = opacity;
          }

          static void PatchesTab() {
              ImGui::TextUnformatted("Java patch registry");

              ImGui::TextDisabled(
                  "Waiting for agent connection"
              );
          }

          static void HooksTab() {
              ImGui::TextUnformatted("Java / Smali / noop hooks");
          }

          static void TrackerTab() {
              ImGui::TextUnformatted("Tracked method events");
          }

          static void RecorderTab() {
              ImGui::TextUnformatted("Execution recorder");
          }

          static void MonitorTab() {
              ImGui::TextUnformatted("Network monitoring");
          }

          static void ScriptTab() {
              static char script[8192] = {};

              ImGui::InputTextMultiline(
                  "JavaScript",
                  script,
                  sizeof(script),
                  ImVec2(-1, 180)
              );

              if (ImGui::Button("Execute")) {
                  // Script execution requires native bridge dispatch.
              }
          }

          static void ClassesTab() {
              ImGui::TextUnformatted("Loaded Java classes");
          }

          void OverlayRender() {
              if (!enabled || !initialized || !visible) {
                  return;
              }

              ImGui_ImplOpenGL3_NewFrame();

              ImGui::NewFrame();

              ImGui::SetNextWindowSize(
                  ImVec2(560, 420),
                  ImGuiCond_FirstUseEver
              );

              if (ImGui::Begin(
                  "Dex-tool",
                  &visible,
                  ImGuiWindowFlags_NoCollapse
              )) {
                  if (ImGui::BeginTabBar("MainTabs")) {

                      if (ImGui::BeginTabItem("Settings")) {
                          SettingsTab();
                          ImGui::EndTabItem();
                      }

                      if (ImGui::BeginTabItem("Patches")) {
                          PatchesTab();
                          ImGui::EndTabItem();
                      }

                      if (ImGui::BeginTabItem("Hooks")) {
                          HooksTab();
                          ImGui::EndTabItem();
                      }

                      if (ImGui::BeginTabItem("Tracker")) {
                          TrackerTab();
                          ImGui::EndTabItem();
                      }

                      if (ImGui::BeginTabItem("Recorder")) {
                          RecorderTab();
                          ImGui::EndTabItem();
                      }

                      if (ImGui::BeginTabItem("Monitor")) {
                          MonitorTab();
                          ImGui::EndTabItem();
                      }

                      if (ImGui::BeginTabItem("Script")) {
                          ScriptTab();
                          ImGui::EndTabItem();
                      }

                      if (ImGui::BeginTabItem("Classes")) {
                          ClassesTab();
                          ImGui::EndTabItem();
                      }

                      ImGui::EndTabBar();
                  }
              }

              ImGui::End();

              ImGui::Render();

              ImGui_ImplOpenGL3_RenderDrawData(
                  ImGui::GetDrawData()
              );
          }

          void OverlayShutdown() {
              if (!initialized) {
                  return;
              }

              ImGui_ImplOpenGL3_Shutdown();
              ImGui::DestroyContext();

              initialized = false;
          }
          EOF

      - name: Generate Frida embedding bridge
        shell: bash
        run: |
          set -euxo pipefail

          cat > native/src/frida_bridge.cpp <<'EOF'
          #include <gum/gum.h>
          #include <gum/gumscript.h>

          #include <android/log.h>

          #include <mutex>

          extern const char kAgentBundle[];

          #define TAG "DexTool"

          static GumScript* script = nullptr;
          static std::mutex scriptMutex;

          static void on_message(
              GumScript* source,
              const gchar* message,
              GBytes* data,
              gpointer user_data
          ) {
              __android_log_print(
                  ANDROID_LOG_INFO,
                  TAG,
                  "GumJS: %s",
                  message ? message : "(empty)"
              );
          }

          extern "C" bool DexToolInitializeGum() {
              std::lock_guard<std::mutex> guard(scriptMutex);

              if (script) {
                  return true;
              }

              gum_init_embedded();

              GError* error = nullptr;

              GumScriptBackend* backend =
                  gum_script_backend_get_default();

              script = gum_script_backend_create_sync(
                  backend,
                  "dextool-agent",
                  kAgentBundle,
                  nullptr,
                  nullptr,
                  &error
              );

              if (!script) {
                  __android_log_print(
                      ANDROID_LOG_ERROR,
                      TAG,
                      "Script creation failed: %s",
                      error ? error->message : "unknown"
                  );

                  if (error) {
                      g_error_free(error);
                  }

                  return false;
              }

              gum_script_set_message_handler(
                  script,
                  on_message,
                  nullptr,
                  nullptr
              );

              gum_script_load_sync(
                  script,
                  nullptr,
                  &error
              );

              if (error) {
                  __android_log_print(
                      ANDROID_LOG_ERROR,
                      TAG,
                      "Script loading failed: %s",
                      error->message
                  );

                  g_error_free(error);
                  g_object_unref(script);
                  script = nullptr;

                  return false;
              }

              return true;
          }

          extern "C" void DexToolPost(const char* message) {
              std::lock_guard<std::mutex> guard(scriptMutex);

              if (!script || !message) {
                  return;
              }

              gum_script_post(
                  script,
                  message,
                  nullptr
              );
          }
          EOF

          cat > native/include/frida_bridge.h <<'EOF'
          #pragma once

          bool DexToolInitializeGum();

          void DexToolPost(const char* message);
          EOF

      - name: Generate EGL hook and JNI entry point
        shell: bash
        run: |
          set -euxo pipefail

          cat > native/src/main.cpp <<'EOF'
          #include "overlay.h"
          #include "frida_bridge.h"

          #include <dobby.h>

          #include <EGL/egl.h>
          #include <GLES3/gl3.h>
          #include <dlfcn.h>
          #include <jni.h>

          #include <android/log.h>

          #include <atomic>
          #include <unistd.h>
          #include <fcntl.h>
          #include <cstring>

          #define TAG "DexTool"

          using SwapFn = EGLBoolean (*)(
              EGLDisplay,
              EGLSurface
          );

          static SwapFn originalSwap = nullptr;

          static std::atomic<bool> initialized{false};
          static std::atomic<bool> gumReady{false};

          static void marker(const char* text) {
              int fd = open(
                  "/data/local/tmp/dextool-jni.marker",
                  O_WRONLY | O_CREAT | O_APPEND,
                  0600
              );

              if (fd >= 0) {
                  write(fd, text, strlen(text));
                  write(fd, "\n", 1);
                  close(fd);
              }
          }

          static EGLBoolean replacementSwap(
              EGLDisplay display,
              EGLSurface surface
          ) {
              if (!initialized.exchange(true)) {
                  const GLubyte* version = glGetString(GL_VERSION);

                  if (version) {
                      OverlayInitialize();
                  }
              }

              if (!gumReady.load()) {
                  if (DexToolInitializeGum()) {
                      gumReady.store(true);
                  }
              }

              OverlayRender();

              if (originalSwap) {
                  return originalSwap(display, surface);
              }

              return EGL_FALSE;
          }

          static void install_swap_hook() {
              void* address = dlsym(
                  RTLD_DEFAULT,
                  "eglSwapBuffers"
              );

              if (!address) {
                  void* handle = dlopen(
                      "libEGL.so",
                      RTLD_NOW
                  );

                  if (handle) {
                      address = dlsym(
                          handle,
                          "eglSwapBuffers"
                      );
                  }
              }

              if (!address) {
                  marker("eglSwapBuffers not found");
                  return;
              }

              int result = DobbyHook(
                  address,
                  reinterpret_cast<void*>(replacementSwap),
                  reinterpret_cast<void**>(&originalSwap)
              );

              marker(
                  result == 0
                      ? "egl hook installed"
                      : "egl hook failed"
              );
          }

          __attribute__((constructor))
          static void dextool_constructor() {
              marker("constructor");
          }

          extern "C" JNIEXPORT jint JNICALL
          JNI_OnLoad(JavaVM* vm, void*) {
              marker("JNI_OnLoad entry");

              install_swap_hook();

              marker("JNI_OnLoad hook installed");

              marker("JNI_OnLoad before return");

              return JNI_VERSION_1_6;
          }
          EOF

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euxo pipefail

          SDK_ROOT="$HOME/android-sdk"

          mkdir -p "$SDK_ROOT/cmdline-tools"

          cd "$HOME"

          curl -fL \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -o commandlinetools.zip

          unzip -q commandlinetools.zip \
            -d "$SDK_ROOT/cmdline-tools"

          mkdir -p "$SDK_ROOT/cmdline-tools/latest"

          mv "$SDK_ROOT/cmdline-tools/cmdline-tools/"* \
            "$SDK_ROOT/cmdline-tools/latest/"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          java -version

          # Disable pipefail only for this pipeline.
          # sdkmanager remains the last command, so its exit code is preserved.
          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          set -o pipefail

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-26" \
            "platforms;android-34" \
            "build-tools;35.0.1" \
            "ndk;25.2.9519653"

          test -d "$SDK_ROOT/platforms/android-26"
          test -d "$SDK_ROOT/platforms/android-34"
          test -d "$SDK_ROOT/ndk/25.2.9519653"

      - name: Install Node dependencies
        shell: bash
        run: |
          set -euxo pipefail

          npm install --global \
            "frida-compile@${FRIDA_COMPILE_VERSION}"

          cd agent

          cat > package.json <<'EOF'
          {
            "name": "dextool-agent",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "frida-java-bridge": "6.3.9"
            }
          }
          EOF

          npm install --ignore-scripts

      - name: Generate JavaScript agent
        shell: bash
        run: |
          set -euxo pipefail

          cat > agent/agent.js <<'EOF'
          import Java from 'frida-java-bridge';

          const state = {
              patches: new Map(),
              hooks: new Map(),
              trackers: new Map(),
              recording: false,
              monitoring: false
          };

          function emit(type, payload = {}) {
              send({
                  type,
                  payload,
                  timestamp: Date.now()
              });
          }

          function dispatch(message) {
              const command = message.payload;

              if (!command || !command.type) {
                  return;
              }

              switch (command.type) {
                  case 'ping':
                      emit('pong');
                      break;

                  case 'enumerate_classes':
                      Java.perform(() => {
                          Java.enumerateLoadedClasses({
                              onMatch(name) {
                                  emit('class', { name });
                              },
                              onComplete() {
                                  emit('classes_complete');
                              }
                          });
                      });
                      break;

                  case 'start_recording':
                      state.recording = true;
                      emit('recording_started');
                      break;

                  case 'stop_recording':
                      state.recording = false;
                      emit('recording_stopped');
                      break;

                  case 'start_monitor':
                      state.monitoring = true;
                      emit('monitor_started');
                      break;

                  case 'stop_monitor':
                      state.monitoring = false;
                      emit('monitor_stopped');
                      break;

                  default:
                      emit('unsupported_command', {
                          command: command.type
                      });
              }
          }

          recv('command', dispatch);

          emit('agent_ready', {
              javaAvailable: Java.available
          });
          EOF

          frida-compile agent/agent.js \
            -o agent/agent_bundle.js

          test -s agent/agent_bundle.js

          python3 - <<'PY'
          import json
          from pathlib import Path

          source = Path("agent/agent_bundle.js").read_text()

          header = (
              "#include <cstddef>\n"
              "extern const char kAgentBundle[] = "
              + json.dumps(source)
              + ";\n"
          )

          Path("native/src/agent_bundle.cpp").write_text(header)
          PY

      - name: Clone Frida Gum source
        shell: bash
        run: |
          set -euxo pipefail

          git clone \
            --depth 1 \
            --branch "$FRIDA_VERSION" \
            https://github.com/frida/frida-gum.git \
            build/frida-gum

          test -f build/frida-gum/meson.build
          test -f build/frida-gum/meson.options

          git -C build/frida-gum rev-parse HEAD

      - name: Validate Frida 16.7.19 options
        shell: bash
        run: |
          set -euxo pipefail

          OPTIONS=build/frida-gum/meson.options

          grep -q "option('gumjs'" "$OPTIONS"
          grep -q "option('quickjs'" "$OPTIONS"
          grep -q "option('v8'" "$OPTIONS"
          grep -q "option('database'" "$OPTIONS"
          grep -q "option('frida_java_bridge'" "$OPTIONS"
          grep -q "option('frida_objc_bridge'" "$OPTIONS"
          grep -q "option('frida_swift_bridge'" "$OPTIONS"
          grep -q "option('devkits'" "$OPTIONS"

          if grep -q "option('connectivity'" "$OPTIONS"; then
              echo "Unexpected connectivity option in frida-gum"
              exit 1
          fi

      - name: Clone Dobby
        shell: bash
        run: |
          set -euxo pipefail

          git clone \
            https://github.com/jmpews/Dobby.git \
            build/Dobby

          git -C build/Dobby checkout "$DOBBY_COMMIT"

          test "$(git -C build/Dobby rev-parse --short HEAD)" = "$DOBBY_COMMIT"

          grep -q "add_library(dobby_static STATIC" \
            build/Dobby/CMakeLists.txt

          test -f build/Dobby/include/dobby.h

      - name: Clone Dear ImGui
        shell: bash
        run: |
          set -euxo pipefail

          git clone \
            --depth 1 \
            --branch "$IMGUI_TAG" \
            https://github.com/ocornut/imgui.git \
            build/imgui

          test -f build/imgui/imgui.cpp
          test -f build/imgui/backends/imgui_impl_opengl3.cpp

      - name: Build Frida Gum and GumJS for both Android ABIs
        shell: bash
        run: |
          set -euxo pipefail

          NDK="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"

          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64"

          mkdir -p build/frida-output

          build_frida() {
              ABI="$1"
              TRIPLE="$2"
              CPU="$3"
              ARCH="$4"

              PREFIX="$PWD/build/frida-output/$ABI"
              BUILD="$PWD/build/frida-build-$ABI"

              mkdir -p "$PREFIX" "$BUILD"

              cat > "build/frida-$ABI.ini" <<EOF
          [binaries]
          c = '$TOOLCHAIN/bin/${TRIPLE}${ANDROID_API}-clang'
          cpp = '$TOOLCHAIN/bin/${TRIPLE}${ANDROID_API}-clang++'
          ar = '$TOOLCHAIN/bin/llvm-ar'
          strip = '$TOOLCHAIN/bin/llvm-strip'
          ranlib = '$TOOLCHAIN/bin/llvm-ranlib'
          pkg-config = '/usr/bin/pkg-config'

          [host_machine]
          system = 'android'
          cpu_family = '$CPU'
          cpu = '$ARCH'
          endian = 'little'

          [properties]
          needs_exe_wrapper = true

          [built-in options]
          c_args = ['-fPIC']
          cpp_args = ['-fPIC']
          EOF

              meson setup "$BUILD" build/frida-gum \
                  --cross-file "build/frida-$ABI.ini" \
                  --prefix "$PREFIX" \
                  --buildtype release \
                  --default-library static \
                  --wrap-mode forcefallback \
                  -Db_ndebug=true \
                  -Dgumjs=enabled \
                  -Dgumpp=disabled \
                  -Dquickjs=enabled \
                  -Dv8=disabled \
                  -Ddatabase=disabled \
                  -Dfrida_java_bridge=disabled \
                  -Dfrida_objc_bridge=disabled \
                  -Dfrida_swift_bridge=disabled \
                  -Dgraft_tool=disabled \
                  -Dtests=disabled \
                  -Ddevkits=gum,gumjs

              meson compile -C "$BUILD" -j 2

              meson install -C "$BUILD"

              echo "Checking Frida output for $ABI"

              find "$BUILD" "$PREFIX" \
                  -type f \
                  \( -name 'libfrida-gum*.a' \
                  -o -name 'libfrida-gumjs*.a' \) \
                  -print

              find "$BUILD" "$PREFIX" \
                  -type f \
                  -name '*.a' \
                  -print

              if ! find "$BUILD" "$PREFIX" \
                  -type f \
                  -name 'libfrida-gum*.a' | grep -q .; then
                  echo "Frida Gum static archive missing: $ABI"
                  exit 1
              fi

              if ! find "$BUILD" "$PREFIX" \
                  -type f \
                  -name 'libfrida-gumjs*.a' | grep -q .; then
                  echo "Frida GumJS static archive missing: $ABI"
                  exit 1
              fi

              mkdir -p "$PREFIX/lib"

              find "$BUILD" "$PREFIX" \
                  -type f \
                  -name '*.a' \
                  -exec cp -f {} "$PREFIX/lib/" \;

              find "$BUILD" "$PREFIX" \
                  -type f \
                  -name '*.h' \
                  -path '*gum*' \
                  -exec cp --parents {} "$PREFIX/" \;
          }

          build_frida \
              arm64-v8a \
              aarch64-linux-android \
              aarch64 \
              armv8-a

          build_frida \
              armeabi-v7a \
              armv7a-linux-androideabi \
              arm \
              armv7-a

      - name: Build native libraries
        shell: bash
        run: |
          set -euxo pipefail

          NDK="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"

          TOOLCHAIN="$NDK/build/cmake/android.toolchain.cmake"

          build_native() {
              ABI="$1"

              PREFIX="$PWD/build/frida-output/$ABI"

              OUT="$PWD/build/native-$ABI"

              cmake -S native -B "$OUT" \
                  -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" \
                  -DANDROID_ABI="$ABI" \
                  -DANDROID_PLATFORM=android-26 \
                  -DANDROID_STL=c++_static \
                  -DANDROID_NDK="$NDK" \
                  -DDEPS_ROOT="$PWD/build" \
                  -DFRIDA_ROOT="$PREFIX" \
                  -DCMAKE_BUILD_TYPE=Release \
                  -DCMAKE_CXX_FLAGS="-fPIC"

              cmake --build "$OUT" \
                  --target tool \
                  --parallel 2

              LIB="$OUT/libtool.so"

              test -f "$LIB"

              "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" \
                  --strip-unneeded "$LIB"

              install -D "$LIB" \
                  "sample/app/src/main/jniLibs/$ABI/libtool.so"

              echo "===== $ABI ====="

              file "$LIB"

              stat -c '%n %s bytes' "$LIB"
          }

          build_native arm64-v8a
          build_native armeabi-v7a

      - name: Generate sample Android application
        shell: bash
        run: |
          set -euxo pipefail

          cat > sample/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(
                  RepositoriesMode.FAIL_ON_PROJECT_REPOS
              )
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "DexToolSample"

          include(":app")
          EOF

          cat > sample/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > sample/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > sample/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.dextool.sample'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.dextool.sample'
                  minSdk 26
                  targetSdk 28

                  versionCode 1
                  versionName '1.0'

                  ndk {
                      abiFilters 'armeabi-v7a', 'arm64-v8a'
                  }
              }
          }
          EOF

          cat > sample/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="false"
                  android:label="Dex-tool Sample"
                  android:theme="@android:style/Theme.Material.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="unspecified"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

              </application>
          </manifest>
          EOF

          cat > sample/app/src/main/java/com/dextool/sample/MainActivity.java <<'EOF'
          package com.dextool.sample;

          import android.app.Activity;
          import android.os.Bundle;
          import android.opengl.GLSurfaceView;

          import javax.microedition.khronos.egl.EGLConfig;
          import javax.microedition.khronos.opengles.GL10;

          public class MainActivity extends Activity {

              private GLSurfaceView surface;

              static {
                  System.loadLibrary("tool");
              }

              @Override
              protected void onCreate(Bundle state) {
                  super.onCreate(state);

                  surface = new GLSurfaceView(this);

                  surface.setEGLContextClientVersion(3);

                  surface.setRenderer(new GLSurfaceView.Renderer() {

                      @Override
                      public void onSurfaceCreated(
                              GL10 gl,
                              EGLConfig config) {
                      }

                      @Override
                      public void onSurfaceChanged(
                              GL10 gl,
                              int width,
                              int height) {
                          android.opengl.GLES30.glViewport(
                              0, 0, width, height
                          );
                      }

                      @Override
                      public void onDrawFrame(GL10 gl) {
                          android.opengl.GLES30.glClearColor(
                              0.08f, 0.10f, 0.14f, 1.0f
                          );

                          android.opengl.GLES30.glClear(
                              android.opengl.GLES30.GL_COLOR_BUFFER_BIT
                          );
                      }
                  });

                  setContentView(surface);
              }

              @Override
              protected void onResume() {
                  super.onResume();

                  if (surface != null) {
                      surface.onResume();
                  }
              }

              @Override
              protected void onPause() {
                  if (surface != null) {
                      surface.onPause();
                  }

                  super.onPause();
              }
          }
          EOF

      - name: Generate README
        shell: bash
        run: |
          set -euxo pipefail

          cat > README.md <<'EOF'
          # Dex-tool

          Native Android instrumentation framework.

          ## Architecture

          - Frida Gum: native instrumentation.
          - GumJS: embedded QuickJS runtime.
          - frida-java-bridge: Java runtime interaction.
          - Dobby: native inline hooking.
          - Dear ImGui: native graphical interface.
          - OpenGL ES 3: rendering backend.

          ## Supported ABIs

          - armeabi-v7a
          - arm64-v8a

          Minimum Android API: 26.

          ## Build dependencies

          All native dependencies are built from source.

          Frida Gum and GumJS are built from the official
          frida-gum repository.

          The Java bridge is bundled as JavaScript using
          frida-compile.

          Dobby and Dear ImGui are compiled from their
          respective official source repositories.

          ## Important limitations

          ### Smali mode

          Smali runtime execution uses a helper DEX loaded
          through InMemoryDexClassLoader on API 26+.

          Loading a helper DEX does not replace an existing
          ART method implementation.

          ### TLS monitoring

          Network monitoring uses layered Java and native hooks.

          Plaintext visibility depends on the networking stack
          and available symbols.

          Universal TLS decryption is not guaranteed.

          ### Field tracking

          Universal interception of arbitrary Java field reads
          and writes is not supported.

          Getter/setter instrumentation provides narrower
          alternatives.

          ### Rendering

          The initial renderer uses OpenGL ES 3.

          Vulkan requires a separate Vulkan renderer backend.

          ### Input

          A complete input integration requires Java-level
          MotionEvent dispatch forwarding and multi-pointer
          handling.

          Native rendering alone does not provide touch input.

          ## Sample

          The sample application loads libtool.so and creates
          an OpenGL ES 3 rendering surface.

          The sample validates native library loading and the
          GLES rendering integration.
          EOF

      - name: Build sample APK
        shell: bash
        run: |
          set -euxo pipefail

          cd sample

          gradle \
              --no-daemon \
              --stacktrace \
              assembleDebug

          test -f app/build/outputs/apk/debug/app-debug.apk

          mkdir -p ../dist

          cp app/build/outputs/apk/debug/app-debug.apk \
              ../dist/sample-debug.apk

      - name: Validate APK contents
        shell: bash
        run: |
          set -euxo pipefail

          APK=dist/sample-debug.apk

          "$ANDROID_HOME/build-tools/35.0.1/aapt" \
              list "$APK" > build/apk-files.txt

          grep 'lib/arm64-v8a/libtool.so' \
              build/apk-files.txt

          grep 'lib/armeabi-v7a/libtool.so' \
              build/apk-files.txt

          echo "APK contains both native ABIs"

      - name: Generate build report
        shell: bash
        run: |
          set -euxo pipefail

          {
              echo "# Dex-tool build report"
              echo
              echo "Frida: $FRIDA_VERSION"
              echo "Dobby: $DOBBY_COMMIT"
              echo "ImGui: $IMGUI_TAG"
              echo "NDK: $ANDROID_NDK_VERSION"
              echo

              for ABI in arm64-v8a armeabi-v7a; do
                  LIB="sample/app/src/main/jniLibs/$ABI/libtool.so"

                  echo "## $ABI"

                  stat -c 'Library size: %s bytes' "$LIB"

                  file "$LIB"

                  echo
              done

              echo "## APK"

              stat -c 'APK size: %s bytes' \
                  dist/sample-debug.apk

          } > BUILD_REPORT.md

          cat BUILD_REPORT.md

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dextool-android-build
          path: |
            dist/sample-debug.apk
            sample/app/src/main/jniLibs/
            BUILD_REPORT.md
          if-no-files-found: error
          retention-days: 30

      - name: Commit and push generated project files
        shell: bash
        run: |
          set -euxo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
              "41898282+github-actions[bot]@users.noreply.github.com"

          git add --ignore-errors \
              .gitignore \
              README.md \
              BUILD_REPORT.md \
              native \
              agent \
              sample

          if git diff --cached --quiet; then
              echo "No generated source changes"
              exit 0
          fi

          git commit -m "Build Dex-tool native framework [skip ci]"

          git push origin HEAD:dev
