#pragma once
#include <string>
#include <vector>
#include <cstdint>
// Compile smali source to a DEX byte array via InMemoryDexClassLoader.
// Requires smali-fat.jar in APK assets/ and JNI env on current thread.
// Returns empty string on success, error message on failure.
// Output DEX bytes are stored in 'dex_out'.
std::string smali_compile(const std::string& smali_src,
                          const std::string& class_name,
                          std::vector<uint8_t>& dex_out);
SRHEOF

          cat > src/smali_runtime.cpp << 'SRCEOF'
#include "smali_runtime.h"
#include "logger.h"
#include <jni.h>
#include <android/asset_manager.h>
#include <android/asset_manager_jni.h>
#include <vector>
#include <cstdio>
#include <cstring>
#include <unistd.h>
#include <sys/stat.h>

// NOTE: smali runtime uses InMemoryDexClassLoader (API 26+).
// smali-fat.jar is bundled in APK assets/ and loaded on first call.
// LIMITATION on API 26-28: InMemoryDexClassLoader works but
// re-loading the same class name requires a fresh ClassLoader instance.

extern JavaVM* g_jvm_global;    // set in main.cpp JNI_OnLoad

static bool    s_smali_ready = false;
static jclass  s_smali_cls   = nullptr;  // com.android.tools.smali.smali.Main
static jobject s_app_context  = nullptr;

static std::string extract_smali_jar(JNIEnv* env) {
    // Get Application context
    jclass    act_thread_cls  = env->FindClass("android/app/ActivityThread");
    jmethodID cur_app         = env->GetStaticMethodID(
        act_thread_cls, "currentApplication", "()Landroid/app/Application;");
    jobject   app_obj         = env->CallStaticObjectMethod(act_thread_cls, cur_app);
    jmethodID get_am          = env->GetMethodID(
        env->FindClass("android/content/Context"),
        "getAssets", "()Landroid/content/res/AssetManager;");
    jobject   am_obj = env->CallObjectMethod(app_obj, get_am);

    // Get files dir for extraction target
    jmethodID get_fd = env->GetMethodID(
        env->FindClass("android/content/Context"),
        "getFilesDir", "()Ljava/io/File;");
    jobject   fd_obj = env->CallObjectMethod(app_obj, get_fd);
    jmethodID get_abs = env->GetMethodID(
        env->FindClass("java/io/File"),
        "getAbsolutePath", "()Ljava/lang/String;");
    jstring   fd_str = (jstring)env->CallObjectMethod(fd_obj, get_abs);
    const char* fd_path = env->GetStringUTFChars(fd_str, nullptr);

    char jar_path[512];
    snprintf(jar_path, sizeof(jar_path), "%s/smali-fat.jar", fd_path);
    env->ReleaseStringUTFChars(fd_str, fd_path);

    // Check if already extracted
    if (access(jar_path, F_OK) == 0) return std::string(jar_path);

    // Extract from assets
    AAssetManager* am = AAssetManager_fromJava(env, am_obj);
    AAsset* asset = AAssetManager_open(am, "smali-fat.jar", AASSET_MODE_BUFFER);
    if (!asset) return "";

    const void* buf  = AAsset_getBuffer(asset);
    off_t       sz   = AAsset_getLength(asset);
    FILE* out = fopen(jar_path, "wb");
    if (!out) { AAsset_close(asset); return ""; }
    fwrite(buf, 1, (size_t)sz, out);
    fclose(out);
    AAsset_close(asset);
    return std::string(jar_path);
}

static bool ensure_smali_ready(JNIEnv* env) {
    if (s_smali_ready) return true;

    std::string jar = extract_smali_jar(env);
    if (jar.empty()) {
        LOGE("smali_runtime: failed to extract smali-fat.jar");
        return false;
    }

    jclass     dcl_cls  = env->FindClass("dalvik/system/PathClassLoader");
    jmethodID  dcl_init = env->GetMethodID(
        dcl_cls, "<init>",
        "(Ljava/lang/String;Ljava/lang/ClassLoader;)V");
    jclass     cl_cls   = env->FindClass("java/lang/ClassLoader");
    jmethodID  sys_ldr  = env->GetStaticMethodID(
        cl_cls, "getSystemClassLoader", "()Ljava/lang/ClassLoader;");
    jobject    sys_cl   = env->CallStaticObjectMethod(cl_cls, sys_ldr);

    jstring jar_str = env->NewStringUTF(jar.c_str());
    jobject dcl_obj = env->NewObject(dcl_cls, dcl_init, jar_str, sys_cl);
    if (!dcl_obj) {
        LOGE("smali_runtime: PathClassLoader creation failed");
        return false;
    }

    jmethodID load_cls  = env->GetMethodID(
        cl_cls, "loadClass",
        "(Ljava/lang/String;)Ljava/lang/Class;");
    jstring   cls_name  = env->NewStringUTF(
        "com.android.tools.smali.smali.Main");
    s_smali_cls = (jclass)env->CallObjectMethod(dcl_obj, load_cls, cls_name);
    if (!s_smali_cls || env->ExceptionCheck()) {
        env->ExceptionClear();
        LOGE("smali_runtime: could not load smali Main class");
        return false;
    }
    s_smali_cls = (jclass)env->NewGlobalRef(s_smali_cls);
    s_smali_ready = true;
    LOGI("smali_runtime: ready");
    return true;
}

std::string smali_compile(const std::string& smali_src,
                          const std::string& class_name,
                          std::vector<uint8_t>& dex_out) {
    JNIEnv* env = nullptr;
    if (!g_jvm_global) return "No JVM";
    g_jvm_global->AttachCurrentThread(&env, nullptr);
    if (!ensure_smali_ready(env)) return "smali not ready";

    // Write smali source to temp file
    char tmp_dir[] = "/data/local/tmp/dextool-smali-XXXXXX";
    if (!mkdtemp(tmp_dir)) return "mkdtemp failed";

    std::string smali_file = std::string(tmp_dir) + "/" + class_name + ".smali";
    FILE* f = fopen(smali_file.c_str(), "w");
    if (!f) return "fopen smali failed";
    fwrite(smali_src.c_str(), 1, smali_src.size(), f);
    fclose(f);

    std::string dex_path = std::string(tmp_dir) + "/out.dex";

    // Call smali.Main.main(["assemble", "-o", dex_path, smali_file])
    jmethodID main_m = env->GetStaticMethodID(
        s_smali_cls, "main", "([Ljava/lang/String;)V");
    if (!main_m) return "smali.Main.main not found";

    jclass str_cls = env->FindClass("java/lang/String");
    jobjectArray args = env->NewObjectArray(4, str_cls, nullptr);
    env->SetObjectArrayElement(args, 0, env->NewStringUTF("assemble"));
    env->SetObjectArrayElement(args, 1, env->NewStringUTF("-o"));
    env->SetObjectArrayElement(args, 2, env->NewStringUTF(dex_path.c_str()));
    env->SetObjectArrayElement(args, 3, env->NewStringUTF(smali_file.c_str()));

    env->CallStaticVoidMethod(s_smali_cls, main_m, args);
    if (env->ExceptionCheck()) {
        env->ExceptionClear();
        return "smali assembly threw exception";
    }

    // Read output DEX
    FILE* dex_f = fopen(dex_path.c_str(), "rb");
    if (!dex_f) return "dex output not found";
    fseek(dex_f, 0, SEEK_END);
    long sz = ftell(dex_f);
    rewind(dex_f);
    dex_out.resize((size_t)sz);
    fread(dex_out.data(), 1, (size_t)sz, dex_f);
    fclose(dex_f);
    return "";  // success
}
SRCEOF
