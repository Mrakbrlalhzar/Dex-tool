          function uninstall_layer(cls, mn, kind) {
              var K = cls + '!' + mn;
              var L = LAYERS[K];
              if (!L) return;
              delete L.parts[kind];
              if (!Object.keys(L.parts).length) {
                  try {
                      L.ovs.forEach(function (ov) { ov.implementation = null; });
                  } catch (e) {}
                  delete LAYERS[K];
