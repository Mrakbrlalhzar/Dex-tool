      # ═══════════════════════════════════════════════════════════
      # 18. GENERATE — main.cpp  (JNI_OnLoad)
      # ═══════════════════════════════════════════════════════════
      - name: Generate main.cpp
        run: |
          cat > src/main.cpp << 'MAINCEOF'
#include "logger.h"
#include "overlay.h"
#include "frida_bridge.h"
#include "frida-gumjs.h"
#include <jni.h>
#include <fcntl.h>
#include <unistd.h>
#include <cstring>
#include <cstdio>
#include <ctime>

JavaVM* g_jvm_global = nullptr;

// ── Marker file writer (raw, no stdio) ────────────────────────
static void write_marker(const char* path, const char* msg) {
    int fd = open(path, O_WRONLY | O_CREAT | O_TRUNC, 0644);
    if (fd < 0) return;
    char buf[256];
    time_t t = time(nullptr);
    int n = snprintf(buf, sizeof(buf), "%s ts=%ld\n", msg, (long)t);
    write(fd, buf, (size_t)n);
    close(fd);
}

// ── JNI_OnLoad ────────────────────────────────────────────────
// ORDERING RULES (from known-pitfalls):
//   1. Store JVM pointer
//   2. Write JNI entry marker
//   3. logger_init (uses only open/write, not gum)
//   4. install_swap_hook() via Dobby — defers gum_init_embedded
//      to first eglSwapBuffers call (overlay.cpp)
//   5. Write JNI done marker
//   gum_init_embedded() fires LATER in overlay.cpp on GL thread.
// ──────────────────────────────────────────────────────────────
extern "C" JNIEXPORT jint JNICALL
JNI_OnLoad(JavaVM* vm, void*) {
    g_jvm_global = vm;

    // Checkpoint 1: JNI entry
    write_marker("/sdcard/Download/dextool-jni.marker",
                 "checkpoint=entry");

    // Init logger (raw file I/O only, no gum)
    logger_init("/sdcard/Download");
    log_info("[JNI_OnLoad] entry");

    // Checkpoint 2: logger ready
    write_marker("/sdcard/Download/dextool-jni.marker",
                 "checkpoint=logger_ready");

    // Set JVM in overlay module
    overlay_set_java_vm(vm);

    // Install eglSwapBuffers hook via Dobby.
    // gum_init_embedded() is NOT called here — deferred to GL thread.
    if (!install_swap_hook()) {
        log_crash_raw("[JNI_OnLoad] FATAL: install_swap_hook failed\n");
        // Return valid JNI_VERSION anyway so library stays loaded for diagnostics
    }

    // Checkpoint 3: hooks installed
    write_marker("/sdcard/Download/dextool-jni.marker",
                 "checkpoint=hooks_installed");

    log_info("[JNI_OnLoad] done — waiting for first eglSwapBuffers");

    // Checkpoint 4: before return
    write_marker("/sdcard/Download/dextool-jni.marker",
                 "checkpoint=jni_return");

    return JNI_VERSION_1_6;
}
MAINCEOF
          echo "main.cpp generated."

      # ═══════════════════════════════════════════════════════════
      # 19. GENERATE — JS agent bundle and embed as C array
      # ═══════════════════════════════════════════════════════════
      - name: Generate JS agent bundle and embed as C array
        run: |
          # Agent JS — plain JS for GumJS/QuickJS (no bundler needed)
          # frida-java-bridge is bundled into QuickJS by frida-gum when
          # built with gumjs=enabled, so Java.* is globally available.
          cat > agent/agent.js << 'AGENTEOF'
// Dex-tool GumJS Agent — plain JavaScript for QuickJS runtime
// Java.* is provided by frida-java-bridge bundled into frida-gum's GumJS.
'use strict';

// ── State ──────────────────────────────────────────────────────
const patches   = {};
const hooks     = {};
const trackers  = {};
let recorderActive = false;
let monitorActive  = false;

// ── Logging helper ─────────────────────────────────────────────
function sendLog(type, payload) {
    send(JSON.stringify({ type: type, payload: payload }));
}

// ── RPC exports (called via gum_script_post from C++) ──────────
rpc.exports = {

    addPatch: function(name, value) {
        try {
            Java.perform(function() {
                const parts = name.split('.');
                const field = parts.pop();
                const cls   = parts.join('.');
                const jcls  = Java.use(cls);
                const f     = jcls.class.getDeclaredField(field);
                f.setAccessible(true);
                // Try setInt / setBoolean / setObject based on type
                const ftype = f.getType().getName();
                if (ftype === 'int' || ftype === 'long' || ftype === 'short' || ftype === 'byte') {
                    f.set(null, parseInt(value));
                } else if (ftype === 'boolean') {
                    f.set(null, value === 'true');
                } else if (ftype === 'float' || ftype === 'double') {
                    f.set(null, parseFloat(value));
                } else {
                    f.set(null, value);
                }
                patches[name] = { value: value, enabled: true };
                sendLog('patchApplied', { name: name });
            });
        } catch(e) {
            sendLog('error', { fn: 'addPatch', msg: e.message });
        }
    },

    removePatch: function(name) {
        delete patches[name];
        sendLog('patchRemoved', { name: name });
    },

    setPatchEnabled: function(name, enabled) {
        if (patches[name]) patches[name].enabled = enabled;
        sendLog('patchUpdated', { name: name, enabled: enabled });
    },

    addHook: function(name, mode, code) {
        try {
            Java.perform(function() {
                const parts  = name.split('.');
                const method = parts.pop();
                const cls    = parts.join('.');
                const jcls   = Java.use(cls);

                if (mode === 'noop') {
                    jcls[method].implementation = function() {
                        sendLog('hookFired', { name: name, mode: 'noop' });
                        return null;
                    };
                } else if (mode === 'java') {
                    // Evaluate user JS code as replacement function body
                    // code is expected to be a function body string
                    const fn = new Function('Java', 'send', 'args', code);
                    jcls[method].implementation = function() {
                        const args = Array.from(arguments);
                        return fn(Java, send, args);
                    };
                } else if (mode === 'smali') {
                    // smali mode: send to C++ to compile and load via
                    // InMemoryDexClassLoader, then hook the new impl
                    sendLog('smaliCompileRequest', { name: name, code: code });
                }

                hooks[name] = { mode: mode, enabled: true };
                sendLog('hookAdded', { name: name });
            });
        } catch(e) {
            sendLog('error', { fn: 'addHook', msg: e.message });
        }
    },

    removeHook: function(name) {
        try {
            Java.perform(function() {
                const parts  = name.split('.');
                const method = parts.pop();
                const cls    = parts.join('.');
                Java.use(cls)[method].implementation = null;
                delete hooks[name];
                sendLog('hookRemoved', { name: name });
            });
        } catch(e) {
            sendLog('error', { fn: 'removeHook', msg: e.message });
        }
    },

    setHookEnabled: function(name, enabled) {
        if (hooks[name]) hooks[name].enabled = enabled;
        sendLog('hookUpdated', { name: name, enabled: enabled });
    },

    addTracker: function(name) {
        try {
            Java.perform(function() {
                const parts  = name.split('.');
                const method = parts.pop();
                const cls    = parts.join('.');
                const jcls   = Java.use(cls);
                jcls[method].implementation = function() {
                    const args = Array.from(arguments).map(String);
                    let ret;
                    try { ret = this[method].apply(this, arguments); }
                    catch(e) { ret = null; }
                    sendLog('trackerEvent', {
                        name: name,
                        args: args,
                        ret:  String(ret)
                    });
                    return ret;
                };
                trackers[name] = true;
                sendLog('trackerAdded', { name: name });
            });
        } catch(e) {
            sendLog('error', { fn: 'addTracker', msg: e.message });
        }
    },

    removeTracker: function(name) {
        try {
            Java.perform(function() {
                const parts  = name.split('.');
                const method = parts.pop();
                const cls    = parts.join('.');
                Java.use(cls)[method].implementation = null;
                delete trackers[name];
                sendLog('trackerRemoved', { name: name });
            });
        } catch(e) {
            sendLog('error', { fn: 'removeTracker', msg: e.message });
        }
    },

    startRecorder: function() {
        recorderActive = true;
        Java.perform(function() {
            Java.enumerateLoadedClassesSync().forEach(function(cls) {
                try {
                    const jcls   = Java.use(cls);
                    const methods= jcls.class.getDeclaredMethods();
                    methods.forEach(function(m) {
                        const mname = m.getName();
                        try {
                            jcls[mname].overloads.forEach(function(ovl) {
                                ovl.implementation = function() {
                                    if (!recorderActive) {
                                        ovl.implementation = null;
                                        return this[mname].apply(this, arguments);
                                    }
                                    sendLog('recorded', {
                                        cls: cls,
                                        method: mname,
                                        args: Array.from(arguments).map(String)
                                    });
                                    return this[mname].apply(this, arguments);
                                };
                            });
                        } catch(ignored) {}
                    });
                } catch(ignored) {}
            });
        });
        sendLog('recorderStarted', {});
    },

    stopRecorder: function() {
        recorderActive = false;
        sendLog('recorderStopped', {});
    },

    startMonitor: function() {
        monitorActive = true;
        Java.perform(function() {
            // Hook OkHttp / HttpURLConnection for Java-layer traffic
            try {
                const URL   = Java.use('java.net.URL');
                const UC    = Java.use('java.net.URLConnection');
                URL.openConnection.overload().implementation = function() {
                    const conn = this.openConnection();
                    sendLog('networkConnect', { url: this.toString() });
                    return conn;
                };
            } catch(e) {}

            // SSLContext.init hook for key material (best-effort)
            try {
                const SSLCtx = Java.use('javax.net.ssl.SSLContext');
                SSLCtx.init.overload(
                    '[Ljavax.net.ssl.KeyManager;',
                    '[Ljavax.net.ssl.TrustManager;',
                    'java.security.SecureRandom'
                ).implementation = function(km, tm, sr) {
                    sendLog('sslInit', { note: 'SSLContext.init intercepted' });
                    return this.init(km, tm, sr);
                };
            } catch(e) {}
        });
        sendLog('monitorStarted', {});
    },

    stopMonitor: function() {
        monitorActive = false;
        sendLog('monitorStopped', {});
    },

    evalScript: function(src) {
        try {
            const result = eval(src);
            sendLog('scriptResult', { result: String(result) });
        } catch(e) {
            sendLog('scriptError', { msg: e.message });
        }
    },

    openClass: function(className) {
        try {
            Java.perform(function() {
                const jcls   = Java.use(className);
                const methods= jcls.class.getDeclaredMethods().map(
                    function(m) { return m.getName(); });
                const fields = jcls.class.getDeclaredFields().map(
                    function(f) { return f.getName(); });
                sendLog('classInfo', {
                    class:   className,
                    methods: methods,
                    fields:  fields
                });
            });
        } catch(e) {
            sendLog('error', { fn: 'openClass', msg: e.message });
        }
    },

    listInstances: function(className) {
        try {
            Java.perform(function() {
                const instances = [];
                Java.choose(className, {
                    onMatch: function(inst) {
                        instances.push(String(inst));
                        if (instances.length >= 20) return 'stop';
                    },
                    onComplete: function() {
                        sendLog('instanceList', {
                            class: className,
                            instances: instances
                        });
                    }
                });
            });
        } catch(e) {
            sendLog('error', { fn: 'listInstances', msg: e.message });
        }
    },

    hookMethod: function(className, methodName) {
        this.addHook(className + '.' + methodName, 'noop', '');
    },

    trackMethod: function(className, methodName) {
        this.addTracker(className + '.' + methodName);
    },

    patchField: function(className, fieldName) {
        sendLog('info', { msg: 'patchField: open patch dialog for ' +
                               className + '.' + fieldName });
    }
};

// ── Handle incoming messages from C++ ─────────────────────────
recv(function onMessage(msg) {
    if (msg.type === 'rpc' && rpc.exports[msg.fn]) {
        const args = msg.args || {};
        rpc.exports[msg.fn].apply(rpc.exports, Object.values(args));
    }
    recv(onMessage);
});

send(JSON.stringify({ type: 'ready', msg: 'Dex-tool agent loaded' }));
AGENTEOF

          # Escape the JS file into a C array
          node - << 'NODESCRIPT'
const fs = require('fs');
const src = fs.readFileSync('agent/agent.js');
const bytes = Array.from(src);
let out = '// Auto-generated — do not edit\n';
out += '#pragma once\n';
