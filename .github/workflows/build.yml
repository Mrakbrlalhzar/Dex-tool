# === BRANCH TARGET: dev ===
name: Build Dex-tool

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: "${{ !contains(github.event.head_commit.message || '', '[skip ci]') }}"
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    env:
      ANDROID_HOME: "${{ github.workspace }}/android-sdk"
      ANDROID_NDK_ROOT: "${{ github.workspace }}/android-sdk/ndk/25.2.9519653"

    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          token: "${{ secrets.GITHUB_TOKEN }}"
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.email "ci@dextool"
          git config user.name  "Dex-tool CI"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install system packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build python3-pip unzip curl \
            build-essential lib32stdc++6 lib32z1 flex bison

      - name: Setup Android SDK manually
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          wget -q \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
            -O /tmp/cmdtools.zip
          unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
          mv /tmp/cmdtools/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses >/dev/null 2>&1 || true
          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-26" \
            "platforms;android-34" \
            "build-tools;35.0.1" \
            "ndk;25.2.9519653"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools"           >> "$GITHUB_PATH"

      - name: Install Gradle 8.5
        run: |
          wget -q "https://services.gradle.org/distributions/gradle-8.5-bin.zip" \
            -O /tmp/gradle.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.5/bin" >> "$GITHUB_PATH"

      - name: Install meson
        run: pip3 install meson

      - name: Ensure debug keystore exists
        run: |
          mkdir -p ~/.android
          keytool -genkey -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000 2>/dev/null || true

      - name: Cache frida-gum arm64-v8a
        id: cache-frida-arm64
        uses: actions/cache@v4
        with:
          path: deps/frida-gum/arm64-v8a
          key: frida-gum-16.7.19-arm64-v3

      - name: Build frida-gum 16.7.19 arm64-v8a
        if: "${{ steps.cache-frida-arm64.outputs.cache-hit != 'true' }}"
        run: |
          git clone --recurse-submodules --depth 1 --branch 16.7.19 \
            https://github.com/frida/frida-gum.git frida-gum-src
          cd frida-gum-src
          FRIDA_PFX="$GITHUB_WORKSPACE/frida-dist-arm64"
          mkdir -p "$FRIDA_PFX"
          ANDROID_NDK_ROOT="$ANDROID_NDK_ROOT" \
          ./configure --host=android-arm64 --prefix="$FRIDA_PFX" \
            -- -Dgumjs=enabled -Dv8=disabled -Ddatabase=disabled \
               -Dtests=disabled -Dgraft_tool=disabled -Ddevkits=gumjs
          make -j"$(nproc)"
          make install || true
          mkdir -p "$GITHUB_WORKSPACE/deps/frida-gum/arm64-v8a"
          GUMLIB="$(find . "$FRIDA_PFX" -name 'libfrida-gumjs.a' 2>/dev/null | head -1)"
          GUMHDR="$(find . "$FRIDA_PFX" -name 'frida-gumjs.h'   2>/dev/null | head -1)"
          [ -z "$GUMLIB" ] && { echo "ERROR: libfrida-gumjs.a not found"; exit 1; }
          [ -z "$GUMHDR" ] && { echo "ERROR: frida-gumjs.h not found";   exit 1; }
          cp "$GUMLIB" "$GITHUB_WORKSPACE/deps/frida-gum/arm64-v8a/libfrida-gumjs.a"
          cp "$GUMHDR" "$GITHUB_WORKSPACE/deps/frida-gum/arm64-v8a/frida-gumjs.h"

      - name: Cache frida-gum armeabi-v7a
        id: cache-frida-arm
        uses: actions/cache@v4
        with:
          path: deps/frida-gum/armeabi-v7a
          key: frida-gum-16.7.19-armeabi-v7a-v3

      - name: Build frida-gum 16.7.19 armeabi-v7a
        if: "${{ steps.cache-frida-arm.outputs.cache-hit != 'true' }}"
        run: |
          if [ ! -d frida-gum-src ]; then
            git clone --recurse-submodules --depth 1 --branch 16.7.19 \
              https://github.com/frida/frida-gum.git frida-gum-src
          fi
          cd frida-gum-src
          rm -rf build
          FRIDA_PFX="$GITHUB_WORKSPACE/frida-dist-arm"
          mkdir -p "$FRIDA_PFX"
          ANDROID_NDK_ROOT="$ANDROID_NDK_ROOT" \
          ./configure --host=android-arm --prefix="$FRIDA_PFX" \
            -- -Dgumjs=enabled -Dv8=disabled -Ddatabase=disabled \
               -Dtests=disabled -Dgraft_tool=disabled -Ddevkits=gumjs
          make -j"$(nproc)"
          make install || true
          mkdir -p "$GITHUB_WORKSPACE/deps/frida-gum/armeabi-v7a"
          GUMLIB="$(find . "$FRIDA_PFX" -name 'libfrida-gumjs.a' 2>/dev/null | head -1)"
          GUMHDR="$(find . "$FRIDA_PFX" -name 'frida-gumjs.h'   2>/dev/null | head -1)"
          [ -z "$GUMLIB" ] && { echo "ERROR: armeabi-v7a lib not found"; exit 1; }
          cp "$GUMLIB" "$GITHUB_WORKSPACE/deps/frida-gum/armeabi-v7a/libfrida-gumjs.a"
          cp "$GUMHDR" "$GITHUB_WORKSPACE/deps/frida-gum/armeabi-v7a/frida-gumjs.h"

      - name: Cache Dobby
        id: cache-dobby
        uses: actions/cache@v4
        with:
          path: deps/dobby
          key: dobby-lsposed-v2

      - name: Build Dobby for both ABIs
        if: "${{ steps.cache-dobby.outputs.cache-hit != 'true' }}"
        run: |
          git clone --depth 1 https://github.com/LSPosed/Dobby.git dobby-src
          mkdir -p deps/dobby
          cp -r dobby-src/include deps/dobby/
          for ABI in arm64-v8a armeabi-v7a; do
            cmake -S dobby-src -B "dobby-src/build-$ABI" \
              -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI="$ABI" -DANDROID_PLATFORM=android-26 \
              -DCMAKE_BUILD_TYPE=Release -DDOBBY_DEBUG=OFF \
              -DDOBBY_GENERATE_SHARED=OFF -GNinja
            ninja -C "dobby-src/build-$ABI" -j"$(nproc)" dobby
            mkdir -p "deps/dobby/$ABI"
            cp "dobby-src/build-$ABI/libdobby.a" "deps/dobby/$ABI/"
          done

      - name: Clone ImGui 1.90.4
        run: |
          git clone --depth 1 --branch v1.90.4 \
            https://github.com/ocornut/imgui.git imgui
          ls imgui/backends/imgui_impl_opengl3.cpp

      - name: Download smali 3.0.7 fat jar
        run: |
          mkdir -p deps/smali
          BASE="https://dl.google.com/dl/android/maven2/com/android/tools/smali"
          SMVER="3.0.7"
          for art in smali smali-dexlib2 smali-util; do
            wget -q "$BASE/$art/$SMVER/$art-$SMVER.jar" -O "deps/smali/$art.jar"
          done
          wget -q "https://repo1.maven.org/maven2/com/beust/jcommander/1.72/jcommander-1.72.jar" \
            -O deps/smali/jcommander.jar
          wget -q "https://repo1.maven.org/maven2/com/google/guava/guava/30.1.1-android/guava-30.1.1-android.jar" \
            -O deps/smali/guava.jar
          MERGE="$(mktemp -d)"
          for j in deps/smali/*.jar; do unzip -nqo "$j" -d "$MERGE" 2>/dev/null || true; done
          jar cf deps/smali/smali-fat.jar -C "$MERGE" .
          ls -lh deps/smali/smali-fat.jar

      - name: Create project directories
        run: |
          mkdir -p src agent \
            sample-app/app/src/main/java/com/dextool/app \
            sample-app/app/src/main/assets \
            sample-app/app/src/main/res/values \
            sample-app/app/src/main/jniLibs/arm64-v8a \
            sample-app/app/src/main/jniLibs/armeabi-v7a \
            out/lib/arm64-v8a out/lib/armeabi-v7a \
            .github/workflows

      - name: Generate CMakeLists.txt
        run: |
          cat > CMakeLists.txt << 'DXTCMK'
          cmake_minimum_required(VERSION 3.22)
          project(dextool CXX C)
          set(CMAKE_CXX_STANDARD 17)
          set(CMAKE_C_STANDARD 11)
          
          set(FRIDA_GUM_DIR "${CMAKE_SOURCE_DIR}/deps/frida-gum/${ANDROID_ABI}")
          add_library(frida-gumjs STATIC IMPORTED)
          set_target_properties(frida-gumjs PROPERTIES
              IMPORTED_LOCATION "${FRIDA_GUM_DIR}/libfrida-gumjs.a")
          
          set(DOBBY_DIR "${CMAKE_SOURCE_DIR}/deps/dobby")
          add_library(dobby_static STATIC IMPORTED)
          set_target_properties(dobby_static PROPERTIES
              IMPORTED_LOCATION "${DOBBY_DIR}/${ANDROID_ABI}/libdobby.a")
          
          find_library(lib_egl     EGL)
          find_library(lib_gles2   GLESv2)
          find_library(lib_gles3   GLESv3)
          find_library(lib_log     log)
          find_library(lib_dl      dl)
          find_library(lib_android android)
          
          set(IMGUI_DIR "${CMAKE_SOURCE_DIR}/imgui")
          set(IMGUI_SRC
              ${IMGUI_DIR}/imgui.cpp
              ${IMGUI_DIR}/imgui_draw.cpp
              ${IMGUI_DIR}/imgui_tables.cpp
              ${IMGUI_DIR}/imgui_widgets.cpp
              ${IMGUI_DIR}/backends/imgui_impl_opengl3.cpp)
          
          add_library(tool SHARED
              src/main.cpp
              src/logger.cpp
              src/overlay.cpp
              src/touch.cpp
              src/frida_bridge.cpp
              src/smali_runtime.cpp
              src/menu.cpp
              ${IMGUI_SRC})
          
          target_include_directories(tool PRIVATE
              src/
              ${FRIDA_GUM_DIR}/
              ${DOBBY_DIR}/include/
              ${IMGUI_DIR}/
              ${IMGUI_DIR}/backends/)
          
          target_compile_definitions(tool PRIVATE IMGUI_IMPL_OPENGL_ES2=1)
          
          target_compile_options(tool PRIVATE
              -fvisibility=hidden -ffunction-sections -fdata-sections -O2
              -Wno-unused-variable -Wno-unused-function)
          
          target_link_libraries(tool
              frida-gumjs dobby_static
              ${lib_egl} ${lib_gles2} ${lib_gles3} ${lib_log} ${lib_dl} ${lib_android}
              -lm -Wl,--gc-sections -Wl,--exclude-libs,ALL)
          DXTCMK

      - name: Generate logger.h
        run: |
          cat > src/logger.h << 'DXTLOGH'
          #pragma once
          #include <android/log.h>
          #define DTAG "DexTool"
          #define LOGI(...) __android_log_print(ANDROID_LOG_INFO,  DTAG, __VA_ARGS__)
          #define LOGD(...) __android_log_print(ANDROID_LOG_DEBUG, DTAG, __VA_ARGS__)
          #define LOGE(...) __android_log_print(ANDROID_LOG_ERROR, DTAG, __VA_ARGS__)
          void logger_init(const char* base_dir);
          void log_info(const char* msg);
          void log_debug(const char* msg);
          void log_crash_raw(const char* msg);
          void logger_install_abort_capture();
          DXTLOGH

      - name: Generate logger.cpp
        run: |
          cat > src/logger.cpp << 'DXTLOGC'
          #include "logger.h"
          #include "frida-gumjs.h"
          #include <cstdio>
          #include <cstring>
          #include <ctime>
          #include <cstdlib>
          #include <exception>
          #include <fcntl.h>
          #include <unistd.h>
          #include <sys/stat.h>
          #include <signal.h>
          #include <ucontext.h>
          #include <dlfcn.h>
          #include <pthread.h>
          
          static FILE* g_info_fp  = nullptr;
          static FILE* g_debug_fp = nullptr;
          static int   g_crash_fd = -1;
          static pthread_mutex_t g_mtx = PTHREAD_MUTEX_INITIALIZER;
          
          static void ts(char* buf, size_t n) {
              time_t t = time(nullptr);
              struct tm tm;
              localtime_r(&t, &tm);
              snprintf(buf, n, "%04d-%02d-%02d %02d:%02d:%02d",
                       tm.tm_year+1900, tm.tm_mon+1, tm.tm_mday,
                       tm.tm_hour, tm.tm_min, tm.tm_sec);
          }
          
          /* Fatal-signal capture. SA_SIGINFO logs signal/si_code/fault
             addr/PC, then the PREVIOUS handler is restored and the signal
             re-raised so debuggerd still writes its tombstone and the
             "Fatal signal" backtrace to logcat (streamed to
             dextool-logcat.txt by DexToolApp). */
          static struct sigaction g_prev_act[32];
          static bool             g_prev_set[32];
          static char             g_alt_stack[64 * 1024];
          
          static void crash_sig_action(int sig, siginfo_t* si, void* uc) {
              uintptr_t pc = 0;
              ucontext_t* u = (ucontext_t*)uc;
          #if defined(__aarch64__)
              if (u) pc = (uintptr_t)u->uc_mcontext.pc;
          #elif defined(__arm__)
              if (u) pc = (uintptr_t)u->uc_mcontext.arm_pc;
          #endif
              char m[160];
              snprintf(m, sizeof(m), "CRASH signal=%d code=%d addr=%p pc=%p\n",
             sig, si ? si->si_code : 0,
                       si ? si->si_addr : NULL, (void*)pc);
              log_crash_raw(m);
              {
                  Dl_info di;
                  if (dladdr((const void*)pc, &di) && di.dli_fname) {
                      char lm[256];
                      snprintf(lm, sizeof(lm),
                               "pc=%p in %s base=%p off=+%zx\n",
                               (void*)pc, di.dli_fname, di.dli_fbase,
                               (size_t)(pc - (uintptr_t)di.dli_fbase));
                      log_crash_raw(lm);
                  }
              }
              if (g_prev_set[sig]) {
                  sigaction(sig, &g_prev_act[sig], NULL);
              } else {
                  signal(sig, SIG_DFL);
              }
              raise(sig);
          }
          
          static void install_crash_sig(int sig) {
              struct sigaction sa;
              memset(&sa, 0, sizeof(sa));
              sa.sa_sigaction = crash_sig_action;
              sa.sa_flags     = SA_SIGINFO | SA_RESTART | SA_ONSTACK;
              sigemptyset(&sa.sa_mask);
              g_prev_set[sig] = (sigaction(sig, &sa, &g_prev_act[sig]) == 0);
          }
          
          void logger_init(const char* base_dir) {
              mkdir(base_dir, 0755);
              char p[640];
              snprintf(p, sizeof(p), "%s/dextool.log",       base_dir);
              g_info_fp  = fopen(p, "a");
              snprintf(p, sizeof(p), "%s/dextool-debug.log",  base_dir);
              g_debug_fp = fopen(p, "a");
              /* keep last boot's crash log; start fresh for this boot so
                 entries map 1:1 to runs */
              char pprev[640];
              snprintf(pprev, sizeof(pprev), "%s/dextool-crash.prev.log", base_dir);
              snprintf(p, sizeof(p), "%s/dextool-crash.log", base_dir);
              rename(p, pprev);
              g_crash_fd = open(p, O_WRONLY|O_CREAT|O_TRUNC, 0644);
              {
                  stack_t ss;
                  memset(&ss, 0, sizeof(ss));
                  ss.ss_sp    = g_alt_stack;
                  ss.ss_size  = sizeof(g_alt_stack);
                  ss.ss_flags = 0;
                  sigaltstack(&ss, NULL);
              }
              install_crash_sig(SIGSEGV);
              install_crash_sig(SIGABRT);
              install_crash_sig(SIGBUS);
              install_crash_sig(SIGILL);
              install_crash_sig(SIGFPE);
              {
                  char boot[96];
                  snprintf(boot, sizeof(boot), "--- boot %ld ---\n", (long)time(nullptr));
                  log_crash_raw(boot);
              }
              log_info("logger_init done (build r7: single-owner overlay)");
          }
          
          void log_info(const char* msg) {
              if (!g_info_fp) return;
              pthread_mutex_lock(&g_mtx);
              char t[32]; ts(t, sizeof(t));
              fprintf(g_info_fp, "[%s][I] %s\n", t, msg);
              fflush(g_info_fp);
              pthread_mutex_unlock(&g_mtx);
          }
          
          void log_debug(const char* msg) {
              if (!g_debug_fp) return;
              pthread_mutex_lock(&g_mtx);
              char t[32]; ts(t, sizeof(t));
              fprintf(g_debug_fp, "[%s][D] %s\n", t, msg);
              fflush(g_debug_fp);
              pthread_mutex_unlock(&g_mtx);
          }
          
          void log_crash_raw(const char* msg) {
              if (g_crash_fd >= 0) write(g_crash_fd, msg, strlen(msg));
          }

          static void glib_log_capture(const gchar* domain, GLogLevelFlags level,
                                       const gchar* message, gpointer) {
              const char* lv =
                  (level & G_LOG_LEVEL_ERROR)    ? "ERROR"    :
                  (level & G_LOG_LEVEL_CRITICAL) ? "CRITICAL" :
                  (level & G_LOG_LEVEL_WARNING)  ? "WARNING"  : "MSG";
              char m[1024];
              snprintf(m, sizeof(m), "[GLIB] %s-%s: %s\n",
                       domain ? domain : "GLib", lv, message ? message : "(null)");
              log_crash_raw(m);
              if (level & G_LOG_FLAG_FATAL) {
                  /* custom handler must abort fatal messages itself */
                  abort();
              }
          }

          static void dt_terminate() {
              log_crash_raw("std::terminate called\n");
              try { std::rethrow_exception(std::current_exception()); }
              catch (const std::exception& e) {
                  char m[512];
                  snprintf(m, sizeof(m), "  uncaught exception: %s\n", e.what());
                  log_crash_raw(m);
              } catch (...) {
                  log_crash_raw("  uncaught exception: (unknown)\n");
              }
              abort();
          }

          void logger_install_abort_capture() {
              if (g_crash_fd >= 0) {
                  dup2(g_crash_fd, STDOUT_FILENO);
                  dup2(g_crash_fd, STDERR_FILENO);
              }
              g_log_set_default_handler(glib_log_capture, nullptr);
              std::set_terminate(dt_terminate);
              log_info("abort capture installed (glib+terminate+stderr -> crash log)");
          }
          DXTLOGC

      - name: Generate overlay.h
        run: |
          cat > src/overlay.h << 'DXTOVLH'
          #pragma once
          #include <EGL/egl.h>
          #include <jni.h>
          bool install_swap_hook();
          void overlay_set_java_vm(JavaVM* vm);
          void overlay_start(JavaVM* vm);
          void overlay_on_touch(float x, float y, bool pressed);
          #ifdef __cplusplus
          extern "C" {
          #endif
          JNIEXPORT void dextool_on_touch(float x, float y, int action);
          JNIEXPORT void dextool_add_char(int codepoint);
          JNIEXPORT void dextool_backspace();
          JNIEXPORT bool dextool_want_mouse();
          #ifdef __cplusplus
          }
          #endif
          DXTOVLH

      - name: Generate overlay.cpp
        run: |
          cat > src/overlay.cpp << 'DXTOVLC'
          #include "overlay.h"
          #include "logger.h"
          #include "menu.h"
          #include "frida_bridge.h"
          #include "touch.h"
          #include "imgui.h"
          #include "imgui_impl_opengl3.h"
          #include "dobby.h"
          #include "frida-gumjs.h"
          #include <EGL/egl.h>
          #include <GLES2/gl2.h>
          #include <GLES3/gl3.h>
          #include <dlfcn.h>
          #include <cstring>
          #include <ctime>
          #include <pthread.h>
          #include <atomic>
          #include <vector>
          #include <mutex>
          #include <unordered_map>
          
          typedef EGLBoolean (*fn_swap)(EGLDisplay, EGLSurface);
          typedef EGLBoolean (*fn_swap_dmg)(EGLDisplay, EGLSurface, EGLint*, EGLint);
          typedef EGLBoolean (*fn_destroy_ctx)(EGLDisplay, EGLContext);
          
          static fn_swap        g_orig_swap        = nullptr;
          static fn_swap_dmg    g_orig_swap_dmg    = nullptr;
          static fn_destroy_ctx g_orig_destroy_ctx = nullptr;
          
          static std::atomic<bool> g_gum_inited {false};
          static JavaVM*           g_jvm        = nullptr;
          
          /* ---- single-owner overlay ---------------------------------------- r7
             The app has TWO GL threads (HWUI's RenderThread and the
             GLSurfaceView GLThread), each with its own EGL context, and BOTH
             call eglSwapBuffers. r6 gave every context its own ImGui world and
             drew the SAME menu from both threads:
               - two overlapping menus, only one of which received the touch
                 events (they were consumed by whichever GL thread ticked
                 first), so the other looked frozen and could not be resized;
               - taps landed next to the buttons because the winning thread's
                 coordinate space did not match the surface the menu was on;
               - hiding the window (X / "Visible") mutated shared state under
                 the other thread's feet.
             r7: every context still gets a Slot, but exactly ONE "owner" is
             allowed to run ImGui and draw (elected by swap activity, migrated
             if it goes quiet). Only the owner thread touches ImGui or GL
             state. Slots are never freed — eglDestroyContext just marks them
             dead — so an in-flight tick can never hold a dangling pointer. */
          #define DT_ELECT_MIN_SWAPS 45
          #define DT_OWNER_STALE_MS   1500
          
          struct GlState {
              GLint program = 0;
              GLint vao = 0, ab = 0, eb = 0;
              GLint active_tex = GL_TEXTURE0, tex2d = 0;
              GLint viewport[4]    = {0, 0, 0, 0};
              GLint scissor_box[4] = {0, 0, 0, 0};
              GLboolean scissor = GL_FALSE, depth = GL_FALSE,
                        stencil = GL_FALSE, blend = GL_FALSE, cull = GL_FALSE;
              GLint blend_src_rgb = GL_ONE, blend_dst_rgb = GL_ZERO,
                    blend_src_a = GL_ONE, blend_dst_a = GL_ZERO,
                    blend_eq_rgb = GL_FUNC_ADD, blend_eq_a = GL_FUNC_ADD;
          };
          struct Slot {
              ImGuiContext* imgui = nullptr;
              bool  failed = false;
              bool  es3 = false;
              bool  dead = false;         /* under g_slots_mtx */
              long  swaps = 0;            /* under g_slots_mtx */
              long  last_swap_ms = 0;     /* under g_slots_mtx */
              long  last_frame_ms = 0;    /* owner thread only */
              GlState gl;
          };
          static std::mutex g_slots_mtx;
          static std::unordered_map<EGLContext, Slot*> g_slots;
          static std::vector<Slot*> g_graveyard;  /* never freed: no dangling */
          static EGLContext g_owner = nullptr;    /* under g_slots_mtx */
          static std::mutex g_tick_mtx;  /* one ImGui drawer at a time; also
                                            serializes ownership changes and
                                            slot teardown against frames */
          
          /* Touch events are queued by the Java hook (and by the
             NativeActivity hook) and replayed as REAL ImGui events by the
             owner thread, so a tap can no longer be eaten by the "wrong" GL
             thread. phase: 0=down 1=up 2=move (cancel folded into up). */
          struct TouchEvent { float x, y; int phase; };
          static std::mutex              g_touch_mtx;
          static std::vector<TouchEvent> g_touch_q;
          static std::atomic<bool>       g_want_mouse {false};
          
          static std::mutex            g_char_mtx;
          static std::vector<unsigned>  g_pending_chars;
          static bool                   g_pending_bs    = false;
          static bool                   g_want_kbd_prev = false;
          
          static long now_ms() {
              timespec ts;
              clock_gettime(CLOCK_MONOTONIC, &ts);
              return (long)ts.tv_sec * 1000 + ts.tv_nsec / 1000000;
          }
          
          static void touch_push(float x, float y, int phase) {
              std::lock_guard<std::mutex> lk(g_touch_mtx);
              if (g_touch_q.size() > 64) g_touch_q.erase(g_touch_q.begin());
              g_touch_q.push_back({x, y, phase});
          }
          
          /* legacy boolean interface used by the AInputQueue (NativeActivity)
             hook; translated into phase events here */
          static bool g_legacy_pressed = false;
          void overlay_on_touch(float x, float y, bool p) {
              if (p) {
                  touch_push(x, y, g_legacy_pressed ? 2 : 0);
              } else if (g_legacy_pressed) {
                  touch_push(x, y, 1);
              }
              g_legacy_pressed = p;
          }
          
          extern "C" JNIEXPORT void dextool_on_touch(float x, float y, int action) {
              int a = action & 0xff;
              if      (a == 0)           touch_push(x, y, 0);  /* DOWN      */
              else if (a == 1 || a == 3) touch_push(x, y, 1);  /* UP/CANCEL */
              else if (a == 2)           touch_push(x, y, 2);  /* MOVE      */
              else if (a == 5 || a == 6) touch_push(x, y, 2);  /* PTR up/dn */
          }
          
          /* the Java side asks whether the overlay wants the current touch
             (menu hovered); if true the agent swallows the event so the game
             does not also react to menu taps */
          extern "C" JNIEXPORT bool dextool_want_mouse() {
              return g_want_mouse.load();
          }
          
          extern "C" JNIEXPORT void dextool_add_char(int cp) {
              std::lock_guard<std::mutex> lk(g_char_mtx);
              g_pending_chars.push_back((unsigned)cp);
          }
          
          extern "C" JNIEXPORT void dextool_backspace() {
              std::lock_guard<std::mutex> lk(g_char_mtx);
              g_pending_bs = true;
          }
          
          static void* frida_thread(void*) {
              frida_bridge_start(g_jvm);
              return nullptr;
          }
          
          void overlay_start(JavaVM*) {
              if (g_gum_inited.exchange(true)) return;
              gum_init_embedded();
              log_info("[overlay] gum_init_embedded done");
              pthread_t ft;
              pthread_attr_t a;
              pthread_attr_init(&a);
              pthread_attr_setstacksize(&a, 8 * 1024 * 1024);
              pthread_attr_setdetachstate(&a, PTHREAD_CREATE_DETACHED);
              pthread_create(&ft, &a, frida_thread, nullptr);
              pthread_attr_destroy(&a);
              touch_install_hooks();
              log_info("[overlay] touch hooks installed, frida thread started");
          }
          
          static void menu_init_once() {
              static bool done = false;
              if (!done) { done = true; menu_init(); }
          }
          
          static Slot* slot_for(EGLContext ctx) {
              std::lock_guard<std::mutex> lk(g_slots_mtx);
              Slot*& s = g_slots[ctx];
              if (!s) s = new Slot();
              return s;
          }
          
          /* Ownership rules (map work under g_slots_mtx, whole frame under
             g_tick_mtx, so this can never race a draw):
               - fast path: we are already the owner;
               - if the owner went quiet for DT_OWNER_STALE_MS while we keep
                 swapping, ownership migrates to us (the old owner's ImGui is
                 destroyed CPU-side only; its GL objects die with its context);
               - with no owner, the first slot to reach DT_ELECT_MIN_SWAPS
                 swaps wins — that is the continuously rendering thread (the
                 game), not the bursty HWUI RenderThread that only swaps on UI
                 changes. */
          static bool ensure_ownership(Slot* s, EGLContext ctx) {
              std::lock_guard<std::mutex> lk(g_slots_mtx);
              if (s->dead) return false;
              s->swaps++;
              long now = now_ms();
              s->last_swap_ms = now;   /* migration test needs "active" */
              Slot* ow = nullptr;
              if (g_owner) {
                  auto it = g_slots.find(g_owner);
                  if (it != g_slots.end() && !it->second->dead) ow = it->second;
              }
              if (ow == s) { s->last_swap_ms = now; return true; }
              if (ow) {
                  bool stale = (now - ow->last_swap_ms) > DT_OWNER_STALE_MS &&
                               (now - s->last_swap_ms)  < 600;
                  if (!stale) return false;     /* healthy owner elsewhere */
                  if (ow->imgui) {              /* retire the old world */
                      ImGui::DestroyContext(ow->imgui);
                      ow->imgui = nullptr;
                  }
                  g_owner = nullptr;
                  LOGI("[overlay] owner migrated (previous went quiet)");
              }
              if (g_owner == nullptr && s->swaps >= DT_ELECT_MIN_SWAPS) {
                  g_owner = ctx;
                  s->last_swap_ms = now;
                  LOGI("[overlay] owner elected after %ld swaps", s->swaps);
                  return true;
              }
              return false;
          }
          
          static void slot_init(EGLDisplay dpy, EGLSurface surf, Slot* s) {
              EGLint w = 1080, h = 1920;
              eglQuerySurface(dpy, surf, EGL_WIDTH,  &w);
              eglQuerySurface(dpy, surf, EGL_HEIGHT, &h);
          
              const GLubyte* ver = glGetString(GL_VERSION);
              if (!ver || !strstr((const char*)ver, "OpenGL ES")) {
                  LOGE("[overlay] not OpenGL ES: %s", ver ? (const char*)ver : "null");
                  s->failed = true;
                  return;
              }
          
              LOGI("[overlay] GL: %s (%dx%d)", (const char*)ver, w, h);
              /* ImGui is compiled with IMGUI_IMPL_OPENGL_ES2, so its shader
                 body is GLSL ES 100 (attribute/varying). The header must
                 stay "#version 100" even on ES3 contexts — they accept
                 GLSL ES 100 programs. */
              s->es3 = strstr((const char*)ver, "OpenGL ES 3") != nullptr;
              s->imgui = ImGui::CreateContext();
              ImGui::SetCurrentContext(s->imgui);
              ImGuiIO& io   = ImGui::GetIO();
              io.DisplaySize = ImVec2((float)w, (float)h);
              io.DeltaTime   = 1.0f / 60.0f;
              io.IniFilename = nullptr;
              io.ConfigFlags |= ImGuiConfigFlags_NoMouseCursorChange;
              io.ConfigWindowsMoveFromTitleBarOnly = true;  /* touch friendly */
              ImGui::StyleColorsDark();
              ImGui::GetStyle().WindowRounding = 6.0f;
              ImGui_ImplOpenGL3_Init("#version 100");
              s->last_frame_ms = now_ms();
              LOGI("[overlay] ImGui up OK (%dx%d)", w, h);
          }
          
          /* eglDestroyContext hook: retire the slot WITH its context. The
             Slot object is never freed (graveyard), so an in-flight tick still
             holds a valid pointer and just sees dead=true on its next tick. */
          static void slot_destroy(EGLContext ctx) {
              std::lock_guard<std::mutex> lk(g_tick_mtx);
              std::lock_guard<std::mutex> lk2(g_slots_mtx);
              auto it = g_slots.find(ctx);
              if (it == g_slots.end()) return;
              Slot* s = it->second;
              s->dead = true;
              g_slots.erase(it);
              g_graveyard.push_back(s);
              if (g_owner == ctx) g_owner = nullptr;
              if (s->imgui) {
                  ImGui::SetCurrentContext(s->imgui);
                  if (eglGetCurrentContext() == ctx)
                      ImGui_ImplOpenGL3_Shutdown();  /* GL deletes need the ctx */
                  ImGui::DestroyContext(s->imgui);
                  ImGui::SetCurrentContext(nullptr);
                  LOGI("[overlay] ImGui slot destroyed");
              }
          }
          
          /* HWUI aborts the whole process on GL_INVALID_VALUE, so every
             binding the ES2 ImGui backend touches (program, VAO, buffers,
             texture, viewport, scissor, blend, depth/stencil/cull) goes back
             exactly the way the app had it before the swap continues. */
          static void gl_state_save(Slot* s) {
              GlState& g = s->gl;
              glGetIntegerv(GL_CURRENT_PROGRAM, &g.program);
              /* ab/eb must be captured on ES2 too: r6 saved them only on ES3
                 and then RESTORED binding 0 on ES2, clobbering the app's
                 buffer bindings every frame */
              glGetIntegerv(GL_ARRAY_BUFFER_BINDING,         &g.ab);
              glGetIntegerv(GL_ELEMENT_ARRAY_BUFFER_BINDING, &g.eb);
              if (s->es3)
                  glGetIntegerv(GL_VERTEX_ARRAY_BINDING, &g.vao);
              glGetIntegerv(GL_ACTIVE_TEXTURE, &g.active_tex);
              glActiveTexture(GL_TEXTURE0);
              glGetIntegerv(GL_TEXTURE_BINDING_2D, &g.tex2d);
              glGetIntegerv(GL_VIEWPORT,    g.viewport);
              glGetIntegerv(GL_SCISSOR_BOX, g.scissor_box);
              g.scissor = glIsEnabled(GL_SCISSOR_TEST);
              g.depth   = glIsEnabled(GL_DEPTH_TEST);
              g.stencil = glIsEnabled(GL_STENCIL_TEST);
              g.blend   = glIsEnabled(GL_BLEND);
              g.cull    = glIsEnabled(GL_CULL_FACE);
              glGetIntegerv(GL_BLEND_SRC_RGB,   &g.blend_src_rgb);
              glGetIntegerv(GL_BLEND_DST_RGB,   &g.blend_dst_rgb);
              glGetIntegerv(GL_BLEND_SRC_ALPHA, &g.blend_src_a);
              glGetIntegerv(GL_BLEND_DST_ALPHA, &g.blend_dst_a);
              glGetIntegerv(GL_BLEND_EQUATION_RGB,   &g.blend_eq_rgb);
              glGetIntegerv(GL_BLEND_EQUATION_ALPHA, &g.blend_eq_a);
          }
          
          static void gl_state_restore(Slot* s) {
              GlState& g = s->gl;
              if (s->es3) glBindVertexArray(g.vao);
              glBindBuffer(GL_ARRAY_BUFFER,         g.ab);
              glBindBuffer(GL_ELEMENT_ARRAY_BUFFER, g.eb);
              glActiveTexture(g.active_tex);
              glBindTexture(GL_TEXTURE_2D, g.tex2d);
              glBlendEquationSeparate(g.blend_eq_rgb, g.blend_eq_a);
              glBlendFuncSeparate(g.blend_src_rgb, g.blend_dst_rgb,
                                  g.blend_src_a,  g.blend_dst_a);
              if (g.blend)   glEnable(GL_BLEND);        else glDisable(GL_BLEND);
              if (g.scissor) glEnable(GL_SCISSOR_TEST); else glDisable(GL_SCISSOR_TEST);
              if (g.depth)   glEnable(GL_DEPTH_TEST);   else glDisable(GL_DEPTH_TEST);
              if (g.stencil) glEnable(GL_STENCIL_TEST); else glDisable(GL_STENCIL_TEST);
              if (g.cull)    glEnable(GL_CULL_FACE);    else glDisable(GL_CULL_FACE);
              glScissor(g.scissor_box[0], g.scissor_box[1],
                        g.scissor_box[2], g.scissor_box[3]);
              glViewport(g.viewport[0], g.viewport[1],
                         g.viewport[2], g.viewport[3]);
              glUseProgram(g.program);
          }
          
          static void overlay_tick(EGLDisplay dpy, EGLSurface surf) {
              static thread_local bool in_tick = false;
              if (in_tick) return;   /* driver re-entry (swap->swapWithDamage) */
              in_tick = true;
              struct TickReset { bool& b; ~TickReset() { b = false; } }
                  tick_reset{in_tick};
          
              EGLContext ctx = eglGetCurrentContext();
              if (ctx == EGL_NO_CONTEXT) return;
          
              /* one drawer at a time; also serializes ownership changes and
                 slot teardown against in-flight frames */
              std::lock_guard<std::mutex> lk(g_tick_mtx);
          
              Slot* s = slot_for(ctx);
              if (!ensure_ownership(s, ctx)) return;  /* not the owner: no
                                                         ImGui, no GL touched */
              if (s->dead || s->failed) return;
          
              if (!s->imgui) slot_init(dpy, surf, s);
              if (!s->imgui) return;
              ImGui::SetCurrentContext(s->imgui);
              ImGuiIO& io = ImGui::GetIO();
              {
                  EGLint w = 1080, h = 1920;
                  eglQuerySurface(dpy, surf, EGL_WIDTH,  &w);
                  eglQuerySurface(dpy, surf, EGL_HEIGHT, &h);
                  io.DisplaySize = ImVec2((float)w, (float)h);
              }
              {
                  long nowt = now_ms();
                  if (s->last_frame_ms > 0) {
                      float dt = (float)(nowt - s->last_frame_ms) / 1000.0f;
                      if (dt < 0.001f) dt = 0.001f;
                      if (dt > 0.05f)  dt = 0.05f;
                      io.DeltaTime = dt;
                  }
                  s->last_frame_ms = nowt;
              }
          
              /* replay queued touch events as real ImGui events */
              {
                  std::vector<TouchEvent> q;
                  {
                      std::lock_guard<std::mutex> lk2(g_touch_mtx);
                      q.swap(g_touch_q);
                  }
                  ImVec2 ds = io.DisplaySize;
                  for (const TouchEvent& t : q) {
                      float x = t.x < 0.f ? 0.f : (t.x > ds.x ? ds.x : t.x);
                      float y = t.y < 0.f ? 0.f : (t.y > ds.y ? ds.y : t.y);
                      io.AddMousePosEvent(x, y);
                      io.AddMouseButtonEvent(0, t.phase != 1);
                  }
              }
          
              {
                  std::lock_guard<std::mutex> lk2(g_char_mtx);
                  for (unsigned cp : g_pending_chars) io.AddInputCharacter(cp);
                  g_pending_chars.clear();
                  if (g_pending_bs) {
                      io.AddKeyEvent(ImGuiKey_Backspace, true);
                      io.AddKeyEvent(ImGuiKey_Backspace, false);
                      g_pending_bs = false;
                  }
              }
          
              menu_init_once();
          
              gl_state_save(s);
              glBindFramebuffer(GL_FRAMEBUFFER, 0);
              /* the ES2 backend relies on GL_SCISSOR_TEST for clipping; the
                 app may leave it disabled. Enable it for our draw — restore
                 puts the app's state back afterwards. */
              glEnable(GL_SCISSOR_TEST);
              ImGui_ImplOpenGL3_NewFrame();
              ImGui::NewFrame();
              menu_draw();
              g_want_mouse.store(io.WantCaptureMouse);
              ImGui::Render();
              ImGui_ImplOpenGL3_RenderDrawData(ImGui::GetDrawData());
              gl_state_restore(s);
          
              bool want_kbd = io.WantCaptureKeyboard;
              if (want_kbd != g_want_kbd_prev) {
                  g_want_kbd_prev = want_kbd;
                  frida_post(want_kbd ?
                      "{\"type\":\"showKeyboard\"}" :
                      "{\"type\":\"hideKeyboard\"}");
              }
          }
          
          static EGLBoolean my_destroy_ctx(EGLDisplay dpy, EGLContext ctx) {
              slot_destroy(ctx);
              return g_orig_destroy_ctx(dpy, ctx);
          }
          
          static EGLBoolean my_swap(EGLDisplay dpy, EGLSurface surf) {
              overlay_tick(dpy, surf);
              return g_orig_swap(dpy, surf);
          }
          
          static EGLBoolean my_swap_dmg(EGLDisplay dpy, EGLSurface surf,
                                        EGLint* rects, EGLint n) {
              overlay_tick(dpy, surf);
              return g_orig_swap_dmg(dpy, surf, rects, n);
          }
          
          bool install_swap_hook() {
              void* egl = dlopen("libEGL.so", RTLD_NOW);
              if (!egl) { LOGE("dlopen libEGL.so: %s", dlerror()); return false; }
              bool ok = false;
              void* sym = dlsym(egl, "eglSwapBuffers");
              if (sym) {
                  int r = DobbyHook(sym,
                      reinterpret_cast<dobby_dummy_func_t>(my_swap),
                      reinterpret_cast<dobby_dummy_func_t*>(&g_orig_swap));
                  if (r == 0) { LOGI("eglSwapBuffers hooked OK"); ok = true; }
                  else LOGE("DobbyHook eglSwapBuffers: %d", r);
              }
              void* sym_dmg = dlsym(egl, "eglSwapBuffersWithDamageKHR");
              if (!sym_dmg) {
                  typedef void* (*PFN)(const char*);
                  PFN gpa = (PFN)dlsym(egl, "eglGetProcAddress");
                  if (gpa) {
                      sym_dmg = gpa("eglSwapBuffersWithDamageKHR");
                      if (!sym_dmg) sym_dmg = gpa("eglSwapBuffersWithDamageEXT");
                  }
              }
              if (sym_dmg) {
                  int r = DobbyHook(sym_dmg,
                      reinterpret_cast<dobby_dummy_func_t>(my_swap_dmg),
                      reinterpret_cast<dobby_dummy_func_t*>(&g_orig_swap_dmg));
                  if (r == 0) LOGI("eglSwapBuffersWithDamageKHR hooked OK");
                  else        LOGE("DobbyHook eglSwapBuffersWithDamageKHR: %d", r);
              }
              void* sym_dc = dlsym(egl, "eglDestroyContext");
              if (sym_dc) {
                  int r = DobbyHook(sym_dc,
                      reinterpret_cast<dobby_dummy_func_t>(my_destroy_ctx),
                      reinterpret_cast<dobby_dummy_func_t*>(&g_orig_destroy_ctx));
                  if (r == 0) LOGI("eglDestroyContext hooked OK");
                  else        LOGE("DobbyHook eglDestroyContext: %d", r);
              }
              return ok;
          }
          DXTOVLC

      - name: Generate touch.h and touch.cpp
        run: |
          cat > src/touch.h << 'DXTTHH'
          #pragma once
          void touch_install_hooks();
          DXTTHH
          cat > src/touch.cpp << 'DXTTCH'
          #include "touch.h"
          #include "overlay.h"
          #include "logger.h"
          #include "dobby.h"
          #include <dlfcn.h>
          #include <android/input.h>
          
          typedef int32_t (*fn_getEvent)(AInputQueue*, AInputEvent**);
          static fn_getEvent g_orig_get = nullptr;
          
          static int32_t my_getEvent(AInputQueue* q, AInputEvent** ev) {
              int32_t rc = g_orig_get(q, ev);
              if (rc >= 0 && ev && *ev) {
                  if (AInputEvent_getType(*ev) == AINPUT_EVENT_TYPE_MOTION) {
                      int32_t act = AMotionEvent_getAction(*ev) & AMOTION_EVENT_ACTION_MASK;
                      float x = AMotionEvent_getX(*ev, 0);
                      float y = AMotionEvent_getY(*ev, 0);
                      bool p  = (act == AMOTION_EVENT_ACTION_DOWN ||
                                 act == AMOTION_EVENT_ACTION_MOVE);
                      overlay_on_touch(x, y, p);
                  }
              }
              return rc;
          }
          
          void touch_install_hooks() {
              void* lib = dlopen("libandroid.so", RTLD_NOW);
              if (!lib) { LOGD("touch: libandroid not found (OK for Java apps)"); return; }
              void* sym = dlsym(lib, "AInputQueue_getEvent");
              if (!sym) { LOGD("touch: AInputQueue_getEvent not found (OK for Java apps)"); return; }
              int r = DobbyHook(sym,
                  reinterpret_cast<dobby_dummy_func_t>(my_getEvent),
                  reinterpret_cast<dobby_dummy_func_t*>(&g_orig_get));
              if (r == 0) LOGI("touch: AInputQueue_getEvent hooked (NativeActivity)");
              else        LOGD("touch: DobbyHook AInputQueue_getEvent: %d", r);
          }
          DXTTCH

