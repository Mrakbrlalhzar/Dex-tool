package com.dextool.app;

import android.app.Application;
import android.content.Context;
import android.os.Build;
import android.os.Environment;
import android.util.Log;
import java.io.File;
import java.io.FileInputStream;
import java.io.FileOutputStream;
import java.io.IOException;
import java.io.InputStream;
import java.io.OutputStream;

/**
 * DexToolApp — Application subclass that loads libtool.so.
 *
 * ORDERING (from known-pitfalls):
 *   1. writeBootMarker()
 *   2. startCopierThread()   <- BEFORE loadLibrary so logs flush on crash
 *   3. Thread.sleep(500)
 *   4. installUncaughtHandler()
 *   5. System.loadLibrary("tool")
 */
public class DexToolApp extends Application {

    private static final String TAG = "DexToolApp";
    private static final String LOG_DIR = "/sdcard/Download";

    @Override
    public void onCreate() {
        super.onCreate();

        writeBootMarker();
        startCopierThread();

        try { Thread.sleep(500); } catch (InterruptedException ignored) {}

        installUncaughtHandler();

        try {
            System.loadLibrary("tool");
            Log.i(TAG, "libtool.so loaded");
        } catch (UnsatisfiedLinkError e) {
            Log.e(TAG, "loadLibrary failed: " + e.getMessage());
        }
    }

    // ── Boot marker: written by App BEFORE System.loadLibrary ──
    private void writeBootMarker() {
        File f = new File(LOG_DIR + "/dextool-boot.marker");
        try {
            f.getParentFile().mkdirs();
            try (FileOutputStream fos = new FileOutputStream(f)) {
                fos.write(("boot ts=" + System.currentTimeMillis() + "\n").getBytes());
            }
        } catch (IOException e) {
            Log.w(TAG, "boot marker write failed: " + e.getMessage());
        }
    }

    // ── Copier: copies log files from internal storage to /sdcard ──
    private void startCopierThread() {
        Thread t = new Thread(() -> {
            while (true) {
                try {
                    Thread.sleep(5000);
                    copyLogsToDownloads();
                } catch (InterruptedException e) {
                    break;
                } catch (Exception e) {
                    Log.w(TAG, "copier error: " + e.getMessage());
                }
            }
        }, "dextool-copier");
        t.setDaemon(true);
        t.start();
    }

    private void copyLogsToDownloads() {
        String[] logs = { "dextool.log", "dextool-debug.log", "dextool-crash.log" };
        File srcDir = new File(getFilesDir(), "dextool-logs");
        File dstDir = new File(LOG_DIR);
        dstDir.mkdirs();
        for (String name : logs) {
            File src = new File(srcDir, name);
            if (!src.exists()) continue;
            File dst = new File(dstDir, name);
            try (InputStream is  = new FileInputStream(src);
                 OutputStream os = new FileOutputStream(dst, true)) {
                byte[] buf = new byte[8192];
                int n;
                while ((n = is.read(buf)) != -1) os.write(buf, 0, n);
            } catch (IOException e) {
                Log.w(TAG, "copy " + name + " failed: " + e.getMessage());
            }
        }
    }

    private void installUncaughtHandler() {
        Thread.UncaughtExceptionHandler prev =
            Thread.getDefaultUncaughtExceptionHandler();
        Thread.setDefaultUncaughtExceptionHandler((thread, ex) -> {
            File f = new File(LOG_DIR + "/dextool-crash.log");
            try (FileOutputStream fos = new FileOutputStream(f, true)) {
                String msg = "JAVA_CRASH thread=" + thread.getName() +
                             " ex=" + ex.toString() + "\n";
                fos.write(msg.getBytes());
            } catch (IOException ignored) {}
            if (prev != null) prev.uncaughtException(thread, ex);
        });
    }
}
APPJAVA
