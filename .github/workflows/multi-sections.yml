name: Multi-Section Workspace

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Write Helper.java
        run: |
          cat > app/src/main/java/com/menu/imgui/Helper.java << 'JAVA_EOF'
          package com.menu.imgui;

          import android.app.Activity;
          import android.content.Context;
          import android.util.Log;
          import android.view.MotionEvent;
          import android.view.ViewGroup;

          import java.io.ByteArrayOutputStream;
          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileWriter;
          import java.io.IOException;
          import java.io.InputStream;
          import java.io.PrintWriter;
          import java.nio.charset.StandardCharsets;
          import java.text.SimpleDateFormat;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.Date;
          import java.util.List;
          import java.util.Locale;
          import java.util.zip.ZipEntry;
          import java.util.zip.ZipFile;

          public class Helper {
              private static final String TAG = "ImGuiTool";
              private static OverlaySurfaceView overlay;

              static {
                  try {
                      Thread.setDefaultUncaughtExceptionHandler((t, e) -> {
                          try {
                              File f = new File(getLogDir(), "crash.log");
                              FileWriter w = new FileWriter(f, true);
                              PrintWriter pw = new PrintWriter(w);
                              pw.println("\n=== JAVA CRASH " + now() + " ===");
                              pw.println("Thread: " + t.getName());
                              e.printStackTrace(pw);
                              pw.println("=== END ===");
                              pw.close();
                          } catch (Throwable ignored) { }
                      });
                  } catch (Throwable ignored) { }
              }

              private static String now() {
                  return new SimpleDateFormat("yyyy-MM-dd HH:mm:ss", Locale.US).format(new Date());
              }

              private static String getPkgName() {
                  try (FileInputStream fis = new FileInputStream("/proc/self/cmdline")) {
                      byte[] buf = new byte[256];
                      int n = fis.read(buf);
                      if (n > 0) {
                          int end = 0;
                          while (end < n && buf[end] != 0) end++;
                          String pkg = new String(buf, 0, end, "UTF-8");
                          int colon = pkg.indexOf(':');
                          return colon > 0 ? pkg.substring(0, colon) : pkg;
                      }
                  } catch (Throwable ignored) { }
                  return "unknown";
              }

              private static String getLogDir() {
                  File downloads = new File("/sdcard/Download");
                  if (downloads.exists() && downloads.canWrite()) {
                      File test = new File(downloads, ".wtest");
                      try { test.createNewFile(); test.delete(); return downloads.getAbsolutePath(); }
                      catch (Throwable ignored) { }
                  }
                  File ext = new File("/sdcard/Android/data/" + getPkgName());
                  if (ext.exists()) return ext.getAbsolutePath();
                  try { ext.mkdirs(); } catch (Throwable ignored) { }
                  if (ext.exists() && ext.canWrite()) return ext.getAbsolutePath();
                  return "/data/data/" + getPkgName();
              }

              private static void log(String msg) {
                  Log.i(TAG, msg);
                  try {
                      File f = new File(getLogDir(), "crash.log");
                      FileWriter w = new FileWriter(f, true);
                      w.write("[J " + now() + "] " + msg + "\n");
                      w.close();
                  } catch (Throwable ignored) { }
              }

              public static void attach(Context ctx) {
                  log("Helper.attach entered");
                  if (!(ctx instanceof Activity)) return;
                  final Activity activity = (Activity) ctx;
                  try { activity.runOnUiThread(() -> attachOnUi(activity)); }
                  catch (Throwable t) { log("runOnUiThread failed: " + t); }
              }

              private static void attachOnUi(Activity activity) {
                  if (overlay != null) return;
                  try {
                      overlay = new OverlaySurfaceView(activity);
                      overlay.setOnTouchListener((v, e) -> {
                          if (!overlay.isReady()) return false;
                          int action;
                          switch (e.getActionMasked()) {
                              case MotionEvent.ACTION_DOWN:   action = 0; break;
                              case MotionEvent.ACTION_UP:     action = 1; break;
                              case MotionEvent.ACTION_MOVE:   action = 2; break;
                              case MotionEvent.ACTION_CANCEL: action = 3; break;
                              default: return false;
                          }
                          return nativeTouch(action, e.getX(), e.getY());
                      });
                      ViewGroup decor = (ViewGroup) activity.getWindow().getDecorView();
                      decor.addView(overlay, new ViewGroup.LayoutParams(
                              ViewGroup.LayoutParams.MATCH_PARENT,
                              ViewGroup.LayoutParams.MATCH_PARENT
                      ));
                      log("overlay attached");

                      new Thread(() -> {
                          try {
                              List<String> classes = listAllClasses(activity);
                              log("classLister: found " + classes.size());
                              nativeSetClassList(classes.toArray(new String[0]));
                          } catch (Throwable t) { log("classLister failed: " + t); }
                      }, "ImGuiClassLister").start();
                  } catch (Throwable t) { log("attachOnUi FAILED: " + t); }
              }

              // ==================== Class list ====================
              private static List<String> listAllClasses(Context ctx) {
                  List<String> out = new ArrayList<>();
                  String apkPath;
                  try { apkPath = ctx.getPackageCodePath(); }
                  catch (Throwable t) { return out; }
                  try (ZipFile zip = new ZipFile(apkPath)) {
                      for (ZipEntry entry : Collections.list(zip.entries())) {
                          String n = entry.getName();
                          if (n.equals("classes.dex") || n.matches("classes\\d+\\.dex")) {
                              try (InputStream in = zip.getInputStream(entry)) {
                                  byte[] data = readAll(in);
                                  parseDexClasses(data, out);
                              } catch (IOException ignored) { }
                          }
                      }
                  } catch (Throwable t) { log("listAllClasses error: " + t); }
                  Collections.sort(out);
                  return out;
              }

              private static byte[] readAll(InputStream in) throws IOException {
                  ByteArrayOutputStream o = new ByteArrayOutputStream();
                  byte[] b = new byte[8192]; int n;
                  while ((n = in.read(b)) > 0) o.write(b, 0, n);
                  return o.toByteArray();
              }

              private static int rd16(byte[] d, int off) {
                  return (d[off] & 0xFF) | ((d[off + 1] & 0xFF) << 8);
              }
              private static int rd32(byte[] d, int off) {
                  return (d[off] & 0xFF) | ((d[off+1] & 0xFF) << 8) |
                         ((d[off+2] & 0xFF) << 16) | ((d[off+3] & 0xFF) << 24);
              }
              private static int readUleb128(byte[] d, int[] pos) {
                  int result = 0;
                  int shift = 0;
                  while (true) {
                      byte b = d[pos[0]++];
                      result |= (b & 0x7F) << shift;
                      if ((b & 0x80) == 0) break;
                      shift += 7;
                  }
                  return result;
              }
              private static String readString(byte[] d, int strIdsOff, int strIdx) {
                  if (strIdx < 0) return "";
                  int strDataOff = rd32(d, strIdsOff + strIdx * 4);
                  if (strDataOff <= 0 || strDataOff >= d.length) return "";
                  int p = strDataOff;
                  while (p < d.length && (d[p] & 0x80) != 0) p++;
                  if (p < d.length) p++;
                  int start = p;
                  while (p < d.length && d[p] != 0) p++;
                  return new String(d, start, p - start, StandardCharsets.UTF_8);
              }
              private static String getTypeDesc(byte[] d, int typeIdsOff, int strIdsOff, int typeIdx) {
                  int strIdx = rd32(d, typeIdsOff + typeIdx * 4);
                  return readString(d, strIdsOff, strIdx);
              }
              private static String prettyType(String desc) {
                  if (desc == null || desc.isEmpty()) return "?";
                  switch (desc.charAt(0)) {
                      case 'V': return "void";
                      case 'Z': return "boolean";
                      case 'B': return "byte";
                      case 'S': return "short";
                      case 'C': return "char";
                      case 'I': return "int";
                      case 'J': return "long";
                      case 'F': return "float";
                      case 'D': return "double";
                      case 'L':
                          if (desc.endsWith(";")) return desc.substring(1, desc.length() - 1).replace('/', '.');
                          return desc;
                      case '[': return prettyType(desc.substring(1)) + "[]";
                      default: return desc;
                  }
              }

              private static void parseDexClasses(byte[] d, List<String> out) {
                  if (d.length < 0x70) return;
                  if (d[0] != 'd' || d[1] != 'e' || d[2] != 'x' || d[3] != '\n') return;
                  int strIdsOff   = rd32(d, 0x3C);
                  int typeIdsSize = rd32(d, 0x40);
                  int typeIdsOff  = rd32(d, 0x44);
                  int classDefSize= rd32(d, 0x60);
                  int classDefOff = rd32(d, 0x64);
                  if (classDefOff + classDefSize * 32 > d.length) return;
                  for (int i = 0; i < classDefSize; i++) {
                      int cd = classDefOff + i * 32;
                      int classIdx = rd32(d, cd);
                      if (classIdx < 0 || classIdx >= typeIdsSize) continue;
                      String desc = getTypeDesc(d, typeIdsOff, strIdsOff, classIdx);
                      if (desc.startsWith("L") && desc.endsWith(";"))
                          out.add(desc.substring(1, desc.length() - 1).replace('/', '.'));
                  }
              }

              // ==================== Class details ====================
              public static void requestClassDetails(int sectionId, String className) {
                  log("requestClassDetails: sec=" + sectionId + " " + className);
                  new Thread(() -> {
                      String[] fields = new String[0];
                      String[] methods = new String[0];
                      try {
                          ClassMembers m = parseClassMembers(className);
                          fields = m.fields.toArray(new String[0]);
                          methods = m.methods.toArray(new String[0]);
                          log("classDetails: sec=" + sectionId + " fields=" + fields.length + " methods=" + methods.length);
                      } catch (Throwable t) {
                          log("requestClassDetails failed: " + t);
                      }
                      nativeSetClassDetails(sectionId, className, fields, methods);
                  }, "ImGuiClassDetails").start();
              }

              private static class ClassMembers {
                  List<String> fields = new ArrayList<>();
                  List<String> methods = new ArrayList<>();
              }

              private static ClassMembers parseClassMembers(String className) {
                  ClassMembers out = new ClassMembers();
                  String targetDesc = "L" + className.replace('.', '/') + ";";

                  File apkFile = new File(getApkPath());
                  try (ZipFile zip = new ZipFile(apkFile)) {
                      for (ZipEntry entry : Collections.list(zip.entries())) {
                          String n = entry.getName();
                          if (n.equals("classes.dex") || n.matches("classes\\d+\\.dex")) {
                              try (InputStream in = zip.getInputStream(entry)) {
                                  byte[] data = readAll(in);
                                  parseDexMembers(data, targetDesc, out);
                              } catch (IOException ignored) { }
                          }
                      }
                  } catch (Throwable t) { log("parseClassMembers error: " + t); }
                  return out;
              }

              private static String cachedApkPath = null;
              private static String getApkPath() {
                  if (cachedApkPath != null) return cachedApkPath;
                  try {
                      Class<?> at = Class.forName("android.app.ActivityThread");
                      Object app = at.getMethod("currentApplication").invoke(null);
                      if (app instanceof android.content.Context) {
                          cachedApkPath = ((android.content.Context) app).getPackageCodePath();
                          if (cachedApkPath != null) return cachedApkPath;
                      }
                  } catch (Throwable ignored) { }
                  return "/system/framework/framework.jar";
              }

              private static void parseDexMembers(byte[] d, String targetDesc, ClassMembers out) {
                  if (d.length < 0x70) return;
                  if (d[0] != 'd' || d[1] != 'e' || d[2] != 'x' || d[3] != '\n') return;
                  int strIdsOff    = rd32(d, 0x3C);
                  int typeIdsSize  = rd32(d, 0x40);
                  int typeIdsOff   = rd32(d, 0x44);
                  int protoIdsOff  = rd32(d, 0x4C);
                  int fieldIdsOff  = rd32(d, 0x54);
                  int methodIdsOff = rd32(d, 0x5C);
                  int classDefSize = rd32(d, 0x60);
                  int classDefOff  = rd32(d, 0x64);
                  if (classDefOff + classDefSize * 32 > d.length) return;

                  for (int i = 0; i < classDefSize; i++) {
                      int cd = classDefOff + i * 32;
                      int classIdx = rd32(d, cd);
                      if (classIdx < 0 || classIdx >= typeIdsSize) continue;
                      String desc = getTypeDesc(d, typeIdsOff, strIdsOff, classIdx);
                      if (!targetDesc.equals(desc)) continue;

                      int classDataOff = rd32(d, cd + 24);
                      if (classDataOff == 0) return;

                      int[] pos = { classDataOff };
                      int staticFieldsSize   = readUleb128(d, pos);
                      int instanceFieldsSize = readUleb128(d, pos);
                      int directMethodsSize  = readUleb128(d, pos);
                      int virtualMethodsSize = readUleb128(d, pos);

                      int fieldIdx = 0;
                      for (int j = 0; j < staticFieldsSize; j++) {
                          int diff = readUleb128(d, pos);
                          readUleb128(d, pos);
                          fieldIdx += diff;
                          out.fields.add(getFieldSig(d, fieldIdsOff, typeIdsOff, strIdsOff, fieldIdx) + "  [static]");
                      }
                      fieldIdx = 0;
                      for (int j = 0; j < instanceFieldsSize; j++) {
                          int diff = readUleb128(d, pos);
                          readUleb128(d, pos);
                          fieldIdx += diff;
                          out.fields.add(getFieldSig(d, fieldIdsOff, typeIdsOff, strIdsOff, fieldIdx) + "  [instance]");
                      }
                      int methodIdx = 0;
                      for (int j = 0; j < directMethodsSize; j++) {
                          int diff = readUleb128(d, pos);
                          readUleb128(d, pos);
                          readUleb128(d, pos);
                          methodIdx += diff;
                          out.methods.add(getMethodSig(d, methodIdsOff, protoIdsOff, typeIdsOff, strIdsOff, methodIdx) + "  [direct]");
                      }
                      methodIdx = 0;
                      for (int j = 0; j < virtualMethodsSize; j++) {
                          int diff = readUleb128(d, pos);
                          readUleb128(d, pos);
                          readUleb128(d, pos);
                          methodIdx += diff;
                          out.methods.add(getMethodSig(d, methodIdsOff, protoIdsOff, typeIdsOff, strIdsOff, methodIdx) + "  [virtual]");
                      }
                      return;
                  }
              }

              private static String getFieldSig(byte[] d, int fieldIdsOff, int typeIdsOff, int strIdsOff, int fieldIdx) {
                  int fi = fieldIdsOff + fieldIdx * 8;
                  int typeIdx = rd16(d, fi + 2);
                  int nameIdx = rd32(d, fi + 4);
                  String name = readString(d, strIdsOff, nameIdx);
                  String type = prettyType(getTypeDesc(d, typeIdsOff, strIdsOff, typeIdx));
                  return type + " " + name;
              }

              private static String getMethodSig(byte[] d, int methodIdsOff, int protoIdsOff, int typeIdsOff, int strIdsOff, int methodIdx) {
                  int mi = methodIdsOff + methodIdx * 8;
                  int protoIdx = rd16(d, mi + 2);
                  int nameIdx  = rd32(d, mi + 4);
                  String name = readString(d, strIdsOff, nameIdx);
                  if ("<init>".equals(name))   name = "<init> (constructor)";
                  if ("<clinit>".equals(name)) name = "<clinit> (static init)";

                  int pi = protoIdsOff + protoIdx * 12;
                  int returnTypeIdx = rd32(d, pi + 4);
                  int paramsOff     = rd32(d, pi + 8);

                  String returnType = prettyType(getTypeDesc(d, typeIdsOff, strIdsOff, returnTypeIdx));

                  StringBuilder sb = new StringBuilder();
                  sb.append(returnType).append(" ").append(name).append("(");
                  if (paramsOff != 0 && paramsOff + 4 <= d.length) {
                      int count = rd32(d, paramsOff);
                      for (int j = 0; j < count; j++) {
                          int off = paramsOff + 4 + j * 2;
                          if (off + 2 > d.length) break;
                          int typeIdx = rd16(d, off);
                          if (j > 0) sb.append(", ");
                          sb.append(prettyType(getTypeDesc(d, typeIdsOff, strIdsOff, typeIdx)));
                      }
                  }
                  sb.append(")");
                  return sb.toString();
              }

              static native void nativeInit(android.view.Surface s);
              static native void nativeResize(int w, int h);
              static native void nativeRender();
              static native boolean nativeTouch(int action, float x, float y);
              static native void nativeSetClassList(String[] classNames);
              static native boolean nativeWantKeyboard();
              static native void nativeAddInputChar(int codepoint);
              static native void nativeAddKeyEvent(int keycode, boolean down);
              static native void nativeSetClassDetails(int sectionId, String className, String[] fields, String[] methods);
          }
          JAVA_EOF

      - name: Write OverlaySurfaceView.java
        run: |
          cat > app/src/main/java/com/menu/imgui/OverlaySurfaceView.java << 'JAVA_EOF'
          package com.menu.imgui;

          import android.content.Context;
          import android.graphics.PixelFormat;
          import android.opengl.GLSurfaceView;
          import android.text.InputType;
          import android.view.KeyEvent;
          import android.view.Surface;
          import android.view.inputmethod.BaseInputConnection;
          import android.view.inputmethod.EditorInfo;
          import android.view.inputmethod.InputConnection;
          import android.view.inputmethod.InputMethodManager;

          import javax.microedition.khronos.egl.EGLConfig;
          import javax.microedition.khronos.opengles.GL10;

          public class OverlaySurfaceView extends GLSurfaceView {
              private volatile boolean ready = false;
              private volatile boolean keyboardShown = false;
              private volatile long lastActionMs = 0;
              private final InputMethodManager imm;

              public OverlaySurfaceView(Context ctx) {
                  super(ctx);
                  imm = (InputMethodManager) ctx.getSystemService(Context.INPUT_METHOD_SERVICE);
                  setEGLContextClientVersion(3);
                  setEGLConfigChooser(8, 8, 8, 8, 16, 0);
                  setZOrderOnTop(true);
                  getHolder().setFormat(PixelFormat.TRANSLUCENT);
                  setFocusable(true);
                  setFocusableInTouchMode(true);
                  setClickable(true);
                  setRenderer(new MyRenderer());
                  setRenderMode(RENDERMODE_CONTINUOUSLY);
              }

              public boolean isReady() { return ready; }

              private void showKeyboard() {
                  try { requestFocus(); imm.showSoftInput(this, InputMethodManager.SHOW_IMPLICIT); }
                  catch (Throwable ignored) { }
              }
              private void hideKeyboard() {
                  try { imm.hideSoftInputFromWindow(getWindowToken(), 0); }
                  catch (Throwable ignored) { }
              }

              private class MyRenderer implements GLSurfaceView.Renderer {
                  @Override public void onSurfaceCreated(GL10 gl, EGLConfig config) {
                      Surface s = getHolder().getSurface();
                      if (s != null) { Helper.nativeInit(s); ready = true; }
                  }
                  @Override public void onSurfaceChanged(GL10 gl, int w, int h) { Helper.nativeResize(w, h); }
                  @Override public void onDrawFrame(GL10 gl) {
                      if (!ready) return;
                      Helper.nativeRender();
                      final boolean want = Helper.nativeWantKeyboard();
                      long now = System.currentTimeMillis();
                      if (want && !keyboardShown) {
                          keyboardShown = true; lastActionMs = now;
                          post(() -> showKeyboard());
                      } else if (!want && keyboardShown) {
                          keyboardShown = false; lastActionMs = now;
                          post(() -> hideKeyboard());
                      } else if (want && keyboardShown && !imm.isAcceptingText() && now - lastActionMs > 400) {
                          lastActionMs = now;
                          post(() -> showKeyboard());
                      }
                  }
              }

              @Override public boolean onCheckIsTextEditor() { return true; }

              @Override public InputConnection onCreateInputConnection(EditorInfo outAttrs) {
                  outAttrs.inputType = InputType.TYPE_CLASS_TEXT
                          | InputType.TYPE_TEXT_VARIATION_VISIBLE_PASSWORD
                          | InputType.TYPE_TEXT_FLAG_NO_SUGGESTIONS;
                  outAttrs.imeOptions = EditorInfo.IME_ACTION_DONE
                          | EditorInfo.IME_FLAG_NO_FULLSCREEN
                          | EditorInfo.IME_FLAG_NO_EXTRACT_UI;
                  return new BaseInputConnection(this, false) {
                      @Override public boolean commitText(CharSequence text, int pos) {
                          if (text != null) for (int i = 0; i < text.length(); i++)
                              Helper.nativeAddInputChar(text.charAt(i));
                          return true;
                      }
                      @Override public boolean setComposingText(CharSequence text, int pos) { return commitText(text, pos); }
                      @Override public boolean deleteSurroundingText(int before, int after) {
                          for (int i = 0; i < before; i++) {
                              Helper.nativeAddKeyEvent(67, true);
                              Helper.nativeAddKeyEvent(67, false);
                          }
                          return true;
                      }
                      @Override public boolean sendKeyEvent(KeyEvent ev) {
                          if (ev.getKeyCode() == KeyEvent.KEYCODE_DEL) {
                              if (ev.getAction() == KeyEvent.ACTION_DOWN) {
                                  Helper.nativeAddKeyEvent(67, true);
                                  Helper.nativeAddKeyEvent(67, false);
                              }
                              return true;
                          }
                          if (ev.getKeyCode() == KeyEvent.KEYCODE_ENTER) {
                              if (ev.getAction() == KeyEvent.ACTION_DOWN) Helper.nativeAddInputChar('\n');
                              return true;
                          }
                          return super.sendKeyEvent(ev);
                      }
                  };
              }
          }
          JAVA_EOF

      - name: Write native-lib.cpp
        run: |
          cat > app/src/main/cpp/tool/native-lib.cpp << 'CPP_EOF'
          #include <jni.h>
          #include <android/log.h>
          #include <android/native_window_jni.h>
          #include "imgui.h"
          #include "imgui_impl_android.h"
          #include "imgui_impl_opengl3.h"
          #include <GLES3/gl3.h>
          #include "dex_data.h"

          #include <pthread.h>
          #include <unistd.h>
          #include <signal.h>
          #include <fcntl.h>
          #include <sys/stat.h>
          #include <cstring>
          #include <cstdio>
          #include <cmath>
          #include <string>
          #include <vector>
          #include <mutex>
          #include <algorithm>
          #include <unwind.h>

          #ifndef MY_PI
          #define MY_PI 3.14159265358979323846f
          #endif

          #define LOG_TAG "ImGuiTool"
          #define LOGI(...) __android_log_print(ANDROID_LOG_INFO, LOG_TAG, __VA_ARGS__)

          static JavaVM* gVM = nullptr;
          static jclass gHelperClass = nullptr;
          static ANativeWindow* gWindow = nullptr;
          static bool gInitialized = false;
          static int gWidth = 0, gHeight = 0;
          static int g_log_fd = -1;

          static std::vector<std::string> gClassList;
          static std::mutex gClassListMutex;

          // ---------- Sections ----------
          struct Section {
              int id = 0;
              char filter[128] = {0};
              bool detached = false;
              float detX = 100, detY = 100, detW = 550, detH = 550;
              bool showDetails = false;
              std::string selectedClass;
              std::vector<std::string> fields;
              std::vector<std::string> methods;
              bool loading = false;
          };

          static std::vector<Section> gSections;
          static int gNextSectionId = 1;
          static std::vector<int> gPendingCloseSections;
          static bool gRequestAddSection = false;

          struct PendingRequest { int sectionId; std::string className; };
          static std::vector<PendingRequest> gPendingRequests;
          static std::mutex gPendingMutex;

          static float g_settingFontScale = 1.00f;
          static float g_settingDragSpeed = 0.55f;
          static float g_settingScrollSpeed = 1.40f;

          static bool g_menuVisible = true;
          static float g_fabSize = 58.0f;
          static float g_fabX = -1.0f, g_fabY = -1.0f;
          static bool g_fabDown = false, g_fabMoved = false;
          static float g_fabDownAtX = 0, g_fabDownAtY = 0;
          static float g_fabDragStartX = 0, g_fabDragStartY = 0;

          static float g_winX = 0, g_winY = 0, g_winW = 0, g_winH = 0, g_titleH = 30.0f;
          static float g_virtX = 0, g_virtY = 0;
          static float g_realPrevX = 0, g_realPrevY = 0;
          static bool g_firstFrame = false;

          // ---------- Logging ----------
          static void get_pkg_name(char* out, size_t outsz) {
              out[0] = 0;
              FILE* f = fopen("/proc/self/cmdline", "r");
              if (!f) return;
              char buf[256] = {0};
              size_t n = fread(buf, 1, sizeof(buf) - 1, f);
              fclose(f);
              if (n == 0) return;
              for (size_t i = 0; i < n; i++) if (buf[i] == 0 || buf[i] == ':') { buf[i] = 0; break; }
              strncpy(out, buf, outsz - 1); out[outsz - 1] = 0;
          }
          static int try_open(const char* path) { return open(path, O_WRONLY | O_CREAT | O_APPEND | O_SYNC, 0666); }
          static void init_log() {
              int fd = try_open("/sdcard/Download/ImGuiMenu_crash.log");
              if (fd >= 0) { g_log_fd = fd; return; }
              char pkg[256]; get_pkg_name(pkg, sizeof(pkg));
              if (pkg[0]) {
                  char p1[512], p2[512];
                  snprintf(p1, sizeof(p1), "/sdcard/Android/data/%s", pkg); mkdir(p1, 0770);
                  snprintf(p2, sizeof(p2), "/sdcard/Android/data/%s/crash.log", pkg);
                  fd = try_open(p2); if (fd >= 0) { g_log_fd = fd; return; }
              }
          }
          static void log_step(const char* msg) {
              if (g_log_fd >= 0) { write(g_log_fd, "[N] ", 4); write(g_log_fd, msg, strlen(msg)); write(g_log_fd, "\n", 1); fsync(g_log_fd); }
          }

          // ---------- Crash handler ----------
          struct BtState { void** cur; void** end; };
          static _Unwind_Reason_Code bt_cb(struct _Unwind_Context* ctx, void* arg) {
              BtState* s = (BtState*)arg;
              uintptr_t pc = _Unwind_GetIP(ctx);
              if (pc) { if (s->cur == s->end) return _URC_END_OF_STACK; *(s->cur++) = (void*)pc; }
              return _URC_NO_REASON;
          }
          static size_t capture_bt(void** b, size_t max) { BtState s = {b, b+max}; _Unwind_Backtrace(bt_cb, &s); return s.cur - b; }
          static char g_alt[16384];
          static void crash_handler(int sig, siginfo_t*, void*) {
              if (g_log_fd >= 0) {
                  write(g_log_fd, "\n=== NATIVE CRASH ===\n", 22);
                  void* bt[32]; size_t n = capture_bt(bt, 32);
                  for (size_t i = 0; i < n; i++) {
                      uintptr_t a = (uintptr_t)bt[i]; char hx[20]; hx[0]='0'; hx[1]='x';
                      const char* H = "0123456789abcdef";
                      for (int j = 0; j < 16; j++) hx[2+j] = H[(a>>((15-j)*4))&0xF];
                      hx[18] = '\n'; write(g_log_fd, hx, 19);
                  }
                  write(g_log_fd, "=== END ===\n", 12); fsync(g_log_fd);
              }
              signal(sig, SIG_DFL); raise(sig);
          }
          static void install_crash_handlers() {
              stack_t ss; ss.ss_sp = g_alt; ss.ss_size = sizeof(g_alt); ss.ss_flags = 0;
              sigaltstack(&ss, nullptr);
              struct sigaction sa; memset(&sa, 0, sizeof(sa));
              sa.sa_sigaction = crash_handler;
              sa.sa_flags = SA_SIGINFO | SA_ONSTACK | SA_RESETHAND;
              sigemptyset(&sa.sa_mask);
              sigaction(SIGSEGV, &sa, nullptr); sigaction(SIGABRT, &sa, nullptr);
              sigaction(SIGFPE, &sa, nullptr);  sigaction(SIGILL, &sa, nullptr);
              sigaction(SIGBUS, &sa, nullptr);  sigaction(SIGTRAP, &sa, nullptr);
          }

          // ---------- Sigil ----------
          static void drawSigil(ImDrawList* dl, ImVec2 c, float r) {
              const ImU32 gold = IM_COL32(255, 200, 87, 255);
              const ImU32 cyan = IM_COL32(77, 208, 225, 220);
              const ImU32 dark = IM_COL32(10, 12, 16, 255);
              const ImU32 red = IM_COL32(255, 80, 80, 210);
              for (int i = 5; i >= 1; i--) dl->AddCircle(c, r + i * 1.5f, IM_COL32(255, 200, 87, 10), 32, 1.0f);
              ImVec2 top(c.x, c.y - r), right(c.x + r, c.y), bot(c.x, c.y + r), left(c.x - r, c.y);
              dl->AddQuad(top, right, bot, left, gold, 2.0f);
              float r2 = r * 0.75f;
              ImVec2 hex[6];
              for (int i = 0; i < 6; i++) {
                  float a = MY_PI * 2.0f * i / 6.0f + MY_PI * 0.5f;
                  hex[i] = ImVec2(c.x + cosf(a) * r2, c.y + sinf(a) * r2);
              }
              for (int i = 0; i < 6; i++) dl->AddLine(hex[i], hex[(i + 1) % 6], cyan, 1.3f);
              float eyeW = r * 0.45f, eyeH = r * 0.22f;
              ImVec2 pts[13];
              for (int i = 0; i <= 12; i++) {
                  float t = (float)i / 12.0f, a = MY_PI * t;
                  pts[i] = ImVec2(c.x - eyeW * cosf(a), c.y - eyeH * sinf(a));
              }
              dl->AddPolyline(pts, 13, gold, 0, 1.8f);
              for (int i = 0; i <= 12; i++) {
                  float t = (float)i / 12.0f, a = MY_PI * t;
                  pts[i] = ImVec2(c.x - eyeW * cosf(a), c.y + eyeH * sinf(a));
              }
              dl->AddPolyline(pts, 13, gold, 0, 1.8f);
              dl->AddCircleFilled(c, eyeH * 0.85f, cyan, 24);
              dl->AddCircleFilled(c, eyeH * 0.42f, dark, 16);
              dl->AddCircleFilled(ImVec2(c.x - eyeH * 0.25f, c.y - eyeH * 0.25f), eyeH * 0.13f, IM_COL32(255, 255, 255, 210), 8);
              float rr = r * 0.085f;
              ImVec2 rune[4] = {
                  ImVec2(c.x, c.y - r * 0.85f), ImVec2(c.x + r * 0.85f, c.y),
                  ImVec2(c.x, c.y + r * 0.85f), ImVec2(c.x - r * 0.85f, c.y)
              };
              for (auto& p : rune) {
                  ImVec2 a(p.x, p.y - rr), b(p.x + rr, p.y), d(p.x, p.y + rr), e(p.x - rr, p.y);
                  dl->AddQuadFilled(a, b, d, e, red);
              }
          }

          // ---------- Sections ----------
          static Section* findSection(int id) {
              for (auto& s : gSections) if (s.id == id) return &s;
              return nullptr;
          }
          static void addSectionImpl() {
              Section s;
              s.id = gNextSectionId++;
              s.detached = false;
              s.detX = 100; s.detY = 100; s.detW = 550; s.detH = 550;
              gSections.push_back(std::move(s));
          }
          static void closeSectionImpl(int id) {
              gSections.erase(std::remove_if(gSections.begin(), gSections.end(),
                              [id](const Section& s) { return s.id == id; }), gSections.end());
          }

          // ---------- DEX load ----------
          static bool loadDex(JNIEnv* env) {
              jclass clCls = env->FindClass("java/lang/ClassLoader");
              if (!clCls) return false;
              jmethodID getSys = env->GetStaticMethodID(clCls, "getSystemClassLoader", "()Ljava/lang/ClassLoader;");
              jobject parent = env->CallStaticObjectMethod(clCls, getSys);
              jclass imCls = env->FindClass("dalvik/system/InMemoryDexClassLoader");
              if (!imCls) return false;
              jmethodID ctor = env->GetMethodID(imCls, "<init>", "(Ljava/nio/ByteBuffer;Ljava/lang/ClassLoader;)V");
              jobject buf = env->NewDirectByteBuffer((void*)imgui_dex, imgui_dex_len);
              jobject loader = env->NewObject(imCls, ctor, buf, parent);
              if (env->ExceptionCheck()) { env->ExceptionClear(); return false; }
              if (!loader) return false;
              jclass lCls = env->GetObjectClass(loader);
              jmethodID loadM = env->GetMethodID(lCls, "loadClass", "(Ljava/lang/String;)Ljava/lang/Class;");
              jstring name = env->NewStringUTF("com.menu.imgui.Helper");
              jclass hCls = (jclass)env->CallObjectMethod(loader, loadM, name);
              if (env->ExceptionCheck()) { env->ExceptionClear(); return false; }
              if (!hCls) return false;
              gHelperClass = (jclass)env->NewGlobalRef(hCls);
              return true;
          }

          static jobject getCurrentActivity(JNIEnv* env) {
              jclass atCls = env->FindClass("android/app/ActivityThread");
              if (!atCls) { env->ExceptionClear(); return nullptr; }
              jmethodID cur = env->GetStaticMethodID(atCls, "currentActivityThread", "()Landroid/app/ActivityThread;");
              if (env->ExceptionCheck() || !cur) { env->ExceptionClear(); return nullptr; }
              jobject at = env->CallStaticObjectMethod(atCls, cur);
              if (env->ExceptionCheck() || !at) { env->ExceptionClear(); return nullptr; }
              jfieldID f = env->GetFieldID(atCls, "mActivities", "Landroid/util/ArrayMap;");
              if (env->ExceptionCheck() || !f) { env->ExceptionClear(); return nullptr; }
              jobject acts = env->GetObjectField(at, f);
              jclass amCls = env->FindClass("android/util/ArrayMap");
              jmethodID sizeM = env->GetMethodID(amCls, "size", "()I");
              jmethodID valAt = env->GetMethodID(amCls, "valueAt", "(I)Ljava/lang/Object;");
              jint n = env->CallIntMethod(acts, sizeM);
              for (jint i = 0; i < n; i++) {
                  jobject rec = env->CallObjectMethod(acts, valAt, i);
                  if (!rec) continue;
                  jclass rCls = env->GetObjectClass(rec);
                  jfieldID actF = env->GetFieldID(rCls, "activity", "Landroid/app/Activity;");
                  if (!actF) { env->ExceptionClear(); continue; }
                  jobject a = env->GetObjectField(rec, actF);
                  if (a) return a;
              }
              return nullptr;
          }

          static void* pollThread(void*) {
              JNIEnv* env = nullptr;
              if (gVM->AttachCurrentThread(&env, nullptr) != JNI_OK || !env) return nullptr;
              jobject activity = nullptr;
              for (int i = 0; i < 200; i++) {
                  activity = getCurrentActivity(env);
                  if (activity) break;
                  usleep(100000);
              }
              if (!activity || !gHelperClass) { gVM->DetachCurrentThread(); return nullptr; }
              jmethodID attach = env->GetStaticMethodID(gHelperClass, "attach", "(Landroid/content/Context;)V");
              if (attach) env->CallStaticVoidMethod(gHelperClass, attach, activity);
              if (env->ExceptionCheck()) env->ExceptionClear();
              gVM->DetachCurrentThread();
              return nullptr;
          }

