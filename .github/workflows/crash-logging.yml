name: Add Crash Logging

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Write Helper.java (with Java crash handler + logging)
        run: |
          mkdir -p app/src/main/java/com/menu/imgui
          cat > app/src/main/java/com/menu/imgui/Helper.java << 'EOF'
          package com.menu.imgui;

          import android.app.Activity;
          import android.content.Context;
          import android.graphics.PixelFormat;
          import android.opengl.GLSurfaceView;
          import android.util.Log;
          import android.view.MotionEvent;
          import android.view.Surface;
          import android.view.ViewGroup;

          import java.io.ByteArrayOutputStream;
          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileWriter;
          import java.io.IOException;
          import java.io.InputStream;
          import java.io.PrintWriter;
          import java.text.SimpleDateFormat;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.Date;
          import java.util.List;
          import java.util.Locale;
          import java.util.zip.ZipEntry;
          import java.util.zip.ZipFile;

          import javax.microedition.khronos.egl.EGLConfig;
          import javax.microedition.khronos.opengles.GL10;

          public class Helper {
              private static final String TAG = "ImGuiTool";
              private static GLSurfaceView overlay;
              private static volatile boolean ready = false;

              static {
                  try {
                      Thread.setDefaultUncaughtExceptionHandler((t, e) -> {
                          try {
                              File f = new File(getLogDir(), "crash.log");
                              FileWriter w = new FileWriter(f, true);
                              PrintWriter pw = new PrintWriter(w);
                              pw.println("\n=== JAVA CRASH " + now() + " ===");
                              pw.println("Thread: " + t.getName());
                              e.printStackTrace(pw);
                              pw.println("=== END ===");
                              pw.close();
                          } catch (Throwable ignored) { }
                      });
                  } catch (Throwable ignored) { }
              }

              private static String now() {
                  return new SimpleDateFormat("yyyy-MM-dd HH:mm:ss", Locale.US).format(new Date());
              }

              private static String getPkgName() {
                  try (FileInputStream fis = new FileInputStream("/proc/self/cmdline")) {
                      byte[] buf = new byte[256];
                      int n = fis.read(buf);
                      if (n > 0) {
                          int end = 0;
                          while (end < n && buf[end] != 0) end++;
                          String pkg = new String(buf, 0, end, "UTF-8");
                          int colon = pkg.indexOf(':');
                          return colon > 0 ? pkg.substring(0, colon) : pkg;
                      }
                  } catch (Throwable ignored) { }
                  return "unknown";
              }

              private static String getLogDir() {
                  // Primary: Downloads (needs WRITE_EXTERNAL_STORAGE)
                  File downloads = new File("/sdcard/Download");
                  if (downloads.exists() && downloads.canWrite()) {
                      File test = new File(downloads, ".wtest");
                      try {
                          test.createNewFile();
                          test.delete();
                          return downloads.getAbsolutePath();
                      } catch (Throwable ignored) { }
                  }
                  // Fallback: app's external data dir (no permission)
                  File ext = new File("/sdcard/Android/data/" + getPkgName());
                  if (ext.exists()) return ext.getAbsolutePath();
                  try { ext.mkdirs(); } catch (Throwable ignored) { }
                  if (ext.exists() && ext.canWrite()) return ext.getAbsolutePath();
                  // Last resort
                  return "/data/data/" + getPkgName();
              }

              private static void log(String msg) {
                  Log.i(TAG, msg);
                  try {
                      File f = new File(getLogDir(), "crash.log");
                      FileWriter w = new FileWriter(f, true);
                      w.write("[J " + now() + "] " + msg + "\n");
                      w.close();
                  } catch (Throwable ignored) { }
              }

              public static void attach(Context ctx) {
                  log("Helper.attach entered, ctx=" + (ctx != null ? ctx.getClass().getSimpleName() : "null"));
                  if (!(ctx instanceof Activity)) {
                      log("Helper.attach: ctx is not Activity, abort");
                      return;
                  }
                  final Activity activity = (Activity) ctx;
                  try {
                      activity.runOnUiThread(() -> attachOnUi(activity));
                  } catch (Throwable t) {
                      log("Helper.attach: runOnUiThread failed: " + t);
                  }
              }

              private static void attachOnUi(Activity activity) {
                  log("attachOnUi entered");
                  if (overlay != null) {
                      log("attachOnUi: overlay already set, abort");
                      return;
                  }
                  try {
                      log("attachOnUi: creating GLSurfaceView");
                      overlay = new GLSurfaceView(activity);
                      log("attachOnUi: setting EGL context 3");
                      overlay.setEGLContextClientVersion(3);
                      overlay.setEGLConfigChooser(8, 8, 8, 8, 16, 0);
                      overlay.setZOrderOnTop(true);
                      overlay.getHolder().setFormat(PixelFormat.TRANSLUCENT);
                      log("attachOnUi: setting renderer");
                      overlay.setRenderer(new GLSurfaceView.Renderer() {
                          @Override public void onSurfaceCreated(GL10 gl, EGLConfig c) {
                              log("Renderer.onSurfaceCreated");
                              Surface s = overlay.getHolder().getSurface();
                              if (s != null) {
                                  log("Renderer: calling nativeInit");
                                  try { nativeInit(s); }
                                  catch (Throwable t) { log("nativeInit threw: " + t); }
                                  ready = true;
                                  log("Renderer: nativeInit returned OK");
                              } else {
                                  log("Renderer: Surface is null!");
                              }
                          }
                          @Override public void onSurfaceChanged(GL10 gl, int w, int h) {
                              log("Renderer.onSurfaceChanged: " + w + "x" + h);
                              nativeResize(w, h);
                          }
                          @Override public void onDrawFrame(GL10 gl) {
                              if (ready) nativeRender();
                          }
                      });
                      overlay.setRenderMode(GLSurfaceView.RENDERMODE_CONTINUOUSLY);
                      log("attachOnUi: setting touch listener");
                      overlay.setOnTouchListener((v, e) -> {
                          if (!ready) return false;
                          int action;
                          switch (e.getActionMasked()) {
                              case MotionEvent.ACTION_DOWN:   action = 0; break;
                              case MotionEvent.ACTION_UP:     action = 1; break;
                              case MotionEvent.ACTION_MOVE:   action = 2; break;
                              case MotionEvent.ACTION_CANCEL: action = 3; break;
                              default: return false;
                          }
                          return nativeTouch(action, e.getX(), e.getY());
                      });
                      log("attachOnUi: adding to decor");
                      ViewGroup decor = (ViewGroup) activity.getWindow().getDecorView();
                      decor.addView(overlay, new ViewGroup.LayoutParams(
                              ViewGroup.LayoutParams.MATCH_PARENT,
                              ViewGroup.LayoutParams.MATCH_PARENT
                      ));
                      log("attachOnUi: overlay attached successfully");
                      new Thread(() -> {
                          try {
                              log("classLister: starting");
                              List<String> classes = listAllClasses(activity);
                              log("classLister: found " + classes.size() + " classes");
                              nativeSetClassList(classes.toArray(new String[0]));
                              log("classLister: sent to native");
                          } catch (Throwable t) {
                              log("classLister failed: " + t);
                          }
                      }, "ImGuiClassLister").start();
                  } catch (Throwable t) {
                      log("attachOnUi FAILED: " + t);
                  }
              }

              private static List<String> listAllClasses(Context ctx) {
                  List<String> out = new ArrayList<>();
                  String apkPath;
                  try { apkPath = ctx.getPackageCodePath(); }
                  catch (Throwable t) { log("getPackageCodePath failed: " + t); return out; }
                  log("listAllClasses: apk=" + apkPath);
                  try (ZipFile zip = new ZipFile(apkPath)) {
                      for (ZipEntry entry : Collections.list(zip.entries())) {
                          String n = entry.getName();
                          if (n.equals("classes.dex") || n.matches("classes\\d+\\.dex")) {
                              try (InputStream in = zip.getInputStream(entry)) {
                                  byte[] data = readAll(in);
                                  log("listAllClasses: parsing " + n + " (" + data.length + " bytes)");
                                  parseDex(data, out);
                              } catch (IOException ignored) { }
                          }
                      }
                  } catch (Throwable t) {
                      log("listAllClasses error: " + t);
                  }
                  Collections.sort(out);
                  return out;
              }

              private static byte[] readAll(InputStream in) throws IOException {
                  ByteArrayOutputStream o = new ByteArrayOutputStream();
                  byte[] b = new byte[8192]; int n;
                  while ((n = in.read(b)) > 0) o.write(b, 0, n);
                  return o.toByteArray();
              }

              private static int rd32(byte[] d, int off) {
                  return (d[off] & 0xFF) | ((d[off+1] & 0xFF) << 8) |
                         ((d[off+2] & 0xFF) << 16) | ((d[off+3] & 0xFF) << 24);
              }

              private static void parseDex(byte[] d, List<String> out) {
                  if (d.length < 0x70) return;
                  if (d[0] != 'd' || d[1] != 'e' || d[2] != 'x' || d[3] != '\n') {
                      log("parseDex: bad magic");
                      return;
                  }
                  int strIdsSize = rd32(d, 0x38);
                  int strIdsOff  = rd32(d, 0x3C);
                  int typeIdsSize= rd32(d, 0x40);
                  int typeIdsOff = rd32(d, 0x44);
                  int classDefSize=rd32(d, 0x60);
                  int classDefOff= rd32(d, 0x64);
                  if (classDefOff + classDefSize * 32 > d.length) {
                      log("parseDex: classDef out of bounds");
                      return;
                  }
                  for (int i = 0; i < classDefSize; i++) {
                      int cd = classDefOff + i * 32;
                      int classIdx = rd32(d, cd);
                      if (classIdx < 0 || classIdx >= typeIdsSize) continue;
                      int strIdx = rd32(d, typeIdsOff + classIdx * 4);
                      if (strIdx < 0 || strIdx >= strIdsSize) continue;
                      int strDataOff = rd32(d, strIdsOff + strIdx * 4);
                      if (strDataOff <= 0 || strDataOff >= d.length) continue;
                      int p = strDataOff;
                      while (p < d.length && (d[p] & 0x80) != 0) p++;
                      if (p < d.length) p++;
                      int start = p;
                      while (p < d.length && d[p] != 0) p++;
                      if (p <= start) continue;
                      String desc = new String(d, start, p - start, java.nio.charset.StandardCharsets.UTF_8);
                      if (desc.startsWith("L") && desc.endsWith(";"))
                          out.add(desc.substring(1, desc.length() - 1).replace('/', '.'));
                      else
                          out.add(desc);
                  }
              }

              private static native void nativeInit(Surface s);
              private static native void nativeResize(int w, int h);
              private static native void nativeRender();
              private static native boolean nativeTouch(int action, float x, float y);
              private static native void nativeSetClassList(String[] classNames);
          }
          EOF

      - name: Write native-lib.cpp (with signal handler + step logging)
        run: |
          cat > app/src/main/cpp/tool/native-lib.cpp << 'EOF'
          #include <jni.h>
          #include <android/log.h>
          #include <android/native_window_jni.h>
          #include "imgui.h"
          #include "imgui_impl_android.h"
          #include "imgui_impl_opengl3.h"
          #include <GLES3/gl3.h>
          #include "dex_data.h"

          #include <pthread.h>
          #include <unistd.h>
          #include <signal.h>
          #include <fcntl.h>
          #include <sys/stat.h>
          #include <cstring>
          #include <cstdio>
          #include <string>
          #include <vector>
          #include <mutex>
          #include <unwind.h>

          #define LOG_TAG "ImGuiTool"
          #define LOGI(...) __android_log_print(ANDROID_LOG_INFO,  LOG_TAG, __VA_ARGS__)
          #define LOGE(...) __android_log_print(ANDROID_LOG_ERROR, LOG_TAG, __VA_ARGS__)

          static JavaVM* gVM = nullptr;
          static jclass gHelperClass = nullptr;
          static ANativeWindow* gWindow = nullptr;
          static bool gInitialized = false;
          static int gWidth = 0, gHeight = 0;
          static int g_log_fd = -1;

          static std::vector<std::string> gClassList;
          static std::mutex gClassListMutex;
          static char gFilter[128] = {0};

          // ---------- Logging ----------
          static void get_pkg_name(char* out, size_t outsz) {
              out[0] = 0;
              FILE* f = fopen("/proc/self/cmdline", "r");
              if (!f) return;
              char buf[256] = {0};
              size_t n = fread(buf, 1, sizeof(buf) - 1, f);
              fclose(f);
              if (n == 0) return;
              for (size_t i = 0; i < n; i++) {
                  if (buf[i] == 0 || buf[i] == ':') { buf[i] = 0; break; }
              }
              strncpy(out, buf, outsz - 1);
              out[outsz - 1] = 0;
          }

          static int try_open(const char* path) {
              return open(path, O_WRONLY | O_CREAT | O_APPEND | O_SYNC, 0666);
          }

          static void init_log() {
              char pkg[256]; get_pkg_name(pkg, sizeof(pkg));
              LOGI("Package: %s", pkg);

              const char* candidates[] = {
                  "/sdcard/Download/ImGuiMenu_crash.log",
                  "/storage/emulated/0/Download/ImGuiMenu_crash.log",
              };
              for (auto p : candidates) {
                  int fd = try_open(p);
                  if (fd >= 0) {
                      g_log_fd = fd;
                      LOGI("Log file: %s", p);
                      return;
                  }
              }

              // Fallback: /sdcard/Android/data/<pkg>/crash.log
              if (pkg[0]) {
                  char p2[512];
                  snprintf(p2, sizeof(p2), "/sdcard/Android/data/%s", pkg);
                  mkdir(p2, 0770);
                  char p3[512];
                  snprintf(p3, sizeof(p3), "/sdcard/Android/data/%s/crash.log", pkg);
                  int fd = try_open(p3);
                  if (fd >= 0) { g_log_fd = fd; LOGI("Log file: %s", p3); return; }

                  // Last resort: /data/data/<pkg>/files/
                  char p4[512];
                  snprintf(p4, sizeof(p4), "/data/data/%s", pkg);
                  mkdir(p4, 0770);
                  char p5[512];
                  snprintf(p5, sizeof(p5), "/data/data/%s/files", pkg);
                  mkdir(p5, 0770);
                  char p6[512];
                  snprintf(p6, sizeof(p6), "/data/data/%s/files/crash.log", pkg);
                  fd = try_open(p6);
                  if (fd >= 0) { g_log_fd = fd; LOGI("Log file: %s", p6); return; }
              }
              LOGE("Could not open any log file");
          }

          static void log_step(const char* msg) {
              if (g_log_fd >= 0) {
                  write(g_log_fd, "[N] ", 4);
                  write(g_log_fd, msg, strlen(msg));
                  write(g_log_fd, "\n", 1);
                  fsync(g_log_fd);
              }
              __android_log_write(ANDROID_LOG_INFO, LOG_TAG, msg);
          }

          // ---------- Backtrace (for signal handler) ----------
          struct BtState { void** cur; void** end; };
          static _Unwind_Reason_Code bt_cb(struct _Unwind_Context* ctx, void* arg) {
              BtState* s = (BtState*)arg;
              uintptr_t pc = _Unwind_GetIP(ctx);
              if (pc) {
                  if (s->cur == s->end) return _URC_END_OF_STACK;
                  *(s->cur++) = (void*)pc;
              }
              return _URC_NO_REASON;
          }
          static size_t capture_bt(void** buf, size_t max) {
              BtState s = { buf, buf + max };
              _Unwind_Backtrace(bt_cb, &s);
              return s.cur - buf;
          }

          // ---------- Crash handler ----------
          static char g_alt_stack[16384];

          static void crash_handler(int sig, siginfo_t* si, void*) {
              if (g_log_fd >= 0) {
                  write(g_log_fd, "\n=== NATIVE CRASH ===\nSignal: ", 32);
                  const char* name = "OTHER";
                  switch (sig) {
                      case SIGSEGV: name = "SIGSEGV"; break;
                      case SIGABRT: name = "SIGABRT"; break;
                      case SIGFPE:  name = "SIGFPE";  break;
                      case SIGILL:  name = "SIGILL";  break;
                      case SIGBUS:  name = "SIGBUS";  break;
                      case SIGTRAP: name = "SIGTRAP"; break;
                  }
                  write(g_log_fd, name, strlen(name));
                  write(g_log_fd, "\n", 1);
                  void* bt[32];
                  size_t n = capture_bt(bt, 32);
                  write(g_log_fd, "Backtrace:\n", 11);
                  for (size_t i = 0; i < n; i++) {
                      uintptr_t addr = (uintptr_t)bt[i];
                      char hx[20];
                      hx[0] = '0'; hx[1] = 'x';
                      const char* H = "0123456789abcdef";
                      for (int j = 0; j < 16; j++) hx[2+j] = H[(addr >> ((15-j)*4)) & 0xF];
                      hx[18] = '\n';
                      write(g_log_fd, hx, 19);
                  }
                  write(g_log_fd, "=== END ===\n", 12);
                  fsync(g_log_fd);
              }
              signal(sig, SIG_DFL);
              raise(sig);
          }

          static void install_crash_handlers() {
              stack_t ss;
              ss.ss_sp = g_alt_stack;
              ss.ss_size = sizeof(g_alt_stack);
              ss.ss_flags = 0;
              sigaltstack(&ss, nullptr);

              struct sigaction sa;
              memset(&sa, 0, sizeof(sa));
              sa.sa_sigaction = crash_handler;
              sa.sa_flags = SA_SIGINFO | SA_ONSTACK | SA_RESETHAND;
              sigemptyset(&sa.sa_mask);
              sigaction(SIGSEGV, &sa, nullptr);
              sigaction(SIGABRT, &sa, nullptr);
              sigaction(SIGFPE,  &sa, nullptr);
              sigaction(SIGILL,  &sa, nullptr);
              sigaction(SIGBUS,  &sa, nullptr);
              sigaction(SIGTRAP, &sa, nullptr);
          }

          // ---------- DEX loading ----------
          static bool loadDex(JNIEnv* env) {
              log_step("loadDex: start");
              jclass clCls = env->FindClass("java/lang/ClassLoader");
              if (!clCls) { log_step("loadDex: ClassLoader not found"); return false; }
              jmethodID getSys = env->GetStaticMethodID(clCls, "getSystemClassLoader", "()Ljava/lang/ClassLoader;");
              if (!getSys) { log_step("loadDex: getSystemClassLoader missing"); return false; }
              jobject parent = env->CallStaticObjectMethod(clCls, getSys);
              if (!parent) { log_step("loadDex: parent null"); return false; }

              jclass imCls = env->FindClass("dalvik/system/InMemoryDexClassLoader");
              if (!imCls) { log_step("loadDex: InMemoryDexClassLoader missing"); return false; }
              jmethodID ctor = env->GetMethodID(imCls, "<init>", "(Ljava/nio/ByteBuffer;Ljava/lang/ClassLoader;)V");
              if (!ctor) { log_step("loadDex: ctor missing"); return false; }

              jobject buf = env->NewDirectByteBuffer((void*)imgui_dex, imgui_dex_len);
              if (!buf) { log_step("loadDex: NewDirectByteBuffer failed"); return false; }

              jobject loader = env->NewObject(imCls, ctor, buf, parent);
              if (env->ExceptionCheck()) {
                  env->ExceptionDescribe(); env->ExceptionClear();
                  log_step("loadDex: NewObject threw exception");
                  return false;
              }
              if (!loader) { log_step("loadDex: loader null"); return false; }

              jclass lCls = env->GetObjectClass(loader);
              jmethodID loadM = env->GetMethodID(lCls, "loadClass", "(Ljava/lang/String;)Ljava/lang/Class;");
              if (!loadM) { log_step("loadDex: loadClass missing"); return false; }

              jstring name = env->NewStringUTF("com.menu.imgui.Helper");
              jclass hCls = (jclass)env->CallObjectMethod(loader, loadM, name);
              if (env->ExceptionCheck()) {
                  env->ExceptionDescribe(); env->ExceptionClear();
                  log_step("loadDex: Helper class load threw exception");
                  return false;
              }
              if (!hCls) { log_step("loadDex: Helper class null"); return false; }

              gHelperClass = (jclass)env->NewGlobalRef(hCls);
              log_step("loadDex: success, Helper class acquired");
              return true;
          }

          // ---------- Activity discovery ----------
          static jobject getCurrentActivity(JNIEnv* env) {
              jclass atCls = env->FindClass("android/app/ActivityThread");
              if (!atCls) { env->ExceptionClear(); return nullptr; }
              jmethodID cur = env->GetStaticMethodID(atCls, "currentActivityThread", "()Landroid/app/ActivityThread;");
              if (env->ExceptionCheck()) { env->ExceptionClear(); return nullptr; }
              if (!cur) return nullptr;
              jobject at = env->CallStaticObjectMethod(atCls, cur);
              if (env->ExceptionCheck()) { env->ExceptionClear(); return nullptr; }
              if (!at) return nullptr;
              jfieldID f = env->GetFieldID(atCls, "mActivities", "Landroid/util/ArrayMap;");
              if (env->ExceptionCheck()) { env->ExceptionClear(); return nullptr; }
              if (!f) return nullptr;
              jobject acts = env->GetObjectField(at, f);
              if (!acts) return nullptr;
              jclass amCls = env->FindClass("android/util/ArrayMap");
              if (!amCls) { env->ExceptionClear(); return nullptr; }
              jmethodID sizeM = env->GetMethodID(amCls, "size", "()I");
              jmethodID valAt = env->GetMethodID(amCls, "valueAt", "(I)Ljava/lang/Object;");
              if (env->ExceptionCheck()) { env->ExceptionClear(); return nullptr; }
              if (!sizeM || !valAt) return nullptr;
              jint n = env->CallIntMethod(acts, sizeM);
              if (env->ExceptionCheck()) { env->ExceptionClear(); return nullptr; }
              for (jint i = 0; i < n; i++) {
                  jobject rec = env->CallObjectMethod(acts, valAt, i);
                  if (!rec) continue;
                  jclass rCls = env->GetObjectClass(rec);
                  jfieldID actF = env->GetFieldID(rCls, "activity", "Landroid/app/Activity;");
                  if (!actF) { env->ExceptionClear(); continue; }
                  jobject a = env->GetObjectField(rec, actF);
                  if (a) return a;
              }
              return nullptr;
          }

          static void* pollThread(void*) {
              log_step("pollThread: started");
              JNIEnv* env = nullptr;
              jint r = gVM->AttachCurrentThread(&env, nullptr);
              if (r != JNI_OK || !env) {
                  log_step("pollThread: AttachCurrentThread failed");
                  return nullptr;
              }
              log_step("pollThread: attached");
              jobject activity = nullptr;
              for (int i = 0; i < 200; i++) {
                  activity = getCurrentActivity(env);
                  if (activity) {
                      log_step("pollThread: activity found");
                      break;
                  }
                  usleep(100000);
              }
              if (!activity) {
                  log_step("pollThread: activity NOT found after 20s");
                  gVM->DetachCurrentThread();
                  return nullptr;
              }
              if (!gHelperClass) {
                  log_step("pollThread: gHelperClass null");
                  gVM->DetachCurrentThread();
                  return nullptr;
              }
              jmethodID attach = env->GetStaticMethodID(gHelperClass, "attach", "(Landroid/content/Context;)V");
              if (env->ExceptionCheck()) { env->ExceptionDescribe(); env->ExceptionClear(); }
              if (!attach) {
                  log_step("pollThread: attach method missing");
                  gVM->DetachCurrentThread();
                  return nullptr;
              }
              log_step("pollThread: calling Helper.attach");
              env->CallStaticVoidMethod(gHelperClass, attach, activity);
              if (env->ExceptionCheck()) {
                  env->ExceptionDescribe(); env->ExceptionClear();
                  log_step("pollThread: Helper.attach threw");
              } else {
                  log_step("pollThread: Helper.attach returned OK");
              }
              gVM->DetachCurrentThread();
              return nullptr;
          }

          // ---------- ImGui ----------
          static void setupStyle() {
              ImGuiStyle& s = ImGui::GetStyle();
              s.WindowRounding=10; s.FrameRounding=6; s.GrabRounding=6;
              s.WindowBorderSize=0; s.WindowPadding=ImVec2(14,14); s.ItemSpacing=ImVec2(10,8);
              ImVec4* c = s.Colors;
              c[ImGuiCol_WindowBg]      = ImVec4(0.06f,0.08f,0.10f,0.96f);
              c[ImGuiCol_Border]        = ImVec4(1.00f,0.78f,0.34f,0.30f);
              c[ImGuiCol_TitleBg]       = ImVec4(0.06f,0.08f,0.10f,1.00f);
              c[ImGuiCol_TitleBgActive] = ImVec4(0.35f,0.27f,0.05f,1.00f);
              c[ImGuiCol_Text]          = ImVec4(0.92f,0.93f,0.94f,1.00f);
              c[ImGuiCol_FrameBg]       = ImVec4(0.14f,0.16f,0.19f,1.00f);
              c[ImGuiCol_Button]        = ImVec4(1.00f,0.78f,0.34f,0.55f);
              c[ImGuiCol_ButtonHovered] = ImVec4(1.00f,0.78f,0.34f,0.80f);
              c[ImGuiCol_ButtonActive]  = ImVec4(1.00f,0.78f,0.34f,1.00f);
              c[ImGuiCol_CheckMark]     = ImVec4(0.30f,0.82f,0.88f,1.00f);
              c[ImGuiCol_SliderGrab]    = ImVec4(0.30f,0.82f,0.88f,1.00f);
              c[ImGuiCol_Header]        = ImVec4(1.00f,0.78f,0.34f,0.30f);
              c[ImGuiCol_HeaderHovered] = ImVec4(1.00f,0.78f,0.34f,0.50f);
          }

          static bool g_firstFrame = false;

          static void doInit(JNIEnv* env, jclass, jobject surface) {
              log_step("doInit: entered");
              if (gInitialized) { log_step("doInit: already initialized"); return; }
              if (!surface) { log_step("doInit: surface null"); return; }
              gWindow = ANativeWindow_fromSurface(env, surface);
              if (!gWindow) { log_step("doInit: ANativeWindow_fromSurface failed"); return; }
              log_step("doInit: window acquired");
              IMGUI_CHECKVERSION();
              ImGui::CreateContext();
              ImGui::GetIO().IniFilename = nullptr;
              setupStyle();
              log_step("doInit: context + style ready");
              if (!ImGui_ImplAndroid_Init(gWindow)) { log_step("doInit: ImGui_ImplAndroid_Init failed"); return; }
              log_step("doInit: Android backend OK");
              if (!ImGui_ImplOpenGL3_Init("#version 300 es")) { log_step("doInit: OpenGL3 backend failed"); return; }
              log_step("doInit: OpenGL3 backend OK");
              gInitialized = true;
              log_step("doInit: complete");
          }

          static void doResize(JNIEnv*, jclass, jint w, jint h) {
              gWidth=w; gHeight=h;
              glViewport(0,0,w,h);
          }

          static void doRender(JNIEnv*, jclass) {
              if (!gInitialized) return;
              if (!g_firstFrame) { log_step("doRender: first frame"); g_firstFrame = true; }
              ImGui_ImplOpenGL3_NewFrame();
              ImGui_ImplAndroid_NewFrame();
              ImGui::NewFrame();
              ImGui::SetNextWindowPos(ImVec2(40,80), ImGuiCond_FirstUseEver);
              ImGui::SetNextWindowSize(ImVec2(720,560), ImGuiCond_FirstUseEver);
              ImGui::Begin("ImGui Tool");
              if (ImGui::BeginTabBar("##tabs")) {
                  if (ImGui::BeginTabItem("Main")) {
                      ImGui::TextColored(ImVec4(1,0.78f,0.34f,1), "Self-contained overlay");
                      ImGui::Separator();
                      static float s = 42.0f;
                      ImGui::SliderFloat("Value", &s, 0.0f, 100.0f, "%.1f");
                      static bool a=false,b=false;
                      ImGui::Checkbox("Option A", &a);
                      ImGui::Checkbox("Option B", &b);
                      if (ImGui::Button("Log")) LOGI("s=%.1f a=%d b=%d", s, (int)a, (int)b);
                      ImGui::EndTabItem();
                  }
                  if (ImGui::BeginTabItem("Classes")) {
                      size_t total;
                      { std::lock_guard<std::mutex> lk(gClassListMutex); total = gClassList.size(); }
                      ImGui::Text("Classes in APK: %zu", total);
                      ImGui::InputTextWithHint("##filter","Filter...",gFilter,sizeof(gFilter));
                      ImGui::Separator();
                      int shown = 0;
                      ImGui::BeginChild("##list", ImVec2(0,0), true);
                      {
                          std::lock_guard<std::mutex> lk(gClassListMutex);
                          for (const auto& n : gClassList) {
                              if (gFilter[0] && n.find(gFilter) == std::string::npos) continue;
                              ImGui::Selectable(n.c_str());
                              shown++;
                          }
                      }
                      ImGui::EndChild();
                      ImGui::Text("Showing %d / %zu", shown, total);
                      ImGui::EndTabItem();
                  }
                  ImGui::EndTabBar();
              }
              ImGui::End();
              ImGui::Render();
              glClearColor(0,0,0,0);
              glClear(GL_COLOR_BUFFER_BIT);
              ImGui_ImplOpenGL3_RenderDrawData(ImGui::GetDrawData());
          }

          static jboolean doTouch(JNIEnv*, jclass, jint action, jfloat x, jfloat y) {
              if (!gInitialized) return JNI_FALSE;
              ImGuiIO& io = ImGui::GetIO();
              io.AddMouseSourceEvent(ImGuiMouseSource_TouchScreen);
              io.AddMousePosEvent(x, y);
              if (action == 0) io.AddMouseButtonEvent(0, true);
              else if (action == 1 || action == 3) io.AddMouseButtonEvent(0, false);
              return io.WantCaptureMouse ? JNI_TRUE : JNI_FALSE;
          }

          static void doSetClassList(JNIEnv* env, jclass, jobjectArray arr) {
              std::lock_guard<std::mutex> lk(gClassListMutex);
              gClassList.clear();
              if (!arr) return;
              jsize n = env->GetArrayLength(arr);
              gClassList.reserve((size_t)n);
              for (jsize i = 0; i < n; i++) {
                  jstring js = (jstring)env->GetObjectArrayElement(arr, i);
                  const char* cs = env->GetStringUTFChars(js, nullptr);
                  if (cs) { gClassList.emplace_back(cs); env->ReleaseStringUTFChars(js, cs); }
                  env->DeleteLocalRef(js);
              }
              LOGI("Class list stored: %zu", gClassList.size());
          }

          JNIEXPORT jint JNI_OnLoad(JavaVM* vm, void*) {
              init_log();
              install_crash_handlers();
              log_step("JNI_OnLoad: started");

              JNIEnv* env = nullptr;
              jint r = vm->GetEnv((void**)&env, JNI_VERSION_1_6);
              if (r != JNI_OK || !env) {
                  log_step("JNI_OnLoad: GetEnv failed");
                  return JNI_VERSION_1_6;
              }
              log_step("JNI_OnLoad: env acquired");
              gVM = vm;

              if (!loadDex(env)) {
                  log_step("JNI_OnLoad: loadDex failed, exiting");
                  return JNI_VERSION_1_6;
              }
              log_step("JNI_OnLoad: register natives");
              JNINativeMethod methods[] = {
                  {(char*)"nativeInit",         (char*)"(Landroid/view/Surface;)V", (void*)doInit},
                  {(char*)"nativeResize",       (char*)"(II)V",                    (void*)doResize},
                  {(char*)"nativeRender",       (char*)"()V",                      (void*)doRender},
                  {(char*)"nativeTouch",        (char*)"(IFF)Z",                    (void*)doTouch},
                  {(char*)"nativeSetClassList", (char*)"([Ljava/lang/String;)V",    (void*)doSetClassList},
              };
              if (env->RegisterNatives(gHelperClass, methods, 5) != 0) {
                  env->ExceptionDescribe(); env->ExceptionClear();
                  log_step("JNI_OnLoad: RegisterNatives failed");
                  return JNI_VERSION_1_6;
              }
              log_step("JNI_OnLoad: natives registered");

              pthread_t t;
              if (pthread_create(&t, nullptr, pollThread, nullptr) == 0) {
                  pthread_detach(t);
                  log_step("JNI_OnLoad: poll thread started");
              } else {
                  log_step("JNI_OnLoad: pthread_create failed");
              }
              log_step("JNI_OnLoad: complete");
              return JNI_VERSION_1_6;
          }
          EOF

      - name: Update MainActivity.kt (safe load)
        run: |
          mkdir -p app/src/main/java/com/example/tool
          cat > app/src/main/java/com/example/tool/MainActivity.kt << 'EOF'
          package com.example.tool

          import android.app.Activity
          import android.os.Bundle
          import android.view.Gravity
          import android.widget.TextView

          class MainActivity : Activity() {
              companion object {
                  init {
                      try {
                          System.loadLibrary("tool")
                      } catch (t: Throwable) {
                          try {
                              val f = java.io.File("/sdcard/Download/ImGuiMenu_crash.log")
                              f.parentFile?.mkdirs()
                              f.appendText("\n=== LoadLibrary failed ===\n${t.stackTraceToString()}\n")
                          } catch (_: Throwable) {
                              try {
                                  val f = java.io.File("/sdcard/Android/data/com.example.tool/crash.log")
                                  f.parentFile?.mkdirs()
                                  f.appendText("\n=== LoadLibrary failed ===\n${t.stackTraceToString()}\n")
                              } catch (_: Throwable) {}
                          }
                      }
                  }
              }
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val tv = TextView(this).apply {
                      text = "Test harness\n\nIf you see the ImGui menu, the .so works.\nIf not, check the crash log in Downloads or Android/data/com.example.tool/"
                      textSize = 18f
                      gravity = Gravity.CENTER
                  }
                  setContentView(tv)
              }
          }
          EOF

      - name: Update manifest (WRITE_EXTERNAL_STORAGE)
        run: |
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"
                  android:maxSdkVersion="28" />
              <application
                  android:allowBackup="true"
                  android:label="ImGuiTool"
                  android:requestLegacyExternalStorage="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Regenerate dex_data.h
        run: |
          set -e
          mkdir -p /tmp/dex
          D8=$(find $ANDROID_HOME/build-tools -name d8 | sort -V | tail -1)
          javac -source 8 -target 8 \
                -cp $ANDROID_HOME/platforms/android-34/android.jar \
                -d /tmp/dex app/src/main/java/com/menu/imgui/Helper.java
          $D8 --min-api 26 --output /tmp/dex /tmp/dex/com/menu/imgui/Helper.class
          xxd -i -n imgui_dex /tmp/dex/classes.dex \
            | sed 's/unsigned char/const unsigned char/' \
            > app/src/main/cpp/tool/dex_data.h
          grep -q "imgui_dex\[\]" app/src/main/cpp/tool/dex_data.h && echo "✓ imgui_dex symbol OK"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Ensure Gradle Wrapper
        run: |
          if [ ! -s gradlew ]; then gradle wrapper --gradle-version 8.5; fi
          chmod +x gradlew

      - name: Build
        run: |
          rm -rf app/.cxx app/build .gradle
          ./gradlew :app:assembleDebug --no-build-cache --stacktrace

      - name: Extract artifacts
        run: |
          mkdir -p /tmp/so-out
          find app/build -name "libtool.so" -exec cp {} /tmp/so-out/ \;
          ls -la /tmp/so-out/

      - name: Upload .so
        uses: actions/upload-artifact@v4
        with:
          name: libtool-with-crashlog
          path: /tmp/so-out/libtool.so

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: imgui-tool-test-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Commit
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "feat: crash logging (native + java) [skip ci]"
          git push
