name: Scaffold NDK ImGui Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create directory structure
        run: |
          mkdir -p app/src/main/java/com/example/tool
          mkdir -p app/src/main/cpp/tool
          mkdir -p app/src/main/cpp/imgui

      - name: Download Dear ImGui
        run: |
          git clone --depth 1 https://github.com/ocornut/imgui.git /tmp/imgui
          cp -r /tmp/imgui/* app/src/main/cpp/imgui/
          rm -rf app/src/main/cpp/imgui/examples
          rm -rf app/src/main/cpp/imgui/docs
          rm -rf app/src/main/cpp/imgui/.git
          echo "ImGui files:" && ls app/src/main/cpp/imgui/ | head -20

      - name: Write gradle.properties
        run: |
          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

      - name: Write settings.gradle.kts
        run: |
          cat > settings.gradle.kts << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "ImGuiTool"
          include(":app")
          EOF

      - name: Write root build.gradle.kts
        run: |
          cat > build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application") version "8.2.0" apply false
              id("org.jetbrains.kotlin.android") version "1.9.20" apply false
          }
          EOF

      - name: Write app/build.gradle.kts
        run: |
          cat > app/build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.tool"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.tool"
                  minSdk = 27
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"

                  externalNativeBuild {
                      cmake {
                          cppFlags += "-std=c++17"
                      }
                  }
                  ndk {
                      abiFilters += listOf("arm64-v8a", "armeabi-v7a")
                  }
              }

              externalNativeBuild {
                  cmake {
                      path = file("src/main/cpp/CMakeLists.txt")
                      version = "3.22.1"
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
          }
          EOF

      - name: Write CMakeLists.txt
        run: |
          cat > app/src/main/cpp/CMakeLists.txt << 'EOF'
          cmake_minimum_required(VERSION 3.22.1)
          project("tool")

          set(CMAKE_CXX_STANDARD 17)

          include_directories(
              imgui
              imgui/backends
          )

          add_library(tool SHARED
              tool/native-lib.cpp
              imgui/imgui.cpp
              imgui/imgui_draw.cpp
              imgui/imgui_tables.cpp
              imgui/imgui_widgets.cpp
              imgui/backends/imgui_impl_android.cpp
              imgui/backends/imgui_impl_opengl3.cpp
          )

          target_link_libraries(tool
              android
              log
              EGL
              GLESv3
          )
          EOF

      - name: Write native-lib.cpp (placeholder)
        run: |
          cat > app/src/main/cpp/tool/native-lib.cpp << 'EOF'
          #include <jni.h>
          #include <android/log.h>

          #define LOG_TAG "ImGuiTool"
          #define LOGI(...) __android_log_print(ANDROID_LOG_INFO, LOG_TAG, __VA_ARGS__)

          extern "C" JNIEXPORT void JNICALL
          Java_com_example_tool_MainActivity_init(JNIEnv* env, jobject /* this */) {
              LOGI("ImGuiTool native init called");
              // TODO: create SurfaceView, set up ImGui, attach to WindowManager
          }
          EOF

      - name: Write MainActivity.kt
        run: |
          cat > app/src/main/java/com/example/tool/MainActivity.kt << 'EOF'
          package com.example.tool

          import android.os.Bundle
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {

              companion object {
                  init {
                      System.loadLibrary("tool")
                  }
              }

              external fun init()

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  init()
              }
          }
          EOF

      - name: Write AndroidManifest.xml
        run: |
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:label="ImGuiTool"
                  android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Verify file tree
        run: |
          echo "=== Project files ==="
          find app/src/main -type f | sort
          echo "=== ImGui backends ==="
          ls app/src/main/cpp/imgui/backends/imgui_impl_android.*
          ls app/src/main/cpp/imgui/backends/imgui_impl_opengl3.*

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "chore: scaffold NDK + ImGui project structure [skip ci]"
          git push
