name: IL2CPP-Style Inspector UI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Write Helper.java
        run: |
          cat > app/src/main/java/com/menu/imgui/Helper.java << 'JAVA_EOF'
          package com.menu.imgui;

          import android.app.Activity;
          import android.content.Context;
          import android.os.Handler;
          import android.os.Looper;
          import android.util.Log;
          import android.view.MotionEvent;
          import android.view.ViewGroup;

          import java.io.ByteArrayOutputStream;
          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileWriter;
          import java.io.IOException;
          import java.io.InputStream;
          import java.io.PrintWriter;
          import java.lang.reflect.Array;
          import java.lang.reflect.Constructor;
          import java.lang.reflect.Method;
          import java.nio.charset.StandardCharsets;
          import java.text.SimpleDateFormat;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.Date;
          import java.util.List;
          import java.util.Locale;
          import java.util.zip.ZipEntry;
          import java.util.zip.ZipFile;

          public class Helper {
              private static final String TAG = "ImGuiTool";
              private static OverlaySurfaceView overlay;

              static {
                  try {
                      Thread.setDefaultUncaughtExceptionHandler((t, e) -> {
                          try {
                              File f = new File(getLogDir(), "crash.log");
                              FileWriter w = new FileWriter(f, true);
                              PrintWriter pw = new PrintWriter(w);
                              pw.println("\n=== JAVA CRASH " + now() + " ===");
                              pw.println("Thread: " + t.getName());
                              e.printStackTrace(pw);
                              pw.println("=== END ===");
                              pw.close();
                          } catch (Throwable ignored) { }
                      });
                  } catch (Throwable ignored) { }
              }

              private static String now() {
                  return new SimpleDateFormat("yyyy-MM-dd HH:mm:ss", Locale.US).format(new Date());
              }
              private static String getPkgName() {
                  try (FileInputStream fis = new FileInputStream("/proc/self/cmdline")) {
                      byte[] buf = new byte[256]; int n = fis.read(buf);
                      if (n > 0) {
                          int end = 0; while (end < n && buf[end] != 0) end++;
                          String pkg = new String(buf, 0, end, "UTF-8");
                          int colon = pkg.indexOf(':');
                          return colon > 0 ? pkg.substring(0, colon) : pkg;
                      }
                  } catch (Throwable ignored) { }
                  return "unknown";
              }
              private static String getLogDir() {
                  File d = new File("/sdcard/Download");
                  if (d.exists() && d.canWrite()) return d.getAbsolutePath();
                  File e = new File("/sdcard/Android/data/" + getPkgName());
                  if (e.exists() && e.canWrite()) return e.getAbsolutePath();
                  return "/data/data/" + getPkgName();
              }
              private static void log(String msg) {
                  Log.i(TAG, msg);
                  try {
                      File f = new File(getLogDir(), "crash.log");
                      FileWriter w = new FileWriter(f, true);
                      w.write("[J " + now() + "] " + msg + "\n");
                      w.close();
                  } catch (Throwable ignored) { }
              }

              public static void attach(Context ctx) {
                  if (!(ctx instanceof Activity)) return;
                  final Activity activity = (Activity) ctx;
                  activity.runOnUiThread(() -> {
                      if (overlay != null) return;
                      try {
                          overlay = new OverlaySurfaceView(activity);
                          overlay.setOnTouchListener((v, e) -> {
                              if (!overlay.isReady()) return false;
                              int action;
                              switch (e.getActionMasked()) {
                                  case MotionEvent.ACTION_DOWN:   action = 0; break;
                                  case MotionEvent.ACTION_UP:     action = 1; break;
                                  case MotionEvent.ACTION_MOVE:   action = 2; break;
                                  case MotionEvent.ACTION_CANCEL: action = 3; break;
                                  default: return false;
                              }
                              return nativeTouch(action, e.getX(), e.getY());
                          });
                          ViewGroup decor = (ViewGroup) activity.getWindow().getDecorView();
                          decor.addView(overlay, new ViewGroup.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                          log("overlay attached");
                          new Thread(() -> {
                              try {
                                  List<String> classes = listAllClasses(activity);
                                  nativeSetClassList(classes.toArray(new String[0]));
                              } catch (Throwable t) { log("classLister failed: " + t); }
                          }, "ImGuiClassLister").start();
                      } catch (Throwable t) { log("attach failed: " + t); }
                  });
              }

              private static List<String> listAllClasses(Context ctx) {
                  List<String> out = new ArrayList<>();
                  try (ZipFile zip = new ZipFile(ctx.getPackageCodePath())) {
                      for (ZipEntry entry : Collections.list(zip.entries())) {
                          String n = entry.getName();
                          if (n.equals("classes.dex") || n.matches("classes\\d+\\.dex")) {
                              try (InputStream in = zip.getInputStream(entry)) {
                                  parseDexClasses(readAll(in), out);
                              } catch (IOException ignored) { }
                          }
                      }
                  } catch (Throwable t) { log("listAllClasses error: " + t); }
                  Collections.sort(out);
                  return out;
              }

              private static byte[] readAll(InputStream in) throws IOException {
                  ByteArrayOutputStream o = new ByteArrayOutputStream();
                  byte[] b = new byte[8192]; int n;
                  while ((n = in.read(b)) > 0) o.write(b, 0, n);
                  return o.toByteArray();
              }
              private static int rd16(byte[] d, int off) { return (d[off] & 0xFF) | ((d[off+1] & 0xFF) << 8); }
              private static int rd32(byte[] d, int off) { return (d[off]&0xFF) | ((d[off+1]&0xFF)<<8) | ((d[off+2]&0xFF)<<16) | ((d[off+3]&0xFF)<<24); }
              private static int readUleb128(byte[] d, int[] pos) {
                  int r = 0, s = 0;
                  while (true) { byte b = d[pos[0]++]; r |= (b & 0x7F) << s; if ((b & 0x80) == 0) break; s += 7; }
                  return r;
              }
              private static String readString(byte[] d, int strIdsOff, int strIdx) {
                  if (strIdx < 0) return "";
                  int strDataOff = rd32(d, strIdsOff + strIdx * 4);
                  if (strDataOff <= 0 || strDataOff >= d.length) return "";
                  int p = strDataOff;
                  while (p < d.length && (d[p] & 0x80) != 0) p++;
                  if (p < d.length) p++;
                  int start = p;
                  while (p < d.length && d[p] != 0) p++;
                  return new String(d, start, p - start, StandardCharsets.UTF_8);
              }
              private static String getTypeDesc(byte[] d, int typeIdsOff, int strIdsOff, int typeIdx) {
                  return readString(d, strIdsOff, rd32(d, typeIdsOff + typeIdx * 4));
              }
              private static String prettyType(String desc) {
                  if (desc == null || desc.isEmpty()) return "?";
                  switch (desc.charAt(0)) {
                      case 'V': return "void";   case 'Z': return "boolean";
                      case 'B': return "byte";   case 'S': return "short";
                      case 'C': return "char";   case 'I': return "int";
                      case 'J': return "long";   case 'F': return "float";
                      case 'D': return "double";
                      case 'L': return desc.endsWith(";") ? desc.substring(1, desc.length() - 1).replace('/', '.') : desc;
                      case '[': return prettyType(desc.substring(1)) + "[]";
                      default: return desc;
                  }
              }

              private static void parseDexClasses(byte[] d, List<String> out) {
                  if (d.length < 0x70 || d[0] != 'd' || d[1] != 'e' || d[2] != 'x') return;
                  int strIdsOff = rd32(d, 0x3C); int typeIdsSize = rd32(d, 0x40);
                  int typeIdsOff = rd32(d, 0x44); int classDefSize= rd32(d, 0x60);
                  int classDefOff = rd32(d, 0x64);
                  if (classDefOff + classDefSize * 32 > d.length) return;
                  for (int i = 0; i < classDefSize; i++) {
                      int cd = classDefOff + i * 32; int classIdx = rd32(d, cd);
                      if (classIdx < 0 || classIdx >= typeIdsSize) continue;
                      String desc = getTypeDesc(d, typeIdsOff, strIdsOff, classIdx);
                      if (desc.startsWith("L") && desc.endsWith(";"))
                          out.add(desc.substring(1, desc.length() - 1).replace('/', '.'));
                  }
              }

              public static void requestClassDetails(int sectionId, String className) {
                  new Thread(() -> {
                      String[] fields = new String[0];
                      String[] methods = new String[0];
                      try {
                          ClassMembers m = parseClassMembers(className);
                          fields = m.fields.toArray(new String[0]);
                          methods = m.methods.toArray(new String[0]);
                      } catch (Throwable t) { log("requestClassDetails failed: " + t); }
                      nativeSetClassDetails(sectionId, className, fields, methods);
                  }).start();
              }

              private static class ClassMembers {
                  List<String> fields = new ArrayList<>();
                  List<String> methods = new ArrayList<>();
              }

              private static ClassMembers parseClassMembers(String className) {
                  ClassMembers out = new ClassMembers();
                  String targetDesc = "L" + className.replace('.', '/') + ";";
                  try (ZipFile zip = new ZipFile(getApkPath())) {
                      for (ZipEntry entry : Collections.list(zip.entries())) {
                          String n = entry.getName();
                          if (n.equals("classes.dex") || n.matches("classes\\d+\\.dex")) {
                              try (InputStream in = zip.getInputStream(entry)) {
                                  parseDexMembers(readAll(in), targetDesc, out);
                              } catch (IOException ignored) { }
                          }
                      }
                  } catch (Throwable t) { log("parseClassMembers error: " + t); }
                  return out;
              }

              private static String cachedApkPath = null;
              private static String getApkPath() {
                  if (cachedApkPath != null) return cachedApkPath;
                  try {
                      Class<?> at = Class.forName("android.app.ActivityThread");
                      Object app = at.getMethod("currentApplication").invoke(null);
                      if (app instanceof Context) {
                          cachedApkPath = ((Context) app).getPackageCodePath();
                          if (cachedApkPath != null) return cachedApkPath;
                      }
                  } catch (Throwable ignored) { }
                  return "/system/framework/framework.jar";
              }

              private static void parseDexMembers(byte[] d, String targetDesc, ClassMembers out) {
                  if (d.length < 0x70 || d[0] != 'd' || d[1] != 'e' || d[2] != 'x') return;
                  int strIdsOff=rd32(d,0x3C); int typeIdsSize=rd32(d,0x40); int typeIdsOff=rd32(d,0x44);
                  int protoIdsOff=rd32(d,0x4C); int fieldIdsOff=rd32(d,0x54); int methodIdsOff=rd32(d,0x5C);
                  int classDefSize=rd32(d,0x60); int classDefOff=rd32(d,0x64);
                  if (classDefOff + classDefSize * 32 > d.length) return;

                  for (int i = 0; i < classDefSize; i++) {
                      int cd = classDefOff + i * 32; int classIdx = rd32(d, cd);
                      if (classIdx < 0 || classIdx >= typeIdsSize) continue;
                      if (!targetDesc.equals(getTypeDesc(d, typeIdsOff, strIdsOff, classIdx))) continue;
                      int classDataOff = rd32(d, cd + 24); if (classDataOff == 0) return;

                      int[] pos = { classDataOff };
                      int staticFields=readUleb128(d,pos); int instanceFields=readUleb128(d,pos);
                      int directMethods=readUleb128(d,pos); int virtualMethods=readUleb128(d,pos);

                      int fieldIdx = 0;
                      for (int j = 0; j < staticFields; j++) {
                          int diff = readUleb128(d, pos); readUleb128(d, pos); fieldIdx += diff;
                          out.fields.add("[static] " + getFieldSig(d, fieldIdsOff, typeIdsOff, strIdsOff, fieldIdx));
                      }
                      fieldIdx = 0;
                      for (int j = 0; j < instanceFields; j++) {
                          int diff = readUleb128(d, pos); readUleb128(d, pos); fieldIdx += diff;
                          out.fields.add("[instance] " + getFieldSig(d, fieldIdsOff, typeIdsOff, strIdsOff, fieldIdx));
                      }
                      int methodIdx = 0;
                      for (int j = 0; j < directMethods; j++) {
                          int diff = readUleb128(d, pos); readUleb128(d, pos); readUleb128(d, pos); methodIdx += diff;
                          out.methods.add(getMethodRaw(d, methodIdsOff, protoIdsOff, typeIdsOff, strIdsOff, methodIdx));
                      }
                      methodIdx = 0;
                      for (int j = 0; j < virtualMethods; j++) {
                          int diff = readUleb128(d, pos); readUleb128(d, pos); readUleb128(d, pos); methodIdx += diff;
                          out.methods.add(getMethodRaw(d, methodIdsOff, protoIdsOff, typeIdsOff, strIdsOff, methodIdx));
                      }
                      return;
                  }
              }

              private static String getFieldSig(byte[] d, int fieldIdsOff, int typeIdsOff, int strIdsOff, int fieldIdx) {
                  int fi = fieldIdsOff + fieldIdx * 8;
                  String name = readString(d, strIdsOff, rd32(d, fi + 4));
                  String type = prettyType(getTypeDesc(d, typeIdsOff, strIdsOff, rd16(d, fi + 2)));
                  return type + " " + name;
              }

              private static String getMethodRaw(byte[] d, int methodIdsOff, int protoIdsOff, int typeIdsOff, int strIdsOff, int methodIdx) {
                  int mi = methodIdsOff + methodIdx * 8; int protoIdx = rd16(d, mi + 2);
                  String name = readString(d, strIdsOff, rd32(d, mi + 4));
                  int pi = protoIdsOff + protoIdx * 12;
                  String returnType = prettyType(getTypeDesc(d, typeIdsOff, strIdsOff, rd32(d, pi + 4)));
                  int paramsOff = rd32(d, pi + 8);
                  StringBuilder params = new StringBuilder();
                  if (paramsOff != 0 && paramsOff + 4 <= d.length) {
                      int count = rd32(d, paramsOff);
                      for (int j = 0; j < count; j++) {
                          int off = paramsOff + 4 + j * 2;
                          if (off + 2 > d.length) break;
                          if (j > 0) params.append(";");
                          params.append(prettyType(getTypeDesc(d, typeIdsOff, strIdsOff, rd16(d, off))));
                      }
                  }
                  return name + "|" + returnType + "|" + (name.contains("$") || name.equals("<clinit>") ? "1" : "0") + "|" + ("<init>".equals(name) ? "1" : "0") + "|" + params;
              }

              public static void requestMethodCall(int sectionId, String className, String methodSig, String methodName, String[] paramTypes, String[] args, boolean isStatic, boolean isConstructor, boolean runInMain) {
                  Runnable r = () -> {
                      String result;
                      try {
                          Class<?> cls = Class.forName(className);
                          Class<?>[] paramClasses = new Class<?>[paramTypes.length];
                          for (int i = 0; i < paramTypes.length; i++) paramClasses[i] = classFromString(paramTypes[i]);
                          Object[] argValues = new Object[args.length];
                          for (int i = 0; i < args.length; i++) argValues[i] = parseArg(paramClasses[i], args[i]);

                          Object ret;
                          if (isConstructor) {
                              Constructor<?> c = cls.getDeclaredConstructor(paramClasses);
                              c.setAccessible(true);
                              ret = c.newInstance(argValues);
                              result = "Created: " + (ret == null ? "null" : ret.toString());
                          } else if (isStatic) {
                              Method m = cls.getDeclaredMethod(methodName, paramClasses);
                              m.setAccessible(true);
                              ret = m.invoke(null, argValues);
                              result = "Returned: " + (ret == null ? "null" : ret.toString());
                          } else {
                              Method m = cls.getDeclaredMethod(methodName, paramClasses);
                              m.setAccessible(true);
                              Object instance = tryCreateInstance(cls);
                              if (instance == null) result = "Error: Cannot create instance";
                              else {
                                  ret = m.invoke(instance, argValues);
                                  result = "Returned: " + (ret == null ? "null" : ret.toString());
                              }
                          }
                      } catch (Throwable t) { result = "Error: " + t; }
                      nativeSetMethodResult(sectionId, className, methodSig, result);
                  };
                  if (runInMain) new Handler(Looper.getMainLooper()).post(r);
                  else new Thread(r).start();
              }

              private static Object tryCreateInstance(Class<?> cls) {
                  try {
                      Constructor<?> c = cls.getDeclaredConstructor();
                      c.setAccessible(true);
                      return c.newInstance();
                  } catch (Throwable t) { return null; }
              }
              private static Class<?> classFromString(String s) throws ClassNotFoundException {
                  switch (s) {
                      case "int": return int.class;     case "long": return long.class;
                      case "short": return short.class; case "byte": return byte.class;
                      case "char": return char.class;   case "boolean": return boolean.class;
                      case "float": return float.class; case "double": return double.class;
                      case "void": return void.class;
                  }
                  if (s.endsWith("[]")) return Array.newInstance(classFromString(s.substring(0, s.length() - 2)), 0).getClass();
                  return Class.forName(s);
              }
              private static Object parseArg(Class<?> type, String s) {
                  String t = s == null ? "" : s.trim();
                  if (type == int.class) return Integer.parseInt(t);
                  if (type == long.class) return Long.parseLong(t);
                  if (type == short.class) return Short.parseShort(t);
                  if (type == byte.class) return Byte.parseByte(t);
                  if (type == char.class) return t.isEmpty() ? '\0' : t.charAt(0);
                  if (type == boolean.class) return Boolean.parseBoolean(t);
                  if (type == float.class) return Float.parseFloat(t);
                  if (type == double.class) return Double.parseDouble(t);
                  if (type == String.class) return t;
                  return null;
              }

              static native void nativeInit(android.view.Surface s);
              static native void nativeResize(int w, int h);
              static native void nativeRender();
              static native boolean nativeTouch(int action, float x, float y);
              static native void nativeSetClassList(String[] classNames);
              static native boolean nativeWantKeyboard();
              static native void nativeAddInputChar(int codepoint);
              static native void nativeAddKeyEvent(int keycode, boolean down);
              static native void nativeSetClassDetails(int sectionId, String className, String[] fields, String[] methods);
              static native void nativeSetMethodResult(int sectionId, String className, String methodSig, String result);
          }
          JAVA_EOF

      - name: Write native-lib.cpp
        run: |
          cat > app/src/main/cpp/tool/native-lib.cpp << 'CPP_EOF'
          #include <jni.h>
          #include <android/log.h>
          #include <android/native_window_jni.h>
          #include "imgui.h"
          #include "imgui_impl_android.h"
          #include "imgui_impl_opengl3.h"
          #include <GLES3/gl3.h>
          #include "dex_data.h"
          #include <pthread.h>
          #include <unistd.h>
          #include <signal.h>
          #include <fcntl.h>
          #include <sys/stat.h>
          #include <cstring>
          #include <cstdio>
          #include <cmath>
          #include <string>
          #include <vector>
          #include <map>
          #include <set>
          #include <mutex>
          #include <algorithm>

          #ifndef MY_PI
          #define MY_PI 3.14159265358979323846f
          #endif
          #define LOG_TAG "ImGuiTool"
          #define LOGI(...) __android_log_print(ANDROID_LOG_INFO, LOG_TAG, __VA_ARGS__)

          static JavaVM* gVM = nullptr;
          static jclass gHelperClass = nullptr;
          static ANativeWindow* gWindow = nullptr;
          static bool gInitialized = false;
          static int gWidth = 0, gHeight = 0;
          static int g_log_fd = -1;

          static std::vector<std::string> gClassList;
          static std::mutex gClassListMutex;

          struct MethodInfo {
              std::string raw, name, returnType, display;
              bool isStatic, isConstructor;
              std::vector<std::string> paramTypes;
          };
          struct MethodCallState {
              char argBufs[8][256] = {};
              int numParams = 0;
              std::string result;
              bool hasResult = false;
              bool calling = false;
              bool runInMain = false;
          };
          struct ClassDetail {
              bool loading = false;
              std::vector<std::string> fields;
              std::vector<MethodInfo> methods;
              std::map<std::string, MethodCallState> methodStates;
              std::set<std::string> expandedMethods;
          };
          struct Section {
              int id = 0;
              char filter[128] = {0};
              bool detached = false;
              float detX = 100, detY = 100, detW = 550, detH = 550;
              double detachTime = 0;
              std::map<std::string, ClassDetail> details;
              std::set<std::string> expandedClasses;
          };

          static std::vector<Section> gSections;
          static int gNextSectionId = 1;
          static int gActiveSection = 0;
          static bool gRequestAddSection = false;
          static std::vector<int> gPendingCloseSections;

          static int gPressedTabId = -1;
          static double gPressedTabStart = 0;
          static std::string gPressedClassName;
          static int gPressedClassSectionId = -1;
          static double gPressedClassStart = 0;
          static bool gClassLongPressed = false;

          static float gTabBarX = 0, gTabBarY = 0;
          static float gWinX = 0, gWinY = 0, gWinW = 0, gWinH = 0;

          struct PendingDetailReq { int sectionId; std::string className; };
          struct PendingCallReq { int sectionId; std::string className; std::string methodSig; std::string methodName; std::vector<std::string> paramTypes; std::vector<std::string> args; bool isStatic; bool isConstructor; bool runInMain; };
          struct DetailResult { int sectionId; std::string className; std::vector<std::string> fields; std::vector<std::string> methodRaws; };
          struct MethodResult { int sectionId; std::string className; std::string methodSig; std::string result; };

          static std::vector<PendingDetailReq> gPendingDetailReqs;
          static std::vector<PendingCallReq> gPendingCallReqs;
          static std::vector<DetailResult> gDetailResults;
          static std::vector<MethodResult> gMethodResults;
          static std::mutex gQueuesMutex;

          static float g_settingFontScale = 1.00f;
          static float g_settingDragSpeed = 0.55f;
          static float g_settingScrollSpeed = 1.40f;

          static bool g_menuVisible = true;
          static float g_fabSize = 58.0f;
          static float g_fabX = -1.0f, g_fabY = -1.0f;
          static bool g_fabDown = false, g_fabMoved = false;
          static float g_fabDownAtX = 0, g_fabDownAtY = 0;
          static float g_fabDragStartX = 0, g_fabDragStartY = 0;
          static float g_virtX = 0, g_virtY = 0;
          static float g_realPrevX = 0, g_realPrevY = 0;
          static float g_titleH = 30.0f;
          static bool g_firstFrame = false;

          static void splitStr(const std::string& s, char d, std::vector<std::string>& out) {
              out.clear(); size_t start = 0;
              for (size_t i = 0; i <= s.size(); i++) {
                  if (i == s.size() || s[i] == d) { out.push_back(s.substr(start, i - start)); start = i + 1; }
              }
          }
          static std::string joinStrs(const std::vector<std::string>& v, const char* sep) {
              std::string out;
              for (size_t i = 0; i < v.size(); i++) { if (i) out += sep; out += v[i]; }
              return out;
          }
          static MethodInfo parseMethodRaw(const std::string& raw) {
              MethodInfo m; m.raw = raw;
              std::vector<std::string> p; splitStr(raw, '|', p);
              if (p.size() >= 5) {
                  m.name = p[0]; m.returnType = p[1];
                  m.isStatic = (p[2] == "1"); m.isConstructor = (p[3] == "1");
                  if (!p[4].empty()) splitStr(p[4], ';', m.paramTypes);
              }
              m.display = m.isConstructor ? "<init>(" + joinStrs(m.paramTypes, ", ") + ")" : m.returnType + " " + m.name + "(" + joinStrs(m.paramTypes, ", ") + ")";
              return m;
          }
          static Section* findSection(int id) {
              for (auto& s : gSections) if (s.id == id) return &s;
              return nullptr;
          }
          static void addSectionImpl() {
              Section s; s.id = gNextSectionId++; gSections.push_back(std::move(s)); gActiveSection = gSections.back().id;
          }
          static void closeSectionImpl(int id) {
              gSections.erase(std::remove_if(gSections.begin(), gSections.end(), [id](const Section& s) { return s.id == id; }), gSections.end());
              if (gActiveSection == id) { gActiveSection = 0; for (auto& s : gSections) if (!s.detached) { gActiveSection = s.id; break; } }
          }
          static void requestClassDetails(int sectionId, const std::string& className) {
              std::lock_guard<std::mutex> lk(gQueuesMutex);
              gPendingDetailReqs.push_back({sectionId, className});
          }

          static void get_pkg_name(char* out, size_t outsz) {
              out[0] = 0; FILE* f = fopen("/proc/self/cmdline", "r"); if (!f) return;
              char buf[256] = {0}; size_t n = fread(buf, 1, sizeof(buf) - 1, f); fclose(f);
              if (n == 0) return; for (size_t i = 0; i < n; i++) if (buf[i] == 0 || buf[i] == ':') { buf[i] = 0; break; }
              strncpy(out, buf, outsz - 1); out[outsz - 1] = 0;
          }
          static int try_open(const char* path) { return open(path, O_WRONLY | O_CREAT | O_APPEND | O_SYNC, 0666); }
          static void init_log() {
              int fd = try_open("/sdcard/Download/ImGuiMenu_crash.log"); if (fd >= 0) { g_log_fd = fd; return; }
              char pkg[256]; get_pkg_name(pkg, sizeof(pkg));
              if (pkg[0]) {
                  char p1[512], p2[512];
                  snprintf(p1, sizeof(p1), "/sdcard/Android/data/%s", pkg); mkdir(p1, 0770);
                  snprintf(p2, sizeof(p2), "/sdcard/Android/data/%s/crash.log", pkg);
                  fd = try_open(p2); if (fd >= 0) { g_log_fd = fd; return; }
              }
          }

          static void drawSigil(ImDrawList* dl, ImVec2 c, float r) {
              const ImU32 gold = IM_COL32(255, 200, 87, 255); const ImU32 cyan = IM_COL32(77, 208, 225, 220);
              const ImU32 dark = IM_COL32(10, 12, 16, 255); const ImU32 red  = IM_COL32(255, 80, 80, 210);
              for (int i = 5; i >= 1; i--) dl->AddCircle(c, r + i * 1.5f, IM_COL32(255, 200, 87, 10), 32, 1.0f);
              ImVec2 top(c.x, c.y - r), right(c.x + r, c.y), bot(c.x, c.y + r), left(c.x - r, c.y);
              dl->AddQuad(top, right, bot, left, gold, 2.0f);
              float r2 = r * 0.75f; ImVec2 hex[6];
              for (int i = 0; i < 6; i++) { float a = MY_PI * 2.0f * i / 6.0f + MY_PI * 0.5f; hex[i] = ImVec2(c.x + cosf(a) * r2, c.y + sinf(a) * r2); }
              for (int i = 0; i < 6; i++) dl->AddLine(hex[i], hex[(i+1)%6], cyan, 1.3f);
              float eyeW = r * 0.45f, eyeH = r * 0.22f; ImVec2 pts[13];
              for (int i = 0; i <= 12; i++) { float t = i/12.0f, a = MY_PI * t; pts[i] = ImVec2(c.x - eyeW * cosf(a), c.y - eyeH * sinf(a)); }
              dl->AddPolyline(pts, 13, gold, 0, 1.8f);
              for (int i = 0; i <= 12; i++) { float t = i/12.0f, a = MY_PI * t; pts[i] = ImVec2(c.x - eyeW * cosf(a), c.y + eyeH * sinf(a)); }
              dl->AddPolyline(pts, 13, gold, 0, 1.8f);
              dl->AddCircleFilled(c, eyeH * 0.85f, cyan, 24); dl->AddCircleFilled(c, eyeH * 0.42f, dark, 16);
              float rr = r * 0.085f; ImVec2 rune[4] = { ImVec2(c.x, c.y - r*0.85f), ImVec2(c.x + r*0.85f, c.y), ImVec2(c.x, c.y + r*0.85f), ImVec2(c.x - r*0.85f, c.y) };
              for (auto& p : rune) { ImVec2 a(p.x, p.y-rr), b(p.x+rr, p.y), d(p.x, p.y+rr), e(p.x-rr, p.y); dl->AddQuadFilled(a, b, d, e, red); }
          }

          static bool loadDex(JNIEnv* env) {
              jclass clCls = env->FindClass("java/lang/ClassLoader"); if (!clCls) return false;
              jmethodID getSys = env->GetStaticMethodID(clCls, "getSystemClassLoader", "()Ljava/lang/ClassLoader;");
              jobject parent = env->CallStaticObjectMethod(clCls, getSys);
              jclass imCls = env->FindClass("dalvik/system/InMemoryDexClassLoader"); if (!imCls) return false;
              jmethodID ctor = env->GetMethodID(imCls, "<init>", "(Ljava/nio/ByteBuffer;Ljava/lang/ClassLoader;)V");
              jobject buf = env->NewDirectByteBuffer((void*)imgui_dex, imgui_dex_len);
              jobject loader = env->NewObject(imCls, ctor, buf, parent);
              if (env->ExceptionCheck()) { env->ExceptionClear(); return false; }
              if (!loader) return false;
              jclass lCls = env->GetObjectClass(loader);
              jmethodID loadM = env->GetMethodID(lCls, "loadClass", "(Ljava/lang/String;)Ljava/lang/Class;");
              jstring name = env->NewStringUTF("com.menu.imgui.Helper");
              jclass hCls = (jclass)env->CallObjectMethod(loader, loadM, name);
              if (env->ExceptionCheck()) { env->ExceptionClear(); return false; }
              if (!hCls) return false; gHelperClass = (jclass)env->NewGlobalRef(hCls); return true;
          }

          static jobject getCurrentActivity(JNIEnv* env) {
              jclass atCls = env->FindClass("android/app/ActivityThread"); if (!atCls) { env->ExceptionClear(); return nullptr; }
              jmethodID cur = env->GetStaticMethodID(atCls, "currentActivityThread", "()Landroid/app/ActivityThread;");
              if (env->ExceptionCheck() || !cur) { env->ExceptionClear(); return nullptr; }
              jobject at = env->CallStaticObjectMethod(atCls, cur);
              if (env->ExceptionCheck() || !at) { env->ExceptionClear(); return nullptr; }
              jfieldID f = env->GetFieldID(atCls, "mActivities", "Landroid/util/ArrayMap;");
              if (env->ExceptionCheck() || !f) { env->ExceptionClear(); return nullptr; }
              jobject acts = env->GetObjectField(at, f);
              jclass amCls = env->FindClass("android/util/ArrayMap");
              jmethodID sizeM = env->GetMethodID(amCls, "size", "()I");
              jmethodID valAt = env->GetMethodID(amCls, "valueAt", "(I)Ljava/lang/Object;");
              jint n = env->CallIntMethod(acts, sizeM);
              for (jint i = 0; i < n; i++) {
                  jobject rec = env->CallObjectMethod(acts, valAt, i); if (!rec) continue;
                  jclass rCls = env->GetObjectClass(rec);
                  jfieldID actF = env->GetFieldID(rCls, "activity", "Landroid/app/Activity;");
                  if (!actF) { env->ExceptionClear(); continue; }
                  jobject a = env->GetObjectField(rec, actF); if (a) return a;
              }
              return nullptr;
          }

          static void* pollThread(void*) {
              JNIEnv* env = nullptr;
              if (gVM->AttachCurrentThread(&env, nullptr) != JNI_OK || !env) return nullptr;
              jobject activity = nullptr;
              for (int i = 0; i < 200; i++) { activity = getCurrentActivity(env); if (activity) break; usleep(100000); }
              if (!activity || !gHelperClass) { gVM->DetachCurrentThread(); return nullptr; }
              jmethodID attach = env->GetStaticMethodID(gHelperClass, "attach", "(Landroid/content/Context;)V");
              if (attach) env->CallStaticVoidMethod(gHelperClass, attach, activity);
              if (env->ExceptionCheck()) env->ExceptionClear();
              gVM->DetachCurrentThread(); return nullptr;
          }

