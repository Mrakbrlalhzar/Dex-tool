name: Fix Compile (IM_PI + Tab Colors)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch native-lib.cpp
        run: |
          set -e
          F=app/src/main/cpp/tool/native-lib.cpp

          echo "=== Before ==="
          grep -n "IM_PI\|ImGuiCol_TabActive\|ImGuiCol_TabUnfocused" "$F" || true

          # 1) Define local PI constant right after the includes
          #    (IM_PI lives in imgui_internal.h, which we don't want to pull in)
          if ! grep -q "MY_PI" "$F"; then
            awk '
              /^#include "dex_data.h"/ && !done {
                print
                print ""
                print "#ifndef MY_PI"
                print "#define MY_PI 3.14159265358979323846f"
                print "#endif"
                done = 1
                next
              }
              { print }
            ' "$F" > "$F.tmp" && mv "$F.tmp" "$F"
          fi

          # 2) Replace IM_PI usages with MY_PI
          sed -i 's/\bIM_PI\b/MY_PI/g' "$F"

          # 3) Remove the outdated ImGuiCol_Tab* lines (they were renamed upstream)
          sed -i '/c\[ImGuiCol_TabActive\]/d'            "$F"
          sed -i '/c\[ImGuiCol_TabUnfocusedActive\]/d'   "$F"
          sed -i '/c\[ImGuiCol_TabUnfocused\]/d'         "$F"

          echo "=== After ==="
          grep -n "MY_PI\|ImGuiCol_Tab" "$F" || true

          # Safety checks
          if grep -q "IM_PI" "$F"; then
            echo "FATAL: IM_PI still present"; exit 1
          fi
          if grep -q "ImGuiCol_TabActive\|ImGuiCol_TabUnfocused" "$F"; then
            echo "FATAL: old tab colors still present"; exit 1
          fi
          echo "✓ all fixes applied"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Ensure Gradle Wrapper
        run: |
          if [ ! -s gradlew ]; then gradle wrapper --gradle-version 8.5; fi
          chmod +x gradlew

      - name: Build
        run: |
          rm -rf app/.cxx app/build .gradle
          ./gradlew :app:assembleDebug --no-build-cache --stacktrace

      - name: Extract libtool.so
        run: |
          mkdir -p /tmp/so-out
          find app/build -name "libtool.so" -exec cp {} /tmp/so-out/ \;
          ls -la /tmp/so-out/

      - name: Upload .so
        uses: actions/upload-artifact@v4
        with:
          name: libtool-dextool-full
          path: /tmp/so-out/libtool.so

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: imgui-tool-test-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Commit fix
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "fix: IM_PI to MY_PI + remove renamed tab colors [skip ci]"
          git push
